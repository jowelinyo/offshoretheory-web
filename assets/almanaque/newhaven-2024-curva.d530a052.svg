<text x="973.8" y="240.0" font-family="Arial" font-size="14" fill="#E03127" font-weight="bold" text-anchor="middle">+2 h from high water</text>
<text x="130.0" y="1244.0" font-family="Arial" font-size="20" fill="#2F4A5A" font-weight="bold">NORMAL CURVE, HUNG FROM HIGH WATER</text>
<text x="130.0" y="1270.0" font-family="Arial" font-size="15" fill="#1A1A1A">Hours are counted from high water, and the factor is still 0 at low water and 1 at high water.</text>
<text x="130.0" y="1300.0" font-family="Arial" font-size="15" fill="#1A1A1A">1 · Mark the height of high water on the top scale and that of low water on the bottom one, and join them with a straight line.</text>
<text x="130.0" y="1326.0" font-family="Arial" font-size="15" fill="#1A1A1A">     If the day's two low waters differ, use the one on the SIDE of the curve you are entering.</text>
<text x="130.0" y="1352.0" font-family="Arial" font-size="15" fill="#1A1A1A">2 · For the HEIGHT at a time: go in at the time on the curve, across to the straight line, and down to the scale.</text>
<text x="130.0" y="1378.0" font-family="Arial" font-size="15" fill="#1A1A1A">3 · For the TIME at a height: the other way round, from the scale to the line, from the line to the curve and from the curve to the time.</text>
<text x="130.0" y="1404.0" font-family="Arial" font-size="15" fill="#1A1A1A">4 · Interpolate between the two curves by the day's range: solid for springs, dashed for neaps, with their ranges written below.</text>
<text x="130.0" y="1446.0" font-family="Arial" font-size="17" fill="#2F4A5A" font-weight="bold">WHAT THESE TWO CURVES SAY, MEASURED FROM 2024</text>
<text x="130.0" y="1472.0" font-family="Arial" font-size="15" fill="#1A1A1A">springs  mean HW 6.87 m · mean LW 0.80 m · range 6.08 m · average of 142 tides</text>
<text x="130.0" y="1496.0" font-family="Arial" font-size="15" fill="#1A1A1A">neaps    mean HW 5.22 m · mean LW 2.24 m · range 2.98 m · average of 142 tides</text>
<text x="130.0" y="1532.0" font-family="Arial" font-size="17" fill="#2F4A5A" font-weight="bold">WHAT IT COSTS TO READ IT</text>
<text x="130.0" y="1558.0" font-family="Arial" font-size="15" fill="#1A1A1A">Measured over the 706 tides of the year, at thirteen hours of each: 3.3 cm on average and 6.9 cm at the worst hour.</text>
<line x1="60.0" y1="1642.0" x2="1180.0" y2="1642.0" stroke="#2F4A5A" stroke-width="1.0" opacity="0.35"/>
<text x="60.0" y="1662.0" font-family="Arial" font-size="12" fill="#6B8290">Curve worked out from the harmonic constants of NEWHAVEN · Sussex, the same ones the daily tables are made from and the checker marks with.</text>
<text x="60.0" y="1678.0" font-family="Arial" font-size="12" fill="#6B8290">Springs and neaps are split by range: the largest 20 % and the smallest 20 % of the year's tides, the same split that gives this port its columns and levels on the secondary ports page.</text>
<text x="60.0" y="1694.0" font-family="Arial" font-size="12" fill="#6B8290">Each branch is normalised with the tide on ITS side, and between the two curves you interpolate by the day's range.</text>
<text x="60.0" y="1710.0" font-family="Arial" font-size="12" fill="#6B8290">Heights in metres above chart datum. Mean level 3.71 m. Not for navigation.</text>
</svg>