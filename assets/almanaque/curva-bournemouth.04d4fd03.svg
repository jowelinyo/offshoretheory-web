<text x="271.3" y="846.0" font-family="Arial" font-size="16" fill="#E03127" font-weight="bold" text-anchor="middle">1.97 m</text>
<text x="130.0" y="884.0" font-family="Arial" font-size="20" fill="#2F4A5A" font-weight="bold">SPECIAL CURVE, REFERRED TO LOW WATER</text>
<text x="130.0" y="912.0" font-family="Arial" font-size="14" fill="#1A1A1A">In the Solent high water is a stand of hours and its time says little; low water is sharp. So the curve hangs from LOW WATER.</text>
<text x="130.0" y="936.0" font-family="Arial" font-size="14" fill="#1A1A1A">1 · LW at your port = LW Portsmouth + the LW difference below; HW and LW heights = Portsmouth's + the height differences.</text>
<text x="130.0" y="960.0" font-family="Arial" font-size="14" fill="#1A1A1A">2 · Mark the HW height on the top scale and the LW height on the bottom one, and join them with a straight line.</text>
<text x="130.0" y="984.0" font-family="Arial" font-size="14" fill="#1A1A1A">3 · Enter the curve with the hours from LW at your port, across to the line, and down to the scale: that is the height.</text>
<text x="130.0" y="1008.0" font-family="Arial" font-size="14" fill="#1A1A1A">4 · Interpolate each difference as on the secondary ports page: the time by the time of LW Portsmouth, the heights by Portsmouth's heights.</text>
<text x="130.0" y="1042.0" font-family="Arial" font-size="14" fill="#E03127" font-weight="bold">WORKED EXAMPLE, IN RED: Bournemouth, 19 September 2024. LW 16:20 UTC, 0.2 m; HW 2.2 m. At 19:20 UTC, +3.0 h from LW: 1.97 m.</text>
<text x="130.0" y="1068.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">WHAT IT COSTS TO READ, MEASURED: 8.3 cm on average and 10.7 cm at the worst hour, over the 682 low waters of 2024, against the Bournemouth water.</text>
