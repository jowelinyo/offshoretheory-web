<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
<rect x="0.0" y="0.0" width="1240.0" height="1754.0" fill="#FFFFFF"/>
<rect x="0.0" y="0.0" width="1240.0" height="104.0" fill="#D4E7F2"/>
<line x1="0.0" y1="104.0" x2="1240.0" y2="104.0" stroke="#2F4A5A" stroke-width="3.0"/>
<text x="60.0" y="58.0" font-family="Arial" font-size="30" fill="#2F4A5A" font-weight="bold">PORT ENTRY · WHAT IS CHECKED ON ARRIVAL</text>
<text x="1180.0" y="58.0" font-family="Arial" font-size="24" fill="#2F4A5A" font-weight="bold" text-anchor="end">8 of 9</text>
<text x="1180.0" y="86.0" font-family="Arial" font-size="14" fill="#6B8290" text-anchor="end">the ports of the course list · heights in metres above chart datum · HW is the port's own high water</text>
<text x="60.0" y="176.0" font-family="Arial" font-size="16" fill="#2F4A5A" font-weight="bold">Courseulles-sur-Mer</text>
<text x="60.0" y="198.0" font-family="Arial" font-size="12" fill="#6B8290">49°20.0′N 00°27.8′W</text>
<text x="60.0" y="220.0" font-family="Arial" font-size="11" fill="#6B8290">portsducalvados.fr, 2026-09-26</text>
<text x="360.0" y="176.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">The port requires:</text>
<text x="360.0" y="198.0" font-family="Arial" font-size="14" fill="#1A1A1A">· VHF ch 9 harbour office · ch 16 emergencies.</text>
<text x="360.0" y="220.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Visitors' berths are behind the lock or the sill.</text>
<text x="360.0" y="242.0" font-family="Arial" font-size="14" fill="#1A1A1A">· The harbour dries.</text>
<text x="360.0" y="264.0" font-family="Arial" font-size="14" fill="#1A1A1A">· There is a bridge.</text>
<text x="360.0" y="286.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">Not found in an official source — ask the harbour:</text>
<text x="360.0" y="308.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Whether you must call before entering is not stated.</text>
<text x="360.0" y="330.0" font-family="Arial" font-size="14" fill="#1A1A1A">· No official source gives the tide you need to enter.</text>
<text x="360.0" y="352.0" font-family="Arial" font-size="14" fill="#1A1A1A">· The lock timetable is published as a calendar we do not hold: read it before you go.</text>
<text x="360.0" y="374.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Its timetable is not published in a form that can be checked.</text>
<text x="360.0" y="396.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">What the course checks:</text>
<text x="360.0" y="418.0" font-family="Arial" font-size="14" fill="#1A1A1A">· No lock, bridge, sill or drying limit that can be checked: nothing is checked on arrival.</text>
<text x="360.0" y="440.0" font-family="Arial" font-size="14" fill="#1A1A1A">· The radio is not checked.</text>
<line x1="60.0" y1="474.0" x2="1180.0" y2="474.0" stroke="#2F4A5A" stroke-width="0.6" opacity="0.25"/>
<text x="60.0" y="496.0" font-family="Arial" font-size="16" fill="#2F4A5A" font-weight="bold">Port-en-Bessin</text>
<text x="60.0" y="518.0" font-family="Arial" font-size="12" fill="#6B8290">49°20.9′N 00°45.3′W</text>
<text x="60.0" y="540.0" font-family="Arial" font-size="11" fill="#6B8290">portsducalvados.fr, 2026-09-26</text>
<text x="360.0" y="496.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">The port requires:</text>
<text x="360.0" y="518.0" font-family="Arial" font-size="14" fill="#1A1A1A">· VHF ch 18 the lock · ch 16 alerts.</text>
<text x="360.0" y="540.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Visitors' berths are behind the lock or the sill.</text>
<text x="360.0" y="562.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">Not found in an official source — ask the harbour:</text>
<text x="360.0" y="584.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Whether you must call before entering is not stated.</text>
<text x="360.0" y="606.0" font-family="Arial" font-size="14" fill="#1A1A1A">· The lock timetable is published as a calendar we do not hold: read it before you go.</text>
<text x="360.0" y="628.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">What the course checks:</text>
<text x="360.0" y="650.0" font-family="Arial" font-size="14" fill="#1A1A1A">· No lock, bridge, sill or drying limit that can be checked: nothing is checked on arrival.</text>
<text x="360.0" y="672.0" font-family="Arial" font-size="14" fill="#1A1A1A">· The radio is not checked.</text>
<line x1="60.0" y1="706.0" x2="1180.0" y2="706.0" stroke="#2F4A5A" stroke-width="0.6" opacity="0.25"/>
<text x="60.0" y="728.0" font-family="Arial" font-size="16" fill="#2F4A5A" font-weight="bold">Grandcamp</text>
<text x="60.0" y="750.0" font-family="Arial" font-size="12" fill="#6B8290">49°23.3′N 01°02.8′W</text>
<text x="60.0" y="772.0" font-family="Arial" font-size="11" fill="#6B8290">portsducalvados.fr, 2026-09-26</text>
<text x="360.0" y="728.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">The port requires:</text>
<text x="360.0" y="750.0" font-family="Arial" font-size="14" fill="#1A1A1A">· VHF ch 9 the harbour.</text>
<text x="360.0" y="772.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Visitors' berths are behind the lock or the sill.</text>
<text x="360.0" y="794.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">Not found in an official source — ask the harbour:</text>
<text x="360.0" y="816.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Whether you must call before entering is not stated.</text>
<text x="360.0" y="838.0" font-family="Arial" font-size="14" fill="#1A1A1A">· The lock timetable is published as a calendar we do not hold: read it before you go.</text>
<text x="360.0" y="860.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">What the course checks:</text>
<text x="360.0" y="882.0" font-family="Arial" font-size="14" fill="#1A1A1A">· No lock, bridge, sill or drying limit that can be checked: nothing is checked on arrival.</text>
<text x="360.0" y="904.0" font-family="Arial" font-size="14" fill="#1A1A1A">· The radio is not checked.</text>
<line x1="60.0" y1="938.0" x2="1180.0" y2="938.0" stroke="#2F4A5A" stroke-width="0.6" opacity="0.25"/>
<text x="60.0" y="960.0" font-family="Arial" font-size="16" fill="#2F4A5A" font-weight="bold">Carentan</text>
<text x="60.0" y="982.0" font-family="Arial" font-size="12" fill="#6B8290">49°18.6′N 01°14.2′W</text>
<text x="60.0" y="1004.0" font-family="Arial" font-size="11" fill="#6B8290">ccbdc.fr, 2026-09-26</text>
<text x="360.0" y="960.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">The port requires:</text>
<text x="360.0" y="982.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Visitors' berths are behind the lock or the sill.</text>
<text x="360.0" y="1004.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Lock open from 2 h before HW to 3 h after HW.</text>
<text x="360.0" y="1026.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">Not found in an official source — ask the harbour:</text>
<text x="360.0" y="1048.0" font-family="Arial" font-size="14" fill="#1A1A1A">· No official VHF channel found.</text>
<text x="360.0" y="1070.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">What the course checks:</text>
<text x="360.0" y="1092.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Your arrival against the lock window: outside it, the plan fails unless it waits for the next opening.</text>
<text x="360.0" y="1114.0" font-family="Arial" font-size="14" fill="#1A1A1A">· The radio is not checked.</text>
<line x1="60.0" y1="1148.0" x2="1180.0" y2="1148.0" stroke="#2F4A5A" stroke-width="0.6" opacity="0.25"/>
<text x="60.0" y="1170.0" font-family="Arial" font-size="16" fill="#2F4A5A" font-weight="bold">Saint-Vaast-la-Hougue</text>
<text x="60.0" y="1192.0" font-family="Arial" font-size="12" fill="#6B8290">49°35.2′N 01°15.7′W</text>
<text x="60.0" y="1214.0" font-family="Arial" font-size="11" fill="#6B8290">ports-manche.com, 2026-09-26</text>
<text x="360.0" y="1170.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">The port requires:</text>
<text x="360.0" y="1192.0" font-family="Arial" font-size="14" fill="#1A1A1A">· VHF ch 9 the harbour.</text>
<text x="360.0" y="1214.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Visitors' berths are behind the lock or the sill.</text>
<text x="360.0" y="1236.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Lock open from 2 h 15 min before HW to 3 h after HW, published ONLY for a coefficient below 50; at 50 or</text>
<text x="374.0" y="1258.0" font-family="Arial" font-size="14" fill="#1A1A1A">more no window is published.</text>
<text x="360.0" y="1280.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">Not found in an official source — ask the harbour:</text>
<text x="360.0" y="1302.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Whether you must call before entering is not stated.</text>
<text x="360.0" y="1324.0" font-family="Arial" font-size="14" fill="#1A1A1A">· At a coefficient of 50 or more: that day's gate times.</text>
<text x="360.0" y="1346.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">What the course checks:</text>
<text x="360.0" y="1368.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Your arrival against the lock window: outside it, the plan fails unless it waits for the next opening.</text>
<text x="360.0" y="1390.0" font-family="Arial" font-size="14" fill="#1A1A1A">· The radio is not checked.</text>
<line x1="60.0" y1="1424.0" x2="1180.0" y2="1424.0" stroke="#2F4A5A" stroke-width="0.6" opacity="0.25"/>
<line x1="60.0" y1="1632.0" x2="1180.0" y2="1632.0" stroke="#2F4A5A" stroke-width="1.0" opacity="0.35"/>
<text x="60.0" y="1654.0" font-family="Arial" font-size="12" fill="#6B8290">HOW TO USE: find your port of arrival; each line is a rule the course checker holds you to when you get there, with its figure. Nothing else is checked.</text>
<text x="60.0" y="1670.0" font-family="Arial" font-size="12" fill="#6B8290">HW is the high water of that port as you work it out from the tide pages: its own table if it is a standard port, the secondary differences if not.</text>
<text x="60.0" y="1686.0" font-family="Arial" font-size="12" fill="#6B8290">A LOCK OR BRIDGE SHUT when you arrive: say in your plan where you wait and until when; the checker accepts a wait that ends at the next published opening.</text>
<text x="60.0" y="1702.0" font-family="Arial" font-size="12" fill="#6B8290">«Not checked»: the rule exists but no official source gives a figure we can hold you to. It is not a green light: read the harbour's own notice before you go.</text>
<text x="60.0" y="1718.0" font-family="Arial" font-size="12" fill="#6B8290">Every rule comes from the harbour's official page, consulted on the date shown under its name. Not for navigation.</text>
</svg>