<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
<rect x="0.0" y="0.0" width="1240.0" height="1754.0" fill="#FFFFFF"/>
<rect x="0.0" y="0.0" width="1240.0" height="104.0" fill="#D4E7F2"/>
<line x1="0.0" y1="104.0" x2="1240.0" y2="104.0" stroke="#2F4A5A" stroke-width="3.0"/>
<text x="60.0" y="58.0" font-family="Arial" font-size="30" fill="#2F4A5A" font-weight="bold">PORT ENTRY · WHAT IS CHECKED ON ARRIVAL</text>
<text x="1180.0" y="58.0" font-family="Arial" font-size="24" fill="#2F4A5A" font-weight="bold" text-anchor="end">5 of 9</text>
<text x="1180.0" y="86.0" font-family="Arial" font-size="14" fill="#6B8290" text-anchor="end">the ports of the course list · heights in metres above chart datum · HW is the port's own high water</text>
<text x="60.0" y="176.0" font-family="Arial" font-size="16" fill="#2F4A5A" font-weight="bold">Dover</text>
<text x="60.0" y="198.0" font-family="Arial" font-size="12" fill="#6B8290">51°07.3′N 01°19.5′E</text>
<text x="60.0" y="220.0" font-family="Arial" font-size="11" fill="#6B8290">portofdover.com, 2026-09-26</text>
<text x="360.0" y="176.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">The port requires:</text>
<text x="360.0" y="198.0" font-family="Arial" font-size="14" fill="#1A1A1A">· VHF ch 74 Dover VTS · ch 80 the marina. Call before entering: required (ask Dover VTS on 74 for</text>
<text x="374.0" y="220.0" font-family="Arial" font-size="14" fill="#1A1A1A">permission two miles off; permission to enter the Outer Harbour is only given within 200 m of the west</text>
<text x="374.0" y="242.0" font-family="Arial" font-size="14" fill="#1A1A1A">or east entrance; a listening watch on 74 is compulsory inside the harbour and within a mile of the</text>
<text x="374.0" y="264.0" font-family="Arial" font-size="14" fill="#1A1A1A">breakwaters).</text>
<text x="360.0" y="286.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Visitors' berths are outside the lock and the sill.</text>
<text x="360.0" y="308.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">What the course checks:</text>
<text x="360.0" y="330.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Neither the lock nor the sill is checked for a visitor.</text>
<text x="360.0" y="352.0" font-family="Arial" font-size="14" fill="#1A1A1A">· The radio is not checked.</text>
<line x1="60.0" y1="386.0" x2="1180.0" y2="386.0" stroke="#2F4A5A" stroke-width="0.6" opacity="0.25"/>
<text x="60.0" y="408.0" font-family="Arial" font-size="16" fill="#2F4A5A" font-weight="bold">Ramsgate</text>
<text x="60.0" y="430.0" font-family="Arial" font-size="12" fill="#6B8290">outside this chart</text>
<text x="360.0" y="408.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">Not found in an official source — ask the harbour:</text>
<text x="360.0" y="430.0" font-family="Arial" font-size="14" fill="#1A1A1A">· No harbour rules held for this port.</text>
<text x="360.0" y="452.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">What the course checks:</text>
<text x="360.0" y="474.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Nothing is checked on arrival.</text>
<line x1="60.0" y1="508.0" x2="1180.0" y2="508.0" stroke="#2F4A5A" stroke-width="0.6" opacity="0.25"/>
<text x="60.0" y="536.0" font-family="Arial" font-size="17" fill="#2F4A5A" font-weight="bold">NORTH FRANCE</text>
<line x1="60.0" y1="546.0" x2="1180.0" y2="546.0" stroke="#2F4A5A" stroke-width="2.0"/>
<text x="60.0" y="574.0" font-family="Arial" font-size="16" fill="#2F4A5A" font-weight="bold">Dunkerque</text>
<text x="60.0" y="596.0" font-family="Arial" font-size="12" fill="#6B8290">outside this chart</text>
<text x="360.0" y="574.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">The port requires:</text>
<text x="360.0" y="596.0" font-family="Arial" font-size="14" fill="#1A1A1A">· VHF ch 9 the marinas.</text>
<text x="360.0" y="618.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">Not found in an official source — ask the harbour:</text>
<text x="360.0" y="640.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Whether you must call before entering is not stated.</text>
<text x="360.0" y="662.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">What the course checks:</text>
<text x="360.0" y="684.0" font-family="Arial" font-size="14" fill="#1A1A1A">· No lock, bridge, sill or drying limit that can be checked: nothing is checked on arrival.</text>
<text x="360.0" y="706.0" font-family="Arial" font-size="14" fill="#1A1A1A">· The radio is not checked.</text>
<line x1="60.0" y1="740.0" x2="1180.0" y2="740.0" stroke="#2F4A5A" stroke-width="0.6" opacity="0.25"/>
<text x="60.0" y="762.0" font-family="Arial" font-size="16" fill="#2F4A5A" font-weight="bold">Gravelines</text>
<text x="60.0" y="784.0" font-family="Arial" font-size="12" fill="#6B8290">outside this chart</text>
<text x="360.0" y="762.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">Not found in an official source — ask the harbour:</text>
<text x="360.0" y="784.0" font-family="Arial" font-size="14" fill="#1A1A1A">· No harbour rules held for this port.</text>
<text x="360.0" y="806.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">What the course checks:</text>
<text x="360.0" y="828.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Nothing is checked on arrival.</text>
<line x1="60.0" y1="862.0" x2="1180.0" y2="862.0" stroke="#2F4A5A" stroke-width="0.6" opacity="0.25"/>
<text x="60.0" y="884.0" font-family="Arial" font-size="16" fill="#2F4A5A" font-weight="bold">Calais</text>
<text x="60.0" y="906.0" font-family="Arial" font-size="12" fill="#6B8290">50°58.0′N 01°50.9′E</text>
<text x="360.0" y="884.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">The port requires:</text>
<text x="360.0" y="906.0" font-family="Arial" font-size="14" fill="#1A1A1A">· VHF ch 17 the harbour. Call before entering: required (a call is compulsory for any movement in the</text>
<text x="374.0" y="928.0" font-family="Arial" font-size="14" fill="#1A1A1A">avant-port and the arrière-port).</text>
<text x="360.0" y="950.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">What the course checks:</text>
<text x="360.0" y="972.0" font-family="Arial" font-size="14" fill="#1A1A1A">· No lock, bridge, sill or drying limit that can be checked: nothing is checked on arrival.</text>
<text x="360.0" y="994.0" font-family="Arial" font-size="14" fill="#1A1A1A">· The radio is not checked.</text>
<line x1="60.0" y1="1028.0" x2="1180.0" y2="1028.0" stroke="#2F4A5A" stroke-width="0.6" opacity="0.25"/>
<text x="60.0" y="1050.0" font-family="Arial" font-size="16" fill="#2F4A5A" font-weight="bold">Boulogne-sur-Mer</text>
<text x="60.0" y="1072.0" font-family="Arial" font-size="12" fill="#6B8290">50°43.8′N 01°35.3′E</text>
<text x="60.0" y="1094.0" font-family="Arial" font-size="11" fill="#6B8290">boulogne-marina.fr, 2026-09-26</text>
<text x="360.0" y="1050.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">The port requires:</text>
<text x="360.0" y="1072.0" font-family="Arial" font-size="14" fill="#1A1A1A">· VHF ch 9 the harbour.</text>
<text x="360.0" y="1094.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Visitors' berths are outside the lock and the sill.</text>
<text x="360.0" y="1116.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">Not found in an official source — ask the harbour:</text>
<text x="360.0" y="1138.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Whether you must call before entering is not stated.</text>
<text x="360.0" y="1160.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">What the course checks:</text>
<text x="360.0" y="1182.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Neither the lock nor the sill is checked for a visitor, unless you berth in Bassin Napoleon or Bassin</text>
<text x="374.0" y="1204.0" font-family="Arial" font-size="14" fill="#1A1A1A">Frederic Sauvage, which are behind the lock.</text>
<text x="360.0" y="1226.0" font-family="Arial" font-size="14" fill="#1A1A1A">· The radio is not checked.</text>
<line x1="60.0" y1="1260.0" x2="1180.0" y2="1260.0" stroke="#2F4A5A" stroke-width="0.6" opacity="0.25"/>
<text x="60.0" y="1282.0" font-family="Arial" font-size="16" fill="#2F4A5A" font-weight="bold">Etaples</text>
<text x="60.0" y="1304.0" font-family="Arial" font-size="12" fill="#6B8290">50°30.9′N 01°38.1′E</text>
<text x="360.0" y="1282.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">The port requires:</text>
<text x="360.0" y="1304.0" font-family="Arial" font-size="14" fill="#1A1A1A">· VHF ch 9 harbour master · ch 16 emergencies. Call 9 for help in or out.</text>
<text x="360.0" y="1326.0" font-family="Arial" font-size="14" fill="#1A1A1A">· The harbour dries.</text>
<text x="360.0" y="1348.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">Not found in an official source — ask the harbour:</text>
<text x="360.0" y="1370.0" font-family="Arial" font-size="14" fill="#1A1A1A">· Whether you must call before entering is not stated.</text>
<text x="360.0" y="1392.0" font-family="Arial" font-size="14" fill="#1A1A1A">· No official source gives the tide you need to enter.</text>
<text x="360.0" y="1414.0" font-family="Arial" font-size="14" fill="#2F4A5A" font-weight="bold">What the course checks:</text>
<text x="360.0" y="1436.0" font-family="Arial" font-size="14" fill="#1A1A1A">· No lock, bridge, sill or drying limit that can be checked: nothing is checked on arrival.</text>
<text x="360.0" y="1458.0" font-family="Arial" font-size="14" fill="#1A1A1A">· The radio is not checked.</text>
<line x1="60.0" y1="1492.0" x2="1180.0" y2="1492.0" stroke="#2F4A5A" stroke-width="0.6" opacity="0.25"/>
<line x1="60.0" y1="1632.0" x2="1180.0" y2="1632.0" stroke="#2F4A5A" stroke-width="1.0" opacity="0.35"/>
<text x="60.0" y="1654.0" font-family="Arial" font-size="12" fill="#6B8290">HOW TO USE: find your port of arrival; each line is a rule the course checker holds you to when you get there, with its figure. Nothing else is checked.</text>
<text x="60.0" y="1670.0" font-family="Arial" font-size="12" fill="#6B8290">HW is the high water of that port as you work it out from the tide pages: its own table if it is a standard port, the secondary differences if not.</text>
<text x="60.0" y="1686.0" font-family="Arial" font-size="12" fill="#6B8290">A LOCK OR BRIDGE SHUT when you arrive: say in your plan where you wait and until when; the checker accepts a wait that ends at the next published opening.</text>
<text x="60.0" y="1702.0" font-family="Arial" font-size="12" fill="#6B8290">«Not checked»: the rule exists but no official source gives a figure we can hold you to. It is not a green light: read the harbour's own notice before you go.</text>
<text x="60.0" y="1718.0" font-family="Arial" font-size="12" fill="#6B8290">Every rule comes from the harbour's official page, consulted on the date shown under its name. Not for navigation.</text>
</svg>