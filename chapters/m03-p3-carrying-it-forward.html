const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

const PZ=[{"t": "The dry reckoning", "s": [{"id": "1.S1", "h": "Nothing left to look at", "v": [3732.5, 2726.0, 7545], "fix": [[4580.0, 2660.0, "1449 · log 47.4", "", 120.0]], "p": ["<b>That circle is the last thing you saw.</b> Three bearings of three towers, cut at the best angles this chart has, timed at <b>1449</b> with the log reading <b>47.4</b>. <i>It is the fix that closed part 2.</i>", "<b>Now the fog comes down.</b> Or the night, or a coast with nothing on it you can name. Every method in the last two parts needed something in sight, and there is nothing in sight. <b>The chart has not changed and your position has.</b>", "<b>You are not left with nothing.</b> You have three things, and you have been writing all three down since the first screen of part 1: <b>where you were</b>, <b>what course you have steered</b> since, and <b>how far the log says you have run</b>.", "<i>Put those three together and you get a position on the chart. It is not a fix, it does not deserve a circle, and the next screens are about what it is and what it is worth.</i>"], "b": "Next"}, {"id": "1.E1", "h": "Course and distance, drawn", "v0": [3863.0, 2219.0, 2600], "v": [3863.0, 2219.0, 2600], "p": ["<b>Close in on the water you left.</b> This screen is <b>3.86 miles</b> across, the fix is bottom right, and everything that follows is done with a pencil, a plotter and the log &mdash; <i>nothing here is measured off anything you can see.</i>"], "b": "Next", "pasos": [{"t": "<b>Start from the last fix, and from nothing else.</b> 1449, log 47.4. <i>An estimate is only ever as good as the position it is counted from, which is why the circle goes on the chart before anything else does.</i>", "calc": "last fix &nbsp;&middot;&nbsp; <b>1449</b> &nbsp;&middot;&nbsp; log 47.4", "fix": [[4580.0, 2660.0, "1449 · log 47.4", "", 120.0]]}, {"t": "<b>Draw the course you have steered: 300.</b> One line out of the fix, and <b>one arrowhead on it</b> &mdash; that arrowhead is not decoration, it is what says this line is a course through the water. <i>You will meet the same line with two arrowheads in module 05, and it will mean something else.</i><br><br>Nothing on it is a position yet: a course is a direction, and a direction is not a place.", "calc": "course steered &nbsp;&middot;&nbsp; <b>300</b>", "fix": [[4580.0, 2660.0, "1449 · log 47.4", "", 120.0]], "derrota": [[4580.0, 2660.0, 3146.4, 1778.0, 300.0, "300 · 2.5 M"]]}, {"t": "<b>Now stop it where the log says.</b> Half an hour at 5 knots is <b>2.5 miles</b>: the log has gone from 47.4 to <b>49.9</b>. Mark that point with <b>a short line across the course</b>, write the time and the log beside it, and put <b>DR</b> on it.<br><br><i>A line across the track, not a dot in a circle. The two symbols are different because the two things are different, and an examiner reads the difference before he reads the numbers.</i>", "calc": "300 &nbsp;&middot;&nbsp; 2.5 M run &nbsp;&middot;&nbsp; <b>DR 1519</b> &nbsp;&middot;&nbsp; log 49.9", "fix": [[4580.0, 2660.0, "1449 · log 47.4", "", 120.0]], "derrota": [[4580.0, 2660.0, 3146.4, 1778.0, 300.0, "300 · 2.5 M"]], "estima": [[3146.4, 1778.0, 300.0, "DR 1519 · log 49.9"]]}]}, {"id": "1.S2", "h": "And this is not where you are", "v": [3863.0, 2219.0, 2600], "fix": [[4580.0, 2660.0, "1449 · log 47.4", "", 120.0]], "derrota": [[4580.0, 2660.0, 3146.4, 1778.0, 300.0, "300 · 2.5 M"], [4580.0, 2660.0, 3162.0, 1753.1, 301.0, "", 1]], "estima": [[3146.4, 1778.0, 300.0, "DR 1519 · log 49.9", 1], [3162.0, 1753.1, 301.0, "1° out · 81 m", -1]], "p": ["<b>Read the mark for what it says.</b> It says: <i>this is where the course and the log put me, if nothing has pushed me.</i> <b>It does not say where you are</b>, and the difference is the whole of this screen.", "<b>Two things push you, and neither leaves a trace on the log.</b> The tidal stream moves the water you are floating in, and the log cannot feel it because the log measures water. The wind pushes you sideways through it. <b>A GPS would show you where the two of them have put you &mdash; but not how much of it was each, and this mark is drawn without one.</b> <i>Both of them are module 05, where this mark gets corrected and becomes an estimated position. They are named here and taught there.</i>", "<b>And a third one is yours, and it is on this screen.</b> Steer one degree off for this half hour and the mark lands <b>81 metres</b> away &mdash; the faint track. Over the two legs of the next topic, <b>145 metres</b>. <i>Part 1 measured that one degree is 32 metres at one mile; this is the same number pointed forwards instead of sideways.</i>", "<b>So what is it good for?</b> It is the only position you have, it is better than a guess by a long way, and <b>it is the thing you carry a position line forward with</b> &mdash; which is where this part is going."], "b": "Next"}, {"id": "1.P1", "h": "Where does the log put you?", "t": "click", "v": [3863.0, 2219.0, 2600], "fix": [[4580.0, 2660.0, "1449 · log 47.4", "", 120.0]], "derrota": [[4580.0, 2660.0, 3146.4, 1778.0, 300.0, "300 · 2.5 M"]], "sest": [260, 3146.4, 1778.0], "ay": "Click the end of the run, on the course line.", "p": ["<b class='q'>Half an hour on 300, at 5 knots. Where does that put you?</b>", "The fix is drawn, the course is drawn, and the log has gone from <b>47.4</b> to <b>49.9</b>. <i>Put your finger on the end of the run. The question is not where you are &mdash; it is where the course and the log say you would be.</i>"], "b": "Next", "hizo": "worked out a dry reckoning"}]}, {"t": "Keeping the reckoning", "s": [{"id": "2.S1", "h": "Two legs and an alteration", "v": [3224.0, 2432.0, 4400], "fix": [[4580.0, 2660.0, "1449 · log 47.4", "", 120.0]], "derrota": [[4580.0, 2660.0, 3146.4, 1778.0, 300.0, "300 · 2.5 M"], [3146.4, 1778.0, 1868.7, 2203.0, 250.0, "250 · 2.0 M", 0, -1]], "estima": [[3146.4, 1778.0, 300.0, "DR 1519 · log 49.9", 1], [1868.7, 2203.0, 250.0, "DR 1543 · log 51.9", 1]], "p": ["<b>A reckoning is not one line, and a passage is not one course.</b> Here is the same afternoon with the next half hour added: <b>300 for 2.5 miles</b> to the alteration, then <b>250 for 2.0</b>. <i>4.5 miles in 54 minutes, from the fix that closed part 2 to a mark you have never seen.</i>", "<b>Every leg carries its own three things</b> &mdash; a course, a distance and a time &mdash; and every one of them ends in a mark with the log reading beside it. <i>That is why the log gets written down at the alteration and not only at the end: the second leg is counted from there.</i>", "<b>And the chain is only as good as its worst link.</b> One leg steered a degree off, one alteration made two minutes late, and everything after it moves with it. <i>Nothing here corrects itself; a reckoning only gets worse until the next time you see something.</i>"], "b": "Next"}, {"id": "2.E1", "h": "Drawn, leg by leg", "v0": [3224.0, 2432.0, 4400], "v": [3224.0, 2432.0, 4400], "p": ["<b>The same two legs, done with the pencil.</b> <i>Watch where the second one starts &mdash; it is the only thing in this topic that is easy to get wrong, and it is worth 4 630 metres.</i>"], "b": "Next", "pasos": [{"t": "<b>The first leg, as you drew it in topic 1.</b> 300 from the fix, 2.5 miles, and the mark across the track at <b>1519</b> with the log at <b>49.9</b>.<br><br><i>One arrowhead on the course line. One mark at the end of it. Nothing else on the chart yet.</i>", "calc": "300 &nbsp;&middot;&nbsp; 2.5 M &nbsp;&middot;&nbsp; <b>DR 1519</b> &nbsp;&middot;&nbsp; log 49.9", "fix": [[4580.0, 2660.0, "1449 · log 47.4", "", 120.0]], "derrota": [[4580.0, 2660.0, 3146.4, 1778.0, 300.0, "300 · 2.5 M"]], "estima": [[3146.4, 1778.0, 300.0, "DR 1519 · log 49.9", 1]]}, {"t": "<b>At 1519 you alter to 250 &mdash; and the new leg starts HERE, at the mark.</b> Not at the fix. The fix is 2.5 miles astern and it has nothing to do with this leg: <b>everything you count from now on is counted from the alteration</b>, which is why it has its own time and its own log reading.<br><br><i>Count this leg from the fix instead and you finish 4 630 metres from where you should be &mdash; 2.50 miles, which is exactly the length of the leg you skipped.</i>", "calc": "alter at <b>1519</b> &nbsp;&middot;&nbsp; new course <b>250</b> &nbsp;&middot;&nbsp; log 49.9", "fix": [[4580.0, 2660.0, "1449 · log 47.4", "", 120.0]], "derrota": [[4580.0, 2660.0, 3146.4, 1778.0, 300.0, "300 · 2.5 M"], [3146.4, 1778.0, 1868.7, 2203.0, 250.0, "250 · 2.0 M", 0, -1]], "estima": [[3146.4, 1778.0, 300.0, "DR 1519 · log 49.9", 1]]}, {"t": "<b>24 minutes on 250: 2.0 miles, log 51.9.</b> A second mark across the second track, with its own time.<br><br><b>Look at the three symbols on the chart and read them apart.</b> The <b>dot inside a circle</b>, astern, is a fix: you saw it. The <b>two short marks across the tracks</b> are reckonings: you counted them. <i>Neither of the two marks is where you are &mdash; they are where the courses and the log put you, and an examiner tells the two apart before he reads a single number.</i>", "calc": "250 &nbsp;&middot;&nbsp; 2.0 M &nbsp;&middot;&nbsp; <b>DR 1543</b> &nbsp;&middot;&nbsp; log 51.9", "fix": [[4580.0, 2660.0, "1449 · log 47.4", "", 120.0]], "derrota": [[4580.0, 2660.0, 3146.4, 1778.0, 300.0, "300 · 2.5 M"], [3146.4, 1778.0, 1868.7, 2203.0, 250.0, "250 · 2.0 M", 0, -1]], "estima": [[3146.4, 1778.0, 300.0, "DR 1519 · log 49.9", 1], [1868.7, 2203.0, 250.0, "DR 1543 · log 51.9", 1]]}]}, {"id": "2.P1", "h": "Run the second leg", "t": "click", "v": [2590.0, 1990.0, 2100], "derrota": [[4580.0, 2660.0, 3146.4, 1778.0, 300.0, "300 · 2.5 M"], [3146.4, 1778.0, 1868.7, 2203.0, 250.0, "250 · 2.0 M", 0, -1]], "estima": [[3146.4, 1778.0, 300.0, "DR 1519 · log 49.9", 1]], "sest": [260, 1868.7, 2203.0], "ay": "Click the end of the second leg, on the course line.", "p": ["<b class='q'>You altered at 1519. Where does 24 minutes on 250 put you?</b>", "The mark you are counting from is on the screen, with its log reading: <b>1519, log 49.9</b>. The new course is drawn. At 5 knots the log will read <b>51.9</b> when you get there. <i>Count from the alteration, not from the fix &mdash; the fix is off the top right of this screen and it is 2.5 miles behind you.</i>"], "b": "Next", "hizo": "ran the reckoning on from an alteration"}]}, {"t": "Carrying a line forward", "s": [{"id": "3.S1", "h": "One tower, and one line", "v": [2305.0, 2838.0, 2600], "derrota": [[3146.4, 1778.0, 1868.7, 2203.0, 250.0, ""]], "estima": [[1868.7, 2203.0, 250.0, "", 1]], "lns": [[1661.0, 3473.0, 1910.4, 1998.6, "Skelvoe Tower 188", "", 0.62, 1, -1]], "p": ["<b>The fog thins in one direction, and there is one thing in it.</b> Of everything part 1 taught you to shoot, a single object is in sight: <b>Skelvoe Tower bears 188</b>, taken at <b>1543</b> with the log at <b>51.9</b>. <i>Two more objects and this would be over in one step. There are not two more.</i>", "<b>A bearing is a line, not a position.</b> It says you are somewhere along it, and it says nothing about where along it. The mark at the end of the track says the opposite: a place, counted rather than seen. <i>Neither of them on its own is where you are &mdash; one has no distance and the other has nothing you looked at.</i>", "<b>So you take the line with you.</b> Sail on, note the course and the distance, and carry this line forward by exactly that much; then take the same tower again and cross the two. <i>A line that has travelled is no longer alone, and that is the whole of this topic.</i>"], "b": "Next"}, {"id": "3.E1", "h": "Carrying it forward", "v0": [2305.0, 2838.0, 2600], "v": [2305.0, 2838.0, 2600], "p": ["<b>Three moves: take it, carry it, take it again.</b> <i>Watch what moves in the middle one &mdash; it is a line and not a point, and that is where this is lost.</i>"], "b": "Next", "pasos": [{"t": "<b>1543. Skelvoe Tower bears 188.</b> The line is drawn from the tower outwards, and it carries <b>one arrowhead</b> at the far end: that is a position line, taken now.<br><br><i>You are on it. The mark across the track says the run puts you here &mdash; and the line agrees, without proving it.</i>", "calc": "1543 &nbsp;&middot;&nbsp; <b>Skelvoe 188</b> &nbsp;&middot;&nbsp; log 51.9", "derrota": [[3146.4, 1778.0, 1868.7, 2203.0, 250.0, ""]], "estima": [[1868.7, 2203.0, 250.0, "", 1]], "lns": [[1661.0, 3473.0, 1910.4, 1998.6, "Skelvoe Tower 188", "", 0.62, 1, -1]]}, {"t": "<b>Run the leg: 125 for 2.0 miles, 24 minutes.</b> And now the move that matters: <b>what goes forward is the LINE, not the point.</b> Take the whole line and slide it, parallel to itself, by exactly the course and the distance you have run &mdash; every point of it moves the same 2.0 miles on 125.<br><br><b>The carried line gets two arrowheads.</b> On a position line one arrowhead means <i>taken now</i> and two mean <i>carried forward</i>, and an examiner reads that before he reads a number.<br><br><b>And two arrowheads on a course line are a different thing altogether:</b> the <b>ground track</b> &mdash; where the boat actually goes over the ground &mdash; which is module 05. <i>So what tells them apart is not the arrows &mdash; it is the line underneath them. A course is solid and black and you steered it; a position line is dashed and red and you looked along it. Count the arrows second.</i>", "calc": "transfer <b>188</b> &nbsp;&middot;&nbsp; 125 &nbsp;&middot;&nbsp; 2.0 M &nbsp;&middot;&nbsp; log 51.9 &rarr; 53.9", "derrota": [[3146.4, 1778.0, 1868.7, 2203.0, 250.0, ""], [1868.7, 2203.0, 2949.7, 3005.8, 125.0, "125 · 2.0 M", 0, -1]], "estima": [[1868.7, 2203.0, 250.0, "", 1], [2949.7, 3005.8, 125.0, "", -1]], "lns": [[1661.0, 3473.0, 1910.4, 1998.6, "Skelvoe Tower 188", "", 0.62, 1, -1], [2843.2, 3677.4, 3127.2, 1998.6, "Skelvoe Tower 188", "", 0.62, 2, -1]]}, {"t": "<b>1607. Take Skelvoe Tower again: 248.</b> One arrowhead &mdash; it was taken now. And it cuts the carried line at <b>60°</b>.<br><br><b>That crossing is a position, and it is the first one since 1449 that came from something you saw.</b> <i>One object, two looks and a run in between. The circle goes round it because it was observed; the marks across the track never earn one.</i>", "calc": "1607 &nbsp;&middot;&nbsp; <b>Skelvoe 248</b> &nbsp;&middot;&nbsp; cut <b>60°</b> &nbsp;&middot;&nbsp; log 53.9", "derrota": [[3146.4, 1778.0, 1868.7, 2203.0, 250.0, ""], [1868.7, 2203.0, 2949.7, 3005.8, 125.0, "125 · 2.0 M", 0, -1]], "estima": [[1868.7, 2203.0, 250.0, "", 1]], "lns": [[2843.2, 3677.4, 3127.2, 1998.6, "Skelvoe Tower 188", "", 0.62, 2, -1], [1661.0, 3473.0, 3495.0, 2790.9, "Skelvoe Tower 248", "", 0.35, 1, 1]], "arco": [[2959.5, 2990.1, 188.0, 248.0, "60°"]], "fix": [[2959.5, 2990.1, "1607 · log 53.9", "", 128.0]]}]}, {"id": "3.S2", "h": "What makes it good, and what spoils it", "v": [2409.0, 2604.0, 1600], "derrota": [[1868.7, 2203.0, 2949.7, 3005.8, 125.0, "125 · 2.0 M", 0, -1]], "lns": [[2843.2, 3677.4, 3127.2, 1998.6, "", "", 0.62, 2, -1], [1661.0, 3473.0, 3495.0, 2790.9, "", "", 0.35, 1, 1]], "arco": [[2959.5, 2990.1, 188.0, 248.0, "60°"]], "fix": [[2959.5, 2990.1, "1607 · log 53.9", "", 156.5]], "p": ["<b>What makes this fix good is the 60° between the two lines &mdash; and that angle is nothing but the amount the bearing turned:</b> Skelvoe Tower 188 at the first look, Skelvoe Tower 248 at the second. Sail towards the object and it barely turns: two careful looks give you two lines that are almost the same line, and almost the same line is no position at all. <i>The run has to open the bearing, and here it opened it by 60 degrees.</i>", "<b>And a running fix is only as good as the reckoning that carries it.</b> The carried line arrives with everything the run had inside it. One degree out on the first bearing moves it <b>62 m</b> at that range; one degree out on the course you steered moves it <b>65 m</b> over the 2.0 miles run; five per cent out on the distance, <b>185 m</b>. <i>None of that shows on the chart. A crossing looks exactly as sharp when it is wrong.</i>", "<b>And one more, which is not drawn here and not taught here: the tidal stream.</b> What you carried forward is a run <i>through the water</i>, and the water has been moving under you the whole time. Correcting for it is module 05; <b>naming it is this one</b>, because a running fix that ignores it is wrong by however far the stream has taken you.", "<i>On this chart the crossing lands <b>51 m</b> from the mark the reckoning made &mdash; and those 51 metres are not the reckoning's error: they are what writing two bearings to the whole degree costs. In a boat, the stream would add its own on top of them.</i>"], "b": "Next"}, {"id": "3.P1", "h": "Run the line yourself", "t": "click", "v": [2305.0, 2838.0, 2600], "derrota": [[1868.7, 2203.0, 2949.7, 3005.8, 125.0, "125 · 2.0 M", 0, -1]], "lns": [[2843.2, 3677.4, 3127.2, 1998.6, "Skelvoe Tower 188", "", 0.62, 2, -1], [1661.0, 3473.0, 3495.0, 2790.9, "Skelvoe Tower 248", "", 0.35, 1, 1], [1661.0, 3473.0, 1910.4, 1998.6, "Skelvoe Tower 188", "", 0.62, 1, -1]], "sfix": [260, "carried", "1607"], "ay": "Click where the carried line crosses the 1607 bearing.", "p": ["<b class='q'>Skelvoe Tower bore 188 at 1543. You ran 125 for 2.0 miles, and at 1607 Skelvoe Tower bears 248. Where does that put you?</b>", "All three lines are drawn: the bearing you took at 1543 &mdash; Skelvoe Tower 188 &mdash; the same line carried forward by the run &mdash; <b>two arrowheads</b> &mdash; and the bearing you took at 1607, Skelvoe Tower 248. <i>Two of them cross at the tower, and that crossing is worth nothing: the tower is where you were looking, not where you were.</i>"], "b": "Next", "hizo": "fixed with a position line carried forward"}]}, {"t": "Closing", "s": [{"id": "4.S1", "h": "The afternoon, drawn once", "v": [3732.5, 2726.0, 7545], "fix": [[4580.0, 2660.0, "1449 · log 47.4", "", 120.0], [2959.5, 2990.1, "1607 · log 53.9", "", 128.0]], "derrota": [[4580.0, 2660.0, 3146.4, 1778.0, 300.0, "300 · 2.5 M"], [3146.4, 1778.0, 1868.7, 2203.0, 250.0, "250 · 2.0 M", 0, -1], [1868.7, 2203.0, 2949.7, 3005.8, 125.0, "125 · 2.0 M", 0, -1]], "estima": [[3146.4, 1778.0, 300.0, "", 1], [1868.7, 2203.0, 250.0, "", 1]], "lns": [[2843.2, 3677.4, 3127.2, 1998.6, "", "", 0.62, 2, -1], [1661.0, 3473.0, 3495.0, 2790.9, "", "", 0.35, 1, 1]], "p": ["<b>78 minutes, 6.5 miles, and two positions.</b> The dot in a circle at <b>1449</b> is where part 2 left you: three towers, three bearings, one crossing. Then the visibility went. <b>300 for 2.5</b> to the first mark, <b>250 for 2.0</b> to the second, and <b>125 for 2.0</b> to something better than a mark: at <b>1607</b> a second position, built out of <i>one</i> tower looked at twice with the run carried between the looks.<br><br><i>So count the marks and there are two, not three. The reckoning put a third one at the end of the last leg as well &mdash; it is 51 metres from the circle, which at this width is thinner than the pencil &mdash; and drawing both would have hidden the one that was earned.</i>", "<b>The two circles are 2.46 miles apart and you sailed 6.5 to get between them.</b> <i>That is not waste: it is what the chart cannot tell you unless you write down the course, the distance and the time as you go. The log went from 47.4 to 53.9 and nothing was in sight for 54 of those 78 minutes.</i>", "<b>Three things you could not do at 1449, and can now.</b> Put a position on the chart with nothing in sight. Read a mark for what it says instead of what you would like it to say. And take one object, look at it twice with a run in between, and get a position out of it. <i>Not one of the three needs a second tower.</i>", "<b>And one you still cannot do: know how good any of it is.</b> A running fix is only as good as the reckoning that carries it, and a reckoning only gets worse until the next time you see something. <i>Nothing on this screen corrects itself.</i>"], "b": "Next"}, {"id": "4.C1", "h": "What pushes you, and where it is taught", "v": [3732.5, 2726.0, 7545], "fix": [[4580.0, 2660.0, "1449 · log 47.4", "", 120.0], [2959.5, 2990.1, "1607 · log 53.9", "", 128.0]], "derrota": [[4580.0, 2660.0, 3146.4, 1778.0, 300.0, "300 · 2.5 M"], [3146.4, 1778.0, 1868.7, 2203.0, 250.0, "250 · 2.0 M", 0, -1], [1868.7, 2203.0, 2949.7, 3005.8, 125.0, "125 · 2.0 M", 0, -1]], "estima": [[3146.4, 1778.0, 300.0, "", 1], [1868.7, 2203.0, 250.0, "", 1]], "lns": [[2843.2, 3677.4, 3127.2, 1998.6, "", "", 0.62, 2, -1], [1661.0, 3473.0, 3495.0, 2790.9, "", "", 0.35, 1, 1]], "p": ["<b>Everything on this chart is the reckoning, and the reckoning is dry.</b> A course, a distance, a time and a log &mdash; four things you can read on board, and <i>not one of them can feel the water moving under the boat</i>.", "<b>Two things push you, and neither leaves a trace on the log.</b> The <b>tidal stream</b> moves the water you are floating in; <b>leeway</b> pushes you sideways through it. A GPS would show you where the two of them had put you, but not how much of it was each &mdash; and the reckoning is what you keep without one. Applied to the marks you have been drawing, the two of them turn a reckoning into an <b>estimated position</b> &mdash; and that is <b>module 05</b>, which starts from exactly these marks and adds the corrections. <i>There is also a question this module never asked: how much water is under you. That one is <b>module 04</b>.</i>", "<b>And they are not taught here for a measured reason rather than a tidy one.</b> There is no tidal information on this chart at all: <b>11 data files behind it and not one current in any of them</b>, and no tidal diamond printed on the sheet. <i>A stream you cannot look up is a stream somebody has to tell you, and being told the answer is not learning to find it. Skelmar Sound can teach you to keep a reckoning; it cannot teach you to correct one.</i>", "<b>Nothing on the chart changed between this screen and the last one, and that is the point.</b> The question this module opened with &mdash; <i>where are you?</i> &mdash; has been answered three ways: part 1 gave you a single line, and one line is <b>not</b> a position; part 2 crossed two and got a point, then showed the point was a zone; part 3 took the objects away and you got a position anyway. <i>What is still missing cannot be drawn from anything on this screen, which is exactly why it gets a module of its own.</i>"], "b": "Finish"}]}];
function S(){return PZ[paso.p].s[paso.i];}

function progreso(){
 marcoChrome();const g=document.getElementById("prog");g.innerHTML="";
 PZ.forEach((z,i)=>{const b=document.createElement("i");
  b.className=i<paso.p?"done":i==paso.p?"on":"";
  b.title=`Topic ${i+1} · ${z.t}`;

function _dirg(g){const r=g*Math.PI/180, N=CARTA_NORTE||[0,-1], E=[-N[1],N[0]];
 return [N[0]*Math.cos(r)+E[0]*Math.sin(r), N[1]*Math.cos(r)+E[1]*Math.sin(r)];}

function _rombo(g1,w1,g2,w2){
 const d1=_dirg(g1), d2=_dirg(g2), n1=[-d1[1],d1[0]], n2=[-d2[1],d2[0]];
 const det=n1[0]*n2[1]-n1[1]*n2[0];
 const V=[[w1,w2],[w1,-w2],[-w1,-w2],[-w1,w2]].map(ab=>
  [(ab[0]*n2[1]-ab[1]*n1[1])/det, (ab[1]*n1[0]-ab[0]*n2[0])/det]);
 const D1=Math.hypot(V[0][0]-V[2][0],V[0][1]-V[2][1]),
       D2=Math.hypot(V[1][0]-V[3][0],V[1][1]-V[3][1]);
 let th=Math.abs(g1-g2)%180; th=Math.min(th,180-th);
 return {eje:Math.max(D1,D2), menor:Math.min(D1,D2),
         area:4*w1*w2/Math.abs(Math.sin(th*Math.PI/180))};
}

function preparaCorte(s,v){

 s.lns=[li(g1).concat([q[5],"",0.2]), li(g2).concat([q[6],"",0.85])];
 s.romb=[[o[0],o[1],g1,w1,g2,w2,""]];
 s.arco=[[o[0],o[1],g1,g2,(+v).toFixed(0)+"°"]];
 return _rombo(g1,w1,g2,w2);
}

let SIN_SITIO=[];
function _cortaCaja(R,x1,y1,x2,y2){
 let t0=0,t1=1; const dx=x2-x1, dy=y2-y1;
 const pr=[-dx,dx,-dy,dy], qq=[x1-R.x, R.x+R.w-x1, y1-R.y, R.y+R.h-y1];
 for(let i=0;i<4;i++){
  if(pr[i]===0){ if(qq[i]<0) return false; continue; }
  const r=qq[i]/pr[i];
  if(pr[i]<0){ if(r>t1) return false; if(r>t0) t0=r; }
  else { if(r<t0) return false; if(r<t1) t1=r; }
 }
 return t1>t0;
}
function _libre(cx, cy, an, alt, gL, vb){
 const R={x:cx-an/2, y:cy-alt/2, w:an, h:alt};
 if(R.x<vb.x+.02*vb.w||R.x+R.w>vb.x+.98*vb.w
  ||R.y<vb.y+.02*vb.h||R.y+R.h>vb.y+.98*vb.h) return false;
 for(const L of gL.querySelectorAll("line"))
  if(_cortaCaja(R,+L.getAttribute("x1"),+L.getAttribute("y1"),
                  +L.getAttribute("x2"),+L.getAttribute("y2"))) return false;
 for(const E of gL.querySelectorAll("path,rect,polyline,polygon,circle")){
  let b; try{ b=E.getBBox(); }catch(e){ continue; }
  if(!b||(b.width<=0&&b.height<=0)) continue;
  if(Math.min(R.x+R.w,b.x+b.width)-Math.max(R.x,b.x)>0
   &&Math.min(R.y+R.h,b.y+b.height)-Math.max(R.y,b.y)>0) return false;
 }
 return true;
}

function _coloca(cands, an, alt, gL, vb, nom){

 return cands[0];
}
