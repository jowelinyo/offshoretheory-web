"use strict";
const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

let RND = 1;

window.azarSemilla = n => {
 RND = (n >>> 0) || 1;
 for(let k = 0; k < 8; k++) azar();
};
function azar(){
 RND ^= RND << 13; RND >>>= 0;
 RND ^= RND >>> 17;
 RND ^= RND << 5;  RND >>>= 0;
 return RND / 4294967296;
}
function baraja(a){
 const b = a.slice();
 for(let i = b.length - 1; i > 0; i--){
  const j = Math.floor(azar() * (i + 1));
  const t = b[i]; b[i] = b[j]; b[j] = t;
 }
 return b;
}
azarSemilla(Date.now());

function bolsaNueva(){ return {i:[], ultima:null}; }
function saca(bolsa, banco){

 if(bolsa.n!==banco.length){ bolsa.i=[]; bolsa.n=banco.length; }
 if(!bolsa.i.length){
  bolsa.i = baraja(banco.map((x, k) => k));
  if(bolsa.i.length > 1 && banco[bolsa.i[bolsa.i.length - 1]].id === bolsa.ultima){
   const t = bolsa.i[bolsa.i.length - 1];
   bolsa.i[bolsa.i.length - 1] = bolsa.i[0]; bolsa.i[0] = t;
  }
 }
 const x = banco[bolsa.i.pop()];
 bolsa.ultima = x.id;
 return x;
}

const D2R=Math.PI/180;

const PUERTOS={

  z0:4.65,
  comps:{M2:[2.4579,0], S2:[0.7082,0], N2:[0.3125,25], K2:[0.1250,0],
         K1:[0.1458,60], O1:[0.1042,30], M4:[0.1666,155], M6:[0.0417,70]},

function alturaBruta(p,t){
 let h=p.z0;
 for(const n in p.comps){

  h+=c[0]*Math.cos((SIGMA[n]*t-c[1])*D2R);}
 return h;}

function extremos(p,t0,t1){
  const paso=1/60, out=[];
  let a=alturaBruta(p,t0-paso), b=alturaBruta(p,t0);
  for(let t=t0;t<t1;t+=paso){
   const c=alturaBruta(p,t+paso);
   if((b>a&&b>=c)||(b<a&&b<=c)){

    const den=(a-2*b+c);
    const dt=den?0.5*(a-c)/den:0;
    const tt=t+dt*paso;
    out.push({k:(b>a)?"HW":"LW", t:tt, h:alturaBruta(p,tt)});}
   a=b; b=c;}
  return out;}

const CURVA_ALA=6.5, CURVA_PASO=0.25;

function nivelesDe(p,ex){
 const dias=[];
 for(let d=0;d<DIAS;d++){
  const e=ex.filter(x=>x.t>=d*24&&x.t<d*24+24);
  const hs=e.filter(x=>x.k=="HW"), ls=e.filter(x=>x.k=="LW");
  if(!hs.length||!ls.length){dias.push(null); continue;}
  const H=hs.map(x=>x.h), L=ls.map(x=>x.h);
  dias.push({hw:H, lw:L,
             rango:Math.max.apply(null,H)-Math.min.apply(null,L)});}
 const med=a=>a.reduce((x,y)=>x+y,0)/a.length;
 const viva=[], muerta=[];
 for(let i=1;i<dias.length-1;i++){
  if(!dias[i]||!dias[i-1]||!dias[i+1])continue;
  if(dias[i].rango>=dias[i-1].rango&&dias[i].rango>dias[i+1].rango)viva.push(dias[i]);
  if(dias[i].rango<=dias[i-1].rango&&dias[i].rango<dias[i+1].rango)muerta.push(dias[i]);}
 const r1=v=>Math.round(v*10)/10;
 return {HAT:p.extremos.HAT, LAT:p.extremos.LAT,
         MHWS:r1(med(viva.map(x=>med(x.hw)))),
         MLWS:r1(med(viva.map(x=>med(x.lw)))),
         MHWN:r1(med(muerta.map(x=>med(x.hw)))),
         MLWN:r1(med(muerta.map(x=>med(x.lw)))),
         nVivas:viva.length, nMuertas:muerta.length};}

function rangoDelDia(ex,d){
 const e=ex.filter(x=>x.t>=d*24&&x.t<d*24+24);
 const hs=e.filter(x=>x.k=="HW"), ls=e.filter(x=>x.k=="LW");
 if(!hs.length||!ls.length)return null;
 const H=Math.max.apply(null,hs.map(x=>x.h));
 const L=Math.min.apply(null,ls.map(x=>x.h));
 return {rango:H-L, hw:hs.reduce((a,b)=>b.h>a.h?b:a)};}

function curvaDe(p,ex,hw){
 const antes=ex.filter(e=>e.k=="LW"&&e.t<hw.t);
 const luego=ex.filter(e=>e.k=="LW"&&e.t>hw.t);
 if(!antes.length||!luego.length)
  throw new Error("la pleamar de t="+hw.t.toFixed(2)+" no tiene sus dos flancos");
 const lw=(antes[antes.length-1].h+luego[0].h)/2;
 const rangoCurva=hw.h-lw, pts=[];
 for(let d=-CURVA_ALA;d<=CURVA_ALA+1e-9;d+=CURVA_PASO)
  pts.push((alturaBruta(p,hw.t+d)-lw)/rangoCurva);

 return {rangoCurva:rangoCurva, pts:pts};}

function factorEn(curva,dhw){
 const x=(Math.max(-CURVA_ALA,Math.min(CURVA_ALA,dhw))+CURVA_ALA)/CURVA_PASO;
 const i=Math.floor(x), u=x-i, p=curva.pts;
 return p[i]+(p[Math.min(i+1,p.length-1)]-p[i])*u;}

function factorDelDia(cv,cm,rango,dhw){
 const rv=cv.rango, rm=cm.rango;
 const fv=factorEn(cv,dhw), fm=factorEn(cm,dhw);
 if(rv<=rm)return fv;
 const u=Math.max(0,Math.min(1,(rango-rm)/(rv-rm)));
 return fm+(fv-fm)*u;}

const alturaHoja=(cv,cm,hw,lw,dhw)=>lw+factorDelDia(cv,cm,hw-lw,dhw)*(hw-lw);

function puerto(id){
 const p=PUERTOS[id];
 if(!p)throw new Error("no hay ningun puerto que se llame «"+id+"»");
 const ex=extremos(p,-REBASE,DIAS*24+REBASE);
 const dias=[];
 for(let d=0;d<DIAS;d++){
  const r=rangoDelDia(ex,d);
  const e=ex.filter(x=>x.t>=d*24&&x.t<d*24+24);
  dias.push({dia:d, rango:r?r.rango:0,
             cel:e.map(x=>({k:x.k, min:x.t*60-d*1440, h:x.h}))});}

 const orden=dias.filter(d=>d.rango>0).slice().sort((a,b)=>b.rango-a.rango);
 const dv=orden[0], dm=orden[orden.length-1];
 const niveles=nivelesDe(p,ex);
 return {p:p, ex:ex, dias:dias, niveles:niveles,
         diaVivas:dv.dia, diaMuertas:dm.dia,
         vivas:Object.assign(curvaDe(p,ex,rangoDelDia(ex,dv.dia).hw),
                             {rango:dv.rango}),
         muertas:Object.assign(curvaDe(p,ex,rangoDelDia(ex,dm.dia).hw),
                               {rango:dm.rango}),
         alturaEn:(dia,hora)=>alturaBruta(p,dia*24+hora)};}

 return {PUERTOS:PUERTOS, SIGMA:SIGMA, DIAS:DIAS, VENTANA:VENTANA,
         REBASE:REBASE,
         alturaBruta:alturaBruta, extremos:extremos, curvaDe:curvaDe,
         rangoDelDia:rangoDelDia, puerto:puerto,
         CURVA_ALA:CURVA_ALA, CURVA_PASO:CURVA_PASO,
         factorEn:factorEn, factorDelDia:factorDelDia,
         alturaHoja:alturaHoja};
})();

if(typeof module!=="undefined"&&require.main===module){
 const id=process.argv[2]||"aldern";

 if(process.argv[3]=="alturas"){
  const p=MOTOR.PUERTOS[id];
  const ts=String(process.argv[4]||"").split(",").filter(x=>x!=="");
  console.log(JSON.stringify(ts.map(x=>
    Math.round(MOTOR.alturaBruta(p,parseFloat(x))*1000)/1000)));
  process.exit(0);}
 const P=MOTOR.puerto(id);

 const hhmm=m=>{const t=Math.round(m);
  return String(Math.floor(t/60)).padStart(2,"0")
        +String(t%60).padStart(2,"0");};
 const r2=v=>Math.round(v*100)/100;
 const PASO_FORMA=0.25;
 const forma=[];

 for(let d=0;d<MOTOR.VENTANA;d++){
  const fila=[];
  for(let h=0;h<=24+1e-9;h+=PASO_FORMA)fila.push(r2(P.alturaEn(d,h)));
  forma.push(fila);}

 const r1=v=>Math.round(v*10)/10;
 const dias=P.dias.map(d=>{
  const hw=d.cel.filter(c=>c.k=="HW").map(c=>[hhmm(c.min),r2(c.h),r1(c.h)]);
  const lw=d.cel.filter(c=>c.k=="LW").map(c=>[hhmm(c.min),r2(c.h),r1(c.h)]);
  const rango=(hw.length&&lw.length)
    ?r2(Math.max.apply(null,hw.map(x=>x[1]))-Math.min.apply(null,lw.map(x=>x[1])))
    :0;
  return {dia:d.dia, rango:rango, pleamares:hw, bajamares:lw};});

 const anio=P.dias.map(d=>({
   dia:d.dia,
   cel:d.cel.map(c=>({k:c.k, min:Math.round(c.min), h2:r2(c.h), h1:r1(c.h)}))}));
 console.log(JSON.stringify({
  puerto:P.p.nombre, id:P.p.id, niveles:P.niveles, z0:P.p.z0,

  dias:dias, ventana:MOTOR.VENTANA, anio:anio,
  forma:forma, pasoForma:PASO_FORMA,
  curvaAla:MOTOR.CURVA_ALA, curvaPaso:MOTOR.CURVA_PASO,
  diaVivas:P.diaVivas, diaMuertas:P.diaMuertas,
  vivas:{rango:dias[P.diaVivas].rango, rangoCurva:r2(P.vivas.rangoCurva),
         pts:P.vivas.pts.map(v=>Math.round(v*1000)/1000)},
  muertas:{rango:dias[P.diaMuertas].rango, rangoCurva:r2(P.muertas.rangoCurva),
           pts:P.muertas.pts.map(v=>Math.round(v*1000)/1000)}
 }));}

if(typeof module!=="undefined")module.exports=MOTOR;

const PZ=[{"id": "1.S1", "t": "The page · topic 1", "h": "The page you actually open", "obra": "pagina", "p": ["Everything in this block comes off one page. Here it is: <b>two months of one port, day after day</b>, and for each day the times and heights of its high and low waters. Your day is somewhere in there, and finding it is the first thing you do.", "That is all an almanac is being asked to do here. <em>How the book is arranged, and how you find a port you have never heard of, is the module on the almanac</em> — not this one.", "Three things to find before you read a single number: <b>which port</b>, <b>which day</b>, and <b>which hour those numbers are in</b>. The third one is the one that puts boats on the mud in summer.", "You already know that last one: it is the line you met in the module on time. Here you only have to notice it."]}, {"id": "1.E1", "t": "The page · topic 1", "h": "Which port, which day, which hour", "obra": "ejemplo", "b": "Next", "p": ["The port, at the top. <b>A page is printed for one port and no other</b>, and the figures below belong to it alone.", "The day, down the left of each block: <b>the date in big figures</b>, and under it the day of the week. <b>One block, one day</b> — and the block carries everything that happens to the water that day.", "Its tides run <b>down the block, in clock order</b>: four lines, one to a tide — high, low, high, low — each with the time it happens and the height it reaches. A day with only three tides leaves the fourth line empty.", "Top left, in its box: <b>STANDARD TIME (UT)</b>, and under it <em>for Summer Time add ONE hour in non-shaded areas</em>. Now look at the background of the blocks: <b>it changes part way down</b>. Before that Sunday the page and your watch agree; after it your watch says one hour more, and a tide read an hour late is a tide you have missed."]}, {"id": "1.P1", "t": "The page · topic 1", "h": "Read it off the page", "obra": "practica", "forma": "eleccion", "banco": "leer", "q": "__TXT__", "pista": "Find the block for the day first, then count down it. The tides are in clock order, so the first high water of the day is the first <b>HW</b> you meet going left to right.", "cierre": "That is the page read. Now the picture the almanac prints beside these numbers, and what it is for."}, {"id": "2.S1", "t": "The curve · topic 2", "h": "Four moments, and everything in between", "obra": "pagina", "p": ["The table gave you <b>four moments of the day</b> — two high waters and two low ones — and the water was doing something at all the other hours too.", "Almost nothing you ever want to know happens at one of those four moments. <b>You want to know at half past nine</b>, because that is when you were thinking of leaving.", "So the almanac prints a second thing beside the numbers: <b>a picture of the shape the water makes</b> between one turn and the next. Not for a day — for the port.", "This screen is about <b>what that picture is</b>. Reading a height off it is the next thing, and it is easier once you know what you are reading."]}, {"id": "2.E1", "t": "The curve · topic 2", "h": "The picture the almanac prints beside the numbers", "obra": "ejemplo", "pasosDe": "curva", "b": "Next", "p": ["Along the bottom, <b>hours before and after high water</b> — not hours of the day. High water sits at zero, and everything is counted from it. That is why the same picture works for any day.", "Up the side, from <b>low water at the bottom to high water at the top</b>. Not metres: <em>the fraction of your own range</em>. And it is marked in <b>tenths</b>, so that a height you have worked out can actually be found on it.", "Now the curve for a <b>day of big range</b>. Follow it from the left: the water climbs, turns at high water, and falls away again.", "And the one for a <b>quiet day</b>. Same axes, different shape — a small tide is not just a big tide made shorter.", "<b>They are furthest apart on the way up</b>, about three and a quarter hours before high water. On a big day that gap is the red figure, and it is why the almanac bothers to print two."]}, {"id": "2.P1", "t": "The curve · topic 2", "h": "What is this curve telling you?", "obra": "practica", "forma": "eleccion", "banco": "curva", "lienzo": "curva", "q": "__TXT__", "pista": "The picture is printed <b>once, for the port</b>. Whatever it is telling you, it cannot be telling you about one particular day — it was printed before anyone knew which day you would ask about.", "cierre": "That is what the picture is. Now the four marks that turn it into a height."}, {"id": "3.E1", "t": "Height at an hour · topic 3", "h": "The four marks that give you a height", "obra": "ejemplo", "pasosDe": "hoja", "b": "Next", "p": ["Two boxes, side by side, and they share the same up-and-down: <b>low water at the bottom, high water at the top</b>. On the left, metres. On the right, the curve you have just met. That shared up-and-down is the trick — a line drawn across at one height crosses <em>both</em> boxes at once.", "<b>First mark: high water</b>, on the top edge of the left-hand box, at its height in metres. That comes straight off the page you read in topic one.", "<b>Second mark: low water</b>, on the bottom edge. Now the box knows how far the water is going to move today.", "<b>Third: join them.</b> That sloping line <em>is your day</em>, and here is what it is for: it turns a <b>fraction into metres</b>. A quarter of the way up, halfway, three quarters — the line tells you what each one is worth today. Everything after this is reading, not deciding.", "<b>Now go in at the hour</b> you care about, on the bottom of the right-hand box. It is measured <b>from high water</b>, not from midnight.", "<b>Up to the curve.</b> That is how far up the tide has come at that hour, as a fraction of the day’s range — and the curve you are reading is the one interpolated for today, between the printed springs and neaps.", "<b>Across to the line</b> — the sloping one, the one you drew. Where the two meet is your day’s water at that hour, and it is sitting directly above the metres scale.", "<b>And down to read it.</b> Where you land on the bottom scale is the height of tide at that hour. Four marks and two lines — that is the whole method, and you will use it for the rest of the module."]}, {"id": "3.J1", "t": "Height at an hour · topic 3", "h": "Try it before it counts", "obra": "hojaJuego", "p": ["<b>The next screen asks you to do this for real.</b> This one does not: the sheet is yours to play with. <b>Drag on the top edge</b> of the left-hand box to put high water where the table says, <b>on the bottom edge</b> for low water, and <b>along the bottom of the right-hand box</b> for the hour. <b>Nothing here is scored</b> — move things about and watch what happens.", "Watch what the sloping line does when you move either end: a bigger range tips it flatter, and every fraction of the curve is suddenly worth more metres. That single line is the whole difference between one day and another.", "And notice that the height does <b>not</b> change at an even rate as you move the hour. Around high water and around low water you can drag a long way for very little; halfway between, an hour costs you more than a metre. That is the whole reason the curve exists — if the tide rose and fell at a steady rate a ruler would do."]}, {"id": "3.P1", "t": "Height at an hour · topic 3", "h": "Draw the sheet, and let it tell you", "obra": "practica", "forma": "trazado", "banco": "altura", "lienzo": "traza", "q": "__TXT__", "pista": "<b>Drag on the top edge</b> of the left-hand box for high water and <b>on the bottom</b> for low water. Then work out how far the hour is <b>from high water</b> — that is the gap you go in with, along the bottom of the right-hand box — and the sheet does the rest.", "cierre": "That is the method, in your own hand. Now the same clock time, another day."}, {"id": "3.P2", "t": "Height at an hour · topic 3", "h": "The same clock time, a different day", "obra": "practica", "forma": "trazado", "banco": "altura", "lienzo": "traza2", "q": "__TXT2__", "pista": "Same time on the clock, but a different tide: <b>a different high water, at a different time, of a different size</b>. Nothing carries over except the method — not one of your three marks goes in the same place.", "cierre": "<b>Next:</b> the same sheet walked backwards — you know how much water you need, and you want to know when."}, {"id": "4.S1", "t": "When, not how much · topic 4", "h": "The question you will actually ask", "obra": "enmarca", "lienzo": "hoja0", "p": ["You can now take a height off the sheet: give it an hour, and it gives you metres.", "<b>Nobody ever asks that.</b> Nobody stands on the pontoon wondering how much water there is at three o'clock.", "What you ask is <b>the other way round</b>: <em>at what time will there be enough?</em> Because what you are deciding is <b>when to leave</b>.", "Same sheet. Same four marks. Walked the other way."]}, {"id": "4.E1", "t": "When, not how much · topic 4", "h": "The same sheet, walked backwards", "obra": "ejemplo", "pasosDe": "reves", "b": "Next", "p": ["Here is the question you will actually ask, and it is not the one you have been practising. Nobody stands at a chart table wondering how much water there is at half past nine. They wonder <b>how late they can leave it</b>.", "<b>High water first</b>, as before — same box, same top edge. Nothing about the sheet changes when you walk it backwards.", "<b>And low water.</b> Careful here: a window crosses high water, so it touches <em>both</em> of the day’s low waters. You draw the line to the <b>lower</b> of the two — that way your window comes out a little <em>shorter</em> than the truth, which is the error you want to have.", "<b>Join them.</b> Same line, same job: it turned a fraction into metres, and now it is going to turn metres back into a fraction.", "<b>Now go in at the height you need</b>, on the metres scale, and drop down to the line. This is the one figure on the sheet that is not printed anywhere: it came out of your own subtraction.", "<b>Across to the curve — and look what happens.</b> The line you have drawn meets the curve <b>twice</b>. Of course it does: the tide passes every height on the way up and again on the way down.", "<b>So there are two hours to read, not one</b>, and you take them both down to the scale. And they are <em>not</em> mirror images: the second crossing sits <b>23 to 35 minutes</b> nearer high water than the first one is early — measured across every stretch on this page. That is <b>two quarter-hours</b> of the scale you are reading, so working the second one out by subtraction puts you two marks wrong.", "<b>That is your window</b>: from the first to the second, and everything in between is water enough. Neither one on its own answers the question."]}, {"id": "4.P1", "t": "When, not how much · topic 4", "h": "Between what times can you cross?", "obra": "practica", "forma": "ventana", "banco": "ventana", "lienzo": "traza4", "q": "__TXT__", "pista": "Work out the height you need first — what she draws, plus the safety margin you want, less the charted sounding. Then in at that height, down to the line, across to the curve, and <b>down twice</b>.", "cierre": "That is the sheet in both directions, and it is the whole of a standard port. <b>Next</b> comes doing it without the sheet at all."}, {"id": "5.S1", "t": "Springs and neaps · topic 5", "h": "Two curves, and your day is neither", "obra": "enmarca", "lienzo": "dosCurvas", "p": ["The sheet has been printed with <b>two curves</b> all along: one for a day of big range, one for a quiet one.", "<b>Your day is almost never either of them.</b> Measured over a year at Aldern Quay, <b>90 days of the 365</b> fall between the two — neither springs nor neaps.", "So the two curves are not a pair of boxes to be sorted into. They are <b>the two ends of a range</b>, and the day you are working sits somewhere along it.", "This screen is about <b>landing in between</b>."]}, {"id": "5.E1", "t": "Springs and neaps · topic 5", "h": "Landing between them", "obra": "ejemplo", "pasosDe": "entre", "b": "Next", "p": ["Start where you always start: <b>the range of the day</b>, high water less low water, straight off the table. That single number decides the shape.", "The printed springs curve was taken from a day of <b>7.6 m</b>. Hold your day's range against it.", "The neaps one from a day of <b>3.1 m</b>. Now your day's range has one of the printed ranges above it and the other below.", "<b>And that is the whole of it.</b> However far your range sits between the two printed ranges, <b>your curve sits the same distance between the two printed curves</b>. Not the nearest one — the one in between."]}, {"id": "5.P1", "t": "Springs and neaps · topic 5", "h": "Which curve, and how far between?", "obra": "practica", "forma": "dosMetros", "banco": "pareja", "lienzo": "dosCurvas1", "q": "__TXT__", "pista": "The range decides the shape. The springs curve was drawn for a day of <b>7.6 m</b>, the neaps one for <b>3.1 m</b>. However far between those two your day’s range falls, <b>your curve falls the same way between the two printed ones</b> — and the two days have different ranges, so the two answers cannot be the same.", "cierre": "<b>Why two days?</b> Because one does not tell you apart. Near high water the two printed curves come together, and almost anything lands on the right tenth. There are <b>5</b> ways of getting it wrong — springs on its own, neaps on its own, the one halfway between, the proportion the wrong way round, a straight line — and within an hour and a half of high water <b>an average of 3.6 of those five come out right</b>. Further out the average is still <b>2.8 of the five</b>. On a single day the one who did the step and the one who got lucky hand in the same number. <b>Two days at the same clock time do tell them apart:</b> a shortcut that happens to suit one range does not suit the other, and across these 14 pairs <b>not one of the five gets both days right</b>. That is what the second box is for."}, {"id": "6.S1", "t": "Without the sheet · topic 6", "h": "The one you can do without the book", "obra": "enmarca", "lienzo": "pagina0", "p": ["The curve you have been reading is printed for a <b>standard port</b> — and at a standard port a yacht usually has water to spare. The depth under her was never really the question.", "Where you <em>do</em> put her keel at risk there is no curve printed at all: a cove, a small harbour, a bar, an anchorage off on its own. Nobody prints one for those.", "What you have there is what the book gives for <b>high water and low water</b> — when they turn, and how high they get. And that is enough.", "You have learned the sheet. This topic is for the water that has no curve: <b>not a shortcut for anyone who would rather not draw one</b>, but the only method there is where there is none to draw."]}, {"id": "6.E1", "t": "Without the sheet · topic 6", "h": "The rule of twelfths", "obra": "ejemplo", "pasosDe": "doce", "b": "Next", "p": ["You will not always have a sheet in front of you. <b>Take the stretch from one turn of the tide to the next and cut it into six</b> — those are the «hours» of the rule, and they are sixths of however long that stretch actually is, not hours of the clock.", "And here is what the rule is standing in for: <b>the curve you have been drawing all block</b>. This is not a second method. It is the same method done in your head.", "<b>First hour: one twelfth of the range.</b> The tide has only just turned and it is barely moving.", "<b>Second: two twelfths.</b> Getting on with it now.", "<b>Third and fourth: three twelfths each.</b> Half the range in two hours — this is the middle of the tide, and it is where the water moves fastest.", "<b>Fifth: two again</b>, easing off.", "<b>And the sixth: the last twelfth.</b> One, two, three, three, two, one — that is the whole rule, and it is worth knowing by heart.", "<b>The red bar marks where your staircase leaves the curve furthest behind.</b> That gap is the price of doing it in your head instead of on paper.", "And against the <em>real</em> tide — not the curve, the water — the rule is out by <b>0.17 m on average and 0.48 m at worst</b>. Worst <b>in the middle of the tide</b>, where the water moves fastest and a mistake costs you most; best at the turns, where it barely moves. Knowing <em>where</em> it lets you down is what makes it safe to use."]}, {"id": "6.P1", "t": "Without the sheet · topic 6", "h": "Work it in your head", "obra": "practica", "forma": "doceavos", "banco": "doce", "lienzo": "doce", "q": "__TXT6__", "pista": "Count the sixths from the turn you are starting at, and add up the twelfths as you go: <b>1, 3, 6, 9, 11, 12</b>. Then that many twelfths of the range, on top of low water.", "cierre": "That is the rule, and now you know its limits too."}, {"id": "6.P2", "t": "Without the sheet · topic 6", "h": "And the day the rule lets you down", "obra": "practica", "forma": "eleccion", "banco": "limite", "lienzo": "pagina6", "q": "__TXT__", "pista": "Two things tell you, and both are in front of you: <b>which way the tide is going</b>, and <b>how far the moment sits from a turn</b>. Within an hour of high or low water the rule and the real tide have to meet — they both pass through that same tide. It is in between that they can part.", "cierre": "Every time, the moment you were after was the same kind: <b>on the way up, and well away from the turns</b>. That is not a rule of the sea — it is what <b>this</b> port does. Over the 62 days in this book the day’s worst moment was on a rising tide in <b>all 62</b> of them, and in <b>61</b> it fell two or three hours in; there the rule was out by up to <b>0.53 m</b>, against about <b>0.07 m</b> at the moments you left alone. Somewhere else the tide may lean the other way. What travels is not “distrust the flood”: it is that the rule <b>has</b> a worst moment, that it is the same one day after day in any one port, and that you find out which by measuring it — not by assuming it."}, {"id": "7.P1", "t": "Without the sheet · topic 6", "h": "What this block was for", "obra": "cierre", "p": ["Everything in this block came off <b>one page and one curve</b>. You found the day, read the four figures, drew the day’s line, and walked it both ways: a height at an hour, and the hours for a height.", "And then you learned to do it without the sheet, and — more useful still — <b>when not to</b>.", "<b>Next</b> is the sum this was all for: sounding plus height, less what she draws, less what you want under her. That is the block on what is under the keel."]}];

const PUERTO="Aldern Quay";

const TRAMO=62;
let iPlana=0;

const cabenEnPlana=()=>{
 if(!PG.porCol||!PG.nCol)paginaMaqueta();

 const v=PG.porCol*PG.nCol;
 return (v>0)?v:1;};

let ARR={cabe:0, i:[]};
function arranques(cabe){
 if(ARR.cabe===cabe)return ARR.i;
 const out=[];
 let i=0;
 while(i<PAGINA.length&&out.length<400){
  out.push(i);

  let n=0, cols=0, j=i;
  while(j<PAGINA.length&&cols<PG.nCol){
   const mes=MESES[j];
   let m=0;
   while(j+m<PAGINA.length&&MESES[j+m]===mes)m++;
   const nc=Math.max(1,Math.ceil(m/PG.porCol));
   for(let k=0;k<nc&&cols<PG.nCol;k++){
    const a=Math.floor(k*m/nc), b=Math.floor((k+1)*m/nc);
    if(b>a){n+=b-a; cols++;}}
   j+=m;}
  if(n<=0)break;
  i+=n;}
 ARR={cabe:cabe, i:out};
 return out;}
const arranqueDe=(k,cabe)=>{
 const a=arranques(cabe);
 return a[Math.max(0,Math.min(a.length-1,k))];};
const nPlanas=()=>Math.max(1,arranques(cabenEnPlana()).length);

const planaDe=d=>{
 const a=arranques(cabenEnPlana());
 let k=0;

elongs to this port", "mal": ["yes, all ports have the same shape", "yes, if the ports are on the same coast", "only for ports with the same range"]}, {"id": "cur-09", "txt": "At Aldern Quay the two curves are furthest apart <b>0.9 m</b> on a big day. <b>What does that mean for you?</b>", "bien": "taking the wrong curve costs you that much water", "mal": ["the two curves are near enough the same", "the tide is 0.9 m higher on springs", "the range changes by that much through the fortnight"]}, {"id": "cur-10", "txt": "<b>Where on the curve is low water?</b>", "bien": "at the bottom, six hours either side", "mal": ["at the left-hand edge of the box", "it is not on the curve at all", "halfway down, at the middle"]}, {"id": "cur-11", "txt": "The height axis is marked <b>in tenths</b>. <b>Why bother?</b>", "bien": "so a height you have worked out can be found on it", "mal": ["to show how accurate the prediction is", "because the almanac prints heights in tenths", "to make the curve easier to draw"]}, {"id": "cur-12", "txt": "<b>What do you need before the curve is any use?</b>", "bien": "the day's high and low water, from the table", "mal": ["the range of springs and neaps for the port", "the time you want, and nothing else", "the depth of water where you are"]}, {"id": "cur-13", "txt": "The springs curve of this port falls <b>faster at first</b> than the neaps one. <b>What is that telling you?</b>", "bien": "a big tide moves more water in the same six hours", "mal": ["springs last longer than neaps", "springs happen earlier in the day", "the curve is drawn wrong for neaps"]}, {"id": "cur-14", "txt": "<b>What is the curve NOT going to tell you?</b>", "bien": "whether there is enough water for your boat", "mal": ["the height of tide at a time you choose", "the time at which a height is reached", "how the water moves between the turns"]}];

  let n=0;
  while(i+n<d1&&MESES[i+n]===mes)n++;

  const nc=Math.max(1,Math.ceil(n/PG.porCol));
  for(let k=0;k<nc&&out.length<PG.nCol;k++){
   const a=i+Math.floor(k*n/nc), b=i+Math.floor((k+1)*n/nc);
   const col=[];
   for(let j=a;j<b;j++)col.push(j);
   if(col.length)out.push(col);}
  i+=n;}
 return out;}

let CV={};
function curvaMaqueta(){
 const x0=HOJA.x0+px(52), x1=HOJA.x1-px(20);

 const y0=HOJA.y0+px(46), y1=HOJA.y1-px(58);
 CV={x0:x0,x1:x1,y0:y0,y1:y1,an:x1-x0,al:y1-y0};
 return CV;}

const cX=h=>CV.x0+((h+CURVA_ALA)/(2*CURVA_ALA))*CV.an;
const cY=f=>CV.y1-f*CV.al;

function factorEn(c,h){
 const x=(h+CURVA_ALA)/CURVA_PASO, i=Math.floor(x), p=c.pts;
 if(i<0)return p[0];
 if(i>=p.length-1)return p[p.length-1];
 return p[i]+(p[i+1]-p[i])*(x-i);}

function trazaCurva(c,col,gruesa){
 let d="";
 for(let k=0;k<c.pts.length;k++){
  const h=-CURVA_ALA+k*CURVA_PASO;
  d+=(d?"L":"M")+cX(h).toFixed(1)+","+cY(c.pts[k]).toFixed(1);}
 el("path",{d:d,fill:"none",stroke:col,"stroke-width":px(gruesa?2.4:1.8),
  "stroke-linejoin":"round"});}

function trazaCurvaDia(rango,col,gruesa){
 let d="";
 for(let k=0;k<CURVA_VIVAS.pts.length;k++){
  const h=-CURVA_ALA+k*CURVA_PASO;
  d+=(d?"L":"M")+cX(h).toFixed(1)+","+cY(factorDelDia(rango,h)).toFixed(1);}
 el("path",{d:d,fill:"none",stroke:col,"stroke-width":px(gruesa?2.6:2),
  "stroke-linejoin":"round","stroke-dasharray":px(7)+" "+px(4)});}

function pildora(x,y,s,col,an){

 el("rect",{x:x-(an=="end"?w:0),y:y-h/2,width:w,height:h,rx:h/2,
  fill:col||COL.magenta});
 cifra(x+(an=="end"?-w/2:w/2),y+px(tam*0.35),s,tam,"#FFFFFF","middle");
 return w;}

 if(o.alturas){

 if(o.vivas)trazaCurva(CURVA_VIVAS,COL.escrito,o.resalta=="vivas");
 if(o.muertas)trazaCurva(CURVA_MUERTAS,COL.magentaS,o.resalta=="muertas");

 if(o.curvaDia)trazaCurvaDia(o.rangoDia,COL.azul,true);

 let yL=CV.y0+px(TAM.rot+14);

 if(o.vivas){

 if(o.muertas)

   "neaps · "+un(CURVA_MUERTAS.rango)+" m");

 if(o.separa){
  let peor=0, hP=0;
  for(let k=0;k<CURVA_VIVAS.pts.length;k++){
   const d=Math.abs(CURVA_VIVAS.pts[k]-CURVA_MUERTAS.pts[k]);

  const x=cX(hP);

  pildora(x+px(9),(cY(factorEn(CURVA_VIVAS,hP))
    +cY(factorEn(CURVA_MUERTAS,hP)))/2,
   un(peor*CURVA_VIVAS.rango)+" m",COL.rojo);}

 if(o.rangoDia!==undefined&&o.pilDia){
  let yD=CV.y0+px(TAM.rot+14);
  pildora(CV.x0+px(10),yD,"this day \u00b7 "+un(o.rangoDia)+" m",COL.azul);
  if(o.prop){

    u2.toFixed(2)+" of the way from neaps",COL.azul);}}

 rotulo(HOJA.x0+px(10),HOJA.y0+px(10+TAM.rot),
  o.titulo||"the curve the almanac prints",COL.suave);}

let HJ={};

let HOJ={hw:null, lw:null, t:0};

const hojaVacia=t0=>({hw:null, lw:null, t:t0, alt:null, t2:null});

function hojaMaqueta(caso){
 const anPx=(HOJA.x1-HOJA.x0)*ESC;

 const estrecha=anPx<660;
 const x0=HOJA.x0+px(14), x1=HOJA.x1-px(12), hueco=px(16);
 const util=(x1-x0)-hueco;
 const anA=util*(estrecha?0.52:0.40);

 const y0=HOJA.y0+px(50), y1=HOJA.y1-px(44);

 let hMin=0, hMax=Math.ceil((NIVELES.MHWS+0.6)*2)/2;
 if(caso){
  hMin=Math.floor((caso.lw-0.5)*2)/2;
  hMax=Math.ceil((caso.hw+0.5)*2)/2;}
 HJ={ax0:x0, ax1:x0+anA, bx0:x0+anA+hueco, bx1:x1, y0:y0, y1:y1,
     al:y1-y0, an:anA, hMin:hMin, hMax:hMax, estrecha:estrecha,
     pxM:(anA*ESC)/(hMax-hMin)};
 return HJ;}

const hX=m=>HJ.ax0+((m-HJ.hMin)/(HJ.hMax-HJ.hMin))*(HJ.ax1-HJ.ax0);
const hM=x=>HJ.hMin+((x-HJ.ax0)/(HJ.ax1-HJ.ax0))*(HJ.hMax-HJ.hMin);
const tX=h=>HJ.bx0+((h+CURVA_ALA)/(2*CURVA_ALA))*(HJ.bx1-HJ.bx0);
const tH=x=>-CURVA_ALA+((x-HJ.bx0)/(HJ.bx1-HJ.bx0))*2*CURVA_ALA;
const fY=f=>HJ.y1-f*HJ.al;

function factorDelDia(rango,dhw){
 const rv=CURVA_VIVAS.rango, rm=CURVA_MUERTAS.rango;
 const fv=factorEn(CURVA_VIVAS,dhw), fm=factorEn(CURVA_MUERTAS,dhw);
 if(rv<=rm)return fv;
 const u=Math.max(0,Math.min(1,(rango-rm)/(rv-rm)));
 return fm+(fv-fm)*u;}
const alturaHoja=(hw,lw,dhw)=>lw+factorDelDia(hw-lw,dhw)*(hw-lw);

const DOCE_ACUM=[0,1,3,6,9,11,12];
function porDoceavos(bajo,alto,u){
 u=Math.max(0,Math.min(1,u));
 const x=u*6, i=Math.min(5,Math.floor(x)), f=x-i;
 const doce=DOCE_ACUM[i]+(DOCE_ACUM[i+1]-DOCE_ACUM[i])*f;
 return bajo+(alto-bajo)*doce/12;}

function horasDeAltura(pleamar,bajamar,altura){
 const rango=pleamar-bajamar;
 if(rango<=0)return null;
 const f=(altura-bajamar)/rango;
 if(!(f>0.02&&f<0.98))return null;
 const out=[];
 for(const par of [[-CURVA_ALA,0],[0,CURVA_ALA]]){
  let a=par[0], b=par[1];
  let fa=factorDelDia(rango,a)-f, fb=factorDelDia(rango,b)-f;
  if(fa*fb>0)return null;
  for(let k=0;k<60;k++){
   const m=(a+b)/2, fm=factorDelDia(rango,m)-f;
   if(fa*fm<=0){b=m; fb=fm;} else {a=m; fa=fm;}}
  out.push(Math.round((a+b)/2*10000)/10000);}
 return out;}

const porVivas=rango=>{
 const rv=CURVA_VIVAS.rango, rm=CURVA_MUERTAS.rango;
 return rv<=rm?1:Math.max(0,Math.min(1,(rango-rm)/(rv-rm)));};

function horaDicha(d){
 const m=Math.round(Math.abs(d)*60);
 if(m===0)return "HW";
 return (d<0?"−":"+")+Math.floor(m/60)+"h"+String(m%60).padStart(2,"0");}

const IMAN=0.2;
const iman=(v,diana)=>Math.abs(v-diana)<IMAN?diana:v;

 else{
  el("path",{d:"M"+x+","+(y+s)+"L"+(x-s)+","+(y+l)+"L"+(x+s)+","+(y+l)+"Z",
   fill:c});
  cifra(x,y+l+px(11),etq,TAM.rot,c,"middle");}}

 o=o||{};

 hojaMaqueta(q);

 for(const [a,b] of [[HJ.ax0,HJ.ax1],[HJ.bx0,HJ.bx1]])

 const rotula05=false;

 for(let i=Math.ceil(HJ.hMin*2);i<=Math.round(HJ.hMax*2);i++){

 el("rect",{x:HJ.ax0,y:HJ.y0,width:HJ.an,height:HJ.al,fill:"none",

 rotulo(HJ.ax0,HJ.y0-px(30),"hw hts  m",COL.escrito);

 for(let k=Math.ceil(-CURVA_ALA*4);k<=Math.floor(CURVA_ALA*4);k++){

  cifra(x,HJ.y1+px(TAM.rot+5),h===0?"HW":(h>0?"+"+h:""+h),TAM.rot,COL.suave,

 for(let f=0;f<=1.001;f+=0.25)
  el("line",{x1:HJ.ax0,y1:fY(f),x2:HJ.bx1,y2:fY(f),
   stroke:COL.rayaPapel,"stroke-width":px(1)});
 el("rect",{x:HJ.bx0,y:HJ.y0,width:HJ.bx1-HJ.bx0,height:HJ.al,fill:"none",
  stroke:COL.escrito,"stroke-width":px(1.4)});
 rotulo(HJ.bx1,HJ.y1+px(36),"hours from high water",COL.escrito,"end");

 const traza=(c,col,gr,rayas)=>{

  const a={d:d,fill:"none",stroke:col,"stroke-width":px(gr),

 traza(CURVA_VIVAS,COL.suave,1.3,false);
 traza(CURVA_MUERTAS,COL.suave,1.3,true);

 const rCurva=(o.rangoCurva!==undefined)?o.rangoCurva:(q?q.rango:null);
 if(q&&rCurva!==null){
  const sel=o.curvaSel||"auto";
  const u=sel=="sp"?1:sel=="np"?0:porVivas(rCurva);

 rotulo(HJ.bx0+px(4),HJ.y0-px(5),"— springs   ·· neaps",COL.suave);

 let leido=null;

 if(o.modo!="hora"&&hayRecta&&t!==null&&t!==undefined&&st>=5&&q&&rCurva!==null){
  const f=factorDelDia(rCurva,t);

  if(st>=7){el("line",Object.assign({x1:xh,y1:y,x2:xr,y2:y},raya));

   if(o.lee)pildora(xr,HJ.y0+px(46),un(leido)+" m",COL.ocre);}}

function enunciadoVentana(c){
 return "You draw <b>"+un(c.calado)+" m</b> and you want <b>"+un(c.resguardo)
  +" m</b> under the keel. The chart shows <b>"+un(c.sonda)+" m</b> over the bar. "
  +"On <b>"+c.fecha+"</b> high water is <b>"+un(c.hw)+" m</b> at <b>"
  +hhmm(c.hwMin)+"</b>, with low waters of <b>"+un(Math.min(c.lw,c.lwOtra))
  +" m</b> and <b>"+un(Math.max(c.lw,c.lwOtra))+" m</b> either side of it. "
  +"<b>Between what times can you cross?</b>";}

function enunciadoPar(c){
 const dia=x=>"On <b>"+x.fecha+"</b> high water is <b>"+un(x.hw)+" m</b> at <b>"
  +hhmm(x.hwMin)+"</b>, and the low water <b>"
  +(x.lado=="antes"?"before":"after")+"</b> it is <b>"+un(x.lw)+" m</b>. ";
 return dia(c)+dia(c.par)
  +"The clock reads <b>"+hhmm(c.min)+"</b> on both days. Work out where each one "
  +"sits between the two printed curves, and read the height of tide for each.";}

function enunciado(c,manda){
 return "On <b>"+c.fecha+"</b> high water is <b>"+un(c.hw)+" m</b> at <b>"
  +hhmm(c.hwMin)+"</b>, and the low water <b>"
  +(c.lado=="antes"?"before":"after")+"</b> it is <b>"+un(c.lw)+" m</b>. "
  +manda+" and read the height of tide at <b>"+hhmm(c.min)+"</b>.";}

function opsDe(q){
 const r=tiradaDe(q.id);
 const ops=[{t:q.bien,ok:true}].concat(q.mal.map(m=>({t:m,ok:false})));
 for(let i=ops.length-1;i>0;i--){const j=Math.floor(r()*(i+1));
  const t=ops[i]; ops[i]=ops[j]; ops[j]=t;}
 return ops;}

const TOL_H=0.1001, TOL_T=0.1251;

function diagnostico(c,m){
 if(m.hw===null||m.lw===null)
  return "Put <b>high water</b> and <b>low water</b> on first. Without both of "
   +"them the sheet has no sloping line, and without that line there is nothing "
   +"to read a height off.";
 if(m.t===null)
  return "The two heights are on. Now <b>go in at the hour</b>, along the bottom "
   +"of the right-hand box.";
 const dH=Math.abs(m.hw-c.hw), dL=Math.abs(m.lw-c.lw), dT=Math.abs(m.t-c.dhw);

 if(Math.abs(m.hw-c.rango)<=TOL_H&&dH>TOL_H)
  return "You have marked <b>"+un(c.rango)+" m</b> on the top edge — that is the "
   +"<b>range</b>, not the height of high water. The range is how far the water "
   +"moves; the mark goes at the height itself, <b>"+un(c.hw)+" m</b>. The range "
   +"is what the <em>gap between your two marks</em> is for.";

 if(Math.abs(m.hw-c.lw)<=TOL_H&&Math.abs(m.lw-c.hw)<=TOL_H)
  return "You have them <b>the other way round</b>. The taller figure goes on the "
   +"<b>top</b> edge and the shorter one on the bottom — your line is sloping the "
   +"wrong way, and every fraction of the curve is coming out upside down.";

 if(c.hwOtra!==null&&c.hwOtra!==undefined&&Math.abs(m.hw-c.hwOtra)<=TOL_H&&dH>TOL_H)
  return "That is the day\u2019s <b>other</b> high water, the one at <b>"
   +hhmm(c.hwOtraMin)+"</b>. The one that governs <b>"+hhmm(c.min)+"</b> is <b>"
   +un(c.hw)+" m</b> at <b>"+hhmm(c.hwMin)+"</b>.";

 if(c.lwOtra!==null&&c.lwOtra!==undefined&&Math.abs(m.lw-c.lwOtra)<=TOL_H&&dL>TOL_H)
  return "That is the day\u2019s <b>other</b> low water. The one that governs is "
   +"the one <b>"+(c.lado=="antes"?"before":"after")+"</b> high water, <b>"
   +un(c.lw)+" m</b> — you work with the two tides that <em>bracket</em> the hour "
   +"you are asked about.";

 if(dH>TOL_H)
  return "Your high water mark is at <b>"+un(m.hw)+" m</b>, and the table says <b>"
   +un(c.hw)+" m</b>. It goes on the <b>top edge</b>, at its height in metres.";
 if(dL>TOL_H)
  return "Your low water mark is at <b>"+un(m.lw)+" m</b>, and the table says <b>"
   +un(c.lw)+" m</b>. It goes on the <b>bottom edge</b>.";

 if(Math.abs(m.t+c.dhw)<=TOL_T&&dT>TOL_T)
  return "Right distance, <b>wrong side of high water</b>. <b>"+hhmm(c.min)
   +"</b> is "+(c.dhw>0?"<b>after</b>":"<b>before</b>")+" high water at <b>"
   +hhmm(c.hwMin)+"</b>, so you go in on the <b>"+(c.dhw>0?"+":"\u2212")
   +"</b> side of the scale.";

 const reloj=c.min/60;
 if(reloj<=CURVA_ALA&&Math.abs(m.t-reloj)<=0.3&&dT>TOL_T)
  return "You have gone in at <b>"+hhmm(c.min)+"</b> — the time on the clock. The "
   +"bottom scale counts <b>hours from high water</b>, and high water is at <b>"
   +hhmm(c.hwMin)+"</b>.";

 if(dT>TOL_T)
  return "Your hour mark is at <b>"+horaDicha(m.t)+"</b>. <b>"+hhmm(c.min)
   +"</b> is <b>"+horaDicha(c.dhw)+"</b> from high water at <b>"+hhmm(c.hwMin)
   +"</b> — work that gap out on the clock first, then go in with it.";
 return null;}

function diagnostico4(c,m){
 if(m.hw===null||m.lw===null)
  return "Put <b>high water</b> and <b>low water</b> on first. Without both of "
   +"them the sheet has no sloping line, and without that line the height you "
   +"need has nothing to cross.";
 const dH=Math.abs(m.hw-c.hw), dL=Math.abs(m.lw-c.lw);

 if(Math.abs(m.hw-c.rango)<=TOL_H&&dH>TOL_H)
  return "You have marked <b>"+un(c.rango)+" m</b> on the top edge — that is the "
   +"<b>range</b>, not the height of high water. The mark goes at the height "
   +"itself, <b>"+un(c.hw)+" m</b>.";
 if(Math.abs(m.hw-c.lw)<=TOL_H&&Math.abs(m.lw-c.hw)<=TOL_H)
  return "You have them <b>the other way round</b>. The taller figure goes on the "
   +"top edge and the shorter one on the bottom.";
 if(c.hwOtra!==null&&c.hwOtra!==undefined&&Math.abs(m.hw-c.hwOtra)<=TOL_H&&dH>TOL_H)
  return "That is the day\u2019s <b>other</b> high water, the one at <b>"
   +hhmm(c.hwOtraMin)+"</b>.";

 if(c.lwOtra!==null&&c.lwOtra!==undefined&&Math.abs(m.lw-c.lwOtra)<=TOL_H&&dL>TOL_H)
  return "That is the day\u2019s <b>other</b> low water. A window crosses high "
   +"water, so it touches both of them \u2014 and you draw the line to the "
   +"<b>lower</b> one, <b>"+un(c.lw)+" m</b>. That way the window comes out "
   +"<em>shorter</em> than the truth, which is the error you want to have.";
 if(dH>TOL_H)
  return "Your high water mark is at <b>"+un(m.hw)+" m</b>, and the table says <b>"
   +un(c.hw)+" m</b>.";
 if(dL>TOL_H)
  return "Your low water mark is at <b>"+un(m.lw)+" m</b>, and the lower of the two "
   +"low waters is <b>"+un(c.lw)+" m</b>.";

 if(m.alt===null||m.alt===undefined)
  return "Now mark <b>the height you need</b> on the metres scale \u2014 that is "
   +"what you go in with, and it is the one figure here that is not printed on the "
   +"page: it comes out of your own subtraction.";
 if(Math.abs(m.alt-c.hw)<=TOL_H||Math.abs(m.alt-c.lw)<=TOL_H)
  return "You have marked a figure off the <b>table</b>. The height you go in with "
   +"is the one <em>you</em> work out: what she draws, plus the safety margin you "
   +"want, "
   +"less the charted sounding. Here that is <b>"+un(c.pide)+" m</b>.";
 if(Math.abs(m.alt-c.pide)>TOL_H)
  return "Your height mark is at <b>"+un(m.alt)+" m</b>. Work it out again: <b>"
   +un(c.calado)+" m</b> she draws, plus a <b>"+un(c.resguardo)+" m</b> safety "
   +"margin, "
   +"less the <b>"+un(c.sonda)+" m</b> on the chart \u2014 <b>"+un(c.pide)+" m</b>.";

 const puestas=[m.t,m.t2].filter(x=>x!==null&&x!==undefined);
 if(puestas.length<2)
  return "One mark is not an answer here. <b>The tide passes that height twice</b> "
   +"\u2014 once on the way up and once on the way down \u2014 and the two of them "
   +"are the ends of your window. Look at where your line across meets the curve: "
   +"it meets it <em>twice</em>.";
 const lo=Math.min(m.t,m.t2), hi=Math.max(m.t,m.t2);
 if(lo>=0||hi<=0)
  return "Both of your marks are on the <b>same side</b> of high water. One of them "
   +"is on the way up and the other on the way down: the curve crosses your line "
   +"once before high water and once after it.";
 const dLo=Math.abs(lo-c.t1), dHi=Math.abs(hi-c.t2);

 if((Math.abs(hi+lo)<=TOL_T&&dHi>TOL_T)||(Math.abs(lo+hi)<=TOL_T&&dLo>TOL_T))
  return "You have taken the second one as the <b>mirror</b> of the first. It is "
   +"not: the tide here falls faster than it rises, so the second crossing sits "
   +"<b>"+horaDicha(Math.abs(c.t2)-Math.abs(c.t1))+"</b> nearer high water than the "
   +"first. Both have to be <em>read off the curve</em>.";
 if(dLo>TOL_T)
  return "The first crossing \u2014 on the way up \u2014 is out. Yours is at <b>"
   +horaDicha(lo)+"</b> from high water; follow your line across to where it first "
   +"meets the curve and drop straight down.";
 if(dHi>TOL_T)
  return "The second crossing \u2014 on the way down \u2014 is out. Yours is at <b>"
   +horaDicha(hi)+"</b> from high water.";
 return null;}

window.compruebo=dado=>{
 if(PR2.esp||PR2.hecho)return;
 const s=S(), q=PR2.q, F=forma(s);

 if(s.forma=="ventana"){
  const m={hw:HOJ.hw, lw:HOJ.lw, alt:HOJ.alt, t:HOJ.t, t2:HOJ.t2};
  const fallo=diagnostico4(q,m);
  if(fallo){

   const faltan=(m.hw===null||m.lw===null||m.alt===null
     ||m.t===null||m.t===undefined||m.t2===null||m.t2===undefined);
   if(faltan){ PRFB='<div class="res no">'+fallo+'</div>'; dibuja(); return;}
   PR2.corregido=true;
   prFalla(s,fallo);
   anota(un(m.alt)+" -> "+horaDicha(m.t)+"/"+horaDicha(m.t2),false);
   dibuja(); return;}
  PR2.fallos=0; PRFB=""; PR2.corregido=false;
  const hh=x=>hhmm(Math.round((q.hwMin+x*60+1440*2)%1440));
  const dur=q.t2-q.t1;
  anota(hh(q.t1)+"-"+hh(q.t2),true);
  prCuenta();
  PRFB='<div class="res si">That is it. Your window is <b>'+hh(q.t1)+' to '
   +hh(q.t2)+'</b> \u2014 '+Math.floor(dur)+'h'
   +String(Math.round((dur%1)*60)).padStart(2,"0")+' of water.</div>';
  dibuja(); return;}
 if(s.forma=="trazado"){
  const c=(s.lienzo=="traza2")?q.par:q;
  const m={hw:HOJ.hw, lw:HOJ.lw, t:HOJ.t};
  const fallo=diagnostico(c,m);
  if(fallo){

   if(m.hw===null||m.lw===null||m.t===null){
    PRFB='<div class="res no">'+fallo+'</div>'; dibuja(); return;}

   PR2.corregido=true;
   prFalla(s,fallo);
   anota(un(m.hw)+"/"+un(m.lw)+"/"+horaDicha(m.t),false);
   dibuja(); return;}

  PR2.fallos=0; PRFB=""; PR2.corregido=false;
  anota(prBien(q,s),true);
  prCuenta();
  PRFB='<div class="res si">That is it. Your sheet reads <b>'
   +prBien(q,s)+' m</b>.</div>';
  dibuja(); return;}

 if(s.forma=="dosMetros"){
  const w=F.norma(dado!==undefined?dado:prLee2());
  if(w===null){ prFalla(s,F.mal); dibuja(); return; }
  const P=prBien(q,s);
  const b1=Math.abs(+w[0]-+P[0])<=0.1001, b2=Math.abs(+w[1]-+P[1])<=0.1001;
  if(!b1||!b2){
   const cual=(b1!==b2)
    ?" The <b>"+(b1?q.par.fecha:q.fecha)+"</b> one is out."
    :" Both of them are out.";

   const igual=(w[0]===w[1])
    ?" You have put the <b>same height</b> on both days. The clock reads the same on "
     +"both, but the ranges do not \u2014 <b>"+un(q.rango)+" m</b> and <b>"
     +un(q.par.rango)+" m</b>. The two printed curves are the same every day; where "
     +"your day sits between them is not.":"";
   prFalla(s,"<b>"+F.eco(w)+"</b> is not it."+cual+igual);
   anota(w.join("/"),false); dibuja(); return;}
  PR2.fallos=0; PRFB="";
  anota(w.join("/"),true);
  prCuenta();
  PRFB='<div class="res si">That is it \u2014 <b>'+P[0]+' m</b> and <b>'+P[1]
   +' m</b>. Same clock, <b>'+un(Math.abs(+P[0]-+P[1]))+' m</b> apart.</div>';
  dibuja(); return;}
 const v=F.norma(dado!==undefined?dado:prLee());
 if(v===null){ prFalla(s,F.mal); dibuja(); return; }

 const B=prBien(q,s);
 if(F.casi?!F.casi(v,B):(v!==B)){

  if(q.dia===undefined){
   prFalla(s,"<b>"+F.eco(v,q)+"</b> is not what the curve is doing.");
   anota(v,false); dibuja(); return;}

  if(s.forma=="doceavos"){
   const d=+v-+B;
   const doce=Math.round((+v-q.lw)/(q.hw-q.lw)*12*10)/10;
   let f=" You are <b>"+Math.abs(d).toFixed(1)+" m</b> "+(d>0?"high":"low")+".";
   if(+v>q.hw+0.05||+v<q.lw-0.05)
    f=" That is outside the stretch altogether: it runs from <b>"+un(q.lw)
      +" m</b> to <b>"+un(q.hw)+" m</b>.";
   else
    f+=" You have <b>"+doce.toFixed(1)+" twelfths</b> of the range; count them up "
      +"again \u2014 <b>1, 3, 6, 9, 11, 12</b> at the end of each hour.";
   prFalla(s,"<b>"+F.eco(v,q)+"</b> is not it."+f);
   anota(v,false); dibuja(); return;}
  if(s.forma=="metros"){
   const c=(s.lienzo=="hoja2")?q.par:q;
   const d=+v-+B;
   let f=" You are <b>"+Math.abs(d).toFixed(1)+" m</b> "+(d>0?"high":"low")+".";
   if(+v>c.hw+0.05||+v<c.lw-0.05)
    f=" That is outside the day altogether: the tide never goes above <b>"
      +un(c.hw)+" m</b> nor below <b>"+un(c.lw)+" m</b> today.";
   else if(Math.abs(d)>0.8)
    f+=" Check the hour you went in with — it is the gap <b>from high "
      +"water</b>, not the time on the clock.";
   prFalla(s,"<b>"+F.eco(v,q)+"</b> is not it."+f);
   anota(v,false); dibuja(); return;}

  if(q.momentos){
   const dicho=F.eco(v,q);

   const m=q.momentos.filter(x=>x.op===opsDe(q)[+v].t)[0];
   let g="";
   if(m&&!m.sube)
    g=" That one is on a <b>falling</b> tide. Here the rule follows the water down "

function semillaDe(s){let h=2166136261>>>0;
 for(let i=0;i<s.length;i++){h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0;}
 return h||1;}
