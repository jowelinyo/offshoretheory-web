"use strict";
const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

const PZ=[{"t": "Two lines cross", "s": [{"id": "1.S1", "h": "A second line, and one place left", "v": [3732.5, 2726.0, 7545], "mk": [[5010.0, 725.0, 70], [6603.0, 4590.0, 70]], "lns": [[5010.0, 725.0, 4580.0, 2660.0, "Brough Tower 011", ""], [6603.0, 4590.0, 4580.0, 2660.0, "Wardhill Tower 132", ""]], "fix": [[4580.0, 2660.0, "", ""]], "p": ["<b>Part 1 left you on a line.</b> One bearing of one object, drawn back out of it, and you were somewhere along it &mdash; with the rest of the chart ruled out and no way of saying which part of the line was you.", "<b>So take a second bearing, of a different object.</b> Here they are: <b>Brough Tower</b> bears <b>011</b>, <b>Wardhill Tower</b> bears <b>132</b>. Two objects, two readings, two lines drawn back out of the towers.", "<b>You are somewhere on the first line, and you are somewhere on the second one too.</b> There is exactly one place on this chart that is both &mdash; the point where they cross. That point is a <b>fix</b>, and it is the whole of what this part is about.", "<i>Look at where the two lines come from. From here on they will be drawn the way you draw them on the chart table: coming in from off the edge of what you are looking at, and crossing in front of you.</i>"], "b": "Next"}, {"id": "1.E1", "h": "Two bearings, one fix", "v0": [4580.0, 2660.0, 2100], "v": [4580.0, 2660.0, 2100], "p": ["<b>Same two towers, and now close in on the water you are actually in.</b> Neither tower is on this screen &mdash; Brough Tower is 2.9 miles away off the top, Wardhill Tower is 4.2 miles off to the south-east. What is on the screen is the sea you are floating in, and the two lines coming into it."], "b": "Next", "pasos": [{"t": "<b>First bearing, and write it down before you draw anything.</b> Wardhill Tower, hand bearing compass, corrected to true: <b>132</b>. Time <b>1015</b>, log <b>24.6</b>.<br><br>Drawn back out of the tower it gives you this line. <i>You are somewhere on it, and that is all it says &mdash; the tower it comes from is four miles off the bottom right of the screen.</i>", "calc": "Wardhill Tower &nbsp;&middot;&nbsp; <b>132</b> &nbsp;&middot;&nbsp; 1015 &nbsp;&middot;&nbsp; log 24.6", "lns": [[5665.3, 3695.4, 3494.7, 1624.6, "Wardhill Tower 132", ""]]}, {"t": "<b>Second bearing, a minute later.</b> Brough Tower: <b>011</b>. Time <b>1016</b>, log <b>24.7</b> &mdash; the log has moved <b>0.1 of a mile</b>, because at 5 knots that is what a minute is worth.<br><br>Two lines now, and they cross once.", "calc": "Brough Tower &nbsp;&middot;&nbsp; <b>011</b> &nbsp;&middot;&nbsp; 1016 &nbsp;&middot;&nbsp; log 24.7", "lns": [[5665.3, 3695.4, 3494.7, 1624.6, "Wardhill Tower 132", ""], [4905.4, 1195.7, 4254.6, 4124.3, "Brough Tower 011", ""]]}, {"t": "<b>That crossing is your position at 1016.</b> Mark it with a dot, put a circle round it so it is not mistaken for anything else, and write the time and the log beside it: <b>1016, log 24.7</b>.<br><br><i>The time is not decoration. A fix is only true at the moment you took it &mdash; ten minutes from now this dot is 0.83 of a mile of history, and the log beside it is what lets you do something about that.</i>", "calc": "fix &nbsp;&middot;&nbsp; <b>1016</b> &nbsp;&middot;&nbsp; log 24.7", "lns": [[5665.3, 3695.4, 3494.7, 1624.6, "Wardhill Tower 132", ""], [4905.4, 1195.7, 4254.6, 4124.3, "Brough Tower 011", ""]], "fix": [[4580.0, 2660.0, "1016 · log 24.7", ""]]}, {"t": "<b>And look at the angle they make: 59 degrees.</b> They meet nearly square, and that is not luck: <b>you are in the water where this chart's three towers work best together</b>, which is why the next two topics happen here as well.<br><br><i>Why that matters is the next topic. For now, notice that the crossing is sharp: you can see exactly where it is, to within the thickness of a pencil.</i>", "calc": "angle of cut &nbsp;&middot;&nbsp; <b>58.9&deg;</b>", "lns": [[5665.3, 3695.4, 3494.7, 1624.6, "Wardhill Tower 132", "", 0.2], [4905.4, 1195.7, 4254.6, 4124.3, "Brough Tower 011", "", 0.2]], "fix": [[4580.0, 2660.0, "1016 · log 24.7", ""]], "arco": [[4580.0, 2660.0, 10.928786833564402, 312.05226227048837, "59°"]]}]}, {"id": "1.S2", "h": "Two lines are not a check", "v": [4580.0, 2660.0, 2100], "lns": [[5665.3, 3695.4, 3494.7, 1624.6, "Wardhill Tower 132", "", 0.2], [4905.4, 1195.7, 4254.6, 4124.3, "Brough Tower 011", "", 0.2], [4892.6, 1096.9, 3989.0, 3957.5, "Brough Tower 016 — 5° out", "mala", 0.85]], "fix": [[4580.0, 2660.0, "1016 · log 24.7", ""], [4440.8, 2527.2, "the same fix, 5° out", "malo"]], "p": ["<b>Now suppose the bearing of Brough Tower was five degrees out.</b> Not a blunder &mdash; five degrees is a bit of heel, a lump of iron near the compass, or a sight taken in a hurry. At 2.9 miles, one degree is <b>95 metres</b>, so five is worth about a quarter of a mile.", "<b>The faint line is the one you would have drawn.</b> It still comes out of the tower, it still crosses the Wardhill Tower line, and it still gives you a crossing &mdash; <b>529 metres from the real one</b>.", "<b>Here is what should worry you.</b> The false crossing is in open water, in the same depth as the true one, with nothing near it. It looks exactly as convincing. <i>Nothing on this chart tells you which of the two dots you are standing on.</i>", "<b>Two lines give you a position. They do not give you a check.</b> Two lines always cross somewhere, and they cross just as neatly when one of them is wrong. <i>To catch a bad line you need a third one &mdash; and what that third line does when they disagree is topic 3.</i>"], "b": "Next"}, {"id": "1.P1", "h": "Put your finger on the fix", "t": "click", "v": [4580.0, 2660.0, 2100], "lns": [[4905.4, 1195.7, 4254.6, 4124.3, "Brough Tower 011", ""], [5665.3, 3695.4, 3494.7, 1624.6, "Wardhill Tower 132", ""]], "sfix": [260, "Brough Tower", "Wardhill Tower"], "ay": "Click the point where the two lines cross.", "p": ["<b class='q'>Two bearings, both drawn. Where are you?</b>", "Brough Tower bears <b>011</b> and Wardhill Tower bears <b>132</b>, both taken within the minute. <i>Put your finger on the one place that is on both lines.</i>"], "b": "Next", "hizo": "fixed where two bearings cross"}]}, {"t": "The angle of cut", "s": [{"id": "2.S1", "h": "Every line is a band", "v": [4580.0, 2660.0, 2100], "lns": [[5665.3, 3695.4, 3494.7, 1624.6, "Wardhill Tower 132", "", 0.2], [4905.4, 1195.7, 4254.6, 4124.3, "Brough Tower 011", "", 0.2]], "fix": [[4580.0, 2660.0, "1016 · log 24.7", ""]], "romb": [[4580.0, 2660.0, 10.93, 34.6, 132.05, 48.8, "469 m — 275 m", 1]], "p": ["<b>You crossed two lines and marked the point. Now look at the point again.</b> Neither of those lines is a hairline. A bearing goes through an eye, a compass and two corrections, and part 1 measured what one degree of it is worth on this chart: <b>32 metres at one mile, 97 at three</b>.", "<b>So a line of position is really a band.</b> Brough Tower was <b>2.94 miles</b> off, so one degree either side of that bearing is a band <b>95 metres</b> wide each way; Wardhill Tower, at <b>4.15 miles</b>, gives <b>134 metres</b>. You are somewhere inside the first band, and somewhere inside the second one.", "<b>And two bands crossing do not make a point. They make a rhombus.</b> That is the shaded shape round your dot, and it measures <b>469 metres</b> the long way by <b>275 metres</b> the short way. <i>The dot is where two pencil lines happened to cross. The rhombus is where you actually are.</i>", "<b>Nothing here is a mistake.</b> Both bearings are as good as a careful navigator takes them, and the bands are what careful looks like. What this topic is about is the thing that decides how big and how long that rhombus comes out &mdash; <b>and it is not how many lines you crossed.</b>"], "b": "Next"}, {"id": "2.E1", "h": "The same error, two different cuts", "v0": [4580.0, 2660.0, 2100], "v": [4580.0, 2660.0, 2100], "p": ["<b>The same two towers, twice, from two bits of water.</b> Same compass, same care, same one degree of error in each bearing &mdash; and the two fixes are not worth the same. <i>Watch the shape, not the dot.</i>"], "b": "Next", "pasos": [{"t": "<b>The fix from topic 1, with its bands drawn.</b> Brough Tower at <b>2.94 M</b>, Wardhill Tower at <b>4.15 M</b>, and the lines cut at <b>58.9&deg;</b>. Time <b>1016</b>, log <b>24.7</b>.<br><br>The rhombus comes out <b>469 by 275 metres</b> &mdash; about <b>1.7 times</b> as long as it is wide. Near enough square, and small: the two bands are cutting across each other.", "calc": "cut <b>58.9&deg;</b> &middot; 469 m by 275 m &middot; area 59,700 m&sup2;", "v": [4580.0, 2660.0, 2100], "lns": [[5665.3, 3695.4, 3494.7, 1624.6, "Wardhill Tower 132", "", 0.2], [4905.4, 1195.7, 4254.6, 4124.3, "Brough Tower 011", "", 0.2]], "fix": [[4580.0, 2660.0, "1016 · log 24.7", ""]], "arco": [[4580.0, 2660.0, 10.928786833564402, 312.05226227048837, "58.9°"]], "romb": [[4580.0, 2660.0, 10.93, 34.6, 132.05, 48.8, "469 m — 275 m", 1]]}, {"t": "<b>28 minutes later and a couple of miles down the sound.</b> The same two towers, and almost the same distances off: <b>2.90</b> and <b>3.40 miles</b>, against 2.94 and 4.15 before. One degree still buys the same bands &mdash; <b>94</b> and <b>110 metres</b>. Time <b>1044</b>, log <b>27.0</b>.<br><br><b>What has changed is the angle: 20.0&deg; instead of 58.9&deg;.</b> And the rhombus is now <b>1173 by 227 metres</b>: <b>2.5 times longer</b> than the other one, while across it is if anything narrower.<br><br><i>Same compass, same care, same distances. The angle alone turned a fix you could put a pencil on into one that is a quarter of a mile long.</i>", "calc": "cut <b>20.0&deg;</b> &middot; 1173 m by 227 m &middot; area 120,600 m&sup2;", "v": [6080.0, 2360.0, 2100], "lns": [[6422.5, 3820.4, 5737.5, 899.6, "Wardhill Tower 165", "", 0.2], [5258.6, 1104.9, 6901.4, 3615.1, "Brough Tower 325", "", 0.2]], "fix": [[6080.0, 2360.0, "1044 · log 27.0", ""]], "arco": [[6080.0, 2360.0, 325.1978695341003, 345.20099656522757, "20.0°"]], "romb": [[6080.0, 2360.0, 325.2, 34.1, 165.2, 40.0, "1173 m — 227 m", -1]]}]}, {"id": "2.E2", "h": "The best pair on the chart, and the worst", "v0": [2578.2097271642706, 3327.6648775124886, 3400], "v": [2578.2097271642706, 3327.6648775124886, 3400], "mk0": [[1021.0, 4208.0, 70], [1661.0, 3473.0, 70]], "p": ["<b>This is the pair you already know</b> &mdash; Halkirk Spire and Skelvoe Tower, 1.45 miles apart, the transit from part 1. <i>The same two objects are about to give you the best line of position on this chart and the worst fix on this chart, and for the same reason.</i>"], "b": "Next", "pasos": [{"t": "<b>Halkirk Spire behind Skelvoe Tower, and you are on the line.</b> Part 1 called this the best line of position there is, and it is: the line runs <b>039 / 219</b>, and while you see the two of them in line you are on it exactly. <b>No compass comes into it</b>, so no compass error can push you off.<br><br><i>Nothing about that has changed. Hold on to it while you look at the next step.</i>", "calc": "transit &middot; <b>039 / 219</b> &middot; 1.45 M apart", "lns": [[3048.4, 1879.7, -366.4, 5801.3, "Halkirk/Skelvoe in transit 039", ""]]}, {"t": "<b>Now stop using them as a transit and take a bearing of each one.</b> From here, time <b>1130</b>, log <b>30.8</b>: Halkirk Spire bears <b>238</b> at 4.44 M, Skelvoe Tower bears <b>247</b> at 3.10 M. <b>They are 8.6 degrees apart</b>, and there is your fix &mdash; two lines lying almost on top of each other, and a rhombus <b>3257 metres</b> long. <i>That is over a mile and a half of sea.</i><br><br><b>And this spot is not unlucky.</b> Walked over the <b>1608 points</b> of navigable water on this chart, this pair's median cut is <b>8.6&deg;</b>; only <b>3.0 %</b> of the water gives 45&deg; or better, and <b>88 %</b> of it gives less than twenty.<br><br><b>What makes the transit good is exactly what makes the pair bad to cross.</b> Two objects that stay nearly in line from almost everywhere give you one superb line &mdash; and two bearings that are nearly the same bearing. <i>Cross a transit with something that is not in its direction.</i>", "calc": "cut <b>8.6&deg;</b> &middot; 3257 m by 627 m &middot; median cut of this pair <b>8.6&deg;</b>", "lns": [[3048.4, 1879.7, -366.4, 5801.3, "Halkirk/Skelvoe in transit 039", "", 0.12], [2305.1, 3457.1, 4894.9, 1942.9, "Halkirk Spire 238", "", 0.18], [2206.6, 3255.5, 4993.4, 2144.5, "Skelvoe Tower 247", "", 0.34]], "fix": [[3600.0, 2700.0, "1130 · log 30.8", ""]], "romb": [[3600.0, 2700.0, 238.08, 52.1, 246.66, 36.4, "", 1]]}]}, {"id": "2.P2", "h": "Turn the angle and watch the shape", "t": "corte", "v": [4580.0, 2660.0, 2100], "corte0": [4580.0, 2660.0, 10.93, 34.6, 48.8, "Brough Tower 011", "second line", 90, 10, 90, 5], "fix": [[4580.0, 2660.0, "", ""]], "p": ["<b>One line is fixed:</b> Brough Tower, <b>011</b>, with its band of <b>95 metres</b> either side. <b>The other turns with the slider</b> &mdash; a second position line of the same quality, one degree either way. <i>It is not a bearing of anything on this chart.</i>", "<b>Nothing here is marked.</b> Close the angle up and watch what it costs: <b>329 metres</b> across at 90&deg;, <b>2632</b> at 10&deg;. <i>The bands never change width. It is the crossing that stretches them.</i>"], "b": "Next"}]}, {"t": "Three lines and the cocked hat", "s": [{"id": "3.S1", "h": "Why three", "v": [4580.0, 2660.0, 2100], "lns": [[5447.0, 2418.5, 3713.0, 2901.5, "Skelvoe Tower 253", "", 0.2], [3928.8, 2038.7, 5231.2, 3281.3, "Wardhill Tower 132", "", 0.2], [4384.8, 3538.6, 4775.2, 1781.4, "Brough Tower 011", "", 0.2]], "fix": [[4580.0, 2660.0, "", ""]], "p": ["<b>Topic 1 ended on an uncomfortable sentence:</b> two lines always cross, and they cross just as neatly when one of them is wrong. <i>You had a position and no way of checking it.</i>", "<b>Take a third bearing.</b> Here are all three of this trio, from the water you are already standing in: Brough Tower <b>011</b>, Skelvoe Tower <b>253</b>, Wardhill Tower <b>132</b>. They cut at <b>61.9&deg;</b>, <b>58.9&deg;</b> and <b>59.2&deg;</b> &mdash; and <b>no water on this chart gives this trio three cuts as even as these</b>.", "<b>If all three pass through the same point, all three are good.</b> One bad bearing cannot hide inside three lines the way it hides inside two: the third line has to agree with both of the others at once, and a wrong one will not.", "<b>And when they do not pass through one point, they tell you so</b> &mdash; by leaving a triangle. <i>That triangle has a name, a size and three possible causes, and it is what the rest of this topic is about.</i>"], "b": "Next"}, {"id": "3.E1", "h": "The third line does not agree", "v0": [4580.0, 2660.0, 1200], "v": [4580.0, 2660.0, 1200], "p": ["<b>Close in on your own water: this screen is 1.78 miles across.</b> The triangle you are about to draw measures a few hundred metres, and at the working width of the last topic it would be a thick dot. <i>Here the detail is the lesson.</i>"], "b": "Next", "pasos": [{"t": "<b>Two bearings first, exactly as in topic 1.</b> Skelvoe Tower at <b>252</b>, time 1149, log 32.4; Wardhill Tower at <b>130</b>, time 1150, log 32.5. They cut at <b>59.2&deg;</b>.<br><br>There is your fix. <i>If you stopped here you would write it down and believe it &mdash; and everything you know so far says you should.</i>", "calc": "Skelvoe Tower &nbsp;&middot;&nbsp; <b>252</b> &middot; Wardhill Tower &nbsp;&middot;&nbsp; <b>130</b> &middot; cut <b>59.2&deg;</b>", "lns": [[5427.6, 2352.7, 3702.3, 2865.9, "Skelvoe Tower 252", "", 0.2], [3842.7, 2134.8, 5187.6, 3331.1, "Wardhill Tower 130", "", 0.2]], "fix": [[4423.486887318244, 2651.378266371213, "", ""]]}, {"t": "<b>Now the third: Brough Tower at 012, time 1151, log 32.6.</b><br><br><b>It does not go through the dot.</b> It misses it, and it misses it by enough to see. <i>Nothing has gone wrong that you could have felt: three bearings taken carefully, one after another, off three towers you identified correctly.</i>", "calc": "Brough Tower &nbsp;&middot;&nbsp; <b>012</b> &nbsp;&middot;&nbsp; 1151 &nbsp;&middot;&nbsp; log 32.6", "lns": [[5427.6, 2352.7, 3702.3, 2865.9, "Skelvoe Tower 252", "", 0.2], [3842.7, 2134.8, 5187.6, 3331.1, "Wardhill Tower 130", "", 0.2], [4335.8, 3526.9, 4756.9, 1776.9, "Brough Tower 012", "", 0.2]], "fix": [[4423.486887318244, 2651.378266371213, "", ""]]}, {"t": "<b>What the three of them leave is a triangle, and it has a name: the cocked hat.</b> This one is <b>380 metres</b> along its longest side.<br><br>The fix is timed at the last bearing: <b>1151, log 32.6</b>. <i>And you are somewhere in there &mdash; the triangle does not say where, it says that at least one of your three lines is wrong.</i><br><br><b>That is the whole difference between two lines and three.</b> With two, a bad bearing gives you a clean crossing and says nothing. With three, it opens a hole and hands it to you.", "calc": "cocked hat &nbsp;&middot;&nbsp; <b>380 m</b> &nbsp;&middot;&nbsp; 373 m &nbsp;&middot;&nbsp; 366 m", "lns": [[5427.6, 2352.7, 3702.3, 2865.9, "Skelvoe Tower 252", "", 0.2], [3842.7, 2134.8, 5187.6, 3331.1, "Wardhill Tower 130", "", 0.2], [4335.8, 3526.9, 4756.9, 1776.9, "Brough Tower 012", "", 0.2]], "tri": [[4555.974122284189, 2611.973774651769, 4423.486887318244, 2651.378266371213, 4524.808445260413, 2741.501226939287, "380 m"]]}]}, {"id": "3.S2", "h": "What the size of it means", "v": [4580.0, 2660.0, 1200], "lns": [[5382.7, 2223.1, 3676.3, 2796.2, "", "", 0.18], [4068.6, 1905.1, 5304.2, 3214.0, "", "", 0.18], [4372.5, 3535.8, 4770.6, 1780.4, "", "", 0.18]], "fix": [[4580.0, 2660.0, "where you really are", ""], [4612.064165152368, 2481.45277850548, "5 m across", "malo"]], "p": ["<b>A big triangle proves that something is wrong.</b> That much is safe: the three lines cannot all be right and still leave a hole. The one from the last screen was <b>380 metres</b> across, and it was telling you the truth about itself.", "<b>A small triangle proves nothing at all &mdash; and here is the proof, off this chart.</b> Three bearings wrong by <b>+0.25&deg;</b>, <b>-3.0&deg;</b> and <b>+3.0&deg;</b> close a cocked hat <b>5 metres</b> across: a dot under the pencil point. <b>And it sits 499 metres from where you actually are</b> &mdash; the black dot. <i>A triangle you could cover with a pencil, and half a kilometre of error.</i>", "<b>And now the part that no book tells you.</b> If the same error is in all three bearings &mdash; a compass reading a degree high all afternoon &mdash; it does <b>not</b> close the hat. It opens it: 221 m at 0.5&deg; &middot; 441 m at 1.0&deg; &middot; 883 m at 2.0&deg; &middot; 1324 m at 3.0&deg;. <i>And it leaves the centre of it almost exactly where you are: 16 m &middot; 31 m &middot; 62 m &middot; 94 m.</i> <b>What closes a cocked hat is errors of opposite signs, and those are the ones that carry you off.</b>", "<b>So when the hat comes out big, look for one of three things:</b> a bearing taken badly &mdash; a hurried sight, the boat swinging; <b>an object you have identified wrongly</b>, which is the worst of the three because the line is perfect and points at the wrong tower; or <b>the time you took over it</b> &mdash; three bearings spread over ten minutes at five knots are three bearings from three different places, nearly a mile apart."], "b": "Next"}, {"id": "3.P1", "h": "Which corner do you work from?", "t": "click", "v": [4580.0, 2660.0, 1200], "lns": [[5427.6, 2352.7, 3702.3, 2865.9, "Skelvoe Tower 252", "", 0.2], [3842.7, 2134.8, 5187.6, 3331.1, "Wardhill Tower 130", "", 0.2], [4335.8, 3526.9, 4756.9, 1776.9, "Brough Tower 012", "", 0.2]], "tri": [[4555.974122284189, 2611.973774651769, 4423.486887318244, 2651.378266371213, 4524.808445260413, 2741.501226939287, ""]], "peligro": [[4559.545454545455, 3030.8859526274127, 110, "under 5 m"]], "sesq": [147, [4580.0, 2986.7950435365037]], "ay": "Click the corner of the triangle you would work from.", "p": ["<b class='q'>You are somewhere inside that triangle. Which corner do you put yourself in?</b>", "<b>Not the middle.</b> The middle is the most comfortable answer and it is the wrong one: it is a guess dressed up as an average. <b>You take the corner that puts you nearest the danger</b>, because that is the only assumption that cannot hurt you &mdash; if you are wrong about it, you are wrong in the safe direction.", "<b>There is no land on this screen.</b> What can ground you here is the bottom: the ring to the south is water shoaling to <b>under five metres</b>, its near edge <b>899 metres</b> from the middle of your hat, bearing <b>182</b>. <i>Pick the corner and the chart will tell you what it costs.</i>"], "b": "Next", "hizo": "worked from the corner of a cocked hat nearest the danger"}]}, {"t": "Mixing kinds of line", "s": [{"id": "4.S1", "h": "A fix does not need two of the same", "v": [4580.0, 2660.0, 2100], "lns": [[5665.3, 3695.4, 3494.7, 1624.6, "Wardhill Tower 132", "", 0.2], [4905.4, 1195.7, 4254.6, 4124.3, "Brough Tower 011", "", 0.2]], "fix": [[4580.0, 2660.0, "", ""]], "p": ["<b>Three towers, well spread, all visible at once.</b> That is what the last two topics have given you, and it is the best water on this chart. <i>Most of the time you will not have it.</i>", "<b>A position line is a position line, whatever made it.</b> Nothing in the crossing cares whether a line came from a compass, from two objects in line, from the echo sounder or from a sextant angle: <b>two lines that cross at a decent angle give you a fix</b>, and that is the whole requirement.", "<b>And mixing usually gets you a better angle than insisting on two more bearings.</b> The four kinds you learned in part 1 do not sit in the same place on the chart: a depth contour runs where the seabed puts it, a transit runs where its two objects put it. <i>They will cut your bearing at angles no second tower could give you.</i>", "<b>Each mixture has its own trap, and the next three screens are those three traps</b> &mdash; a contour that cuts the same bearing twice, a transit crossed with the wrong object, and a distance that gives you two places instead of one."], "b": "Next"}, {"id": "4.E1", "h": "Bearing and sounding", "v0": [4814.0, 2894.0, 2100], "v": [4814.0, 2894.0, 2100], "lns": [[6138.7, 2190.3, 3489.3, 3597.7, "Grimsetter Mast 240", "", 0.22]], "fix": [[4822.8, 2889.3, "1157 · log 33.1", ""], [4443.1, 3091.0, "same bearing, same sounding", "malo"]], "p": ["<b>One bearing and one sounding, and no second object in sight.</b> Grimsetter Mast bears <b>240</b>, 4.20 miles off. Time <b>1157</b>, log <b>33.1</b>. The echo sounder reads <b>10 metres</b> once you have taken the tide off it &mdash; and the tide is module 04, not this one.", "<b>The bearing puts you on a line. The sounding puts you on a contour.</b> You are on both, so you are where they cross &mdash; and the contour is already printed on the chart: it is the edge between the two blues. <i>You did not draw it and you did not measure it. It was waiting for you.</i>", "<b>And here is what the chart does to you.</b> Look along your bearing: it crosses the 10 metre contour <b>twice inside this screen</b>. The second crossing is <b>1183 metres</b> up the line, and it is open water too: same bearing, same sounding, different place. <i>A contour wanders. A bearing does not care which bend of it you are on.</i>", "<b>Part 1 warned you about this and here is the bill.</b> What settles it is anything that tells the two apart: a third line, a second sounding a few minutes later &mdash; or, cheapest of all, <b>the log</b>: you know roughly how far you have run since the last fix, and 1183 metres is a long way to have gone unnoticed."], "b": "Next"}, {"id": "4.E2", "h": "Transit and bearing", "v0": [1783.15, 3332.75, 3400], "v": [1783.15, 3332.75, 3400], "mk": [[1021.0, 4208.0, 70], [1661.0, 3473.0, 70]], "lns": [[3048.4, 1879.7, -366.4, 5801.3, "Halkirk/Skelvoe in transit 039", "", 0.72], [1217.5, 1759.7, 3873.1, 3155.3, "Wardhill Tower 116", "", 0.75]], "fix": [[2545.3, 2457.5, "1239 · log 36.6", ""]], "p": ["<b>You are on the transit &mdash; Halkirk Spire behind Skelvoe Tower &mdash; and that is the best line of position on this chart.</b> It carries no compass error at all. But it is one line, and one line never was a fix. Time <b>1239</b>, log <b>36.6</b>.", "<b>So cross it with a bearing: Wardhill Tower, <b>116</b>, 6.81 miles off.</b> It cuts the transit at <b>76.7&deg;</b> &mdash; near enough square. There is your fix, out of two lines of two different kinds, and neither of them is a second tower.", "<b>And it is Wardhill Tower and not Brough Tower on purpose.</b> Brough Tower is also in sight from here, and its bearing would cut this transit at <b>13.8&deg;</b> &mdash; because Brough Tower lies almost along the transit's own direction. Walked over the whole navigable stretch of the transit, from 1.0 to 3.5 miles out: <b>Wardhill Tower cuts it between 68.8&deg; and 89.4&deg;, and Brough Tower between 11.3&deg; and 20.6&deg;.</b> <i>The worst Wardhill can do is better than the best Brough can.</i>", "<b>That is topic 2 doing its job.</b> The transit is superb and the choice of what to cross it with is still yours to get wrong. <i>Cross a transit with something that is not lying in its direction &mdash; and on this chart, that rules out one of the two towers you can see.</i>"], "b": "Next"}, {"id": "4.P1", "h": "Bearing and distance: two places", "t": "click", "v": [1903.6, 2826.5, 2100], "lns": [[-104.4, 2073.0, 2704.4, 3127.0, "Wardhill Tower 109", "", 0.2]], "cir": [[1661.0, 3473.0, 1.4031304167254142, "1.40 M from Skelvoe Tower", 0, 40, 0]], "sdos": [260, [2545.3, 2457.5], 1.9, [1300.0, 2600.0], [2507.2, 3053.0]], "ay": "Click the one of the two crossings you are actually at.", "p": ["<b class='q'>A bearing and a distance. Two lines, one fix &mdash; and two places.</b>", "Wardhill Tower bears <b>109</b>. A vertical sextant angle on Skelvoe Tower gives <b>1.40 miles</b>, so you are somewhere on that circle. <b>A straight line and a circle cross twice</b>, and here both crossings are on this screen, both in open water, <b>1.9 miles apart</b>. The chart will not choose for you.", "<b>Your log will.</b> Your last fix was at <b>1239</b> on the transit, log <b>36.6</b>; it now reads <b>38.5</b>, so you have run <b>1.9 miles</b> since. <i>One of those two crossings is that far from where you were. The other is half of it.</i>", "<i>This is what the log is for, and why every line in this module has carried a time and a reading. In part 3 the same argument gets a name and a proper method &mdash; the estimated position &mdash; but the argument does not change.</i>"], "b": "Next", "hizo": "found where a bearing and a distance cross"}]}, {"t": "The area you are really in", "s": [{"id": "5.S1", "h": "A zone, and how big it is", "v": [4800.0, 2900.0, 1200], "lns": [[4655.8, 4393.1, 4944.2, 1406.9, "Brough Tower 004", "", 0.2], [3705.6, 1874.2, 5894.4, 3925.8, "Wardhill Tower 132", "", 0.2]], "fix": [[4800.0, 2900.0, "1407 · log 43.9", ""]], "romb": [[4800.0, 2900.0, 3.91, 38.1, 131.55, 43.1, "507 m — 251 m", 1]], "peligro": [[4599.545454545455, 3085.5223162637762, 120, "under 5 m"]], "p": ["<b>Everything so far has ended in a dot. It is time to say what the dot is worth.</b> Brough Tower bears <b>004</b>, Wardhill Tower bears <b>132</b>, and they cut at <b>52.4&deg;</b>. Time <b>1407</b>, log <b>43.9</b>.", "<b>You are not at that dot. You are somewhere in the shaded shape round it</b> &mdash; each line is a band <b>105</b> and <b>119 metres</b> wide, because one degree is worth that much at 3.25 and 3.67 miles, and two bands crossing leave a rhombus. This one is <b>507 metres by 251</b>. <i>That is the size of &ldquo;here&rdquo;.</i>", "<b>And now the thing that is easy to get wrong, and it is measured on this chart.</b> The size of the zone is <b>not</b> what decides anything. A rhombus stretches in the direction its two objects dictate, so <b>a huge zone can miss everything and a small one can sit on top of the danger</b>.", "<b>Here is the proof, from the water you were in two topics ago.</b> From the fix of topics 1 to 3 the shoal to the south is 899 metres off, and all <b>fifteen pairs</b> of the six objects were tried against it: <b>not one of their zones reaches it</b> &mdash; not even Skelvoe Tower + Halkirk Spire, whose zone is <b>4791 metres</b> long. <i>And <b>896 metres</b> from there &mdash; a quarter of the way across this screen &mdash; a zone of 4210 metres swallows this shoal whole. Same chart, same instruments.</i>", "<b>So the question is never &ldquo;how big is my zone&rdquo;.</b> It is <b>where does it reach, and what is there</b>. Which is the next screen, and it is the only question a navigator actually asks."], "b": "Next"}, {"id": "5.P1", "h": "Can you say you will pass?", "t": "choice", "v": [4800.0, 2900.0, 1200], "lns": [[4655.8, 4393.1, 4944.2, 1406.9, "Brough Tower 004", "", 0.2], [3705.6, 1874.2, 5894.4, 3925.8, "Wardhill Tower 132", "", 0.2], [6217.5, 2409.4, 3382.5, 3390.6, "Halkirk Spire 249", "", 0.74], [6124.4, 2195.7, 3475.6, 3604.3, "Grimsetter Mast 240", "", 0.92]], "fix": [[4800.0, 2900.0, "", ""]], "romb": [[4800.0, 2900.0, 3.91, 38.1, 131.55, 43.1, "507 m — 251 m", 1], [4800.0, 2900.0, 249.31, 69.8, 240.4, 49.1, "4210 m long", -1]], "peligro": [[4599.545454545455, 3085.5223162637762, 120, "under 5 m"]], "o": [{"t": "Brough Tower and Wardhill Tower &mdash; the 52&deg; pair", "ok": true, "m": "<span class='big'>Yes &mdash; and by 357 metres.</span><br><b>Your whole zone clears the shoal.</b> Every point you could be at is at least 357 metres north of it, so &ldquo;I will pass north of that shoal&rdquo; is a statement you have earned. <i>The zone is 507 metres long, which is not small &mdash; it just does not reach the one thing that matters.</i>"}, {"t": "Halkirk Spire and Grimsetter Mast &mdash; the 9&deg; pair", "ok": false, "m": "<b>No &mdash; and not because the fix is wrong.</b> That pair cuts at <b>8.9&deg;</b>, so its zone runs <b>4210 metres</b> and the shoal sits <b>111 metres inside it</b>. <i>The dot may be in exactly the same place; what you have lost is the right to say where you are not.</i> With this pair the honest answer is &ldquo;I cannot tell&rdquo;, and that answer means: do not go."}], "p": ["<b class='q'>The shoal is 569 metres off, bearing 239. Both pairs are in sight. Which one lets you say you will pass north of it?</b>", "<b>Both fixes put you on the same dot</b> &mdash; the same boat, the same minute, the same chart. What is drawn round the dot are the two zones: the tight one from the 52&deg; pair and the long one from the 9&deg; pair, which runs off this screen.", "<i>An area of uncertainty is not there to be measured. It is there to be decided with.</i>"], "b": "Next", "hizo": "judged whether a fix was good enough to pass a shoal"}]}, {"t": "Choosing the fix", "s": [{"id": "6.S1", "h": "What makes a fix worth having", "v": [3732.5, 2726.0, 7545], "objs": [[6603.0, 4590.0, 70, "Wardhill Tower", "s"], [5010.0, 725.0, 70, "Brough Tower", "s"], [1661.0, 3473.0, 70, "Skelvoe Tower", "n"], [1021.0, 4208.0, 70, "Halkirk Spire", "s"], [2316.0, 4221.0, 70, "Grimsetter Mast", "e"], [2950.0, 5103.0, 70, "Barnholm", "e"]], "p": ["<b>Five topics have been about how. This one is about which</b> &mdash; and it comes last because you cannot choose between things you cannot judge. <i>Here are the six objects this chart gives you. Before you take a single bearing you pick two of them, and that choice decides more about your fix than how carefully you read the compass.</i>", "<b>Near, because every error grows with the range.</b> One degree is <b>32 metres at one mile and 97 at three</b>. Same compass, same care, same degree &mdash; three times the band. <i>An object you can identify at four miles is not as good as a plain one at two.</i>", "<b>Open, because the angle stretches whatever the bands are.</b> Topic 2 measured it on this water: the same two bands at <b>59&deg;</b> give a rhombus <b>469 metres</b> long, and at <b>20&deg;</b> <b>1173 metres</b>. And a wide cut is <b>chosen, not found</b>: walked over the <b>1608 points</b> of navigable water on this chart, <b>not one</b> gives this trio three cuts of 60&deg; or more.", "<b>Of different kinds, because they fail in different ways.</b> A transit carries no compass error at all; a contour is already drawn on the chart and cost you nothing but a sounding; a distance gives a circle. <i>They lie where the seabed and the land put them, not where a second tower happens to be, so they cut at angles no second bearing could give you.</i>", "<b>And taken together, quickly, the fastest-changing first.</b> At 5 knots a minute is <b>154 metres</b>: three bearings spread over ten minutes are three bearings from three different places, and the cocked hat they leave is your own passage, not your compass. <i>Take the one that is swinging fastest &mdash; the nearest, or the one on the beam &mdash; last, and the slow ones first.</i>", "<b>One warning from this chart in particular, and you have already met it.</b> Halkirk Spire and Skelvoe Tower give the finest line of position here &mdash; and as a pair to cross they are the worst on the chart: a median cut of <b>8.6&deg;</b>, with <b>88 %</b> of the water under twenty. <i>The best pair to line up is the worst pair to cross, and for the same reason.</i>"], "b": "Next"}, {"id": "6.E1", "h": "Same minute, different objects", "v0": [4580.0, 2660.0, 2100], "v": [4580.0, 2660.0, 2100], "p": ["<b>You are back in the water of topics 1 to 3, and you are about to fix twice.</b> Same boat, same minute, same compass, the same one degree of error in every bearing &mdash; and one object different. <i>Nothing else changes between these two screens.</i>"], "b": "Next", "pasos": [{"t": "<b>Skelvoe Tower first, because it is the slowest of the three: <b>253</b>, time 1418, log 44.8.</b> Then the choice. <b>Brough Tower at 011</b>, time <b>1419</b>, log <b>44.9</b> &mdash; 2.94 miles off, against 4.50 for Skelvoe Tower.<br><br>They cut at <b>61.9&deg;</b>. The bands are <b>95</b> and <b>145 metres</b>, and the zone comes out <b>472 by 297 metres</b>. <i>And it is not even the best pair in sight from here: <b>3 of the fifteen</b> cut wider still, which is what this topic is about.</i>", "calc": "Brough + Skelvoe &middot; cut <b>61.9&deg;</b> &middot; 472 m by 297 m", "v": [4580.0, 2660.0, 2100], "lns": [[3135.0, 3062.5, 6025.0, 2257.5, "Skelvoe Tower 253", "", 0.2], [4905.4, 1195.7, 4254.6, 4124.3, "Brough Tower 011", "", 0.2]], "fix": [[4580.0, 2660.0, "1419 · log 44.9", ""]], "arco": [[4580.0, 2660.0, 10.928786833564402, 72.83639359186878, "61.9°"]], "romb": [[4580.0, 2660.0, 10.93, 34.6, 252.84, 52.9, "472 m — 297 m", -1]]}, {"t": "<b>The same minute, and the other choice.</b> Skelvoe Tower is still there at <b>253</b> from 1418. But instead of Brough Tower you take <b>Grimsetter Mast at 234</b>, time <b>1419</b>, log <b>44.9</b> &mdash; also in plain sight, also a good clean mark, 4.08 miles off.<br><br><b>They cut at 19.0&deg;, and the zone is now 1679 metres long.</b> Same dot, same time, same compass: <b>3.6 times</b> the length, for changing one object.<br><br><i>And look at which object stayed. Skelvoe Tower is in both pairs, so it is not the tower that was the problem &mdash; a mark is not good or bad on its own, only good or bad with the one you cross it with.</i>", "calc": "Skelvoe + Grimsetter &middot; cut <b>19.0&deg;</b> &middot; 1679 m by 293 m", "v": [4580.0, 2660.0, 2100], "lns": [[3135.0, 3062.5, 6025.0, 2257.5, "Skelvoe Tower 253", "", 0.2], [3345.1, 3511.5, 5814.9, 1808.5, "Grimsetter Mast 234", "", 0.82]], "fix": [[4580.0, 2660.0, "1419 · log 44.9", ""]], "arco": [[4580.0, 2660.0, 252.83639359186878, 233.81419621306975, "19.0°"]], "romb": [[4580.0, 2660.0, 252.84, 52.9, 233.81, 48.0, "1679 m long", -1]]}]}, {"id": "6.P1", "h": "Four in sight. Choose the pair.", "t": "choice", "v": [3732.5, 2726.0, 7545], "objs": [[6603.0, 4590.0, 70, "Wardhill Tower", "s"], [1661.0, 3473.0, 70, "Skelvoe Tower", "n"], [1021.0, 4208.0, 70, "Halkirk Spire", "s"], [2950.0, 5103.0, 70, "Barnholm", "n"]], "miras": [[4500.0, 3100.0, 6603.0, 4590.0, ""], [4500.0, 3100.0, 1661.0, 3473.0, ""], [4500.0, 3100.0, 1021.0, 4208.0, ""], [4500.0, 3100.0, 2950.0, 5103.0, ""]], "barcos": [[4500.0, 3100.0, "1429 · log 45.7"]], "o": [{"t": "Skelvoe Tower and Halkirk Spire", "ok": false, "m": "<b>No &mdash; and that is the trap this chart sets.</b> 10.2&deg; from 4.25 and 5.42 miles &mdash; a zone <b>3525 metres</b> long: <b>9.9 times</b> the best pair in sight. <i>They are the transit from part 1, the finest line of position on this chart &mdash; and the worst pair on it to cross, for exactly the same reason: from almost everywhere they are nearly in line with you, so their two bearings are nearly the same bearing.</i><br><br>Use them as a transit and they cost you nothing. Use them as a pair and they cost you a mile and a half."}, {"t": "Wardhill Tower and Skelvoe Tower", "ok": false, "m": "<b>A fix you could use, but not the best one in sight.</b> 42.8&deg; from 3.83 and 4.25 miles &mdash; a zone <b>716 metres</b> long, against <b>355 metres</b> from Wardhill Tower and Barnholm.<br><br><i>And the chart says which half of it you are paying: with the best pair's ranges, this angle on its own would still leave <b>672 m</b>; with the best pair's angle, these ranges on their own would leave <b>378 m</b>. <b>The angle is the bigger half here.</b></i>"}, {"t": "Wardhill Tower and Barnholm", "ok": true, "m": "<span class='big'>355 m by 340 m</span><br><b>Yes &mdash; the tightest of the six, and not by a little.</b> 87.6&deg; from 3.83 and 3.76 miles &mdash; a zone <b>355 metres</b> long. <i>The two nearest objects on a cut you could not improve: 87.6&deg; is as square as anything gets, and at under four miles each their bands are the narrowest you can buy here.</i><br><br>The next best pair in sight, Wardhill Tower and Halkirk Spire, leaves <b>673 metres</b> &mdash; 1.9 times as long, from the same boat at the same minute."}, {"t": "Halkirk Spire and Barnholm", "ok": false, "m": "<b>A fix you could use, but not the best one in sight.</b> 34.6&deg; from 5.42 and 3.76 miles &mdash; a zone <b>1000 metres</b> long, against <b>355 metres</b> from Wardhill Tower and Barnholm.<br><br><i>And the chart says which half of it you are paying: with the best pair's ranges, this angle on its own would still leave <b>825 m</b>; with the best pair's angle, these ranges on their own would leave <b>435 m</b>. <b>The angle is the bigger half here.</b></i>"}, {"t": "Wardhill Tower and Halkirk Spire", "ok": false, "m": "<b>A fix you could use, but not the best one in sight.</b> 53.0&deg; from 3.83 and 5.42 miles &mdash; a zone <b>673 metres</b> long, against <b>355 metres</b> from Wardhill Tower and Barnholm.<br><br><i>And the chart says which half of it you are paying: with the best pair's ranges, this angle on its own would still leave <b>550 m</b>; with the best pair's angle, these ranges on their own would leave <b>438 m</b>. <b>The angle is the bigger half here.</b></i>"}, {"t": "Skelvoe Tower and Barnholm", "ok": false, "m": "<b>A fix you could use, but not the best one in sight.</b> 44.8&deg; from 4.25 and 3.76 miles &mdash; a zone <b>680 metres</b> long, against <b>355 metres</b> from Wardhill Tower and Barnholm.<br><br><i>And the chart says which half of it you are paying: with the best pair's ranges, this angle on its own would still leave <b>644 m</b>; with the best pair's angle, these ranges on their own would leave <b>375 m</b>. <b>The angle is the bigger half here.</b></i>"}], "p": ["<b class='q'>Four objects in sight, and time to fix. Which two do you take?</b>", "You are here, time <b>1429</b>, log <b>45.7</b>, and the grey lines are what your eye sees: <b>Wardhill Tower function numeros(t){
 let u=String(t||"").toLowerCase()
  .replace(/miles?|metres?|meters?|degrees?|deg|knots?|\bnm\b|\bmin\b/g," ")
  .replace(/[nsew]/g," ")
  .replace(/[°º˚]/g,"#")
  .replace(/[″”"]/g,"~")
  .replace(/[′´’']/g,"@")
  .replace(/@@/g,"~")
  .replace(/,/g,".");
 const out=[],re=/(-?\d+(?:\.\d+)?)\s*([#@~]?)/g; let x;
 while((x=re.exec(u))!==null)out.push([parseFloat(x[1]),x[2]]);
 return out;}
function partes(N){
 let d=null,m=null,g=null;
 for(const q of N){if(q[1]=="#"&&d==null)d=q[0];
  else if(q[1]=="@"&&m==null)m=q[0]; else if(q[1]=="~"&&g==null)g=q[0];}
 if(N.length==1&&!N[0][1])m=N[0][0];
 else for(const q of N){if(q[1])continue;
  if(d==null)d=q[0]; else if(m==null)m=q[0]; else if(g==null)g=q[0];}
 return {d:d,m:m,g:g};}

  return {mal:2,m:"You wrote "+P.d+"&deg;. On this chart the "+
   (s.coord==45?"latitude":"longitude")+" is "+s.coord+"&deg; &mdash; "+
   "it is the minutes that change."};
 return {v:P.m+(P.g||0)/60};}

  [(ab[0]*n2[1]-ab[1]*n1[1])/det, (ab[1]*n1[0]-ab[0]*n2[0])/det]);

       D2=Math.hypot(V[1][0]-V[3][0],V[1][1]-V[3][1]);
