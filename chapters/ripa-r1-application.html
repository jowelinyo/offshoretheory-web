<script>

let RND = 1;

window.azarSemilla = n => {
 RND = (n >>> 0) || 1;
 for(let k = 0; k < 8; k++) azar();
};
function azar(){
 RND ^= RND << 13; RND >>>= 0;
 RND ^= RND >>> 17;
 RND ^= RND << 5;  RND >>>= 0;
 return RND / 4294967296;
}
function baraja(a){
 const b = a.slice();
 for(let i = b.length - 1; i > 0; i--){
  const j = Math.floor(azar() * (i + 1));
  const t = b[i]; b[i] = b[j]; b[j] = t;
 }
 return b;
}
azarSemilla(Date.now());

function bolsaNueva(){ return {i:[], ultima:null}; }
function saca(bolsa, banco){

 if(bolsa.n!==banco.length){ bolsa.i=[]; bolsa.n=banco.length; }
 if(!bolsa.i.length){
  bolsa.i = baraja(banco.map((x, k) => k));
  if(bolsa.i.length > 1 && banco[bolsa.i[bolsa.i.length - 1]].id === bolsa.ultima){
   const t = bolsa.i[bolsa.i.length - 1];
   bolsa.i[bolsa.i.length - 1] = bolsa.i[0]; bolsa.i[0] = t;
  }
 }
 const x = banco[bolsa.i.pop()];
 bolsa.ultima = x.id;
 return x;
}
</script>
<script>
"use strict";

const NS = "http://www.w3.org/2000/svg";
const D = {W: 1000, H: 620};
let svg = null, gO = null, ESC = 1;
const px = n => n / ESC;

function el(t, at, pa){
  const e = document.createElementNS(NS, t);
  for(const k in at) if(at[k] !== undefined && at[k] !== null) e.setAttribute(k, at[k]);
  (pa || gO || svg).appendChild(e);
  return e;
}
function txt(x, y, s, an, tam, col, peso, fam, pa){
  const e = el("text", {x: x, y: y, "text-anchor": an || "start",
    "pointer-events": "none", "font-size": px(tam || 13),
    fill: col || "var(--lam-ink)", "font-weight": peso || 400,
    "font-family": fam === "mono" ? "var(--f-mono)" : "var(--f-ui)"}, pa);
  e.textContent = s;

}
function parte(s, ancho, tam){
  const porLinea = Math.max(6, Math.floor(ancho / (px(tam) * 0.62)));
  const pal = String(s).split(/\s+/);
  const out = [];
  let linea = "";
  pal.forEach(function(p){
    const q = linea ? linea + " " + p : p;
    if(q.length > porLinea && linea){ out.push(linea); linea = p; }
    else linea = q;
  });
  if(linea) out.push(linea);
  return out;
}
function txtCabe(cx, y, s, ancho, tam, col, peso, fam, an){
  const lineas = parte(s, ancho, tam);
  lineas.forEach((t, i) => txt(cx, y + i*px(tam*1.35), t, an || "middle", tam, col,
                               peso, fam));
  return lineas.length;
}

function boton(cx, cy, ancho, rotulo, clave, o){

  const ent = Math.floor(v), dec = Math.round((v - ent)*10);

const TRAMOS_X = [0.00, 0.17, 0.31, 0.44, 0.55, 0.66, 0.745, 0.792, 0.86, 0.945, 1.00];
const TRAMOS_W = [0.78, 0.62, 0.255, 0.150, 0.100, 0.054, 0.030, 0.011, 0.092, 0.030, 0.000];
const TRAMOS_Y = [0.62, 0.605, 0.560, 0.515, 0.455, 0.378, 0.305, 0.262, 0.195, 0.170, 0.165];

function interp(u, xs, vs){
  if(u <= xs[0]) return vs[0];
  if(u >= xs[xs.length - 1]) return vs[vs.length - 1];
  for(let k = 1; k < xs.length; k++){
    if(u <= xs[k]){
      const t = (u - xs[k-1]) / (xs[k] - xs[k-1]);
      const s = t*t*(3 - 2*t);
      return vs[k-1] + (vs[k] - vs[k-1])*s;
    }
  }
  return vs[vs.length - 1];
}
const ejeY = u => interp(u, TRAMOS_X, TRAMOS_Y);
const anchoY = u => interp(u, TRAMOS_X, TRAMOS_W);

function sobreAgua(y0, y1, f){
  const alto = y1 - y0, n = 78, arr = [], vol = [];
  for(let k = 0; k <= n; k++){
    const u = k/n;
    const x = u*D.W, c = y0 + ejeY(u)*alto, w = anchoY(u)*alto*f;
    arr.push(x.toFixed(1) + "," + (c - w).toFixed(1));
    vol.push(x.toFixed(1) + "," + (c + w).toFixed(1));
  }
  vol.reverse();
  return "M" + arr.join(" L") + " L" + vol.join(" L") + " Z";
}
function orillaArr(y0, y1, f, lado){
  const alto = y1 - y0, n = 78, arr = [];
  for(let k = 0; k <= n; k++){
    const u = k/n;
    arr.push((u*D.W).toFixed(1) + ","
      + (y0 + ejeY(u)*alto + lado*anchoY(u)*alto*f).toFixed(1));
  }
  return "M" + arr.join(" L");
}
