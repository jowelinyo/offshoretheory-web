:root{

 --page:#E8EBED;
 --panel:#F6F7F7;
 --card:#FCFCFB;
 --inset:#F4F6F7;
 --bar:#1C2B36;

 --edge-frame:#B7C0C6;
 --edge-card:#BCC4C9;
 --edge-inner:#E4E8EA;
 --edge-panel:#CFD7DC;
 --edge-leader:#C1C9CE;
 --edge-button:#A9B4BB;
 --rule-heavy:#1C2B36;

 --ink-title:#0F171D;
 --ink-strong:#141C22;
 --ink-lead:#20292F;
 --ink-body:#333D45;
 --ink-secondary:#4A5A66;
 --ink-label:#5B6B77;
 --ink-quiet:#5E6B74;

 --accent-text:#9A5C10;
 --accent-graphic:#C97B1B;
 --accent-control:var(--accent-graphic);
 --accent-on-bar:#E2B15C;
 --link:#2F6C8F;
 --progress-pending:#CDD5DA;
 --on-bar:#DCE4E9; --on-bar-dim:#B8C7D0; --on-bar-strong:#F6F9FA;
 --on-primary:#F2F6F8;

 --sp-hair:4px; --sp-inline:8px; --sp-tight:12px; --sp-card:14px; --sp-block:16px;
 --sp-col-y:20px; --sp-col-x:22px; --sp-panel-y:18px; --sp-panel-c:22px;
 --sp-panel-x:30px; --sp-bar-x:24px; --sp-close:40px;

 --f-display:"Newsreader",ui-serif,Georgia,"Palatino Linotype","Times New Roman",serif;
 --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
 --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono","Segoe UI Mono",Menlo,Consolas,monospace;

 --sea-deep:#0A1E27; --sea:#102B36; --sea-line:#1E4453;
 --paper:#E3EAEE; --paper-ink:#EFE6D2; --paper-2:#D2DDE3; --paper-line:#A6B3BA;
 --ink:#15252D; --ink-soft:#5C7079; --dim:#829AA3;
 --magenta:#6B2461; --magenta-soft:#B07FA6;
 --water:#8FC3DA; --alarm:#B33A22; --ok:#3F7A56;

 --ink-glosa:#4A5C65;
 --alarm-noche:#D9744E;
 --dim-banda:#93A9B1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;background:var(--page);color:var(--ink-body);
 font:400 16px/1.68 var(--f-ui);-webkit-font-smoothing:antialiased;
 text-rendering:optimizeLegibility}

#barra{flex:none;height:54px;display:flex;align-items:center;gap:var(--sp-inline);
 padding:0 var(--sp-bar-x);background:var(--bar);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}

#barra a{text-decoration:none;cursor:pointer;
 display:inline-flex;align-items:center;min-height:44px}
.barlink{font:600 15px/1.45 var(--f-ui);color:var(--on-bar);white-space:nowrap;flex:none}
.barlink:hover{color:var(--on-bar-strong);text-decoration:underline}
#barra .sep{flex:none;width:1px;height:22px;background:#3A4E5C;margin:0 var(--sp-inline)}

#miga{font:400 17px/1.2 var(--f-display);color:var(--on-bar-dim);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#miga b{color:var(--on-bar-strong);font-weight:500}
#barra .crece{flex:1;min-width:var(--sp-inline)}
#barCont{flex:none;font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;
 color:var(--accent-on-bar);font-variant-numeric:tabular-nums}

#wrap{flex:1;min-height:0;display:grid;
 grid-template-columns:minmax(0,1fr) clamp(320px,37%,560px)}
#lienzo{min-width:0;min-height:0;display:flex;flex-direction:column;
 justify-content:center;align-items:center;
 padding:var(--sp-col-y) var(--sp-col-x)}

#ficha.sinCaja{background:transparent;border:0;box-shadow:none}

#ficha{--lam-ink:var(--paper-ink);--lam-dim:var(--dim);--lam-alarm:var(--alarm-noche);--lam-magenta:var(--magenta-soft)}
#ficha.sinCaja{--lam-ink:var(--ink-title);--lam-dim:var(--ink-glosa);--lam-alarm:var(--alarm);--lam-magenta:var(--magenta)}

#fichas .ficha{--lam-ink:var(--ink-title);--lam-dim:var(--ink-glosa);--lam-alarm:var(--alarm);--lam-magenta:var(--magenta)}
#fichas .escena{--lam-ink:var(--paper-ink);--lam-dim:var(--dim);--lam-alarm:var(--alarm-noche);--lam-magenta:var(--magenta-soft)}
#ficha{flex:1;align-self:stretch;min-height:0;position:relative;background:var(--sea-deep);
 border:1px solid var(--edge-card);border-radius:0;
 box-shadow:0 2px 3px rgba(28,43,54,.07);overflow:hidden}

#fichas{flex:1;min-height:0;display:grid;gap:var(--sp-card);
 grid-template-columns:1fr;justify-content:center;width:100%}
#cierre{flex:none;margin-top:var(--sp-close);padding-top:var(--sp-tight);
 border-top:2px solid var(--rule-heavy)}
#cierre .cf{font:500 24px/1.25 var(--f-display);color:var(--ink-title)}
#cierre .cp{margin-top:2px;font:italic 400 15px/1.45 var(--f-display);
 color:var(--ink-secondary)}

.ficha{flex:1;min-height:0;display:grid;
 background:var(--card);border:1px solid var(--edge-card);border-radius:0;
 box-shadow:0 2px 3px rgba(28,43,54,.07)}
.ficha.conpie{grid-template-columns:none;grid-template-rows:auto minmax(0,1fr) auto}
.ficha.conpie .bcab{border-bottom:1px solid var(--edge-inner)}
.ficha.conpie .bpie{border-top:1px solid var(--edge-inner)}
.ficha.allado{grid-template-rows:auto minmax(0,1fr)}
.ficha.allado .escena{grid-area:1/1/3/2}
.ficha.allado .bcab{grid-area:1/2/2/3;border-left:1px solid var(--edge-inner);
 align-self:end}
.ficha.allado .bpie{grid-area:2/2/3/3;border-left:1px solid var(--edge-inner);
 align-self:start}
.bcab,.bpie{padding:10px 18px;min-width:0}

.ficha.marcada{box-shadow:0 2px 3px rgba(28,43,54,.07),-3px 0 0 var(--accent-graphic)}
.escena{position:relative;background:var(--sea-deep);overflow:hidden}

.escena.dia{background:var(--paper)}
.escena.dia,#fichas .escena.dia{--lam-ink:var(--ink-title);--lam-dim:var(--ink-glosa);
 --lam-alarm:var(--alarm);--lam-magenta:var(--magenta)}
#fichas{width:100%}
.escena svg{position:absolute;inset:0;width:100%;height:100%}
.bcab{display:flex;align-items:baseline;gap:var(--sp-inline)}

.bcab .k{font:500 19px/1.2 var(--f-display);color:var(--ink-title);flex:none}
.ficha.marcada .bcab .k{color:var(--accent-text)}
.bcab .guia{flex:1;border-bottom:1px dotted var(--edge-leader);min-width:10px}
.bcab .v{font:400 12px/1.4 var(--f-mono);letter-spacing:.06em;color:var(--ink-label);
 flex:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.btit{font:600 16px/1.35 var(--f-ui);color:var(--ink-title)}

.btit.alarma{color:var(--accent-text)}

.res-col{background:var(--card);border:1px solid var(--edge-card);
 box-shadow:0 2px 3px rgba(28,43,54,.07);display:flex;flex-direction:column;
 min-width:0;overflow:hidden}
.res-col>h5{margin:0;padding:10px 16px;border-bottom:1px solid var(--edge-inner);
 font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;
 color:var(--ink-label)}
.res-col>div{padding:12px 16px;overflow:auto}
.res-col dl{margin:0}
.res-col dt{font:600 15px/1.35 var(--f-ui);color:var(--ink-title);margin-top:10px}
.res-col dt:first-child{margin-top:0}
.res-col dd{margin:1px 0 0;font:400 15px/1.4 var(--f-ui);color:var(--ink-secondary)}
.bglo{margin-top:2px;font:italic 400 16px/1.35 var(--f-display);
 color:var(--ink-secondary)}
#obj{position:absolute;inset:0}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#obj,#svg,#svg *{-webkit-user-select:none;-moz-user-select:none;user-select:none;
 -webkit-user-drag:none;-webkit-tap-highlight-color:transparent}
#obj svg .boton{cursor:pointer}

#side{min-height:0;display:flex;flex-direction:column;background:var(--panel);
 border-left:1px solid var(--edge-frame)}
#head{flex:none;padding:var(--sp-panel-y) var(--sp-panel-x);
 border-bottom:1px solid var(--edge-panel)}
.hd{display:flex;align-items:baseline;gap:var(--sp-tight)}
.hd>:last-child{margin-left:auto}

#hTit{font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;
 color:var(--ink-label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hN{flex:none;font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;
 color:var(--ink-quiet);font-variant-numeric:tabular-nums}
#prog{display:flex;gap:3px;margin-top:var(--sp-tight)}
#prog i{flex:1;height:5px;background:var(--progress-pending);border-radius:0;
 cursor:pointer}
#prog i.done{background:var(--link)}
#prog i.on{background:var(--accent-graphic)}
#pane{flex:1;min-height:0;overflow-y:auto;
 padding:var(--sp-panel-c) var(--sp-panel-x)}

h2{margin:0 0 var(--sp-block);font:500 31px/1.18 var(--f-display);
 color:var(--ink-title)}
h3{margin:0 0 var(--sp-tight);font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;
 text-transform:uppercase;color:var(--ink-label)}
p{margin:0 0 var(--sp-block);max-width:62ch;color:var(--ink-body)}
p:last-child{margin-bottom:0}
p b{color:var(--ink-title);font-weight:600}

p em{font-style:normal;color:var(--ink-secondary)}

button{font:600 15px/1.45 var(--f-ui);padding:11px 26px;border:1px solid transparent;
 border-radius:2px;cursor:pointer;background:var(--bar);color:var(--on-primary);
 min-height:44px}
button:hover:not(:disabled){background:#26394A}
button.sec{background:var(--card);color:var(--ink-lead);border-color:var(--edge-button);
 padding:10px 18px}
button.sec:hover:not(:disabled){background:var(--inset)}
button.show{background:transparent;color:var(--accent-text);
 border-color:var(--edge-button);padding:10px 18px}

a.skip{font:400 15px/1.45 var(--f-ui);color:var(--ink-secondary);cursor:pointer;
 text-decoration:none;white-space:nowrap;padding:0 var(--sp-tight);
 display:inline-flex;align-items:center;min-height:44px}
a.skip:hover{color:var(--ink-title);text-decoration:underline}

.prl{font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;color:var(--accent-text);
 margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}

b.q{display:block;margin:0 0 var(--sp-block);font:400 17px/1.6 var(--f-ui);
 color:var(--ink-lead);font-weight:400}
.ops{display:flex;flex-direction:column;gap:var(--sp-inline);
 margin:0 0 var(--sp-block);counter-reset:op}

.ops button{display:block;position:relative;width:100%;
 min-height:52px;padding:15px var(--sp-block) 15px 46px;text-align:left;
 background:var(--card);color:var(--ink-lead);border:1px solid var(--edge-card);
 font:400 17px/1.45 var(--f-ui)}
.ops button b{font-weight:600;color:var(--ink-title)}
.ops button::before{counter-increment:op;content:counter(op,upper-alpha);
 position:absolute;left:var(--sp-block);top:15px;
 font:500 15px/1.45 var(--f-mono);color:var(--accent-text)}
.ops button:hover:not(:disabled){background:var(--inset);
 border-color:var(--edge-button)}
.ops button:disabled{opacity:1;cursor:default;color:var(--ink-secondary)}

.res{margin:0 0 var(--sp-block);padding:var(--sp-tight) var(--sp-block);
 background:var(--inset);border:1px solid var(--edge-inner);
 border-left:3px solid var(--edge-panel);color:var(--ink-body);font-size:16px}
.res b{color:var(--ink-title);font-weight:600}
.res.si{border-left-color:var(--link)}
.res.no{border-left-color:var(--accent-graphic)}
.res.ver{border-left-color:var(--accent-graphic)}

.pista{margin:0 0 var(--sp-block);font:italic 400 19px/1.5 var(--f-display);
 color:var(--ink-secondary);border:0;padding:0}

.calc{margin:0 0 var(--sp-block);padding:var(--sp-tight) var(--sp-block);
 background:var(--inset);border:1px solid var(--edge-inner);
 font:400 15px/1.45 var(--f-ui);color:var(--ink-body);
 font-variant-numeric:tabular-nums}
.calc b{color:var(--ink-title);font-weight:600}

#foot{flex:none;border-top:1px solid var(--edge-panel);
 padding:var(--sp-panel-y) var(--sp-panel-x)}
#navPie .nav{display:flex;align-items:center;gap:var(--sp-inline);flex-wrap:wrap}
#navPie .nav button#sig,#navPie .nav button#otra{margin-left:auto}

.pie2{display:flex;align-items:baseline;gap:var(--sp-tight);
 margin-top:var(--sp-tight);font:400 12px/1.4 var(--f-mono);letter-spacing:.1em;
 color:var(--ink-quiet);white-space:nowrap}
.pie2>:last-child{margin-left:auto}
a.pieLink{color:var(--link);text-decoration:none;cursor:pointer;white-space:nowrap}
a.pieLink:hover{text-decoration:underline}
.sello{display:block;margin-top:var(--sp-hair);font:400 12px/1.4 var(--f-mono);

 letter-spacing:.1em;color:var(--ink-quiet);

 white-space:normal;overflow-wrap:anywhere}
.sello b{font-weight:400}

@media (max-width:1099px){
 #wrap{grid-template-columns:minmax(0,1fr) clamp(320px,34%,346px)}
 #miga{font-size:15px}
}

@media (max-width:999px){ #barra{height:50px} }

@media (max-width:699px){
 :root{ --sp-col-y:10px; --sp-col-x:12px; }
 #wrap{grid-template-columns:minmax(0,1fr);
       grid-template-rows:clamp(200px,46vh,520px) minmax(0,1fr)}
 #side{border-left:0;border-top:1px solid var(--edge-frame)}

 #barra .sep, #barra a[href="../index.html"]:last-of-type{display:none}
}

#escena{position:relative;flex:1;align-self:stretch;width:100%;min-height:0;
  border-radius:var(--r-card,10px);overflow:hidden;background:var(--sea-deep);
  border:1px solid var(--edge-frame)}
#escena canvas{display:block;width:100%;height:100%;touch-action:none}

#cargando{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font:400 14px/1.4 var(--f-ui);color:var(--dim);
  text-align:center;padding:var(--sp-tight)}
#escena.listo #cargando{display:none}

.montaje{display:grid;grid-template-columns:1fr;grid-template-areas:
  "et" "sl" "v";align-items:center;gap:var(--sp-hair);margin-top:var(--sp-tight)}
.montaje .et{grid-area:et;display:block;font:400 12px/1.4 var(--f-mono);
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-label);
  margin-bottom:var(--sp-hair)}
.montaje input{grid-area:sl;width:100%;min-height:44px;
  accent-color:var(--accent-control,#C97B1B)}
.montaje .v{grid-area:v;font:400 13px/1.4 var(--f-mono);color:var(--ink-secondary);
  text-align:left;min-width:0}

.humoSel{grid-template-areas:"et et" "sl sl" "v v"}
.humoBtns{grid-area:sl;display:flex;gap:var(--sp-hair);flex-wrap:wrap}
.humoBtn{flex:1 1 5.5em;min-height:44px;min-width:44px;
  font:400 14px/1.4 var(--f-ui);color:var(--ink-primary);
  background:var(--surface-raised,transparent);
  border:1px solid var(--rule);border-radius:2px;cursor:pointer}
.humoBtn[aria-pressed="true"]{border-color:var(--accent-control,#C97B1B);
  box-shadow:inset 0 0 0 1px var(--accent-control,#C97B1B)}
.humoSel .v{grid-area:v;text-align:left;min-width:0;margin-top:var(--sp-hair)}

#prog i{padding:12px 0 !important;background-clip:content-box !important;

"use strict";
const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

const PZ = [{"id": "7.1", "tema": "Starting her · Phase 7 · The electrical system", "pos": 15, "tope": 15, "mando": null, "camara": "front", "h": "A loop, and the half nobody looks at", "p": ["<b>Everything you have built so far is mechanical, and none of it does anything at all until this works.</b>", "The circuit that starts an engine is very simple and very large. <b>Simple</b> because it is a battery, a switch, a cable, a motor and a way back. <b>Large</b> because a starter motor turning a cold diesel against compression draws several hundred amps for a few seconds — which is why that positive cable is as thick as your finger, and why every connection in it matters.", "<b>It is a loop, and people only ever look at half of it.</b> Follow it: battery, isolator switch, heavy positive cable, starter motor. <b>That is the way out, and it is the half everybody checks.</b>", "<b>Now find the way back.</b> Every one of those hundreds of amps has to return to the battery, and it returns through the <b>earth strap</b> — the heavy black cable bonded from the battery to the engine block. <b>The engine itself is part of the circuit.</b> The current goes out along a red cable and comes home through the lump of iron you spent six phases building.", "<b>And that return leg is where the classic hidden fault lives.</b> A corroded earth gives you a starter that clicks and will not turn <b>while the battery tests perfectly fine on a meter</b> — because the battery <i>is</i> fine. The circuit is not. <b>So when the starter will not turn, check both ends of both heavy cables</b>, and check where the earth strap bolts to the block: green powder, a loose bolt or paint under a terminal will all do it. <i>Clean them once a year and smear them with petroleum jelly, and most of what people call electrical trouble never happens.</i>"], "q": "Follow the current out of the battery and all the way home. <b>Tap the five in the order it goes through them.</b>", "circuito": "elec", "orden": ["Engine-start battery", "Isolator switch", "Main positive cable", "Starter motor", "Earth return"], "bien": "<b>And the last one is the half nobody checks.</b> The way out is a red cable as thick as your finger and everybody looks at it; the way back is a black strap bolted to the block, and that is the one that quietly corrodes. <b>The engine itself is part of this circuit</b> — the current comes home through the lump of iron you spent six phases building. <b>A starter that clicks with a good battery is an earth until proved otherwise</b>, and that is the single most useful sentence in this phase.", "mal": "Current does not go anywhere unless it can get back. Four of these are the way out — the source, the switch, the big cable and the thing it feeds — and one of them is the way home. Put that one last."}, {"id": "7.2", "tema": "Starting her · Phase 7 · The electrical system", "pos": 15, "tope": 15, "mando": "montaje", "camara": "front", "h": "Two banks, and why they stay apart", "p": ["<b>There are two batteries on this boat and they are not spares for each other.</b>", "The <b>engine-start battery</b> does one job: it turns the engine, and on a boat wired the way she should be, nothing else is connected to it. It is built for a very large current for a very short time. The <b>domestic bank</b> runs everything else — lights, instruments, the fridge, the plotter, the autopilot — and it is built the opposite way: a modest current for a very long time.", "<b>They are kept apart because the fridge does not know when to stop.</b> Run one bank for both jobs and every light left on, every night at anchor, every hour of the fridge cycling comes out of the same battery you are going to ask for four hundred amps in the morning. <b>The whole point of two banks is that using the boat can never leave you unable to start the engine.</b>", "<b>And the thing in the middle is the split-charge relay.</b> The alternator makes one lot of current and both banks need it, so the relay joins them while the engine is running and charging, <b>and separates them the moment it stops</b>. That is its whole job, and it is why charging one alternator into two independent banks works at all.", "<i>And know what is in them. Batteries have a level, and the ones with caps need checking — the plates must stay covered, and topping up is with distilled water and nothing else. Sealed batteries have no caps and are not meant to be opened. Either way, look at the terminals: green or white powder on a post is resistance, and resistance is where a large current turns into heat.</i>"], "q": "A boat this size could carry one big battery instead of two. <b>Why does she carry two?</b>", "opciones": ["Because the two jobs are opposites — hundreds of amps for seconds, and a trickle for days — and one bank doing both means the fridge can leave you unable to start", "Because two smaller batteries are easier to carry aboard and fit under a bunk", "Because an alternator cannot charge a single large bank properly", "Because the starter motor needs a higher voltage than the cabin circuits"], "acierto": ["Because the two jobs are opposites — hundreds of amps for seconds, and a trickle for days — and one bank doing both means the fridge can leave you unable to start"], "bien": "<b>Because using the boat must never stop you starting the engine.</b> The two jobs are built for opposite things — a huge current for a few seconds against a small one for days — and if one bank did both, every light left on and every hour of the fridge would come out of the battery you need in the morning. <b>The relay is what lets one alternator feed both while keeping them apart when it matters.</b>", "mal": {"Because two smaller batteries are easier to carry aboard and fit under a bunk": "They often are, and that is not why. Two banks of the same total size would still be wired apart, and the reason is what each one is <i>for</i>.", "Because an alternator cannot charge a single large bank properly": "It can, and on many boats it does. What one alternator cannot do is keep two jobs from spending each other's charge — that is the relay's problem, not the alternator's.", "Because the starter motor needs a higher voltage than the cabin circuits": "Both banks are the same voltage. What differs is the <i>current</i>, and for how long."}, "malOtro": "Ask what happens to a single battery after a weekend at anchor with the fridge running, and then ask what you need it to do on Monday morning."}, {"id": "7.3", "tema": "Starting her · Phase 7 · The electrical system", "pos": 15, "tope": 15, "mando": "montaje", "camara": "front", "h": "Ten seconds, and what the noises mean", "p": ["<b>The starter is an electric motor with a small gear that it throws sideways into the ring gear on the flywheel.</b> It spins the engine fast enough for compression to make the air hot enough to light the fuel, and then it gets out of the way. It is doing the hardest electrical work on the boat — <b>which is why the cable is thick, why the battery is dedicated, and why it will not tolerate a poor connection anywhere.</b>", "<b>If she has not fired after about ten seconds of cranking, stop.</b> Not because the starter will overheat — though it will — but because <b>you are spending the one thing you cannot make more of.</b> A diesel that will not start in ten seconds has a reason, and the reason is not that it needed fifteen. <b>Ten seconds, stop, think</b> — and go and find the reason with the battery you still have.", "<b>And listen, because the noise tells you nearly everything.</b> <b>A single loud click and nothing turns:</b> the solenoid worked and the motor did not, so the current is not getting through — a flat battery, or a bad connection, and remember which half of the loop nobody checks. <i>It is almost never the starter motor itself.</i>", "<b>Nothing at all, not even a click:</b> isolator off, or the key circuit is dead — start with the switch. <b>Slow, laboured, heavy cranking:</b> there is current but not enough of it — a battery that is down, or voltage being lost in corroded terminals on the way. <b>A whirring or screeching with nothing turning:</b> the motor is spinning but the pinion is not staying engaged in the ring gear.", "<b>And she turns properly and simply does not fire.</b> Then the electrical side has done its job and handed you back a fuel or an air problem — <i>and you know exactly where to go, because you built the air in the second phase and the fuel in the third.</i>"], "q": "Ten seconds of cranking and she has not fired. <b>Why stop, rather than keep trying?</b>", "opciones": ["Because you are spending the one thing you cannot replace without the engine you are trying to start", "Because the starter motor will overheat and burn out", "Because unburnt diesel is collecting in the cylinders and will wash the bores", "Because the glow plugs need time to reheat between attempts"], "acierto": ["Because you are spending the one thing you cannot replace without the engine you are trying to start"], "bien": "<b>The battery, and there is no other way to fill it.</b> Everything else on this boat that runs out can be refilled from somewhere — this one is refilled by the engine you cannot start. <b>A diesel that will not start in ten seconds has a reason, and the reason is never that it needed fifteen.</b> Stop, and go and find the reason while you still have the current to act on it. <i>And listen while you are at it: the noise it makes has already told you where to look.</i>", "mal": {"Because the starter motor will overheat and burn out": "It will get hot, and that is real — but it cools down and recovers. Ask which of the two things you are using up does <b>not</b> come back on its own.", "Because unburnt diesel is collecting in the cylinders and will wash the bores": "Some does, and it is a slow problem rather than this morning's. What you are running out of right now is more urgent than that.", "Because the glow plugs need time to reheat between attempts": "On engines that have them, that is worth knowing and it is not the reason for the ten-second rule. The rule is about a resource, not a temperature."}, "malOtro": "Two things are being used up while you crank. One of them recovers by itself in a few minutes, and the other one is refilled only by the engine you are trying to start."}, {"id": "7.4", "tema": "Starting her · Phase 7 · The electrical system", "pos": 15, "tope": 15, "mando": "montaje", "camara": "front", "panel": {"oil": false, "temp": false, "charge": true, "aguja": 0.55}, "h": "The light that should go out", "p": ["<b>Starting the engine spends a lot of the battery in a few seconds. The alternator is what puts it back.</b> It is a generator, driven by the belt you met two phases ago, and once the engine is running it is the power station of the boat: it recharges what the start took and it carries everything switched on while she runs.", "<b>On almost every boat there is a warning light for this.</b> It comes on with the key before you start, and <b>it goes out once she is running</b>. That is the whole of its behaviour, and it is worth knowing exactly what it is telling you.", "<b>A light that is on with the key and the engine stopped is normal</b> — nothing is charging because nothing is turning. <b>A light that comes on, or never goes out, with the engine running means charging has stopped.</b> It is not a fault in the light: something between the belt and the battery is no longer doing its job. <i>And note what it does not tell you: it says nothing at all about how full the batteries are.</i>", "<b>And you have already met the commonest reason. The belt.</b> It drives this alternator, the freshwater pump and the seawater pump off one pulley, and when it goes all three stop. <b>So a charge light and a rising temperature needle appearing together are a broken belt until proved otherwise</b> — and it is the one fault you can diagnose from the helm before you open anything. <i>You worked exactly this case in the last part.</i>", "<b>A charge light on its own</b>, with the temperature steady and water at the exhaust, means the belt is turning and the fault is the alternator or its wiring instead. <b>One belt, three jobs — and two of the three tell you about it from the panel.</b>"], "q": "The charge light has come on while she is running. The temperature is steady and there is water at the exhaust. <b>What has stopped doing its job?</b>", "opciones": ["The alternator, or its wiring — the belt is proved by the two pumps still working", "The belt, which drives the alternator", "The engine-start battery, which is too flat to hold a charge", "The split-charge relay, which has stopped passing current to the domestic bank"], "acierto": ["The alternator, or its wiring — the belt is proved by the two pumps still working"], "bien": "<b>The alternator, and the question told you why.</b> Steady temperature and water at the exhaust mean both pumps are turning, and both pumps are on that belt — <b>so the belt is proved, and what is left is the thing the belt is turning that has stopped producing.</b> That is the whole trick of this circuit: you rule things out from the helm, before you open anything.", "mal": {"The belt, which drives the alternator": "It would be, and then you would have lost both water pumps with it. <b>You were told the temperature is steady and there is water at the exhaust</b> — the belt is turning.", "The engine-start battery, which is too flat to hold a charge": "A flat battery does not light a charge warning. That light watches whether anything is <i>charging</i>, not how full anything is.", "The split-charge relay, which has stopped passing current to the domestic bank": "A failed relay stops one bank being charged; it does not stop the charging. The light is watching the alternator, not the sharing."}, "malOtro": "Two of the three things on that belt are reporting for duty in the question itself. Ask what the third one is."}, {"id": "7.5", "tema": "Starting her · Phase 7 · The electrical system", "pos": 15, "tope": 15, "mando": "montaje", "camara": "front", "h": "One switch, two rules", "p": ["<b>One switch stands between the batteries and the whole boat, and there are two rules about it. They sound opposite and they are not.</b>", "<b>Rule one: turn it OFF before you work on the engine.</b> Before you touch anything in that compartment — a filter, a belt, a terminal, an impeller — turn the isolator off. <b>There is no fuse between a battery and a starter motor.</b> There cannot be: nothing sensible would carry that current. So a spanner that touches a live terminal and anything earthed at the same time does not blow a fuse — <b>it welds itself in place and turns red hot</b>, in a small space you are leaning into, above a bilge, next to fuel. <i>And there is the other reason, which is worse: a starter that gets a stray signal with the isolator on will turn the engine, and your hand may be resting on the belt at the time.</i>", "<b>Rule two: never turn it off while the engine is RUNNING.</b> This is the one that destroys things. The alternator is producing current into a circuit and the batteries are what absorb it; <b>take the batteries away while it is producing and the voltage has nowhere to go</b>, and the alternator's own electronics are what pays for it. <b>Stop the engine first, then isolate. Never the other way round.</b>", "<b>The two rules together: off when nothing is running, on when something is.</b> That is all of it, and knowing it is a normal examiner's question. <i>And there is a third use, which is why you should be able to find it in the dark: it is your first move in an electrical fire. Cutting the power at the battery is the only thing that stops current feeding a fire behind a panel you cannot reach.</i>", "<b>And it usually has one more position than you think.</b> Most isolators are not simply on and off: there is a position that joins the two banks together, and it is there for one reason — <b>the morning the starting battery is dead and the domestic bank still has something in it.</b> <i>Find out now whether yours has it and which position it is. Using it is a manoeuvre with its own order of doing things; knowing the switch can do it is what this screen is for.</i>"], "q": "<b>The two rules about the isolator sound opposite. Which pair is right?</b>", "opciones": ["Off before you work on a stopped engine — and never off while she is running", "Off before you work on her — and off again the moment you finish the passage, running or not", "On while you work, so you can test as you go — and off when you leave the boat", "It makes no difference which way round: it is a switch, and a switch is safe either way"], "acierto": ["Off before you work on a stopped engine — and never off while she is running"], "bien": "<b>Off when nothing is running; on when something is.</b> The first rule is about you: there is no fuse between that battery and the starter, so a dropped spanner does not blow anything — <b>it welds, and turns red hot, in a small space above a bilge next to fuel.</b> The second is about the engine: the alternator is pushing current into the batteries, and if you take them away while it is producing, <b>the voltage has nowhere to go and its electronics pay for it.</b> <i>Stop first, then isolate — never the other way round.</i>", "mal": {"Off before you work on her — and off again the moment you finish the passage, running or not": "The first half is right and the second half is the expensive mistake. <b>«The moment you finish»</b> is exactly when she is still running, and that is when isolating kills the alternator.", "On while you work, so you can test as you go — and off when you leave the boat": "That is both rules backwards. Working with it on is how a spanner welds itself across a terminal, and there is nothing to test that is worth it.", "It makes no difference which way round: it is a switch, and a switch is safe either way": "A switch carrying several hundred unfused amps is not a light switch. Which way round you use it is the whole subject of this screen."}, "malOtro": "One of the two rules protects you and the other protects the alternator. Ask what each is protecting, and then ask when the engine is turning."}, {"id": "7.6", "tema": "Starting her · Phase 7 · The electrical system", "pos": 15, "tope": 15, "mando": null, "camara": "front", "h": "Read the symptom", "p": ["<b>Three boats, three electrical complaints. Say what is at the bottom of each.</b>"], "banco": "ELECTRICO", "casos": [{"caso": "A", "q": "<i>One loud click when you turn the key, and nothing turns. The cabin lights stay bright while you do it, and the battery has just been tested and is fine.</i>", "opciones": ["A bad connection in the loop — and the earth strap is the half nobody checks", "The engine-start battery is flat", "The starter motor itself has failed", "The isolator switch is off"], "acierto": ["A bad connection in the loop — and the earth strap is the half nobody checks"], "bien": "<b>The earth.</b> Bright cabin lights say the battery has plenty in it and the meter agrees, so the fault is not the battery — <b>it is that the current cannot complete its loop.</b> The way out is a red cable everybody looks at; the way back is a black one bolted to the block, and that is the one that corrodes. <i>A click with a good battery is a connection until proved otherwise.</i>", "mal": {"The engine-start battery is flat": "<b>The question ruled it out twice</b> — bright lights and a clean test. It is the answer everybody gives, and everything on this list is a connection: that is the whole point of the case.", "The starter motor itself has failed": "It is almost never the starter. It is the most expensive thing to replace and the least likely thing to be wrong, and the click tells you the solenoid at least is getting a signal.", "The isolator switch is off": "Then you would get nothing at all — not even a click. A click means current reached the solenoid, so the switch is on."}, "malOtro": "The battery is good and you have been told so twice. So the current is not getting round. Ask which half of the circuit nobody checks."}, {"caso": "B", "q": "<i>The engine battery is flat on Monday mornings after a weekend on the mooring. The domestic bank is fine and nothing has been left switched on.</i>", "opciones": ["The split-charge relay is stuck closed, so the two banks stayed joined all weekend", "The engine battery is old and no longer holds its charge", "The alternator is not charging the engine bank", "Something small has been left on that nobody has found"], "acierto": ["The split-charge relay is stuck closed, so the two banks stayed joined all weekend"], "bien": "<b>The relay, and the healthy domestic bank is the clue rather than a comfort.</b> The two banks are supposed to separate the moment the engine stops. If the relay is stuck closed they stay joined all weekend, and the fridge quietly empties both — <b>except that the domestic bank is the big one, so what you notice is the small one being dead.</b>", "mal": {"The engine battery is old and no longer holds its charge": "An old battery goes down steadily, not on a weekly cycle tied to being left on a mooring. And it would not care what the domestic bank is doing.", "The alternator is not charging the engine bank": "Then it would be flat on the way home too, not just after a weekend of standing. Something is <i>draining</i> it, not failing to fill it.", "Something small has been left on that nobody has found": "Nothing is connected to the engine battery except the starter — that is what makes it the engine battery. So whatever is draining it got to it through something else."}, "malOtro": "Nothing was left on and the domestic bank is fine, so the start battery is being drained by something it should not even be connected to. Ask what is supposed to disconnect it, and when."}, {"caso": "C", "q": "<i>The charge light glows dimly at idle and goes out when you open the throttle, and the batteries never seem to come up fully. The belt is new and correctly tensioned, and she runs cool.</i>", "opciones": ["The alternator — worn brushes or a regulator on its way out", "The belt is slipping at low revs", "The domestic bank has a dead cell", "The isolator is on the wrong position"], "acierto": ["The alternator — worn brushes or a regulator on its way out"], "bien": "<b>The alternator.</b> The belt is ruled out for you — new, tight, and she runs cool, so both pumps are turning — and what is left is the thing the belt drives that is <b>still going round and no longer producing properly</b>. A light that glows at idle and clears with revs is output that is nearly enough and not quite.", "mal": {"The belt is slipping at low revs": "You were told it is new and correctly tensioned, and that she runs cool — which means it is turning both water pumps. <b>The belt is doing its job.</b>", "The domestic bank has a dead cell": "That would show as a bank that will not hold charge, and it would not put a light on. The charge light watches production, not storage.", "The isolator is on the wrong position": "An isolator is on or off for a bank; it does not make an alternator produce less at idle and more at speed."}, "malOtro": "The belt is new, tight, and turning both pumps — so the belt is not it. What else is on that belt that could keep going round while producing less than it should?"}]}, {"id": "8.1", "tema": "Starting her · Phase 8 · The transmission", "pos": 16, "tope": 16, "mando": null, "camara": "stern", "h": "The face the drive leaves by", "p": ["<b>Everything you have built in seven phases exists to turn one shaft, and here is where it leaves the engine.</b>", "The <b>flywheel</b> is a heavy iron disc bolted to the aft end of the crankshaft, turning inside the bell housing you closed up in the very first phase. It is there to smooth the turn — and what needs smoothing is not a gap. <b>Four cylinders fire one every half turn, so something is always pushing</b>; you read that off the engine in the second phase. What changes is <i>how hard</i>: a cylinder shoves hardest just after the top and has almost nothing left by the bottom, and while it pushes, the next one is being squeezed and is taking power back out. <b>So the crankshaft speeds up and slows down twice in every turn</b>, and the flywheel's weight is what evens it: it takes in the shove and gives it back in the lull. <b>Take it off and the engine would shake itself apart at idle</b> — and a single-cylinder engine, which really does have a gap, needs one far heavier than this.", "<b>And round its edge is the ring gear</b>, the toothed rim the starter throws its pinion into. You met that one phase ago, from the electrical side; this is the same meeting seen from the mechanical one.", "<b>Bolted to its face is the gearbox</b>, and from there the drive goes aft: a coupling, a shaft, the gland where it leaves the boat, and a propeller. <b>That is the whole of what is left, and it is all in front of you now.</b>", "<i>The push begins in a cylinder, at the top of the third stroke. Everything from there to the water is a chain of parts handing it on — and you have built every link of it.</i>"], "q": "The push starts in a cylinder and ends in the water. <b>Tap the eight in the order it passes through them.</b>", "circuito": "tra", "orden": ["Piston and connecting rod", "Crankshaft", "Flywheel", "Gearbox", "Flexible coupling", "Propeller shaft", "Stern gland", "Propeller"], "bien": "<b>That is the module, in eight steps.</b> The first two you built in the first phase and drove in the second; the third is the disc that smooths the shoves into a turn; and the last five are this one. <b>Notice where the gland sits — second from the end, and the only link in this chain that is also a hole in the boat.</b> Everything before it is engineering; everything from it aft is seamanship.", "mal": "Follow the push, not the parts. It is made in a cylinder, smoothed by something heavy, given a direction, carried aft down a bar, and it has to get out of the boat before it can reach anything."}, {"id": "8.2", "tema": "Starting her · Phase 8 · The transmission", "pos": 16, "tope": 16, "mando": "montaje", "camara": "stern", "h": "Ahead, neutral, astern", "p": ["<b>The engine only turns one way. The gearbox is what lets the boat go both.</b>", "It is bolted to the back of the bell housing and it does three things with one lever: <b>ahead</b>, <b>neutral</b> and <b>astern</b>. Inside, a set of gears and a clutch pack — on most small marine boxes, a cone or a plate clutch squeezed by oil pressure — either lock the output to the input, reverse it through an idler, or leave it disconnected.", "<b>And it usually reduces as well as reverses.</b> A propeller works best turning far slower than an engine, so the box gears it down — two or three turns of the engine for one of the shaft. <i>That ratio is in your engine's book, and it is why a propeller and a crankshaft never talk about the same revs.</i>", "<b>The lever goes to neutral before you start and before you stop</b>, every time. Starting in gear moves the boat before you are ready for it, and it is how people come off a pontoon sideways with somebody's hand still on a warp.", "<b>And it has its own oil, its own dipstick and its own rules</b> — the second dipstick you were told about four phases ago. <b>Some boxes take engine oil and some take automatic transmission fluid, and they are not interchangeable.</b> The level is checked its own way, which on many boxes is <i>without</i> screwing the dipstick in — read the book, because doing it the engine's way gives you a wrong answer with complete confidence."], "q": "You are checking the gearbox oil. <b>What is the mistake people make here?</b>", "opciones": ["Assuming it takes the same oil as the engine, and checking it the same way", "Checking it hot, when it should be checked cold", "Checking it in gear instead of in neutral", "Topping it up through the engine filler by mistake"], "acierto": ["Assuming it takes the same oil as the engine, and checking it the same way"], "bien": "<b>It is a different oil and a different method.</b> Some boxes take engine oil and some take automatic transmission fluid, and they are not interchangeable; and many are read with the dipstick <i>resting</i> in the hole rather than screwed home. <b>Do it the engine's way and you get a wrong answer with complete confidence</b> — which is worse than no answer. The book tells you both, and it is the only place that does.", "mal": {"Checking it hot, when it should be checked cold": "Boxes differ and some are checked warm on purpose. That is exactly why the answer is «read the book» rather than a rule you carry from the engine.", "Checking it in gear instead of in neutral": "You would have the lever in neutral anyway with the engine stopped, and it is not what makes people get this wrong.", "Topping it up through the engine filler by mistake": "That would be a bad afternoon and it is not the common one. The common one is assuming the two are the same thing."}, "malOtro": "The gearbox has its own dipstick, and that is a hint about more than where you look. Ask what else about it might not be the engine's."}, {"id": "8.3", "tema": "Starting her · Phase 8 · The transmission", "pos": 16, "tope": 16, "mando": "montaje", "camara": "stern", "h": "The joint that hides a fault", "p": ["<b>Between the gearbox and the shaft there is a flexible coupling, and it is doing something more subtle than it looks.</b>", "The engine sits on four rubber mounts and it moves — it rocks a little as you open the throttle, and it settles differently under load. <b>The shaft does not move: it runs through a bearing in a tube fixed to the hull.</b> Something has to take up the difference, and that is this joint: a rubber or composite disc that passes the turn and forgives a small misalignment.", "<b>And there is the danger, and it was announced seven phases ago.</b> In the first phase you were told that a sagging engine mount ends up punishing the stern gland. <b>This coupling is why you do not notice.</b> A mount that has softened lets the engine sit lower and the shaft pull out of line — and the coupling absorbs it, quietly, for a season.", "<b>So the misalignment does not announce itself where it happens. It announces itself further aft</b>: a gland that needs tightening more often than it used to, packing that wears unevenly, a shaft that runs warm, a vibration that comes and goes with the revs. <i>The part that fails is not the part that is wrong.</i>", "<b>Which is why engine mounts are a check and not a fitting.</b> Look at them: rubber that has gone soft, a mount sitting visibly lower than its neighbour, rust weeping from a stud. <b>Alignment is a yard job with a dial gauge — knowing that a gland problem may not be a gland problem is the part that is yours.</b>"], "q": "Your stern gland has started needing tightening more often than it used to. <b>What does that make you look at, and why is it not obvious?</b>", "opciones": ["The engine mounts — a sagging one pulls the shaft out of line, and the flexible coupling hides it", "The packing, which is simply worn out and needs replacing", "The propeller, which must have picked up a rope and bent something", "The gearbox, which is pushing the shaft aft as its clutch wears"], "acierto": ["The engine mounts — a sagging one pulls the shaft out of line, and the flexible coupling hides it"], "bien": "<b>The mounts, and the coupling is why you did not notice sooner.</b> A mount that has softened lets the engine sit lower, the shaft goes out of line, and the coupling forgives it — quietly, for a season — while the gland aft of it takes the punishment. <b>The part that fails is not the part that is wrong</b>, and this is the clearest example of it on the whole engine. <i>You were warned about this in the first phase, before you knew what a stern gland was.</i>", "mal": {"The packing, which is simply worn out and needs replacing": "It may well be worn, and repacking it fixes the symptom for another season. <b>Ask why it wore out faster than it used to</b> — that number changed, and packing does not decide to age quicker.", "The propeller, which must have picked up a rope and bent something": "That gives you a vibration that arrives all at once, on a day you remember. This one has crept up.", "The gearbox, which is pushing the shaft aft as its clutch wears": "A gearbox does not push the shaft along its length; the thrust is taken in the box or at a thrust bearing, and a worn clutch slips rather than shoves."}, "malOtro": "Something aft is wearing faster than it should, and the thing that would tell you why is designed to absorb exactly that. Look forward of the joint, not aft of it."}, {"id": "8.4", "tema": "Starting her · Phase 8 · The transmission", "pos": 16, "tope": 16, "mando": null, "camara": "iso", "enfoque": "Stern gland (stuffing box)", "cerca": true, "h": "The leak you are supposed to have", "p": ["<b>There is a turning steel bar going through a hole in the bottom of your boat. Something has to seal around it while letting it spin.</b>", "The traditional answer is a <b>packed gland</b>, and it is what this boat has: a box around the shaft stuffed with greased square packing, squeezed against the shaft by a nut you can adjust.", "<b>And it is meant to leak.</b> A few drops a minute while the shaft is turning, and that is not a fault — <b>it is the cooling and the lubrication</b>. Those drops are the only thing carrying heat out of a packing that is being rubbed by a shaft at cruising revs. <b>So bone dry is not better. Bone dry is too tight.</b> A gland with no drip gets hot, the packing hardens and burns, and then it stops sealing at all — and a hard packing running dry will score the shaft itself, which turns a five-pound job into a haul-out. <i>Squeeze the drip out of it and you have not fixed a leak, you have arranged a bigger one.</i>", "<b>There is another kind, and it reads the opposite way.</b> A <b>face seal</b> — two polished faces held together by a rubber bellows — runs dry on purpose, and a drip from one is a fault. <b>So the first thing to know about your own boat is which of the two she has</b>, because the same drop means «correct» on one and «wrong» on the other. And rubber in salt water does not last forever: a bellows is checked for softness and cracking on a schedule and replaced on a schedule, <b>not when it fails</b> — because when that one fails you have an open hole with a shaft in it.", "<i>And on a packed gland, the greaser: a small screw-down cup packed with waterproof grease, turned down a little every couple of hours under way. It is the easiest thing on a boat to forget, because nothing happens for a long time when you do — and then the packing dries, the shaft scores, and the gland starts leaking properly.</i>"], "q": "<b>Click the part on this boat that is supposed to leak.</b>", "acierto": ["Stern gland (stuffing box)"], "bien": "<b>The stern gland — a packed one, anyway.</b> A few drops a minute is the cooling and the lubrication, not a fault, and tightening it until it stops is how people cook the packing and score the shaft. <b>Along this shaft it is the one leak that is meant to be there</b>, and knowing that it is deliberate is what stops you fixing it.", "mal": {"Propeller shaft": "The shaft goes <i>through</i> the seal; it is not the seal. And you very much do not want that leaking.", "Gearbox / reverse gear": "Nothing on a gearbox is supposed to leak, and oil around one is worth chasing.", "Flexible coupling": "That passes the turn and forgives a misalignment. Nothing goes through it and nothing comes out of it.", "Propeller": "That is already in the water — there is nothing for it to leak into."}, "malOtro": "There is exactly one thing on this boat that is working correctly when water comes out of it. Look at where the shaft leaves."}, {"id": "8.5", "tema": "Starting her · Phase 8 · The transmission", "pos": 16, "tope": 16, "mando": "montaje", "camara": "stern", "h": "Shaft, anode, and what wraps round it", "p": ["<b>The last few feet, and the part of this engine that lives in the water.</b>", "The <b>shaft</b> is a bar of stainless steel or bronze running from the coupling, through the gland, through a bearing in the stern tube, to the propeller. The <b>propeller</b> converts the turn into a push, and it does it by being a screw: each blade is a slice of a helix, and turning it drags the boat along the thread it cuts in the water.", "<b>And out there it is on its own, electrically.</b> Different metals in seawater eat each other, so there is a <b>sacrificial anode</b> — a zinc collar clamped to the shaft, or one on the propeller nut — whose whole job is to be the one that gets eaten. <b>It is checked and replaced when the boat comes out, and an anode that has gone completely stopped protecting anything some time before you looked at it.</b> <i>It is the same idea as the zinc in the heat exchanger, and the same rule: it is meant to be consumed.</i>", "<b>And the thing that actually happens: a rope round the propeller.</b> A mooring strop, a lobster pot line, your own dinghy painter. The engine loads up, the note changes, and it stops — and if you are lucky that is all. <b>The moment you suspect it, the engine goes to neutral and then off.</b> Keeping it in gear winds the rope tighter, and a tight rope on a shaft pulls the shaft, which pulls the gland, which is a hole in the boat.", "<b>Some boats have a rope cutter on the shaft</b> — a disc of blades ahead of the propeller that chops what wraps round it. <i>It is worth having and it is not a reason to stop looking astern before you go into reverse near a pot field. Nothing cuts a two-inch mooring strop.</i>"], "q": "You feel the engine load up, the note changes, and you are fairly sure you have picked up a rope. <b>What do you do, in this order?</b>", "opciones": ["Neutral, then stop the engine — a rope still turning winds tighter and pulls on the shaft", "Astern, to try to unwind it before it tightens", "Hold the revs steady and motor clear of the pot field first", "Stop the engine, then put her in gear so the shaft cannot turn"], "acierto": ["Neutral, then stop the engine — a rope still turning winds tighter and pulls on the shaft"], "bien": "<b>Out of gear first, and then off.</b> Every turn after you suspect it winds the rope tighter, and a tight rope pulls the shaft — which pulls the gland, which is a hole in the boat with a bar through it. <b>Neutral stops the winding immediately; stopping the engine stops it from happening again.</b> After that you are anchored or drifting and thinking about a knife, which is a much better problem than the one you just avoided.", "mal": {"Astern, to try to unwind it before it tightens": "It sometimes works and it is a gamble with the shaft: astern turns the rope the other way with the same force, and if it does not come off you have wound it twice. <b>Take the drive off it first — you can always try astern from neutral.</b>", "Hold the revs steady and motor clear of the pot field first": "That is the answer that ends in a haul-out. Every second of turning is another wrap, and the boat is not going anywhere useful with a rope on the propeller.", "Stop the engine, then put her in gear so the shaft cannot turn": "Locking the shaft while sailing is a real technique for a different reason, and it is not this. Get the drive off it first; you can decide about the shaft afterwards."}, "malOtro": "Something is wrapping tighter with every turn. Ask what stops the turning fastest, and what that rope is pulling on while you decide."}, {"id": "8.6", "tema": "Starting her · Phase 8 · The transmission", "pos": 16, "tope": 16, "mando": null, "camara": "stern", "h": "Read the symptom", "p": ["<b>Three boats, three complaints from aft. Say what is at the bottom of each.</b>"], "banco": "TRANSMISION", "casos": [{"caso": "A", "q": "<i>The stern gland has needed tightening three times this season and the packing looks unevenly worn. There is a vibration that comes and goes with the revs. Nothing has been hit and nothing sounds wrong.</i>", "opciones": ["A sagging engine mount — the shaft is out of line and the coupling has been hiding it", "Worn packing, which simply needs replacing", "A bent propeller shaft from something struck earlier in the season", "The flexible coupling itself, which has perished"], "acierto": ["A sagging engine mount — the shaft is out of line and the coupling has been hiding it"], "bien": "<b>The mount, and this is the arc of the whole module closing.</b> You were told in the first phase — before you knew what a gland was — that a sagging mount ends up punishing the stern gland. It does it through a misalignment that the flexible coupling absorbs quietly, so <b>the part that fails is not the part that is wrong</b>. Uneven packing wear and a vibration that tracks the revs are what that looks like from aft.", "mal": {"Worn packing, which simply needs replacing": "Repack it and it will last another few months, and then you will do it again. <b>Ask why it wore out faster than it used to.</b>", "A bent propeller shaft from something struck earlier in the season": "That is a fair thought and it comes with a day you remember — a bang, a rope, a grounding. You were told nothing has been hit.", "The flexible coupling itself, which has perished": "It has been absorbing the misalignment, which is its job, and it may well be tired from doing it. But it is the messenger here, not the cause."}, "malOtro": "Something aft is wearing faster than it should, and the piece designed to absorb exactly that kind of error sits just forward of it. Look past the joint, at what is holding the engine up."}, {"caso": "B", "q": "<i>Ahead works perfectly. Astern engages, then slips under any real load and the boat barely moves. The gearbox oil is at the right level and looks clean.</i>", "opciones": ["The gearbox — its astern clutch is worn, and that is a yard job", "The propeller is the wrong pitch for going astern", "The flexible coupling is slipping under load", "The engine is not making enough power in reverse"], "acierto": ["The gearbox — its astern clutch is worn, and that is a yard job"], "bien": "<b>The gearbox.</b> Ahead and astern go through different parts of the same box, so one working and the other slipping points inside it — a worn clutch on the astern side. <b>Clean oil at the right level rules out the thing you can fix yourself</b>, which is exactly what that sentence is doing in the question.", "mal": {"The propeller is the wrong pitch for going astern": "A propeller is less efficient astern on every boat, and it does not slip: it pushes less. Slipping under load is a clutch.", "The flexible coupling is slipping under load": "It is bolted through, not friction-driven — it flexes, it does not slip. And it could not tell ahead from astern.", "The engine is not making enough power in reverse": "The engine turns the same way and makes the same power whichever way the boat is going. Everything that knows about «astern» is in the box."}, "malOtro": "One direction works and the other does not, and the engine cannot tell the difference. Ask which part can."}, {"caso": "C", "q": "<i>A vibration that started suddenly this afternoon, worse the more throttle you give her, and there was a fishing float astern when you came out of the anchorage.</i>", "opciones": ["Something round the propeller — out of gear and stop her before it winds tighter", "A worn cutless bearing in the stern tube", "The engine mounts, which have finally let go", "The gearbox, which is about to fail"], "acierto": ["Something round the propeller — out of gear and stop her before it winds tighter"], "bien": "<b>A rope, and the float is the clue.</b> A vibration that starts on a particular afternoon and gets worse with revs is something on the propeller, not something that wore out. <b>Neutral first, then off</b> — every turn winds it tighter and pulls on the shaft, and the shaft pulls on the gland.", "mal": {"A worn cutless bearing in the stern tube": "That gives a vibration too, and it arrives over months, not between one anchorage and the next. You were told when this started.", "The engine mounts, which have finally let go": "Mounts sag slowly and announce themselves through the gland, as in the first case. They do not do it in an afternoon.", "The gearbox, which is about to fail": "A failing box slips or whines; it does not start a vibration that grows with the throttle. And you saw a float."}, "malOtro": "It started on a particular afternoon and it gets worse the harder you push. Ask what you saw in the water on the way out."}]}, {"id": "8.7", "tema": "Starting her · Phase 8 · The transmission", "pos": 16, "tope": 16, "mando": "montaje", "camara": "stern", "enfoque": "Propeller", "cerca": true, "h": "From an empty hole to a moving boat", "p": ["<b>Take the control back to the beginning.</b> An empty compartment. Two bearers, a bilge with a little water in it, and nothing else at all. That is where you started. <b>Now push it forward, slowly, and watch what you have built.</b>", "<b>Four rubber blocks</b>, and then a <b>block of iron</b> that lands on them. <b>Covers</b> closing it up, and three joints with a gasket in each one. Inside it, <b>four pistons on four rods</b>, turning a <b>crankshaft</b> with its throws offset so that no two of them ever do the same thing at once. <b>Liners, valves, injectors</b> — and no spark plug anywhere.", "<b>Diesel</b> finding its way up from a tank through two filters to a pump that meters it, and most of it going straight back again. <b>Oil</b> climbing out of a tray, through a filter, along a gallery, into every bearing, and falling back down under its own weight. <b>Coolant</b> going round and round and never leaving, held hot on purpose by a valve. <b>The sea</b> coming in through a hole in the hull, taking the heat, joining the exhaust, and going back out through another hole.", "<b>Wires</b> heavy enough to turn all of it over, and a belt on the front driving three things at once. <b>And a shaft going out through the bottom of the boat to a propeller.</b>", "<b>Every one of those parts has a name, and you know them.</b> That is what this part of the course was for. <b>Not to make you a mechanic</b> — you will not take that engine apart and nobody is asking you to. <b>It was so that you can stand in front of an open engine compartment, have somebody point at something, and say what it is, what it does, and what goes wrong with it.</b> That is the examination, and it is also the thing that keeps you calm at three in the morning when something stops. <i>Next you will do some of it with your hands. After that you will learn to read what she tells you when something is wrong. But she is built, and you built her.</i>"], "q": "Run the control from one end to the other. Then <b>click the part where the push that began in a cylinder finally reaches the water.</b>", "acierto": ["Propeller"], "bien": "<b>The propeller.</b> Everything else in this module exists to get a push from the top of a piston to those blades, and they are <b>where the engine finally touches the water</b>. That is the chain, end to end — and you assembled every link of it, from an empty compartment to a boat that moves.", "mal": {"Propeller shaft": "That carries it the last few feet, and it is the right line. But a shaft turning in water does not move a boat — something on the end of it does.", "Stern gland (stuffing box)": "That is where the push leaves the boat, and it is the last thing you built that is still inside her. Go one step further.", "Flywheel": "That smooths it and passes it on. It is in the middle of the chain, not at the end of it.", "Gearbox / reverse gear": "That decides which way it goes and how fast. It is still a long way from the water."}, "malOtro": "Follow the chain aft until you run out of boat. The answer is the last thing the push touches before the water moves."}];
const TOT = 13;
const FICHERO = "c31-p1c-starting-her.html";

let FIG = null, MONTAJE = null, ANGULO = null, ORDEN = null, TALLER = null, HUMO = null;

let TODO = false;

let hayNuevas = false;

let iPaso = 0;
let iPZ = 0, iCaso = 0, RESP = 0;

function barajaEstable(lista, semilla) {
  const out = lista.slice();
  let n = 0;
  for (let k = 0; k < semilla.length; k++) n = (n * 31 + semilla.charCodeAt(k)) >>> 0;
  for (let i = out.length - 1; i > 0; i--) {
    n = (n * 1103515245 + 12345) >>> 0;
    const j = n % (i + 1);
    const t = out[i]; out[i] = out[j]; out[j] = t;
  }

  let igual = true;
  for (let k = 0; k < out.length; k++) if (out[k] !== lista[k]) { igual = false; break; }
  if (igual) out.push(out.shift());
  return out;
}

function arrancaFigura(){
  if (typeof Motor3D === "undefined" || Motor3D.error) {
    document.getElementById("cargando").textContent =
      "The 3-D engine could not start in this browser.";
    return false;
  }
  FIG = Motor3D.montar(document.getElementById("escena"));
  document.getElementById("escena").classList.add("listo");
  return true;
}

const PM_LUCES = [["oil","OIL"], ["temp","TEMP"], ["charge","CHG"]];
function pintaPanel(cfg){
  const caja = document.getElementById("panelMotor");
  if (!caja) return;
  const antes = caja.hidden;
  if (!cfg) { caja.hidden = true; if (!antes) avisaDelTamano(); return; }
  const fila = caja.querySelector(".pmLuces");
  if (!fila.children.length) {
    for (const [k, rot] of PM_LUCES) {
      const d = document.createElement("div");
      d.className = "pmLuz"; d.setAttribute("data-luz", k);
      d.innerHTML = '<i></i><b>' + rot + '</b>';
      fila.appendChild(d);
    }
  }
  for (const [k] of PM_LUCES)
    fila.querySelector('[data-luz="' + k + '"]').classList.toggle("on", !!cfg[k]);
  const f = Math.max(0, Math.min(1, cfg.aguja == null ? 0 : cfg.aguja));
  caja.querySelector(".pmAguja b").style.left = (f * 100).toFixed(1) + "%";
  caja.hidden = false;
  if (antes) avisaDelTamano();
}

function avisaDelTamano(){
  if (typeof window.dispatchEvent === "function")
    window.dispatchEvent(new Event("resize"));
}

let iP = 0;
function vaA(k){
  if (!(k >= 0 && k < PZ.length)) return false;
  iPZ = k; iCaso = 0; TODO = false; pinta(); return true;
}
function vaPantalla(k){ return vaA(k); }

function pinta(){
  iP = iPZ;
  const p = PZ[iPZ];
  pintaPanel(p.panel || null);
  document.getElementById("hTit").textContent = p.tema;
  document.getElementById("hN").textContent = (iPZ + 1) + " / " + TOT;

  if (FIG) {

    const nuevasDe = (donde) => {
      if (typeof MONTAJE_PIEZAS === "undefined") return [];
      const ahora = MONTAJE_PIEZAS[donde] || [];
      const antes = (iPZ > 0 && PZ[iPZ - 1] && MONTAJE_PIEZAS[PZ[iPZ - 1].pos])
        ? MONTAJE_PIEZAS[PZ[iPZ - 1].pos] : [];

      const base = (donde !== p.pos) ? (MONTAJE_PIEZAS[p.pos] || []) : antes;
      const fuera = {};
      base.forEach(n => { fuera[n] = 1; });
      return ahora.filter(n => !fuera[n]);
    };
    const pintaAtenuado = (donde) => {
      if (!FIG.atenua) return;
      if (TODO) { FIG.atenua(null); return; }
      const nuevas = nuevasDe(donde);
      if (!nuevas.length) { FIG.atenua(null); return; }
      FIG.atenua(nuevas);

      if (FIG.seVenDestacadas && !FIG.seVenDestacadas()) { FIG.atenua(null); hayNuevas = false; }
    };
    MONTAJE = MMontaje({ figura: FIG, tope: p.tope, inicio: p.pos,
                         alMover: (n) => pintaAtenuado(n) });
    pintaAtenuado(p.pos);
    hayNuevas = nuevasDe(p.pos).length > 0;

    ANGULO = null;
    HUMO = null;
    if (p.mando === "humo" && typeof MHumo === "function") {
      HUMO = MHumo({ figura: FIG, inicio: p.humo || null });
    }
    if (p.mando === "angulo") {
      ANGULO = MAngulo({ figura: FIG, inicio: p.angulo || 0 });
    } else if (p.angulo != null && FIG.verAngulo) {
      FIG.verAngulo(p.angulo);
    }

    if (FIG.corte) FIG.corte(p.corte ? 1 : 0);
    if (FIG.verCamara) FIG.verCamara(p.camara || "iso", false);

    if (p.enfoque && FIG.enfocar) FIG.enfocar(p.enfoque, false, !!p.cerca);

    if (FIG.enMarcha) FIG.enMarcha(!!p.marcha);

    if (FIG.verResaltadas) FIG.verResaltadas(p.marcas || []);

    if (FIG.verHumo && p.mando !== "humo") FIG.verHumo(p.humo || null);
  }

  const caso = (p.casos && p.casos[iCaso]) || null;

  if (FIG && p.pasos && typeof MTaller === "function") {

    const quiero = iPaso;
    TALLER = MTaller({ figura: FIG, pasos: p.pasos, fijo: p.fijo, camara: p.camara,
                       alPaso: function (n) { iPaso = n; } });
    TALLER.vaA(quiero);
  }

  let html = p.pasos ? "" : ("<h2>" + p.h + "</h2>");

  if (p.pasos && TALLER) {
    const n = TALLER.donde(), tot = TALLER.cuantos();
    html += '<div class="taller">'
      + '<div class="tPaso"><b>Step ' + (n + 1) + ' of ' + tot + '</b></div>'
      + '<div class="tTexto">' + p.pasos[n].t + '</div>'
      + '<div class="tNav">'
      + '<button class="tBtn" id="tAnt"' + (n ? "" : " disabled") + '>&larr; Back</button>'
      + '<button class="tBtn" id="tSig"'
      + (n === tot - 1 ? " disabled" : "") + '>Next step &rarr;</button>'
      + '</div></div>';
  }
  for (const t of p.p) html += "<p>" + t + "</p>";

  if (FIG && FIG.atenua && p.mando !== "humo" && !p.pasos && hayNuevas) {
    html += '<div class="verTodo"><button id="bTodo" aria-pressed="' + (TODO ? "true" : "false")
      + '">' + (TODO ? "Show me just this step" : "Show me everything") + '</button></div>';
  }

  if (FIG && p.mando === "montaje") {
    html += '<div class="montaje"><span class="et">Assembly</span>'
      + '<input type="range" id="mSl" min="0" max="' + p.tope
      + '" step="1" value="' + p.pos + '" aria-label="Assembly step">'
      + '<span class="v" id="mV"></span></div>';
  }

  if (FIG && p.mando === "humo" && HUMO) {
    html += '<div class="montaje humoSel"><span class="et">Smoke</span>'
      + '<div class="humoBtns" id="hB">';
    for (const c of HUMO.colores()) {
      html += '<button class="humoBtn" data-c="' + c + '"'
        + (c === HUMO.cual() ? ' aria-pressed="true"' : ' aria-pressed="false"')
        + '>' + c.charAt(0).toUpperCase() + c.slice(1) + '</button>';
    }
    html += '</div><span class="v" id="hV"></span></div>';
  }
  if (FIG && p.mando === "angulo") {

    html += '<div class="montaje"><span class="et">Crank</span>'
      + '<input type="range" id="aSl" min="0" max="720" step="5" value="'
      + (p.angulo || 0) + '" aria-label="Crank angle">'
      + '<span class="v" id="aV"></span></div>';
  }

  if (p.orden && typeof MOrden === "function") {
    ORDEN = MOrden({ piezas: barajaEstable(p.orden, p.id), orden: p.orden });
  }

  const q = caso ? caso.q : p.q;

  const OPS = (caso && caso.opciones) || p.opciones || null;
  if (p.orden && ORDEN) {
    html += '<div class="pregunta">' + p.q + "</div>";
    html += '<div class="orden" id="ord">';
    for (const it of ORDEN.lista()) {
      html += '<button class="orden-it" data-it="' + it.replace(/"/g, "&quot;") + '">'
        + '<span class="n"></span>' + it + "</button>";
    }
    html += "</div>";
    html += '<div class="veredicto" id="ver" hidden></div>';
  }

  if (q && !p.orden) {
    if (caso) {
      html += '<div class="caso"><b>Case ' + caso.caso + '</b> &#183; '
        + (iCaso + 1) + " of " + p.casos.length + "</div>";
    }
    html += '<div class="pregunta">' + q + "</div>";
    if (OPS) {
      html += '<div class="mx-ops">';
      for (let k = 0; k < OPS.length; k++) {
        html += '<button class="mx-op" data-k="' + k + '">'
          + OPS[k] + "</button>";
      }
      html += "</div>";
    }
    html += '<div class="veredicto" id="ver" hidden></div>';
    if (caso && iCaso < p.casos.length - 1) {
      html += '<div class="nav"><button id="otroCaso" hidden>'
        + "Next case &#8594;</button></div>";
    }
  }
  const pane = document.getElementById("pane");
  pane.innerHTML = html;
  pane.scrollTop = 0;

  const tS = document.getElementById("tSig"), tA = document.getElementById("tAnt");
  if (tS) tS.addEventListener("click", function () {
    if (TALLER) { iPaso = TALLER.siguiente(); pinta(); }
  });
  if (tA) tA.addEventListener("click", function () {
    if (TALLER) { iPaso = TALLER.anterior(); pinta(); }
  });

  const sl = document.getElementById("mSl");
  if (sl && MONTAJE) {
    const v = document.getElementById("mV");
    const di = () => { v.textContent = MONTAJE.ensena(); };
    di();
    sl.addEventListener("input", () => { MONTAJE.mueve(+sl.value); di(); });
  }
  const al = document.getElementById("aSl");
  if (al && ANGULO) {
    const v = document.getElementById("aV");
    const di = () => { v.textContent = ANGULO.ensena(); };
    di();
    al.addEventListener("input", () => { ANGULO.mueve(+al.value); di(); });
  }

  const hb = document.getElementById("hB");
  if (hb && HUMO) {
    const v = document.getElementById("hV");
    const di = () => {
      v.textContent = HUMO.ensena();
      hb.querySelectorAll(".humoBtn").forEach(function (b) {
        b.setAttribute("aria-pressed", b.dataset.c === HUMO.cual() ? "true" : "false");
      });
    };
    di();
    hb.addEventListener("click", function (e) {
      const b = e.target.closest(".humoBtn");
      if (!b) return;
      HUMO.mueve(b.dataset.c);
      di();
    });
  }
  const bt = document.getElementById("bTodo");
  if (bt) bt.addEventListener("click", function () { TODO = !TODO; pinta(); });

  const oc = document.getElementById("otroCaso");
  if (oc) oc.addEventListener("click", function () { iCaso++; pinta(); });

  if (ORDEN) {
    const pinta1 = () => {
      document.querySelectorAll(".orden-it").forEach(function (b) {
        const n = ORDEN.numeroDe(b.dataset.it);
        b.querySelector(".n").textContent = n ? n : "";
        b.classList.toggle("puesto", n > 0);
      });
    };
    pinta1();
    document.querySelectorAll(".orden-it").forEach(function (b) {
      b.addEventListener("click", function () {
        ORDEN.toca(b.dataset.it);
        pinta1();
        if (ORDEN.completo()) juzgaOrden();
      });
    });
  }

  if (FIG && q && !OPS && FIG.alSeleccionar) {
    FIG.alSeleccionar(function (nombre) { juzga(nombre); });
  }
  document.querySelectorAll(".mx-op").forEach(function (b) {
    b.addEventListener("click", function () { juzga(OPS[+b.dataset.k]); });
  });

  if (typeof vistoPon === "function") vistoPon(FICHERO, iPZ);
  progreso();
  navega();
}

function juzgaOrden(){
  const p = PZ[iPZ];
  const bien = ORDEN.acierta();
  if (bien === null) return;
  const caja = document.getElementById("ver");
  if (!caja) return;
  caja.hidden = false;
  caja.className = "veredicto " + (bien ? "bien" : "mal");
  caja.innerHTML = bien ? p.bien : p.mal;
  RESP++;
  document.getElementById("fLog").textContent = RESP + " answers logged";
}

function juzga(dada){
  const p = PZ[iPZ];
  const caso = (p.casos && p.casos[iCaso]) || null;
  const fuente = caso || p;
  if (!fuente.q) return;
  const bien = (fuente.acierto || []).indexOf(dada) >= 0;
  const caja = document.getElementById("ver");
  if (!caja) return;
  caja.hidden = false;
  caja.className = "veredicto " + (bien ? "bien" : "mal");
  caja.innerHTML = bien ? fuente.bien
    : ((fuente.mal && fuente.mal[dada]) || fuente.malOtro);

  const oc = document.getElementById("otroCaso");
  if (oc && bien) oc.hidden = false;
  RESP++;
  document.getElementById("fLog").textContent = RESP + " answers logged";
}

function progreso(){
  const pr = document.getElementById("prog");
  pr.innerHTML = "";
  for (let k = 0; k < TOT; k++) {
    const b = document.createElement("i");
    b.className = (k === iPZ ? "on" : (k < iPZ ? "done" : ""));

    b.title = "Screen " + (k + 1) + " of " + TOT + (PZ[k] && PZ[k].h ? " · " + PZ[k].h : "");
    b.setAttribute("data-va", k);
    b.onclick = () => { vaA(k); };
    pr.appendChild(b);
  }
  document.getElementById("barCont").textContent = (iPZ + 1) + " / " + TOT;
}

function navega(){
  let h = '<div class="nav">';
  if (iPZ > 0) h += '<button id="ant">&#8592; Back</button>';
  if (iPZ < TOT - 1) h += '<button id="sig">Next &#8594;</button>';
  h += "</div>";
  document.getElementById("navPie").innerHTML = h;
  const a = document.getElementById("ant"), s = document.getElementById("sig");

  if (a) a.addEventListener("click", function () { iPZ--; iCaso = 0; TODO = false; pinta(); });
  if (s) s.addEventListener("click", function () { iPZ++; iCaso = 0; TODO = false; pinta(); });
}

document.getElementById("deCero").addEventListener("click", function () {
  if (typeof vistoOlvida === "function") vistoOlvida(FICHERO);
  iPZ = 0; iCaso = 0; RESP = 0; TODO = false;
  document.getElementById("fLog").textContent = "0 answers logged";
  pinta();
});

if (typeof vistoEmpieza === "function") vistoEmpieza(FICHERO);
arrancaFigura();
iPZ = (typeof vistoPos === "function") ? vistoPos(FICHERO, TOT - 1) : 0;
pinta();
</script>
