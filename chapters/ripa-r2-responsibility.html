<script>
"use strict";

const NS = "http://www.w3.org/2000/svg";
const D = {W: 1000, H: 620};
let svg = null, gO = null, ESC = 1;
const px = n => n / ESC;

function el(t, at, pa){
  const e = document.createElementNS(NS, t);
  for(const k in at) if(at[k] !== undefined && at[k] !== null) e.setAttribute(k, at[k]);
  (pa || gO || svg).appendChild(e);
  return e;
}
function txt(x, y, s, an, tam, col, peso, fam, pa){
  const e = el("text", {x: x, y: y, "text-anchor": an || "start",
    "pointer-events": "none", "font-size": px(tam || 13),
    fill: col || "var(--lam-ink)", "font-weight": peso || 400,
    "font-family": fam === "mono" ? "var(--f-mono)" : "var(--f-ui)"}, pa);
  e.textContent = s;
  return e;
}
function parte(s, ancho, tam){
  const porLinea = Math.max(6, Math.floor(ancho / (px(tam) * 0.62)));
  const pal = String(s).split(/\s+/);
  const out = [];
  let linea = "";
  pal.forEach(function(p){
    const q = linea ? linea + " " + p : p;
    if(q.length > porLinea && linea){ out.push(linea); linea = p; }
    else linea = q;
  });
  if(linea) out.push(linea);
  return out;
}
function txtCabe(cx, y, s, ancho, tam, col, peso, fam, an){
  const lineas = parte(s, ancho, tam);
  lineas.forEach((t, i) => txt(cx, y + i*px(tam*1.35), t, an || "middle", tam, col,
                               peso, fam));
  return lineas.length;
}

function sondaDe(i, j){
  const s = Math.sin(i*12.9898 + j*78.233) * 43758.5453;
  return s - Math.floor(s);
}
function sonda(x, y, v){
  const ent = Math.floor(v), dec = Math.round((v - ent)*10);
  const t = el("text", {x: x, y: y, "text-anchor": "middle",
    "pointer-events": "none", "font-size": px(11.5), "font-style": "italic",
    fill: "var(--carta-sonda)", "font-family": "var(--f-ui)", opacity: .78});
  t.appendChild(document.createTextNode(String(ent)));
  if(dec){
    const u = document.createElementNS(NS, "tspan");
    u.setAttribute("font-size", px(8));
    u.setAttribute("dy", px(3));
    u.textContent = String(dec);
    t.appendChild(u);
  }
}

function plantaBarco(x, y, rumbo, tinta, op, largo){
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const L = largo || px(24), M = L*0.34;
  const P = (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  const q = [P(L*0.5, 0), P(L*0.14, M), P(-L*0.46, M*0.8),
             P(-L*0.5, -M*0.8), P(L*0.14, -M)];

  el("path", {d: "M" + q.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L")
                + " Z", fill: tinta, opacity: op === undefined ? .95 : op,
              "data-buque": "1"});
}

const LEY2 = {"a": "(a) Nothing in these Rules shall exonerate any vessel, or the owner, master or crew thereof, from the consequences of any neglect to comply with these Rules or of the neglect of any precaution which may be required by the ordinary practice of seamen, or by the special circumstances of the case.", "b": "(b) In construing and complying with these Rules due regard shall be had to all dangers of navigation and collision and to any special circumstances, including the limitations of the vessels involved, which may make a departure from these Rules necessary to avoid immediate danger.", "rot": {"peligro": "immediate danger", "salida": "a departure from these Rules"}};

function cita(t, ref){
  return '<div class="regla">&ldquo;' + t + '&rdquo;'
       + '<span class="cita">Rule 2' + (ref || "") + '</span></div>';
}

const R2 = {
  ella:  {fx: 0.19, fy: 0.40, rumbo: 90},
  tuyo:  {fx: 0.62, fy: 0.87, rumbo: 0},
  cruce: {fx: 0.62, fy: 0.40},
  sale:  {cx: 0.62, cy: 0.63, fx: 0.905, fy: 0.585}
};
const U = f => D.W * f;
const V = f => D.H * f;

function radioBajo(a, dentro){
  const base = dentro ? 0.19 : 0.30;
  return D.W * (base + 0.030*Math.sin(a*4.7 + (dentro ? 2.2 : 0.6))
                     + 0.016*Math.sin(a*9.3 + 1.4));
}
function arcoBajo(dentro){
  const n = 30, p = [];
  for(let k = 0; k <= n; k++){
    const a = (Math.PI/2) * k/n;
    const r = radioBajo(a, dentro);
    p.push((r*Math.cos(a)).toFixed(1) + "," + (D.H - r*Math.sin(a)).toFixed(1));
  }
  return p;
}

const VETO = {pt: [], caja: [], radio: 0};
function vetaPunto(x, y){ VETO.pt.push([x, y]); }
function vetaLinea(x0, y0, x1, y1, n){
  const m = n || 14;
  for(let k = 0; k <= m; k++) vetaPunto(x0 + (x1 - x0)*k/m, y0 + (y1 - y0)*k/m);
}
function vetaCurva(x0, y0, cx, cy, x1, y1){
  for(let k = 0; k <= 20; k++){
    const t = k/20, u = 1 - t;
    vetaPunto(u*u*x0 + 2*u*t*cx + t*t*x1, u*u*y0 + 2*u*t*cy + t*t*y1);
  }
}
function vetada(x, y){
  for(let i = 0; i < VETO.caja.length; i++){
    const c = VETO.caja[i];
    if(x > c[0] && x < c[2] && y > c[1] && y < c[3]) return true;
  }
  const r2 = VETO.radio*VETO.radio;
  for(let i = 0; i < VETO.pt.length; i++){
    const dx = x - VETO.pt[i][0], dy = y - VETO.pt[i][1];
    if(dx*dx + dy*dy < r2) return true;
  }
  return false;
}

function carta2(){

  el("rect", {x: 0, y: 0, width: D.W, height: D.H, fill: "var(--carta)",
              "data-banda": "honda"});

  [[false, "media", .55], [true, "somera", .20]].forEach(function(q){
    const p = arcoBajo(q[0]);
    el("path", {d: "M0," + D.H + " L" + p.join(" L") + " Z",
                fill: "var(--carta-" + q[1] + ")", "data-banda": q[1]});
  });
  [[false, .55], [true, .20]].forEach(function(q){
    el("path", {d: "M" + arcoBajo(q[0]).join(" L"), fill: "none",
                stroke: "var(--carta-veril)", "stroke-width": px(2),
                "stroke-opacity": q[1], "stroke-linejoin": "round"});
  });

  const cel = px(118);
  for(let i = 0; i*cel < D.W + cel; i++){
    for(let j = 0; j*cel < D.H + cel; j++){
      const r1 = sondaDe(i, j), r2 = sondaDe(i + 41, j + 17), r3 = sondaDe(i + 7, j + 91);
      if(r3 < 0.34) continue;
      const x = i*cel + r1*cel*0.7, y = j*cel + r2*cel*0.7;
      if(x < px(30) || x > D.W - px(30) || y < px(62) || y > D.H - px(48)) continue;
      if(vetada(x, y)) continue;
      const a = Math.atan2(D.H - y, Math.max(1, x));
      const r = Math.hypot(x, D.H - y);
      const hondo = r < radioBajo(a, true)  ? 2 + r1*4
                  : r < radioBajo(a, false) ? 8 + r1*7
                  :                           21 + r1*17;
      sonda(x, y, hondo);
    }
  }

  const nx = D.W - px(46), ny = px(76);
  el("line", {x1: nx, y1: ny + px(14), x2: nx, y2: ny - px(12),
              stroke: "var(--lam-ink)", "stroke-width": px(1.6)});
  el("path", {d: "M" + nx + "," + (ny - px(20)) + " L" + (nx - px(5)) + ","
                + (ny - px(9)) + " L" + (nx + px(5)) + "," + (ny - px(9)) + " Z",
              fill: "var(--lam-ink)"});
  txt(nx, ny + px(28), "N", "middle", 12, "var(--lam-ink)", 600, "mono");

  const ex = px(26), ey = px(64), k = px(150);
  el("line", {x1: ex, y1: ey, x2: ex + k, y2: ey,
              stroke: "var(--lam-dim)", "stroke-width": px(1.4)});
  [0, k].forEach(function(o){
    el("line", {x1: ex + o, y1: ey - px(5), x2: ex + o, y2: ey + px(5),
                stroke: "var(--lam-dim)", "stroke-width": px(1.4)});
  });
  txt(ex + k/2, ey + px(18), "1 mile", "middle", 11.5, "var(--lam-dim)", 400, "mono");
  txt(D.W - px(26), D.H - px(14), "depths in meters", "end", 10.5,
      "var(--lam-dim)", 400, "mono");
}

function punta(x, y, rumbo, tinta, op){
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const L = px(13), M = px(6.5);
  const P = (av, tr) => (x + sn*av + cs*tr).toFixed(1) + ","
                      + (y - cs*av + sn*tr).toFixed(1);
  el("path", {d: "M" + P(L, 0) + " L" + P(-L*0.55, M) + " L" + P(-L*0.55, -M) + " Z",
              fill: tinta, opacity: op === undefined ? .9 : op});
}

function cajaRotulo(x, y, s, an, tam, ancho){
  const ren = parte(s, ancho, tam);
  const anc = Math.min(ancho, Math.max.apply(null,
    ren.map(function(t){ return t.length; })) * px(tam) * 0.62 + px(16));
  let x0 = an === "end" ? x - anc : an === "start" ? x : x - anc/2;

  x0 = Math.max(px(6), Math.min(D.W - anc - px(6), x0));
  return [x0, y - px(tam) - px(3), x0 + anc, y - px(tam) + px(3) + ren.length*px(tam*1.35)];
}
function rotulo(x, y, s, an, tam, col, peso, ancho){
  const c = cajaRotulo(x, y, s, an, tam, ancho);
  el("rect", {x: c[0], y: c[1], width: c[2] - c[0], height: c[3] - c[1],
              rx: px(2), fill: "var(--carta)", opacity: .90});

  const tx = an === "end" ? c[2] - px(8) : an === "start" ? c[0] + px(8) : (c[0] + c[2])/2;
  parte(s, ancho, tam).forEach((t, i) =>
    txt(tx, y + i*px(tam*1.35), t, an || "middle", tam, col, peso));
}

function tamRot(t){
  return t * Math.min(1, (D.W*0.021) / px(13));
}

function rotulosDe(){
  return [
    {q: "ella",    s: "she is not keeping out of the way", an: "middle",
     tam: tamRot(13),   col: "var(--lam-ink)",    peso: 600, ancho: D.W*0.30},
    {q: "libro",   s: "holding your course, as the Rules say", an: "end",
     tam: tamRot(12.5), col: "var(--lam-dim)",    peso: 400, ancho: D.W*0.20},
    {q: "peligro", s: LEY2.rot.peligro, an: "end",
     tam: tamRot(13),   col: "var(--lam-alarm)",  peso: 600, ancho: D.W*0.21},
    {q: "salida",  s: LEY2.rot.salida, an: "middle",
     tam: tamRot(13),   col: "var(--lam-acento)", peso: 600, ancho: D.W*0.22}
  ];
}

const P2 = {
  h: "Responsibility",
  arriba: "Rule 2",

  lamina(){
    const ex = U(R2.ella.fx),  ey = V(R2.ella.fy);
    const tx = U(R2.tuyo.fx),  ty = V(R2.tuyo.fy);
    const cx = U(R2.cruce.fx), cy = V(R2.cruce.fy);
    const sx = U(R2.sale.fx),  sy = V(R2.sale.fy);
    const qx = U(R2.sale.cx),  qy = V(R2.sale.cy);

    const R = {};
    rotulosDe().forEach(function(r){ R[r.q] = r; });
    R.ella.x    = ex;            R.ella.y    = ey - px(48);
    R.libro.x   = tx - px(18);   R.libro.y   = ty - px(112);
    R.peligro.x = cx - px(26);   R.peligro.y = cy + px(4);
    R.salida.x  = U(0.845);      R.salida.y  = V(0.735);

    VETO.pt.length = 0; VETO.caja.length = 0; VETO.radio = px(30);
    vetaLinea(0, ey, D.W, ey, 26);
    vetaLinea(tx, ty, cx, cy, 16);
    vetaCurva(tx, ty, qx, qy, sx, sy);
    vetaPunto(ex, ey); vetaPunto(tx, ty); vetaPunto(cx, cy);
    rotulosDe().forEach(function(r){
      VETO.caja.push(cajaRotulo(R[r.q].x, R[r.q].y, r.s, r.an, r.tam, r.ancho));
    });

    carta2();

    el("line", {x1: 0, y1: ey, x2: D.W, y2: ey, stroke: "var(--lam-dim)",
                "stroke-width": px(1.6), "stroke-opacity": .55});
    punta(D.W - px(26), ey, 90, "var(--lam-dim)", .55);
    plantaBarco(ex, ey, R2.ella.rumbo, "var(--lam-magenta)", .92, px(34));

    el("line", {x1: tx, y1: ty, x2: cx, y2: cy + px(20),
                stroke: "var(--lam-ink)", "stroke-width": px(2),
                "stroke-dasharray": px(7) + "," + px(6), "stroke-opacity": .70});

    el("path", {d: "M" + tx + "," + ty + " Q" + qx + "," + qy + " " + sx + "," + sy,
                fill: "none", stroke: "var(--accent-graphic)",
                "stroke-width": px(3), "stroke-linecap": "round"});
    punta(sx, sy, 76, "var(--accent-graphic)", 1);

    plantaBarco(tx, ty, R2.tuyo.rumbo, "var(--lam-ink)", .95, px(34));

    const b = px(11);
    el("circle", {cx: cx, cy: cy, r: px(18), fill: "var(--lam-alarm)", opacity: .12});
    [[-1, -1, 1, 1], [-1, 1, 1, -1]].forEach(function(q){
      el("line", {x1: cx + q[0]*b, y1: cy + q[1]*b, x2: cx + q[2]*b, y2: cy + q[3]*b,
                  stroke: "var(--lam-alarm)", "stroke-width": px(2.6),
                  "stroke-linecap": "round"});
    });

    rotulosDe().forEach(function(r){
      rotulo(R[r.q].x, R[r.q].y, r.s, r.an, r.tam, r.col, r.peso, r.ancho);
    });

    el("rect", {x: 0, y: 0, width: D.W, height: px(42), fill: "var(--carta)",
                opacity: .88});
    txt(px(22), px(27), "WHEN THE RULES ARE NOT ENOUGH", "start", 12.5,
        "var(--lam-dim)", 600, "mono");
  },

  panel(){
    return "<h3>Rule 2</h3><h2>Responsibility</h2>"
         + cita(LEY2.a, "(a)")
         + cita(LEY2.b, "(b)");
  }
};

const PZ = [P2];

function redibuja(){
  svg = document.getElementById("svg");
  const caja = document.getElementById("ficha").getBoundingClientRect();
  if(!caja.width || !caja.height) return;
  D.H = Math.max(420, Math.round(D.W * caja.height / caja.width));
  ESC = caja.width / D.W;
  svg.setAttribute("viewBox", "0 0 " + D.W + " " + D.H);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  gO = el("g", {}, svg);
  P2.lamina();
}

function pintaPanel(){
  document.getElementById("pane").innerHTML = P2.panel();
  document.getElementById("barCont").textContent = "RULE 2 OF 19";
}

function toca(){ redibuja(); pintaPanel(); }

function vaPantalla(i){ toca(); }
const vaA = vaPantalla;

addEventListener("resize", redibuja);

if(typeof ResizeObserver !== "undefined")
  new ResizeObserver(redibuja).observe(document.getElementById("ficha"));
toca();
</script>
<script data-marco="1">

(function(){
"use strict";

const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

const MARCO = {id:"ripa", i:2, paginas:[{f:"ripa-r0-the-nineteen-rules.html",t:"The nineteen rules"},{f:"ripa-r1-application.html",t:"Rule 1 · Application"},{f:"ripa-r2-responsibility.html",t:"Rule 2 · Responsibility"},{f:"ripa-r3-general-definitions.html",t:"Rule 3 · General definitions"},{f:"ripa-r4-application.html",t:"Rule 4 · Application"},{f:"ripa-r5-look-out.html",t:"Rule 5 · Look-out"},{f:"ripa-r6-safe-speed.html",t:"Rule 6 · Safe speed"},{f:"ripa-r7-risk-of-collision.html",t:"Rule 7 · Risk of collision"},{f:"ripa-r8-action-to-avoid-collision.html",t:"Rule 8 · Action to avoid collision"},{f:"ripa-r9-narrow-channels.html",t:"Rule 9 · Narrow channels"},{f:"ripa-r10-traffic-separation-schemes.html",t:"Rule 10 · Traffic separation schemes"},{f:"ripa-r11-application.html",t:"Rule 11 · Application"},{f:"ripa-r12-sailing-vessels.html",t:"Rule 12 · Sailing vessels"},{f:"ripa-r13-overtaking.html",t:"Rule 13 · Overtaking"},{f:"ripa-r14-head-on-situation.html",t:"Rule 14 · Head-on situation"},{f:"ripa-r15-crossing-situation.html",t:"Rule 15 · Crossing situation"},{f:"ripa-r16-action-by-give-way-vessel.html",t:"Rule 16 · Action by give-way vessel"},{f:"ripa-r17-action-by-stand-on-vessel.html",t:"Rule 17 · Action by stand-on vessel"},{f:"ripa-r18-responsibilities-between-vessels.html",t:"Rule 18 · Responsibilities between vessels"},{f:"ripa-r19-restricted-visibility.html",t:"Rule 19 · Conduct of vessels in restricted visibility"}]};
const YO = MARCO.id;
const N = MARCO.paginas.length;
const dosCifras = n => (n < 10 ? "0" : "") + n;
const $ = id => document.getElementById(id);

const LLAVE_NAV = "ripa.nav";
function marcaNav(){ try{ sessionStorage.setItem(LLAVE_NAV, "1"); }catch(e){} }
function veniaDeDentro(){
  try{ return sessionStorage.getItem(LLAVE_NAV) === "1"; }catch(e){ return false; }
}

if(MARCO.i === 0 && !veniaDeDentro()){
  const p = vistoPos(YO, N - 1);
  if(p > 0){ marcaNav(); location.replace(MARCO.paginas[p].f); return; }
}
marcaNav();

vistoEmpieza(YO);
vistoPon(YO, MARCO.i);
if(MARCO.i === N - 1) vistoTermina(YO);

function vaA(i){
  if(i < 0 || i >= N || i === MARCO.i) return;
  marcaNav();
  vistoPon(YO, i);
  location.href = MARCO.paginas[i].f;
}

const CUENTA = dosCifras(MARCO.i + 1) + " / " + dosCifras(N);
function ponCuenta(){
  const b = $("barCont");
  if(b && b.textContent !== CUENTA) b.textContent = CUENTA;
}
ponCuenta();
if(typeof MutationObserver !== "undefined" && $("barCont"))
  new MutationObserver(ponCuenta).observe($("barCont"),
    {childList: true, characterData: true, subtree: true});

(function(){
  const pr = $("prog");
  if(!pr) return;
  pr.innerHTML = "";
  MARCO.paginas.forEach(function(q, i){
    const b = document.createElement("i");
    if(i === MARCO.i) b.className = "on"; else if(i < MARCO.i) b.className = "done";
    b.title = "Screen " + (i + 1) + " of " + N + " · " + q.t;

    b.setAttribute("data-va", i);
    b.onclick = function(){ vaA(i); };
    pr.appendChild(b);
  });
})();

const LLAVE_LOG = "ripa.log";
function leeLog(){
  try{ return parseInt(localStorage.getItem(LLAVE_LOG) || "0", 10) || 0; }
  catch(e){ return 0; }
}
function ponLog(n){ try{ localStorage.setItem(LLAVE_LOG, String(n)); }catch(e){} }
function pintaLog(){
  const f = $("fLog");
  if(!f) return;
  const n = leeLog();
  f.textContent = n + (n === 1 ? " answer logged" : " answers logged");
}
pintaLog();
document.addEventListener("click", function(e){
  const b = e.target.closest ? e.target.closest("[data-di]") : null;
  if(!b) return;
  if(b.getAttribute("data-di") === "otra") return;
  ponLog(leeLog() + 1);
  pintaLog();
}, true);

function hayPregunta(){
  return !!document.querySelector("#pane [data-di]:not([data-di=otra])");
}
function hayOtra(){ return !!document.querySelector("#pane [data-di=otra]"); }

function pintaNav(){
  const pie = $("navPie");
  if(!pie) return;
  const ultima = MARCO.i >= N - 1;
  let h = '<div class="nav">'
    + '<button class="sec" id="atras" data-va="' + (MARCO.i - 1) + '"'
    + (MARCO.i ? "" : " disabled") + ">Back</button>";
  if(hayPregunta())
    h += '<a class="skip" id="salta" data-va="' + (MARCO.i + 1) + '">Skip</a>';
  if(hayOtra()) h += '<button id="otra">Next one</button>';
  h += '<button id="sig" data-va="' + (MARCO.i + 1) + '"'
    + (ultima ? " disabled" : "") + ">"
    + (ultima ? "End of the module" : "Next") + "</button></div>";
  pie.innerHTML = h;
  const a = $("atras"); if(a) a.onclick = function(){ vaA(MARCO.i - 1); };
  const s = $("sig");   if(s) s.onclick = function(){ vaA(MARCO.i + 1); };
  const k = $("salta"); if(k) k.onclick = function(){ vaA(MARCO.i + 1); };
  const o = $("otra");
  if(o) o.onclick = function(){
    const b = document.querySelector("#pane [data-di=otra]");
    if(b) b.click();
  };
}
pintaNav();
if(typeof MutationObserver !== "undefined" && $("pane"))
  new MutationObserver(pintaNav).observe($("pane"), {childList: true, subtree: true});

(function(){
  const d = $("deCero");
  if(!d) return;
  d.onclick = function(){
    vistoOlvida(YO);
    marcaNav();
    location.href = MARCO.paginas[0].f;
  };
})();
})();
</script>
