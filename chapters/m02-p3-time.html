"use strict";
const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

let RND = 1;

window.azarSemilla = n => {
 RND = (n >>> 0) || 1;
 for(let k = 0; k < 8; k++) azar();
};
function azar(){
 RND ^= RND << 13; RND >>>= 0;
 RND ^= RND >>> 17;
 RND ^= RND << 5;  RND >>>= 0;
 return RND / 4294967296;
}
function baraja(a){
 const b = a.slice();
 for(let i = b.length - 1; i > 0; i--){
  const j = Math.floor(azar() * (i + 1));
  const t = b[i]; b[i] = b[j]; b[j] = t;
 }
 return b;
}
azarSemilla(Date.now());

function saca(bolsa, banco){

 if(bolsa.n!==banco.length){ bolsa.i=[]; bolsa.n=banco.length; }
 if(!bolsa.i.length){
  bolsa.i = baraja(banco.map((x, k) => k));

  }
 }
 const x = banco[bolsa.i.pop()];
 bolsa.ultima = x.id;
 return x;
}

      }
     }
    },
    "p": [
     "For about seven months of the year the United Kingdom does not run on UTC. It runs on <b>British Summer Time</b>, which is UTC with <b>one hour added</b> &mdash; and everybody's wrist, phone and kitchen wall goes with it.",
     "<b>BST is not another time. It is another label for the same moment.</b> Nothing at sea changes when the clocks go forward. The tide comes in when it was always going to come in.",
     "<b>Wind the clocks and watch.</b> The marker does not move. The boat does not move. The elapsed row does not move. <b>Only the labels do</b> &mdash; and the one over there moves with them, because they change on the same night.",
     "So before you can say what any clock reads, there is a smaller question to settle first, and it has nothing to do with arithmetic:",
     "<b>Is the country on BST on this date, or is it not?</b>",
     "That depends on the <b>date</b>, and the date is where this goes wrong. Notice that the button does not switch summer on and off: <b>it changes the day</b>. You never get to choose whether it is summer &mdash; the calendar chooses."
    ]
   },
   {
    "id": "2.S2",
    "h": "Where those two dates come from",
    "b": "Next",
    "lt": {
     "escena": {
      "tipo": "anyo",
      "pagina": {
       "tit": "SUMMER TIME 2026",
       "a1": "Summer Time (BST) is one hour ahead of UT.",
       "d1": "from · 0100 UT · Sunday 29 March",
       "d2": "until · 0100 UT · Sunday 25 October"
      },
      "pie": "Printed, not worked out."
     }
    },
    "p": [
     "The clocks change on <b>two Sundays a year</b>: the last Sunday in March, when they go <b>forward</b>, and the last Sunday in October, when they go <b>back</b>. Between those two Sundays the country is on BST. Outside them, on UTC.",
     "<b>You do not work those dates out.</b> They are printed &mdash; one line, in the almanac, for the year on its cover. Nobody on a boat counts backwards from the 31st of March looking for a Sunday, and neither will you.",
     "<b>That is the page.</b> You are not reading it yet; you are learning to recognise it, so that when the question comes up you know it has an answer and you know where the answer lives.",
     "And two things about those two mornings, because they are the only nights of the year when a clock time is not enough on its own. In <b>March</b> one hour of that morning <b>never happens at all</b> &mdash; there is no 0130 on any wall in the country. In <b>October</b> one hour <b>happens twice</b>, and &ldquo;half past one&rdquo; does not say which of the two you mean.",
     "<b>The almanac gets a module of its own, later: module 06</b>, after the tides and before the passage plan. There is far more in it than this one line &mdash; port entries, radio, lights, and the tide tables themselves. For now: the two dates are in there, and the book is where you look them up."
    ]
   }
  ]

    "p": [
     "Open an almanac at a foreign port and the heading says something like <code>TIMES ARE IN ZONE &minus;0100</code>. France is <b>one hour ahead</b> of UT. So why the minus?",
     "<b>Because it is not telling you the zone. It is telling you the correction that takes the printed times back to UT.</b> The table is in local time; take an hour off and you are in UT. That is what the minus is: an instruction pointing <b>home</b>.",
     "<b>The sign points one way and you will need it in both.</b> Read it as &ldquo;minus one to get home&rdquo; and it never inverts on you. More than one instructor will tell you this single line confuses students more than anything else on the course. It is not because it is hard. <b>It is because it is written backwards from the way you are about to use it.</b>",
     "<b>And you have almost certainly seen it written the other way round.</b> Set the clock on a phone and France is <b>UTC+1</b>. Open the almanac at the same port and it says <b>&minus;0100</b>. <b>They agree.</b> One counts the way there, the other counts the way home. Neither is wrong and you will meet both, sometimes on the same passage.",
     "<b>And a way to check yourself that needs no memory at all.</b> They are <b>east</b> of you. The earth turns that way, so the sun gets there first: their morning starts before yours, and <b>their clock is ahead of yours</b>.",
     "Whenever the sign starts arguing with you, ask which way the sun went. <b>It settles it every time, and it is the one thing about this that cannot be misremembered.</b>"

 svg.setAttribute("preserveAspectRatio","xMidYMid meet");
 ESC=esc();
 while(svg.firstChild)svg.removeChild(svg.firstChild);
 gO=el("g",{},svg);
 maqueta();
 const s=S();

 if(LT.escena){escena(); return;}

 if(!s.lt&&s.t!="ejemplo"){svg.setAttribute("viewBox","0 0 "+D.W+" "+D.H); return;}

 if(LT.pais)pais();
 else{
  const m=px(MARGEN);
  const cp=el("clipPath",{id:"recorte"},svg);

  el("rect",{x:HOJA.x0,y:HOJA.y0,width:HOJA.x1-HOJA.x0,height:COSTURA-HOJA.y0},cp);

  el("rect",{x:HOJA.x0,y:HOJA.y0,width:HOJA.x1-HOJA.x0,height:COSTURA-HOJA.y0,
   fill:COL.agua});
  const g=el("g",{"clip-path":"url(#recorte)",transform:
    "translate("+MAP_T.ox+","+MAP_T.oy+") scale("+MAP_T.k+")"},gO);
  const antes=gO; gO=g; mapa(); gO=antes;

  const c=claveFilas();
  const yR=Math.max(MAPA.y0+px(38),
    Math.min(MAPA.y0+(MAPA.y1-MAPA.y0)*0.22, COSTURA-px(66)));
  if(c.iz)reloj(CLAVE.izq,yR,c.iz);
  if(c.de)reloj(CLAVE.der,yR,c.de);

  const av=txt(HOJA.x0+px(10),COSTURA-px(9),"not to scale","start",11,COL.tinta);
  av.setAttribute("opacity",".55");}
 linea();
 marco();
}

function tarjetas(E){
 const n=E.fichas.length;
 const AN=px(268), AL=px(150), SEP=px(20);
 const total=n*AN+(n-1)*SEP, X0=500-total/2;
 const T=MAPA.y0+Math.max(0,(MAPA.y1-MAPA.y0-AL)/2);
 E.fichas.forEach((f,k)=>{
  const x=X0+k*(AN+SEP);
  el("rect",{x:x+px(4),y:T+px(4),width:AN,height:AL,rx:px(4),fill:"#0000001a"});
  el("rect",{x:x,y:T,width:AN,height:AL,rx:px(4),fill:"#fff",
   stroke:COL.tinta,"stroke-width":px(1.6)});
  el("rect",{x:x,y:T,width:AN,height:px(30),fill:COL.tinta});
  txt(x+px(12),T+px(21),f.l,"start",13,"#fff",600);
  f.t.forEach((q,i)=>txt(x+AN/2,T+px(58)+i*px(24),q,"middle",13,COL.tinta,
   i==0?600:400));});
 if(E.pie)txt(500,T+AL+px(36),E.pie,"middle",13,"#5a6b78");}

const PESO={carta:3, relojes:2, linea:2, documento:2};
let REG=[];
function hoja(lista){
 const m=px(MARGEN), alto=D.H-2*m;
 const suma=lista.reduce((a,r)=>a+PESO[r.tipo],0);
 let y=m; REG=[];
 lista.forEach((r,k)=>{
  const h=alto*PESO[r.tipo]/suma;
  REG.push({tipo:r.tipo, nom:r.nom, x0:m, x1:D.W-m, y0:y, y1:y+h});
  y+=h;});

 REG.forEach((r,k)=>{
  if(k)el("line",{x1:r.x0,y1:r.y0,x2:r.x1,y2:r.y0,stroke:COL.raya,
   "stroke-width":px(GR.filete)});
  const e=txt(r.x0,r.y0+px(15),r.nom,"start",11,COL.suave,600);
  e.setAttribute("letter-spacing",px(1.2));
  r.c0=r.y0+px(26);});
 return REG;}
const registro=t2=>REG.filter(r=>r.tipo==t2)[0];

function relojes(E){
 const r=registro("relojes"); if(!r)return;
 const n=E.uno?1:2;
 const anc=(r.x1-r.x0), h=r.y1-r.c0;

 const hayPares=!!E.pares;

 const ah=Math.min(hayPares?h*0.52:h*0.74, anc*0.26);
 const aw=Math.min(anc/(n+0.5), anc*0.42);
 const cy=r.c0+(hayPares?h*0.31:h*0.50);
 const xs=n==1?[500]:[r.x0+anc*0.27, r.x0+anc*0.73];
 xs.forEach((cx,k)=>{
  const d=n==1?E.a:(k?E.b:E.a);
  esfera(cx,cy,aw,ah,d.v,d.etq);});

 if(E.medio&&n==2){
  const q=txt(500,cy-ah*0.60,E.medio,"middle",TAM.lee,COL.tinta,600);
  q.setAttribute("font-family","DejaVu Serif,Georgia,serif");
  q.setAttribute("font-style","italic");
  el("line",{x1:500-px(70),y1:cy,x2:500+px(70),y2:cy,stroke:COL.raya,
   "stroke-width":px(GR.filete),"stroke-dasharray":px(4)+","+px(5)});}

 if(E.pares)E.pares.forEach(([q,d],k)=>{
  const x=500+anc*(d/1000), y=r.c0+h*0.78;
  el("rect",{x:x-anc*0.15,y:y-h*0.10,width:anc*0.30,height:h*0.20,rx:px(R.caja),
   fill:COL.papel,stroke:COL.raya,"stroke-width":px(GR.filete)});
  txt(x,y-h*0.055,q,"middle",TAM.rot,COL.suave);
  txt(x,y+h*0.075,E.a.v,"middle",TAM.cifra,COL.escrito,600);});
 if(E.pie)txt(500,r.y1-px(10),E.pie,"middle",TAM.rot,COL.suave);}

function esfera(cx,cy,an,al,v,etq){
 el("rect",{x:cx-an/2,y:cy-al/2,width:an,height:al,rx:px(R.caja),
  fill:COL.papel,stroke:COL.marco,"stroke-width":px(GR.marco)});

 el("line",{x1:cx-an/2,y1:cy-al/2+px(5),x2:cx+an/2,y2:cy-al/2+px(5),
  stroke:COL.raya,"stroke-width":px(GR.filete)});

 const cabe=Math.min(al*0.42, an*0.22)*ESC;
 const cuerpo=cabe>=TAM.hero?TAM.hero:TAM.cifra;
 txt(cx,cy+px(cuerpo)*0.34,v,"middle",cuerpo,COL.escrito,600);
 if(etq){
  el("line",{x1:cx-an/2,y1:cy+al/2-px(30),x2:cx+an/2,y2:cy+al/2-px(30),
   stroke:COL.raya,"stroke-width":px(GR.filete)});
  txt(cx,cy+al/2-px(11),etq,"middle",TAM.rot,COL.suave,600);}}

function pais(){
 const hueco=MAPA.y1-MAPA.y0;

 const grande = hueco>=px(240);
 const hCaja=px(48), hAire=px(28), hEsf=grande?px(106+30):px(70+26);
 const conFecha = hueco >= hCaja+hAire+hEsf;
 const alto=(conFecha?hCaja+hAire:0)+hEsf;
 const T=MAPA.y0+Math.max(0,(hueco-alto)/2);

 const conF=LT.filas.indexOf("fecha")>=0 && !esMuda("fecha");
 const b=LT.base;
 const fe=conF ? valorFila("fecha")
               : DIA[dsem(b.a,b.m,b.d)]+" "+b.d+" "+MES[b.m-1];
 if(conFecha){
  const an=Math.max(px(300), anchoTxt(fe,19)+px(52));
  el("rect",{x:500-an/2,y:T,width:an,height:hCaja,rx:px(8),
   fill:COL.panel,stroke:COL.raya,"stroke-width":px(1)});
  txt(500,T+px(31),fe,"middle",19,COL.tinta,600);}

 const yE=T+(conFecha?hCaja+hAire:0)+(grande?px(53):px(35));
 const fl=LT.filas.filter(q=>q!="fecha"&&q!="transcurrido");
 fl.slice(0,2).forEach((q,k)=>{
  const cx=500+px(fl.length<2?0:(k?165:-165));
  const mudo=esMuda(q)||(LT.filas.indexOf(q)<0);
  const v=mudo?"--:--":(function(z){return z.slice(0,2)+":"+z.slice(2);})(valorFila(q));
  display(cx,yE,v,rotulo(q),grande,mudo);});
}

function escena(){
 const E=LT.escena;

 if(E.tipo=="dos"||E.tipo=="uno"){
  hoja([{tipo:"relojes",nom:"THE CLOCKS"}]);
  relojes(E.tipo=="uno"?Object.assign({},E,{uno:true,
    pares:[["in summer",-160],["in winter",160]]}):E);
  return;}
 if(E.tipo=="dosVIEJO"){

  const hueco=MAPA.y1-MAPA.y0, T=Math.max(MAPA.y0,Math.min(MAPA.y0+(hueco-px(200))/2,COSTURA-px(200)));

 if(E.tipo=="tarjetas"){tarjetas(E); return;}
 if(E.tipo=="anyo"){

  const ALTO=246, hueco=MAPA.y1-MAPA.y0;
  const T=MAPA.y0+Math.max(0,(hueco-px(ALTO))/2);

    "stroke-width":px(1.4)});
   txt((a+b)/2,tira0+tiraAl/2+px(7),q,"middle",20,COL.tinta,600);});

  [["last Sunday in March",cam[0]],["last Sunday in October",cam[1]]].forEach(([q,x])=>{
   el("line",{x1:x,y1:tira0-px(10),x2:x,y2:tira0+tiraAl+px(10),stroke:"#c0392b",
    "stroke-width":px(3)});
   txt(x,y(76),q,"middle",12,COL.tinta,600);});
  if(E.pagina)pagina(E.pagina,y(92));
  if(E.pie)txt(500,y(E.pagina?236:120),E.pie,"middle",13,"#5a6b78");
  return;}

  if(k)el("line",{x1:HOJA.x0+an*k,y1:PIE+px(10),x2:HOJA.x0+an*k,y2:HOJA.y1-px(10),

function marcador(){
 if(LT.sinMarca)return;
 const x=xDe(LT.t0);
 if(conMapa())
  el("line",{x1:x,y1:MAP_T.oy+RUTA.y0*MAP_T.k,x2:x,y2:COSTURA-ret(2.5),

  "stroke-width":px(GR.mano),id:"marca"});

const xDe=m=>EJE.x0+(EJE.x1-EJE.x0)*(m-LT.eje[0])/(LT.eje[1]-LT.eje[0]);
const mDe=x=>LT.eje[0]+(LT.eje[1]-LT.eje[0])*(x-EJE.x0)/(EJE.x1-EJE.x0);

function xy(e){const r=svg.getBoundingClientRect(), s=esc();
 return [(e.clientX-r.left-(r.width-D.W*s)/2)/s,
         (e.clientY-r.top-(r.height-D.H*s)/2)/s];}
svg.addEventListener("pointerdown",e=>{
 const s=S(); if(!s.lt||LT.resuelto)return;
 const p=xy(e); e.preventDefault();
 svg.setPointerCapture&&svg.setPointerCapture(e.pointerId);
 cuerpo.classList.add("arrastrando");
 const fr=Math.max(0,Math.min(1,(LT.t0-LT.viaje.t)/Math.max(1,LT.viaje.dur)));

 if(p[1]>MAPA.y0&&p[1]<MAPA.y1&&LT.viaje&&!LT.escena&&!LT.pais){
  LT.tira="barco";mueve(p);return;}
 if(Math.abs(p[0]-xDe(LT.t0))<px(26)||p[1]>EJE.y-px(30)){LT.tira="marcador";mueve(p);}
});
svg.addEventListener("pointermove",e=>{if(LT.tira){e.preventDefault();mueve(xy(e));}});
svg.addEventListener("pointerup",()=>{LT.tira=null;cuerpo.classList.remove("arrastrando");});

function mueve(p){
 let t;
 if(LT.tira=="barco"){
  const nx=(p[0]-MAP_T.ox)/MAP_T.k;
  const fr=(nx-RUTA.x0)/(RUTA.x1-RUTA.x0);
  t=LT.viaje.t+LT.viaje.dur*Math.max(0,Math.min(1,fr));
 }else{
  t=mDe(p[0]);
 }

 t=Math.max(LT.eje[0],Math.min(LT.eje[1],t));
 if(LT.encaje)t=Math.round(t/LT.encaje)*LT.encaje;
 LT.t0=Math.max(LT.eje[0],Math.min(LT.eje[1],Math.round(t)));
 pinta(); tira();
}
