:root{

 --page:#E8EBED;
 --panel:#F6F7F7;
 --card:#FCFCFB;
 --inset:#F4F6F7;
 --bar:#1C2B36;

 --edge-frame:#B7C0C6;
 --edge-card:#BCC4C9;
 --edge-inner:#E4E8EA;
 --edge-panel:#CFD7DC;
 --edge-leader:#C1C9CE;
 --edge-button:#A9B4BB;
 --rule-heavy:#1C2B36;

 --ink-title:#0F171D;
 --ink-strong:#141C22;
 --ink-lead:#20292F;
 --ink-body:#333D45;
 --ink-secondary:#4A5A66;
 --ink-label:#5B6B77;
 --ink-quiet:#5E6B74;

 --accent-text:#9A5C10;
 --accent-graphic:#C97B1B;
 --accent-control:var(--accent-graphic);
 --accent-on-bar:#E2B15C;
 --link:#2F6C8F;
 --progress-pending:#CDD5DA;
 --on-bar:#DCE4E9; --on-bar-dim:#B8C7D0; --on-bar-strong:#F6F9FA;
 --on-primary:#F2F6F8;

 --sp-hair:4px; --sp-inline:8px; --sp-tight:12px; --sp-card:14px; --sp-block:16px;
 --sp-col-y:20px; --sp-col-x:22px; --sp-panel-y:18px; --sp-panel-c:22px;
 --sp-panel-x:30px; --sp-bar-x:24px; --sp-close:40px;

 --f-display:"Newsreader",ui-serif,Georgia,"Palatino Linotype","Times New Roman",serif;
 --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
 --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono","Segoe UI Mono",Menlo,Consolas,monospace;

 --sea-deep:#0A1E27; --sea:#102B36; --sea-line:#1E4453;
 --paper:#E3EAEE; --paper-ink:#EFE6D2; --paper-2:#D2DDE3; --paper-line:#A6B3BA;
 --ink:#15252D; --ink-soft:#5C7079; --dim:#829AA3;
 --magenta:#6B2461; --magenta-soft:#B07FA6;
 --water:#8FC3DA; --alarm:#B33A22; --ok:#3F7A56;

 --ink-glosa:#4A5C65;
 --alarm-noche:#D9744E;
 --dim-banda:#93A9B1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;background:var(--page);color:var(--ink-body);
 font:400 16px/1.68 var(--f-ui);-webkit-font-smoothing:antialiased;
 text-rendering:optimizeLegibility}

#barra{flex:none;height:54px;display:flex;align-items:center;gap:var(--sp-inline);
 padding:0 var(--sp-bar-x);background:var(--bar);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}

#barra a{text-decoration:none;cursor:pointer;
 display:inline-flex;align-items:center;min-height:44px}
.barlink{font:600 15px/1.45 var(--f-ui);color:var(--on-bar);white-space:nowrap;flex:none}
.barlink:hover{color:var(--on-bar-strong);text-decoration:underline}
#barra .sep{flex:none;width:1px;height:22px;background:#3A4E5C;margin:0 var(--sp-inline)}

#miga{font:400 17px/1.2 var(--f-display);color:var(--on-bar-dim);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

#barra .crece{flex:1;min-width:var(--sp-inline)}
#barCont{flex:none;font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;
 color:var(--accent-on-bar);font-variant-numeric:tabular-nums}

#wrap{flex:1;min-height:0;display:grid;
 grid-template-columns:minmax(0,1fr) clamp(320px,37%,560px)}
#lienzo{min-width:0;min-height:0;display:flex;flex-direction:column;
 justify-content:center;align-items:center;
 padding:var(--sp-col-y) var(--sp-col-x)}

#ficha.sinCaja{background:transparent;border:0;box-shadow:none}

#ficha{--lam-ink:var(--paper-ink);--lam-dim:var(--dim);--lam-alarm:var(--alarm-noche);--lam-magenta:var(--magenta-soft)}
#ficha.sinCaja{--lam-ink:var(--ink-title);--lam-dim:var(--ink-glosa);--lam-alarm:var(--alarm);--lam-magenta:var(--magenta)}

#fichas .ficha{--lam-ink:var(--ink-title);--lam-dim:var(--ink-glosa);--lam-alarm:var(--alarm);--lam-magenta:var(--magenta)}
#fichas .escena{--lam-ink:var(--paper-ink);--lam-dim:var(--dim);--lam-alarm:var(--alarm-noche);--lam-magenta:var(--magenta-soft)}
#ficha{flex:1;align-self:stretch;min-height:0;position:relative;background:var(--sea-deep);
 border:1px solid var(--edge-card);border-radius:0;
 box-shadow:0 2px 3px rgba(28,43,54,.07);overflow:hidden}

#fichas{flex:1;min-height:0;display:grid;gap:var(--sp-card);
 grid-template-columns:1fr;justify-content:center;width:100%}
#cierre{flex:none;margin-top:var(--sp-close);padding-top:var(--sp-tight);
 border-top:2px solid var(--rule-heavy)}
#cierre .cf{font:500 24px/1.25 var(--f-display);color:var(--ink-title)}
#cierre .cp{margin-top:2px;font:italic 400 15px/1.45 var(--f-display);
 color:var(--ink-secondary)}

.ficha{flex:1;min-height:0;display:grid;
 background:var(--card);border:1px solid var(--edge-card);border-radius:0;
 box-shadow:0 2px 3px rgba(28,43,54,.07)}
.ficha.conpie{grid-template-columns:none;grid-template-rows:auto minmax(0,1fr) auto}
.ficha.conpie .bcab{border-bottom:1px solid var(--edge-inner)}
.ficha.conpie .bpie{border-top:1px solid var(--edge-inner)}
.ficha.allado{grid-template-rows:auto minmax(0,1fr)}
.ficha.allado .escena{grid-area:1/1/3/2}
.ficha.allado .bcab{grid-area:1/2/2/3;border-left:1px solid var(--edge-inner);
 align-self:end}
.ficha.allado .bpie{grid-area:2/2/3/3;border-left:1px solid var(--edge-inner);
 align-self:start}
.bcab,.bpie{padding:10px 18px;min-width:0}

.ficha.marcada{box-shadow:0 2px 3px rgba(28,43,54,.07),-3px 0 0 var(--accent-graphic)}
.escena{position:relative;background:var(--sea-deep);overflow:hidden}

.escena.dia{background:var(--paper)}
.escena.dia,#fichas .escena.dia{--lam-ink:var(--ink-title);--lam-dim:var(--ink-glosa);
 --lam-alarm:var(--alarm);--lam-magenta:var(--magenta)}
#fichas{width:100%}
.escena svg{position:absolute;inset:0;width:100%;height:100%}
.bcab{display:flex;align-items:baseline;gap:var(--sp-inline)}

.bcab .k{font:500 19px/1.2 var(--f-display);color:var(--ink-title);flex:none}
.ficha.marcada .bcab .k{color:var(--accent-text)}
.bcab .guia{flex:1;border-bottom:1px dotted var(--edge-leader);min-width:10px}
.bcab .v{font:400 12px/1.4 var(--f-mono);letter-spacing:.06em;color:var(--ink-label);
 flex:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.btit{font:600 16px/1.35 var(--f-ui);color:var(--ink-title)}

.btit.alarma{color:var(--accent-text)}

.res-col{background:var(--card);border:1px solid var(--edge-card);
 box-shadow:0 2px 3px rgba(28,43,54,.07);display:flex;flex-direction:column;
 min-width:0;overflow:hidden}
.res-col>h5{margin:0;padding:10px 16px;border-bottom:1px solid var(--edge-inner);
 font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;
 color:var(--ink-label)}
.res-col>div{padding:12px 16px;overflow:auto}
.res-col dl{margin:0}
.res-col dt{font:600 15px/1.35 var(--f-ui);color:var(--ink-title);margin-top:10px}
.res-col dt:first-child{margin-top:0}
.res-col dd{margin:1px 0 0;font:400 15px/1.4 var(--f-ui);color:var(--ink-secondary)}
.bglo{margin-top:2px;font:italic 400 16px/1.35 var(--f-display);
 color:var(--ink-secondary)}
#obj{position:absolute;inset:0}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#obj,#svg,#svg *{-webkit-user-select:none;-moz-user-select:none;user-select:none;
 -webkit-user-drag:none;-webkit-tap-highlight-color:transparent}
#obj svg .boton{cursor:pointer}

#side{min-height:0;display:flex;flex-direction:column;background:var(--panel);
 border-left:1px solid var(--edge-frame)}
#head{flex:none;padding:var(--sp-panel-y) var(--sp-panel-x);
 border-bottom:1px solid var(--edge-panel)}
.hd{display:flex;align-items:baseline;gap:var(--sp-tight)}
.hd>:last-child{margin-left:auto}

#hTit{font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;
 color:var(--ink-label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hN{flex:none;font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;
 color:var(--ink-quiet);font-variant-numeric:tabular-nums}
#prog{display:flex;gap:3px;margin-top:var(--sp-tight)}
#prog i{flex:1;height:5px;background:var(--progress-pending);border-radius:0;
 cursor:pointer}
#prog i.done{background:var(--link)}
#prog i.on{background:var(--accent-graphic)}
#pane{flex:1;min-height:0;overflow-y:auto;
 padding:var(--sp-panel-c) var(--sp-panel-x)}

h2{margin:0 0 var(--sp-block);font:500 31px/1.18 var(--f-display);
 color:var(--ink-title)}
h3{margin:0 0 var(--sp-tight);font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;
 text-transform:uppercase;color:var(--ink-label)}
p{margin:0 0 var(--sp-block);max-width:62ch;color:var(--ink-body)}
p:last-child{margin-bottom:0}
p b{color:var(--ink-title);font-weight:600}

p em{font-style:normal;color:var(--ink-secondary)}

button{font:600 15px/1.45 var(--f-ui);padding:11px 26px;border:1px solid transparent;
 border-radius:2px;cursor:pointer;background:var(--bar);color:var(--on-primary);
 min-height:44px}
button:hover:not(:disabled){background:#26394A}
button.sec{background:var(--card);color:var(--ink-lead);border-color:var(--edge-button);
 padding:10px 18px}
button.sec:hover:not(:disabled){background:var(--inset)}
button.show{background:transparent;color:var(--accent-text);
 border-color:var(--edge-button);padding:10px 18px}

a.skip{font:400 15px/1.45 var(--f-ui);color:var(--ink-secondary);cursor:pointer;
 text-decoration:none;white-space:nowrap;padding:0 var(--sp-tight);
 display:inline-flex;align-items:center;min-height:44px}
a.skip:hover{color:var(--ink-title);text-decoration:underline}

.prl{font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;color:var(--accent-text);
 margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}

b.q{display:block;margin:0 0 var(--sp-block);font:400 17px/1.6 var(--f-ui);
 color:var(--ink-lead);font-weight:400}
.ops{display:flex;flex-direction:column;gap:var(--sp-inline);
 margin:0 0 var(--sp-block);counter-reset:op}

.ops button{display:block;position:relative;width:100%;
 min-height:52px;padding:15px var(--sp-block) 15px 46px;text-align:left;
 background:var(--card);color:var(--ink-lead);border:1px solid var(--edge-card);
 font:400 17px/1.45 var(--f-ui)}
.ops button b{font-weight:600;color:var(--ink-title)}
.ops button::before{counter-increment:op;content:counter(op,upper-alpha);
 position:absolute;left:var(--sp-block);top:15px;
 font:500 15px/1.45 var(--f-mono);color:var(--accent-text)}
.ops button:hover:not(:disabled){background:var(--inset);
 border-color:var(--edge-button)}
.ops button:disabled{opacity:1;cursor:default;color:var(--ink-secondary)}

.res{margin:0 0 var(--sp-block);padding:var(--sp-tight) var(--sp-block);
 background:var(--inset);border:1px solid var(--edge-inner);
 border-left:3px solid var(--edge-panel);color:var(--ink-body);font-size:16px}
.res b{color:var(--ink-title);font-weight:600}
.res.si{border-left-color:var(--link)}
.res.no{border-left-color:var(--accent-graphic)}
.res.ver{border-left-color:var(--accent-graphic)}

.pista{margin:0 0 var(--sp-block);font:italic 400 19px/1.5 var(--f-display);
 color:var(--ink-secondary);border:0;padding:0}

.calc{margin:0 0 var(--sp-block);padding:var(--sp-tight) var(--sp-block);
 background:var(--inset);border:1px solid var(--edge-inner);
 font:400 15px/1.45 var(--f-ui);color:var(--ink-body);
 font-variant-numeric:tabular-nums}
.calc b{color:var(--ink-title);font-weight:600}

#foot{flex:none;border-top:1px solid var(--edge-panel);
 padding:var(--sp-panel-y) var(--sp-panel-x)}
#navPie .nav{display:flex;align-items:center;gap:var(--sp-inline);flex-wrap:wrap}
#navPie .nav button#sig,#navPie .nav button#otra{margin-left:auto}

.pie2{display:flex;align-items:baseline;gap:var(--sp-tight);
 margin-top:var(--sp-tight);font:400 12px/1.4 var(--f-mono);letter-spacing:.1em;
 color:var(--ink-quiet);white-space:nowrap}
.pie2>:last-child{margin-left:auto}
a.pieLink{color:var(--link);text-decoration:none;cursor:pointer;white-space:nowrap}
a.pieLink:hover{text-decoration:underline}
.sello{display:block;margin-top:var(--sp-hair);font:400 12px/1.4 var(--f-mono);

 letter-spacing:.1em;color:var(--ink-quiet);

 white-space:normal;overflow-wrap:anywhere}
.sello b{font-weight:400}

@media (max-width:1099px){
 #wrap{grid-template-columns:minmax(0,1fr) clamp(320px,34%,346px)}
 #miga{font-size:15px}
}

@media (max-width:999px){ #barra{height:50px} }

@media (max-width:699px){
 :root{ --sp-col-y:10px; --sp-col-x:12px; }
 #wrap{grid-template-columns:minmax(0,1fr);
       grid-template-rows:clamp(200px,46vh,520px) minmax(0,1fr)}
 #side{border-left:0;border-top:1px solid var(--edge-frame)}

 #barra .sep, #barra a[href="../index.html"]:last-of-type{display:none}
}

#escena{position:relative;flex:1;align-self:stretch;width:100%;min-height:0;
  border-radius:var(--r-card,10px);overflow:hidden;background:var(--sea-deep);
  border:1px solid var(--edge-frame)}
#escena canvas{display:block;width:100%;height:100%;touch-action:none}

#cargando{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font:400 14px/1.4 var(--f-ui);color:var(--dim);
  text-align:center;padding:var(--sp-tight)}
#escena.listo #cargando{display:none}

.montaje{display:grid;grid-template-columns:1fr;grid-template-areas:
  "et" "sl" "v";align-items:center;gap:var(--sp-hair);margin-top:var(--sp-tight)}
.montaje .et{grid-area:et;display:block;font:400 12px/1.4 var(--f-mono);
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-label);
  margin-bottom:var(--sp-hair)}
.montaje input{grid-area:sl;width:100%;min-height:44px;
  accent-color:var(--accent-control,#C97B1B)}
.montaje .v{grid-area:v;font:400 13px/1.4 var(--f-mono);color:var(--ink-secondary);
  text-align:left;min-width:0}

.humoSel{grid-template-areas:"et et" "sl sl" "v v"}
.humoBtns{grid-area:sl;display:flex;gap:var(--sp-hair);flex-wrap:wrap}
.humoBtn{flex:1 1 5.5em;min-height:44px;min-width:44px;
  font:400 14px/1.4 var(--f-ui);color:var(--ink-primary);
  background:var(--surface-raised,transparent);
  border:1px solid var(--rule);border-radius:2px;cursor:pointer}

"use strict";
const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

const PZ = [{"id": "4.1", "tema": "Keeping it alive · Phase 4 · The oil", "pos": 9, "tope": 9, "mando": "montaje", "camara": "port", "h": "The sump stops being silent", "p": ["<b>You bolted this on three phases ago and nobody told you what it was for. Here it is.</b>", "The <b>sump</b> is the tray at the bottom of the engine, and it is where all the oil lives when the engine is not running. Every drop that goes anywhere in this engine starts here and comes back here. There is nothing else — no separate tank, no reservoir somewhere else in the boat. <b>What is in that tray is all the oil the engine has.</b>", "Sitting in the lowest part of it is the <b>pickup strainer</b>, a coarse mesh. The pump draws everything through it, so anything solid enough to matter is stopped before it can reach a bearing.", "<b>You will never see it, service it, or clean it afloat.</b> It is welded into the bottom of a tray you cannot open without lifting the engine.", "<b>Which is exactly why oil changes matter.</b> Oil wears out — it collects soot, water and metal, and it turns to sludge — and that sludge settles in the bottom of the sump, right where that mesh is. Change the oil on time and it never builds up. Leave it and one day the pump is trying to draw through a blocked screen, and the first you know is an alarm."], "q": "You will never see the pickup strainer, and you certainly cannot clean it afloat. <b>So what keeps it clear?</b>", "opciones": ["Changing the oil before the sludge that blocks it has time to build up", "The oil filter, which catches everything before it gets there", "The bypass valve, which lets oil round it when it clogs", "Nothing — it is designed never to block"], "acierto": ["Changing the oil before the sludge that blocks it has time to build up"], "bien": "<b>Oil changes, and nothing else.</b> That mesh sits in the lowest part of a tray you cannot open, and what blocks it is sludge settling out of tired oil. Change the oil on time and the sludge never accumulates. That is the whole reason the interval matters — not the oil going bad in the abstract, but this one part you can never reach.", "mal": {"The oil filter, which catches everything before it gets there": "Look at the order. The pump draws <i>through</i> the strainer and pushes <i>into</i> the filter — the filter is downstream, so it protects the engine, not the strainer.", "The bypass valve, which lets oil round it when it clogs": "That is in the filter, and it saves the engine from a blocked <i>filter</i>. There is nothing to go round a blocked strainer: it is the only way in.", "Nothing — it is designed never to block": "It is designed to be hard to reach, which is not the same thing. It blocks if you let sludge build, and the first sign is an alarm."}, "malOtro": "It is welded into a tray you cannot open. Ask what stops the sludge getting there in the first place."}, {"id": "4.2", "tema": "Keeping it alive · Phase 4 · The oil", "pos": 9, "tope": 9, "mando": "montaje", "camara": "port", "h": "Under pressure, and through a filter", "p": ["<b>The oil pump is a pair of gears, driven straight off the crankshaft.</b>", "That last part matters more than it sounds. <b>It is not switched on and it cannot be turned off.</b> The instant the crankshaft moves — the instant the starter engages — the pump is turning and the whole system is coming up to pressure. There is no delay and no warm-up.", "<b>Everything the pump pushes goes through the filter</b>, which is a spin-on cartridge — a can you unscrew and throw away. It catches the carbon and the fine metal that the coarse strainer let through.", "<b>And it has a detail in it worth knowing.</b> A filter that blocks completely would starve the engine, so there is a <b>bypass valve</b> built into it: if the filter clogs, the valve opens and unfiltered oil goes round it and on into the engine.", "<b>That is deliberate, and it tells you what the designers were afraid of.</b> Dirty oil wears an engine out slowly. <b>No oil destroys it in seconds.</b> Given the choice they took dirty, every time."], "q": "The filter has a bypass valve that opens when it clogs, letting unfiltered oil through. <b>Why would anyone build that in?</b>", "opciones": ["Because dirty oil wears an engine out slowly, and no oil wrecks it in seconds", "Because it lets the filter be changed with the engine running", "Because it raises the pressure when the oil is cold and thick", "Because it stops the filter bursting"], "acierto": ["Because dirty oil wears an engine out slowly, and no oil wrecks it in seconds"], "bien": "<b>They chose dirty over none.</b> A blocked filter with no way round it would starve every bearing in the engine within seconds. Dirty oil is a bad outcome measured in months; no oil is a bad outcome measured in turns. The valve tells you which one the designers were afraid of.", "mal": {"Because it lets the filter be changed with the engine running": "Nobody changes a filter with the engine running, and the valve does nothing for that. It opens on a <i>blocked</i> filter, not a missing one.", "Because it raises the pressure when the oil is cold and thick": "Cold oil does push the valve open, and that is a side effect rather than the reason. Ask what happens on a warm engine whose filter has clogged.", "Because it stops the filter bursting": "A burst filter would be a mess, and it is not what the valve is protecting. Look past the filter, at what is downstream of it."}, "malOtro": "Ask which is worse for an engine: oil with grit in it, or no oil at all."}, {"id": "4.3", "tema": "Keeping it alive · Phase 4 · The oil", "pos": 9, "tope": 9, "mando": null, "camara": "port", "h": "Everywhere, and back down on its own", "p": ["<b>From the filter the oil goes into one long drilled passage running the length of the block. That is the main gallery, and it is the trunk road.</b>", "Off it, smaller drillings branch to everywhere that turns or rubs: <b>every main bearing the crankshaft sits in, every big end where a connecting rod grips it, and the camshaft.</b> Some engines also aim a small jet at the underside of each piston, to cool the crown and oil the bore from below.", "You will never see any of it. It is a network of narrow holes drilled through solid iron, and it is invisible for the life of the engine. <b>What you need to take from it is why narrow matters: sludge blocks narrow holes, and a blocked drilling starves one bearing while every gauge on the boat reads normal.</b>", "<b>And then look at what happens at the end of it.</b> The oil comes out of the bearings, and there is nothing to collect it and nothing to pump it back.", "<b>It falls.</b> Down the inside of the block, off the crankshaft, down the walls, into the tray it started in. <b>The whole return side of this circuit is gravity</b>, which is why the sump is at the bottom and why the engine has to sit more or less level to work properly."], "q": "Nothing pushes the oil back — there is no return pump and nothing to collect it. <b>Click where it ends up anyway.</b>", "acierto": ["Oil sump"], "bien": "<b>The sump, and gravity did it.</b> The oil leaves the bearings and falls down the inside of the engine into the tray it started in. That is the whole return side of the circuit — no pump, no pipe, just down — and it is why the sump is at the bottom and why an engine that is not sitting level does not scavenge properly.", "mal": {"Oil filter": "That is on the way out, under pressure. Nothing comes back through a filter.", "Oil cooler": "On the way out too, and it only cools what is passing through it.", "Oil pump": "It pushes, and it pushes one way. What comes back does not go through it — it falls past it."}, "malOtro": "There is no pump on the return side. Ask where things go when nothing is holding them up."}, {"id": "4.4", "tema": "Keeping it alive · Phase 4 · The oil", "pos": 10, "tope": 10, "mando": "montaje", "camara": "port", "h": "Where two circuits touch", "p": ["<b>Oil does its job by being slippery, and it stops being slippery when it gets hot.</b>", "The film of oil between a bearing and a shaft is thinner than you can imagine, and it holds them apart by being just thick enough. Heat it and it thins, the film breaks down, and metal touches metal. So on a hard-working engine the oil is cooled on purpose.", "<b>This is the oil cooler, and it is the odd one out on this engine.</b> Look at its color. It is not the color of the engine parts you have been building — it belongs to the seawater circuit, which you have not built yet.", "<b>That is because it belongs to both.</b> Inside it, engine oil runs on one side and raw seawater runs on the other, separated by a thin metal wall. Heat crosses that wall. Nothing else is supposed to.", "<b>It is one of only two places on this engine where oil or coolant and the sea are a wall apart</b> — you will build the other one, the heat exchanger, in the next phase — and it is the reason it matters here: <b>when that wall fails, they mix.</b>"], "q": "Inside the oil cooler, engine oil runs on one side of a thin metal wall and raw seawater on the other. <b>What is that wall for?</b>", "opciones": ["To let the heat across and nothing else", "To let the oil cool by mixing slowly with the seawater", "To keep the two circuits at the same pressure", "To filter the seawater before it reaches the oil"], "acierto": ["To let the heat across and nothing else"], "bien": "<b>Heat crosses; nothing else is supposed to.</b> That is what a heat exchanger is, and this one is the only place on the engine where oil and the sea are separated by a single thin wall. Which is exactly why it matters two screens from now: when that wall fails, the two things it was keeping apart end up in each other.", "mal": {"To let the oil cool by mixing slowly with the seawater": "If they mixed, you would have seawater in your bearings. They never touch — that is the whole design, and the day they do touch is a failure.", "To keep the two circuits at the same pressure": "They are at nothing like the same pressure, and nothing here is trying to equalize them.", "To filter the seawater before it reaches the oil": "The seawater is never meant to reach the oil at all, so there is nothing to filter."}, "malOtro": "Ask what a heat exchanger is for, and then ask what it must never let through."}, {"id": "4.5", "tema": "Keeping it alive · Phase 4 · The oil", "pos": 10, "tope": 10, "mando": "montaje", "camara": "port", "h": "Too little, and too much", "p": ["<b>The dipstick is the only window into this whole circuit, and it is a stick.</b> It has two marks on it, and what matters is that <b>both</b> of them are limits.", "<b>Too little is the obvious one.</b> Less oil in the tray means the pickup is nearer the surface, and a boat does not sit still. Heel her, or drive her into a head sea, and the oil runs to one end of the sump and the pump draws air instead. <b>A level that would be fine in a car can be dangerous in a boat, for the simple reason that boats lean.</b>", "<b>Too much is the one people get wrong, because it sounds harmless.</b> Overfill the sump and the crankshaft — turning fast, a few centimetres above the oil — dips into it and whips it. <b>You do not get oil any more, you get foam, and a pump cannot pump foam.</b> Pressure falls even though the stick reads full.", "<b>And read it properly, because a stick read badly lies with confidence.</b> Pull it out, wipe it clean, push it all the way home, pull it out again, and read <i>that</i>. Cold, before you start, with the boat sitting level.", "<b>And there is a second dipstick you have not met.</b> The gearbox has its own oil, its own rules and its own dipstick, and it is the one people forget — some boxes take engine oil and some take automatic transmission fluid, and they are not interchangeable."], "q": "Both marks on the stick are limits, and the upper one surprises people. <b>What does too much oil do?</b>", "opciones": ["The crankshaft dips into it and whips it to foam, and a pump cannot pump foam", "Nothing much — it burns off over the next few hours", "It thickens, so the pump has to work harder and the pressure rises", "It overflows out of the filler cap"], "acierto": ["The crankshaft dips into it and whips it to foam, and a pump cannot pump foam"], "bien": "<b>Foam.</b> The crankshaft turns a few centimetres above the oil, and if you raise the level it dips in and whips it. The pump then has froth to draw instead of oil, so <b>the pressure falls while the stick reads full</b> — which is the nastiest kind of fault, because the instrument agrees with you. That is why «a bit extra to be safe» is the mistake people actually make.", "mal": {"Nothing much — it burns off over the next few hours": "Some of it does go out past the seals, and by then the damage is being done. Ask what is turning a few centimetres above the surface of that tray.", "It thickens, so the pump has to work harder and the pressure rises": "Level does not change how thick oil is. And what happens to the pressure is the opposite of this, which is what makes it dangerous.", "It overflows out of the filler cap": "It does push oil out past the seals, eventually. That is a symptom of the real problem, and the real problem is happening at the crankshaft."}, "malOtro": "Something is turning fast a few centimetres above the oil. Ask what happens when you raise the oil to meet it."}, {"id": "4.6", "tema": "Keeping it alive · Phase 4 · The oil", "pos": 10, "tope": 10, "mando": "montaje", "camara": "port", "h": "Milky, and rising", "p": ["<b>Oil tells you what is happening inside a closed engine, and it does it two ways: by its colour, and by its level.</b>", "<b>Milky means water.</b> Clean oil is amber and clear; oil with water in it goes pale and opaque, like coffee with too much milk in it, and once you have seen it you never mistake it. There are <b>exactly two ways water gets in</b>, and you have already built both.", "<b>The head gasket</b> — the joint you learned in the very first phase, with coolant on one side of it and the combustion chamber on the other. And <b>the oil cooler</b> — the thin wall you built two screens ago, with oil on one side and raw seawater on the other.", "<b>Both look identical on the stick.</b> Seawater is much the worse of the two — salt in a bearing is a different order of damage — but you stop the engine for either.", "<b>And a level that rises on its own means diesel.</b> Nobody added any and there is more oil than there was: fuel is getting down into the sump, and the commonest way is a mechanical lift pump whose diaphragm has split."], "q": "The oil is milky. It is either the head gasket or the oil cooler, and they look the same on the stick. <b>What separates them, and it costs nothing to check?</b>", "opciones": ["The coolant header tank: down means head gasket, unchanged means oil cooler", "The colour: coolant makes it greyer, seawater makes it creamier", "The smell: seawater smells of salt", "Nothing on board — it needs a laboratory"], "acierto": ["The coolant header tank: down means head gasket, unchanged means oil cooler"], "bien": "<b>Look at the header tank.</b> A failing head gasket is losing coolant into the engine, so the tank goes down. An oil cooler is letting the sea in, and the sealed coolant loop never changes. <b>Milky oil with a falling header tank is the head gasket; milky oil with a header tank that has not moved is the oil cooler.</b> It costs nothing and it tells you which of the two you have.", "mal": {"The colour: coolant makes it greyer, seawater makes it creamier": "They look the same, and that is the point of the question. Nobody has ever separated these two by eye on a dipstick.", "The smell: seawater smells of salt": "Not once it is emulsified in oil, and you would be guessing. There is something you can read instead of guess.", "Nothing on board — it needs a laboratory": "There is something, it is two steps away, and it is free. Think about what each of the two failures is <i>losing</i>, and where you would see that."}, "malOtro": "One of the two failures is losing coolant into the engine and the other is not. Ask where you would see coolant going missing."}, {"id": "4.7", "tema": "Keeping it alive · Phase 4 · The oil", "pos": 10, "tope": 10, "mando": "montaje", "camara": "port", "panel": {"oil": true, "temp": false, "charge": false, "aguja": 0.42}, "h": "The alarm you never argue with", "p": ["<b>There is one warning on this engine that you obey before you understand it.</b>", "The oil-pressure switch is a simple thing screwed into the main gallery: it watches the pressure in that drilled passage and it closes a circuit when the pressure is not there. That is all it does. <b>It does not know why, and it does not know how much oil is in the sump.</b>", "<b>What it is telling you is that the film is gone</b> — that somewhere in the engine metal is running on metal — and that is measured in seconds, not minutes. A bearing that has been run without oil does not recover when the oil comes back.", "<b>So the rule is short: it sounds, you stop.</b> Not «finish the leg», not «get into the anchorage first». You stop the engine, and then you find out why.", "<i>And know the other half: on most boats the alarm sounds when you turn the key and stops when the engine fires. If it never sounded at all when you switched on, the warning system itself is dead — and you have been going to sea without it.</i>"], "q": "The oil-pressure alarm sounds while you are under way. <b>What does it mean, and what do you do?</b>", "opciones": ["The oil film is gone — stop the engine now and find out why afterwards", "The oil is low — top it up at the next convenient moment", "The oil is hot — ease the throttle and let her cool", "The sender is unreliable — watch it and carry on if it settles"], "acierto": ["The oil film is gone — stop the engine now and find out why afterwards"], "bien": "<b>Stop, and ask afterwards.</b> That switch is not a level gauge and it is not an opinion: it closes when the pressure in the gallery is not there, which means the film that holds metal off metal has gone. That is damage measured in seconds, and a bearing that has run dry does not recover when the oil comes back. Finishing the leg costs the engine.", "mal": {"The oil is low — top it up at the next convenient moment": "It might be low, and the switch does not know: it watches <i>pressure</i>, not level. And whatever the cause, the consequence is already happening.", "The oil is hot — ease the throttle and let her cool": "There is no temperature in this alarm at all. And easing the throttle does not restore a film that is not there.", "The sender is unreliable — watch it and carry on if it settles": "That is the reasoning that ends in a rebuild. If it is a bad sender you have lost nothing by stopping; if it is not, you have saved the engine."}, "malOtro": "The switch watches one thing and only one thing. Ask what is happening inside the engine during every second that it sounds."}, {"id": "4.8", "tema": "Keeping it alive · Phase 4 · The oil", "pos": 10, "tope": 10, "mando": null, "camara": "port", "h": "What the oil is telling you", "p": ["<b>Three engines, three dipsticks. Say what has happened in each.</b>"], "banco": "ACEITE", "casos": [{"caso": "A", "q": "<i>The oil on the stick is pale and creamy, and the coolant header tank is noticeably down since last week. She has been running a little hot.</i>", "opciones": ["The head gasket — coolant is crossing into the engine", "The oil cooler — seawater is crossing into the oil", "The lift pump diaphragm — diesel is getting into the sump", "Condensation from short runs in cold weather"], "acierto": ["The head gasket — coolant is crossing into the engine"], "bien": "<b>The head gasket, and the header tank is what tells you.</b> Milky oil is water, and <b>the tank separates the two ways it usually gets in</b>. This one is losing coolant into the engine, so the tank goes down — and running hot fits the same story. An oil cooler failure would leave that sealed loop untouched.", "mal": {"The oil cooler — seawater is crossing into the oil": "That is the other of the two, and it would not empty the header tank: the coolant loop is sealed and the sea is on the other side of the cooler. The tank is down, so the coolant is going somewhere.", "The lift pump diaphragm — diesel is getting into the sump": "Diesel makes the level <i>rise</i> and the oil thin and smelly. This oil is milky, which is water.", "Condensation from short runs in cold weather": "That can cloud oil a little, and it does not empty a header tank or make an engine run hot."}, "malOtro": "Two things make oil milky. Only one of them is also losing coolant — look at what the header tank has done."}, {"caso": "B", "q": "<i>The level has risen since the last check and nobody has added any. The oil is thin on the stick and smells of diesel.</i>", "opciones": ["Fuel is getting into the sump, and a split lift-pump diaphragm is the usual way", "Water is getting in through the head gasket", "The oil is foaming because it was overfilled", "The oil cooler wall has failed"], "acierto": ["Fuel is getting into the sump, and a split lift-pump diaphragm is the usual way"], "bien": "<b>Diesel in the sump.</b> A level that rises on its own can only be something arriving, and thin oil that smells of fuel says which. The commonest route is the lift pump: it is driven off the engine, it sits on the side of the block, and a split diaphragm pumps fuel straight down inside instead of along the pipe.", "mal": {"Water is getting in through the head gasket": "Water makes oil milky and opaque. This oil is thin and smells of diesel — a different arrival entirely.", "The oil is foaming because it was overfilled": "Foam does not raise the reading on a cold stick, and nobody added any. Something has come in from elsewhere.", "The oil cooler wall has failed": "That brings in seawater, which is water: milky, not thin and fuel-smelling."}, "malOtro": "Nobody added any and there is more than there was. Ask what else on this engine is a liquid under pressure right beside the sump."}, {"caso": "C", "q": "<i>The oil-pressure alarm sounded ten minutes out. The level is right at the bottom of the stick and there is a wet patch under the engine. She was serviced last week.</i>", "opciones": ["She is losing oil — and a filter that was not tightened at the service is the first place to look", "The pressure sender has failed", "The oil was overfilled at the service and is foaming", "The pickup strainer is blocked with sludge"], "acierto": ["She is losing oil — and a filter that was not tightened at the service is the first place to look"], "bien": "<b>She is losing it, and the service is the clue.</b> A low stick and a wet patch is oil leaving the engine, and the thing that was last disturbed is the filter — a spin-on that was not tightened, or that went on with the old seal still stuck to the block, will let go exactly like this. Stop first, then look under her.", "mal": {"The pressure sender has failed": "A failed sender does not empty the sump or leave a puddle. You have two independent signs saying the oil is actually gone.", "The oil was overfilled at the service and is foaming": "Foaming reads <i>full</i> on the stick, not empty — and it does not put oil on the floor.", "The pickup strainer is blocked with sludge": "That would drop the pressure with the level normal. The level is at the bottom and there is a puddle."}, "malOtro": "Two signs say the oil has left the engine, and one says when it started. Ask what was last unscrewed."}]}, {"id": "5.1", "tema": "Keeping it alive · Phase 5 · Fresh water", "pos": 11, "tope": 11, "mando": "montaje", "camara": "front", "h": "One belt, three jobs", "p": ["<b>A marine engine is cooled twice over, and this phase builds the inner half of it.</b>", "A car engine is cooled by air blowing through a radiator. A boat has no air worth having, but it is sitting in an unlimited supply of cold water — <b>and that water is salt, and salt cannot be allowed inside an engine.</b> It corrodes the castings and deposits scale in passages you can never reach. <b>So there are two circuits</b> — a sealed one of fresh water and antifreeze that never leaves the engine, and an open one that draws seawater in, takes the heat away and puts it back over the side. <b>They touch in exactly two places and they never mix.</b> You have met one of them already: the oil cooler.", "<b>This screen is the pump that drives the sealed one.</b> It is on the front of the engine and it is turned by a belt — and look at what else is on that belt. <b>The alternator, which charges your batteries. The pump that will bring in the seawater, one phase from now. And the whole lot is turned by one pulley on the nose of the crankshaft.</b>", "<b>And it is tightened by moving the alternator.</b> That is what the slotted bracket is for: slacken its pivot bolt and its adjusting bolt, lever the alternator outwards until the belt is tight, and do the bolts up again. <b>The alternator is not just something the belt drives — it is the tensioner</b>, and that is why it is the part you take hold of when a belt is slack.", "<i>So one belt runs both cooling circuits and all your charging. That is why B is in WOBBLE, why the belt is checked before every trip, and why a spare belt is the second spare you carry, behind the impeller.</i>"], "q": "The belt breaks twenty miles from anywhere. <b>What have you just lost?</b>", "opciones": ["Charging, the fresh-water pump and the seawater pump — everything on that one pulley", "Charging only — both water pumps are driven from inside the engine", "Charging and the fresh water, but the seawater pump has its own drive", "Nothing much until she overheats — the belt only turns the alternator"], "acierto": ["Charging, the fresh-water pump and the seawater pump — everything on that one pulley"], "bien": "<b>Three things, and all of them at once.</b> Both water pumps and the alternator hang off the same pulley on the nose of the crankshaft, so a broken belt does not take one system away — it takes the charging, the cooling and the seawater together. <b>The first you usually know is a red light and a temperature needle moving at the same time</b>, and two warnings arriving together is itself the clue: look for the one thing they share.", "mal": {"Charging only — both water pumps are driven from inside the engine": "Neither of them is. Follow the belt round and count what it turns — the answer is more than you would like.", "Charging and the fresh water, but the seawater pump has its own drive": "It does not. It is on the same belt, which is exactly why nothing at all comes out of the exhaust when one breaks.", "Nothing much until she overheats — the belt only turns the alternator": "If that were true a belt would be a convenience. It runs the cooling as well, and that is why it is checked before every trip."}, "malOtro": "One rubber band, and everything hanging off it. Ask how many things stop turning the moment it goes."}, {"id": "5.2", "tema": "Keeping it alive · Phase 5 · Fresh water", "pos": 11, "tope": 11, "mando": null, "camara": "port", "h": "It goes round, and it never leaves", "p": ["<b>This circuit is a closed loop, and that is the first thing to understand about it.</b>", "The same coolant goes round and round inside this engine for years. It leaves the header tank, it goes through the engine, it gives its heat to the sea, and it comes back to the tank it started from. <b>Nothing is added and nothing is used up.</b> A circuit like this should never need topping up — and that is why it matters so much when it does.", "<b>From the pump it goes straight into the castings.</b> The block and the head are not solid: cast into both of them is a network of cavities wrapping every cylinder and the top of every combustion chamber — <b>the water jacket</b>. The heat of burning fuel goes into the metal, and the metal hands it to the coolant flowing past on the other side. That is the whole cooling job, and it happens where you will never see it. <b>On the way out it passes the thermostat</b>, which decides whether it is allowed to leave the engine yet, <b>and then the heat exchanger</b>, where it gives the heat to the sea without ever touching it. Both of those are coming in a moment.", "<b>And what is in there is not water.</b> Coolant is two things. It is <b>antifreeze</b>, which is the part everyone knows about — a boat laid up ashore in a cold country will freeze the water in her block, and freezing water splits castings. <b>And it is a corrosion inhibitor, which is the part that matters all year round.</b> The inside of that jacket is bare cast iron with other metals bolted to it, warm and wet, for years. Plain water corrodes it and furs it up. <b>The inhibitor is what keeps those passages the size the designer drew them</b>, and it wears out — which is why coolant is changed on a schedule and not topped up forever.", "<b>In an emergency, fresh water will get you home.</b> Rain water, bottled water, water out of the tank: put it in, run the engine, get in, then drain it and refill properly. <b>Coolant. Then fresh water. Then stop the engine</b> — a stopped engine is not a damaged engine, and on most days losing it costs you an afternoon. <b>Seawater comes after all three, and only when stopping is the dangerous option</b>: a lee shore, a narrow channel with the tide running. Then you put the sea in, you get out of it, and you accept the engine is now a job for the yard. <b>The rule is not «never». The rule is: never for convenience.</b>"], "q": "The coolant leaves the tank and comes back to it, and in between it always goes the same way. <b>Tap the five in the order it meets them, starting at the tank.</b>", "circuito": "cool", "orden": ["Header tank", "Circulating pump", "Water jacket", "Thermostat", "Heat exchanger"], "bien": "And from the heat exchanger it goes straight back up to the tank you started at. <b>That is what «sealed» means</b> — the same coolant, round and round, for years. Nothing is consumed and nothing evaporates, so a circuit like this should never need topping up. Which is exactly why a falling level is never «it has used a bit»: it has gone somewhere, and two screens from now you will find out where.", "mal": "Follow the heat. It is picked up where the coolant wraps the cylinders, and it is put down where the sea is on the other side of a thin wall — and one part sits between those two, deciding whether the coolant is allowed out of the engine yet."}, {"id": "5.3", "tema": "Keeping it alive · Phase 5 · Fresh water", "pos": 11, "tope": 11, "mando": "montaje", "camara": "port", "h": "Kept hot on purpose", "p": ["<b>A cold engine is not a safe engine. It is a worn engine.</b>", "That is the part people get backwards. Overheating is obviously bad, so it seems as though cooler must be better, and it is not. <b>Below its working temperature a diesel burns its fuel badly</b>: unburned diesel washes the film of oil off the cylinder walls and drains down into the sump, thinning the oil that is supposed to be protecting the bearings. Water condenses in a cold crankcase for the same reason it condenses on a cold window. She smokes, she drinks more fuel, and she wears out faster doing it.", "<b>So the engine is held at a temperature on purpose, and the thing that holds it there is the thermostat.</b> It is a valve that opens with heat, and nothing else. <b>Cold, it is shut</b> — the coolant cannot get out to the heat exchanger, so it circulates inside the engine and warms up quickly. <b>Hot, it opens</b>, and the coolant is let out to be cooled. It sits somewhere in between for the whole of a normal passage, holding her steady.", "<b>The temperature it opens at is not a secret and it is not a guess: it is stamped on the thermostat itself</b>, and your engine's book gives the same figure. If anybody asks you what temperature your thermostat opens at, <b>that is the answer</b> — not a number you memorized, but where the number is written.", "<b>It fails in two directions, and they look nothing alike.</b> <b>Stuck shut</b> is the dangerous one: the coolant can never reach the heat exchanger, nothing takes the heat away, and the engine cooks — the needle climbs and keeps climbing. <b>Stuck open</b> is the slow one: she never reaches working temperature, the gauge barely lifts, and nothing dramatic ever happens, which is why people motor around like that for years. <i>It is one of the cheapest parts on the engine and one of the easiest to change. Carry a spare.</i>"], "q": "Half an hour under way and the gauge has barely lifted off cold. She smokes a little and is drinking more fuel than she should. <b>What has happened?</b>", "opciones": ["The thermostat is stuck open — she is being cooled from the moment you start", "The thermostat is stuck shut, so the coolant is trapped inside the engine", "The heat exchanger tubes have furred up with salt", "The temperature sender is lying and she is perfectly warm"], "acierto": ["The thermostat is stuck open — she is being cooled from the moment you start"], "bien": "<b>Stuck open, and it is the failure nobody looks for.</b> The coolant is going out to be cooled from the moment you turn the key, so she never gets warm enough to burn her fuel properly. <b>Nothing dramatic happens</b> — she smokes, she drinks, and she wears, quietly, for years. The smoke and the fuel are what turn a cold gauge from a curiosity into a fault.", "mal": {"The thermostat is stuck shut, so the coolant is trapped inside the engine": "That is the other direction, and it is the dangerous one — but it sends the needle <i>up</i> and keeps it going. This one has barely lifted.", "The heat exchanger tubes have furred up with salt": "A blocked exchanger takes away too little heat, not too much. That overheats her; it does not keep her cold.", "The temperature sender is lying and she is perfectly warm": "Worth remembering, and a sender can lie. But a lying sender does not make her smoke and does not make her drink fuel, and you have both."}, "malOtro": "She is being cooled too well, not too little. Ask which part is supposed to stop the coolant leaving the engine until she is warm."}, {"id": "5.4", "tema": "Keeping it alive · Phase 5 · Fresh water", "pos": 12, "tope": 12, "mando": "montaje", "camara": "port", "h": "Where the heat leaves", "p": ["<b>This is the radiator, and the air blowing through it is the sea.</b>", "Inside the shell there is a <b>bundle of small tubes</b>. Seawater is pumped through the inside of those tubes; the hot coolant from the engine flows around the outside of them. Heat crosses the tube walls. <b>Nothing else does.</b> The coolant that leaves here is the same coolant that arrived, cooler, and it goes straight back to the tank to start again.", "<b>You have seen this arrangement before</b>, one phase back. The oil cooler is the same idea in a smaller can. <b>These two are the only places on the whole engine where the sealed circuit and the sea come within a wall of each other.</b>", "<b>The tubes block, and that is the failure to expect.</b> Seawater leaves salt and scale on everything it touches, and it leaves it inside those tubes. A furred bundle still works — just not as well. So the classic symptom is not an engine that overheats: it is <b>an engine that overheats only when you ask something of it.</b> Fine at cruising revs, hot when you push her, fine again when you throttle back. That is a heat exchanger that has lost some of its capacity, and it needs the bundle out and cleaned.", "<b>And there is a zinc in there doing a job you never see.</b> Screwed into the shell is a <b>pencil anode</b> — a soft zinc rod. Different metals sitting in seawater eat each other, and the zinc is there to be the one that gets eaten, so that the tube bundle is not. <b>It is meant to be consumed.</b> Check it, and replace it before it disappears: <i>an anode that has gone completely is not a job you have finished, it is a job that stopped protecting anything some time ago.</i>"], "q": "<b>Click the part where the coolant gives up its heat without ever touching the sea.</b>", "acierto": ["Heat exchanger"], "bien": "<b>The heat exchanger.</b> Seawater inside the tubes, coolant around them, heat across the wall and nothing else. It is a radiator with the sea instead of a breeze — and with the oil cooler, one of the only two places on this engine where the sealed circuit and the sea are a wall apart.", "mal": {"Tube bundle (raw water)": "That is what is inside it, and it is the right idea — the bundle is where the exchange actually happens. <b>The shell is what you would name to an examiner.</b>", "Oil cooler": "Same trick, different fluid. That one cools oil, and you built it in the last phase.", "Water jacket (cooling)": "That is where the coolant picks the heat up. This screen is where it puts it down.", "Heat exchanger anode": "That is the zinc, and it is being eaten on purpose so the tubes are not. It protects the exchange; it does not do it."}, "malOtro": "Two liquids, one thin wall, and heat crossing it. You have seen the same arrangement once already — this is the big one."}, {"id": "5.5", "tema": "Keeping it alive · Phase 5 · Fresh water", "pos": 12, "tope": 12, "mando": "montaje", "camara": "port", "h": "The tank, and what a falling level means", "p": ["<b>The circuit is sealed, so it should never need topping up. When it does, something is wrong, and where it went tells you what.</b>", "The <b>header tank</b> is the top of the loop, and it does two things. Coolant expands as it heats and has to go somewhere, and this is the somewhere. And it is where you look at the level and where you top it up.", "<b>The cap is not a lid, it is a valve, and it holds the circuit under pressure.</b> That is deliberate: a liquid under pressure boils at a higher temperature than the same liquid in an open pot, so pressurising the system lets the engine run hotter without the coolant boiling. <b>Which is exactly why you never open it on a hot engine.</b> The coolant in there is above the temperature it would boil at if the pressure went away — take the cap off and the pressure does go away, all at once, and the whole lot flashes into steam and comes out at your face. <b>People are badly scalded doing this every season, and they are always in a hurry.</b>", "<b>Where a sealed circuit loses coolant, and there are three places.</b> <b>Outside</b>, where you can see it — a hose, a clip, a pump seal, the tank itself; look under the engine for the crusty white or pink trail dried coolant leaves. This is much the commonest and it is the one to look for first. <b>Into the engine</b>, through the head gasket — and that is when your oil goes milky. <b>Out of the exhaust</b>, when coolant gets into a cylinder and is burned: no puddle anywhere, and white smoke that does not clear once she is warm.", "<b>And now the circle from the last phase closes.</b> Milky oil means water in the oil, and there were two ways it could get there — the head gasket, or the oil cooler. This tank is what tells you which. <b>The head gasket is losing coolant to do it, so this level drops. The oil cooler is letting in seawater, and this sealed loop never even hears about it, so this level does not move.</b> One glance at a plastic tank, and you have separated a cylinder-head job from a heat-exchanger job."], "q": "She has overheated, and you want to see the coolant level. The engine is still hot. <b>What do you do?</b>", "opciones": ["Wait until she is cold — that cap is holding the coolant above its boiling point", "Open it slowly with a cloth over it, to let the pressure off gently", "Open it — the level is what you need to know and you need it now", "Run her for a minute first, so the coolant circulates and the level settles"], "acierto": ["Wait until she is cold — that cap is holding the coolant above its boiling point"], "bien": "<b>Wait.</b> The cap is a valve holding the whole circuit under pressure, and pressure is what stops the coolant boiling at the temperature it is actually at. Take the cap off and the pressure goes — all at once — and the coolant in there flashes into steam and comes out at you. <b>People are badly scalded doing exactly this every season, and they are always in a hurry.</b> If she is hot and you have to know, you wait; nothing you would learn from that level is worth a face.", "mal": {"Open it slowly with a cloth over it, to let the pressure off gently": "A cloth is not protection from a jet of steam, and «slowly» is not something you control once the seal breaks. This is the answer that puts people in hospital.", "Open it — the level is what you need to know and you need it now": "You do not need it now. Whatever the level is, you have already stopped her — and a reading you cannot act on is not worth being scalded for.", "Run her for a minute first, so the coolant circulates and the level settles": "That runs a hot engine that has just overheated, and it leaves the cap exactly as dangerous as it was. Levels are read cold, before you start."}, "malOtro": "Ask why the cap is a valve and not a lid, and what the pressure it holds is doing to the boiling point of what is underneath it."}, {"id": "5.6", "tema": "Keeping it alive · Phase 5 · Fresh water", "pos": 12, "tope": 12, "mando": null, "camara": "port", "h": "Read the symptom", "p": ["<b>Three engines, three cooling complaints. Say what is at the bottom of each.</b>"], "banco": "DULCE", "casos": [{"caso": "A", "q": "<i>She runs perfectly at cruising revs, but push her hard for twenty minutes and the temperature climbs. Throttle back and it settles again. The belt is tight, the level is right, and the thermostat was new last season.</i>", "opciones": ["The heat exchanger — its tubes have furred up and it has lost some capacity", "The thermostat is sticking shut when it gets hot", "The fresh-water pump is worn and is not circulating enough", "She is simply being worked too hard for her size"], "acierto": ["The heat exchanger — its tubes have furred up and it has lost some capacity"], "bien": "<b>The heat exchanger, and the pattern is the diagnosis.</b> Nothing here is broken — something has got smaller. Salt and scale narrow those tubes, so the bundle still has enough capacity for an easy passage and not enough for a hard one. <b>«Only when pushed» is what a partly blocked exchanger does</b>, and the question has already ruled out everything else on the fresh side for you.", "mal": {"The thermostat is sticking shut when it gets hot": "<b>Read the case again: it was new last season.</b> It would be a good answer on most boats — on this one you were told about the thermostat, the belt and the level, and three of the four suspects are ruled out in the question itself.", "The fresh-water pump is worn and is not circulating enough": "That would show at every load, and worst at low revs where it is turning slowest. This one is fine until you ask for more.", "She is simply being worked too hard for her size": "An engine that cannot hold its temperature at full throttle has a fault, not a character. Ask what gets gradually smaller in a circuit that has seawater on one side of it."}, "malOtro": "Nothing here is broken — something has got smaller. Ask which part of this circuit loses capacity gradually while still working, and why that only shows when you ask for more."}, {"caso": "B", "q": "<i>The coolant level has needed topping up twice this month. There is no puddle under her, no stain on any hose, and the oil is perfectly clean — but she blows white smoke that never clears once she is warm.</i>", "opciones": ["The head gasket — coolant is going into a cylinder and out of the exhaust", "The head gasket — coolant is getting into the oil", "A weeping hose clip somewhere you have not found yet", "The oil cooler wall has failed"], "acierto": ["The head gasket — coolant is going into a cylinder and out of the exhaust"], "bien": "<b>Into a cylinder, and out with the exhaust.</b> A sealed loop is losing coolant with no external leak and no water in the oil, so it is not going outside and it is not going into the sump — <b>and the smoke is where it went.</b> Milky oil is one way a head gasket announces itself; this is the other. <i>And do not read clean oil as proof that a gasket is sound: the same gasket can do both at once, or either on its own, depending on where it has failed. Clean oil rules out nothing.</i>", "mal": {"The head gasket — coolant is getting into the oil": "Right part, wrong route — and the oil is the one thing you have been told is clean. That failure makes the oil milky and this one does not.", "A weeping hose clip somewhere you have not found yet": "It is the commonest of the three and it is the first thing to look for, and it leaves a crusty trail or a puddle. You have neither, and you do have smoke.", "The oil cooler wall has failed": "That puts seawater into the oil, so the oil would be milky and the sealed loop would never notice. Here the sealed loop is the one going down."}, "malOtro": "A sealed circuit is losing coolant, there is no puddle and the oil is clean — so it has gone somewhere neither of those covers. You are being told about smoke. Follow it back."}, {"caso": "C", "q": "<i>The temperature needle and the battery warning light came on within a few seconds of each other, and there is nothing at all coming out of the exhaust.</i>", "opciones": ["The belt has gone — everything on the crankshaft pulley stopped together", "The heat exchanger has blocked completely", "The seawater seacock has been left shut", "The alternator has failed and taken the cooling with it"], "acierto": ["The belt has gone — everything on the crankshaft pulley stopped together"], "bien": "<b>The belt, and the giveaway is that three things happened at once.</b> The fresh-water pump, the seawater pump and the alternator all hang off the same pulley, so when the belt goes you lose the charging, the cooling and the water at the exhaust together. <b>Three separate systems failing in the same few seconds is one fault, not three</b> — look for what they share.", "mal": {"The heat exchanger has blocked completely": "That would cook her, and it would not touch the battery light. Nothing about a blocked exchanger stops the alternator charging.", "The seawater seacock has been left shut": "That does stop the water at the exhaust and it does overheat her — and it has nothing to do with the battery light. You have three symptoms, not two.", "The alternator has failed and taken the cooling with it": "An alternator that fails on its own takes the charging and nothing else. It is on that belt, not driving it."}, "malOtro": "Three separate systems failed in the same few seconds, so look for the one thing they have in common rather than for three faults. Go back to the front of the engine."}]}, {"id": "6.1", "tema": "Keeping it alive · Phase 6 · Salt water", "pos": 13, "tope": 13, "mando": "montaje", "camara": "stbd", "h": "Two holes in the boat", "p": ["<b>Every circuit you have built so far is closed. This one is not.</b>", "It starts at a <b>seacock</b> — a valve through the hull, below the waterline — and it ends at a fitting in the transom. Between those two holes runs the sea, through your engine room, inside hoses held on with clips. <b>That changes what kind of thing this is.</b> A fuel leak is a problem; a cooling circuit that lets go below the waterline is a hole in the boat that does not stop. <b>Know where every seacock is, know which way each one closes, and be able to find them in the dark.</b> This is the phase where cooling and seamanship are the same subject.", "<b>And beside every seacock lives a soft wooden bung</b> — tapered, on a lanyard, tied to it. If a seacock fails, or a hose comes off it, you have a hole below the waterline and a valve you can no longer use, and the bung is hammered into it from the inside. <b>It only works if it is there and it is the right one.</b> A bung in a locker is a bung you will not find in the dark with water coming in. <i>An examiner will point at a seacock and ask what should be beside it, and this is the answer — because anybody who has thought about the hole has thought about the whole problem.</i>", "<b>Straight after the seacock the water goes through a strainer</b> — a clear-topped pot with a basket in it. Weed, plastic bags, sand and the odd small jellyfish are caught here, <b>before the pump</b>, which is the whole point: the pump is the delicate thing. <b>You can see into it, so look into it.</b> A basket filling with weed is the first thing to check when an engine starts running warm, and you can check it without touching anything.", "<b>And there is one rule about opening it. Close the seacock first — every time, without exception.</b> That strainer is below the waterline and it is connected to the sea by an open valve. Undo the lid with the seacock open and the sea comes up through it into the boat, and it goes on coming until somebody reaches past it to close a valve they can no longer see. <b>And open it again afterwards</b> — an engine started with the seacock shut is an engine whose pump is running dry, and you have one screen to wait before you find out what that costs."], "q": "You are about to take the lid off the strainer and clean the basket. <b>What do you do first, and why?</b>", "opciones": ["Close the seacock — that pot is below the waterline with an open valve under it", "Stop the engine and let it cool, so the water in the strainer is not hot", "Open the seacock fully first, so the strainer drains back down into the sea", "Nothing — the strainer is above the waterline, which is why you can see into it"], "acierto": ["Close the seacock — that pot is below the waterline with an open valve under it"], "bien": "<b>Close the seacock, every time.</b> That pot is connected to the sea by an open valve, and taking its lid off with the sea connected is how boats fill up alongside on a quiet afternoon — the water comes in faster than you can think, and the valve you need is now underneath it. <b>And the other half of the rule is opening it again afterwards</b>, because an engine started with the seacock shut is an engine whose pump is running dry.", "mal": {"Stop the engine and let it cool, so the water in the strainer is not hot": "Stopping the engine is right and it is not enough. A stopped engine does not close a valve, and the sea does not care whether the engine is running.", "Open the seacock fully first, so the strainer drains back down into the sea": "That is the opposite of the rule, and it is the version of this that sinks boats. Nothing drains downhill into the sea from below the waterline.", "Nothing — the strainer is above the waterline, which is why you can see into it": "It is not, on most boats, and «you can see into it» has nothing to do with where it sits. Assume it is below until you have proved otherwise."}, "malOtro": "There is an open valve between that pot and the sea, and you are about to open the pot."}, {"id": "6.2", "tema": "Keeping it alive · Phase 6 · Salt water", "pos": 13, "tope": 13, "mando": "montaje", "corte": 1, "camara": "stbd", "h": "The rubber that dies in seconds", "p": ["<b>This is the single most talked-about part on a marine diesel, and it is a lump of rubber.</b>", "The <b>impeller</b> is a rubber hub with flexible vanes, turning inside a housing that is not round, so the vanes bend as they pass the narrow part and spring out again after it. <b>Each vane traps a pocket of water and carries it round</b> — and it does that whether there is water in the pump to start with or not, which is why it can pull a column of seawater up from below itself without being primed. It has to: this pump sits above the waterline and draws from under it.", "<b>And it must never run dry.</b> The rubber vanes are cooled and lubricated by the water they pump and by nothing else. Run it with no water and the vanes are dragging against a dry bronze housing at engine speed. <b>This is not a matter of minutes. It is seconds.</b> Start the engine with the seacock shut, notice, and shut down — and the impeller may already be finished. <i>That is why closing the seacock and forgetting to open it is such an expensive mistake, and why you tie a note to the key.</i>", "<b>When it breaks, the pieces go somewhere.</b> Vanes do not fail politely: they tear off — usually one or two — and the pump goes on turning with the rest. <b>And the pieces go downstream.</b> They leave the pump with the water, and the first thing narrow enough to stop them is the tube bundle in the heat exchanger. There they sit, blocking tubes, and the engine you have just fixed by fitting a new impeller carries on overheating.", "<b>So when you change one, you count.</b> Count the vanes on the old one against the new one. <b>If any are missing, you know where they are</b>, and until they are out of the bundle the job is not finished. <i>The people who know this are the people who have done it once and had to do it twice.</i> <b>Carry a spare — it is the first spare on the RYA's list and on everybody else's.</b>"], "q": "A vane has torn off the impeller and gone downstream with the water. <b>Click the part it has lodged in.</b>", "acierto": ["Heat exchanger"], "bien": "<b>The heat exchanger — and specifically the tube bundle inside it.</b> Those tubes are the first thing downstream narrow enough to stop a piece of rubber, which is why fitting a new impeller and finding she still overheats is such a common and such an avoidable morning. <b>Count the vanes, and if any are missing the job is not finished until they are out of the bundle.</b>", "mal": {"Exhaust mixing elbow": "Further downstream than the exchanger, and by then the passage has widened again. Something narrower catches it first.", "Raw-water strainer": "That is upstream of the pump, not downstream. It catches what is coming in, not what the pump breaks.", "Seacock": "Also upstream, and at the very start. Nothing travels backwards against the flow.", "Waterlock / exhaust silencer": "That is at the end of the road, and something narrower stops the rubber long before it gets there."}, "malOtro": "Follow the water out of the pump and ask what the first narrow thing in its way is."}, {"id": "6.3", "tema": "Keeping it alive · Phase 6 · Salt water", "pos": 14, "tope": 14, "mando": null, "camara": "stbd", "h": "Where the exhaust gets wet", "p": ["<b>The seawater has done its cooling job by now, and it is warm. It is also still in your boat, and it has to leave.</b> On the way out it does a second job, and it is the one that makes a marine exhaust possible at all.", "<b>At the mixing elbow the seawater is injected straight into the exhaust gas.</b> You built that gas four phases ago and left it at the manifold, dry and extremely hot. Here it stops being dry. <b>The water cools it and quietens it in the same moment</b> — and that is why everything downstream of this point can be ordinary rubber hose and a plastic drum instead of steel and lagging. <i>The elbow is also where carbon builds up over twenty years and narrows the passage, which is a classic cause of an old engine that overheats gradually and for no reason anybody can find.</i>", "<b>And on the way there, the loop that stops the sea siphoning back.</b> Look at the pipe before the elbow: it goes <b>up</b>, over the top, and down again. On many boats the engine sits low enough that the mixing elbow is near or below the waterline — stop the engine and you have an unbroken column of water from the sea to a point below sea level, and water will happily flow down it all night, back into the exhaust, up to an open valve, and into a cylinder.", "<b>The vented loop breaks that.</b> It carries the pipe up above the waterline and puts <b>a small air valve at the top</b>, so the moment the pump stops pushing, air is let in and the column of water breaks. <b>No siphon can survive a hole in the top of it.</b> <i>And that little valve is salt water's favourite thing to block up: it furs solid, quietly, and the loop stops working without anything appearing to change. Clean it every season and carry a spare.</i>", "<b>So the circuit is complete, and it is the only one on this engine that begins and ends outside the boat.</b> It begins at a hole below the waterline and it ends at a hole in the transom, and everything you have built in this phase is what happens in between."], "q": "This is the one circuit that does not go round: it starts at a hole in the hull and ends at a hole in the transom. <b>Tap the eight in the order the sea meets them.</b>", "circuito": "raw", "orden": ["Seacock", "Raw-water strainer", "Raw-water pump", "Heat exchanger", "Vented (anti-siphon) loop", "Exhaust mixing elbow", "Waterlock / silencer", "Out through the transom"], "bien": "<b>In at one hole and out at the other.</b> Every other circuit you have built comes back to where it started — the coolant to its tank, the oil to its sump. <b>This one does not, and that is the whole difference:</b> what is running through your engine room is the sea, and the only things between it and the inside of the boat are a valve, some hose and a few clips. <i>Notice where the vented loop sits — after the exchanger and before the elbow, up above the waterline — and where the waterlock sits, at the bottom of the run. Those two positions are what the next screen is about.</i>", "mal": "Follow the water, not the parts. It comes in cold and dirty, it is strained before anything delicate touches it, it is pushed, it takes heat, and only then does it meet the exhaust. Everything after that meeting is on its way out of the boat."}, {"id": "6.4", "tema": "Keeping it alive · Phase 6 · Salt water", "pos": 14, "tope": 14, "mando": "montaje", "camara": "stbd", "h": "And how the sea is stopped from coming back", "p": ["<b>Everything in this circuit is full of water when the engine stops, and some of it is below the sea.</b> Two separate things stop that water finding its way back into the engine, and you now have both. <b>The vented loop</b> you have just built breaks the siphon.", "<b>And this drum does the rest.</b> The <b>waterlock</b> sits at the low point of the exhaust and it is meant to hold a slug of water permanently. That slug silences the gases going past — and, much more importantly, <b>it is a trap: water sitting in the bottom of a drum cannot run back up a pipe that leaves from higher than it does.</b>", "<b>And now the warning from the fuel phase makes sense.</b> Three phases ago, in the middle of a fuel problem, you were told: before a long session on the starter, close the seacock or take the impeller out. <b>Here is why, with the parts in front of you.</b>", "<b>The raw-water pump is driven by the engine, and it does not know whether the engine has fired.</b> Every turn of the starter is a turn of that pump, and every turn puts more seawater into the exhaust. <b>When the engine runs, exhaust gas blows all of it out of the transom. When it does not fire, nothing blows anything anywhere.</b> The water goes into this drum. The drum fills. Then it backs up the pipe, reaches the mixing elbow, and runs down towards an exhaust valve standing open on one of the four cylinders.", "<b>Water does not compress.</b> The next time that piston comes up, it comes up against a cylinder full of water, and something bends or breaks. <b>That is hydraulic lock, and it is one of very few ways to destroy a marine diesel in an afternoon.</b> <i>So: it did not start, and you have been cranking. Stop. Close the seacock or pull the impeller — and tie a note to the key, because an impeller run dry is finished in seconds and you have just made that easy to forget.</i>"], "q": "She will not fire and you have been cranking for a while. <b>What is the danger you have been building up the whole time?</b>", "opciones": ["Seawater is filling the exhaust with nothing to blow it out, and it can reach a cylinder", "The starter motor is overheating and will burn out", "The batteries are going flat, and you will not be able to try again", "Unburnt diesel is collecting in the cylinders and will wash the bores"], "acierto": ["Seawater is filling the exhaust with nothing to blow it out, and it can reach a cylinder"], "bien": "<b>The exhaust is filling with the sea.</b> The raw-water pump is turned by the engine and it does not know whether the engine has fired, so every turn of the starter puts more seawater into an exhaust with no gas to blow it out. It collects in the waterlock, the drum fills, it backs up to the mixing elbow and runs down towards an open exhaust valve. <b>Water does not compress</b>, and the next time that piston comes up something bends. <b>Hydraulic lock — one of very few ways to wreck a marine diesel in an afternoon.</b>", "mal": {"The starter motor is overheating and will burn out": "It is, and it is the cheap half of the problem — a starter is a part you can buy. Something else is happening at the same time that costs the engine.", "The batteries are going flat, and you will not be able to try again": "True as well, and it is an inconvenience, not damage. Ask what the pump has been doing all this time, because it has been turning too.", "Unburnt diesel is collecting in the cylinders and will wash the bores": "Some does, and it is not what makes this urgent. Look at the other circuit the starter is driving."}, "malOtro": "The starter is turning the engine, and the engine turns the seawater pump. Ask where that water is going when there is no exhaust gas to push it out."}, {"id": "6.5", "tema": "Keeping it alive · Phase 6 · Salt water", "pos": 14, "tope": 14, "mando": null, "camara": "stbd", "enfoque": "Exhaust outlet (transom)", "marcha": true, "panel": {"oil": false, "temp": false, "charge": false, "aguja": 0.5}, "h": "Thirty seconds", "p": ["<b>Start the engine, and look over the stern.</b>", "Within the first few seconds — well inside half a minute — <b>water should be coming out of the exhaust with the gases</b>, spitting and pulsing. <b>It is doing it in front of you now.</b> If it is doing it on your boat, you can stop worrying about the entire raw-water circuit and go and do something else.", "<b>Because that one look tests all of it at once.</b> Water at the transom means, without you touching anything: <b>the seacock is open</b>; <b>the strainer is not blocked</b>; <b>the impeller is turning and it is in one piece</b>; <b>the belt is on and tight</b>, because that belt is what turns the pump; and <b>nothing downstream is blocked</b>, because the water got all the way through. <b>Five checks, one glance, every single start.</b> There is nothing else in this engine room with that ratio, and it is the reason <b>E is in WOBBLE</b>.", "<b>And if there is no water: stop the engine. Not in a minute — now.</b> The impeller is being destroyed while you decide, and behind that, nothing is taking the heat out of your engine. <b>Every second you spend wondering is a second of both.</b>", "<b>Stopping costs you nothing you cannot get back.</b> Not stopping costs you an impeller at best, and at worst a cooked engine with a warped head. <i>This is the one check in this whole module where the right answer is to act before you understand. Then you can start looking, and the next screen is how.</i>"], "q": "You start her, and half a minute later there is still nothing coming out of the transom. <b>What do you do?</b>", "opciones": ["Stop the engine now, and work out why afterwards", "Check the seacock and the strainer while she runs — you will need to know anyway", "Give her another minute: it can take a while to prime after a lay-up", "Watch the temperature gauge, and stop her if it starts to rise"], "acierto": ["Stop the engine now, and work out why afterwards"], "
