bien": "<b>Stop her, and ask afterwards.</b> Two things are happening while you think about it: the impeller is being destroyed — dry rubber against bronze at engine speed, and that is seconds, not minutes — and nothing at all is taking the heat out of your engine. <b>Stopping costs you nothing you cannot get back.</b> And when there <i>is</i> water, that same glance has just proved five things for free: seacock open, strainer clear, impeller whole, belt on, nothing blocked. <b>Five checks, one look, every start — which is why E is in WOBBLE.</b>", "mal": {"Check the seacock and the strainer while she runs — you will need to know anyway": "You will need to know, and it costs an impeller to find out this way. The looking is the next screen; <b>the stopping comes first</b>, and it is the only part that is urgent.", "Give her another minute: it can take a while to prime after a lay-up": "A healthy impeller pulls its own column of water up in seconds — that is what the flexible vanes are for. A minute of waiting is a minute of dry rubber.", "Watch the temperature gauge, and stop her if it starts to rise": "<b>This is the worst of the four, and it sounds the most careful.</b> The gauge is measuring coolant in the sealed circuit, and it lags a long way behind: by the time the needle moves, the impeller has been dry for minutes. <b>The transom tells you now; the gauge tells you later.</b>"}, "malOtro": "Something is being destroyed while you decide. Ask what is turning dry right now, and how long rubber lasts against bronze at engine speed."}, {"id": "6.6", "tema": "Keeping it alive · Phase 6 · Salt water", "pos": 14, "tope": 14, "mando": null, "camara": "stbd", "panel": {"oil": false, "temp": true, "charge": false, "aguja": 0.93}, "h": "Four causes, and the question that splits them", "p": ["<b>She is overheating. There are four common causes, and before you touch any of them there is one question that cuts the list in half: is there water coming out of the exhaust?</b>", "<b>No water.</b> Then the fault is in this circuit, the open one, and there are three places to look — <b>in this order, because it goes from free to awkward</b>. <b>The seacock:</b> is it open? Two seconds, no tools, and it is closed more often than anybody likes to admit — usually by the person who cleaned the strainer. <b>The strainer:</b> look through the top; a basket packed with weed or a plastic bag starves the pump. <b>The impeller:</b> cover off, and look — vanes missing, or a hub gone hard. <b>And count what you find.</b>", "<b>Water at the exhaust.</b> Then this circuit is working — seacock, strainer, impeller and belt are all proved by the water in front of you — and the fault is in the sealed circuit you built last phase: <b>coolant level, thermostat, or a heat exchanger furred up inside.</b>", "<b>And the fourth cause sits across both.</b> The belt drives the freshwater pump <i>and</i> the seawater pump, so when it goes you lose both circuits at once — and your charging with them. <b>That is why a temperature needle and a battery light coming on together is a belt until proved otherwise</b>, and why it is the one fault you diagnose from the panel before you open anything.", "<b>Four causes: seacock, strainer, impeller, belt.</b>"], "q": "She is overheating and there is no water at the exhaust. <b>What do you check first, and why that one?</b>", "opciones": ["The seacock — because it costs two seconds and no tools, not because it is the likeliest", "The impeller — it is the part that fails, so go straight to it", "The strainer — it is the commonest blockage in the circuit", "The coolant level — you need to know how bad the overheating is first"], "acierto": ["The seacock — because it costs two seconds and no tools, not because it is the likeliest"], "bien": "<b>The seacock, and the reason is the lesson.</b> You check it first because it is free: you can see it from where you are standing, you have not moved anything, and you have lost nothing if it was open. <b>Cheap before likely</b> is what separates diagnosing from guessing — and this one is also shut far more often than anybody admits, usually by whoever cleaned the strainer last.", "mal": {"The impeller — it is the part that fails, so go straight to it": "It is the part that fails, and it is the most expensive place to start: cover off, engine stopped, gasket disturbed. <b>Do the two that cost nothing first.</b>", "The strainer — it is the commonest blockage in the circuit": "Second on the list and a good answer — but you can see the seacock from where you are standing, and opening the strainer means closing the seacock anyway.", "The coolant level — you need to know how bad the overheating is first": "That is the sealed circuit, and the missing water at the exhaust has just told you the fault is not in there."}, "malOtro": "Order the four by what they cost you to check, not by how likely they are. The first one should cost nothing at all."}, {"id": "6.7", "tema": "Keeping it alive · Phase 6 · Salt water", "pos": 14, "tope": 14, "mando": null, "camara": "stbd", "h": "Read the symptom", "p": ["<b>Three engines running hot. Say what is at the bottom of each.</b>"], "banco": "SALADA", "casos": [{"caso": "A", "q": "<i>She overheated within a couple of minutes of starting and there is no water at the exhaust at all. You cleaned the strainer basket this morning and it is spotless.</i>", "opciones": ["The seacock — whoever cleaned the strainer closed it and never opened it again", "The strainer — something got past your cleaning and is blocking it now", "The impeller has failed on its own", "The heat exchanger tubes are furred up"], "acierto": ["The seacock — whoever cleaned the strainer closed it and never opened it again"], "bien": "<b>The seacock, and the spotless strainer is the clue, not innocent information.</b> Somebody had that strainer open this morning, and to do it safely they closed the seacock. <b>Cleaning the strainer and leaving the seacock shut is the most reliably repeated mistake in this entire circuit</b> — and the impeller has been running dry since you started, so opening the seacock now may not be the end of it.", "mal": {"The strainer — something got past your cleaning and is blocking it now": "You cleaned it this morning and it is spotless. The strainer is the one thing in this circuit you have already ruled out — <b>but ask what you had to do to clean it.</b>", "The impeller has failed on its own": "It may well be finished by now, and that is a consequence rather than the cause: it has been turning dry since you started. Ask why there was no water for it in the first place.", "The heat exchanger tubes are furred up": "A furred bundle overheats her when she is worked hard, not two minutes after starting, and it would not stop the water at the transom altogether."}, "malOtro": "Ask why the strainer is spotless. Somebody had it open this morning — and to open it safely they had to do something first. Did they undo it?"}, {"caso": "B", "q": "<i>You fitted a new impeller three weeks ago. She was fine, and now she overheats above half throttle and is fine again when you throttle back.</i>", "opciones": ["The heat exchanger — the old impeller's vanes went downstream and are blocking tubes", "The new impeller is already failing", "The thermostat is sticking as it warms up", "The mixing elbow has silted up with carbon"], "acierto": ["The heat exchanger — the old impeller's vanes went downstream and are blocking tubes"], "bien": "<b>The heat exchanger, and the job was never finished.</b> When the old impeller failed its vanes tore off and went downstream with the water, and the tube bundle is the first thing narrow enough to stop them. There is enough capacity left for an easy passage and not enough for a hard one. <b>The vanes were never counted</b> — and until they are out of the bundle, fitting a new impeller has not fixed anything.", "mal": {"The new impeller is already failing": "<b>The pump is three weeks old, so it is not on this list.</b> But what the OLD one did when it failed is: its vanes went downstream, and they are still there. <i>This is the answer of somebody who has learned — correctly — that the impeller is the star of this circuit, and has not read the case.</i>", "The thermostat is sticking as it warms up": "That is the sealed circuit, and a sticking thermostat does not care how hard you are pushing her. This one is fine until you ask for more.", "The mixing elbow has silted up with carbon": "That is the right shape of fault — gradual loss of capacity — and it is the fault of an engine that has run for twenty years, not one that changed three weeks ago. Something happened three weeks ago."}, "malOtro": "The pump is new, so the pump is not the problem — but what happened to the old one is. Where do the broken pieces of an impeller go, and what is the first thing narrow enough to catch them?"}, {"caso": "C", "q": "<i>An old engine that has crept up over a whole season. Belt good, level right, thermostat new, strainer clean, impeller perfect. There is water at the exhaust, but less of it than there used to be.</i>", "opciones": ["The mixing elbow, silted up with carbon over the years", "The impeller, which must be worn even if it looks perfect", "The seacock is not opening fully any more", "Nothing is wrong — an old engine simply runs hotter"], "acierto": ["The mixing elbow, silted up with carbon over the years"], "bien": "<b>The mixing elbow.</b> Nothing here is broken and everything has been eliminated for you, so stop looking for a failure and look for something that has slowly changed: the passage has got narrower, so less water gets away and less heat goes with it. <b>«There is water, but less of it» is the whole diagnosis</b>, and it is the classic fault of an engine that has been perfectly maintained for twenty years.", "mal": {"The impeller, which must be worn even if it looks perfect": "You were told it is perfect, and a worn impeller gets worse when you push her, not gradually over a season. Read the eliminations as eliminations.", "The seacock is not opening fully any more": "Possible in principle and it is a valve, not a passage that silts. And it would have been found by the person who checked everything else on that list.", "Nothing is wrong — an old engine simply runs hotter": "An engine has no opinion about its age. Something physical has changed, and you have been told which way: <b>less water is getting out.</b>"}, "malOtro": "Nothing here is broken and everything has been eliminated for you, so look for something that has slowly changed. And read the last sentence again — you were told the flow is weaker, not absent."}]}];
const TOT = 21;
const FICHERO = "c31-p1b-what-keeps-it-alive.html";

let FIG = null, MONTAJE = null, ANGULO = null, ORDEN = null, TALLER = null, HUMO = null;

let TODO = false;

let hayNuevas = false;

let iPaso = 0;
let iPZ = 0, iCaso = 0, RESP = 0;

function barajaEstable(lista, semilla) {
  const out = lista.slice();
  let n = 0;
  for (let k = 0; k < semilla.length; k++) n = (n * 31 + semilla.charCodeAt(k)) >>> 0;
  for (let i = out.length - 1; i > 0; i--) {
    n = (n * 1103515245 + 12345) >>> 0;
    const j = n % (i + 1);
    const t = out[i]; out[i] = out[j]; out[j] = t;
  }

  let igual = true;
  for (let k = 0; k < out.length; k++) if (out[k] !== lista[k]) { igual = false; break; }
  if (igual) out.push(out.shift());
  return out;
}

function arrancaFigura(){
  if (typeof Motor3D === "undefined" || Motor3D.error) {
    document.getElementById("cargando").textContent =
      "The 3-D engine could not start in this browser.";
    return false;
  }
  FIG = Motor3D.montar(document.getElementById("escena"));
  document.getElementById("escena").classList.add("listo");
  return true;
}

const PM_LUCES = [["oil","OIL"], ["temp","TEMP"], ["charge","CHG"]];
function pintaPanel(cfg){
  const caja = document.getElementById("panelMotor");
  if (!caja) return;
  const antes = caja.hidden;
  if (!cfg) { caja.hidden = true; if (!antes) avisaDelTamano(); return; }
  const fila = caja.querySelector(".pmLuces");
  if (!fila.children.length) {
    for (const [k, rot] of PM_LUCES) {
      const d = document.createElement("div");
      d.className = "pmLuz"; d.setAttribute("data-luz", k);
      d.innerHTML = '<i></i><b>' + rot + '</b>';
      fila.appendChild(d);
    }
  }
  for (const [k] of PM_LUCES)
    fila.querySelector('[data-luz="' + k + '"]').classList.toggle("on", !!cfg[k]);
  const f = Math.max(0, Math.min(1, cfg.aguja == null ? 0 : cfg.aguja));
  caja.querySelector(".pmAguja b").style.left = (f * 100).toFixed(1) + "%";
  caja.hidden = false;
  if (antes) avisaDelTamano();
}

function avisaDelTamano(){
  if (typeof window.dispatchEvent === "function")
    window.dispatchEvent(new Event("resize"));
}

let iP = 0;
function vaA(k){
  if (!(k >= 0 && k < PZ.length)) return false;
  iPZ = k; iCaso = 0; TODO = false; pinta(); return true;
}
function vaPantalla(k){ return vaA(k); }

function pinta(){
  iP = iPZ;
  const p = PZ[iPZ];
  pintaPanel(p.panel || null);
  document.getElementById("hTit").textContent = p.tema;
  document.getElementById("hN").textContent = (iPZ + 1) + " / " + TOT;

  if (FIG) {

    const nuevasDe = (donde) => {
      if (typeof MONTAJE_PIEZAS === "undefined") return [];
      const ahora = MONTAJE_PIEZAS[donde] || [];
      const antes = (iPZ > 0 && PZ[iPZ - 1] && MONTAJE_PIEZAS[PZ[iPZ - 1].pos])
        ? MONTAJE_PIEZAS[PZ[iPZ - 1].pos] : [];

      const base = (donde !== p.pos) ? (MONTAJE_PIEZAS[p.pos] || []) : antes;
      const fuera = {};
      base.forEach(n => { fuera[n] = 1; });
      return ahora.filter(n => !fuera[n]);
    };
    const pintaAtenuado = (donde) => {
      if (!FIG.atenua) return;
      if (TODO) { FIG.atenua(null); return; }
      const nuevas = nuevasDe(donde);
      if (!nuevas.length) { FIG.atenua(null); return; }
      FIG.atenua(nuevas);

      if (FIG.seVenDestacadas && !FIG.seVenDestacadas()) { FIG.atenua(null); hayNuevas = false; }
    };
    MONTAJE = MMontaje({ figura: FIG, tope: p.tope, inicio: p.pos,
                         alMover: (n) => pintaAtenuado(n) });
    pintaAtenuado(p.pos);
    hayNuevas = nuevasDe(p.pos).length > 0;

    ANGULO = null;
    HUMO = null;
    if (p.mando === "humo" && typeof MHumo === "function") {
      HUMO = MHumo({ figura: FIG, inicio: p.humo || null });
    }
    if (p.mando === "angulo") {
      ANGULO = MAngulo({ figura: FIG, inicio: p.angulo || 0 });
    } else if (p.angulo != null && FIG.verAngulo) {
      FIG.verAngulo(p.angulo);
    }

    if (FIG.corte) FIG.corte(p.corte ? 1 : 0);
    if (FIG.verCamara) FIG.verCamara(p.camara || "iso", false);

    if (p.enfoque && FIG.enfocar) FIG.enfocar(p.enfoque, false, !!p.cerca);

    if (FIG.enMarcha) FIG.enMarcha(!!p.marcha);

    if (FIG.verResaltadas) FIG.verResaltadas(p.marcas || []);

    if (FIG.verHumo && p.mando !== "humo") FIG.verHumo(p.humo || null);
  }

  const caso = (p.casos && p.casos[iCaso]) || null;

  if (FIG && p.pasos && typeof MTaller === "function") {

    const quiero = iPaso;
    TALLER = MTaller({ figura: FIG, pasos: p.pasos, fijo: p.fijo, camara: p.camara,
                       alPaso: function (n) { iPaso = n; } });
    TALLER.vaA(quiero);
  }

  let html = p.pasos ? "" : ("<h2>" + p.h + "</h2>");

  if (p.pasos && TALLER) {
    const n = TALLER.donde(), tot = TALLER.cuantos();
    html += '<div class="taller">'
      + '<div class="tPaso"><b>Step ' + (n + 1) + ' of ' + tot + '</b></div>'
      + '<div class="tTexto">' + p.pasos[n].t + '</div>'
      + '<div class="tNav">'
      + '<button class="tBtn" id="tAnt"' + (n ? "" : " disabled") + '>&larr; Back</button>'
      + '<button class="tBtn" id="tSig"'
      + (n === tot - 1 ? " disabled" : "") + '>Next step &rarr;</button>'
      + '</div></div>';
  }
  for (const t of p.p) html += "<p>" + t + "</p>";

  if (FIG && FIG.atenua && p.mando !== "humo" && !p.pasos && hayNuevas) {
    html += '<div class="verTodo"><button id="bTodo" aria-pressed="' + (TODO ? "true" : "false")
      + '">' + (TODO ? "Show me just this step" : "Show me everything") + '</button></div>';
  }

  if (FIG && p.mando === "montaje") {
    html += '<div class="montaje"><span class="et">Assembly</span>'
      + '<input type="range" id="mSl" min="0" max="' + p.tope
      + '" step="1" value="' + p.pos + '" aria-label="Assembly step">'
      + '<span class="v" id="mV"></span></div>';
  }

  if (FIG && p.mando === "humo" && HUMO) {
    html += '<div class="montaje humoSel"><span class="et">Smoke</span>'
      + '<div class="humoBtns" id="hB">';
    for (const c of HUMO.colores()) {
      html += '<button class="humoBtn" data-c="' + c + '"'
        + (c === HUMO.cual() ? ' aria-pressed="true"' : ' aria-pressed="false"')
        + '>' + c.charAt(0).toUpperCase() + c.slice(1) + '</button>';
    }
    html += '</div><span class="v" id="hV"></span></div>';
  }
  if (FIG && p.mando === "angulo") {

    html += '<div class="montaje"><span class="et">Crank</span>'
      + '<input type="range" id="aSl" min="0" max="720" step="5" value="'
      + (p.angulo || 0) + '" aria-label="Crank angle">'
      + '<span class="v" id="aV"></span></div>';
  }

  if (p.orden && typeof MOrden === "function") {
    ORDEN = MOrden({ piezas: barajaEstable(p.orden, p.id), orden: p.orden });
  }

  const q = caso ? caso.q : p.q;

  const OPS = (caso && caso.opciones) || p.opciones || null;
  if (p.orden && ORDEN) {
    html += '<div class="pregunta">' + p.q + "</div>";
    html += '<div class="orden" id="ord">';
    for (const it of ORDEN.lista()) {
      html += '<button class="orden-it" data-it="' + it.replace(/"/g, "&quot;") + '">'
        + '<span class="n"></span>' + it + "</button>";
    }
    html += "</div>";
    html += '<div class="veredicto" id="ver" hidden></div>';
  }

  if (q && !p.orden) {
    if (caso) {
      html += '<div class="caso"><b>Case ' + caso.caso + '</b> &#183; '
        + (iCaso + 1) + " of " + p.casos.length + "</div>";
    }
    html += '<div class="pregunta">' + q + "</div>";
    if (OPS) {
      html += '<div class="mx-ops">';
      for (let k = 0; k < OPS.length; k++) {
        html += '<button class="mx-op" data-k="' + k + '">'
          + OPS[k] + "</button>";
      }
      html += "</div>";
    }
    html += '<div class="veredicto" id="ver" hidden></div>';
    if (caso && iCaso < p.casos.length - 1) {
      html += '<div class="nav"><button id="otroCaso" hidden>'
        + "Next case &#8594;</button></div>";
    }
  }
  const pane = document.getElementById("pane");
  pane.innerHTML = html;
  pane.scrollTop = 0;

  const tS = document.getElementById("tSig"), tA = document.getElementById("tAnt");
  if (tS) tS.addEventListener("click", function () {
    if (TALLER) { iPaso = TALLER.siguiente(); pinta(); }
  });
  if (tA) tA.addEventListener("click", function () {
    if (TALLER) { iPaso = TALLER.anterior(); pinta(); }
  });

  const sl = document.getElementById("mSl");
  if (sl && MONTAJE) {
    const v = document.getElementById("mV");
    const di = () => { v.textContent = MONTAJE.ensena(); };
    di();
    sl.addEventListener("input", () => { MONTAJE.mueve(+sl.value); di(); });
  }
  const al = document.getElementById("aSl");
  if (al && ANGULO) {
    const v = document.getElementById("aV");
    const di = () => { v.textContent = ANGULO.ensena(); };
    di();
    al.addEventListener("input", () => { ANGULO.mueve(+al.value); di(); });
  }

  const hb = document.getElementById("hB");
  if (hb && HUMO) {
    const v = document.getElementById("hV");
    const di = () => {
      v.textContent = HUMO.ensena();
      hb.querySelectorAll(".humoBtn").forEach(function (b) {
        b.setAttribute("aria-pressed", b.dataset.c === HUMO.cual() ? "true" : "false");
      });
    };
    di();
    hb.addEventListener("click", function (e) {
      const b = e.target.closest(".humoBtn");
      if (!b) return;
      HUMO.mueve(b.dataset.c);
      di();
    });
  }
  const bt = document.getElementById("bTodo");
  if (bt) bt.addEventListener("click", function () { TODO = !TODO; pinta(); });

  const oc = document.getElementById("otroCaso");
  if (oc) oc.addEventListener("click", function () { iCaso++; pinta(); });

  if (ORDEN) {
    const pinta1 = () => {
      document.querySelectorAll(".orden-it").forEach(function (b) {
        const n = ORDEN.numeroDe(b.dataset.it);
        b.querySelector(".n").textContent = n ? n : "";
        b.classList.toggle("puesto", n > 0);
      });
    };
    pinta1();
    document.querySelectorAll(".orden-it").forEach(function (b) {
      b.addEventListener("click", function () {
        ORDEN.toca(b.dataset.it);
        pinta1();
        if (ORDEN.completo()) juzgaOrden();
      });
    });
  }

  if (FIG && q && !OPS && FIG.alSeleccionar) {
    FIG.alSeleccionar(function (nombre) { juzga(nombre); });
  }
  document.querySelectorAll(".mx-op").forEach(function (b) {
    b.addEventListener("click", function () { juzga(OPS[+b.dataset.k]); });
  });

  if (typeof vistoPon === "function") vistoPon(FICHERO, iPZ);
  progreso();
  navega();
}

function juzgaOrden(){
  const p = PZ[iPZ];
  const bien = ORDEN.acierta();
  if (bien === null) return;
  const caja = document.getElementById("ver");
  if (!caja) return;
  caja.hidden = false;
  caja.className = "veredicto " + (bien ? "bien" : "mal");
  caja.innerHTML = bien ? p.bien : p.mal;
  RESP++;
  document.getElementById("fLog").textContent = RESP + " answers logged";
}

function juzga(dada){
  const p = PZ[iPZ];
  const caso = (p.casos && p.casos[iCaso]) || null;
  const fuente = caso || p;
  if (!fuente.q) return;
  const bien = (fuente.acierto || []).indexOf(dada) >= 0;
  const caja = document.getElementById("ver");
  if (!caja) return;
  caja.hidden = false;
  caja.className = "veredicto " + (bien ? "bien" : "mal");
  caja.innerHTML = bien ? fuente.bien
    : ((fuente.mal && fuente.mal[dada]) || fuente.malOtro);

  const oc = document.getElementById("otroCaso");
  if (oc && bien) oc.hidden = false;
  RESP++;
  document.getElementById("fLog").textContent = RESP + " answers logged";
}

function progreso(){
  const pr = document.getElementById("prog");
  pr.innerHTML = "";
  for (let k = 0; k < TOT; k++) {
    const b = document.createElement("i");
    b.className = (k === iPZ ? "on" : (k < iPZ ? "done" : ""));

    b.title = "Screen " + (k + 1) + " of " + TOT + (PZ[k] && PZ[k].h ? " · " + PZ[k].h : "");
    b.setAttribute("data-va", k);
    b.onclick = () => { vaA(k); };
    pr.appendChild(b);
  }
  document.getElementById("barCont").textContent = (iPZ + 1) + " / " + TOT;
}

function navega(){
  let h = '<div class="nav">';
  if (iPZ > 0) h += '<button id="ant">&#8592; Back</button>';
