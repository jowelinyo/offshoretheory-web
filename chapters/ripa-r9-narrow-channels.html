"use strict";

const NS = "http://www.w3.org/2000/svg";
const D = {W: 1000, H: 620};
let svg = null, gO = null, ESC = 1;
const px = n => n / ESC;

function el(t, at, pa){
  const e = document.createElementNS(NS, t);
  for(const k in at) if(at[k] !== undefined && at[k] !== null) e.setAttribute(k, at[k]);
  (pa || gO || svg).appendChild(e);

}
function txt(x, y, s, an, tam, col, peso, fam, pa){
  const e = el("text", {x: x, y: y, "text-anchor": an || "start",
    "pointer-events": "none", "font-size": px(tam || 13),
    fill: col || "var(--lam-ink)", "font-weight": peso || 400,
    "font-family": fam === "mono" ? "var(--f-mono)" : "var(--f-ui)"}, pa);
  e.textContent = s;
  return e;
}

function sondaDe(i, j){
  const s = Math.sin(i*12.9898 + j*78.233) * 43758.5453;
  return s - Math.floor(s);
}
function sonda(x, y, v){
  const ent = Math.floor(v), dec = Math.round((v - ent)*10);
  const t = el("text", {x: x, y: y, "text-anchor": "middle",
    "pointer-events": "none", "font-size": px(11.5), "font-style": "italic",
    fill: "var(--carta-sonda)", "font-family": "var(--f-ui)", opacity: .78});
  t.appendChild(document.createTextNode(String(ent)));
  if(dec){
    const u = document.createElementNS(NS, "tspan");
    u.setAttribute("font-size", px(8));
    u.setAttribute("dy", px(3));
    u.textContent = String(dec);
    t.appendChild(u);
  }
}

function plantaBarco(x, y, rumbo, tinta, op, largo){
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const L = largo || px(24), M = L*0.34;
  const P = (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  const q = [P(L*0.5, 0), P(L*0.14, M), P(-L*0.46, M*0.8),
             P(-L*0.5, -M*0.8), P(L*0.14, -M)];

  el("path", {d: "M" + q.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L")
                + " Z", fill: tinta, opacity: op === undefined ? .95 : op,
              "data-buque": "1"});
}

const LEY9 = ["(a) A vessel proceeding along the course of a narrow channel or fairway shall keep as near to the outer limit of the channel or fairway which lies on her starboard side as is safe and practicable.", "(b) A vessel of less than 20 meters in length or a sailing vessel shall not impede the passage of a vessel which can safely navigate only within a narrow channel or fairway.", "(c) A vessel engaged in fishing shall not impede the passage of any other vessel navigating within a narrow channel or fairway.", "(d) A vessel shall not cross a narrow channel or fairway if such crossing impedes the passage of a vessel which can safely navigate only within such channel or fairway. The latter vessel may use the sound signal prescribed in Rule 34(d) if in doubt as to the intention of the crossing vessel.", "(e)", "(i) In a narrow channel or fairway when overtaking can take place only if the vessel to be overtaken has to take action to permit safe passing, the vessel intending to overtake shall indicate her intention by sounding the appropriate signal prescribed in Rule 34(c)(i). The vessel to be overtaken shall, if in agreement, sound the appropriate signal prescribed in Rule 34(c)(ii) and take steps to permit safe passing. If in doubt she may sound the signals prescribed in Rule 34(d).", "(ii) This Rule does not relieve the overtaking vessel of her obligation under Rule 13.", "(f) A vessel nearing a bend or an area of a narrow channel or fairway where other vessels may be obscured by an intervening obstruction shall navigate with particular alertness and caution and shall sound the appropriate signal prescribed in Rule 34(e).", "(g) Any vessel shall, if the circumstances of the case admit, avoid anchoring in a narrow channel."];
const LEY9SUB = [5, 6];
const LEY9CAR = 1717;

"use strict";

const CANAL = {
  dragado: 12.0,
  medio: 100,
  orilla: 280,
  seca: -0.5
};

const ELLA = {n: "a laden coaster", tons: 6000, calado: 9.5, margen: 0.10, eslora: 95, manga: 14};

const BUQUES = [
  {id: "motor", n: "A power-driven vessel of 40 m", corto: "Power, 40 m",
   eslora: 40, calado: 3.5, deber: ["a"]},
  {id: "chico", n: "A power-driven vessel of 15 m", corto: "Power, under 20 m",
   eslora: 15, calado: 1.4, deber: ["a", "b"]},
  {id: "vela",  n: "A sailing vessel of 12 m", corto: "Sailing vessel",
   eslora: 12, calado: 2.0, deber: ["a", "b"]},
  {id: "pesca", n: "A vessel engaged in fishing", corto: "Engaged in fishing",
   eslora: 18, calado: 2.6, deber: ["a", "c"]}
];
const MARGEN_TUYO = 0.5;

const DIBUJO = {suelo: 34, referencia: 12, exponente: 1 / 3};
function esloraDibujada(m){
  return DIBUJO.suelo * Math.pow(m / DIBUJO.referencia, DIBUJO.exponente);
}

const CANAL_LARGO = 560;

const SITUACIONES = [
  {id: "canal",  n: "Along", ley: "a"},
  {id: "cruzas", n: "Crossing", ley: "d"},
  {id: "alcanzas", n: "Overtaking", ley: "e"},
  {id: "vuelta", n: "The bend", ley: "f"},
  {id: "fondeas", n: "Anchoring", ley: "g"}
];
function situacionDe(id){
  return SITUACIONES.filter(s => s.id === id)[0] || SITUACIONES[0];
}

function buqueDe(id){ return BUQUES.filter(b => b.id === id)[0] || BUQUES[1]; }

function sondaEn(off){
  const a = Math.abs(off);
  if(a <= CANAL.medio) return CANAL.dragado;
  const t = Math.min(1, (a - CANAL.medio) / (CANAL.orilla - CANAL.medio));
  return CANAL.dragado - t*(CANAL.dragado - CANAL.seca);
}
function necesitaElla(){ return ELLA.calado * (1 + ELLA.margen); }
function necesita(b){ return b.calado + MARGEN_TUYO; }

function limiteDe(hace_falta){
  if(hace_falta >= CANAL.dragado) return CANAL.medio;
  const t = (CANAL.dragado - hace_falta) / (CANAL.dragado - CANAL.seca);
  return CANAL.medio + t*(CANAL.orilla - CANAL.medio);
}

function suAgua(){ return limiteDe(necesitaElla()); }
function limiteCanal(){ return suAgua(); }
function enElCanal(off){ return Math.abs(off) <= limiteCanal(); }
function tuAgua(b){ return limiteDe(necesita(b)); }

function ellaEncerrada(){ return suAgua() <= CANAL.medio + 40; }

function donde(off, b){
  if(sondaEn(off) < necesita(b)) return "varado";
  if(!enElCanal(off)) return "fuera";
  return off > 0 ? "estribor" : "babor";
}

function margenAlFilo(off){ return limiteCanal() - Math.abs(off); }

const MANGA = {motor: 8, chico: 4.2, vela: 3.8, pesca: 5.5};
const ROCE = 20;

function suBanda(){ return -limiteCanal()*0.5; }
function huecoASuCostado(){

  return limiteCanal() - (suBanda() + ELLA.manga/2);
}
function cabesPorSuCostado(b){
  return huecoASuCostado() >= (MANGA[b.id] || 5) + ROCE;
}

const CADENA = 4;
function radioDeBorneo(off, b){
  return CADENA * Math.max(0, sondaEn(off)) + b.eslora;
}

function borneoInvade(off, b){
  return Math.abs(off) - radioDeBorneo(off, b) < suAgua();
}

function estado(off, id, sit){
  const b = buqueDe(id);
  const s = situacionDe(sit);
  return {
    off: off, buque: b,
    sonda: sondaEn(off),
    donde: donde(off, b),
    suAgua: suAgua(),
    limiteCanal: limiteCanal(),
    tuAgua: tuAgua(b),
    alFilo: margenAlFilo(off),

    cabesFuera: tuAgua(b) > limiteCanal(),
    cabes: cabesPorSuCostado(b),
    hueco: huecoASuCostado(),
    suBanda: suBanda(),
    necesitas: necesita(b),
    necesitaElla: necesitaElla(),
    encerrada: ellaEncerrada(),
    estorbas: enElCanal(off) && b.deber.length > 1 && tuAgua(b) > limiteCanal(),

    ancho: b.deber.indexOf("c") >= 0,

    deber_b: b.deber.indexOf("b") >= 0,
    sit: s,

    entreBoyas: enElCanal(off),
    borneo: radioDeBorneo(off, b),
    borneoInvade: borneoInvade(off, b)
  };
}

function malDe(e){
  if(e.donde === "varado") return true;
  const s = e.sit.id;
  if(s === "canal")    return e.estorbas || e.donde === "babor";
  if(s === "alcanzas") return !e.cabes;
  if(s === "fondeas")  return e.entreBoyas || e.borneoInvade;
  return false;
}

const ANCHO = 950;

function offsetDeSonda(m){
  if(m >= CANAL.dragado) return CANAL.medio;

              "data-banda": "tierra"});

  [[0.0, "secante", "var(--carta-secante)"],
   [2.0, "somera",  "var(--carta-somera)"],
   [5.0, "media",   "var(--carta-media)"],
   [CANAL.dragado, "honda", "var(--carta)"]].forEach(function(q){
      const a = offsetDeSonda(q[0]);

    const a = offsetDeSonda(q[0]);

      if(r3 < 0.42) continue;

      "var(--lam-dim)", 400, "mono");

    this.escena(e);

    const M = D.W*0.028, w = D.W - M*2;
    el("rect", {x: 0, y: 0, width: D.W, height: E9.y0, fill: "var(--lam-papel)"});
    el("line", {x1: 0, y1: E9.y0, x2: D.W, y2: E9.y0, stroke: "var(--edge-card)",
                "stroke-width": px(1)});
    el("rect", {x: 0, y: E9.y1, width: D.W, height: D.H - E9.y1,
                fill: "var(--lam-papel)"});
    el("line", {x1: 0, y1: E9.y1, x2: D.W, y2: E9.y1, stroke: "var(--edge-card)",
                "stroke-width": px(1)});

    txt(M, px(24), "WHOSE WATER IS WHOSE", "start", 12, "var(--lam-dim)", 600, "mono");
    mando("off", M, px(42), w, "WHERE YOU SIT ACROSS THE CHANNEL",
          (S9.off + CANAL.orilla) / (2*CANAL.orilla),
          (S9.off === 0 ? "on the axis"
           : Math.abs(S9.off) + " m to " + (S9.off > 0 ? "starboard" : "port")));

    const hb = px(30), yb = px(104), wb = (w - px(30))/4;
    BUQUES.forEach(function(b, i){
      boton9("b:" + b.id, M + i*(wb + px(10)), yb, wb, hb, null, b.corto,
             b.id === S9.tipo);
    });
    const hs = px(30), ys = E9.y1 + px(14), ws = (w - px(40))/5;
    SITUACIONES.forEach(function(s, i){
      boton9("s:" + s.id, M + i*(ws + px(10)), ys, ws, hs, s.ley, s.n,
             s.id === S9.sit);
    });
  },

  mueve(id, u){
    const p = PISTAS[id];
    if(!p) return;
    const t = Math.max(0, Math.min(1, (u - p.x0) / (p.x1 - p.x0)));
    if(id === "off")
      S9.off = Math.round((-CANAL.orilla + t*2*CANAL.orilla) / 10) * 10;
  },
  pulsa(clave){
    if(clave.indexOf("b:") === 0){ S9.tipo = clave.slice(2); toca(); return; }
    if(clave.indexOf("s:") === 0){ S9.sit = clave.slice(2); toca(); return; }
  },

  panel(){
    const e = estado(S9.off, S9.tipo, S9.sit), t = dilo9(e);

    const mal = malDe(e);
    let h = "<h3>Rule 9</h3><h2>Narrow channels</h2>";

    h += '<div class="ahora' + (mal ? " mal" : "") + '">'
       + '<p class="uno">' + t.donde + "</p><p>" + t.toca + "</p>"
       + (t.aviso ? '<p class="tarde">' + t.aviso + "</p>" : "")
       + "</div>";

    h += "<h3>The readings</h3>";
    h += '<dl class="cifras">'
       + "<dt>You are</dt><dd>" + e.buque.n + "</dd>"
       + "<dt>Where you sit</dt><dd>"
       + (S9.off === 0 ? "on the axis"
          : Math.abs(S9.off) + " m to " + (S9.off > 0 ? "starboard" : "port")) + "</dd>"
       + "<dt>Under you</dt><dd>" + e.sonda.toFixed(1) + " m, and you need "
       + e.necesitas.toFixed(1) + " m</dd>"
       + "<dt>The channel reaches</dt><dd>" + Math.round(e.limiteCanal)
       + " m from the axis, and she cannot leave it</dd>"
       + "<dt>Your water reaches</dt><dd>" + Math.round(e.tuAgua)
       + " m, so you have " + Math.round(e.tuAgua - e.limiteCanal)
       + " m of it outside the channel</dd>"
       + "<dt>You are</dt><dd>" + e.sit.n.toLowerCase() + " &middot; Rule 9("
       + e.sit.ley + ")</dd>"
       + (S9.sit === "fondeas"
          ? "<dt>You swing in</dt><dd>" + Math.round(e.borneo) + " m</dd>"
          : "")
       + "</dl>";

    h += '<p class="buque">The channel is <b>dredged to '
       + CANAL.dragado.toFixed(1) + " m over " + (2*CANAL.medio)
       + " m</b>, and the banks rise from the edge of the cut until they dry at "
       + CANAL.orilla + " m from the axis. She is <b>" + ELLA.n + "</b>, "
       + ELLA.tons.toLocaleString("en") + " tonnes and " + ELLA.eslora
       + " m, drawing " + ELLA.calado.toFixed(1)
       + " m and needing a tenth of that under her keel. <b>That she cannot leave the "
       + "cut is not written down</b>: it comes out of the soundings. At anchor the "
       + "swinging circle is <b>" + CADENA
       + " times the depth plus your own length</b>. <b>The Rule gives no "

       + "figures</b> &mdash; it says <i>as near to the outer limit of the channel "
       + "or fairway which lies on her starboard side as is safe and "
       + "practicable</i>, and what is practicable depends on what you draw.</p>";

    h += '<p class="buque"><b>The two hulls are drawn on a compressed scale</b>, '
       + "and nothing else on the chart is. The channel, the depths and "
       + "the swinging circle all go with the bar; the hulls do not, because a "
       + DIBUJO.referencia + "-meter boat drawn beside a " + ELLA.eslora
       + "-meter ship is a dot. Drawn length goes with the <b>cube root</b> of real "
       + "length, so <b>the order is true and the ratio is not</b>: she is nearly "
       + "eight times your length and is drawn about twice it. The four vessels you "
       + "can be still change size when you change button, and that is the point "
       + "&mdash; the Rule cares whether you are under twenty meters.</p>";

    h += "<h3>The Rule</h3>";
    LEY9.forEach(function(p, i){
      h += '<div class="ley-inciso' + (LEY9SUB.indexOf(i) >= 0 ? " sub" : "")
         + '">' + p + "</div>";
    });
    h += '<p class="fuente">Navigation Rules &amp; Regulations Handbook &middot; '
       + "Rule 9 &middot; " + LEY9CAR + " characters</p>";
    return h;
  }
};

function redibuja(){
  svg = document.getElementById("svg");
  const caja = document.getElementById("ficha").getBoundingClientRect();
  if(!caja.width || !caja.height) return;
  D.H = Math.max(420, Math.round(D.W * caja.height / caja.width));
  ESC = caja.width / D.W;
  svg.setAttribute("viewBox", "0 0 " + D.W + " " + D.H);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  gO = el("g", {}, svg);
  P9.lamina();
}

function pintaPanel(){
  document.getElementById("pane").innerHTML = P9.panel();
  document.getElementById("barCont").textContent = "RULE 9 OF 19";
}

function toca(){ redibuja(); pintaPanel(); }

(function(){
  const f = document.getElementById("ficha");
  let activo = null;

  function valor(e){
    const caja = f.getBoundingClientRect();
    if(!caja.width) return;
    const u = (e.clientX - caja.left) / caja.width * D.W;
    P9.mueve(activo, u);
    redibuja();
    pintaPanel();
  }

  f.addEventListener("pointerdown", function(e){
    const b = e.target.closest && e.target.closest("[data-boton]");
    if(b){
      P9.pulsa(b.getAttribute("data-boton"));
      return;
    }
    const g = e.target.closest && e.target.closest("[data-mando]");
    if(!g) return;
    activo = g.getAttribute("data-mando");
    f.classList.add("arrastrando");
    try { f.setPointerCapture(e.pointerId); } catch(err){}

    valor(e);
  });

  f.addEventListener("pointermove", function(e){
    if(activo) valor(e);
  });

  ["pointerup", "pointercancel"].forEach(function(t){
    f.addEventListener(t, function(){
      activo = null;
      f.classList.remove("arrastrando");
    });
  });
})();

const PZ = [P9];
function vaPantalla(i){ toca(); }
const vaA = vaPantalla;

addEventListener("resize", redibuja);

if(typeof ResizeObserver !== "undefined")
  new ResizeObserver(redibuja).observe(document.getElementById("ficha"));
toca();
</script>
<script data-marco="1">

(function(){
"use strict";

const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

const MARCO = {id:"ripa", i:9, paginas:[{f:"ripa-r0-the-nineteen-rules.html",t:"The nineteen rules"},{f:"ripa-r1-application.html",t:"Rule 1 · Application"},{f:"ripa-r2-responsibility.html",t:"Rule 2 · Responsibility"},{f:"ripa-r3-general-definitions.html",t:"Rule 3 · General definitions"},{f:"ripa-r4-application.html",t:"Rule 4 · Application"},{f:"ripa-r5-look-out.html",t:"Rule 5 · Look-out"},{f:"ripa-r6-safe-speed.html",t:"Rule 6 · Safe speed"},{f:"ripa-r7-risk-of-collision.html",t:"Rule 7 · Risk of collision"},{f:"ripa-r8-action-to-avoid-collision.html",t:"Rule 8 · Action to avoid collision"},{f:"ripa-r9-narrow-channels.html",t:"Rule 9 · Narrow channels"},{f:"ripa-r10-traffic-separation-schemes.html",t:"Rule 10 · Traffic separation schemes"},{f:"ripa-r11-application.html",t:"Rule 11 · Application"},{f:"ripa-r12-sailing-vessels.html",t:"Rule 12 · Sailing vessels"},{f:"ripa-r13-overtaking.html",t:"Rule 13 · Overtaking"},{f:"ripa-r14-head-on-situation.html",t:"Rule 14 · Head-on situation"},{f:"ripa-r15-crossing-situation.html",t:"Rule 15 · Crossing situation"},{f:"ripa-r16-action-by-give-way-vessel.html",t:"Rule 16 · Action by give-way vessel"},{f:"ripa-r17-action-by-stand-on-vessel.html",t:"Rule 17 · Action by stand-on vessel"},{f:"ripa-r18-responsibilities-between-vessels.html",t:"Rule 18 · Responsibilities between vessels"},{f:"ripa-r19-restricted-visibility.html",t:"Rule 19 · Conduct of vessels in restricted visibility"}]};
const YO = MARCO.id;
const N = MARCO.paginas.length;
const dosCifras = n => (n < 10 ? "0" : "") + n;
const $ = id => document.getElementById(id);

const LLAVE_NAV = "ripa.nav";
function marcaNav(){ try{ sessionStorage.setItem(LLAVE_NAV, "1"); }catch(e){} }
function veniaDeDentro(){
  try{ return sessionStorage.getItem(LLAVE_NAV) === "1"; }catch(e){ return false; }
}

if(MARCO.i === 0 && !veniaDeDentro()){
  const p = vistoPos(YO, N - 1);
  if(p > 0){ marcaNav(); location.replace(MARCO.paginas[p].f); return; }
}
marcaNav();

vistoEmpieza(YO);
vistoPon(YO, MARCO.i);
if(MARCO.i === N - 1) vistoTermina(YO);

function vaA(i){
  if(i < 0 || i >= N || i === MARCO.i) return;
  marcaNav();
  vistoPon(YO, i);
  location.href = MARCO.paginas[i].f;
}

const CUENTA = dosCifras(MARCO.i + 1) + " / " + dosCifras(N);
function ponCuenta(){
  const b = $("barCont");
  if(b && b.textContent !== CUENTA) b.textContent = CUENTA;
}
ponCuenta();
if(typeof MutationObserver !== "undefined" && $("barCont"))
  new MutationObserver(ponCuenta).observe($("barCont"),
    {childList: true, characterData: true, subtree: true});

(function(){
  const pr = $("prog");
  if(!pr) return;
  pr.innerHTML = "";
  MARCO.paginas.forEach(function(q, i){
    const b = document.createElement("i");
    if(i === MARCO.i) b.className = "on"; else if(i < MARCO.i) b.className = "done";
    b.title = "Screen " + (i + 1) + " of " + N + " · " + q.t;

    b.setAttribute("data-va", i);
    b.onclick = function(){ vaA(i); };
    pr.appendChild(b);
  });
})();

const LLAVE_LOG = "ripa.log";
function leeLog(){
  try{ return parseInt(localStorage.getItem(LLAVE_LOG) || "0", 10) || 0; }
  catch(e){ return 0; }
}
function ponLog(n){ try{ localStorage.setItem(LLAVE_LOG, String(n)); }catch(e){} }
function pintaLog(){
  const f = $("fLog");
  if(!f) return;
  const n = leeLog();
  f.textContent = n + (n === 1 ? " answer logged" : " answers logged");
}
pintaLog();
document.addEventListener("click", function(e){
  const b = e.target.closest ? e.target.closest("[data-di]") : null;
  if(!b) return;
  if(b.getAttribute("data-di") === "otra") return;
  ponLog(leeLog() + 1);
  pintaLog();
}, true);

function hayPregunta(){
  return !!document.querySelector("#pane [data-di]:not([data-di=otra])");
}
function hayOtra(){ return !!document.querySelector("#pane [data-di=otra]"); }

function pintaNav(){
  const pie = $("navPie");
  if(!pie) return;
  const ultima = MARCO.i >= N - 1;
  let h = '<div class="nav">'
    + '<button class="sec" id="atras" data-va="' + (MARCO.i - 1) + '"'
    + (MARCO.i ? "" : " disabled") + ">Back</button>";
  if(hayPregunta())
    h += '<a class="skip" id="salta" data-va="' + (MARCO.i + 1) + '">Skip</a>';
  if(hayOtra()) h += '<button id="otra">Next one</button>';
  h += '<button id="sig" data-va="' + (MARCO.i + 1) + '"'
    + (ultima ? " disabled" : "") + ">"
    + (ultima ? "End of the module" : "Next") + "</button></div>";
  pie.innerHTML = h;
  const a = $("atras"); if(a) a.onclick = function(){ vaA(MARCO.i - 1); };
  const s = $("sig");   if(s) s.onclick = function(){ vaA(MARCO.i + 1); };
  const k = $("salta"); if(k) k.onclick = function(){ vaA(MARCO.i + 1); };
  const o = $("otra");
  if(o) o.onclick = function(){
    const b = document.querySelector("#pane [data-di=otra]");
    if(b) b.click();
  };
}
pintaNav();
if(typeof MutationObserver !== "undefined" && $("pane"))
  new MutationObserver(pintaNav).observe($("pane"), {childList: true, subtree: true});

(function(){
  const d = $("deCero");
  if(!d) return;
  d.onclick = function(){
    vistoOlvida(YO);
    marcaNav();
    location.href = MARCO.paginas[0].f;
  };
})();
})();
</script>
