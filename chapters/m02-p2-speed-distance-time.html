<script>

"use strict";
const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

let RND = 1;

window.azarSemilla = n => {
 RND = (n >>> 0) || 1;
 for(let k = 0; k < 8; k++) azar();
};
function azar(){
 RND ^= RND << 13; RND >>>= 0;
 RND ^= RND >>> 17;
 RND ^= RND << 5;  RND >>>= 0;
 return RND / 4294967296;
}
function baraja(a){
 const b = a.slice();
 for(let i = b.length - 1; i > 0; i--){
  const j = Math.floor(azar() * (i + 1));
  const t = b[i]; b[i] = b[j]; b[j] = t;
 }
 return b;
}
azarSemilla(Date.now());

function bolsaNueva(){ return {i:[], ultima:null}; }
function saca(bolsa, banco){

 if(bolsa.n!==banco.length){ bolsa.i=[]; bolsa.n=banco.length; }
 if(!bolsa.i.length){
  bolsa.i = baraja(banco.map((x, k) => k));
  if(bolsa.i.length > 1 && banco[bolsa.i[bolsa.i.length - 1]].id === bolsa.ultima){
   const t = bolsa.i[bolsa.i.length - 1];
   bolsa.i[bolsa.i.length - 1] = bolsa.i[0]; bolsa.i[0] = t;
  }
 }
 const x = banco[bolsa.i.pop()];
 bolsa.ultima = x.id;

d now it is your boat and your own opening.", "The dividers are already on the line, at the start, holding your hour. <b>You walk them with the [Step] button</b> &mdash; the chart itself has nothing to click on this screen.", "<b class='q'>At 5 knots, how far will you have run in two hours?</b>"], "ck":function(v){var h=(MED['1.P1']||{v:5}).v;if(Math.abs(v-2*h)<=0.3)return {ok:true,m:'<span class="big">'+v.toFixed(1)+' M</span><br><b>Two paces of your own hour</b>, end to end &mdash; and you did not divide anything or write anything down.'};if(Math.abs(v-h)<=0.3)return {ok:false,m:'That is one hour. The question asked for two, and two paces is twice as far.'};return {ok:false,m:'Not that. One pace is one hour of your boat. Lay a second one on the end of it and read how far you have got.'};}, "pista": "One pace is one hour. Two hours is two paces, laid end to end. Read how far the second one reaches.", "show": {"med": {"v": 10.0}, "obra":function(M){var h=(M['1.P1']||{v:5}).v;return ['your hour, as you opened it: <b>'+h.toFixed(2)+' M</b>','two hours is two of them, laid end to end','2 &times; '+h.toFixed(2)+' = <b>'+(2*h).toFixed(1)+' M</b>'];}, "txt": "<p><b>Speed times time is distance</b> &mdash; and here the multiplying is done by your own hand, twice. Nothing was divided and nothing was written down.</p><p>The figure in the working is <b>yours</b>: it is what you opened, not a tidy five.</p>"}}, {"id": "2.P2", "h": "Now three", "t": "pasos", "modo": "caminar", "abre": "1.P1", "leg": [891.7, 561.0, 3336.8, 1170.6], "v": [1400, 1050, 2900], "b": "Next", "un": "M", "ph": "0.0", "ay": "Try a third pace. The line will stop you &mdash; the answer will not.", "p": ["Same line, same opening, one more hour.", "And here the line runs out. <b>This chart is 10.7 miles of open water across, and three hours of your boat is more than that.</b> The dividers will not let you plant a point off the end of the line, and they are right: a chart runs out, a distance does not.", "<b class='q'>And in three hours?</b>"], "ck":function(v){var h=(MED['1.P1']||{v:5}).v;if(Math.abs(v-3*h)<=0.4)return {ok:true,m:'<span class="big">'+v.toFixed(1)+' M</span><br><b>Three paces.</b> You can see now why nobody needs a formula for this one: <b>each hour is the same length</b>, and you just keep laying it down &mdash; whether or not there is paper left to lay it on.'};if(Math.abs(v-2*h)<=0.3)return {ok:false,m:'That is two hours, the one you just did. One more hour is one more of the same length.'};return {ok:false,m:'Not that. Three hours is three of your paces. You walked two of them; the third is the same length again.'};}, "pista": "One more pace than last time. It does not fit on the line, and it does not have to: each pace is the same length.", "show": {"med": {"v": 15.0}, "obra":function(M){var h=(M['1.P1']||{v:5}).v;return ['your hour: <b>'+h.toFixed(2)+' M</b>, the same one you walked twice','three hours is three of them &mdash; two fitted on the line and the third did not','3 &times; '+h.toFixed(2)+' = <b>'+(3*h).toFixed(1)+' M</b>'];}, "txt": "<p>Two of them fitted on the line and the third did not, and <b>that changed nothing about the answer</b>. The line was a ruler, not the passage.</p><p>Each hour is the same length. That is why nobody needs a formula for this one.</p>"}}, {"id": "2.E2", "h": "One hour forty-five is not 1.45", "t": "ejemplo", "piel": "cuenta", "v": [1400, 1050, 2900], "b": "Now you try", "vars": [{"id": "2.E2/a", "pasos": [{"li": "<b>Here is a time as somebody hands it to you: 1 h 45.</b> Two numbers. Before it goes into any sum it has to become one.", "ca": ["<b>1 h 45</b>"]}, {"li": "<b>The hours are already a number. Leave them alone.</b> It is the 45 that has to change.", "ca": ["<b>1</b> h &nbsp;&mdash; already a number", "<b>45</b> min &nbsp;&mdash; this is the one"]}, {"li": "<b>45 minutes out of how many? Sixty. Not a hundred.</b> That one fact is behind more wrong answers on this topic than everything else put together.", "ca": ["1 h &nbsp;=&nbsp; 60 min", "<b>45 &divide; 60</b>"]}, {"li": "<b>45 &divide; 60 = 0.75.</b> Three quarters of an hour, which is what 45 minutes has always been.", "ca": ["45 &divide; 60 &nbsp;=&nbsp; <b>0.75</b>", "three quarters of an hour"]}, {"li": "<b>Put it back after the 1: 1.75 hours.</b> One number, ready to go into a sum. Or 105 minutes, if you would rather work in minutes &mdash; either one is a single number.", "ca": ["<b>1 h 45 &nbsp;=&nbsp; 1.75 h &nbsp;=&nbsp; 105 min</b>"]}, {"li": "<b>And what 1.45 would have been.</b> 0.45 of an hour is 27 minutes, so 1.45 h is 1 h 27 &mdash; 18 minutes adrift of what anybody meant.", "ca": ["1 h 45 &nbsp;=&nbsp; <b>1.75 h</b> &nbsp; &#10003;", "1.45 h &nbsp;=&nbsp; 1 h 27 &nbsp; &#10007; &nbsp; not what anybody meant"]}]}, {"id": "2.E2/b", "pasos": [{"li": "<b>Here is a time as somebody hands it to you: 2 h 30.</b> Two numbers. Before it goes into any sum it has to become one.", "ca": ["<b>2 h 30</b>"]}, {"li": "<b>The hours are already a number. Leave them alone.</b> It is the 30 that has to change.", "ca": ["<b>2</b> h &nbsp;&mdash; already a number", "<b>30</b> min &nbsp;&mdash; this is the one"]}, {"li": "<b>30 minutes out of how many? Sixty. Not a hundred.</b> That one fact is behind more wrong answers on this topic than everything else put together.", "ca": ["1 h &nbsp;=&nbsp; 60 min", "<b>30 &divide; 60</b>"]}, {"li": "<b>30 &divide; 60 = 0.5.</b> Half of an hour, which is what 30 minutes has always been.", "ca": ["30 &divide; 60 &nbsp;=&nbsp; <b>0.5</b>", "half of an hour"]}, {"li": "<b>Put it back after the 2: 2.5 hours.</b> One number, ready to go into a sum. Or 150 minutes, if you would rather work in minutes &mdash; either one is a single number.", "ca": ["<b>2 h 30 &nbsp;=&nbsp; 2.5 h &nbsp;=&nbsp; 150 min</b>"]}, {"li": "<b>And what 2.30 would have been.</b> 0.30 of an hour is 18 minutes, so 2.30 h is 2 h 18 &mdash; 12 minutes adrift of what anybody meant.", "ca": ["2 h 30 &nbsp;=&nbsp; <b>2.5 h</b> &nbsp; &#10003;", "2.30 h &nbsp;=&nbsp; 2 h 18 &nbsp; &#10007; &nbsp; not what anybody meant"]}]}, {"id": "2.E2/c", "pasos": [{"li": "<b>Here is a time as somebody hands it to you: 3 h 40.</b> Two numbers. Before it goes into any sum it has to become one.", "ca": ["<b>3 h 40</b>"]}, {"li": "<b>The hours are already a number. Leave them alone.</b> It is the 40 that has to change.", "ca": ["<b>3</b> h &nbsp;&mdash; already a number", "<b>40</b> min &nbsp;&mdash; this is the one"]}, {"li": "<b>40 minutes out of how many? Sixty. Not a hundred.</b> That one fact is behind more wrong answers on this topic than everything else put together.", "ca": ["1 h &nbsp;=&nbsp; 60 min", "<b>40 &divide; 60</b>"]}, {"li": "<b>40 &divide; 60 = 0.67.</b> Two thirds of an hour, which is what 40 minutes has always been.", "ca": ["40 &divide; 60 &nbsp;=&nbsp; <b>0.67</b>", "two thirds of an hour"]}, {"li": "<b>Put it back after the 3: 3.67 hours.</b> One number, ready to go into a sum. Or 220 minutes, if you would rather work in minutes &mdash; either one is a single number.", "ca": ["<b>3 h 40 &nbsp;=&nbsp; 3.67 h &nbsp;=&nbsp; 220 min</b>"]}, {"li": "<b>And what 3.40 would have been.</b> 0.40 of an hour is 24 minutes, so 3.40 h is 3 h 24 &mdash; 16 minutes adrift of what anybody meant.", "ca": ["3 h 40 &nbsp;=&nbsp; <b>3.67 h</b> &nbsp; &#10003;", "3.40 h &nbsp;=&nbsp; 3 h 24 &nbsp; &#10007; &nbsp; not what anybody meant"]}]}], "p": ["Two hours is two paces. <b>One hour forty-five is one pace and three quarters of a pace.</b> You can see it, and there is nothing to convert.", "The moment you put the dividers down and reach for arithmetic, there is. <b>Converting is the price of letting go of the dividers.</b>"]}, {"id": "2.P3", "h": "Write it as one number", "t": "num", "v": [1400, 1050, 2900], "b": "Next", "un": "hours", "ph": "0.00", "p": ["A time handed to you is two numbers. Before it goes into any sum it has to become one.", "<b class='q'>Write 2 hours 20 minutes as a single number of hours.</b>"], "ck":function(v){if(v>=2.32&&v<=2.35)return {ok:true,m:'<span class="big">2.33 hours</span><br>Twenty minutes is a <b>third</b> of an hour, and a third is 0.33.'};if(Math.abs(v-140)<=1)return {ok:null,stay:true,m:'<b>140 minutes is right</b>, and it is one number, which is the point. The question asked for hours: 140 minutes is <b>2.33</b> hours.'};if(Math.abs(v-2.20)<=0.02)return {ok:false,m:'<b>2.20 is not two hours twenty.</b> It is two hours and 12 minutes, because 0.20 of an hour is 12 minutes. Twenty minutes is a <b>third</b> of an hour: <b>2.33</b>.'};return {ok:false,m:'Not that. Twenty minutes out of sixty &mdash; work out what fraction that is, and put it after the 2.'};}, "pista": "20 minutes out of 60. Work out what fraction that is, and put it after the 2.", "show": {"med": {"v": 2.33}, "obra":function(M){return ['the hours are already a number: <b>2</b>','twenty minutes out of sixty: 20 &divide; 60 = <b>0.33</b>','put it back after the 2: <b>2.33 hours</b> &mdash; or 140 minutes'];}, "txt": "<p><b>2.20 is neither of them.</b> It is two hours and twelve minutes, because 0.20 of an hour is 12 minutes. An hour runs to sixty, not to a hundred.</p><p>And notice what does not need any of this: walk the dividers and two hours twenty is two paces and a third of a pace. <b>The conversion is the price of reaching for arithmetic.</b></p>"}}, {"id": "2.E3", "h": "One on paper", "t": "ejemplo", "piel": "cuenta", "v": [1400, 1050, 2900], "b": "Now you try", "vars": [{"id": "2.E3/q09", "pasos": [{"li": "<b>Speed and time given, distance missing.</b> No chart this time: three rows and a gap, which is how it comes in an exam and on paper.", "ca": ["<span class='prl'>distance</span> <b>&mdash;&mdash;&mdash;</b>", "<span class='prl'>speed</span> <b>6 kn</b>", "<span class='prl'>time</span> <b>1 h 45</b>"]}, {"li": "<b>The time is written the way people say it, and a sum cannot use it like that.</b> Before anything is multiplied it has to bec ivide anything.</b> 3 hours means the line is 3 of her hours laid end to end. So one of her hours is a third of it.", "es": {"leg": [1147.7, 681.0, 3289.6, 1136.3], "sp": 3.1, "n": 3, "rot": ["1 h", "1 h", "1 h"]}}, {"li": "<b>Open the dividers to one of those thirds.</b> That is one hour of this boat &mdash; the same thing you opened in the first topic, except that this time the chart chose how big it is instead of you.", "es": {"leg": [1147.7, 681.0, 3289.6, 1136.3], "sp": 3.1, "n": 1, "rot": ["1 h"]}}, {"li": "<b>Carry it to the latitude scale up the side and read it.</b>", "es": {"esc": 3.1, "y": 900}}, {"li": "<b>What you read is the speed: 3.1 knots</b>, and you never divided anything. Miles in one hour <b>is</b> what a knot is.", "es": {"esc": 3.1, "y": 900}}]}, {"id": "3.E1/33", "pasos": [{"li": "<b>A line across the chart, and how long she took over it.</b> She ran it in <b>3 hours</b>. Nobody has told you her speed.", "es": {"leg": [3307.7, 761.0, 978.1, 842.4], "sp": 9.9, "n": 1, "rot": ["3 h"]}}, {"li": "<b>You are not going to divide anything.</b> 3 hours means the line is 3 of her hours laid end to end. So one of her hours is a third of it.", "es": {"leg": [3307.7, 761.0, 978.1, 842.4], "sp": 3.3, "n": 3, "rot": ["1 h", "1 h", "1 h"]}}, {"li": "<b>Open the dividers to one of those thirds.</b> That is one hour of this boat &mdash; the same thing you opened in the first topic, except that this time the chart chose how big it is instead of you.", "es": {"leg": [3307.7, 761.0, 978.1, 842.4], "sp": 3.3, "n": 1, "rot": ["1 h"]}}, {"li": "<b>Carry it to the latitude scale up the side and read it.</b>", "es": {"esc": 3.3, "y": 900}}, {"li": "<b>What you read is the speed: 3.3 knots</b>, and you never divided anything. Miles in one hour <b>is</b> what a knot is.", "es": {"esc": 3.3, "y": 900}}]}, {"id": "3.E1/35", "pasos": [{"li": "<b>A line across the chart, and how long she took over it.</b> She ran it in <b>3 hours</b>. Nobody has told you her speed.", "es": {"leg": [907.7, 561.0, 3306.6, 1159.1], "sp": 10.5, "n": 1, "rot": ["3 h"]}}, {"li": "<b>You are not going to divide anything.</b> 3 hours means the line is 3 of her hours laid end to end. So one of her hours is a third of it.", "es": {"leg": [907.7, 561.0, 3306.6, 1159.1], "sp": 3.5, "n": 3, "rot": ["1 h", "1 h", "1 h"]}}, {"li": "<b>Open the dividers to one of those thirds.</b> That is one hour of this boat &mdash; the same thing you opened in the first topic, except that this time the chart chose how big it is instead of you.", "es": {"leg": [907.7, 561.0, 3306.6, 1159.1], "sp": 3.5, "n": 1, "rot": ["1 h"]}}, {"li": "<b>Carry it to the latitude scale up the side and read it.</b>", "es": {"esc": 3.5, "y": 900}}, {"li": "<b>What you read is the speed: 3.5 knots</b>, and you never divided anything. Miles in one hour <b>is</b> what a knot is.", "es": {"esc": 3.5, "y": 900}}]}], "p": ["Here is the gesture, on a passage somebody else made.", "<b>Watch what does NOT happen: nothing gets divided.</b>"]}, {"id": "3.P1", "h": "A leg in two hours", "t": "pasos", "modo": "medir", "luego": "num", "b": "Next", "leg": [1327.0, 774.0, 2322.7, 2647.0], "un": "knots", "ph": "0.0", "ay": "First measure the leg: prick both points and carry the dividers to the latitude scale. Then work out the speed.", "p": ["Measure <b>Aldern Rock to Stennick Point</b> &mdash; right across the chart.", "It took <b>two hours</b>.", "<b class='q'>How fast were you going?</b>"], "ck":function(v){if(Math.abs(v-9.01)<=0.20)return {ok:true,m:'<span class="big">'+v.toFixed(2)+' M</span><br>That is the leg. <b>Now the speed:</b> she covered all of it in two hours.'};if(v>9.01)return {ok:false,m:'Too long. Prick Aldern Rock and Stennick Point themselves, not the water beyond them.'};return {ok:false,m:'Too short. Aldern Rock is out at the north-west, Stennick Point is the eastern headland at the mouth.'};}, "ck2":function(v,L){var e=L/2;if(Math.abs(v-e)<=0.25)return {ok:true,m:'<span class="big">'+v.toFixed(1)+' knots</span><br>Half the leg is one hour of you. You divided nothing that the dividers could not have done for you.'};if(Math.abs(v-L*2)<=0.5)return {ok:false,m:'You have multiplied. '+L.toFixed(1)+' miles in two hours cannot be '+(L*2).toFixed(0)+' knots &mdash; that would be the whole leg in half an hour.'};if(Math.abs(v-L)<=0.3)return {ok:false,m:'That is the whole leg, not one hour of it. She took two hours over it, so an hour is half.'};return {ok:false,m:'Not that. In two hours she covered the whole leg, so in one hour she covered half of it &mdash; and miles in one hour is a knot.'};}, "pista": "In two hours you covered the whole leg. So in one hour you covered half of it. Miles in one hour is what a knot is.", "show": {"med": {"v": 9.01}, "obra":function(M){var o=M['3.P1'], L=o?o.v:9.01;return ['the leg, measured and read off the scale: <b>'+L.toFixed(2)+' M</b>','two hours over it, so one hour is half of it',''+L.toFixed(2)+' &divide; 2 = <b>'+(L/2).toFixed(1)+' knots</b>'];}, "txt": "<p>With the dividers you would never have written that division down: <b>open them to half the leg and read that on the scale.</b> The number you read is the answer.</p>"}}, {"id": "3.P2", "h": "A couple of them", "t": "problema", "caso": "s", "n": 2, "sube": true, "b": "Next", "un": "knots", "ph": "0.0", "ay": "<b>Two of them.</b> Get both out and you are done; slip on one and a third comes along.", "p": ["Three on paper. You are given the distance and the time; <b>the speed is the one missing</b>.", "<b class='q'>How fast?</b>"], "pista": "A knot is miles in one hour. You have the miles and you have the hours. How many miles fit into one of those hours?", "show": {"med": {"v": 0}}}, {"id": "3.E2", "h": "When the time is not whole hours", "t": "ejemplo", "piel": "cuenta", "b": "Now you try", "vars": [{"id": "3.E2/q10", "pasos": [{"li": "<b>Distance and time given, speed missing.</b> And the time comes as people say it: <b>1 h 45</b>.", "ca": ["<span class='prl'>distance</span> <b>7 M</b>", "<span class='prl'>time</span> <b>1 h 45</b>", "<span class='prl'>speed</span> <b>&mdash;&mdash;&mdash;</b>"]}, {"li": "<b>The conversion first, always.</b> 1 h 45 is <b>1.75 hours</b> &mdash; not 1.45, which is what the clock face tempts you to write.", "ca": ["1 h 45 &nbsp;=&nbsp; <b>1.75 h</b>", "1.45 h &nbsp;&mdash;&nbsp; a different time altogether"]}, {"li": "<b>7 &divide; 1.75 = 4 knots.</b> The division is the easy part; the line above it is where this gets failed.", "ca": ["7 M &divide; 1.75 h &nbsp;=&nbsp; <b>4 kn</b>", "with 1.45 you would have got 4.83 kn &mdash; 0.83 of a knot out"]}]}, {"id": "3.E2/q12", "pasos": [{"li": "<b>Distance and time given, speed missing.</b> And the time comes as people say it: <b>2 h 45</b>.", "ca": ["<span class='prl'>distance</span> <b>16.5 M</b>", "<span class='prl'>time</span> <b>2 h 45</b>", "<span class='prl'>speed</span> <b>&mdash;&mdash;&mdash;</b>"]}, {"li": "<b>The conversion first, always.</b> 2 h 45 is <b>2.75 hours</b> &mdash; not 2.45, which is what the clock face tempts you to write.", "ca": ["2 h 45 &nbsp;=&nbsp; <b>2.75 h</b>", "2.45 h &nbsp;&mdash;&nbsp; a different time altogether"]}, {"li": "<b>16.5 &divide; 2.75 = 6 knots.</b> The division is the easy part; the line above it is where this gets failed.", "ca": ["16.5 M &divide; 2.75 h &nbsp;=&nbsp; <b>6 kn</b>", "with 2.45 you would have got 6.73 kn &mdash; 0.73 of a knot out"]}]}, {"id": "3.E2/q14", "pasos": [{"li": "<b>Distance and time given, speed missing.</b> And the time comes as people say it: <b>1 h 15</b>.", "ca": ["<span class='prl'>distance</span> <b>5 M</b>", "<span class='prl'>time</span> <b>1 h 15</b>", "<span class='prl'>speed</span> <b>&mdash;&mdash;&mdash;</b>"]}, {"li": "<b>The conversion first, always.</b> 1 h 15 is <b>1.25 hours</b> &mdash; not 1.15, which is what the clock face tempts you to write.", "ca": ["1 h 15 &nbsp;=&nbsp; <b>1.25 h</b>", "1.15 h &nbsp;&mdash;&nbsp; a different time altogether"]}, {"li": "<b>5 &divide; 1.25 = 4 knots.</b> The division is the easy part; the line above it is where this gets failed.", "ca": ["5 M &divide; 1.25 h &nbsp;=&nbsp; <b>4 kn</b>", "with 1.15 you would have got 4.35 kn &mdash; 0.35 of a knot out"]}]}], "p": ["You have written a time as one number before. <b>Now you have to divide by one</b>, and that is where this goes wrong.", "The difference does not look like much until you see what it costs."]}, {"id": "3.P3", "h": "And now the awkward ones", "t": "problema", "caso": "s", "n": 2, "sube": true, "solo": "minutos", "b": "Next", "un": "knots", "ph": "0.0", "ay": "<b>Two of them</b>, and neither is a whole number of hours. Slip on one and a third comes along.", "p": ["Same question, and now the time comes at you the way it usually does.", "<b class='q'>How fast?</b>"], "pista": "Turn the time into one number of hours first. That is the screen you did in topic 2, and it is the whole difficulty here.", "show": {"med": {"v": 0}}}]}, {"t": "Distance and speed to time", "s": [{"id": "4.S1", "h": "The one you will use most", "b": "Now watch one", "calc3": true, "p": ["The third question, and the one that comes up more than the other two together: <b>you have the distance and the speed, and you want the time.</b>", "Step your hour down the leg and count the paces.", "And here is the catch: <b>the leg almost never runs out at the end of a pace.</b> There is nearly always a piece left over, and that piece is a fraction of an hour.", "<b>That fraction is where this whole topic is failed</b> &mdash; not in the stepping, which you can see, but in what gets written down afterwards."]}, {"id": "4.E1", "h": "A leg that takes less than an hour", "t": "ejemplo", "piel": "gesto", "b": "Now you try", "vars": [{"id": "4.E1/46", "pasos": [{"li": "<b>Another boat, doing 10 knots.</b> Her hour is 10 miles: 10 minutes on the latitude scale up the side.", "es": {"esc": 10, "y": 900}}, {"li": "<b>Put her hour on the leg, at the start.</b> Kettle Head to Bramble Point.", "es": {"leg": [1711.7, 910.0, 1665.7, 1999.0], "sp": 10, "n": 1, "rot": ["1 h"]}}, {"li": "<b>One pace and she is already past the end.</b> So the leg takes <b>less</b> than an hour &mdash; and you know that before there is any number in it.", "es": {"leg": [1711.7, 910.0, 1665.7, 1999.0], "sp": 10, "n": 1, "rot": ["1 h"], "fin": "past the end"}}, {"li": "<b>How much less? Compare the two lengths.</b> Her hour is on the scale and the leg is on the chart, and both came off that same scale &mdash; so they compare straight across, with nothing to convert.", "es": {"esc": 10, "y": 900, "leg": [1711.7, 910.0, 1665.7, 1999.0], "sp": 4.629083406385554, "n": 1, "rot": ["the leg"]}}, {"li": "<b>The leg is just under half of the hour: 0.46 of an hour.</b> That is what this kind of screen wants &mdash; <b>a fraction of an hour, not a number of minutes</b>. Minutes come next, and they are not the same number.", "es": {"esc": 10, "y": 900, "leg": [1711.7, 910.0, 1665.7, 1999.0], "sp": 4.629083406385554, "n": 1, "rot": ["0.46 of it"]}}]}, {"id": "4.E1/63", "pasos": [{"li": "<b>Another boat, doing 7 knots.</b> Her hour is 7 miles: 7 minutes on the latitude scale up the side.", "es": {"esc": 7, "y": 900}}, {"li": "<b>Put her hour on the leg, at the start.</b> Bramble Point to Marloe Ness.", "es": {"leg": [1665.7, 1999.0, 2678.7, 1789.0], "sp": 7, "n": 1, "rot": ["1 h"]}}, {"li": "<b>One pace and she is already past the end.</b> So the leg takes <b>less</b> than an hour &mdash; and you know that before there is any number in it.", "es": {"leg": [1665.7, 1999.0, 2678.7, 1789.0], "sp": 7, "n": 1, "rot": ["1 h"], "fin": "past the end"}}, {"li": "<b>How much less? Compare the two lengths.</b> Her hour is on the scale and the leg is on the chart, and both came off that same scale &mdash; so they compare straight across, with nothing to convert.", "es": {"esc": 7, "y": 900, "leg": [1665.7, 1999.0, 2678.7, 1789.0], "sp": 4.393660501519453, "n": 1, "rot": ["the leg"]}}, {"li": "<b>The leg is about two thirds of the hour: 0.63 of an hour.</b> That is what this kind of screen wants &mdash; <b>a fraction of an hour, not a number of minutes</b>. Minutes come next, and they are not the same number.", "es": {"esc": 7, "y": 900, "leg": [1665.7, 1999.0, 2678.7, 1789.0], "sp": 4.393660501519453, "n": 1, "rot": ["0.63 of it"]}}]}, {"id": "4.E1/87", "pasos": [{"li": "<b>Another boat, doing 8 knots.</b> Her hour is 8 miles: 8 minutes on the latitude scale up the side.", "es": {"esc": 8, "y": 900}}, {"li": "<b>Put her hour on the leg, at the start.</b> Aldern Lt to Stennick Point.", "es": {"leg": [2272.7, 1016.0, 2322.7, 2647.0], "sp": 8, "n": 1, "rot": ["1 h"]}}, {"li": "<b>One pace and she is already past the end.</b> So the leg takes <b>less</b> than an hour &mdash; and you know that before there is any number in it.", "es": {"leg": [2272.7, 1016.0, 2322.7, 2647.0], "sp": 8, "n": 1, "rot": ["1 h"], "fin": "past the end"}}, {"li": "<b>How much less? Compare the two lengths.</b> Her hour is on the scale and the leg is on the chart, and both came off that same scale &mdash; so they compare straight across, with nothing to convert.", "es": {"esc": 8, "y": 900, "leg": [2272.7, 1016.0, 2322.7, 2647.0], "sp": 6.930075424048828, "n": 1, "rot": ["the leg"]}}, {"li": "<b>The leg is nearly nine tenths of the hour: 0.87 of an hour.</b> That is what this kind of screen wants &mdash; <b>a fraction of an hour, not a number of minutes</b>. Minutes come next, and they are not the same number.", "es": {"esc": 8, "y": 900, "leg": [2272.7, 1016.0, 2322.7, 2647.0], "sp": 6.930075424048828, "n": 1, "rot": ["0.87 of it"]}}]}], "p": ["Here is the whole of it on somebody else's passage: <b>a leg the hour is too big for</b>.", "<b>Watch what tells you the answer is under one</b>, before any number appears."]}, {"id": "4.P1", "h": "The leg you measured", "t": "pasos", "modo": "caminar", "abre": "1.P1", "legDe": "1.P2", "sobra": true, "b": "Next", "un": "of an hour", "ph": "0.00", "ay": "Press <b>[Step]</b> once and see where it lands.", "dyn":function(M){var q=piernaHoy(), o=M['1.P1'], g=M['1.P2'];var n=q?q.de+' to '+q.a:'the leg you measured';var c=(o&&g)?'<div class="calc">your hour &nbsp;<b>'+o.v.toFixed(2)+' M</b>&nbsp;&nbsp;&nbsp; your leg &nbsp;<b>'+g.v.toFixed(2)+' M</b></div>':'';return {p:['<b>'+n+'</b> &mdash; the leg you measured yourself.','Put your hour on '+(q?q.de:'the first point')+' and step it. <b>One pace takes you past the far end</b>, so the leg is less than an hour, and what you want to know is how much less.','The leg and the hour were both measured on the same scale, so they compare directly. Nothing to convert.'].concat(c?[c]:[]).concat(['<b class=\"q\">How much of an hour is the leg?</b>'])};}, "ck":function(v){var q=piernaHoy(), o=MED['1.P1'], g=MED['1.P2'];var h=o?o.v:5.0, L=g?g.v:(q?q.M:3.64), f=L/h;if(Math.abs(v-f)<=0.03)return {ok:true,m:'<span class="big">'+v.toFixed(2)+' of an hour</span><br><b>No formula:</b> two lengths measured with the same tool, compared.'};if(Math.abs(v-f*60)<=3||Math.abs(v-f*100)<=3)return {ok:false,m:'That looks like minutes. This screen wants the <b>fraction</b>; the minutes are next, and they are not the same number.'};if(v>1)return {ok:false,m:'More than an hour cannot be right &mdash; you watched one pace overshoot the point. The leg is <b>shorter</b> than the hour, so the answer is less than one.'};return {ok:false,m:'Not that. Divide the leg by the opening &mdash; '+L.toFixed(2)+' M of leg against '+h.toFixed(2)+' M of hour.'};}, "pista": "Divide the leg by the opening. Both are miles off the same scale, so what is left is a fraction of an hour.", "show": {"med": {"v": 0.73}, "obra":function(M){var o=M['1.P1'], g=M['1.P2'], q=piernaHoy();var h=o?o.v:5.0, L=g?g.v:(q?q.M:3.64);return ['your hour, as you opened it: <b>'+h.toFixed(2)+' M</b>','your leg, as you measured it: <b>'+L.toFixed(2)+' M</b>',''+L.toFixed(2)+' &divide; '+h.toFixed(2)+' = <b>'+(L/h).toFixed(2)+' of an hour</b>'];}, "txt": "<p>One is a little under the other, and <b>that fraction is the answer</b> &mdash; a fraction of an hour, not a number of minutes.</p><p>Turning it into minutes is next, and it is where people fall over.</p>"}}, {"id": "4.E2", "h": "Naught point something of an hour", "t": "ejemplo", "piel": "cuenta", "b": "Now you try", "vars": [{"id": "4.E2/25", "pasos": [{"li": "<b>A fraction of an hour: 0.25.</b> Not a number of minutes. A part of an hour.", "ca": ["<b>0.25 h</b>"]}, {"li": "<b>It is not 25 minutes.</b> That is the decimal read straight down, and an hour does not run to a hundred.", "ca": ["0.25 h &nbsp;&mdash;&nbsp; <s>25 min</s>"]}, {"li": "<b>An hour runs to 60 and then it stops.</b> So a fraction of an hour is that same fraction of sixty minutes.", "ca": ["1 h &nbsp;=&nbsp; 60 min"]}, {"li": "<b>0.25 &times; 60 = 15 minutes.</b> A quarter of an hour, which is what it said all along.", "ca": ["0.25 &times; 60 &nbsp;=&nbsp; <b>15 min</b>", "A quarter of an hour"]}, {"li": "<b>And this one is quieter, which is why it survives.</b> Read 0.25 down as 25 and nothing looks impossible &mdash; 25 minutes is a perfectly ordinary answer. It is just <b>10 minutes wrong</b> on a job that takes 15.", "ca": ["less than 1 hour &nbsp;&rarr;&nbsp; fewer than 60 minutes", "0.25 h &nbsp;=&nbsp; <b>15 min</b>, never 25"]}]}, {"id": "4.E2/95", "pasos": [{"li": "<b>A fraction of an hour: 0.95.</b> Not a number of minutes. A part of an hour.", "ca": ["<b>0.95 h</b>"]}, {"li": "<b>It is not 95 minutes.</b> That is the decimal read straight down, and an hour does not run to a hundred.", "ca": ["0.95 h &nbsp;&mdash;&nbsp; <s>95 min</s>"]}, {"li": "<b>An hour runs to 60 and then it stops.</b> So a fraction of an hour is that same fraction of sixty minutes.", "ca": ["1 h &nbsp;=&nbsp; 60 min"]}, {"li": "<b>0.95 &times; 60 = 57 minutes.</b> Nearly the whole hour, which is what it said all along.", "ca": ["0.95 &times; 60 &nbsp;=&nbsp; <b>57 min</b>", "Nearly the whole hour"]}, {"li": "<b>And the rule that catches everybody:</b> anything less than a whole hour has to come out under sixty minutes. Read 0.95 down as 95 and you have claimed <b>more than an hour and a half</b> for something that takes 57 minutes.", "ca": ["less than 1 hour &nbsp;&rarr;&nbsp; fewer than 60 minutes", "0.95 h &nbsp;=&nbsp; <b>57 min</b>, never 95"]}]}], "p": ["You are holding a fraction of an hour. <b>Three quarters of an hour is a thing you can feel. Naught point nine five is not</b>, and that is where this goes wrong.", "It goes wrong the same way every time, and it is worth seeing it happen once."]}, {"id": "4.P2", "h": "And that in minutes", "t": "num", "b": "Next", "un": "minutes", "ph": "00", "dyn":function(M){var o=M['4.P1'];var c=o?'<div class="calc">your fraction &nbsp;&nbsp;<b>'+o.v.toFixed(2)+' of an hour</b></div>':'';return {p:['Your fraction, on the clock.'].concat(c?[c]:[]).concat(['<b class=\"q\">How many minutes is that?</b>'])};}, "ck":function(v){var o=MED['4.P1'], f=o?o.v:0.728, m=f*60;if(Math.abs(v-m)<=2)return {ok:true,m:'<span class="big">'+Math.round(v)+' minutes</span><br>Inside the hour, which is what the overshooting pace told you before you worked out a thing.'};if(Math.abs(v-f*100)<=2)return {ok:false,m:'You have read the decimal as if it were minutes. <b>'+f.toFixed(2)+' of an hour is not '+Math.round(f*100)+' minutes</b> &mdash; an hour runs to 60 and then it stops, and this leg is shorter than one. Hundredths of an hour are not minutes.'};if(v>60)return {ok:false,m:'More than sixty minutes is more than an hour, and you watched one pace run past the end of this leg. It takes <b>less</b> than an hour.'};return {ok:false,m:'Not that. An hour is 60 minutes and you have a fraction of one: multiply.'};}, "pista": "An hour is 60 minutes. You have a fraction of an hour. Multiply.", "show": {"med": {"v": 44}, "obra":function(M){var o=M['4.P1'], f=o?o.v:0.728;return ['your fraction, from the screen before: <b>'+f.toFixed(2)+' of an hour</b>','an hour is <b>60 minutes</b>, not a hundred',''+f.toFixed(2)+' &times; 60 = <b>'+Math.round(f*60)+' minutes</b>'];}, "txt": "<p>This is the error written down more often than any other on this page, and it is always the same one: <b>reading the decimal as minutes.</b></p><p>The check that catches it every time: anything under a whole hour has to come out under sixty minutes.</p>"}}, {"id": "4.P3", "h": "A couple of them", "t": "problema", "caso": "t", "n": 2, "sube": true, "b": "Next", "un": "h:mm or minutes", "ph": "0:00", "ay": "<b>Two of them</b>, and a third if one does not come out. Write the time however you like &mdash; <b>1:30</b>, <b>1 h 30</b> or <b>90</b>.", "p": ["Three on paper. You are given the distance and the speed; <b>the time is the one missing</b>.", "<b class='q'>How long does it take?</b>"], "pista": "How many times does the speed go into the distance? That answer is in <b>hours</b>. Then turn what is left over into minutes.", "show": {"med": {"v": 0}}}, {"id": "4.E3", "h": "Fewer paces, less error", "t": "ejemplo", "piel": "gesto", "v": [1400, 1050, 2900], "b": "Next", "vars": [{"id": "4.E3/4", "pasos": [{"li": "<b>A long leg, and an hour of your boat &mdash; 3 knots, so 3 miles.</b> Walking the whole thing an hour at a time takes 3 swings here, and thirty on a passage chart.", "es": {"leg": [891.7, 561.0, 3336.8, 1170.6], "sp": 3.0, "n": 3, "rot": ["1 h", "2 h", "3 h"]}}, {"li": "<b>And every swing costs you a little.</b> The back point never lands exactly where the front one was, and the small mistakes all lean the same way. <b>Fewer paces, less error.</b>", "es": {"leg": [891.7, 561.0, 3336.8, 1170.6], "sp": 3.0, "n": 3, "rot": ["1 h", "2 h", "3 h"]}}, {"li": "<b>So open to a round number of miles instead: 4 M.</b> Not an hour &mdash; a distance you picked because it is easy to count and easy to multiply.", "es": {"esc": 4.0, "y": 900}}, {"li": "<b>Now count how many fit: 2.</b> 2 &times; 4 = <b>8 miles</b>, and 2.7 left over t ule 05 &mdash; and it needs the tidal streams of module 04 first.</p><p>Until then, on a still day the two are the same number.</p>"}}]}, {"t": "Mixed", "s": [{"id": "7.P1", "h": "Which one are they asking?", "t": "problema", "caso": "mix", "n": 5, "b": "Next", "ph": "0.0", "ay": "Five in a row. A new one after each, and the blank row moves. <b>These five are five whatever happens</b>: this one is not drill, it is the check.", "p": ["Five of them, and this time <b>nobody tells you which of the three it is.</b>", "Two of the numbers are given. One is blank.", "<b class='q'>Work out the missing one.</b>"], "pista": "Look at which row is blank. If it is the distance, you multiply. If it is the speed or the time, you divide &mdash; and it is the distance that goes on top.", "show": {"med": {"v": 0}}}, {"id": "7.P2", "h": "Three numbers", "b": "Finish this part", "tri": true, "p": ["Distance, speed, time. Give a navigator any two and the third comes out, and you can now get all three.", "You did it with a pair of dividers before you did it with a sum, and that is the order that sticks: <b>a formula can be remembered backwards, and a pair of dividers cannot.</b>", "<div class=\"calc\">open it &nbsp;&middot;&nbsp; measure it &nbsp;&middot;&nbsp; step it</div>", "<b>Two things you cannot do yet.</b>", "Every speed here was <b>through the water on a still day</b>. What the tide does to it is <b>module 05</b>, and the tide itself is module 04.", "And every time here was a <b>duration</b> &mdash; hours and minutes, never a time of day. The clock, and the day it disagrees with itself, is <b>the next part</b>."]}]}];

 }

let COM={ab:0,an:null,vivo:null,esp:false,pos:null,ang:0,sobre:null,fan:null,pie:0,n:0};
const comLimpio=()=>({ab:0,an:null,vivo:null,esp:false,pos:null,ang:0,sobre:null,
 fan:null,pie:0,n:0,res:null});
const comAbriendo=()=>!!COM.an&&!COM.ab;
const enCarta=p=>p[0]>=0&&p[0]<=D.W&&p[1]>=0&&p[1]<=D.H;

function comVivo(){ if(!comAbriendo())return 0;
 const a=COM.an,b=COM.vivo;
 return Math.hypot(b[0]-a[0],b[1]-a[1]);}

function comPie(y,L){
 const mm=Math.round(D.LAT_N*60 - y/D.PXM);
 let y0=(D.LAT_N*60-mm)*D.PXM;
 if(y0+L>D.H)y0-=L;
 return Math.max(0,Math.min(Math.max(0,D.H-L),y0));}
function comReflejo(){
 const s=S();

 if(s.modo!="abrir"&&s.modo!="caminar")return null;
 const L=comAbriendo()?comVivo():COM.ab;
 if(!(L>1))return null;
 const izq=(COM.an?COM.an[0]:(COM.pos?COM.pos[0]:0))<D.W/2;
 const y0=comPie(COM.an?COM.an[1]:D.H/2, L);

 const ca=14*k2();
 return {x:izq?ca:D.W-ca, y0:y0, y1:y0+L, L:L, izq:izq};}

function comClic(p){const s=S();
 if(COM.ab)return;
 if(!COM.an){
  if(!enCarta(p)){
   fb(s.modo=="abrir"
    ?"Prick <b>on the chart</b>. As you move, the same opening appears on the scale "
     +"up the side, so you can see how much you are holding."
    :"Prick the two points <b>on the chart</b> itself.","no");return;}

  COM={...comLimpio(),an:p,vivo:p,res:COM.res};
  fb(s.modo=="abrir"?"Now move, and watch the figure. Prick again when you have it."
                    :"Now move to the other point and prick again.","");
  capa();return;}
 COM.esp=false;}

function comCierra(){const s=S();
 if(!comAbriendo())return;
 const a=COM.an, b=COM.vivo, L=comVivo();
 if(L<10){COM.an=null;COM.vivo=null;COM.esp=false;capa();return;}
 if(s.modo=="abrir"){
  COM.ab=L; COM.fan=null;
  COM.pos=a.slice(); COM.ang=Math.atan2(b[1]-a[1],b[0]-a[0]); COM.sobre="propia";
 }else{
  COM.ab=L; COM.fan=[a.slice(),b.slice()];
  COM.pos=a.slice(); COM.ang=Math.atan2(b[1]-a[1],b[0]-a[0]); COM.sobre=null;}
 COM.an=null; COM.vivo=null; COM.esp=false;
 fb(s.modo=="abrir"?"":"<b>Span taken.</b> Now carry it to the <b>latitude scale up the side</b> "
  +"&mdash; drag the dividers onto the graduated margin. That is where a length becomes a number.","");
 capa();}

function comApoya(p){const s=S(), L=COM.ab, B=90;
 const pon=(q,an,so)=>{COM.pos=q;COM.ang=an;COM.sobre=so;};

 const ca=14*k2();
 if(p[0]>-MG-40&&p[0]<B)
  return pon([ca,Math.min(D.H-L,Math.max(0,p[1]-L/2))],Math.PI/2,"lat");
 if(p[0]>D.W-B&&p[0]<D.W+MG+40)
  return pon([D.W-ca,Math.min(D.H-L,Math.max(0,p[1]-L/2))],Math.PI/2,"lat");
 const pi=pasPierna();
 if(pi){
  const t=(p[0]-pi.a[0])*pi.u[0]+(p[1]-pi.a[1])*pi.u[1];
  const d=Math.abs((p[0]-pi.a[0])*pi.u[1]-(p[1]-pi.a[1])*pi.u[0]);
  if(d<70&&t>-L&&t<pi.L+L){
   const t0=Math.max(0,Math.min(pi.L-L,t-L/2));
   return pon([pi.a[0]+pi.u[0]*t0,pi.a[1]+pi.u[1]*t0],
              Math.atan2(pi.u[1],pi.u[0]),"linea");}}
 pon([p[0]-Math.cos(COM.ang)*L/2, p[1]-Math.sin(COM.ang)*L/2],COM.ang,null);}
const comExtremos=()=>{const p=COM.pos||[0,0];
 return [p,[p[0]+Math.cos(COM.ang)*COM.ab, p[1]+Math.sin(COM.ang)*COM.ab]];};

function comLee(){ if(!COM.ab)return null;

 if(S().modo=="abrir")return COM.ab/D.PXM;
 return COM.sobre=="lat"?COM.ab/D.PXM:null;}

let PIE={};
const PIEB={};

window.piernaHoy=()=>{const s=S();
 return (s.legDe?PIE[s.legDe]:PIE[s.id])||null;};
function pasEscoge(s){
 if(!s.legs)return;
 if(!PIEB[s.id])PIEB[s.id]=bolsaNueva();
 PIE[s.id]=saca(PIEB[s.id],s.legs);}
function pasPierna(){const s=S();

 if(s.legDe&&PIE[s.legDe]){const q=PIE[s.legDe];
  const a=[q.leg[0]-D.X0,q.leg[1]-D.Y0], b=[q.leg[2]-D.X0,q.leg[3]-D.Y0];
  const L=Math.hypot(b[0]-a[0],b[1]-a[1]);
  return {a:a,b:b,L:L,u:[(b[0]-a[0])/L,(b[1]-a[1])/L]};}
 if(s.legs){const q=PIE[s.id]; return q?{a:[q.leg[0]-D.X0,q.leg[1]-D.Y0],
   b:[q.leg[2]-D.X0,q.leg[3]-D.Y0],
   L:Math.hypot(q.leg[2]-q.leg[0],q.leg[3]-q.leg[1]),
   u:[(q.leg[2]-q.leg[0])/Math.hypot(q.leg[2]-q.leg[0],q.leg[3]-q.leg[1]),
      (q.leg[3]-q.leg[1])/Math.hypot(q.leg[2]-q.leg[0],q.leg[3]-q.leg[1])]}:null;}
 if(!s.leg)return null;
 const a=[s.leg[0]-D.X0,s.leg[1]-D.Y0], b=[s.leg[2]-D.X0,s.leg[3]-D.Y0];
 const L=Math.hypot(b[0]-a[0],b[1]-a[1]);
 return {a:a,b:b,L:L,u:[(b[0]-a[0])/L,(b[1]-a[1])/L]};}

const horaDe=id=>{const o=MED[id||"1.P1"];return o?o.v:5.0;};
function comCaminar(){const s=S(), pi=pasPierna();
 if(!pi)return;
 COM.ab=horaDe(s.abre)*D.PXM; COM.pos=pi.a.slice();
 COM.ang=Math.atan2(pi.u[1],pi.u[0]); COM.sobre="linea"; COM.fan=null;}

window.unPaso=()=>{const pi=pasPierna(); if(!pi||!COM.ab)return;
 const s=S(), cabe=COM.pie+COM.ab<=pi.L+0.15*D.PXM;

 if(!cabe&&!(s.sobra&&COM.pie<pi.L-0.05*D.PXM)){
  fb(s.tope||"That pace runs past the end of the line. <b>The line is a ruler, not "
   +"the passage</b> &mdash; the hour is the same length whether or not there is "
   +"paper left to lay it on.","no");return;}
 COM.pie+=COM.ab; COM.n++;
 capa();};

window.mideResto=()=>{const pi=pasPierna(); if(!pi)return;
 if(!COM.n){fb("Step it first. <b>Walk the whole hours down the leg</b>, and then "
  +"measure what is left over.","no");return;}
 const q=[pi.a[0]+pi.u[0]*COM.pie, pi.a[1]+pi.u[1]*COM.pie];
 COM={...comLimpio(),res:{n:COM.n,ab:COM.ab,fin:q}};
 pinta();
 fb("<b>The dividers are yours again.</b> Prick where the last pace landed, then "
  +"prick the far end of the leg &mdash; and carry that span to the latitude scale.");};
window.otroPaso=()=>{const s=S();
 COM=comLimpio();
 if(s.modo=="caminar")comCaminar();
 const d=document.getElementById("fb");
 if(d)d.innerHTML="<small>"+(s.ay||"")+"</small>";
 capa();};
function pasBarra(p0,p1,k,R,N){
 const dx=p1[0]-p0[0], dy=p1[1]-p0[1], L=Math.hypot(dx,dy)||1;
 const nx=-dy/L, ny=dx/L;
 el("line",{x1:p0[0],y1:p0[1],x2:p1[0],y2:p1[1],stroke:N,"stroke-width":5*k},gG);
 for(const e of [p0,p1])
  el("line",{x1:e[0]-nx*11*k,y1:e[1]-ny*11*k,x2:e[0]+nx*11*k,y2:e[1]+ny*11*k,
   stroke:N,"stroke-width":5*k},gG);
 el("circle",{cx:p0[0],cy:p0[1],r:5*k,fill:R},gG);
 el("circle",{cx:p1[0],cy:p1[1],r:5*k,fill:R},gG);}

function comPintaReflejo(k,N){
 const r=comReflejo(); if(!r)return null;
 const sg=r.izq?-1:1, d=D.PXM/10;

 const y0=Math.floor(r.y0/d)*d, y1=r.y1;
 for(let y=y0; y<=y1+0.5; y+=d){
  if(y<-1||y>D.H+1)continue;
  const mm=(D.LAT_N*60)-y/D.PXM;
  const ent=Math.abs(mm-Math.round(mm))<0.004;
  el("line",{x1:r.x,y1:y,x2:r.x+sg*(ent?16:8)*k,y2:y,stroke:N,
   "stroke-width":(ent?2.2:1.4)*k,"stroke-opacity":ent?.55:.35},gG);}
 el("line",{x1:r.x,y1:r.y0,x2:r.x,y2:r.y1,stroke:N,"stroke-width":6*k,
  "stroke-opacity":.9},gG);

 const hasta=r.izq?-38:D.W+38;
 for(const y of [r.y0,r.y1]){
  el("line",{x1:r.x,y1:y,x2:hasta,y2:y,stroke:N,"stroke-width":2.5*k,
   "stroke-opacity":.62},gG);
  el("circle",{cx:r.x,cy:y,r:6*k,fill:N},gG);}
 return r;}

function comChapa(p0,p1,txt,k,N){
 const c=[(p0[0]+p1[0])/2,(p0[1]+p1[1])/2];
 const vert=Math.abs(Math.cos(COM.an?0:COM.ang))<0.4||comAbriendo()&&S().modo=="abrir";
 chapa(c[0]+(vert?30*k:0), c[1]+(vert?0:-38*k), txt, vert?"start":"middle", k, true, N);}
function pasosDibuja(){
 const s=S(); if(s.t!="pasos")return;
 const k=k2(), R="#c8102e", N="#7a1020", G="#7a1020";
 if(s.leg){const pi=pasPierna();
  el("line",{x1:pi.a[0],y1:pi.a[1],x2:pi.b[0],y2:pi.b[1],stroke:"#12202b",
   "stroke-width":2*k,"stroke-opacity":.55,"stroke-dasharray":(12*k)+","+(8*k)},gG);}
 const tira=document.getElementById("paE"), lee=document.getElementById("paR");
 const pon=(a,b)=>{if(tira)tira.innerHTML=a; if(lee)lee.innerHTML=b;};

 if(COM.res){const pi=pasPierna();
  if(pi)for(let i=0;i<COM.res.n;i++){
   const q0=[pi.a[0]+pi.u[0]*COM.res.ab*i, pi.a[1]+pi.u[1]*COM.res.ab*i];
   const q1=[q0[0]+pi.u[0]*COM.res.ab, q0[1]+pi.u[1]*COM.res.ab];
   pasBarra(q0,q1,k,G,G);
   chapa((q0[0]+q1[0])/2,(q0[1]+q1[1])/2-38*k,(i+1)+" h","middle",k,true,G);}}

 if(comAbriendo()){
  const a=COM.an, b=COM.vivo, L=comVivo();
  el("circle",{cx:a[0],cy:a[1],r:7*k,fill:R},gG);
  if(L>=10)pasBarra(a,b,k,R,N);

  const r=comPintaReflejo(k,N);
  if(r)chapa(r.x+(r.izq?42:-42),(r.y0+r.y1)/2,
   (L/D.PXM).toFixed(2)+"' = "+(L/D.PXM).toFixed(2)+" M",r.izq?"start":"end",k,true,N);

  pon(s.modo=="abrir"?"opening":"taking the span",
      s.modo=="abrir"?(L/D.PXM).toFixed(2)+"' = "+(L/D.PXM).toFixed(2)+" M":"&mdash;");
  return;}

 if(!COM.ab){pon(s.modo=="abrir"?"open it on the scale"
   :(s.modo=="medir"||COM.res)?"prick both ends":"walk it",
   COM.res?COM.res.n+" h walked":"&mdash;");return;}
 if(COM.fan){
  el("line",{x1:COM.fan[0][0],y1:COM.fan[0][1],x2:COM.fan[1][0],y2:COM.fan[1][1],
   stroke:G,"stroke-width":3*k,"stroke-opacity":.42,
   "stroke-dasharray":(9*k)+","+(7*k)},gG);
  for(const e of COM.fan)el("circle",{cx:e[0],cy:e[1],r:5*k,fill:G,
   "fill-opacity":.42},gG);}
 if(s.modo=="caminar"&&!COM.res){
  const pi=pasPierna(); if(!pi)return;
  const bar=(i,rot)=>{const q0=[pi.a[0]+pi.u[0]*COM.ab*i, pi.a[1]+pi.u[1]*COM.ab*i];
   const q1=[q0[0]+pi.u[0]*COM.ab, q0[1]+pi.u[1]*COM.ab];
   pasBarra(q0,q1,k,R,N);

   if(rot)chapa((q0[0]+q1[0])/2,(q0[1]+q1[1])/2-38*k,rot,"middle",k,true,N);};
  for(let i=0;i<COM.n;i++)bar(i,(i+1)+" h");

  if(COM.pie+COM.ab<=pi.L+0.15*D.PXM||(s.sobra&&!COM.n))bar(COM.n,null);

  const r=comPintaReflejo(k,N);
  if(r)chapa(r.x+(r.izq?42:-42),(r.y0+r.y1)/2,
   "1 h = "+(COM.ab/D.PXM).toFixed(2)+" M",r.izq?"start":"end",k,true,N);
  pon("your hour: "+(COM.ab/D.PXM).toFixed(2)+" M",
      COM.n+(COM.n==1?" pace":" paces"));return;}
 const [p0,p1]=comExtremos();
 pasBarra(p0,p1,k,R,N);

 const r=comLee();

 comChapa(p0,p1, r!=null?(s.modo=="abrir"?r.toFixed(2)+"' = "+r.toFixed(2)+" M"
   :r.toFixed(2)+" M"):"span held", k, N);
 pon(COM.sobre=="lat"?"on the scale":"span taken",
     r!=null?r.toFixed(2)+(s.modo=="abrir"?"' = "+r.toFixed(2)+" M":" M")
            :"carry it to the scale");}

function numAhora(){const s=S(), d=document.getElementById("nu");
 if(!d)return;
 d.innerHTML=`<input id="in" inputmode="decimal" placeholder="${s.ph||"0.0"}">`
  +`<span> ${s.un||""}</span> <button onclick="resp()">Answer</button>`;
 const i=document.getElementById("in");
 if(i){i.focus(); i.onkeydown=e=>{if(e.key=="Enter")resp();};}}
window.leePasos=()=>{const s=S();
 if(!COM.ab){
  fb(s.modo=="abrir"?"Open the dividers first: prick one point on the chart, "
   +"move, and prick again when the figure is right."
   :"Take the span first: prick one point, then the other.","no");return;}
 const v=comLee();
 if(v===null){
  fb("Now <b>carry it to the latitude scale</b>. Drag the dividers onto the graduated "
   +"margin up either side &mdash; a chart carries no numbers, the scale does.","no");return;}
 const r=s.ck(v);
 guarda("pasos",{modo:s.modo,v:+v.toFixed(3)},r.ok);

 if(r.ok&&s.luego=="num"){MED[s.id]={v:v}; fb(r.m,"si"); numAhora(); return;}
 if(r.ok){MED[s.id]={v:v}; fb(r.m,"si"); pasa();}
 else if(r.ok===null)fb(r.m,"");
 else falla(s,r.m);};

let EJ={i:0,v:null};
const EJB={};
function ejEntra(s){
 if(!EJB[s.id])EJB[s.id]=bolsaNueva();
 EJ={i:0,v:saca(EJB[s.id],s.vars)};}
const ejPasos=()=>EJ.v&&EJ.v.pasos?EJ.v.pasos:[];
const ejUlt=()=>EJ.i>=ejPasos().length-1;
window.ejSig=()=>{if(!ejUlt()){EJ.i++;ejPinta();}};
window.ejAtras=()=>{if(EJ.i>0){EJ.i--;ejPinta();}};
function ejPinta(){
 const P=ejPasos(), p=P[EJ.i]||{};
 const pon=(i,h)=>{const d=document.getElementById(i);if(d)d.innerHTML=h;};
 pon("ejn",`step ${EJ.i+1} of ${P.length}`);
 pon("ejl",p.li||"");
 pon("ejc",p.ca?`<div class="calc">${p.ca.join("<br>")}</div>`:"");
 const a=document.getElementById("ejA"); if(a)a.disabled=(EJ.i==0);
 const g=document.getElementById("ejS"); if(g)g.disabled=ejUlt();
 nav(ejUlt());
 capa();}
function ejDibuja(){
 const s=S(); if(s.t!="ejemplo"||s.piel!="gesto")return;
 const p=ejPasos()[EJ.i]; if(!p||!p.es)return;
 const e=p.es, k=k2(), R="#c8102e", N="#7a1020";
 if(e.esc){
  const y=e.y||1200, sp=e.esc*D.PXM;
  pasBarra([-62,y],[-62,y+sp],k,R,N);
  chapa(-62+34*k,y+sp/2,e.esc.toFixed(2)+"' = "+e.esc.toFixed(2)+" M","start",k,true,N);}
 if(e.leg){
  const a=[e.leg[0]-D.X0,e.leg[1]-D.Y0], b=[e.leg[2]-D.X0,e.leg[3]-D.Y0];
  const L=Math.hypot(b[0]-a[0],b[1]-a[1]), u=[(b[0]-a[0])/L,(b[1]-a[1])/L];
  el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:"#12202b","stroke-width":2*k,
   "stroke-opacity":.55,"stroke-dasharray":(12*k)+","+(8*k)},gG);
  const sp=(e.sp||0)*D.PXM;
  for(let i=0;i<(e.n||0);i++){
   const p0=[a[0]+u[0]*sp*i, a[1]+u[1]*sp*i], p1=[p0[0]+u[0]*sp, p0[1]+u[1]*sp];
   pasBarra(p0,p1,k,R,N);
   if(e.rot&&e.rot[i])
    chapa((p0[0]+p1[0])/2,(p0[1]+p1[1])/2-38*k,e.rot[i],"middle",k,true,N);}
