const HOJA=()=>{const m=px(MARGEN);
 return {x0:m,y0:m,x1:D.W-m,y1:D.H-m,an:D.W-2*m,al:D.H-2*m};};
function kQueCabe(k,arriba,abajo){
 const h=HOJA(), libre=h.al-(arriba||0)-(abajo||0);
 return px(2*k)<=libre ? k : Math.max(20,k*libre/px(2*k));}
function lineaAgua(k,arriba,abajo){
 const h=HOJA(), a=arriba||0, b=abajo||0;
 return h.y0+a+(h.al-a-b)/2+px(k);}

function lamina(titulo){
 const m=px(MARGEN), w=D.W-2*m, h=D.H-2*m;

 el("rect",{x:m+px(3),y:m+px(4),width:w,height:h,fill:"#00000055",rx:px(3)});

function agua(cx,base,ancho){

function dibujaTope(m,cx,tY,r,pa){
 const nodo=(t,at)=>el(t,at,pa);
 const cono=(yb,dir,col)=>nodo("path",{d: dir==="up"
   ? "M"+(cx-r)+","+yb+" L"+(cx+r)+","+yb+" L"+cx+","+(yb-2*r)+" Z"
   : "M"+(cx-r)+","+(yb-2*r)+" L"+(cx+r)+","+(yb-2*r)+" L"+cx+","+yb+" Z",
   fill:col||C.negro, stroke:col?C.negro:"none","stroke-width":px(1.2)});
 const t=m.tope;
 if(t==="conos"){ const hueco=px(1.6);
   cono(tY,m.conos[1]); cono(tY-2*r-hueco,m.conos[0]); }
 else if(t==="lata") nodo("rect",{x:cx-r*0.85,y:tY-2*r,width:r*1.7,height:2*r,
   fill:C.rojo,stroke:C.negro,"stroke-width":px(1.2)});
 else if(t==="cono") cono(tY,"up",C.verde);
 else if(t==="esferaR") nodo("circle",{cx:cx,cy:tY-r,r:r,fill:C.rojo,
   stroke:C.negro,"stroke-width":px(1.2)});
 else if(t==="dosEsferas"){ nodo("circle",{cx:cx,cy:tY-r,r:r*0.82,fill:C.negro});
   nodo("circle",{cx:cx,cy:tY-r*2.9,r:r*0.82,fill:C.negro}); }
 else if(t==="cruz"||t==="aspa"){
   const a=r*1.05, yc=tY-a, d=t==="aspa";
   const li=(x1,y1,x2,y2)=>nodo("line",{x1:x1,y1:y1,x2:x2,y2:y2,stroke:C.amarillo,
     "stroke-width":px(3.4),"stroke-linecap":"round"});
   if(d){ li(cx-a,yc-a,cx+a,yc+a); li(cx+a,yc-a,cx-a,yc+a); }
   else { li(cx-a,yc,cx+a,yc); li(cx,yc-a,cx,yc+a); }
 }}

function marca(m,cx,base,k,op){
 op=op||{};
 const g=el("g",{},gO), alto=px(k), ancho=px(k*0.55);
 const y0=base-alto;
 const nodo=(t,at)=>el(t,at,g);

 let topY=y0;
 if(m.cuerpo==="esfera"){
   const r=ancho*0.62, cy=base-r;
   const cid="cl"+m.id+Math.round(k);
   const cp=el("clipPath",{id:cid},g);
   el("circle",{cx:cx,cy:cy,r:r},cp);
   const n=m.franjas.length, w=2*r/n;
   m.franjas.forEach((c,i)=>nodo("rect",{x:cx-r+i*w,y:cy-r,width:w+px(.4),
     height:2*r,fill:C[c]||c,"clip-path":"url(#"+cid+")"}));
   nodo("circle",{cx:cx,cy:cy,r:r,fill:"none",stroke:C.negro,"stroke-width":px(1.6)});
   topY=cy-r;
 }else if(m.cuerpo==="pilarV"){
   const n=m.franjas.length, w=ancho/n;
   m.franjas.forEach((c,i)=>nodo("rect",{x:cx-ancho/2+i*w,y:y0,width:w+px(.4),
     height:alto,fill:C[c]||c}));
   nodo("rect",{x:cx-ancho/2,y:y0,width:ancho,height:alto,fill:"none",
     stroke:C.negro,"stroke-width":px(1.6)});
 }else{
   const anchoEn=yy=>m.cuerpo==="cono"
     ? ancho*(0.30+0.70*((yy-y0)/alto)) : ancho;
   let y=y0;
   m.bandas.forEach(b=>{
     const h=alto*b[1], aT=anchoEn(y), aB=anchoEn(y+h);
     nodo("path",{d:"M"+(cx-aT/2)+","+y+" L"+(cx+aT/2)+","+y+" L"+(cx+aB/2)+","+(y+h)
       +" L"+(cx-aB/2)+","+(y+h)+" Z", fill:C[b[0]]||b[0]});
     y+=h;});
   const aT=anchoEn(y0);
   nodo("path",{d:"M"+(cx-aT/2)+","+y0+" L"+(cx+aT/2)+","+y0+" L"+(cx+ancho/2)+","
     +base+" L"+(cx-ancho/2)+","+base+" Z", fill:"none",stroke:C.negro,
     "stroke-width":px(1.6)});
 }

 const mast=px(k*0.28), tY=topY-mast, r=px(k*0.18);
 nodo("line",{x1:cx,y1:topY,x2:cx,y2:tY,stroke:C.negro,"stroke-width":px(2.6)});
 dibujaTope(m,cx,tY,r,g);

 if(op.agua!==false) agua(cx,base,ancho*1.15);
 if(op.nombre) txt(cx,base+px(22),op.nombre,"middle",T.rot,C.suave,600,"ui",.6);
 if(op.codigo) txt(cx,base+px(38),m.codigo,"middle",T.rot,C.tinta,600,"mono",1.2);
 return g;}

const RUMBO={N:-90, E:0, S:90, W:180};
function sector(cx,cy,rad,card){
 const a0=(RUMBO[card]-45)*Math.PI/180, a1=(RUMBO[card]+45)*Math.PI/180;
 el("path",{d:"M"+cx+","+cy+" L"+(cx+rad*Math.cos(a0))+","+(cy+rad*Math.sin(a0))
   +" A"+rad+","+rad+" 0 0 1 "+(cx+rad*Math.cos(a1))+","+(cy+rad*Math.sin(a1))+" Z",
   fill:C.agua,"fill-opacity":.34,stroke:C.agua,"stroke-width":px(1.2)});}

function rosa(cx,cy,rad){
 el("circle",{cx:cx,cy:cy,r:rad,fill:"none",stroke:C.suave,"stroke-width":px(1)});
 [["N",-90],["E",0],["S",90],["W",180]].forEach(([l,a])=>{
   const t=a*Math.PI/180;
   txt(cx+(rad+px(11))*Math.cos(t), cy+(rad+px(11))*Math.sin(t)+px(4),
       l,"middle",T.rot,C.suave,600,"mono",1);});
 el("path",{d:"M"+cx+","+(cy-rad)+" L"+(cx-px(4))+","+(cy-rad+px(9))
   +" L"+(cx+px(4))+","+(cy-rad+px(9))+" Z",fill:C.suave});}

function obraEnmarca(s){
 lamina(s.lamina||"");

 const ids=s.marcas||MARCAS.map(m=>m.id);
 const n=ids.length, fila=Math.min(n,5), filas=Math.ceil(n/fila);
 const k=n<=2?110:n<=5?86:72;

 const sobre=px(k*2)+px(4), bajo=px(s.nombres?34:8), sep=px(56);
 const altoPieza=sobre+bajo;
 const bloque=filas*altoPieza+(filas-1)*sep;

 const _h=HOJA(), arriba=px(s.lamina?46:26), abajo=px(20);
 const y0=_h.y0+arriba+((_h.al-arriba-abajo)-bloque)/2+sobre;
 const dx=(D.W-px(2*MARGEN)-px(40))/fila;
 ids.forEach((id,i)=>{
   const m=marcaDe(id); if(!m)return;
   const cx=px(MARGEN)+px(20)+dx*(i%fila)+dx/2;
   const base=y0+(altoPieza+sep)*Math.floor(i/fila);
   marca(m,cx,base,k,{nombre:s.nombres?m.nombre:null});});

 if(s.rosa) rosa(D.W-px(96), px(MARGEN)+px(70), px(30));
 if(s.peligro){
   const cx=D.W/2, cy=D.H/2;
   el("circle",{cx:cx,cy:cy,r:px(17),fill:C.negro});
   txt(cx,cy+px(38),"the rock","middle",T.rot,C.suave,600,"ui",.6);}
 return null;}

function barco(cx,cy,k,rb,col){
 const g=el("g",{transform:"rotate("+(rb||0)+" "+cx+" "+cy+")"},gO);
 el("path",{d:"M"+cx+","+(cy-k)+" L"+(cx+k*0.42)+","+(cy-k*0.15)
   +" L"+(cx+k*0.34)+","+(cy+k*0.8)+" L"+(cx-k*0.34)+","+(cy+k*0.8)
   +" L"+(cx-k*0.42)+","+(cy-k*0.15)+" Z",
   fill:col||C.papel2,stroke:C.tinta,"stroke-width":px(1.6)},g);
 return g;}

let CU={ang:200};
function obraCuadrantes(s){
 lamina(s.lamina||"");

 const _h=HOJA(), _arr=px(46), _abj=px(44);
 const anillo=Math.min((_h.al-_arr-_abj)/2, _h.an*0.34);
 const rad=anillo/1.14;
 const m=marcaDe(s.marca||"card-N");
 const cy=_h.y0+_arr+anillo;
 const cx=_h.x0+((D.W-px(96)-px(46))-_h.x0)/2;

 CU.cx=cx; CU.cy=cy; CU.anillo=anillo;

 for(const c of ["N","E","S","W"]){
   const a0=(RUMBO[c]-45)*Math.PI/180, a1=(RUMBO[c]+45)*Math.PI/180;
   const bueno=(c===m.cardinal);
   el("path",{d:"M"+cx+","+cy+" L"+(cx+rad*Math.cos(a0))+","+(cy+rad*Math.sin(a0))
     +" A"+rad+","+rad+" 0 0 1 "+(cx+rad*Math.cos(a1))+","+(cy+rad*Math.sin(a1))+" Z",
     fill:bueno?C.agua:C.raya,"fill-opacity":bueno?.42:.14,
     stroke:bueno?C.agua:C.raya,"stroke-width":px(1.2)});}
 el("circle",{cx:cx,cy:cy,r:px(15),fill:C.negro});
 txt(cx,cy+px(34),"the rock","middle",T.rot,C.suave,600,"ui",.6);
 marca(m,cx+px(64),cy-px(6),80,{agua:false});
 rosa(D.W-px(96),px(MARGEN)+px(70),px(28));

 const t=CU.ang*Math.PI/180, bx=cx+anillo*Math.cos(t), by=cy+anillo*Math.sin(t);
 el("circle",{cx:cx,cy:cy,r:anillo,fill:"none",stroke:C.raya,
   "stroke-width":px(1),"stroke-dasharray":px(4)+" "+px(6)});
 const dent=Math.abs(((CU.ang-RUMBO[m.cardinal]+540)%360)-180)>135;
 barco(bx,by,px(20),CU.ang+90,dent?C.papel2:C.rojo);
 el("circle",{cx:bx,cy:by,r:px(30),fill:"transparent",class:"dial",
   "data-arrastra":"ang"});
 txt(cx,cy+anillo+px(26),dent?"in the clear water":"not in the clear water",
   "middle",T.lect,dent?C.verde:C.rojo,600,"serif");}

let SE={entrando:true};

const ORDEN_R=["N","E","S","W"];
function obraRecorre(s,i){
 const paso=s.tramos[i]||{}, todas=!!paso.todas;

 if(!s.tramos.some(t=>t.card)){ obraFamilia(s,paso,todas); return; }
 lamina(s.lamina||"");

 const _h=HOJA(), _arr=px(46), _abj=px(30);
 const rad=Math.min((_h.al-_arr-_abj)/2, _h.an*0.30);
 const cy=_h.y0+_arr+(_h.al-_arr-_abj)/2;
 const cx=_h.x0+((D.W-px(96)-px(46))-_h.x0)/2;
 for(const c of ORDEN_R){
   if(todas||c===paso.card){ sector(cx,cy,rad,c); continue; }
   const a0=(RUMBO[c]-45)*Math.PI/180, a1=(RUMBO[c]+45)*Math.PI/180;
   el("path",{d:"M"+cx+","+cy+" L"+(cx+rad*Math.cos(a0))+","+(cy+rad*Math.sin(a0))
     +" A"+rad+","+rad+" 0 0 1 "+(cx+rad*Math.cos(a1))+","+(cy+rad*Math.sin(a1))+" Z",
     fill:C.raya,"fill-opacity":.14,stroke:C.raya,"stroke-width":px(1.2)});}
 el("circle",{cx:cx,cy:cy,r:px(13),fill:C.negro});
 txt(cx,cy+px(30),"the rock","middle",T.rot,C.suave,600,"ui",.6);
 rosa(D.W-px(96),px(MARGEN)+px(70),px(28));

 if(todas){

   const r0=px(72);
   ORDEN_R.forEach(c=>{
     const m=marcaDe("card-"+c); if(!m)return;
     const t=RUMBO[c]*Math.PI/180;
     marca(m,cx+r0*Math.cos(t),cy+r0*Math.sin(t),42,{agua:false,nombre:m.nombre});});
 }else{
   const m=marcaDe("card-"+paso.card);
   if(m)marca(m,cx+px(64),cy-px(6),78,{agua:false,nombre:m.nombre});}}

function obraFamilia(s,paso,todas){
 lamina(s.lamina||"");
 const ids=todas
   ? (s.marcas||s.tramos.map(t=>t.marca).filter(Boolean))
   : [paso.marca];
 const n=ids.length, dx=(D.W-px(220))/Math.max(n,1);

 const kf=kQueCabe(n>1?120:170,px(40),px(46));
 const base=lineaAgua(kf,px(40),px(46));
 ids.forEach((id,k)=>{
   const m=marcaDe(id); if(!m)return;
   marca(m,px(110)+dx*k+dx/2,base,kf,{agua:false,nombre:m.nombre});});}

function obraSentido(s){
 lamina(s.lamina||"");
 const x0=px(MARGEN)+px(70), x1=D.W-px(MARGEN)-px(70);

 const _h=HOJA(), _kL=56, _sobre=px(2*_kL)+px(40), _bajo=px(86);
 const an=Math.min(px(96), (_h.al-px(46)-_sobre-_bajo)/2);
 const y=_h.y0+px(46)+(_h.al-px(46)-(2*an+_sobre+_bajo))/2+an+_sobre;
 el("rect",{x:x0,y:y-an,width:x1-x0,height:2*an,fill:C.agua,"fill-opacity":.20});
 for(const yy of [y-an,y+an])
   el("line",{x1:x0,y1:yy,x2:x1,y2:yy,stroke:C.raya,"stroke-width":px(1.5)});
 el("line",{x1:x0,y1:y,x2:x1,y2:y,stroke:C.raya,"stroke-width":px(1),
   "stroke-dasharray":px(6)+" "+px(8)});

 const fy=y-an-px(34);
 el("line",{x1:x0,y1:fy,x2:x1,y2:fy,stroke:C.magenta,"stroke-width":px(2.4)});
 el("path",{d:"M"+x1+","+fy+" L"+(x1-px(14))+","+(fy-px(7))
   +" L"+(x1-px(14))+","+(fy+px(7))+" Z",fill:C.magenta});
 txt((x0+x1)/2,fy-px(12),"direction of buoyage","middle",T.rot,C.magenta,600,"mono",1.4);

 const pares=3;
 for(let i=0;i<pares;i++){
   const x=x0+(x1-x0)*(i+1)/(pares+1);
   marca(marcaDe("lat-babor"),x,y-an+px(6),56,{agua:false});
   marca(marcaDe("lat-estribor"),x,y+an+px(6),56,{agua:false});}

 const bx=SE.entrando?x0+px(50):x1-px(50);
 barco(bx,y,px(26),SE.entrando?90:270,C.papel2);
 txt(bx,y+px(72),SE.entrando?"coming in":"going out","middle",T.dato,
   C.tinta,600,"ui",.4);

 const mx=D.W/2, my=D.H-px(MARGEN)-px(48);
 el("rect",{x:mx-px(110),y:my-px(26),width:px(220),height:px(52),rx:px(4),
   fill:C.papel2,stroke:C.raya,"stroke-width":px(1.4),class:"boton",

let PZ=[{"id": "0.S1", "tema": "What «pass it» actually means", "obra": "enmarca", "b": "Next", "h": "The mark is the instruction", "lamina": "two ways past. one of them touches", "nombres": false, "marcas": ["card-N"], "p": ["You know all twelve marks now, and <b>not one of them has told you what to do.</b>", "<b>This part is about the ten that tell you a side</b> — the isolated danger and the new danger are not here, because you do not pass those on a side: you go round them.", "A mark is not the danger, and it is not a warning in general. <b>It is an instruction, and it is exact</b>: there is a side you may pass and a side you may not.", "<em>This part is that one question, four times over. And it has a catch in it that catches nearly everybody — you will meet it in topic two.</em>"]}, {"id": "0.E1", "tema": "What «pass it» actually means", "obra": "ejemplo", "banco": "ej-0.E1", "lamina": "what it marks, and where the water is", "h": "Three questions, always the same three", "tramos": [{"p": "First: <b>what is it marking?</b> Something hard, or an edge, or nothing at all.", "ensena": {"conos": 1}}, {"p": "Second: <b>where is the water it is pointing at?</b> Every mark answers this, and it answers it the same way every time.", "ensena": {"conos": 1, "cuerpo": 1}}, {"p": "Third: <b>so which side do you go?</b> That one is not a fact about the mark — <b>it depends on you</b>, and that is the whole of this part.", "razon": "what · where the water is · which side <b>you</b> go", "ensena": {"conos": 1, "cuerpo": 1, "nombre": 1, "sector": 1}}]}, {"id": "1.S1", "tema": "The cardinal names the water · topic 1", "obra": "enmarca", "b": "Next", "h": "«North cardinal» does not mean «go north»", "lamina": "the water, not the direction", "rosa": true, "nombres": true, "marcas": ["card-N", "card-S"], "p": ["This is the mistake almost everyone makes first, so it is worth making it here where it is free.", "<b>A north cardinal does not mean «steer north».</b> It means <b>the clear water is north of it</b> — and if you are already north of it, you are in the clear and can go wherever you like.", "<em>The mark is named after the water. It is not named after your course.</em>"]}, {"id": "1.E1", "tema": "The cardinal names the water · topic 1", "obra": "ejemplo", "banco": "ej-1.E1", "lamina": "the clear quadrant", "h": "Put the water on your side", "tramos": [{"p": "Here is the mark, and here is the rock it is standing over.", "ensena": {"conos": 1, "cuerpo": 1}}, {"p": "<b>The clear water is the quarter the cones point to.</b> Not a line — a whole quarter of the compass.", "ensena": {"conos": 1, "cuerpo": 1, "sector": 1}}, {"p": "So you steer to be <b>in that quarter</b>. Do that, and the side the mark ends up on <b>falls out on its own</b> — you never have to remember it.", "razon": "get into the clear quarter &rarr; the side takes care of itself", "ensena": {"conos": 1, "cuerpo": 1, "sector": 1, "nombre": 1}}]}, {"id": "1.R1", "tema": "The cardinal names the water · topic 1", "obra": "recorre", "lamina": "the four quarters", "marcas": ["card-N", "card-E", "card-S", "card-W"], "h": "All four, and there is no fifth", "tramos": [{"card": "N", "p": "<b>North cardinal.</b> The clear water is the whole quarter to the <b>north</b> of it — from north-west round to north-east. <b>A quarter, not a line.</b>"}, {"card": "E", "p": "<b>East cardinal.</b> The same idea turned a quarter: the clear water is <b>east</b> of it, and the thing it is guarding is west."}, {"card": "S", "p": "<b>South cardinal.</b> Clear water to the <b>south</b> — and the cones say so too, both of them pointing down at it."}, {"card": "W", "p": "<b>West cardinal.</b> Clear water to the <b>west</b>. That is the fourth of them, and there is no fifth."}, {"todas": true, "p": "Four marks, four quarters, and between them they cover the whole compass. <b>Whichever one you meet, it is the same job</b>: find the quarter it is named after, and get into it.", "razon": "each one is named after the quarter where the water is clear"}]}, {"id": "1.J1", "tema": "The cardinal names the water · topic 1", "obra": "cuadrantes", "b": "Next", "marca": "card-N", "lamina": "take her round", "h": "Move the boat, not the mark", "p": ["<b>Drag the boat round.</b> Watch the verdict underneath change as she crosses into the clear quarter and out of it again.", "The quarter never moves. <b>You do.</b> That is why «which side» is not a fact you can memorise about a mark.", "<em>Nothing is scored here.</em>"]}, {"id": "1.P1", "tema": "The cardinal names the water · topic 1", "obra": "practica", "banco": "CUADRANTE", "h": "Steering that course, which side?"}, {"id": "2.S1", "tema": "Which way the channel runs · topic 2", "obra": "sentido", "b": "Next", "lamina": "the same buoy, two answers", "h": "The same buoy, two different answers", "p": ["Look at the red can in this channel. <b>Two boats are going to pass it today, and it is on opposite sides of each of them.</b>", "Nothing about the buoy changed. It did not move, it did not repaint itself. <b>What changed is the direction the boat is going.</b>", "<b>This is the only place in the whole course where one object means two different things depending on which way you are pointed</b>, and it is where most people come unstuck. <em>The fix is one sentence, and it is on the next screen.</em>"]}, {"id": "2.E1", "tema": "Which way the channel runs · topic 2", "obra": "ejemplo", "banco": "ej-2.E1", "lamina": "the direction of buoyage", "h": "Somebody already decided which way is «in»", "tramos": [{"p": "A channel has <b>a direction printed on it</b>. Not a suggestion — a decision somebody made and drew on the chart, with an arrow.", "ensena": {"conos": 1}}, {"p": "It is called <b>the direction of buoyage</b>, and it usually runs the way you would go coming in from seaward. <b>But «usually» is not a rule</b>: some channels lead to no harbour at all. <b>Read the chart, do not guess.</b>", "ensena": {"conos": 1, "cuerpo": 1}}, {"p": "Now the sentence. <b>Going the way the arrow points, red is on your port hand and green on your starboard.</b> That is the whole rule, and it is the only thing here worth learning by heart. <b>And going the other way? Everything swaps</b> — because you swapped. <em>The marks are exactly where they were.</em>", "razon": "with the arrow &nbsp;&rarr;&nbsp; <b>red to port</b>, green to starboard<br>against the arrow &nbsp;&rarr;&nbsp; red to <b>starboard</b>", "ensena": {"conos": 1, "cuerpo": 1, "nombre": 1}}]}, {"id": "2.R1", "tema": "Which way the channel runs · topic 2", "obra": "recorre", "lamina": "one edge, and the other", "h": "Two marks, one channel", "marcas": ["lat-babor", "lat-estribor"], "tramos": [{"marca": "lat-babor", "p": "<b>The port-hand mark.</b> A red can, and a red can on top of it — <b>flat, both of them</b>. Going in with the arrow, this one goes down your port side."}, {"marca": "lat-estribor", "p": "<b>The starboard-hand mark.</b> A green cone, and a green cone on top — <b>pointed, both of them</b>. Going in with the arrow, this one goes down your starboard side."}, {"todas": true, "p": "They come in <b>pairs</b>, one on each edge, and you steer between them. <b>The shape says what the colour says</b> — which is why the pair still works at dusk, when red and green have gone grey.", "razon": "flat is port &nbsp;·&nbsp; pointed is starboard &nbsp;·&nbsp; going with the arrow"}]}, {"id": "2.J1", "tema": "Which way the channel runs · topic 2", "obra": "sentido", "b": "Next", "lamina": "turn her round", "h": "Turn her round and look again", "p": ["<b>Turn the boat round.</b> The buoys stay exactly where they are — watch which side of her they end up on.", "If you ever find yourself trying to remember <b>«red on the left»</b>, stop: <b>left of what?</b> That is the question the arrow answers.", "<em>Nothing is scored here. Turn her a few times.</em>"]}, {"id": "2.P1", "tema": "Which way the channel runs · topic 2", "obra": "practica", "banco": "SENTIDO", "h": "Coming in. Which side?"}, {"id": "2.P2", "tema": "Which way the channel runs · topic 2", "obra": "practica", "banco": "SENTIDO", "h": "And on the way out"}, {"id": "3.S1", "tema": "The channel itself · topic 3", "obra": "canal", "b": "Next", "lamina": "Stennick Haven", "h": "A real one, on the chart", "p": ["This is the channel into Stennick Haven, off the chart you will use for the rest of the course. <b>Everything you have practised is in it.</b>", "The safe water mark at the seaward end, then the pairs: <b>No.1, No.2, No.3, No.4</b>. And the direction of buoyage printed across it.", "<em>It is enlarged so the marks are far enough apart to steer between. It is not to scale, and the frame says so.</em>"]}, {"id": "3.E1", "tema": "The channel itself · topic 3", "obra": "ejemplo", "banco": "ej-3.E1", "lamina": "in from seaward", "h": "In from seaward, mark by mark", "tramos": [{"p": "Past the <b>safe water mark</b> at the door — <em>topic 5 comes back to that one</em> — the channel proper begins, and it is marked in <b>pairs</b>. This is the starboard-hand one.", "ensena": {"conos": 1, "cuerpo": 1}}, {"p": "And the rule you already have: with the arrow, <b>red to port, green to starboard</b>. So coming in, this one goes down your starboard side — and it is <b>No.1</b> or <b>No.3</b> on the chart. <b>And the collision rules are still running:</b> keep to the starboard side of the channel — <b>now you know which side that is.</b>", "razon": "the green side, coming in, is the starboard side of the channel", "ensena": {"conos": 1, "cuerpo": 1, "nombre": 1}}]}, {"id": "3.P1", "tema": "The channel itself · topic 3", "obra": "practica", "banco": "CANAL", "h": "On this channel, which side?"}, {"id": "4.S1", "tema": "When the channel splits · topic 4", "obra": "enmarca", "b": "Next", "h": "Two ways in. One of them is the one they mean", "lamina": "the channel splits", "nombres": true, "marcas": ["pref-estribor", "pref-babor"], "p": ["Sometimes a channel forks, an function bolsa(lista,semilla){
 let s=semilla||1, idx=[], i=0;
 const rnd=()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return (s>>>0)/4294967296;};
 const barajar=()=>{idx=lista.map((_,k)=>k);
   for(let j=idx.length-1;j>0;j--){const t=Math.floor(rnd()*(j+1));
     [idx[j],idx[t]]=[idx[t],idx[j]];} i=0;};
 barajar();
 return {saca:()=>{if(i>=idx.length)barajar(); return lista[idx[i++]];}};}
const BOLSAS={};

function bancoDe(s){
 const b=BANCOS[s.banco]||[];
 if(!b.some(q=>q.usos))return b;
 const mio=b.filter(q=>q.usos&&q.usos.indexOf(s.id)>=0);

 if(!mio.length)throw new Error(
   s.id+" saca de "+s.banco+" y ninguna de sus preguntas la nombra en `usos`");
 return mio;}

const _semilla=id=>AZAR+Array.prototype.reduce.call(id,(a,c)=>a+c.charCodeAt(0),0);
function sacaDe(s){
 if(!BOLSAS[s.id])BOLSAS[s.id]=bolsa(bancoDe(s),_semilla(s.id));
 return BOLSAS[s.id].saca();}
window.bolsaDe=s=>BOLSAS[s.id];
window.bancoDe=bancoDe;

   +'<span class="prl">'+Math.min(PR.hecho?PR.n:PR.n+1,PR.meta)+" of "+PR.meta+"</span>";
 p.appendChild(nav);
 nav.querySelector("#atras").onclick=()=>vaA(iP-1);
 const o=nav.querySelector("#otra"); if(o)o.onclick=()=>{PR.res="";prNuevo();};

 const sh=nav.querySelector("#show"); if(sh)sh.onclick=()=>muestra(s);
 const sk=nav.querySelector("#salta"); if(sk)sk.onclick=()=>salta(s);}

function salta(s){

 LOG.push({id:s.id,q:q.id,k:k,bien:bien});
 document.getElementById("fLog").textContent=LOG.length+" answers logged";

 if(bien){ PR.hecho=true; PR.n++;
   PR.res='<div class="res si"><b>Yes.</b> '+q.porque+"</div>";

   if(PR.fallos&&PR.meta===2){PR.meta=3;
     PR.res+='<div class="res">Two was the plan; the third is here because you '
       +"slipped, and it goes away as soon as you do not.</div>";}
 }else{ PR.fallos++;
   PR.res='<div class="res no"><b>Not that one.</b> '+(q.mal&&q.mal[k]||"")+"</div>";
   if(PR.fallos>=1&&q.pista)PR.res+='<div class="pista">'+q.pista+"</div>";}
 pinta();}

function pinta(){

 else if(s.obra==="cuadrantes")obraCuadrantes(s);
 else if(s.obra==="sentido")obraSentido(s);
 else if(s.obra==="canal")obraCanal(s);
 else if(s.obra==="enmarca")obraEnmarca(s);
 else if(s.obra==="ejemplo")obraEjemplo(s,EJ.i);
 else if(s.obra==="recorre")obraRecorre(s,EJ.i);

 barra(); panel();}

"use strict";

const ritmoFase = (t, per) => ((t % per) + per) % per;

function ritmoTramo(on, per, t){
 const f = ritmoFase(t, per);
 for(let i=0;i<on.length;i++) if(f >= on[i][0] && f < on[i][1]) return i;
 return -1;
}

function ritmoEncendida(on, per, t){ return ritmoTramo(on, per, t) >= 0; }

function ritmoMotor(pinta){
 const M = {t:0, ref:0, raf:null, on:null, per:10};
 M.luz = (on, per) => { M.on = on || null; M.per = per || 10; };
 M.paso = now => {
  M.t = (now - M.ref) / 1000;
  if(M.on) pinta(ritmoEncendida(M.on, M.per, M.t), M.t);
  M.raf = requestAnimationFrame(M.paso);
 };
 M.arranca = () => {
  if(M.raf != null || typeof requestAnimationFrame === "undefined") return;
  M.ref = performance.now() - M.t * 1000;
  M.raf = requestAnimationFrame(M.paso);
 };
 M.para = () => {
  if(M.raf == null) return;
  cancelAnimationFrame(M.raf); M.raf = null;
 };
 M.anda = () => M.raf != null;
 return M;
}

"use strict";
const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};

const POR_SESION=10;

"use strict";

const FC = {on:false, modo:null, ses:null, i:0, vuelta:false, primera:null, desde:0,

function fcRitmoPara(){
 if(FC.rit){ FC.rit.para(); FC.rit = null; }
 FC.luz = null;
 if(typeof ritmoPara === "function") ritmoPara();
}
const FC_CLAVE = "baliz.cards", FC_V = 1;

function fcAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

const _objeto = o => !!o && typeof o === "object" && !Array.isArray(o);

function fcLee(){
 const A = fcAlmacen();
 if(A) try{
  const o = JSON.parse(A.getItem(FC_CLAVE) || "null");

  if(_objeto(o) && o.v === FC_V && _objeto(o.cartas)){

   const limpio = {};
   for(const k in o.cartas){
    const c = o.cartas[k];
    if(!_objeto(c)) continue;
    const peso = Number(c.peso);
    limpio[k] = {ok: Number(c.ok) || 0, mal: Number(c.mal) || 0,
                 peso: (isFinite(peso) && peso >= 1) ? Math.min(peso, 3) : 1};
   }
   return {v: FC_V, cartas: limpio};
  }
 }catch(e){}
 return {v:FC_V, cartas:{}};
}
function fcGuarda(o){
 const A = fcAlmacen();
 if(A) try{ A.setItem(FC_CLAVE, JSON.stringify(o)); }catch(e){}
}
const fcPeso = id => { const c = fcLee().cartas[id]; return (c && c.peso) || 1; };

function fcAnota(id, bien){
 const o = fcLee(), c = o.cartas[id] || {ok:0, mal:0, peso:1};
 if(bien){ c.ok++; c.peso = Math.max(1, c.peso - 1); }
 else    { c.mal++; c.peso = 3; }
 o.cartas[id] = c; fcGuarda(o);
}

let FCR = ((typeof AZAR === "number" ? AZAR : 1) >>> 0) || 1;
function fcAzar(){ FCR ^= FCR<<13; FCR >>>= 0; FCR ^= FCR>>>17; FCR ^= FCR<<5;
 FCR >>>= 0; return FCR / 4294967296; }

const fcModo = id => CARTAS_MODOS.filter(m => m.id === id)[0];
const fcDelModo = id => CARTAS.filter(c => c.modo === id);

const fcAbierto = id => vistoEmpezada(fcModo(id).requiere);

function fcReparte(modo, n){
 const pool = fcDelModo(modo).slice(), out = [];
 while(out.length < n && pool.length){
  let tot = 0; for(const c of pool) tot += fcPeso(c.id);
  let r = fcAzar() * tot, k = 0;
  while(k < pool.length - 1 && (r -= fcPeso(pool[k].id)) > 0) k++;
  out.push(pool.splice(k, 1)[0].id);
 }
 return out;
}

function fcEmpieza(modo){
 FC.modo = modo; FC.ses = fcReparte(modo, POR_SESION);
 FC.i = 0; FC.vuelta = false; FC.primera = {}; FC.repes = {};
 fcRitmoPara(); pinta();
}

const fcCarta = () => CARTAS.filter(c => c.id === FC.ses[FC.i])[0];
const fcFin = () => !!FC.ses && FC.i >= FC.ses.length;

const FC_VUELTAS = 1;

function fcJuzga(bien){
 const id = FC.ses[FC.i];
 if(!(id in FC.primera)) FC.primera[id] = bien;
 fcAnota(id, bien);
 FC.repes = FC.repes || {};
 if(!bien && (FC.repes[id] || 0) < FC_VUELTAS && FC.ses.indexOf(id, FC.i + 1) < 0){
  FC.repes[id] = (FC.repes[id] || 0) + 1;
  FC.ses.splice(Math.min(FC.i + 4, FC.ses.length), 0, id);
 }
 FC.i++; FC.vuelta = false; fcRitmoPara(); pinta();
}

window.fcAbre = () => { FC.on = true; FC.desde = iP; FC.modo = null; FC.ses = null;
 fcRitmoPara(); pinta(); };
window.fcCierra = () => { FC.on = false; fcRitmoPara(); vaA(FC.desde); };

function fcRejilla(ids, titulo){
 fcRitmoPara();
 lamina(titulo || "");
 const n = ids.length; if(!n) return;
 const fila = Math.min(n, 6), filas = Math.ceil(n / fila);
 const k0 = n <= 3 ? 96 : n <= 6 ? 74 : 60;
 const arriba = px(46), abajo = px(30);
 const k = kQueCabe(k0 * filas, arriba, abajo) / filas;
 const alto = px(2 * k) + px(30), sep = px(20);
 const bloque = filas * alto + (filas - 1) * sep;
 const h = HOJA();
 const y0 = h.y0 + arriba + ((h.al - arriba - abajo) - bloque) / 2 + px(2 * k);
 const dx = (D.W - px(2 * MARGEN) - px(30)) / fila;
 ids.forEach((id, i) => {
  const m = marcaDe(id); if(!m) return;
  marca(m, px(MARGEN) + px(15) + dx * (i % fila) + dx / 2,
        y0 + (alto + sep) * Math.floor(i / fila), k,
        {agua:false, nombre:m.corto});
 });
}

function fcLuz(cx, cy, r, rt){
 const halo = el("circle", {cx:cx, cy:cy, r:r*2.4, fill:rt.hex, "fill-opacity":0});
 const lam  = el("circle", {cx:cx, cy:cy, r:r, fill:LUZ_APAGADA,
                            stroke:C.raya, "stroke-width":px(1.4)});
 FC.luz = {on:rt.on, per:rt.per, cols:rt.cols, lam:lam, halo:halo};
 FC.rit = ritmoMotor((_, t) => fcPinta(t));
 FC.rit.luz(rt.on, rt.per);
 FC.rit.arranca();
}

function fcPinta(t){
 const L = FC.luz; if(!L) return;
 const k = ritmoTramo(L.on, L.per, t);
 L.lam.setAttribute("fill", k < 0 ? LUZ_APAGADA : L.cols[k]);
 L.halo.setAttribute("fill-opacity", k < 0 ? 0 : .30);
 if(k >= 0) L.halo.setAttribute("fill", L.cols[k]);
}

function fcLienzo(){
 if(!FC.modo || fcFin()){
  const ids = fcFin()
   ? FC.ses.filter((id,i,a) => a.indexOf(id)===i && FC.primera[id]===false)
           .map(id => CARTAS.filter(c=>c.id===id)[0].marca)
   : CARTAS_ORDEN;
  fcRejilla(ids, fcFin() ? "the ones you missed" : "the deck");
  return;
 }

 lamina("");
 const c = fcCarta(); if(!c) return;
 const rt = c.ritmo;

 if(rt && !c.marca){
  const h = HOJA();
  el("rect", {x:h.x0, y:h.y0, width:h.an, height:h.al, rx:px(3), fill:"#08161D"});
  fcLuz(D.W / 2, h.y0 + h.al * 0.46, px(26), rt);
  txt(D.W / 2, h.y1 - px(16), "watch one whole cycle", "middle",
      T.rot, "#4E6B78", 600, "ui", .8);
  return;
 }

 const m = marcaDe(c.marca); if(!m) return;

 const alto = rt ? px(34) : 0;
 const k = kQueCabe(230, px(24) + alto, px(40));
 const base = lineaAgua(k, px(24) + alto, px(40));
 marca(m, D.W / 2, base, k, {agua:false});
 if(rt) fcLuz(D.W / 2, base - px(2 * k) - px(16), px(11), rt);
}

function fcPanel(p){

 hd.innerHTML = "<h3>Flashcards</h3>";
 p.appendChild(hd);

 p.appendChild(nav);

}

function fcElector(p){
 p.insertAdjacentHTML("beforeend",
  "<p>Twelve marks, four ways. <b>Pick what you want to practise</b> — they are "
  + "different things to remember, so they are never mixed in one run.</p>"
  + "<p><em>Shape and rhythm are two separate memories. Mixing them trains both "
  + "worse: you answer with whichever comes first and the other never gets its "
  + "turn. <b>The whole buoy</b> is the last step, not the first.</em></p>");

 CARTAS_MODOS.forEach(md => {

  const b = document.createElement("button");

  ops.appendChild(b);

 const nav = document.createElement("div"); nav.className = "nav";
 nav.innerHTML = '<button class="sec" id="fcSal">Back to the screens</button>';

 nav.querySelector("#fcSal").onclick = window.fcCierra;
}

function fcRecuento(p){
 const vistas = FC.ses.filter((id,i,a) => a.indexOf(id) === i);
 const bien = vistas.filter(id => FC.primera[id]).length;
 const mal = vistas.filter(id => FC.primera[id] === false);
 p.insertAdjacentHTML("beforeend",
  '<div class="res ' + (mal.length ? "" : "si") + '"><b>' + bien + " of "

  + (mal.length

       + "<p>" + mal.map(id => CARTAS.filter(c=>c.id===id)[0].detras.nombre)
