"use strict";
const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

let RND = 1;

window.azarSemilla = n => {
 RND = (n >>> 0) || 1;
 for(let k = 0; k < 8; k++) azar();
};
function azar(){
 RND ^= RND << 13; RND >>>= 0;
 RND ^= RND >>> 17;
 RND ^= RND << 5;  RND >>>= 0;
 return RND / 4294967296;
}
function baraja(a){
 const b = a.slice();
 for(let i = b.length - 1; i > 0; i--){
  const j = Math.floor(azar() * (i + 1));
  const t = b[i]; b[i] = b[j]; b[j] = t;
 }
 return b;
}
azarSemilla(Date.now());

function bolsaNueva(){ return {i:[], ultima:null}; }
function saca(bolsa, banco){

 if(bolsa.n!==banco.length){ bolsa.i=[]; bolsa.n=banco.length; }
 if(!bolsa.i.length){
  bolsa.i = baraja(banco.map((x, k) => k));
  if(bolsa.i.length > 1 && banco[bolsa.i[bolsa.i.length - 1]].id === bolsa.ultima){
   const t = bolsa.i[bolsa.i.length - 1];
   bolsa.i[bolsa.i.length - 1] = bolsa.i[0]; bolsa.i[0] = t;
  }
 }
 const x = banco[bolsa.i.pop()];
 bolsa.ultima = x.id;
 return x;
}

   if(/^0+$/.test(z))return "0";
   const m=z.match(/^(\d{1,2})([wWeE])$/);
   return m ? (+m[1])+m[2].toUpperCase() : null;},
  mal:"<b>Degrees and a letter</b>, like <b>0W</b> \u2014 or just <b>0</b> if her "
     +"compass is telling the truth on that heading.",
  bien:q=>devTxt(q.dev).replace("\u00b0",""),
  eco:v=>String(v).replace(/(\d+)/,"$1\u00b0")},

 eleccion:{
  eg:"", cu:"pick one",
  norma:v=>(v==="true"||v==="magnetic"||v==="compass"
            ||v==="olvido-var"||v==="var-reves"
            ||v==="olvido-dev"||v==="dev-reves") ? v : null,
  mal:"Pick one of the three.",
  bien:q=>q.n,
  eco:v=>v}};
const forma=s=>FORMAS[(s&&s.forma)||"variacion"];
const prBien=(q,s)=>forma(s||S()).bien(q,s||S());

const varAnos=q=>q.hoy-q.a;
const varDeriva=q=>(q.dirD=="E"?-1:1)*varAnos(q)*q.tasa/60;
const varHoy=q=>q.w+varDeriva(q);
const varTxt=v=>Math.abs(Math.round(v))+"\u00b0"+(v>0?"W":"E");
const varImpreso=q=>varTxt(q.w)+" "+q.a+" ("+q.tasa+"\u2032"+q.dirD+")";

const convM=q=>g360(q.t+q.v);
const convDe=(q,s)=>(s&&s.sentido=="arriba") ? convM(q) : q.t;
const convA =(q,s)=>(s&&s.sentido=="arriba") ? q.t : convM(q);
const convPaso=(q,s)=>(s&&s.sentido=="arriba") ? -q.v : q.v;
const varLetra=v=>Math.abs(v)+"\u00b0"+(v>0?"W":"E");

const convCruza=(q,s)=>{const d=convDe(q,s)+convPaso(q,s); return !(0<=d&&d<360);};

const apMag=q=>g360(q.t+q.v);
const apAguja=q=>g360(apMag(q)+devDe(apMag(q)));
const apDe=(q,s)=>(s&&s.sentido=="arriba") ? apAguja(q) : q.t;
const apA =(q,s)=>(s&&s.sentido=="arriba") ? q.t : apAguja(q);

function apFirma(q,s,v){

 if(!q||q.t===undefined||q.v===undefined)return null;
 const bien=apA(q,s), d=devDe(apMag(q));
 const dif=Math.min(g360(v-bien), g360(bien-v));
 if(dif===0)return null;
 if(dif===Math.abs(q.v))
  return "That is <b>the variation, missing</b> \u2014 you went from the chart "
   +"straight into her card.";
 if(dif===Math.abs(2*q.v))
  return "That is <b>twice the variation</b>, which is what applying it the wrong "
   +"way costs: once for not adding it and once for taking it off.";
 if(d&&dif===Math.abs(d))
  return "That is <b>her deviation, missing</b> \u2014 you stopped at magnetic.";
 if(d&&dif===Math.abs(2*d))
  return "That is <b>twice her deviation</b>: you applied it the wrong way round.";
 return null;}

window.compruebo=dado=>{

 anota(v,true);
 PRFB="";

   el("rect",{x:lx-px(9),y:y-px(15),width:anC-px(16),height:px(52),rx:px(R.caja),
    fill:COL.magenta,"fill-opacity":.10,stroke:COL.magenta,
    "stroke-width":px(GR.filete),"stroke-opacity":.5});
  rot(lx,y,q[0],"start",COL.suave);
  txt(lx,y+px(28),q[1],"start",TAM.lee,q[2],600);});

 const centra=(s2,y)=>{
  const an=px(anchoTxt(s2,TAM.rot,1.1));
  const x=Math.min(Math.max(cxR, HOJA.x0+an/2+px(4)), HOJA.x1-an/2-px(4));
  rot(x,y,s2,"middle",COL.magenta);};
 centra("outer \u00b7 true north",HOJA.y0+px(20));
 centra("inner \u00b7 magnetic north",HOJA.y1-px(12));}

function pinta(){
 svg.setAttribute("viewBox","0 0 "+D.W+" "+D.H);
 svg.setAttribute("preserveAspectRatio","xMidYMid meet");
 ESC=esc();
 while(svg.firstChild)svg.removeChild(svg.firstChild);
 gO=el("g",{},svg);
 maqueta();

 const s=S();
 if(s&&s.obra=="patrones")dosPatrones();
 else if(s&&s.obra=="rosa")rosa();
 else if(s&&s.obra=="nortes")tresNortes();

 else if(s&&s.obra=="signo")tresNortes();

 else if(s&&s.obra=="carta")tresNortes();

 else if(s&&s.obra=="apila")tresNortes();
 else if(s&&s.obra=="demora")tresNortes();
 else if(s&&s.obra=="enfila")enfilacion();
 else if(s&&s.obra=="practica")practica();
 else if(s&&s.obra=="fecha"){RESALTA=true; rosa(); RESALTA=false;}
 else if(s&&s.obra=="escribe"
         &&(s.lienzo=="signo"||s.lienzo=="carta"||s.lienzo=="apila"
            ||s.lienzo=="demora"))tresNortes();
 else if(s&&s.obra=="escribe"){

  const q=PR2.q;
  if(q&&q.w!==undefined){FORZADA={w:q.w, a:q.a, tasa:q.tasa, txt:varTxt(q.w),
                 pieza:varTxt(q.w), dirD:q.dirD};
        RESALTA=true; rosa(); RESALTA=false; FORZADA=null;}}
 else if(s&&s.obra=="anyo"){
  FORZADA=ROSAS_ANO[iA]; rosa(); FORZADA=null;
  cuentaAno(PASOSA[EJ.i].hasta);}
 else if(!s)rosa();
 marco();}

let TIRA=false;
const seArrastra=()=>{const s=S();
 if(!s)return false;

 if(s.obra=="practica")return !PR.hecho;

 if(s.obra=="escribe")return false;
 if(!(s.obra=="nortes"||s.obra=="signo"||s.obra=="carta"||s.obra=="apila"
      ||s.obra=="demora"))return false;
 const P=PASO(); return !!(P&&P.tira);};
function aRumbo(e){
 const r=svg.getBoundingClientRect(), s=esc();
 const x=(e.clientX-r.left-(r.width-D.W*s)/2)/s;
 const y=(e.clientY-r.top-(r.height-D.H*s)/2)/s;
 return y<COSTURA ? g360(Math.atan2(x-CENTRO.x, CENTRO.y-y)*180/Math.PI)
                  : g360(aDe(x));}
function mueveRumbo(e){ RUMBO=Math.round(aRumbo(e)); pinta(); }
svg.addEventListener("pointerdown",e=>{ if(!seArrastra())return;
 TIRA=true; e.preventDefault&&e.preventDefault(); mueveRumbo(e);});
svg.addEventListener("pointermove",e=>{ if(TIRA&&seArrastra())mueveRumbo(e);});
svg.addEventListener("pointerup",()=>{TIRA=false;});
svg.addEventListener("pointercancel",()=>{TIRA=false;});

const PALABRA=["no","one","two","three","four","five","six","seven","eight","nine",
 "ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen",
 "eighteen","nineteen","twenty","twenty-one","twenty-two","twenty-three",
 "twenty-four"];
const TOT=24;

function prog(){
 marcoChrome();const d=document.getElementById("prog"); if(!d)return;
 d.innerHTML="";

 for(let i=0;i<TOT;i++){const b=document.createElement("i");
  b.className=i<iP?"done":i==iP?"on":"";
  if(i<PZ.length){
  b.title="Screen "+(i+1)+" of "+TOT+" \u00b7 "+PZ[i].h;
                   b.onclick=()=>{guardaEst(); iP=i; dibuja();}; }
  else { b.title="not built yet"; b.style.opacity=".35"; }
  d.appendChild(b);}
 const h=document.getElementById("hTit");
 if(h)h.textContent = iP<PZ.length
  ? "Screen "+(iP+1)+" of "+TOT
  : "Screen "+PZ.length+" of "+TOT+" built";}

window.atras=()=>{ if(iP<=0)return; guardaEst(); iP--; dibuja(); };
function navHTML(hayAtras,etq){
 return '<div id="nav">'
  +(hayAtras?'<button class="sec" id="btA" onclick="atras()">Back</button>':'')
  +'<button id="btV">'+etq+'</button></div>';}

window.ejSig=()=>{ const s=S();
 if(s&&s.pasos&&EJ.i<s.pasos.length-1){EJ.i++; dibuja();} };
window.ejAtras=()=>{ if(EJ.i>0){EJ.i--; dibuja();} };

function dibuja(){ guardaDonde(iP);
 if(iP>=PZ.length){fin(); return;}

 if(iP!==DONDE){ DONDE=iP; ponEst(); }
 const s=S();

 const esEj=!!(s.pasos&&s.pasos.length);
 const nP=esEj?s.pasos.length:0;
 const ult=esEj&&EJ.i==nP-1;
 const esPr=(s.obra=="practica"), esEs=(s.obra=="escribe");

 pane().innerHTML='<div class="hd"><div class="prl">'+s.tema+'</div>'
  +(seContesta(s)?'<a class="skip" onclick="salta()">Skip</a>':'')+'</div>'
  +'<h2>'+s.h+'</h2>'
  +(esEj
     ? '<div class="prl">Step '+(EJ.i+1)+' of '+nP+'</div>'
       +'<h3>'+s.pasos[EJ.i].h+'</h3><p>'+s.pasos[EJ.i].p+'</p>'
     : s.p.map(q=>"<p>"+q+"</p>").join(""))
  +(s.obra=="anyo"&&EJ.i==PASOSA.length-1
     ? '<p><button class="sec" onclick="otraCuenta()">Another rose, another sum'
       +'</button></p>' : '')
  +(s.obra=="signo"&&esEj&&EJ.i==nP-1
     ? '<p><button class="sec" onclick="otraCarta()">Another chart</button>'
       +'<span class="prl"> &nbsp;twenty of them &mdash; westerly, easterly, and '
       +'some that swing past north</span>'
       +'</p>' : '')
  +(s.obra=="rosa"
     ? '<p><button class="sec" onclick="otraRosa()">Another chart’s rose</button>'
       +'<span class="prl"> &nbsp;the drawing follows the legend</span></p>' : '')
  +(esPr ? cajaP1() : '')
  +(esEs ? cajaEscribe(s) : '')
  +(esEj
     ? '<div id="nav"><button class="sec" id="ejA" onclick="ejAtras()"'
       +(EJ.i?'':' disabled')+'>&#8592; Back a step</button>'
       +'<button id="btV">'+(ult?s.b:"Next step")+'</button></div>'
     : esPr
     ? '<div id="nav">'+(iP>0?'<button class="sec" id="btA" onclick="atras()">Back'
       +'</button>':'')
       +(PR.hecho?'<button id="btV">'+s.b+'</button>'
                 :'<button id="btV">Check</button>')+'</div>'
     : esEs
     ? '<div id="nav">'+(iP>0?'<button class="sec" id="btA" onclick="atras()">Back'
       +'</button>':'')
       +(PR2.hecho ? '<button id="btV">'+s.b+'</button>'
        : PR2.esp  ? '<button id="btV">Next one &#8594;</button>'
                   : '<button id="btV">Check</button>')+'</div>'
     : navHTML(iP>0, s.b));

 document.getElementById("btV").onclick=(esEj&&!ult)
   ? ()=>{ EJ.i++; dibuja(); }
   : (esPr&&!PR.hecho)
   ? ()=>{ compruebaP1(); }
   : (esEs&&!PR2.hecho)
   ? (PR2.esp ? ()=>{ prSigue(); } : ()=>{ compruebo(); })

   : ()=>{ guardaEst(); iP++; dibuja(); };
 prog(); pinta();}

function cajaP1(){
 if(PR.saltada)
  return '<div class="res"><b>Skipped.</b> You can come back to it from the bar at '
   +'the top whenever you want.</div>';
 if(PR.hecho)
  return '<div class="res si"><b>090 true.</b> And without being asked, you have '
   +'also put her on <b>096 magnetic</b> and <b>101 on her own compass</b>. One '
   +'hand, three answers, because there was only ever one bow.</div>';
 let h='<p><b class="q">Put her on 090 true.</b></p>';
 if(PR.fallos==1)
  h+='<div class="res no">Not there yet \u2014 the <b>true</b> row is the one to '
    +'aim at. Ignore the other two while you turn: they look after themselves.</div>';
 if(PR.fallos>=2)
  h+='<div class="res no">Still short. <span class="pista">The top reading is the '
    +'true one. Swing her until it says exactly <b>090</b>; the handle moves a '
    +'degree at a time.</span></div>';
 return h;}

function fin(){

 pane().innerHTML='<div class="prl">Directions</div>'
  +'<h2>Two numbers, one bow</h2>'
  +'<p>Two skippers pointed at the same tower and wrote down different numbers, and '
  +'neither of them was wrong. <b>Now you know why:</b> one counted from the north '
  +'the chart is drawn to, the other from the north his compass looks at. The rose '
  +'says how far apart those two are, and when that was measured.</p>'
  +'<p>Everything that follows is that one idea, used: <b>the boat does not turn '
  +'&mdash; only the north you are counting from.</b></p>'

  +(PZ.length<TOT
     ? '<p class="prl">This part is still being built: '+PALABRA[PZ.length]
       +' of its twenty-four screens are ready.</p>'
     : '<p class="prl">All twenty-four screens of this part are done.</p>')

  +`<div class="calc"><b>Next: Speed, distance and time.</b><br> An hour is a length. Open it, measure with it and walk it — then the three sums.</div>`
  +navHTML(true,PZ.length<TOT?"Back to the rose":"Back to the last screen");
 document.getElementById("btV").onclick=()=>{ iP=PZ.length-1; dibuja(); };
 prog();
 document.getElementById("fLog").textContent=(PZ.length<TOT
   ? PZ.length+" of "+TOT+" screens built"
   : "all "+TOT+" screens built");
 pinta();}

addEventListener("keydown",e=>{
 const s=S(); if(!s)return;
 const k=e.key;
 if(seArrastra()&&(k=="ArrowLeft"||k=="ArrowRight")){

 if(k=="Enter"||(k==" "&&(!s||s.obra!="escribe"))){

 if(k=="Backspace"){e.preventDefault();
  if(s.pasos&&EJ.i>0)ejAtras(); else atras(); return;}});

function marcoChrome(){
 try{
  const t = (typeof PZ !== "undefined" && PZ.length) ? PZ.length
          : (typeof TOT !== "undefined" ? TOT : 0);
  const i = (typeof iP !== "undefined") ? iP
          : ((typeof paso !== "undefined" && paso && typeof paso.p === "number") ? paso.p : 0);
  const dc = n => (n < 10 ? "0" : "") + n;
  const b = document.getElementById("barCont");
  if (b && t) b.textContent = dc(i + 1) + " / " + dc(t);
  const f = document.getElementById("ficha");
  if (f && f.style && f.style.setProperty
      && typeof D !== "undefined" && D && D.W && D.H)
    f.style.setProperty("--ar", D.W + " / " + D.H);
 }catch(e){}
}
