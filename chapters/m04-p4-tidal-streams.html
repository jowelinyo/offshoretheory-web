p{margin:0 0 11px}

.res.no{background:#fff4f4;border-color:#e8bebe}

.tag{font:11px ui-monospace,monospace;background:#12202b;color:#fff;padding:1px 6px;border-radius:3px}

.hd{justify-content:flex-start}

:root{
 --page:#E8EBED; --panel:#F6F7F7; --card:#FCFCFB; --inset:#F4F6F7; --bar:#1C2B36;
 --edge-frame:#B7C0C6; --edge-card:#BCC4C9; --edge-inner:#E4E8EA;
 --edge-panel:#CFD7DC; --edge-leader:#C1C9CE; --edge-button:#A9B4BB;
 --rule-heavy:#1C2B36;
 --ink-title:#0F171D; --ink-strong:#141C22; --ink-lead:#20292F; --ink-body:#333D45;
 --ink-secondary:#4A5A66; --ink-label:#5B6B77; --ink-quiet:#5E6B74;
 --accent-text:#9A5C10; --accent-graphic:#C97B1B; --accent-on-bar:#E2B15C;
 --accent-control:var(--accent-graphic);
 --link:#2F6C8F; --progress-pending:#CDD5DA;
 --on-bar:#DCE4E9; --on-bar-dim:#B8C7D0; --on-bar-strong:#F6F9FA; --on-primary:#F2F6F8;
 --sp-hair:4px; --sp-inline:8px; --sp-tight:12px; --sp-card:14px; --sp-block:16px;
 --sp-col-y:20px; --sp-col-x:22px; --sp-panel-y:18px; --sp-panel-c:22px;
 --sp-panel-x:30px; --sp-bar-x:24px; --sp-close:40px;
 --ink-glosa:#4A5C65; --alarm-noche:#D9744E; --dim-banda:#93A9B1;

 --f-display:"Newsreader",ui-serif,Georgia,"Palatino Linotype","Times New Roman",serif;
 --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
 --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono","Segoe UI Mono",Menlo,Consolas,monospace;
}

html,body{background:var(--page);color:var(--ink-body);
 font:15px/1.55 var(--f-ui);overflow:hidden}
body{display:flex;flex-direction:column}

#barra{flex:none;height:54px;display:flex;align-items:center;gap:var(--sp-inline);
 padding:0 var(--sp-bar-x);background:var(--bar);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
#barra a{text-decoration:none;cursor:pointer;
 display:inline-flex;align-items:center;min-height:44px}
#barra .barlink{font:600 15px/1.45 var(--f-ui);color:var(--on-bar);
 white-space:nowrap;flex:none}
#barra .barlink:hover{color:var(--on-bar-strong);text-decoration:underline}
#barra .sep{flex:none;width:1px;height:22px;background:#3A4E5C;margin:0 var(--sp-inline)}
#miga{font:400 17px/1.2 var(--f-display);color:var(--on-bar-dim);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#miga b{color:var(--on-bar-strong);font-weight:500}
#barra .crece{flex:1;min-width:var(--sp-inline)}
#barCont{flex:none;font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;
 color:var(--accent-on-bar);font-variant-numeric:tabular-nums}

#wrap{flex:1;min-height:0;display:grid;
 grid-template-columns:minmax(0,1fr) clamp(320px,37%,560px)}

#lienzo{min-width:0;min-height:0;display:grid;place-items:center;
 padding:var(--sp-col-y) var(--sp-col-x)}

#ficha{--ar:1000/640;aspect-ratio:var(--ar);width:100%;
 max-width:100%;max-height:100%;min-height:0;position:relative;
 background:var(--card);border:1px solid var(--edge-card);border-radius:0;
 box-shadow:0 2px 3px rgba(28,43,54,.07);overflow:hidden}
#chart{position:absolute;inset:0}

#side{min-height:0;display:flex;flex-direction:column;background:var(--panel);
 border-left:1px solid var(--edge-frame);width:auto}
#head{flex:none;padding:var(--sp-panel-y) var(--sp-panel-x);
 border-bottom:1px solid var(--edge-panel);background:none}
#head b{font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;
 color:var(--ink-label)}
.hd{display:flex;align-items:baseline;gap:var(--sp-tight)}
.hd>:last-child{margin-left:auto}
#hTit{font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;
 color:var(--ink-label);margin-top:0;white-space:nowrap;overflow:hidden;
 text-overflow:ellipsis}
#prog{display:flex;gap:3px;margin-top:var(--sp-tight)}
#prog i{flex:1;height:5px;background:var(--progress-pending);border-radius:0;
 cursor:pointer;box-shadow:none}
#prog i.done{background:var(--link)}
#prog i.on{background:var(--accent-graphic);box-shadow:none}
#pane{flex:1;min-height:0;overflow-y:auto;
 padding:var(--sp-panel-c) var(--sp-panel-x)}
#foot{flex:none;border-top:1px solid var(--edge-panel);
 padding:var(--sp-tight) var(--sp-panel-x);
 font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;color:var(--ink-quiet);
 display:flex;align-items:center;gap:var(--sp-tight);flex-wrap:wrap}
#foot .volver{margin-left:auto}
.sello{font:400 12px/1.4 var(--f-mono);letter-spacing:.1em;color:var(--ink-quiet);
 margin-top:var(--sp-hair);width:100%}
.sello b{color:var(--ink-label);font-weight:500}

h2{margin:0 0 var(--sp-block);font:500 31px/1.18 var(--f-display);
 color:var(--ink-title)}
h3{margin:0 0 var(--sp-tight);font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;
 text-transform:uppercase;color:var(--ink-label)}
p{margin:0 0 var(--sp-block);max-width:62ch;color:var(--ink-body)}
p b{color:var(--ink-title);font-weight:600}
p em{font-style:normal;color:var(--ink-secondary)}
b.q{display:block;margin:0 0 var(--sp-block);font:400 17px/1.6 var(--f-ui);
 color:var(--ink-lead);font-weight:400}
.prl{font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;color:var(--accent-text);
 margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}

button{font:600 15px/1.45 var(--f-ui);padding:11px 26px;border:1px solid transparent;
 border-radius:2px;cursor:pointer;background:var(--bar);color:var(--on-primary);
 min-height:44px;margin:0}
button:hover:not(:disabled){background:#26394A;filter:none}
button:disabled{opacity:.45;cursor:default;filter:none}
button.sec{background:var(--card);color:var(--ink-lead);border-color:var(--edge-button);
 padding:10px 18px}
button.sec:hover:not(:disabled){background:var(--inset);filter:none}
button.show{background:transparent;color:var(--accent-text);
 border-color:var(--edge-button);padding:10px 18px}
a.skip,a.volver,#foot a{font:400 15px/1.45 var(--f-ui);color:var(--ink-secondary);
 cursor:pointer;text-decoration:none;white-space:nowrap;
 display:inline-flex;align-items:center;min-height:44px;padding:0 var(--sp-tight)}
a.skip:hover,a.volver:hover,#foot a:hover{color:var(--ink-title);
 text-decoration:underline}
.nav{display:flex;gap:var(--sp-inline);align-items:center;flex-wrap:wrap;
 margin-top:var(--sp-block);padding-top:var(--sp-tight);
 border-top:1px solid var(--edge-panel)}
:focus-visible{outline:2px solid var(--accent-graphic);outline-offset:2px}

.ops{display:flex;flex-direction:column;gap:var(--sp-inline);
 margin:0 0 var(--sp-block)}
.ops button{display:block;position:relative;width:100%;min-height:52px;
 padding:15px var(--sp-block);text-align:left;background:var(--card);
 color:var(--ink-lead);border:1px solid var(--edge-card);
 font:400 17px/1.45 var(--f-ui);white-space:normal}
.ops button b{font-weight:600;color:var(--ink-title);font-family:var(--f-ui)}
.ops button:hover:not(:disabled){background:var(--inset);
 border-color:var(--edge-button);filter:none}
.ops button:disabled{opacity:1;cursor:default;color:var(--ink-secondary)}
.res{margin:0 0 var(--sp-block);padding:var(--sp-tight) var(--sp-block);
 background:var(--inset);border:1px solid var(--edge-inner);
 border-left:3px solid var(--edge-panel);color:var(--ink-body);font-size:16px}
.res b{color:var(--ink-title);font-weight:600}
.res.si{background:var(--inset);border-color:var(--edge-inner);
 border-left-color:var(--link)}
.res.no{background:var(--inset);border-color:var(--edge-inner);
 border-left-color:var(--accent-graphic)}
.res.ver{background:var(--inset);border-color:var(--edge-inner);
 border-left-color:var(--accent-graphic)}
.res.ver>b{font:500 19px/1.3 var(--f-display);color:var(--ink-title);
 display:block;margin-bottom:var(--sp-inline)}
.pista{margin:var(--sp-tight) 0 0;padding:0;border:0;
 font:italic 400 17px/1.5 var(--f-display);color:var(--ink-secondary)}
.calc{background:var(--card);color:var(--ink-body);border:1px solid var(--edge-card);
 border-radius:0;padding:var(--sp-tight) var(--sp-block);margin:0 0 var(--sp-block);
 font:400 14px/1.7 var(--f-mono)}
.calc b{font-family:var(--f-ui);font-weight:600;color:var(--ink-title)}

.cajaFila{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.cajaFila button{padding:7px 12px;min-height:36px}
.cajaLee{margin:6px 0 10px;font-size:13px;color:var(--ink-secondary,inherit)}
@media (max-width:600px){ .cajaFila button{min-height:44px} }

table.rb{border-collapse:collapse;margin:8px 0 10px;font:13px var(--f-mono)}
table.rb th,table.rb td{padding:2px 7px;text-align:right;border-bottom:1px solid var(--edge-inner)}
table.rb th{font:600 11px var(--f-ui);color:var(--ink-label);text-align:right}
table.rb td.h{font:12px var(--f-ui);color:var(--ink-secondary);text-align:left}
table.rb tr.on td{background:var(--inset);font-weight:700;color:var(--ink-strong)}
table.rb td.cierra{background:var(--edge-inner);font-weight:700}
.dia{font:12px var(--f-ui);color:var(--ink-secondary);background:var(--card);border:1px solid var(--edge-card);
 border-radius:5px;padding:6px 9px;margin:6px 0}
.dia b{color:var(--ink-strong)}
.tira{display:block;margin:6px 0 10px}
.rot{font:600 12px var(--f-ui);color:var(--ink-label);text-transform:uppercase;letter-spacing:.5px}
.fila{display:flex;align-items:center;gap:8px;margin:6px 0}
.fila .cl{width:88px}
.fila .ud{font-size:12px;color:var(--ink-label)}
.preg{margin:10px 0 4px;font-weight:600}
button.opt.elegida{border-color:var(--ink-strong);box-shadow:0 0 0 2px var(--edge-frame)}

@media (max-width:700px){
 #wrap{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
 #lienzo{padding:6px 8px;max-height:45vh}
 #ficha{max-height:calc(45vh - 12px)}

"use strict";
const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

o the hour. On 1 May at 1230: the page headed <b>HW ALDERN QUAY +3 h</b>."]}, {"id": "4.E2", "h": "Read an arrow, and measure it", "v": [3900, 2500, 4400], "atlas": 3, "t": "trazar", "por": [4116.67162, 2298.82318], "resalta": [[4116.67162, 2298.82318]], "p": ["On that page, the arrow at <b>46&deg;14.9&prime;N 5&deg;53.1&prime;W</b>: figures <b>15,22</b> &mdash; 1.5 knots at neaps and 2.2 at springs.", "<b>Its direction is not written: you measure it</b>, with the plotter you used in module 02. Drag the edge along the arrow, the arrowhead of the plotter the way the water goes; turn the rose until its grid lies north&ndash;south; and read the index. <b>This one is 276.</b> Measured like that, it is good to <b>3&deg;</b>."], "caja": {"on": ["plotter"], "herr": "plotter"}}, {"id": "4.P1", "h": "Page and arrow", "v": [3900, 2500, 4400], "t": "trazar", "eligePagina": true, "por": [4080.0, 2100.0], "marca": [[4116.67162, 2904.7726599999996, "A"]], "dias": [{"fecha": "4 May 2026", "hw": [["1123", 7.3], ["2347", 7.7]], "lw": [["0509", 1.7], ["1723", 1.3]], "par": ["1123", "1723"], "resta": "7.3 &minus; 1.3", "rango": 6.0}], "pagina": 3, "fuentePagina": {"tipo": "fila", "hw": "1123", "reloj": "1420"}, "p": ["On <b>4 May 2026</b> at <b>1420</b>. <b>Open the page you need</b> &mdash; you see the page you choose, right or wrong &mdash; then measure the arrow at <b>A</b> with the plotter and work its rate for the day."], "campos": [{"etq": "set", "ud": "&deg;", "val": 284, "tol": 3, "ang": true, "por": "lay the edge of the plotter along the arrow, turn its rose until the grid lies north&ndash;south, and read the figure at the index &mdash; to within 3&deg;.", "fuente": {"tipo": "flecha", "x": 4116.67162, "y": 2904.7726599999996, "h": 3, "que": "dir"}}, {"etq": "rate", "ud": "kn", "val": 1.6, "tol": 0.1, "por": "work the day from its range: the height of the high water you count from minus the height of the low water next to it on the side of your time &mdash; then Np + (Sp &minus; Np) &times; (range &minus; 4.2) / 2.2.", "fuente": {"tipo": "flechaInterp", "x": 4116.67162, "y": 2904.7726599999996, "h": 3, "dia": 43, "reloj": "1420"}, "mal": [[1.7, "That is the springs figure. <i>Look at the range of the tide first.</i>"]]}], "bien": "A page, an arrow, and the day: the same three things as a diamond.", "caja": {"on": ["plotter"], "herr": "plotter"}, "hizo": "opened the right page of the atlas and measured an arrow", "show": {"txt": "<b>page</b>: HW +3 h<br><b>set</b>: 284 &deg;<br><b>rate</b>: 1.6 kn"}}, {"id": "4.E3", "h": "Between the arrows, step by step", "v": [3900, 2500, 4400], "atlas": 3, "t": "trazar", "por": [4000.0, 1700.0], "resalta": [[3510.72214, 1692.8736999999999], [4116.67162, 2298.82318], [4116.67162, 1692.8736999999999]], "marca": [[3700.0, 2000.0, "Y"]], "entre": [[3700.0, 2000.0, 3510.72214, 1692.8736999999999], [3700.0, 2000.0, 4116.67162, 2298.82318], [3700.0, 2000.0, 4116.67162, 1692.8736999999999]], "pasos": [{"atlas": 3, "t": "The place you want is hardly ever on an arrow. At <b>Y</b>, 46&deg;15.3&prime;N 5&deg;54.0&prime;W, on page +3: take <b>the three arrows round it</b>."}, {"atlas": 3, "t": "<b>Measure how far each one is, with the dividers</b> &mdash; the ones you have used since module 02. Click on <b>Y</b>, then on <b>the middle of the arrow</b>: that is the span. Drag the dividers to <b>the latitude scale at the side of the chart</b> and read it: <b>one minute of latitude is one mile</b>. Never the longitude scale along the top. Here: 261 &middot; 2.0 kn at <b>0.54 M</b>, 276 &middot; 2.2 kn at <b>0.76 M</b>, 288 &middot; 1.6 kn at <b>0.77 M</b>."}, {"atlas": 3, "t": "<b>The nearer an arrow, the more it counts</b>: each one weighs one over its distance, and the three weights are shared out so that they add up to one: 1/0.54 &rarr; <b>42 %</b>, 1/0.76 &rarr; <b>29 %</b>, 1/0.77 &rarr; <b>29 %</b>.", "calc": "weight = (1 / distance) &divide; (the three 1 / distance added)"}, {"atlas": 3, "t": "Then the <b>set</b> and the <b>rate</b> are each the three figures mixed with those weights: <b>273 at 1.9 knots</b> at springs. The water at Y runs 272 at 2.1: reading between arrows is good to a few degrees and a couple of tenths, and that is the margin this chapter accepts &mdash; <b>5&deg; and 0.2 knots</b>.", "calc": "set = 0.42&times;261 + 0.29&times;276 + 0.29&times;288<br>rate = 0.42&times;2.0 + 0.29&times;2.2 + 0.29&times;1.6"}, {"atlas": 3, "t": "<b>Mixing sets like this only works when they are close together.</b> Across north it goes wrong: <b>350</b> and <b>010</b> both point north, but their average is <b>180</b> &mdash; due south. So when the sets you mix lie on both sides of 000, <b>add 360 to the small ones first</b>, mix, and take 360 off if the answer comes out over 360.", "calc": "350 and 010 &rarr; 350 and 370 &rarr; (350 + 370) &divide; 2 = 360 &rarr; <b>000</b>"}], "p": [], "caja": {"on": ["compas", "plotter"], "herr": "compas"}}, {"id": "4.P2", "h": "Between three arrows", "v": [3900, 2500, 4400], "atlas": 3, "t": "trazar", "por": [4300.0, 2300.0], "resalta": [[4116.67162, 2298.82318], [4116.67162, 2904.7726599999996], [4696.0, 2352.0]], "marca": [[4000.0, 2600.0, "X"]], "dias": [{"fecha": "21 April 2026", "hw": [["0036", 8.1], ["1250", 7.6]], "lw": [["0636", 1.3], ["1852", 1.2]], "par": ["1250", "1852"], "resta": "7.6 &minus; 1.2", "rango": 6.4}], "p": ["At <b>X</b>, 46&deg;14.4&prime;N 5&deg;53.3&prime;W, page +3, on <b>21 April 2026</b> at 1550 &mdash; the range of that tide is 6.4 m, mean springs. Measure the three arrows round X with the plotter, and how far each one is with the dividers on the latitude scale; weigh them by distance, and give the stream. Accepted to 5&deg; and 0.2 knots."], "campos": [{"etq": "set", "ud": "&deg;", "val": 277, "tol": 5, "ang": true, "por": "measure each arrow with the plotter and its distance with the dividers, then mix the three sets with weights 1/distance shared out to add up to one.", "fuente": {"tipo": "tres", "x": 4000.0, "y": 2600.0, "h": 3, "que": "dir"}}, {"etq": "rate", "ud": "kn", "val": 2.0, "tol": 0.2, "por": "mix the three springs figures with the same weights: a springs day uses the springs figure.", "fuente": {"tipo": "tres", "x": 4000.0, "y": 2600.0, "h": 3, "que": "vivas"}}], "bien": "The nearest arrows carry the answer, and the far one nudges it.", "caja": {"on": ["plotter", "compas"], "herr": "plotter"}, "hizo": "read the atlas between its arrows", "show": {"txt": "<b>set</b>: 277 &deg;<br><b>rate</b>: 2.0 kn"}}]}, {"t": "Diamond or atlas", "s": [{"id": "5.E1", "h": "At a diamond they agree", "v": [3296.0, 2452.0, 2600], "atlas": 3, "rombos": ["C"], "resalta": [[3296.0, 2352.0]], "tabla": {"letras": ["C"], "marca": [["C", 3]]}, "p": ["The atlas has an arrow on every diamond. At C, page +3: <b>14,22 at 271</b>. The table of C, row 3 after: <b>271 &middot; 2.2 &middot; 1.4</b>.", "<b>It is the same water, measured once.</b>"]}, {"id": "5.E2", "h": "Away from it, they may not", "v": [4400.0, 3848.0, 2600], "atlas": -1, "rombos": ["F"], "resalta": [[4116.67162, 4116.67162]], "marca": [[4400.0, 4048.0, "X"]], "p": ["In the southern channel, <b>0.6 miles south of F</b>, where it narrows, one hour before high water. Diamond F says <b>038 at 3.7</b> at springs; the nearest atlas arrow &mdash; in the narrow part &mdash; says <b>31,48: 4.8 knots</b>. The water at X runs at about 5.", "<b>Use the source nearest to where you are, in the same channel.</b> A diamond in another channel is no use however near it is.", "<b>And when two disagree, which figure you plan with depends on what the stream does for you.</b> When it is <b>against you</b>, or when it <b>decides a gate</b>, plan with the <b>stronger</b>: that is the one that can stop you. When it is <b>with you</b>, do not count on the stronger to work out when you arrive: it gives a time that is too good, and you get there late with the plan saying you are early."]}, {"id": "5.P1", "h": "Which do you use?", "v": [3900, 2500, 4400], "t": "elige", "rombos": ["C", "D", "F", "G"], "marca": [[5556.0, 2688.0, "1"], [3996.0, 2472.0, "2"], [4400.0, 4048.0, "3"]], "p": ["Three places, numbered on the chart. For each one, which source &mdash; and at 3, the stream is <b>against you</b> on the way south."], "ops": ["the diamond", "the atlas, between its arrows", "the nearest atlas arrow, planning with the stronger figure"], "preguntas": [{"q": "1 &middot; right beside diamond G", "bien": 0, "frases": [null, "Beside a diamond, the diamond <b>is</b> the stream of that place, and the atlas arrow there says the same: there is nothing to weigh between arrows.", "Nothing disagrees here to make you choose the stronger: beside the diamond you read the diamond."]}, {"q": "2 &middot; half way across the Sound between C and D", "bien": 1, "frases": ["No diamond is at this place: C and D are each half a Sound away, and the water between them is what the arrows round you describe.", null, "In open water nothing narrows and nothing is against you: weigh the arrows round you by distance instead of picking one."]}, {"q": "3 &middot; in the narrow part of the southern channel, stream against you", "bien": 2, "frases": ["Diamond F is up the channel in wider water, and it says less than the narrow part runs: against you, that is the figure that lets you down.", "Mixing arrows from the wide water into the narrow part waters the figure down: where it narrows and runs against you, take the nearest arrow and the stronger figure.", null]}], "bien": "<b>The nearest source in the same water</b> &mdash; and against you, or at a gate, the stronger.", "hizo": "chose between diamond and atlas", "show": {"txt": "<b>1 &middot; right beside diamond G</b>: the diamond<br><b>2 &middot; half way across the Sound between C and D</b>: the atlas, between its arrows<br><b>3 &middot; in the narrow part of the southern channel, stream against you</b>: the nearest atlas arrow, planning with the stronger figure"}}]}, {"t": "Tidal gates in Skelmar", "s": [{"id": "6.S1", "h": "The strongest water on the chart", "v": [4400.0, 3848.0, 2600], "rombos": ["F"], "atlas": -1, "resalta": [[4116.67162, 4116.67162]], "tira": {"horas": [{"h": -6, "dir": 195, "vivas": 45, "muertas": 29}, {"h": -5, "dir": 193, "vivas": 30, "muertas": 20}, {"h": -4, "dir": 183, "vivas": 8, "muertas": 5}, {"h": -3, "dir": 22, "vivas": 17, "muertas": 11}, {"h": -2, "dir": 18, "vivas": 37, "muertas": 24}, {"h": -1, "dir": 17, "vivas": 48, "muertas": 31}, {"h": 0, "dir": 15, "vivas": 47, "muertas": 31}, {"h": 1, "dir": 14, "vivas": 34, "muertas": 22}, {"h": 2, "dir": 8, "vivas": 13, "muertas": 8}, {"h": 3, "dir": 205, "vivas": 12, "muertas": 8}, {"h": 4, "dir": 198, "vivas": 33, "muertas": 22}, {"h": 5, "dir": 197, "vivas": 46, "muertas": 30}, {"h": 6, "dir": 196, "vivas": 48, "muertas": 31}], "etq": "the narrow arrow", "curva": false, "dos": true}, "p": ["The gate is worked <b>where the water limits you</b>: the narrow part of the southern channel, not diamond F, which sits in wider water and reads short. The atlas gives that place hour by hour &mdash; its arrow, page by page.", "At springs it reaches <b>4.8 knots, 1 before high water</b>, going 017.", "<i>Kittiwake</i> does 5 knots through the water. <b>Head-on, you subtract</b>: against 4.8 she makes 0.2 over the ground. <i>From the side it is no longer a subtraction &mdash; that is module 05.</i>"]}, {"id": "6.E1", "h": "The gate, in its table", "v": [4400.0, 3848.0, 2600], "rombos": ["F"], "atlas": -1, "resalta": [[4116.67162, 4116.67162]], "tabla": {"series": [{"etq": "The narrow arrow", "horas": [{"h": -6, "dir": 195, "vivas": 45, "muertas": 29}, {"h": -5, "dir": 193, "vivas": 30, "muertas": 20}, {"h": -4, "dir": 183, "vivas": 8, "muertas": 5}, {"h": -3, "dir": 22, "vivas": 17, "muertas": 11}, {"h": -2, "dir": 18, "vivas": 37, "muertas": 24}, {"h": -1, "dir": 17, "vivas": 48, "muertas": 31}, {"h": 0, "dir": 15, "vivas": 47, "muertas": 31}, {"h": 1, "dir": 14, "vivas": 34, "muer : 48, "muertas": 31}]}], "marca": []}, "dias": [{"fecha": "26 March 2026", "hw": [["0307", 7], ["1526", 6.5]], "lw": [["0916", 2.3], ["2137", 2.3]], "par": ["1526", "0916"], "resta": "6.5 &minus; 2.3", "rango": 4.2}], "p": ["On 26 March 2026, high water at 1526; the range is 4.2 m on both sides of it. Going south with no more than 2.5 knots against you: <b>between what times is the channel shut?</b> Write the times as four figures."], "campos": [{"etq": "from", "ud": "", "val": "1356", "tol": 5, "hora": true, "por": "find the first shut row, and the gate shuts half an hour before its time.", "fuente": {"tipo": "puerta", "x": 4116.67162, "y": 4116.67162, "dia": 4, "hw": "1526", "tope": 2.5, "extremo": "desde"}, "mal": [["1426", "That is the time of the first shut row itself. <i>A row is the hour centred on its time: it starts half an hour earlier.</i>"], ["1256", "That is the springs gate. <i>This day is at neaps: work each row with the range of the day.</i>"]]}, {"etq": "until", "ud": "", "val": "1556", "tol": 5, "hora": true, "por": "find the last shut row, and the gate opens half an hour after its time.", "fuente": {"tipo": "puerta", "x": 4116.67162, "y": 4116.67162, "dia": 4, "hw": "1526", "tope": 2.5, "extremo": "hasta"}, "mal": [["1526", "That is the time of the last shut row itself. <i>A row is the hour centred on its time: it runs half an hour later.</i>"], ["1656", "That is the springs gate. <i>This day is at neaps: work each row with the range of the day.</i>"]]}], "bien": "From half an hour before the first shut row to half an hour after the last.", "hizo": "found when a tidal gate is shut", "show": {"txt": "<b>from</b>: 1356 <br><b>until</b>: 1556 "}}, {"id": "6.S2", "h": "What a gate does not promise", "v": [4400.0, 3848.0, 2600], "rombos": ["F"], "p": ["A gate worked out on paper says when the water lets you through. <b>It does not say you will be there.</b>", "<b>You may arrive late</b> &mdash; a slow leg, a late start. <b>Getting through takes time</b
