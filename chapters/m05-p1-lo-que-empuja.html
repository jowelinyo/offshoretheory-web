<script>

"use strict";
const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;

  for(const q of f.m)el("circle",{cx:q[0],cy:q[1],r:6*k,fill:"#c8102e","fill-opacity":.5},gL);
  el("text",{x:(a[0]+b[0])/2+16*k,y:(a[1]+b[1])/2+7*k,"font-size":24*k,
   "font-family":"DejaVu Sans,sans-serif",fill:"#7a1020"},gL).textContent=f.L.toFixed(2)+" M";}
 if(medida&&medida.length){const a=medida[0],b=medida[1];
  if(b)el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:"#c8102e","stroke-width":3*k},gL);
  for(const q of medida)el("circle",{cx:q[0],cy:q[1],r:6*k,fill:"#c8102e"},gL);}
 verlo(); guias(); compas(); transp();

 if(typeof capaExtra==="function") capaExtra();}

const TOL_PIN = 20;

const tolM = () => TOL_PIN * esc() * D.MET;

const SEP_PIN = 2;
const DRIFT_MIN = 0.8;

let GU={h:null,v:null}, QU=[];
const GCOL="#2E3338";

function trInicial(){}

const CLIC=12;
let arr=null, ini=null, mov=0, tira=null, agarre=null;
for(const ev of ["dragstart","selectstart","contextmenu"])
 svg.addEventListener(ev,e=>e.preventDefault());

svg.addEventListener("pointerdown",e=>{
 arr=[e.clientX,e.clientY]; ini=arr.slice(); mov=0; tira=null;
 e.preventDefault();
 if(cuerpo)cuerpo.classList.add("arrastrando");
 svg.setPointerCapture(e.pointerId);
 const p=xy(e), k=esc(), tt=S().t;

 if((tt=="protra"||tt=="trazar")&&TR.b){
  const c=trCentro(), R=trRadio(), dc=Math.hypot(p[0]-c[0],p[1]-c[1]);
  if(dc<R){tira="r";return;}
  if(tt=="trazar"){
   const L=Math.hypot(TR.b[0]-TR.a[0],TR.b[1]-TR.a[1]);
   const ux=(TR.b[0]-TR.a[0])/L, uy=(TR.b[1]-TR.a[1])/L, nx=-uy, ny=ux;
   const t=(p[0]-TR.a[0])*ux+(p[1]-TR.a[1])*uy;
   const w=Math.abs((p[0]-TR.a[0])*nx+(p[1]-TR.a[1])*ny);
   if(w<R*0.8&&t>-R*1.6&&t<L+R*1.6){tira=(t<L/2)?"g":"m";agarre=[p[0],p[1]];return;}}}
 if(tt=="dividers"&&DIV.b){
  const [u,w]=dvExtremos(), vx=w[0]-u[0], vy=w[1]-u[1], L=vx*vx+vy*vy;
  let t=L?((p[0]-u[0])*vx+(p[1]-u[1])*vy)/L:0; t=Math.max(0,Math.min(1,t));
  if(Math.hypot(p[0]-(u[0]+vx*t),p[1]-(u[1]+vy*t))<22*k){tira="c";return;}}});

svg.addEventListener("pointermove",e=>{ if(!arr)return;
 mov=Math.hypot(e.clientX-ini[0],e.clientY-ini[1]);
 if(tira=="r"){const p=xy(e), c=trCentro();
  TR.off=((trDir()-(Math.atan2(p[0]-c[0],-(p[1]-c[1]))*180/Math.PI))%360+360)%360;
  arr=[e.clientX,e.clientY]; capa(); return;}
 if(tira=="g"||tira=="m"){const p=xy(e), c=trCentro();
  if(tira=="g"){
   const L=Math.hypot(TR.b[0]-TR.a[0],TR.b[1]-TR.a[1])/2;
   const an=Math.atan2(c[0]-p[0],-(c[1]-p[1]));
   TR.a=[c[0]-Math.sin(an)*L,c[1]+Math.cos(an)*L];
   TR.b=[c[0]+Math.sin(an)*L,c[1]-Math.cos(an)*L];
  }else{const dx=p[0]-agarre[0], dy=p[1]-agarre[1];
   TR.a=[TR.a[0]+dx,TR.a[1]+dy]; TR.b=[TR.b[0]+dx,TR.b[1]+dy]; agarre=[p[0],p[1]];}
  arr=[e.clientX,e.clientY]; capa(); return;}
 if(tira=="c"){dvApoya(xy(e)); arr=[e.clientX,e.clientY]; capa(); return;}
 if(tira)return;
 if(mov<CLIC){arr=[e.clientX,e.clientY];return;}
 const s=esc(), m=margenes();
 let dx=-(e.clientX-arr[0])*s, dy=-(e.clientY-arr[1])*s;
 dx=frena(dx>0?m.hiX-vb.x:vb.x-m.loX, dx, vb.w);
 dy=frena(dy>0?m.hiY-vb.y:vb.y-m.loY, dy, vb.h);
 vb.x+=dx; vb.y+=dy; arr=[e.clientX,e.clientY]; setvb();});

function veredictoPin(s,p){
 const tol=tolM();
 const P0=q=>[q[0]-D.X0, q[1]-D.Y0];
 const d=q=>Math.hypot(p[0]-P0(q)[0], p[1]-P0(q)[1])*D.MET;
 const dBien=d(s.sep);
 PIN=[p[0],p[1]];
 if(dBien<=tol){ s.ok=FRASE_BIEN(s,dBien); return true; }

 for(const [nombre,x,y] of (s.sepMal||[]))
  if(d([x,y])<=tol){ s.no=FRASES[nombre](s); return false; }

 let cerca=[NOMBRE_BIEN, dBien];
 for(const [nombre,x,y] of (s.sepMal||[]))
  if(d([x,y])<cerca[1]) cerca=[nombre, d([x,y])];
 s.no=`That is <b>${Math.round(dBien)} m</b> from it, and it is not any of the other `
  +`places on this chart either &mdash; the nearest of those is <b>${cerca[0]}</b>, `
  +`<b>${Math.round(cerca[1])} m</b> away. <i>A single mark cannot tell a wrong `
  +`direction from a short distance, so this screen does not guess: it tells you how `
  +`far off you are, and from what.</i>`;
 return false;}

const NOMBRE_BIEN = "the point you were asked for";
const FRASE_BIEN = (s,d) =>
 `<span class="big">${Math.round(d)} m from it</span><br>` + (s.bien||"");
const FRASES = {
 "the stream the other way round": s =>
  `You have gone the way the stream comes <b>from</b>. <i>A set is the direction the `
  +`water is going <b>to</b> &mdash; naming a flow by where it comes from is the `
  +`wind's convention, not the tide's, and it is the confusion this screen exists to `
  +`kill.</i>`,
 "the reckoning you started from": s =>
  `That is the <b>reckoning</b> you started from &mdash; the mark the log and the `
  +`course steered made, with nothing applied to it. <i>The stream has been moving the water `
  +`under you the whole leg, and it does not show on the log.</i>`,
 "a whole hour of stream": s =>
  `That is <b>a whole hour</b> of stream, and you have not been going for an hour. `
  +`<i>The drift is how far the water runs in one hour; what you apply is the part of `
  +`it you have been sailing through.</i>`,

 "the vector started at the near end": s =>
  `You have run the vector from the mark at the <b>start</b> of the leg. <i>The stream `
  +`is applied to where the reckoning has got <b>to</b> &mdash; the far end of the `
  +`course line &mdash; not to where it set out from. The near end is where you were `
  +`before the leg, and the leg has happened since.</i>`};

svg.addEventListener("pointerup",e=>{
 if(cuerpo)cuerpo.classList.remove("arrastrando");
 if(tira){arr=null;tira=null;return;}
 if(arr&&mov<CLIC&&!hecho){
  const s=S(), p=xy(e);
  if(s.t=="click"&&s.sep){
   const ok=veredictoPin(s,p);
   guarda("click",[Math.round(p[0]),Math.round(p[1])],ok);
   if(ok){hecho=true;fb(s.ok,"si");nav(true);}else falla(s,s.no);
   capa();}}
 arr=null;});

function aplicaPaso(){
 const s=S(), q=pasoActual();
 s._ver = q ? (q.ver||[]) : (s.ver||[]);}

function pinta(){ guardaDonde();
 const s=S(); progreso();
 aplicaPaso();
 if(s.v)ponVista(s.v);
 let h=`<div class="hd"><h3>Topic ${paso.p+1} \u00b7 ${PZ[paso.p].t}</h3>`
  +(/\.P/.test(s.id)?`<a class="skip" onclick="salta()">Skip</a>`:"")+`</div>`;
 if(s.h)h+=`<h2>${s.h}</h2>`;
 h+=(s.p||[]).map(t=>`<p>${t}</p>`).join("");
 if(s.calc)h+=`<div class="calc">${s.calc}</div>`;
 if(s.t=="click")h+=`<div id="fb"><small>${s.ay||"Click it on the chart."}</small></div>`;
 if(s.pasos){const q=pasoActual();
  h+=`<div class="hd"><h3>Step ${iPaso+1} of ${s.pasos.length}</h3></div>`;
  h+=`<p>${q.t}</p>`;
  if(q.calc)h+=`<div class="calc">${q.calc}</div>`;
  h+=`<div><button class="sec" onclick="pasoAtras()"${iPaso?"":" disabled"}>&#8592; Step back</button>
   <button onclick="pasoSig()"${iPaso>=s.pasos.length-1?" disabled":""}>Next step &#8594;</button></div>`;}
 h+=`<div class="nav" id="nav"></div>`;
 document.getElementById("pane").innerHTML=h;
 nav(s.pasos ? (iPaso>=s.pasos.length-1) : (!s.t||s.t=="text"||hecho));
 svg.classList.toggle("pick",s.t=="click");
 capa();}

window.salta=()=>{const s=S(); guarda("skipped","",false); hecho=true; nav(true);
 fb("Skipped.",""); };

const TINTA="#12202b";

const CALLADA="#5E6B74";
const pluma = (q,k) => (q && q[q.length-1]==="seca")
 ? {tinta:CALLADA, guion:(14*k)+" "+(10*k)}
 : {tinta:TINTA,   guion:null};

const conGuion = (at,pl) => { if(pl.guion) at["stroke-dasharray"]=pl.guion; return at; };

function _puntas(a,b,n,k,gL,tinta){

 const L=Math.hypot(b[0]-a[0],b[1]-a[1]); if(!L)return;
 const ux=(b[0]-a[0])/L, uy=(b[1]-a[1])/L, nx=-uy, ny=ux;
 const l=13*k, w=7*k, paso=17*k;
 for(let i=0;i<n;i++){
  const t=L*0.55+i*paso;
  const c=[a[0]+ux*t, a[1]+uy*t];
  el("path",{d:`M${c[0]+ux*l},${c[1]+uy*l}L${c[0]-nx*w},${c[1]-ny*w}`
   +`L${c[0]+nx*w},${c[1]+ny*w}Z`,fill:tinta||TINTA,"fill-opacity":.95},gL);}}

let ROTULOS=[], SIN_SITIO=[];
window.SIN_SITIO=SIN_SITIO;

const _SITIOS = k => [
 [ 16*k,   6*k, "start"], [-16*k,   6*k, "end"],
 [    0, -16*k, "middle"], [    0,  26*k, "middle"],
 [ 16*k, -12*k, "start"], [-16*k, -12*k, "end"],
 [ 16*k,  24*k, "start"], [-16*k,  24*k, "end"]];

function _apunta(p, txt, k, tinta){
 if(txt) ROTULOS.push({p:p, txt:txt, k:k, tinta:tinta||TINTA}); }

function _cajaTxt(p, txt, k, sitio){
 const f=19*k, an=txt.length*f*0.55, x=p[0]+sitio[0], y=p[1]+sitio[1];
 const x0 = sitio[2]==="end" ? x-an : (sitio[2]==="middle" ? x-an/2 : x);
 return {x0:x0, y0:y-f*0.78, x1:x0+an, y1:y+f*0.25, x:x, y:y, an:sitio[2]};}

const _dentro = b =>
 b.x0>=vb.x && b.x1<=vb.x+vb.w && b.y0>=vb.y && b.y1<=vb.y+vb.h;
const _choca = (a,b) =>
 !(a.x1<b.x0 || b.x1<a.x0 || a.y1<b.y0 || b.y1<a.y0);

function _piezas(){
 const cajas=[], segs=[];
 for(const e of Array.from(gL.querySelectorAll("line")))
  segs.push([+e.getAttribute("x1"), +e.getAttribute("y1"),
             +e.getAttribute("x2"), +e.getAttribute("y2")]);
 for(const e of Array.from(gL.querySelectorAll("circle"))){
  const cx=+e.getAttribute("cx"), cy=+e.getAttribute("cy"), r=+e.getAttribute("r");
  cajas.push({x0:cx-r, y0:cy-r, x1:cx+r, y1:cy+r});}
 return {cajas:cajas, segs:segs};}

function _cortaSeg(b, s){
 let t0=0, t1=1;
 const dx=s[2]-s[0], dy=s[3]-s[1];
 const p=[-dx, dx, -dy, dy];
 const q=[s[0]-b.x0, b.x1-s[0], s[1]-b.y0, b.y1-s[1]];
 for(let i=0;i<4;i++){
  if(p[i]===0){ if(q[i]<0)return false; continue; }
  const r=q[i]/p[i];
  if(p[i]<0){ if(r>t1)return false; if(r>t0)t0=r; }
  else      { if(r<t0)return false; if(r<t1)t1=r; }}
 return true;}

function _coloca(){
 const D0=_piezas(), cajas=D0.cajas, segs=D0.segs;
 for(const r of ROTULOS){
  let puesta=null;
  for(const sitio of _SITIOS(r.k)){
   const b=_cajaTxt(r.p, r.txt, r.k, sitio);
   if(!_dentro(b))continue;
   if(cajas.some(x=>_choca(b,x)))continue;
   if(segs.some(x=>_cortaSeg(b,x)))continue;
   puesta=b; break;}

  if(!puesta)
   for(const sitio of _SITIOS(r.k)){
    const b=_cajaTxt(r.p, r.txt, r.k, sitio);
    if(!_dentro(b))continue;
    if(cajas.some(x=>_choca(b,x)))continue;
    puesta=b; break;}
  if(!puesta){ SIN_SITIO.push(r.txt); continue; }
  cajas.push(puesta);
  el("text",{x:puesta.x, y:puesta.y, "font-size":19*r.k,
   "font-family":"DejaVu Sans,sans-serif", fill:r.tinta||TINTA,
   "text-anchor":puesta.an}, gL).textContent=r.txt;}}

function capaExtra(){
 const s=S(), k=esc();

 ROTULOS=[]; SIN_SITIO.length=0;
 const ver=n=>!s._ver||!s._ver.length||s._ver.indexOf(n)>=0;

 for(const q of (s.fix||[])){
  if(!ver("fix"))break;
  const c=P(q[0],q[1]), pl=pluma(q,k);
  el("circle",conGuion({cx:c[0],cy:c[1],r:9*k,fill:"none",stroke:pl.tinta,
   "stroke-width":2.6*k},pl),gL);
  el("circle",{cx:c[0],cy:c[1],r:2.2*k,fill:pl.tinta},gL);
  if(q[2])_apunta([c[0],c[1]],q[2],k,pl.tinta);}

 for(const q of (s.derrota||[])){
  if(!ver("derrota"))break;
  const a=P(q[0],q[1]), b=P(q[2],q[3]), pl=pluma(q,k);
  el("line",conGuion({x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:pl.tinta,
   "stroke-width":3.4*k},pl),gL);
  _puntas(a,b,1,k,gL,pl.tinta);
  if(q[5])_apunta([(a[0]+b[0])/2,(a[1]+b[1])/2],q[5],k,pl.tinta);}

 for(const q of (s.fondo||[])){
  if(!ver("fondo"))break;
  const a=P(q[0],q[1]), b=P(q[2],q[3]), pl=pluma(q,k);
  el("line",conGuion({x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:pl.tinta,
   "stroke-width":3.4*k},pl),gL);
  _puntas(a,b,2,k,gL,pl.tinta);
  if(q[4])_apunta([(a[0]+b[0])/2,(a[1]+b[1])/2],q[4],k,pl.tinta);}

 for(const q of (s.estima||[])){
  if(!ver("estima"))break;
  const c=P(q[0],q[1]), pl=pluma(q,k);
  const r=q[2]*Math.PI/180, NN=CARTA_NORTE||[0,-1], EE=[-NN[1],NN[0]];
  const ux=NN[0]*Math.cos(r)+EE[0]*Math.sin(r), uy=NN[1]*Math.cos(r)+EE[1]*Math.sin(r);

  el("line",conGuion({x1:c[0]-uy*17*k,y1:c[1]+ux*17*k,x2:c[0]+uy*17*k,
   y2:c[1]-ux*17*k,stroke:pl.tinta,"stroke-width":3.4*k},
   pl.guion?{guion:(7*k)+" "+(5*k)}:pl),gL);
  if(q[3])_apunta(c,q[3],k,pl.tinta);}

 for(const q of (s.vector||[])){
  if(!ver("vector"))break;
  const a=P(q[0],q[1]), b=P(q[2],q[3]), pl=pluma(q,k);
  el("line",conGuion({x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:pl.tinta,
   "stroke-width":3.4*k},pl),gL);
  _puntas(a,b,3,k,gL,pl.tinta);
  if(q[4])_apunta(b,q[4],k,pl.tinta);}

 for(const q of (s.ep||[])){
  if(!ver("ep"))break;
  const c=P(q[0],q[1]), r=12*k, pl=pluma(q,k);
  el("path",conGuion({d:`M${c[0]},${c[1]-r}L${c[0]+r*0.87},${c[1]+r*0.5}`
   +`L${c[0]-r*0.87},${c[1]+r*0.5}Z`,fill:"none",stroke:pl.tinta,
   "stroke-width":2.6*k},pl),gL);
  el("circle",{cx:c[0],cy:c[1],r:2.2*k,fill:pl.tinta},gL);
  if(q[2])_apunta([c[0],c[1]],q[2],k,pl.tinta);}

 if(PIN){
  el("line",{x1:PIN[0]-11*k,y1:PIN[1]-11*k,x2:PIN[0]+11*k,y2:PIN[1]+11*k,
   stroke:"#B33A22","stroke-width":3*k},gL);
  el("line",{x1:PIN[0]-11*k,y1:PIN[1]+11*k,x2:PIN[0]+11*k,y2:PIN[1]-11*k,
   stroke:"#B33A22","stroke-width":3*k},gL);}

 _coloca();}

paso=donde(); if(typeof ponEst==="function")ponEst();
pinta();
marcoChrome();
