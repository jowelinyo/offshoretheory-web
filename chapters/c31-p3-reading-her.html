:root{

 --page:#E8EBED;
 --panel:#F6F7F7;
 --card:#FCFCFB;
 --inset:#F4F6F7;
 --bar:#1C2B36;

 --edge-frame:#B7C0C6;
 --edge-card:#BCC4C9;
 --edge-inner:#E4E8EA;
 --edge-panel:#CFD7DC;
 --edge-leader:#C1C9CE;
 --edge-button:#A9B4BB;
 --rule-heavy:#1C2B36;

 --ink-title:#0F171D;
 --ink-strong:#141C22;
 --ink-lead:#20292F;
 --ink-body:#333D45;
 --ink-secondary:#4A5A66;
 --ink-label:#5B6B77;
 --ink-quiet:#5E6B74;

 --accent-text:#9A5C10;
 --accent-graphic:#C97B1B;
 --accent-control:var(--accent-graphic);
 --accent-on-bar:#E2B15C;
 --link:#2F6C8F;
 --progress-pending:#CDD5DA;
 --on-bar:#DCE4E9; --on-bar-dim:#B8C7D0; --on-bar-strong:#F6F9FA;
 --on-primary:#F2F6F8;

 --sp-hair:4px; --sp-inline:8px; --sp-tight:12px; --sp-card:14px; --sp-block:16px;
 --sp-col-y:20px; --sp-col-x:22px; --sp-panel-y:18px; --sp-panel-c:22px;
 --sp-panel-x:30px; --sp-bar-x:24px; --sp-close:40px;

 --f-display:"Newsreader",ui-serif,Georgia,"Palatino Linotype","Times New Roman",serif;
 --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
 --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono","Segoe UI Mono",Menlo,Consolas,monospace;

 --sea-deep:#0A1E27; --sea:#102B36; --sea-line:#1E4453;
 --paper:#E3EAEE; --paper-ink:#EFE6D2; --paper-2:#D2DDE3; --paper-line:#A6B3BA;
 --ink:#15252D; --ink-soft:#5C7079; --dim:#829AA3;
 --magenta:#6B2461; --magenta-soft:#B07FA6;
 --water:#8FC3DA; --alarm:#B33A22; --ok:#3F7A56;

 --ink-glosa:#4A5C65;
 --alarm-noche:#D9744E;
 --dim-banda:#93A9B1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{display:flex;flex-direction:column;background:var(--page);color:var(--ink-body);
 font:400 16px/1.68 var(--f-ui);-webkit-font-smoothing:antialiased;
 text-rendering:optimizeLegibility}

#barra{flex:none;height:54px;display:flex;align-items:center;gap:var(--sp-inline);
 padding:0 var(--sp-bar-x);background:var(--bar);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}

#barra a{text-decoration:none;cursor:pointer;
 display:inline-flex;align-items:center;min-height:44px}
.barlink{font:600 15px/1.45 var(--f-ui);color:var(--on-bar);white-space:nowrap;flex:none}
.barlink:hover{color:var(--on-bar-strong);text-decoration:underline}
#barra .sep{flex:none;width:1px;height:22px;background:#3A4E5C;margin:0 var(--sp-inline)}

#miga{font:400 17px/1.2 var(--f-display);color:var(--on-bar-dim);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#miga b{color:var(--on-bar-strong);font-weight:500}
#barra .crece{flex:1;min-width:var(--sp-inline)}
#barCont{flex:none;font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;
 color:var(--accent-on-bar);font-variant-numeric:tabular-nums}

#wrap{flex:1;min-height:0;display:grid;
 grid-template-columns:minmax(0,1fr) clamp(320px,37%,560px)}
#lienzo{min-width:0;min-height:0;display:flex;flex-direction:column;
 justify-content:center;align-items:center;
 padding:var(--sp-col-y) var(--sp-col-x)}

#ficha.sinCaja{background:transparent;border:0;box-shadow:none}

#ficha{--lam-ink:var(--paper-ink);--lam-dim:var(--dim);--lam-alarm:var(--alarm-noche);--lam-magenta:var(--magenta-soft)}
#ficha.sinCaja{--lam-ink:var(--ink-title);--lam-dim:var(--ink-glosa);--lam-alarm:var(--alarm);--lam-magenta:var(--magenta)}

#fichas .ficha{--lam-ink:var(--ink-title);--lam-dim:var(--ink-glosa);--lam-alarm:var(--alarm);--lam-magenta:var(--magenta)}
#fichas .escena{--lam-ink:var(--paper-ink);--lam-dim:var(--dim);--lam-alarm:var(--alarm-noche);--lam-magenta:var(--magenta-soft)}
#ficha{flex:1;align-self:stretch;min-height:0;position:relative;background:var(--sea-deep);
 border:1px solid var(--edge-card);border-radius:0;
 box-shadow:0 2px 3px rgba(28,43,54,.07);overflow:hidden}

#fichas{flex:1;min-height:0;display:grid;gap:var(--sp-card);
 grid-template-columns:1fr;justify-content:center;width:100%}
#cierre{flex:none;margin-top:var(--sp-close);padding-top:var(--sp-tight);
 border-top:2px solid var(--rule-heavy)}
#cierre .cf{font:500 24px/1.25 var(--f-display);color:var(--ink-title)}
#cierre .cp{margin-top:2px;font:italic 400 15px/1.45 var(--f-display);
 color:var(--ink-secondary)}

.ficha{flex:1;min-height:0;display:grid;
 background:var(--card);border:1px solid var(--edge-card);border-radius:0;
 box-shadow:0 2px 3px rgba(28,43,54,.07)}
.ficha.conpie{grid-template-columns:none;grid-template-rows:auto minmax(0,1fr) auto}
.ficha.conpie .bcab{border-bottom:1px solid var(--edge-inner)}
.ficha.conpie .bpie{border-top:1px solid var(--edge-inner)}
.ficha.allado{grid-template-rows:auto minmax(0,1fr)}
.ficha.allado .escena{grid-area:1/1/3/2}
.ficha.allado .bcab{grid-area:1/2/2/3;border-left:1px solid var(--edge-inner);
 align-self:end}
.ficha.allado .bpie{grid-area:2/2/3/3;border-left:1px solid var(--edge-inner);
 align-self:start}
.bcab,.bpie{padding:10px 18px;min-width:0}

.ficha.marcada{box-shadow:0 2px 3px rgba(28,43,54,.07),-3px 0 0 var(--accent-graphic)}
.escena{position:relative;background:var(--sea-deep);overflow:hidden}

.escena.dia{background:var(--paper)}
.escena.dia,#fichas .escena.dia{--lam-ink:var(--ink-title);--lam-dim:var(--ink-glosa);
 --lam-alarm:var(--alarm);--lam-magenta:var(--magenta)}
#fichas{width:100%}
.escena svg{position:absolute;inset:0;width:100%;height:100%}
.bcab{display:flex;align-items:baseline;gap:var(--sp-inline)}

.bcab .k{font:500 19px/1.2 var(--f-display);color:var(--ink-title);flex:none}
.ficha.marcada .bcab .k{color:var(--accent-text)}
.bcab .guia{flex:1;border-bottom:1px dotted var(--edge-leader);min-width:10px}
.bcab .v{font:400 12px/1.4 var(--f-mono);letter-spacing:.06em;color:var(--ink-label);
 flex:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.btit{font:600 16px/1.35 var(--f-ui);color:var(--ink-title)}

.btit.alarma{color:var(--accent-text)}

.res-col{background:var(--card);border:1px solid var(--edge-card);
 box-shadow:0 2px 3px rgba(28,43,54,.07);display:flex;flex-direction:column;
 min-width:0;overflow:hidden}
.res-col>h5{margin:0;padding:10px 16px;border-bottom:1px solid var(--edge-inner);
 font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;
 color:var(--ink-label)}
.res-col>div{padding:12px 16px;overflow:auto}
.res-col dl{margin:0}
.res-col dt{font:600 15px/1.35 var(--f-ui);color:var(--ink-title);margin-top:10px}
.res-col dt:first-child{margin-top:0}
.res-col dd{margin:1px 0 0;font:400 15px/1.4 var(--f-ui);color:var(--ink-secondary)}
.bglo{margin-top:2px;font:italic 400 16px/1.35 var(--f-display);
 color:var(--ink-secondary)}
#obj{position:absolute;inset:0}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#obj,#svg,#svg *{-webkit-user-select:none;-moz-user-select:none;user-select:none;
 -webkit-user-drag:none;-webkit-tap-highlight-color:transparent}
#obj svg .boton{cursor:pointer}

#side{min-height:0;display:flex;flex-direction:column;background:var(--panel);
 border-left:1px solid var(--edge-frame)}
#head{flex:none;padding:var(--sp-panel-y) var(--sp-panel-x);
 border-bottom:1px solid var(--edge-panel)}
.hd{display:flex;align-items:baseline;gap:var(--sp-tight)}
.hd>:last-child{margin-left:auto}

#hTit{font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;
 color:var(--ink-label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hN{flex:none;font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;
 color:var(--ink-quiet);font-variant-numeric:tabular-nums}
#prog{display:flex;gap:3px;margin-top:var(--sp-tight)}
#prog i{flex:1;height:5px;background:var(--progress-pending);border-radius:0;
 cursor:pointer}
#prog i.done{background:var(--link)}
#prog i.on{background:var(--accent-graphic)}
#pane{flex:1;min-height:0;overflow-y:auto;
 padding:var(--sp-panel-c) var(--sp-panel-x)}

h2{margin:0 0 var(--sp-block);font:500 31px/1.18 var(--f-display);
 color:var(--ink-title)}
h3{margin:0 0 var(--sp-tight);font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;
 text-transform:uppercase;color:var(--ink-label)}
p{margin:0 0 var(--sp-block);max-width:62ch;color:var(--ink-body)}
p:last-child{margin-bottom:0}
p b{color:var(--ink-title);font-weight:600}

p em{font-style:normal;color:var(--ink-secondary)}

button{font:600 15px/1.45 var(--f-ui);padding:11px 26px;border:1px solid transparent;
 border-radius:2px;cursor:pointer;background:var(--bar);color:var(--on-primary);
 min-height:44px}
button:hover:not(:disabled){background:#26394A}
button.sec{background:var(--card);color:var(--ink-lead);border-color:var(--edge-button);
 padding:10px 18px}
button.sec:hover:not(:disabled){background:var(--inset)}
button.show{background:transparent;color:var(--accent-text);
 border-color:var(--edge-button);padding:10px 18px}

a.skip{font:400 15px/1.45 var(--f-ui);color:var(--ink-secondary);cursor:pointer;
 text-decoration:none;white-space:nowrap;padding:0 var(--sp-tight);
 display:inline-flex;align-items:center;min-height:44px}
a.skip:hover{color:var(--ink-title);text-decoration:underline}

.prl{font:400 12px/1.4 var(--f-mono);letter-spacing:.12em;color:var(--accent-text);
 margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}

b.q{display:block;margin:0 0 var(--sp-block);font:400 17px/1.6 var(--f-ui);
 color:var(--ink-lead);font-weight:400}
.ops{display:flex;flex-direction:column;gap:var(--sp-inline);
 margin:0 0 var(--sp-block);counter-reset:op}

.ops button{display:block;position:relative;width:100%;
 min-height:52px;padding:15px var(--sp-block) 15px 46px;text-align:left;
 background:var(--card);color:var(--ink-lead);border:1px solid var(--edge-card);
 font:400 17px/1.45 var(--f-ui)}
.ops button b{font-weight:600;color:var(--ink-title)}
.ops button::before{counter-increment:op;content:counter(op,upper-alpha);
 position:absolute;left:var(--sp-block);top:15px;
 font:500 15px/1.45 var(--f-mono);color:var(--accent-text)}
.ops button:hover:not(:disabled){background:var(--inset);
 border-color:var(--edge-button)}
.ops button:disabled{opacity:1;cursor:default;color:var(--ink-secondary)}

.res{margin:0 0 var(--sp-block);padding:var(--sp-tight) var(--sp-block);
 background:var(--inset);border:1px solid var(--edge-inner);
 border-left:3px solid var(--edge-panel);color:var(--ink-body);font-size:16px}
.res b{color:var(--ink-title);font-weight:600}
.res.si{border-left-color:var(--link)}
.res.no{border-left-color:var(--accent-graphic)}
.res.ver{border-left-color:var(--accent-graphic)}

.pista{margin:0 0 var(--sp-block);font:italic 400 19px/1.5 var(--f-display);
 color:var(--ink-secondary);border:0;padding:0}

.calc{margin:0 0 var(--sp-block);padding:var(--sp-tight) var(--sp-block);
 background:var(--inset);border:1px solid var(--edge-inner);
 font:400 15px/1.45 var(--f-ui);color:var(--ink-body);
 font-variant-numeric:tabular-nums}
.calc b{color:var(--ink-title);font-weight:600}

#foot{flex:none;border-top:1px solid var(--edge-panel);
 padding:var(--sp-panel-y) var(--sp-panel-x)}
#navPie .nav{display:flex;align-items:center;gap:var(--sp-inline);flex-wrap:wrap}
#navPie .nav button#sig,#navPie .nav button#otra{margin-left:auto}

.pie2{display:flex;align-items:baseline;gap:var(--sp-tight);
 margin-top:var(--sp-tight);font:400 12px/1.4 var(--f-mono);letter-spacing:.1em;
 color:var(--ink-quiet);white-space:nowrap}
.pie2>:last-child{margin-left:auto}
a.pieLink{color:var(--link);text-decoration:none;cursor:pointer;white-space:nowrap}
a.pieLink:hover{text-decoration:underline}
.sello{display:block;margin-top:var(--sp-hair);font:400 12px/1.4 var(--f-mono);

 letter-spacing:.1em;color:var(--ink-quiet);

 white-space:normal;overflow-wrap:anywhere}
.sello b{font-weight:400}

@media (max-width:1099px){
 #wrap{grid-template-columns:minmax(0,1fr) clamp(320px,34%,346px)}
 #miga{font-size:15px}
}

@media (max-width:999px){ #barra{height:50px} }

@media (max-width:699px){
 :root{ --sp-col-y:10px; --sp-col-x:12px; }
 #wrap{grid-template-columns:minmax(0,1fr);
       grid-template-rows:clamp(200px,46vh,520px) minmax(0,1fr)}
 #side{border-left:0;border-top:1px solid var(--edge-frame)}

 #barra .sep, #barra a[href="../index.html"]:last-of-type{display:none}
}

#escena{position:relative;flex:1;align-self:stretch;width:100%;min-height:0;
  border-radius:var(--r-card,10px);overflow:hidden;background:var(--sea-deep);
  border:1px solid var(--edge-frame)}
#escena canvas{display:block;width:100%;height:100%;touch-action:none}

#cargando{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font:400 14px/1.4 var(--f-ui);color:var(--dim);
  text-align:center;padding:var(--sp-tight)}
#escena.listo #cargando{display:none}

.montaje{display:grid;grid-template-columns:1fr;grid-template-areas:
  "et" "sl" "v";align-items:center;gap:var(--sp-hair);margin-top:var(--sp-tight)}
.montaje .et{grid-area:et;display:block;font:400 12px/1.4 var(--f-mono);
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-label);
  margin-bottom:var(--sp-hair)}
.montaje input{grid-area:sl;width:100%;min-height:44px;
  accent-color:var(--accent-control,#C97B1B)}
.montaje .v{grid-area:v;font:400 13px/1.4 var(--f-mono);color:var(--ink-secondary);
  text-align:left;min-width:0}

.humoSel{grid-template-areas:"et et" "sl sl" "v v"}
.humoBtns{grid-area:sl;display:flex;gap:var(--sp-hair);flex-wrap:wrap}
.humoBtn{flex:1 1 5.5em;min-height:44px;min-width:44px;
  font:400 14px/1.4 var(--f-ui);color:var(--ink-primary);
  background:var(--surface-raised,transparent);
  border:1px solid var(--rule);border-radius:2px;cursor:pointer}
.humoBtn[aria-pressed="true"]{border-color:var(--accent-control,#C97B1B);
  box-shadow:inset 0 0 0 1px var(--accent-control,#C97B1B)}
.humoSel .v{grid-area:v;text-align:left;min-width:0;margin-top:var(--sp-hair)}

#prog i{padding:12px 0 !important;background-clip:content-box !important;
  box-sizing:content-box !important;margin:-12px 0 !important}

.verTodo{display:flex;justify-content:flex-end;margin-top:var(--sp-hair)}
.verTodo button{min-height:44px;padding:0 var(--sp-card);
  font:400 13px/1.4 var(--f-ui);color:var(--ink-secondary);
  background:transparent;border:1px solid var(--rule);border-radius:2px;cursor:pointer}

"use strict";
const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

const PZ = [{"id": "9.1", "tema": "Reading her · The routine, the smoke and the fault", "pos": 16, "tope": 16, "mando": null, "camara": "stbd", "marcas": [{"pieza": "Raw-water strainer", "color": 3112936, "letra": "W"}, {"pieza": "Oil dipstick", "color": 3112936, "letra": "O"}, {"pieza": "Drive belt", "color": 3112936, "letra": "B"}, {"pieza": "Bilge", "color": 16747546, "letra": "B"}, {"pieza": "Header (expansion) tank", "color": 3112936, "letra": "L"}, {"pieza": "Exhaust manifold", "color": 3112936, "letra": "E"}], "h": "Six letters, before you turn the key", "p": ["<b>Everything in this course so far has been about one part at a time. This is the routine that touches all of them, and it takes about two minutes.</b>", "<b>W · Water.</b> The raw-water strainer, seen through its lid. Weed or plastic in the basket and you deal with it now, not when she is running hot in a channel.", "<b>O · Oil.</b> The dipstick, cold and on level trim. Between the marks. And the colour of it: amber is right, milky means water, and a level that has gone up on its own means diesel.", "<b>B · Belt.</b> Press it. About right, no cracks, no glaze, no black dust. One belt, three jobs.", "<b>B · Bilges.</b> Look under the engine. <b>It should be dry.</b> Water, oil or diesel down there is the first thing that tells you about a leak, and it tells you for free.", "<b>L · Levels.</b> The coolant in the header tank — <b>cold</b> — and the gearbox oil. Two levels that are not the engine oil and get forgotten because of it.", "<b>E · Exhaust.</b> Start her, and look over the stern for water. That one is the next screen.", "<b>Nothing in that list is hard and nothing in it takes long.</b> What makes it work is that it is always the same six, always in the same order, and always before you leave — so you do not have to remember what to check, only to check.", "<b>Every single one of those six has caught a real problem on a real boat before it became an expensive one.</b> That is the whole argument for it."], "q": "<b>You built this engine over eight phases, and the bilge underneath it has not moved. Look at the figure: you cannot see it any more.</b> What does the second B in WOBBLE actually ask you to do?", "opciones": ["Lift the sole boards and look underneath, with a torch", "Look down the side of the engine from the hatchway", "Run the bilge pump and see whether anything comes out", "Check the bilge alarm is armed before you leave"], "acierto": ["Lift the sole boards and look underneath, with a torch"], "bien": "<b>From the hatchway you are looking at the top of an engine, not at a bilge.</b> The boards come up — and that is exactly why it is its own letter in a six-letter routine: <b>it is the only one of the six you cannot do with the boards down.</b>", "mal": {"Look down the side of the engine from the hatchway": "That is what most people do, and it is why a leak gets found late. What you can see down the side is the outside of the sump. <b>The water is under it.</b>", "Run the bilge pump and see whether anything comes out": "<b>A pump takes the evidence away before you have read it.</b> You want to see what is down there and what colour it is — water, oil and diesel each send you somewhere different, and a pump makes all three the same.", "Check the bilge alarm is armed before you leave": "An alarm tells you when it is already bad. <b>The routine is what stops it getting bad</b>, and it costs two minutes."}}, {"id": "9.2", "tema": "Reading her · The routine, the smoke and the fault", "pos": 16, "tope": 16, "mando": null, "camara": "escape", "marcha": true, "h": "The first thirty seconds", "p": ["<b>The last letter of the six is the only one you do with the engine running, and it is the reason the other five are worth doing.</b>", "You have checked five things with the engine cold. <b>Now you start her, and within the first few seconds water should be spitting out of the exhaust with the gases.</b>", "<b>That one look confirms the whole seawater circuit at once, and it is worth listing what it proves.</b>", "<b>The seacock is open</b>, or no water would be coming in. <b>The strainer is clear</b>, or not enough would get past it. <b>The impeller is turning and in one piece</b>, or nothing would be pushing it. <b>The belt is on and tight</b>, because that belt is what turns the pump. <b>And nothing downstream is blocked</b>, because the water got all the way through and out.", "<b>Five things, one look</b> — and it does it right after you have checked, by hand and cold, the four that would have caused it.", "<b>So the six are not six separate checks. They are one check with five preparations.</b>", "<b>And if there is no water: stop her. Now.</b> You have just done the routine, so you already know the strainer was clear and the belt was on — which means it is the seacock or the impeller, and one of those two is free to check. <b>Look at the seacock first: it is the one somebody closed.</b>", "<b>It is one of the two checks in this module where the right answer is to act before you understand</b> — the other is the oil-pressure alarm — <b>and after the routine you are two seconds from understanding anyway.</b>"], "q": "<b>You have done W, O, B, B and L, and all five were good. You start her and there is no water at the exhaust. What do you check first?</b>", "opciones": ["The seacock — two seconds, no tools, and it is the one somebody shut", "The strainer — lift the lid and look into the basket", "The impeller — take the pump cover off", "The thermostat — the engine is about to get hot"], "acierto": ["The seacock — two seconds, no tools, and it is the one somebody shut"], "bien": "<b>The seacock.</b> You checked the strainer and the belt two minutes ago, so they are not it — and of what is left, the seacock costs two seconds and no tools. <b>Do the free one first.</b>", "mal": {"The strainer — lift the lid and look into the basket": "You looked into it during the W and it was clear. <b>Believe your own routine:</b> that is what it is for.", "The impeller — take the pump cover off": "Probably next, and it means a cover off. But there is something quicker still, and it is shut more often than an impeller fails.", "The thermostat — the engine is about to get hot": "That is the sealed circuit. <b>Missing water at the exhaust is telling you about the other one.</b>"}}, {"id": "9.3", "tema": "Reading her · The routine, the smoke and the fault", "pos": 16, "tope": 16, "mando": "humo", "humo": "blue", "camara": "escape", "marcas": [{"pieza": "Air filter", "color": 3112936}, {"pieza": "Turbocharger", "color": 3112936}, {"pieza": "Injector", "color": 3112936}, {"pieza": "Cylinder head & valves", "color": 3112936}], "h": "Blue, black, white", "p": ["<b>A diesel exhaust that is working is almost invisible. When it is not invisible, the colour tells you which system has the problem — and the three that tell you anything are blue, black and white.</b>", "<b>Blue is oil.</b> The engine is burning its own lubricating oil, and oil is getting into the combustion chamber where it does not belong. Worn piston rings let it up past the piston; worn valve guides let it down from the head. <b>It is the smoke of an old engine and it comes on slowly.</b> You confirm it by the level on the dipstick going down with no leak anywhere — nothing is dripping, because it is going out of the back of the boat.", "<b>Black is fuel that has not burned properly.</b> Too much fuel for the air available, or fuel arriving badly, and either way it is unburned carbon coming out. <b>So there are two sides to look at, and one of them is nearly free.</b> <b>Not enough air:</b> a choked air filter, or a turbocharger that is not delivering. <b>Bad injection:</b> worn or dirty injectors putting the diesel in as drops instead of mist.", "<b>Start with the air filter every time.</b> It is the cheapest thing on the list and the commonest cause, and it takes a minute to look at. Injectors are workshop work, and you go there only after the air side is clean. <i>Black under load is the one to notice: a puff when you open the throttle hard is normal on an older engine; black that stays while she works is not.</i>", "<b>White is water — and white is the one that ends the passage.</b> Coolant is getting into a cylinder and going out with the exhaust as steam, and the joint that lets it do that is the head gasket.", "<b>You confirm it with two things you already know how to check.</b> The coolant in the header tank goes down with nothing leaking outside. And the oil may go milky — <b>may</b>, because a gasket can fail into a cylinder without touching the oil galleries at all.", "<i>A cold engine on a cold morning puffs white for a minute and then clears. That is condensation and it is normal.</i> <b>White that does not clear once she is warm is not.</b>", "<b>Blue sends you to the rings and the valve guides. Black sends you to the air filter first and the injection second. White sends you to the head gasket, and the header tank confirms it.</b> <i>And you will be asked.</i>"], "q": "<b>Black smoke under load, and the air filter is clean. Click where you look next.</b>", "acierto": ["Injector", "Turbocharger"], "bien": "<b>The fuel side, or the rest of the air side.</b> Black is fuel burning badly, and <b>two of the reasons are yours to check</b>: not enough air, or fuel arriving wrong. You have been told the filter is clean — so it is the injectors, or a turbo that is not delivering. <b>Either is workshop work you diagnosed from the colour.</b>", "mal": {"Air filter": "That is where you start, and you were told it is clean. <b>Move on.</b>", "Cylinder head & valves": "That is white smoke. <b>Black has no water in it.</b>"}, "malOtro": "Black means fuel burning badly, and <b>two of the reasons are yours to check</b>: not enough air, or fuel arriving wrong. You were told the filter is clean, so look at the rest of those two."}, {"id": "9.4", "tema": "Reading her · The routine, the smoke and the fault", "pos": 16, "tope": 16, "mando": null, "camara": "stbd", "marcas": [{"pieza": "Piston", "color": 3112936}, {"pieza": "Cylinder head & valves", "color": 3112936}, {"pieza": "Air filter", "color": 16747546}, {"pieza": "Turbocharger", "color": 16747546}, {"pieza": "Injector", "color": 16747546}, {"pieza": "Header (expansion) tank", "color": 15922422}], "h": "Where the smoke sends you", "p": ["<b>Three colours, three systems, and each one sends you to a different part of the engine you built.</b>", "<b>Blue sends you inside the cylinder</b> — to the pistons and their rings, and to the valve guides in the head. <b>Nothing you can reach</b>, and nothing you fix at sea. What blue buys you is knowing, and knowing means watching the oil level and planning a rebuild rather than being surprised by one.", "<b>Black sends you to the air first and the fuel second</b>, and that order matters because one end of it is free. <b>Air filter, turbocharger, then injectors.</b>", "<b>White sends you to the top of the engine</b> — the head gasket, the joint you learned about in the very first phase — <b>and it sends you to the header tank to confirm it before you decide.</b>", "<b>And two things the colour does not tell you. It does not tell you how bad it is.</b> A trace of blue on an old engine that is otherwise fine is information, not an emergency. <b>White that does not clear is an emergency</b>, and the same colour on a cold morning for thirty seconds is nothing at all.", "<b>And it does not tell you what to do next — the rest of this course does.</b> Blue means watch the level. Black means look at the filter you can reach in a minute. White means stop, check the header tank, and think hard about whether to go on.", "<b>The colour is the question. Everything else you have learned is the answer.</b>"], "q": "<b>White smoke that does not clear once she is warm. Click what you look at before you decide anything.</b>", "acierto": ["Header (expansion) tank"], "bien": "<b>The header tank, and it costs nothing.</b> If the level has gone down with no leak outside, coolant is going into the engine and out of the exhaust, and that is the head gasket. <b>Confirm, then decide.</b>", "mal": {"Cylinder head & valves": "That is very probably the answer, but <b>you do not know it yet</b>. There is one glance that turns «probably» into «yes».", "Dipstick": "Worth a look, and milky oil would confirm it too — but a gasket can fail into a cylinder without touching the oil at all. <b>Clean oil rules nothing out. The tank does.</b>", "Exhaust mixing elbow": "Steam and water at the exhaust are normal — that is where the seawater joins. The colour is coming from further forward."}, "malOtro": "White is water going through a cylinder. Ask what would go down if coolant were leaving the sealed circuit, and which of those you can look at without a tool."}, {"id": "9.5", "tema": "Reading her · The routine, the smoke and the fault", "pos": 16, "tope": 16, "mando": null, "camara": "front", "enfoque": "Raw-water strainer", "cerca": true, "h": "From a symptom to a part", "p": ["<b>Nothing on this engine tells you what is wrong. It tells you what it is doing, and you work backwards.</b>", "That is the whole skill, and you already have every piece of it. Eight phases of knowing what each part does, and a set of symptoms that each point at two or three parts rather than one.", "<b>A symptom rarely has one answer, and that is not a weakness.</b> <i>No water at the exhaust</i> does not mean «the impeller». It means <b>the seacock, the strainer or the impeller</b> — three parts, in that order, from free to awkward.", "<b>A good diagnosis is a short list in the right order, not a single guess.</b> The person who says «impeller» and takes the pump apart while the seacock is shut has not diagnosed anything; they have been lucky or unlucky.", "<b>Free first, then cheap, then awkward.</b> It is the rule that makes the list an order instead of a pile. Looking at a seacock costs nothing. Looking through a strainer lid costs nothing. Pressing a belt costs nothing. <b>Do all of those before you undo one screw</b>, because half the time you will be finished.", "<b>And before any of it: the boat is still moving, or it is not.</b> An engine that has stopped is a problem you can take an hour over; a boat drifting onto a lee shore is not. <b>So before you open anything: get sea room, or get an anchor down, or put somebody on deck who is steering and looking.</b> Then fix it, and take as long as you like."], "q": "<b>No water is coming out of the exhaust. Click the part you check first.</b>", "acierto": ["Seacock"], "bien": "<b>The seacock, because it costs two seconds and no tools.</b> Then the strainer, also free. Then the impeller, which means a cover off. <b>Free, cheap, awkward — in that order, every time.</b>", "mal": {"Raw-water strainer": "Second on the list and a good answer. But you can see the seacock without moving, and it is shut more often than a strainer is blocked.", "Raw-water pump (impeller)": "The commonest thing to actually fail, and <b>the last of the three to check</b> — because checking it means taking something apart, and half the time you would have found the answer for free.", "Drive belt": "Worth a thought, and a broken belt does stop this pump. But you would have lost your charging at the same moment, and you were not told that."}, "malOtro": "Three parts can cause this, and they are not equally expensive to look at. Ask which one you can check without moving from where you are standing."}, {"id": "9.6", "tema": "Reading her · The routine, the smoke and the fault", "pos": 16, "tope": 16, "mando": null, "camara": "stbd", "marcas": [{"pieza": "Raw-water pump (impeller)", "color": 3112936}, {"pieza": "Drive belt", "color": 3112936}, {"pieza": "Thermostat", "color": 3112936}, {"pieza": "Secondary fuel filter", "color": 3112936}], "h": "What you carry", "p": ["<b>A spare you do not have is a part that has failed permanently.</b>", "That is the whole of it. On a boat there is no shop, and the difference between a delay and a passage ruined is usually a small box in a locker.", "<b>The one everybody agrees about: a raw-water impeller.</b> It is the first spare on the RYA's list and on everybody else's, because it is the part most likely to fail, it fails suddenly, it fails at the worst moment, and it is a rubber lump the size of a golf ball. <b>Carry it, and carry the gasket for the cover with it.</b>", "<b>Two full sets of fuel filters</b>, not one — because the reason you are changing them is usually dirt, and dirt does not stop after one set. <b>A drive belt</b>, with the wrenches that fit the alternator. <b>A thermostat</b>, which is small and cheap and stops the engine dead when it sticks. <b>Anodes</b>, for the heat exchanger and the shaft. <b>Oil, an oil filter, and gearbox oil. Hose and hose clips. Fuses, terminals and cable.</b>", "<b>And two that are not engine parts at all: tapered wooden bungs, and the engine's own manual.</b>", "The obvious tools — wrenches, screwdrivers, pliers, a knife — plus the ones that are specific to this job and get forgotten: <b>an oil filter wrench</b>, <b>an oil extraction pump</b>, <b>absorbent pads</b>, <b>a wire brush and petroleum jelly for terminals</b>, <b>a torch with spare batteries</b>, <b>a multimeter</b>, and <b>gasket paper</b>.", "<b>Keep them together, keep them in the engine locker, and know they are there.</b> A tool somewhere else on the boat is a tool you will not fetch at two in the morning."], "q": "<b>You can carry exactly one spare and nothing else. Click the part it is for.</b>", "acierto": ["Raw-water pump (impeller)"], "bien": "<b>The impeller.</b> Most likely to fail, fails suddenly, fails at the worst moment, and it is the size of a golf ball. <b>It is the first spare on every list there has ever been.</b>", "mal": {"Drive belt": "A very good second, and it takes three things with it when it goes. <b>But a belt gives you warning</b> — cracks, glaze, dust — and an impeller gives you none.", "Thermostat": "Cheap, small, worth carrying, and it fails far less often.", "Secondary fuel filter": "Carry two sets. But a filter you can at least see coming, and you can often get home on a dirty one."}, "malOtro": "Four parts are marked and all four are worth carrying. Ask which one fails with no warning at all, and which one stops the engine the moment it does."}, {"id": "9.7", "tema": "Reading her · The routine, the smoke and the fault", "pos": 16, "tope": 16, "mando": null, "camara": "stbd", "marcas": [{"pieza": "Raw-water pump (impeller)", "color": 3112936}, {"pieza": "Oil filter", "color": 3112936}, {"pieza": "Secondary fuel filter", "color": 3112936}, {"pieza": "Engine-start battery", "color": 3112936}], "h": "What you do, and when", "p": ["<b>Everything on this engine either gets checked on a rhythm or gets found out about at sea.</b>", "<b>Before every trip · the six letters.</b> That is the WOBBLE, and it is the whole of what you do before you leave. <b>Two minutes.</b>", "<b>Monthly, or thereabouts.</b> Drain the water separator bowl. Look at the stern gland and give the greaser a turn. Check the battery terminals, and the electrolyte if they are the kind you can open.", "<b>Annually · the full service.</b> Engine oil and its filter. <b>Both</b> fuel filters. The gearbox oil. Anodes. Coolant strength. Every electrical connection cleaned and remade. <b>And the impeller — changed even if it looks perfect</b>, because rubber hardens with age and not just with use.", "<i>Once a season is what most people do, and that is a habit rather than a figure. Your engine's book gives the interval that counts, and it is the one to follow. What is not in dispute is that you do not wait for it to fail: it fails suddenly and it takes the cooling with it.</i>", "<b>Every two or three years.</b> Have the starter motor serviced, and have the injectors tested. Neither is a job you can do, and neither can be judged from outside — <b>which is exactly why they go on a clock instead of on a symptom.</b>", "<b>And laying her up, which is a service of its own. Change the oil immediately before winter, not after it.</b> Used oil is acidic, and leaving it to sit in the engine for six months eats bearings while the boat is on the hard doing nothing. Then run her to circulate the clean oil.", "<b>Fill the fuel tank.</b> A full tank has no room for the air that condenses into the water that feeds diesel bug. <b>And if you are prone to bug, this is when the biocide goes in</b> — you have a whole winter for it to work.", "<b>Flush and drain the seawater circuit, take the impeller out and store it flat</b>, so it does not set in the shape of its housing. Close the seacocks. Check the antifreeze strength. Grease the stern tube. Batteries fully charged and kept that way. <b>Seal the exhaust and the air intake</b> against damp and things that nest.", "<b>And leave a note of what you have done</b>, because in April you will not remember, and the impeller you took out is not in the engine."], "q": "<b>She is coming out for the winter. Click the part you take out and store flat.</b>", "acierto": ["Raw-water pump (impeller)"], "bien": "<b>The impeller.</b> Left in its housing all winter the rubber sets in the bent shape it was squeezed into, and it will pump badly from the first turn in the spring. <b>Out, flat, and a note on the key.</b>", "mal": {"Oil filter": "It gets changed before the winter, not stored — and the oil with it, because used oil is acidic and sits there for six months.", "Secondary fuel filter": "Changed at the annual service. Nothing about a winter does anything to it.", "Engine-start battery": "It comes out on a lot of boats and gets kept charged — a good habit, but nothing about it needs storing flat."}, "malOtro": "One of the four is made of rubber, and rubber remembers the shape you leave it in."}, {"id": "9.8", "tema": "Reading her · The routine, the smoke and the fault", "pos": 16, "tope": 16, "mando": null, "camara": "iso", "h": "Read the symptom", "p": ["<b>Fourteen symptoms, one at a time. Each one has more than one honest answer — so the question is not what could be wrong. It is what you look at first.</b>", "<b>Free before cheap, cheap before awkward.</b>"], "banco": "AVERIAS", "casos": [{"caso": "A", "q": "<i>No cooling water is coming out of the exhaust.</i> <b>Where do you look first?</b>", "opciones": ["The seacock — it costs two seconds and no tools", "The strainer — lift the lid and look into the basket", "The impeller — take the pump cover off", "The thermostat — it is the cooling system after all"], "acierto": ["The seacock — it costs two seconds and no tools"], "bien": "<b>All three of the first answers are on the list, and the seacock is the free one.</b> The impeller is the commonest to actually fail, and it is still last — because half the time you would have found the answer without touching a tool.", "mal": {"The strainer — lift the lid and look into the basket": "<b>Second, and also free.</b> But you can see whether a seacock is open from where you are standing, and a lid has to come off.", "The impeller — take the pump cover off": "<b>The right part far too early.</b> It fails more often than the other two, and of the three on this list, it is the only one that costs you a cover, a gasket and an hour.", "The thermostat — it is the cooling system after all": "It is the <b>other</b> cooling system. Nothing at the exhaust is telling you about the sealed circuit."}}, {"caso": "B", "q": "<i>The engine is overheating and the temperature alarm sounds.</i> <b>Where do you look first?</b>", "opciones": ["The free end of the sea side — the seacock, then the strainer", "The impeller, which is the commonest thing to actually fail", "The heat exchanger, which is where the two circuits meet", "The freshwater pump, which moves the coolant"], "acierto": ["The free end of the sea side — the seacock, then the strainer"], "bien": "<b>The two that cost nothing, and they are both on the sea side.</b> Everything the sealed circuit does depends on seawater arriving to take the heat away — and you can see whether a seacock is open, and look into a strainer, without a tool. <b>After those two the order stops following the circuit and starts following the cost: the thermostat is small and you can get at it, and the impeller means a cover, a gasket and an hour.</b> <i>Seacock, strainer, thermostat, impeller, heat exchanger.</i>", "mal": {"The impeller, which is the commonest thing to actually fail": "<b>Commonest is not first.</b> It is fourth here, behind two checks that cost nothing and one that is small and accessible — and half the time you would have finished before you got to it.", "The heat exchanger, which is where the two circuits meet": "Furred tubes do this, and it is a real answer. <b>It is also the most awkward thing on the list</b>, which is exactly why it is last.", "The freshwater pump, which moves the coolant": "Also on the list, and it is driven by the belt you can press with a thumb — which is exactly the sort of check that comes before this one."}}, {"caso": "C", "q": "<i>You have just changed the fuel filter and now she will not start.</i> <b>Where do you look first?</b>", "opciones": ["Air in the fuel — bleed her with the lift pump", "The filter you fitted, in case it is the wrong one", "The starter motor, since she is turning but not firing", "The fuel tank, in case you ran it dry doing the job"], "acierto": ["Air in the fuel — bleed her with the lift pump"], "bien": "<b>You opened the system, so you let air in.</b> That is not a fault, it is a consequence — and bleeding is the job you learned for exactly this moment. <b>Diagnosis is sometimes just remembering what you did five minutes ago.</b>", "mal": {"The filter you fitted, in case it is the wrong one": "Worth a thought if bleeding does not work. But a wrong filter usually still passes fuel, and air definitely does not.", "The starter motor, since she is turning but not firing": "If she is turning, the starter has done its whole job. <b>Read the symptom again.</b>", "The fuel tank, in case you ran it dry doing the job": "Then you would have air in the fuel, which is the answer above by a longer road."}}, {"caso": "D", "q": "<i>The starter clicks once and nothing turns, and the batteries test fine.</i> <b>Where do you look first?</b>", "opciones": ["The connections — and the earth strap is the half nobody checks", "The battery, which must be flat under load", "The starter motor, which has failed", "The isolator switch, which is off"], "acierto": ["The connections — and the earth strap is the half nobody checks"], "bien": "<b>A click with a good battery is a connection until proved otherwise.</b> The current is not failing to leave — it is failing to get home. The way out is a red cable everybody looks at; the way back is a black strap bolted to the block, and <b>that is the one that corrodes</b>.", "mal": {"The battery, which must be flat under load": "You were told it tests fine. <b>Believe the measurement you have.</b>", "The starter motor, which has failed": "The most expensive thing to replace and the least likely to be wrong — and the click says the solenoid at least got a signal.", "The isolator switch, which is off": "Then you would get nothing at all. <b>A click means current reached the solenoid.</b>"}}, {"caso": "E", "q": "<i>There is water in the clear bowl under the fuel filter.</i> <b>What do you do?</b>", "opciones": ["Drain the bowl — that is what the separator is for", "Change the whole filter element straight away", "Empty and clean the fuel tank", "Add biocide and carry on"], "acierto": ["Drain the bowl — that is what the separator is for"], "bien": "<b>It is doing its job.</b> The bowl is where the water is supposed to collect so that you can see it and get rid of it — free, in a minute, with a tap. <b>Water in the diesel is the number one cause of engine stoppage, and this is the whole defence against it.</b>", "mal": {"Change the whole filter element straight away": "Not yet, and it is the expensive version of draining a bowl. <b>If it keeps filling, then you have a tank problem</b> — and then this matters.", "Empty and clean the fuel tank": "That is where it ends up if the bowl keeps filling. It is the most awkward thing on the list and you do not start there.", "Add biocide and carry on": "Biocide kills the bug that lives in the water. <b>It does not remove the water</b>, and the water is what you can see."}}, {"caso": "F", "q": "<i>No charge to the batteries while motoring.</i> <b>Where do you look first?</b>", "opciones": ["The belt — press it with a thumb before anything else", "The alternator, which is what makes the charge", "The split-charge relay, which decides where it goes", "The battery, which may no longer take a charge"], "acierto": ["The belt — press it with a thumb before anything else"], "bien": "<b>The alternator is belt-driven, and a belt is free to check.</b> Slack, glazed or gone and it turns slower than the engine turns it — so it charges less, and quietly. <b>You look at the cheap end of the chain first.</b>", "mal": {"The alternator, which is what makes the charge": "On the list and probably next. But it is turned by something you can check with a thumb in five seconds.", "The split-charge relay, which decides where it goes": "That is the fault when <b>one</b> bank charges and the other does not. You were told none of them is.", "The battery, which may no longer take a charge": "A tired battery still takes some charge. <b>None at all points further up the chain.</b>"}}, {"caso": "G", "q": "<i>Black smoke from the exhaust under load.</i> <b>Where do you look first?</b>", "opciones": ["The air filter — a minute, and no tools", "The turbocharger, which may not be delivering", "The injectors, which may be dribbling instead of misting", "The piston rings, which let oil into the chamber"], "acierto": ["The air filter — a minute, and no tools"], "bien": "<b>Air first, fuel second, and that order is the lesson.</b> Black is fuel burning badly, and <b>two of the reasons are yours to check</b> — and one end of those two is a filter you can look at in a minute while the other is a workshop.", "mal": {"The turbocharger, which may not be delivering": "Same side of the problem as the filter, and far harder to look at. <b>Do the free half of the air side first.</b>", "The injectors, which may be dribbling instead of misting": "The right answer once the air side is clean, and workshop work when it is.", "The piston rings, which let oil into the chamber": "<b>That is blue smoke.</b> Black has no oil in it."}}, {"caso": "H", "q": "<i>The oil-pressure alarm sounds on passage.</i> <b>What do you do?</b>", "opciones": ["Stop the engine, then look at the level on the dipstick", "Carry on to harbour and look at it there", "Suspect the pressure sender, since the engine sounds fine", "Change the oil filter, which is the usual cause"], "acierto": ["Stop the engine, then look at the level on the dipstick"], "bien": "<b>This is the one alarm you obey before you understand it.</b> An engine running without oil pressure melts its bearings in minutes, and the cheapest possible check — the level — is thirty seconds away once she is stopped.", "mal": {"Carry on to harbour and look at it there": "<b>You may not have an engine when you get there.</b> This is the alarm that costs the most to ignore.", "Suspect the pressure sender, since the engine sounds fine": "It might well be the sender. <b>You find that out with the engine stopped</b>, and it costs you nothing to be wrong that way round.", "Change the oil filter, which is the usual cause": "A loose filter is a real cause — of a leak, which shows up as a level. <b>Look at the level first.</b>"}}, {"caso": "I", "q": "<i>She died under load and she had not overheated.</i> <b>Where do you look first?</b>", "opciones": ["The fuel — and the tank gauge before the filters", "The primary filter and its water bowl", "The lift pump, and bleed her through", "Serious mechanical failure inside the engine"], "acierto": ["The fuel — and the tank gauge before the filters"], "bien": "<b>Almost always air in the fuel, and there are two ways it gets there: clogged filters, or a tank run dry.</b> One of those you can rule out by looking at a gauge without opening anything. <b>Free before cheap.</b>", "mal": {"The primary filter and its water bowl": "Second, and a very good answer — but it means opening the fuel system, and a gauge does not.", "The lift pump, and bleed her through": "That is the <b>cure</b> once you know it is air. It is not where you look.", "Serious mechanical failure inside the engine": "<b>Serious mechanical failure announces itself</b> — noise, smell, smoke. An engine that simply stops is nearly always being starved."}}, {"caso": "J", "q": "<i>The note of the exhaust has changed and sounds harsher.</i> <b>What do you do?</b>", "opciones": ["Look over the stern for water, and be ready to shut down", "Check the strainer for weed", "Take the pump cover off and look at the impeller", "Carry on — exhaust note changes with load"], "acierto": ["Look over the stern for water, and be ready to shut down"], "bien": "<b>On a water-cooled exhaust the tune changes when the cooling water stops.</b> The look over the stern costs nothing and settles it in two seconds — and if there is no water, everything after that is the seacock, the strainer and the impeller in that order.", "mal": {"Check the strainer for weed": "On the list, and after the look that tells you whether there is a problem at all.", "Take the pump cover off and look at the impeller": "The awkward end, and you have not yet spent the two free seconds that tell you whether to bother.", "Carry on — exhaust note changes with load": "It does. <b>But a harsher note with no change of throttle is the sound of an exhaust running dry</b>, and that is the one you check."}}, {"caso": "K", "q": "<i>The starting battery is flat again after a night at anchor.</i> <b>Where do you look first?</b>", "opciones": ["The split-charge relay, which should have separated the banks", "The starting battery, which must be old", "The isolator switch, which somebody left on", "The alternator, which is not charging enough"], "acierto": ["The split-charge relay, which should have separated the banks"], "bien": "<b>The starting battery went flat while the domestic loads ran, so the two banks were still joined.</b> That is what the relay exists to prevent. <b>Suspect it and its wiring before you condemn a battery</b> — a battery is the expensive answer and this is the cheap one.", "mal": {"The starting battery, which must be old": "It is on the list, and it is the most expensive thing to be wrong about. <b>Rule out the free explanation first.</b>", "The isolator switch, which somebody left on": "Also on the list and also worth two seconds. But an isolator left on does not explain why the <b>starting</b> bank is the one that emptied.", "The alternator, which is not charging enough": "Then you would have noticed while motoring. The symptom is about a night at anchor, with the engine off."}}, {"caso": "L", "q": "<i>She cranks slowly and laboriously, and the battery is newly charged.</i> <b>Where do you look first?</b>", "opciones": ["Both heavy cables, at both ends — positive feed and earth strap", "The battery, which cannot be as charged as you think", "The starter motor, which is dragging", "The engine itself, which may be seized"], "acierto": ["Both heavy cables, at both ends — positive feed and earth strap"], "bien": "<b>Slow cranking with a good battery is voltage dropping on the way.</b> Hundreds of amps go through two thick cables and four connections, and a corroded one turns current into heat instead of into turning. <b>Clean, tight, and greased — and it costs a spanner.</b>", "mal": {"The battery, which cannot be as charged as you think": "You were told it is. <b>A newly charged battery that cranks slowly is telling you about the road, not the source.</b>", "The starter motor, which is dragging": "On the list, and it is the part you send away. Check the four connections that feed it first.", "The engine itself, which may be seized": "A seizing engine does not crank slowly — it does not crank."}}, {"caso": "M", "q": "<i>Water comes out of the exhaust, but she still overheats.</i> <b>Where do you look first?</b>", "opciones": ["The belt, then the thermostat — the free one first", "The heat exchanger, whose tubes have furred up", "The freshwater pump, which has failed", "The raw-water strainer, which must be partly blocked"], "acierto": ["The belt, then the thermostat — the free one first"], "bien": "<b>Water is arriving, so the sea side is doing its job — the fault is in the sealed circuit.</b> And the first thing you touch is the belt — not because a belt is cheap, but because <b>the belt is what drives the circulating pump</b>: one thumb answers two questions at once, whether the belt is slipping and whether the pump is being turned. <b>Then the thermostat, small and cheap. The exchanger is the expensive end.</b> <i>It is the same rule as the charging fault: you check the belt before you check what the belt drives.</i>", "mal": {"The heat exchanger, whose tubes have furred up": "A real cause and a slow one, and the most awkward of the three to get at. It comes after the free checks.", "The freshwater pump, which has failed": "It is driven by the belt you have not pressed yet.", "The raw-water strainer, which must be partly blocked": "<b>Water is coming out of the exhaust.</b> The sea side has already told you it is working."}}, {"caso": "N", "q": "<i>Water reaches the pump but nothing circulates.</i> <b>Where do you look first?</b>", "opciones": ["The impeller — this one really is the impeller", "The seacock, which may be half shut", "The strainer, which may be blocked", "The belt, which may be slipping"], "acierto": ["The impeller — this one really is the impeller"], "bien": "<b>Sometimes the list is one part long, and this is that symptom.</b> Water is arriving at the pump, so everything upstream is fine; nothing is leaving it, so the thing that pushes it has failed. <b>Free before cheap does not mean never getting to the awkward one — it means arriving there having ruled the others out.</b>", "mal": {"The seacock, which may be half shut": "<b>Water reaches the pump.</b> It got past the seacock to do that.", "The strainer, which may be blocked": "Same answer: it got past the strainer too. <b>Read what the symptom already rules out.</b>", "The belt, which may be slipping": "Worth a thought — but a slipping belt would have taken your charging with it, and you would have seen that first."}}]}, {"id": "9.9", "tema": "Reading her · The routine, the smoke and the fault", "pos": 16, "tope": 16, "mando": null, "camara": "iso", "h": "The compartment is open", "p": ["<b>This is what it looks like.</b>", "The boards are up, the engine is there, and somebody is going to point at things and ask you what they are. Then they are going to ask you what the smoke means, and how you would change a filter, and how you would bleed it, and what you would do if no water came out of the exhaust.", "<b>You have done all of it.</b> Eight phases of what the parts are and what each one does. Eleven jobs done with your hands, in order, with the reason for every step. The three colours and where each one sends you. A symptom, and the short list in the right order that it points to.", "<b>And none of it was memorised.</b> You built the engine one piece at a time and every piece arrived because the one before it needed it — which is why, standing in front of a real one with the boards up, the questions are about something you have already seen.", "<b>One last question, and it is the one you will actually be asked.</b>"], "q": "<b>Your examiner points at the engine and says: «Tell me what const TOT = 9;
const FICHERO = "c31-p3-reading-her.html";

let FIG = null, MONTAJE = null, ANGULO = null, ORDEN = null, TALLER = null, HUMO = null;

let TODO = false;

let hayNuevas = false;

let iPaso = 0;
let iPZ = 0, iCaso = 0, RESP = 0;

function barajaEstable(lista, semilla) {
  const out = lista.slice();
  let n = 0;
  for (let k = 0; k < semilla.length; k++) n = (n * 31 + semilla.charCodeAt(k)) >>> 0;
  for (let i = out.length - 1; i > 0; i--) {
    n = (n * 1103515245 + 12345) >>> 0;
    const j = n % (i + 1);
    const t = out[i]; out[i] = out[j]; out[j] = t;
  }

  let igual = true;
  for (let k = 0; k < out.length; k++) if (out[k] !== lista[k]) { igual = false; break; }
  if (igual) out.push(out.shift());
  return out;
}

function arrancaFigura(){
  if (typeof Motor3D === "undefined" || Motor3D.error) {
    document.getElementById("cargando").textContent =
      "The 3-D engine could not start in this browser.";
    return false;
  }
  FIG = Motor3D.montar(document.getElementById("escena"));
  document.getElementById("escena").classList.add("listo");
  return true;
}

const PM_LUCES = [["oil","OIL"], ["temp","TEMP"], ["charge","CHG"]];
function pintaPanel(cfg){
  const caja = document.getElementById("panelMotor");
  if (!caja) return;
  const antes = caja.hidden;
  if (!cfg) { caja.hidden = true; if (!antes) avisaDelTamano(); return; }
  const fila = caja.querySelector(".pmLuces");
  if (!fila.children.length) {
    for (const [k, rot] of PM_LUCES) {
      const d = document.createElement("div");
      d.className = "pmLuz"; d.setAttribute("data-luz", k);
      d.innerHTML = '<i></i><b>' + rot + '</b>';
      fila.appendChild(d);
    }
  }
  for (const [k] of PM_LUCES)
    fila.querySelector('[data-luz="' + k + '"]').classList.toggle("on", !!cfg[k]);
  const f = Math.max(0, Math.min(1, cfg.aguja == null ? 0 : cfg.aguja));
  caja.querySelector(".pmAguja b").style.left = (f * 100).toFixed(1) + "%";
  caja.hidden = false;
  if (antes) avisaDelTamano();
}

function avisaDelTamano(){
  if (typeof window.dispatchEvent === "function")
    window.dispatchEvent(new Event("resize"));
}

let iP = 0;
function vaA(k){
  if (!(k >= 0 && k < PZ.length)) return false;
  iPZ = k; iCaso = 0; TODO = false; pinta(); return true;
}
function vaPantalla(k){ return vaA(k); }

function pinta(){
  iP = iPZ;
  const p = PZ[iPZ];
  pintaPanel(p.panel || null);
  document.getElementById("hTit").textContent = p.tema;
  document.getElementById("hN").textContent = (iPZ + 1) + " / " + TOT;

  if (FIG) {

    const nuevasDe = (donde) => {
      if (typeof MONTAJE_PIEZAS === "undefined") return [];
      const ahora = MONTAJE_PIEZAS[donde] || [];
      const antes = (iPZ > 0 && PZ[iPZ - 1] && MONTAJE_PIEZAS[PZ[iPZ - 1].pos])
        ? MONTAJE_PIEZAS[PZ[iPZ - 1].pos] : [];

      const base = (donde !== p.pos) ? (MONTAJE_PIEZAS[p.pos] || []) : antes;
      const fuera = {};
      base.forEach(n => { fuera[n] = 1; });
      return ahora.filter(n => !fuera[n]);
    };
    const pintaAtenuado = (donde) => {
      if (!FIG.atenua) return;
      if (TODO) { FIG.atenua(null); return; }
      const nuevas = nuevasDe(donde);
      if (!nuevas.length) { FIG.atenua(null); return; }
      FIG.atenua(nuevas);

      if (FIG.seVenDestacadas && !FIG.seVenDestacadas()) { FIG.atenua(null); hayNuevas = false; }
    };
    MONTAJE = MMontaje({ figura: FIG, tope: p.tope, inicio: p.pos,
                         alMover: (n) => pintaAtenuado(n) });
    pintaAtenuado(p.pos);
    hayNuevas = nuevasDe(p.pos).length > 0;

    ANGULO = null;
    HUMO = null;
    if (p.mando === "humo" && typeof MHumo === "function") {
      HUMO = MHumo({ figura: FIG, inicio: p.humo || null });
    }
    if (p.mando === "angulo") {
      ANGULO = MAngulo({ figura: FIG, inicio: p.angulo || 0 });
    } else if (p.angulo != null && FIG.verAngulo) {
      FIG.verAngulo(p.angulo);
    }

    if (FIG.corte) FIG.corte(p.corte ? 1 : 0);
    if (FIG.verCamara) FIG.verCamara(p.camara || "iso", false);

    if (p.enfoque && FIG.enfocar) FIG.enfocar(p.enfoque, false, !!p.cerca);

    if (FIG.enMarcha) FIG.enMarcha(!!p.marcha);

    if (FIG.verResaltadas) FIG.verResaltadas(p.marcas || []);

    if (FIG.verHumo && p.mando !== "humo") FIG.verHumo(p.humo || null);
  }

  const caso = (p.casos && p.casos[iCaso]) || null;

  if (FIG && p.pasos && typeof MTaller === "function") {

    const quiero = iPaso;
    TALLER = MTaller({ figura: FIG, pasos: p.pasos, fijo: p.fijo, camara: p.camara,
                       alPaso: function (n) { iPaso = n; } });
    TALLER.vaA(quiero);
  }

  let html = p.pasos ? "" : ("<h2>" + p.h + "</h2>");

  if (p.pasos && TALLER) {
    const n = TALLER.donde(), tot = TALLER.cuantos();
    html += '<div class="taller">'
      + '<div class="tPaso"><b>Step ' + (n + 1) + ' of ' + tot + '</b></div>'
      + '<div class="tTexto">' + p.pasos[n].t + '</div>'
      + '<div class="tNav">'
      + '<button class="tBtn" id="tAnt"' + (n ? "" : " disabled") + '>&larr; Back</button>'
      + '<button class="tBtn" id="tSig"'
      + (n === tot - 1 ? " disabled" : "") + '>Next step &rarr;</button>'
      + '</div></div>';
  }
  for (const t of p.p) html += "<p>" + t + "</p>";

  if (FIG && FIG.atenua && p.mando !== "humo" && !p.pasos && hayNuevas) {
    html += '<div class="verTodo"><button id="bTodo" aria-pressed="' + (TODO ? "true" : "false")
      + '">' + (TODO ? "Show me just this step" : "Show me everything") + '</button></div>';
  }

  if (FIG && p.mando === "montaje") {
    html += '<div class="montaje"><span class="et">Assembly</span>'
      + '<input type="range" id="mSl" min="0" max="' + p.tope
      + '" step="1" value="' + p.pos + '" aria-label="Assembly step">'
      + '<span class="v" id="mV"></span></div>';
  }

  if (FIG && p.mando === "humo" && HUMO) {
    html += '<div class="montaje humoSel"><span class="et">Smoke</span>'
      + '<div class="humoBtns" id="hB">';
    for (const c of HUMO.colores()) {
      html += '<button class="humoBtn" data-c="' + c + '"'
        + (c === HUMO.cual() ? ' aria-pressed="true"' : ' aria-pressed="false"')
        + '>' + c.charAt(0).toUpperCase() + c.slice(1) + '</button>';
    }
    html += '</div><span class="v" id="hV"></span></div>';
  }
  if (FIG && p.mando === "angulo") {

    html += '<div class="montaje"><span class="et">Crank</span>'
      + '<input type="range" id="aSl" min="0" max="720" step="5" value="'
      + (p.angulo || 0) + '" aria-label="Crank angle">'
      + '<span class="v" id="aV"></span></div>';
  }

  if (p.orden && typeof MOrden === "function") {
    ORDEN = MOrden({ piezas: barajaEstable(p.orden, p.id), orden: p.orden });
  }

  const q = caso ? caso.q : p.q;

  const OPS = (caso && caso.opciones) || p.opciones || null;
  if (p.orden && ORDEN) {
    html += '<div class="pregunta">' + p.q + "</div>";
    html += '<div class="orden" id="ord">';
    for (const it of ORDEN.lista()) {
      html += '<button class="orden-it" data-it="' + it.replace(/"/g, "&quot;") + '">'
        + '<span class="n"></span>' + it + "</button>";
    }
    html += "</div>";
    html += '<div class="veredicto" id="ver" hidden></div>';
  }

  if (q && !p.orden) {
    if (caso) {
      html += '<div class="caso"><b>Case ' + caso.caso + '</b> &#183; '
        + (iCaso + 1) + " of " + p.casos.length + "</div>";
    }
    html += '<div class="pregunta">' + q + "</div>";
    if (OPS) {
      html += '<div class="mx-ops">';
      for (let k = 0; k < OPS.length; k++) {
        html += '<button class="mx-op" data-k="' + k + '">'
          + OPS[k] + "</button>";
      }
      html += "</div>";
    }
    html += '<div class="veredicto" id="ver" hidden></div>';
    if (caso && iCaso < p.casos.length - 1) {
      html += '<div class="nav"><button id="otroCaso" hidden>'
        + "Next case &#8594;</button></div>";
    }
  }
  const pane = document.getElementById("pane");
  pane.innerHTML = html;
  pane.scrollTop = 0;

  const tS = document.getElementById("tSig"), tA = document.getElementById("tAnt");
  if (tS) tS.addEventListener("click", function () {
    if (TALLER) { iPaso = TALLER.siguiente(); pinta(); }
  });
  if (tA) tA.addEventListener("click", function () {
    if (TALLER) { iPaso = TALLER.anterior(); pinta(); }
  });

  const sl = document.getElementById("mSl");
  if (sl && MONTAJE) {
    const v = document.getElementById("mV");
    const di = () => { v.textContent = MONTAJE.ensena(); };
    di();
    sl.addEventListener("input", () => { MONTAJE.mueve(+sl.value); di(); });
  }
  const al = document.getElementById("aSl");
  if (al && ANGULO) {
    const v = document.getElementById("aV");
    const di = () => { v.textContent = ANGULO.ensena(); };
    di();
    al.addEventListener("input", () => { ANGULO.mueve(+al.value); di(); });
  }

  const hb = document.getElementById("hB");
  if (hb && HUMO) {
    const v = document.getElementById("hV");
    const di = () => {
      v.textContent = HUMO.ensena();
      hb.querySelectorAll(".humoBtn").forEach(function (b) {
        b.setAttribute("aria-pressed", b.dataset.c === HUMO.cual() ? "true" : "false");
      });
    };
    di();
    hb.addEventListener("click", function (e) {
      const b = e.target.closest(".humoBtn");
      if (!b) return;
      HUMO.mueve(b.dataset.c);
      di();
    });
  }
  const bt = document.getElementById("bTodo");
  if (bt) bt.addEventListener("click", function () { TODO = !TODO; pinta(); });

  const oc = document.getElementById("otroCaso");
  if (oc) oc.addEventListener("click", function () { iCaso++; pinta(); });

  if (ORDEN) {
    const pinta1 = () => {
      document.querySelectorAll(".orden-it").forEach(function (b) {
        const n = ORDEN.numeroDe(b.dataset.it);
        b.querySelector(".n").textContent = n ? n : "";
        b.classList.toggle("puesto", n > 0);
      });
    };
    pinta1();
    document.querySelectorAll(".orden-it").forEach(function (b) {
      b.addEventListener("click", function () {
        ORDEN.toca(b.dataset.it);
        pinta1();
        if (ORDEN.completo()) juzgaOrden();
      });
    });
  }

  if (FIG && q && !OPS && FIG.alSeleccionar) {
    FIG.alSeleccionar(function (nombre) { juzga(nombre); });
  }
  document.querySelectorAll(".mx-op").forEach(function (b) {
    b.addEventListener("click", function () { juzga(OPS[+b.dataset.k]); });
  });

  if (typeof vistoPon === "function") vistoPon(FICHERO, iPZ);
  progreso();
  navega();
}

function juzgaOrden(){
  const p = PZ[iPZ];
  const bien = ORDEN.acierta();
  if (bien === null) return;
  const caja = document.getElementById("ver");
  if (!caja) return;
  caja.hidden = false;
  caja.className = "veredicto " + (bien ? "bien" : "mal");
  caja.innerHTML = bien ? p.bien : p.mal;
  RESP++;
  document.getElementById("fLog").textContent = RESP + " answers logged";
}

function juzga(dada){
  const p = PZ[iPZ];
  const caso = (p.casos && p.casos[iCaso]) || null;
  const fuente = caso || p;
  if (!fuente.q) return;
  const bien = (fuente.acierto || []).indexOf(dada) >= 0;
  const caja = document.getElementById("ver");
  if (!caja) return;
  caja.hidden = false;
  caja.className = "veredicto " + (bien ? "bien" : "mal");
  caja.innerHTML = bien ? fuente.bien
    : ((fuente.mal && fuente.mal[dada]) || fuente.malOtro);

  const oc = document.getElementById("otroCaso");
  if (oc && bien) oc.hidden = false;
  RESP++;
  document.getElementById("fLog").textContent = RESP + " answers logged";
}

function progreso(){
  const pr = document.getElementById("prog");
  pr.innerHTML = "";
  for (let k = 0; k < TOT; k++) {
    const b = document.createElement("i");
    b.className = (k === iPZ ? "on" : (k < iPZ ? "done" : ""));

    b.title = "Screen " + (k + 1) + " of " + TOT + (PZ[k] && PZ[k].h ? " · " + PZ[k].h : "");
    b.setAttribute("data-va", k);
    b.onclick = () => { vaA(k); };
    pr.appendChild(b);
  }
  document.getElementById("barCont").textContent = (iPZ + 1) + " / " + TOT;
}

function navega(){
  let h = '<div class="nav">';
  if (iPZ > 0) h += '<button id="ant">&#8592; Back</button>';
  if (iPZ < TOT - 1) h += '<button id="sig">Next &#8594;</button>';
  h += "</div>";
  document.getElementById("navPie").innerHTML = h;
  const a = document.getElementById("ant"), s = document.getElementById("sig");

  if (a) a.addEventListener("click", function () { iPZ--; iCaso = 0; TODO = false; pinta(); });
  if (s) s.addEventListener("click", function () { iPZ++; iCaso = 0; TODO = false; pinta(); });
}

document.getElementById("deCero").addEventListener("click", function () {
  if (typeof vistoOlvida === "function") vistoOlvida(FICHERO);
  iPZ = 0; iCaso = 0; RESP = 0; TODO = false;
  document.getElementById("fLog").textContent = "0 answers logged";
  pinta();
});

if (typeof vistoEmpieza === "function") vistoEmpieza(FICHERO);
arrancaFigura();
iPZ = (typeof vistoPos === "function") ? vistoPos(FICHERO, TOT - 1) : 0;
pinta();
</script>
