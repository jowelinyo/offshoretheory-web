<script>
"use strict";

const NS = "http://www.w3.org/2000/svg";
const D = {W: 1000, H: 620};
let svg = null, gO = null, ESC = 1;
const px = n => n / ESC;

function el(t, at, pa){
  const e = document.createElementNS(NS, t);
  for(const k in at) if(at[k] !== undefined && at[k] !== null) e.setAttribute(k, at[k]);
  (pa || gO || svg).appendChild(e);
  return e;
}
function txt(x, y, s, an, tam, col, peso, fam, pa){
  const e = el("text", {x: x, y: y, "text-anchor": an || "start",
    "pointer-events": "none", "font-size": px(tam || 13),
    fill: col || "var(--lam-ink)", "font-weight": peso || 400,
    "font-family": fam === "mono" ? "var(--f-mono)" : "var(--f-ui)"}, pa);
  e.textContent = s;
  return e;
}
function parte(s, ancho, tam){
  const porLinea = Math.max(6, Math.floor(ancho / (px(tam) * 0.62)));
  const pal = String(s).split(/\s+/);
  const out = [];
  let linea = "";
  pal.forEach(function(p){
    const q = linea ? linea + " " + p : p;
    if(q.length > porLinea && linea){ out.push(linea); linea = p; }
    else linea = q;
  });
  if(linea) out.push(linea);
  return out;
}

function sondaDe(i, j){
  const s = Math.sin(i*12.9898 + j*78.233) * 43758.5453;
  return s - Math.floor(s);
}
function sonda(x, y, v){
  const ent = Math.floor(v), dec = Math.round((v - ent)*10);
  const t = el("text", {x: x, y: y, "text-anchor": "middle",
    "pointer-events": "none", "font-size": px(11.5), "font-style": "italic",
    fill: "var(--carta-sonda)", "font-family": "var(--f-ui)", opacity: .78});
  t.appendChild(document.createTextNode(String(ent)));
  if(dec){
    const u = document.createElementNS(NS, "tspan");
    u.setAttribute("font-size", px(8));
    u.setAttribute("dy", px(3));
    u.textContent = String(dec);
    t.appendChild(u);
  }
}

function interruptor(x, y, w, h, m, on){
  const g = el("g", {"data-boton": "m:" + m.id});
  el("rect", {x: x, y: y, width: w, height: h, rx: px(3), class: "caza",
              fill: on ? "var(--accent-control)" : "var(--carta)",
              stroke: on ? "var(--accent-control)" : "var(--edge-button)",
              "stroke-width": px(1.2)}, g);
  el("rect", {x: x + px(12), y: y + h/2 - px(5), width: px(10), height: px(10),
              rx: px(1), fill: m.tinta, opacity: on ? 1 : .45}, g);
  txt(x + px(30), y + h/2 + px(5), m.n, "start", 13.5,
      on ? "var(--ink-title)" : "var(--lam-dim)", on ? 600 : 400, null, g);

const RAD = Math.PI / 180;
function pos(c){
  return [c.rng * Math.sin(c.brg * RAD), c.rng * Math.cos(c.brg * RAD)];
}

function cortan(a, b, c, d){
  const f = (p, q, r) => (r[1] - p[1])*(q[0] - p[0]) - (q[1] - p[1])*(r[0] - p[0]);
  const d1 = f(c, d, a), d2 = f(c, d, b), d3 = f(a, b, c), d4 = f(a, b, d);
  return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
}
function cortaTierra(p){
  for(let i = 0; i < TIERRA.length - 1; i++)
    if(cortan([0, 0], p, TIERRA[i], TIERRA[i + 1])) return true;
  return false;
}

function cortaNiebla(p){
  const L = Math.hypot(p[0], p[1]);
  if(!L) return false;
  const t = Math.max(0, Math.min(1, (NIEBLA.x*p[0] + NIEBLA.y*p[1]) / (L*L)));
  return Math.hypot(NIEBLA.x - t*p[0], NIEBLA.y - t*p[1]) <= NIEBLA.r;
}
function enSectorCiego(brg){
  const b = ((brg % 360) + 360) % 360;
  return b >= CIEGO[0] && b <= CIEGO[1];
}

function detecta(c, medio){
  const m = MEDIOS.filter(q => q.id === medio)[0];
  if(!m || c.rng > m.rango) return false;
  const p = pos(c);
  if(medio === "vista")
    return !enSectorCiego(c.brg) && !cortaTierra(p) && !cortaNiebla(p);
  if(medio === "oido")  return !!c.ruido;
  if(medio === "radar") return c.rng >= m.muerta && !!c.eco && !cortaTierra(p);
  if(medio === "ais")   return !!c.ais;
  return false;
}
function detectadoPor(c, encendidos){
  return MEDIOS.filter(m => encendidos.indexOf(m.id) >= 0)
               .filter(m => detecta(c, m.id)).map(m => m.id);
}
function cuenta(encendidos){
  return CONTACTOS.filter(c => detectadoPor(c, encendidos).length > 0).length;
}
function matriz(){
  return CONTACTOS.map(function(c){
    return {id: c.id, ve: MEDIOS.filter(m => detecta(c, m.id)).map(m => m.id)};
  });
}

function cascoFigura(id){
  const f = (CASCOS_TIPOS.figuras_de_hoy || {})[id] || (CASCOS_TIPOS.tipos || {})[id];
  if(!f) throw new Error("cascos-tipos.json no tiene el dibujo «" + id + "»");
  return f;
}

function puntosPlanta(f, L, P){
  const M = L*f.semimanga;
  return f.planta.map(q => P(L*q[0], M*q[1]));
}
function caminoRedondo(q){
  return "M" + q.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L") + " Z";
}

function caminoFino(q){
  return "M" + q.map(p => p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" L") + " Z";
}

function caminoCrudo(q){
  return "M" + q.map(p => p[0] + "," + p[1]).join(" L") + " Z";
}

function cascoEnPlanta(x, y, rumbo, tinta, L, quien, opt){
  const o = opt || {};
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const P = o.este ? (av, tr) => [x + cs*av - sn*tr, y + sn*av + cs*tr]
                   : (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  const q = puntosPlanta(cascoFigura("nueve"), L, P);
  const gr = el("g", {"data-barco": quien});
  el("path", {d: caminoRedondo(q), fill: tinta, opacity: .95, "data-buque": "1"}, gr);
  return L;
}

function plantaBarco(x, y, rumbo, tinta, op, largo, padre){
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const L = largo || px(24);
  const P = (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];

  el("path", {d: caminoRedondo(puntosPlanta(cascoFigura("generico"), L, P)), fill: tinta,
              opacity: op === undefined ? .95 : op, "data-buque": "1"}, padre);
}

function cascoVelero(x, y, rumbo, tinta, L, padre){
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const P = (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  el("path", {d: caminoRedondo(puntosPlanta(cascoFigura("velero_fino"), L, P)),
              fill: tinta, opacity: .95, "data-buque": "1"}, padre);
}

function aparejoDeVelero(x, y, rumbo, tinta, L, lado, opt){
  const o = opt || {};
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const P = (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  const ap = (o.tipo ? cascoFigura(o.tipo) : cascoFigura("velero_fino")).aparejo;
  const a = P(L*ap.palo[0], ap.palo[1] ? lado*L*ap.palo[1] : 0);
  const b = P(L*ap.botavara[0], lado*L*ap.botavara[1]);
  const grueso = o.grueso === undefined ? 3 : o.grueso;
  const palo   = o.palo   === undefined ? 3 : o.palo;
  el("circle", {cx: a[0], cy: a[1], r: palo, fill: tinta}, o.padre);
  el("line", {x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: tinta,
              "stroke-width": grueso, "stroke-linecap": "round",
              "data-botavara": o.marca}, o.padre);
}

function perfilDeCostado(x, y, L, H, b, tinta, padre){
  const q = cascoFigura("costado").perfil.map(p => [x + L*p[0], y - H*b*p[1]]);
  el("path", {d: caminoCrudo(q), fill: tinta, opacity: .95, "data-buque": "1"}, padre);
}

function fuselajeDeCostado(x, y, L, H, tinta, padre){
  const q = cascoFigura("fuselaje").perfil.map(p => [x + L*p[0], y - H*p[1]]);
  el("path", {d: caminoCrudo(q), fill: tinta, opacity: .95, "data-buque": "1"}, padre);
}

function cascoLadeado(x, y, L, tinta, padre){
  const f = cascoFigura("ladeada"), M = L*f.semimanga;
  const q = f.pantalla.map(p => [x + L*p[0], y + (p[2] === "M" ? M : L)*p[1]]);
  el("path", {d: caminoCrudo(q), fill: tinta, opacity: .95, "data-buque": "1"}, padre);
}

function tintaDe(nombre, tinta, o){
  const t = (o && o.tintas) || {};
  return nombre === "casco" ? tinta : (t[nombre] || tinta);
}
function buquePlanta(x, y, rumbo, tinta, L, tipo, opt){
  const o = opt || {}, f = cascoFigura(tipo);
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);

  const P = o.este ? (av, tr) => [x + cs*av - sn*tr, y + sn*av + cs*tr]
                   : (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  const gr = el("g", {"data-barco": o.quien || null, "data-tipo": tipo}, o.padre);
  el("path", {d: caminoFino(puntosPlanta(f, L, P)), fill: tinta,
              opacity: o.op === undefined ? .95 : o.op, "data-buque": "1"}, gr);
  const enPantalla = L*(o.escala || 1);
  (f.detalles || []).forEach(function(dt){
    if(enPantalla < dt.desde_px) return;
    el("path", {d: caminoFino(puntosPlanta({semimanga: f.semimanga, planta: dt.forma}, L, P)),
                fill: tintaDe(dt.tinta, tinta, o), "data-detalle": "1"}, gr);
  });

  if(f.aparejo && !o.este && o.aparejo !== false)
    aparejoDeVelero(x, y, rumbo, tinta, L, o.lado || 1,
                    {tipo: tipo, padre: gr,
                     grueso: o.grueso === undefined ? Math.max(1.2, L*0.025) : o.grueso,
                     palo: o.palo === undefined ? Math.max(1.4, L*0.03) : o.palo,
                     marca: o.marca});
  return gr;
}

function cajaPlanta(L, tipo, rumbo, este){
  const f = cascoFigura(tipo), g = rumbo*Math.PI/180;
  const a = L/2, b = L*f.semimanga;
  const s = Math.abs(Math.sin(g)), c = Math.abs(Math.cos(g));
  return este ? {hx: c*a + s*b, hy: s*a + c*b} : {hx: s*a + c*b, hy: c*a + s*b};
}
function sitiosJunto(x, y, caja, lineas, u){
  const n = lineas.length, w = 6.6*u*Math.max.apply(null, lineas.map(t => t.length));
  return [[x, y + caja.hy + 14*u],
          [x, y - caja.hy - 6*u - (n - 1)*15*u],
          [x + caja.hx + 8*u + w/2, y + 4*u - (n - 1)*7.5*u],
          [x - caja.hx - 8*u - w/2, y + 4*u - (n - 1)*7.5*u]];
}
function cajaQueOcupa(x, y, caja){
  return [x - caja.hx, y - caja.hy, x + caja.hx, y + caja.hy];
}

function colocaRotulo(x0, y0, lineas, o){
  const px = o.px, P = o.puestos, c = o.tapa || null;
  const alto = lineas.length*px(o.renglon || 15);
  const ancho = px(o.porLetra || 6.6)*Math.max.apply(null, lineas.map(t => t.length));
  const orilla = o.orilla ? Math.max(px(o.orilla), ancho/2 + px(16)) : ancho/2 + px(16);
  const izq = orilla, der = o.ancho - orilla;
  const suelo = o.y1 - px(28) - alto, techo = o.y0 + px(20);
  const corte = (a0, a1, b0, b1) => Math.max(0, Math.min(a1, b1) - Math.max(a0, b0));
  const choca = (x, y) => (c !== null && x + ancho/2 > c[0] && x - ancho/2 < c[2]
                           && y + alto > c[1] && y - px(12) < c[3])
    || P.some(q => x + ancho/2 > q[0] && x - ancho/2 < q[2]
                && y + alto + px(4) > q[1] && y - px(16) < q[3]);
  const pisa = (x, y) => (c !== null ? corte(x - ancho/2, x + ancho/2, c[0], c[2])
                                       *corte(y - px(12), y + alto, c[1], c[3]) : 0)
    + P.reduce((s, q) => s + corte(x - ancho/2, x + ancho/2, q[0], q[2])
                             *corte(y - px(16), y + alto + px(4), q[1], q[3]), 0);
  let x = Math.max(izq, Math.min(x0, der));
  let y = Math.max(techo, Math.min(y0, suelo));
  if(o.anillos){
    const cabe = (x, y) => x >= izq - 0.5 && x <= der + 0.5
                        && y >= techo - 0.5 && y <= suelo + 0.5;
    if(choca(x, y)){
      let puesto = false, mejor = {x: x, y: y, a: pisa(x, y)};
      for(let r = 1; r <= 30 && !puesto; r++){
        const v = r*px(9), w = v*0.72;
        const vueltas = [[0, v], [0, -v], [v, 0], [-v, 0],
                         [w, w], [-w, w], [w, -w], [-w, -w]];
        for(let i = 0; i < vueltas.length && !puesto; i++){
          const cx = x + vueltas[i][0], cy = y + vueltas[i][1];
          if(!cabe(cx, cy)) continue;
          if(!choca(cx, cy)){ x = cx; y = cy; puesto = true; }
          else { const a = pisa(cx, cy); if(a < mejor.a) mejor = {x: cx, y: cy, a: a}; }
        }
      }
      if(!puesto){ x = mejor.x; y = mejor.y; }
    }
  } else {
    let mejor = {x: x, y: y, a: pisa(x, y)};
    const apunta = v => { const a = pisa(x, v); if(a < mejor.a) mejor = {x: x, y: v, a: a}; };
    if(choca(x, y) && o.otros) for(const q of o.otros){
      const xa = x, w = Math.max(techo, Math.min(q[1], suelo));
      x = Math.max(izq, Math.min(q[0], der));
      if(!choca(x, w)){ y = w; break; }
      apunta(w);
      x = xa;
    }
    if(choca(x, y)){
      let puesto = false;

      for(let v = y; v <= suelo && !puesto; v += px(9))
        if(!choca(x, v)){ y = v; puesto = true; } else apunta(v);
      for(let v = y; v >= techo && !puesto; v -= px(9))
        if(!choca(x, v)){ y = v; puesto = true; } else apunta(v);
      if(!puesto){ x = mejor.x; y = mejor.y; }
    }
  }
  P.push([x - ancho/2, y - px(12), x + ancho/2, y + alto]);
  return {x: x, y: y};
}

function cedenLasSondas(svg, m){
  const todas = [].slice.call(svg.querySelectorAll("text"));
  const sondas = todas.filter(t => t.getAttribute("fill") === "var(--carta-sonda)");

  const otras = todas.filter(t => sondas.indexOf(t) < 0).map(t => t.getBBox())
    .concat([].map.call(svg.querySelectorAll("path[data-buque]"), p => p.getBBox()))
    .concat([].map.call(svg.querySelectorAll("[data-boya]"), p => p.getBBox()));

  const puestas = [];
  sondas.forEach(function(s){
    const a = s.getBBox();
    if(otras.some(b => a.x < b.x + b.width + m && a.x + a.width + m > b.x
                    && a.y < b.y + b.height + m && a.y + a.height + m > b.y)){ s.remove(); return; }
    if(puestas.some(b => a.x < b.x + b.width && a.x + a.width > b.x
                      && a.y < b.y + b.height && a.y + a.height > b.y)){ s.remove(); return; }
    puestas.push(a);
  });
}

function buquePerfil(x, yAgua, L, tipo, tinta, opt){
  const o = opt || {}, f = cascoFigura(tipo).perfil;
  if(!f) throw new Error("el tipo «" + tipo + "» no tiene perfil");
  const X = a => x + a*L, Y = z => yAgua - z*L, grueso = Math.max(1, L*0.012);
  const gr = el("g", {"data-tipo": tipo, "data-vista": "perfil"}, o.padre);
  el("path", {d: caminoRedondo(f.casco.map(p => [X(p[0]), Y(p[1])])), fill: tinta,
              "data-buque": "1"}, gr);
  f.bloques.forEach(b => el("path", {d: caminoRedondo([[X(b.a[0]), Y(b.z[1])], [X(b.a[1]), Y(b.z[1])],
                                                      [X(b.a[1]), Y(b.z[0])], [X(b.a[0]), Y(b.z[0])]]),
                                     fill: tintaDe("suave", tinta, o)}, gr));
  f.palos.forEach(m => el("line", {x1: X(m.a), y1: Y(m.z[0]), x2: X(m.a), y2: Y(m.z[1]),
                                   stroke: tinta, "stroke-width": grueso}, gr));
  f.perchas.forEach(s => el("line", {x1: X(s.a[0]), y1: Y(s.z), x2: X(s.a[1]), y2: Y(s.z),
                                     stroke: tinta, "stroke-width": grueso}, gr));
  return gr;
}

function envolturaConvexa(P){
  P = P.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo = [], hi = [];
  for(const q of P){ while(lo.length >= 2 && cr(lo[lo.length-2], lo[lo.length-1], q) <= 0) lo.pop(); lo.push(q); }
  for(let i = P.length - 1; i >= 0; i--){ const q = P[i];
    while(hi.length >= 2 && cr(hi[hi.length-2], hi[hi.length-1], q) <= 0) hi.pop(); hi.push(q); }
  hi.pop(); lo.pop(); return lo.concat(hi);
}

function semiDe(f, a){
  let best = 0;
  const q = f.planta;
  for(let i = 0; i < q.length; i++){
    const A = q[i], B = q[(i + 1) % q.length];
    if((A[0] - a)*(B[0] - a) > 0 || A[0] === B[0]) continue;
    const b = A[1] + (B[1] - A[1])*(a - A[0])/(B[0] - A[0]);
    if(b > best) best = b;
  }
  return best;
}
function buqueAspecto(x, yAgua, L, tipo, m, tinta, opt){
  const o = opt || {}, f = cascoFigura(tipo), pf = f.perfil;
  if(!pf) throw new Error("el tipo «" + tipo + "» no tiene perfil");
  const r = m*Math.PI/180, rx = Math.sin(r), ry = -Math.cos(r), dx = Math.cos(r);
  const M = f.semimanga;
  const S = (a, b, z) => [x + (a*rx + b*M*ry)*L, yAgua - z*L];
  const gr = el("g", {"data-tipo": tipo, "data-vista": "aspecto", "data-marcacion": m}, o.padre);

  const cas = pf.casco, cort = (a, arriba) => { let best = null;
    for(let i = 0; i < cas.length; i++){ const A = cas[i], B = cas[(i+1) % cas.length];
      if((A[0] - a)*(B[0] - a) > 0 || A[0] === B[0]) continue;
      const z = A[1] + (B[1] - A[1])*(a - A[0])/(B[0] - A[0]);
      if(best === null || (arriba ? z > best : z < best)) best = z; }
    return best; };
  const a0 = Math.min.apply(null, cas.map(p => p[0])), a1 = Math.max.apply(null, cas.map(p => p[0]));
  const pts = [];
  for(let i = 0; i <= 40; i++){
    const a = a0 + 0.0001 + (a1 - a0 - 0.0002)*i/40;
    const zt = cort(a, true), zb = cort(a, false); if(zt === null) continue;
    const s = semiDe(f, a);
    pts.push(S(a, s, zt), S(a, -s, zt), S(a, s, zb), S(a, -s, zb));
  }
  el("path", {d: caminoRedondo(envolturaConvexa(pts)), fill: tinta, "data-buque": "1"}, gr);
  pf.bloques.map(b => ({b: b, prof: ((b.a[0] + b.a[1])/2)*dx}))
    .sort((A, B) => A.prof - B.prof).forEach(function(q){
      const b = q.b, Q = [];
      b.a.forEach(a => [-b.semiancho, b.semiancho].forEach(v => b.z.forEach(z => Q.push(S(a, v, z)))));
      el("path", {d: caminoRedondo(envolturaConvexa(Q)), fill: tintaDe("suave", tinta, o)}, gr);
    });
  const grueso = Math.max(1, L*0.012);
  pf.palos.forEach(p => { const A = S(p.a, 0, p.z[0]), B = S(p.a, 0, p.z[1]);
    el("line", {x1: A[0], y1: A[1], x2: B[0], y2: B[1], stroke: tinta, "stroke-width": grueso}, gr); });
  pf.perchas.forEach(p => { const A = S(p.a[0], 0, p.z), B = S(p.a[1], 0, p.z);
    el("line", {x1: A[0], y1: A[1], x2: B[0], y2: B[1], stroke: tinta, "stroke-width": grueso}, gr); });
  return gr;
}

const V5 = {ox: 0.540, oy: 0.520, k: 0.115};
let ESCALA = {ox: 0, oy: 0, k: 1};
function fija5(){
  ESCALA.ox = D.W*V5.ox; ESCALA.oy = D.H*V5.oy; ESCALA.k = D.W*V5.k;

function porBrg(brg, r){
  const a = brg*Math.PI/180;

const S5 = {on: {vista: true, oido: false, radar: false, ais: false}};

const BANDAS = [[0.30, "media"], [0.15, "somera"], [0.05, "secante"], [0, "tierra"]];
const FILO = -9;

function apartada(dist){
  const n = TIERRA.length, out = [];
  const nor = [];
  for(let i = 0; i < n - 1; i++){
    const dx = TIERRA[i + 1][0] - TIERRA[i][0], dy = TIERRA[i + 1][1] - TIERRA[i][1];
    const L = Math.hypot(dx, dy) || 1;
    nor.push([-dy/L, dx/L]);
  }
  for(let i = 0; i < n; i++){

    const a = nor[Math.max(0, i - 1)], b = nor[Math.min(nor.length - 1, i)];
    let vx = a[0] + b[0], vy = a[1] + b[1];
    const L = Math.hypot(vx, vy) || 1;
    vx /= L; vy /= L;
    let x = TIERRA[i][0] + vx*dist, y = TIERRA[i][1] + vy*dist;

    if(i === 0 || i === n - 1) x = TIERRA[i][0];
    out.push([x, y]);
  }
  return out;
}
function trazoTierra(dist){
  const q = apartada(dist);

  return "M" + MX(FILO) + "," + MY(q[0][1])
       + " L" + q.map(p => MX(p[0]).toFixed(1) + "," + MY(p[1]).toFixed(1)).join(" L")
       + " L" + MX(FILO) + "," + MY(q[q.length - 1][1]) + " Z";
}

function carta5(){
  el("rect", {x: 0, y: 0, width: D.W, height: D.H, fill: "var(--carta)",

  [[0.30, "media"], [0.15, "somera"]].forEach(function(q){

      if(Math.hypot(mx, my) < 3.15) continue;
      const b = bandaEn([mx, my]);
      if(b === "tierra" || b === "secante") continue;
      sonda(x, y, b === "somera" ? 3 + r1*4 : b === "media" ? 9 + r1*7 : 22 + r1*16);
    }
  }

  const nx = D.W - px(46), ny = px(112);

  el("path", {d: "M" + nx + "," + (ny - px(20)) + " L" + (nx - px(5)) + ","
                + (ny - px(9)) + " L" + (nx + px(5)) + "," + (ny - px(9)) + " Z",

    el("line", {x1: ex + o, y1: ey - px(5), x2: ex + o, y2: ey + px(5),
                stroke: "var(--lam-dim)", "stroke-width": px(1.4)});

  txt(ex + k1/2, ey + px(16), "1 mile", "middle", 11.5, "var(--lam-dim)", 400, "mono");
  txt(D.W - px(26), ey - px(12), "depths in meters", "end", 10.5,
      "var(--lam-dim)", 400, "mono");
}

function dentroDe(p, dist){
  const q = apartada(dist);
  const poli = [[FILO, q[0][1]]].concat(q, [[FILO, q[q.length - 1][1]]]);
  let hay = false;
  for(let i = 0, j = poli.length - 1; i < poli.length; j = i++){
    if((poli[i][1] > p[1]) !== (poli[j][1] > p[1]) &&
       p[0] < (poli[j][0] - poli[i][0])*(p[1] - poli[i][1])
              /(poli[j][1] - poli[i][1]) + poli[i][0]) hay = !hay;
  }
  return hay;
}
function bandaEn(p){
  for(let i = BANDAS.length - 1; i >= 0; i--)
    if(dentroDe(p, BANDAS[i][0])) return BANDAS[i][1];
  return "honda";

const ROT = [];
function radioEnAgua(brg, desde){

  }

function pintaRotulos(){

function sector(r, a0, a1){

function sectorAnillo(r0, r1, a0, a1){
  const A = porBrg(a0, r1), B = porBrg(a1, r1);
  const C = porBrg(a1, r0), E = porBrg(a0, r0);

       + " A" + MR(r1) + "," + MR(r1) + " 0 " + grande + " 1 "

       + " L" + C[0].toFixed(1) + "," + C[1].toFixed(1)
       + " A" + MR(r0) + "," + MR(r0) + " 0 " + grande + " 0 "

function huellaRadar(){
  const m = MEDIOS.filter(q => q.id === "radar")[0];

  el("rect", {x: 0, y: 0, width: D.W, height: D.H, fill: m.tinta,

                px(4) + "," + px(4)});

              "fill-opacity": .16, stroke: "none"});

                  y: p[1] - px(24), width: px(8), height: px(8), rx: px(1),
                  fill: m.tinta});

}

const P5 = {
  h: "Look-out",
  arriba: "Rule 5",

  lamina(){
    fija5();
    ROT.length = 0;
    carta5();
    if(S5.on.ais)   huellaAIS();

           + '<span class="pos">' + String(Math.round(q.c.brg)).padStart(3, "0")
           + "&deg; &middot; " + q.c.rng.toFixed(2) + " M</span>"
           + '<span class="fichas">'
           + q.ve.map(function(id){
               const m = MEDIOS.filter(w => w.id === id)[0];
               return '<i style="background:' + m.tinta + '"></i>';

    } else {

function redibuja(){

}

}

if(typeof ResizeObserver !== "undefined")

 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

const MARCO = {id:"ripa", i:5, paginas:[{f:"ripa-r0-the-nineteen-rules.html",t:"The nineteen rules"},{f:"ripa-r1-application.html",t:"Rule 1 · Application"},{f:"ripa-r2-responsibility.html",t:"Rule 2 · Responsibility"},{f:"ripa-r3-general-definitions.html",t:"Rule 3 · General definitions"},{f:"ripa-r4-application.html",t:"Rule 4 · Application"},{f:"ripa-r5-look-out.html",t:"Rule 5 · Look-out"},{f:"ripa-r6-safe-speed.html",t:"Rule 6 · Safe speed"},{f:"ripa-r7-risk-of-collision.html",t:"Rule 7 · Risk of collision"},{f:"ripa-r8-action-to-avoid-collision.html",t:"Rule 8 · Action to avoid collision"},{f:"ripa-r9-narrow-channels.html",t:"Rule 9 · Narrow channels"},{f:"ripa-r10-traffic-separation-schemes.html",t:"Rule 10 · Traffic separation schemes"},{f:"ripa-r11-application.html",t:"Rule 11 · Application"},{f:"ripa-r12-sailing-vessels.html",t:"Rule 12 · Sailing vessels"},{f:"ripa-r13-overtaking.html",t:"Rule 13 · Overtaking"},{f:"ripa-r14-head-on-situation.html",t:"Rule 14 · Head-on situation"},{f:"ripa-r15-crossing-situation.html",t:"Rule 15 · Crossing situation"},{f:"ripa-r16-action-by-give-way-vessel.html",t:"Rule 16 · Action by give-way vessel"},{f:"ripa-r17-action-by-stand-on-vessel.html",t:"Rule 17 · Action by stand-on vessel"},{f:"ripa-r18-responsibilities-between-vessels.html",t:"Rule 18 · Responsibilities between vessels"},{f:"ripa-r19-restricted-visibility.html",t:"Rule 19 · Conduct of vessels in restricted visibility"}]};
const YO = MARCO.id;
const N = MARCO.paginas.length;
const dosCifras = n => (n < 10 ? "0" : "") + n;
const $ = id => document.getElementById(id);

const LLAVE_NAV = "ripa.nav";
function marcaNav(){ try{ sessionStorage.setItem(LLAVE_NAV, "1"); }catch(e){} }
function veniaDeDentro(){
  try{ return sessionStorage.getItem(LLAVE_NAV) === "1"; }catch(e){ return false; }
}

if(MARCO.i === 0 && !veniaDeDentro()){
  const p = vistoPos(YO, N - 1);
  if(p > 0){ marcaNav(); location.replace(MARCO.paginas[p].f); return; }
}
marcaNav();

vistoEmpieza(YO);
vistoPon(YO, MARCO.i);
if(MARCO.i === N - 1) vistoTermina(YO);

function vaA(i){
  if(i < 0 || i >= N || i === MARCO.i) return;
  marcaNav();
  vistoPon(YO, i);
  location.href = MARCO.paginas[i].f;
}

const CUENTA = MARCO.cuenta || (dosCifras(MARCO.i + 1) + " / " + dosCifras(N));
function ponCuenta(){
  const b = $("barCont");
  if(b && b.textContent !== CUENTA) b.textContent = CUENTA;
}
ponCuenta();
if(typeof MutationObserver !== "undefined" && $("barCont"))
  new MutationObserver(ponCuenta).observe($("barCont"),
    {childList: true, characterData: true, subtree: true});

(function(){
  const pr = $("prog");
  if(!pr || MARCO.sinTira) return;
  pr.innerHTML = "";
  MARCO.paginas.forEach(function(q, i){
    const b = document.createElement("i");
    if(i === MARCO.i) b.className = "on"; else if(i < MARCO.i) b.className = "done";
    b.title = "Screen " + (i + 1) + " of " + N + " · " + q.t;

    b.setAttribute("data-va", i);
    b.onclick = function(){ vaA(i); };
    pr.appendChild(b);
  });
})();

const LLAVE_LOG = "ripa.log";
function leeLog(){
  try{ return parseInt(localStorage.getItem(LLAVE_LOG) || "0", 10) || 0; }
  catch(e){ return 0; }
}
function ponLog(n){ try{ localStorage.setItem(LLAVE_LOG, String(n)); }catch(e){} }
function pintaLog(){
  const f = $("fLog");
  if(!f) return;
  const n = leeLog();
  f.textContent = n + (n === 1 ? " answer logged" : " answers logged");
}
pintaLog();
document.addEventListener("click", function(e){
  const b = e.target.closest ? e.target.closest("[data-di]") : null;
  if(!b) return;
  if(b.getAttribute("data-di") === "otra") return;
  ponLog(leeLog() + 1);
  pintaLog();
}, true);

function hayPregunta(){
  return !!document.querySelector("#pane [data-di]:not([data-di=otra])");
}
function hayOtra(){ return !!document.querySelector("#pane [data-di=otra]"); }

function pintaNav(){
  const pie = $("navPie");
  if(!pie) return;
  const ultima = MARCO.i >= N - 1;
  let h = '<div class="nav">'
    + '<button class="sec" id="atras" data-va="' + (MARCO.i - 1) + '"'
    + (MARCO.i ? "" : " disabled") + ">Back</button>";
  if(hayPregunta())
    h += '<a class="skip" id="salta" data-va="' + (MARCO.i + 1) + '">Skip</a>';
  if(hayOtra()) h += '<button id="otra">Next one</button>';
  h += '<button id="sig" data-va="' + (MARCO.i + 1) + '"'
    + (ultima ? " disabled" : "") + ">"
    + (ultima ? "End of the module" : "Next") + "</button></div>";
  pie.innerHTML = h;
  const a = $("atras"); if(a) a.onclick = function(){ vaA(MARCO.i - 1); };
  const s = $("sig");   if(s) s.onclick = function(){ vaA(MARCO.i + 1); };
  const k = $("salta"); if(k) k.onclick = function(){ vaA(MARCO.i + 1); };
  const o = $("otra");
  if(o) o.onclick = function(){
    const b = document.querySelector("#pane [data-di=otra]");
    if(b) b.click();
  };
}
pintaNav();
if(typeof MutationObserver !== "undefined" && $("pane"))
  new MutationObserver(pintaNav).observe($("pane"), {childList: true, subtree: true});

(function(){
  const d = $("deCero");
  if(!d) return;
  d.onclick = function(){
    vistoOlvida(YO);
    marcaNav();
    location.href = MARCO.deCero || MARCO.paginas[0].f;
  };
})();

(function(){
  const t = $("tSig"), pane = $("pane");
  if(!t || !pane || !t.innerHTML.trim()) return;
  if(document.querySelector(".ot-cierre")) return;
  pane.insertAdjacentHTML("afterend", t.innerHTML);
})();
})();
</script>
