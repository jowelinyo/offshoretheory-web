<script>
"use strict";

const NS = "http://www.w3.org/2000/svg";
const D = {W: 1000, H: 620};
let svg = null, gO = null, ESC = 1;
const px = n => n / ESC;

function el(t, at, pa){
  const e = document.createElementNS(NS, t);
  for(const k in at) if(at[k] !== undefined && at[k] !== null) e.setAttribute(k, at[k]);
  (pa || gO || svg).appendChild(e);
  return e;
}
function txt(x, y, s, an, tam, col, peso, fam, pa){
  const e = el("text", {x: x, y: y, "text-anchor": an || "start",
    "pointer-events": "none", "font-size": px(tam || 13),
    fill: col || "var(--lam-ink)", "font-weight": peso || 400,
    "font-family": fam === "mono" ? "var(--f-mono)" : "var(--f-ui)"}, pa);
  e.textContent = s;
  return e;
}
function parte(s, ancho, tam){
  const porLinea = Math.max(6, Math.floor(ancho / (px(tam) * 0.62)));
  const pal = String(s).split(/\s+/);
  const out = [];
  let linea = "";
  pal.forEach(function(p){
    const q = linea ? linea + " " + p : p;
    if(q.length > porLinea && linea){ out.push(linea); linea = p; }
    else linea = q;
  });
  if(linea) out.push(linea);
  return out;
}

function sondaDe(i, j){
  const s = Math.sin(i*12.9898 + j*78.233) * 43758.5453;
  return s - Math.floor(s);
}
function sonda(x, y, v){
  const ent = Math.floor(v), dec = Math.round((v - ent)*10);
  const t = el("text", {x: x, y: y, "text-anchor": "middle",
    "pointer-events": "none", "font-size": px(11.5), "font-style": "italic",
    fill: "var(--carta-sonda)", "font-family": "var(--f-ui)", opacity: .78});
  t.appendChild(document.createTextNode(String(ent)));
  if(dec){
    const u = document.createElementNS(NS, "tspan");
    u.setAttribute("font-size", px(8));
    u.setAttribute("dy", px(3));
    u.textContent = String(dec);
    t.appendChild(u);
  }
}

function interruptor(x, y, w, h, m, on){
  const g = el("g", {"data-boton": "m:" + m.id});
  el("rect", {x: x, y: y, width: w, height: h, rx: px(3), class: "caza",
              fill: on ? "var(--accent-control)" : "var(--carta)",
              stroke: on ? "var(--accent-control)" : "var(--edge-button)",
              "stroke-width": px(1.2)}, g);
  el("rect", {x: x + px(12), y: y + h/2 - px(5), width: px(10), height: px(10),
              rx: px(1), fill: m.tinta, opacity: on ? 1 : .45}, g);
  txt(x + px(30), y + h/2 + px(5), m.n, "start", 13.5,
      on ? "var(--ink-title)" : "var(--lam-dim)", on ? 600 : 400, null, g);
  return g;
}

const LEY5 = "Every vessel shall <b>at all times</b> maintain a proper look-out <b>by sight and hearing</b> <b>as well as by all available means</b> appropriate in the prevailing circumstances and conditions so as to make a <b>full appraisal</b> of the situation and of the risk of collision.";

const NIEBLA = {x: -1.45, y: 0.95, r: 0.85};

const CONTACTOS = [
  {id: "c1", brg:  40, rng: 1.80, eco: true,  ais: true,  ruido: true,

  {id: "c2", brg:  10, rng: 0.12, eco: false, ais: false, ruido: false,

const RAD = Math.PI / 180;
function pos(c){
  return [c.rng * Math.sin(c.brg * RAD), c.rng * Math.cos(c.brg * RAD)];
}

function cortan(a, b, c, d){
  const f = (p, q, r) => (r[1] - p[1])*(q[0] - p[0]) - (q[1] - p[1])*(r[0] - p[0]);
  const d1 = f(c, d, a), d2 = f(c, d, b), d3 = f(a, b, c), d4 = f(a, b, d);
  return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
}
function cortaTierra(p){
  for(let i = 0; i < TIERRA.length - 1; i++)
    if(cortan([0, 0], p, TIERRA[i], TIERRA[i + 1])) return true;
  return false;
}

function cortaNiebla(p){
  const L = Math.hypot(p[0], p[1]);
  if(!L) return false;
  const t = Math.max(0, Math.min(1, (NIEBLA.x*p[0] + NIEBLA.y*p[1]) / (L*L)));
  return Math.hypot(NIEBLA.x - t*p[0], NIEBLA.y - t*p[1]) <= NIEBLA.r;
}
function enSectorCiego(brg){
  const b = ((brg % 360) + 360) % 360;
  return b >= CIEGO[0] && b <= CIEGO[1];
}

function detecta(c, medio){
  const m = MEDIOS.filter(q => q.id === medio)[0];
  if(!m || c.rng > m.rango) return false;
  const p = pos(c);
  if(medio === "vista")
    return !enSectorCiego(c.brg) && !cortaTierra(p) && !cortaNiebla(p);
  if(medio === "oido")  return !!c.ruido;
  if(medio === "radar") return c.rng >= m.muerta && !!c.eco && !cortaTierra(p);
  if(medio === "ais")   return !!c.ais;
  return false;
}
function detectadoPor(c, encendidos){
  return MEDIOS.filter(m => encendidos.indexOf(m.id) >= 0)
               .filter(m => detecta(c, m.id)).map(m => m.id);
}
function cuenta(encendidos){
  return CONTACTOS.filter(c => detectadoPor(c, encendidos).length > 0).length;
}
function matriz(){
  return CONTACTOS.map(function(c){
    return {id: c.id, ve: MEDIOS.filter(m => detecta(c, m.id)).map(m => m.id)};
  });
}

function cascoEnPlanta(x, y, rumbo, tinta, L, quien, opt){
  const o = opt || {};
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const P = o.este ? (av, tr) => [x + cs*av - sn*tr, y + sn*av + cs*tr]
                   : (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  const M = L*0.09;
  const q = [P(L*0.50, 0), P(L*0.26, M*0.85), P(L*0.10, M),
             P(-L*0.44, M*0.9), P(-L*0.50, M*0.55),
             P(-L*0.50, -M*0.55), P(-L*0.44, -M*0.9),
             P(L*0.10, -M), P(L*0.26, -M*0.85)];
  const gr = el("g", {"data-barco": quien});
  el("path", {d: "M" + q.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L")
                + " Z", fill: tinta, opacity: .95, "data-buque": "1"}, gr);
  return L;
}

function plantaBarco(x, y, rumbo, tinta, op, largo, padre){
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const L = largo || px(24), M = L*0.34;
  const P = (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  const q = [P(L*0.5, 0), P(L*0.14, M), P(-L*0.5, M*0.8),
             P(-L*0.5, -M*0.8), P(L*0.14, -M)];

  el("path", {d: "M" + q.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L")
                + " Z", fill: tinta, opacity: op === undefined ? .95 : op,
              "data-buque": "1"}, padre);
}

const V5 = {ox: 0.540, oy: 0.520, k: 0.115};

function fija5(){
  ESCALA.ox = D.W*V5.ox; ESCALA.oy = D.H*V5.oy; ESCALA.k = D.W*V5.k;
}
const MX = x => ESCALA.ox + x*ESCALA.k;
const MY = y => ESCALA.oy - y*ESCALA.k;
const MR = r => r*ESCALA.k;
function porBrg(brg, r){
  const a = brg*Math.PI/180;
  return [MX(r*Math.sin(a)), MY(r*Math.cos(a))];
}

const S5 = {on: {vista: true, oido: false, radar: false, ais: false}};
function encendidos(){
  return MEDIOS.filter(m => S5.on[m.id]).map(m => m.id);

const BANDAS = [[0.30, "media"], [0.15, "somera"], [0.05, "secante"], [0, "tierra"]];
const FILO = -9;

function apartada(dist){
  const n = TIERRA.length, out = [];
  const nor = [];
  for(let i = 0; i < n - 1; i++){
    const dx = TIERRA[i + 1][0] - TIERRA[i][0], dy = TIERRA[i + 1][1] - TIERRA[i][1];
    const L = Math.hypot(dx, dy) || 1;
    nor.push([-dy/L, dx/L]);
  }
  for(let i = 0; i < n; i++){

    const a = nor[Math.max(0, i - 1)], b = nor[Math.min(nor.length - 1, i)];
    let vx = a[0] + b[0], vy = a[1] + b[1];
    const L = Math.hypot(vx, vy) || 1;
    vx /= L; vy /= L;
    let x = TIERRA[i][0] + vx*dist, y = TIERRA[i][1] + vy*dist;

    if(i === 0 || i === n - 1) x = TIERRA[i][0];
    out.push([x, y]);
  }
  return out;
}
function trazoTierra(dist){
  const q = apartada(dist);

  return "M" + MX(FILO) + "," + MY(q[0][1])
       + " L" + q.map(p => MX(p[0]).toFixed(1) + "," + MY(p[1]).toFixed(1)).join(" L")
       + " L" + MX(FILO) + "," + MY(q[q.length - 1][1]) + " Z";
}

function carta5(){
  el("rect", {x: 0, y: 0, width: D.W, height: D.H, fill: "var(--carta)",
              "data-banda": "honda"});

  [[0.30, "media"], [0.15, "somera"]].forEach(function(q){
    el("path", {d: trazoTierra(q[0]), fill: "var(--carta-" + q[1] + ")",
                "data-banda": q[1]});
  });
  [[0.30, .55], [0.15, .20]].forEach(function(q){
    const p = apartada(q[0]).map(v => MX(v[0]).toFixed(1) + "," + MY(v[1]).toFixed(1));
    el("path", {d: "M" + p.join(" L"), fill: "none", stroke: "var(--carta-veril)",
                "stroke-width": px(2), "stroke-opacity": q[1],
                "stroke-linejoin": "round"});
  });

  const cel = px(126);
  for(let i = 0; i*cel < D.W + cel; i++){
    for(let j = 0; j*cel < D.H + cel; j++){
      const r1 = sondaDe(i, j), r2 = sondaDe(i + 41, j + 17), r3 = sondaDe(i + 7, j + 91);
      if(r3 < 0.40) continue;
      const x = i*cel + r1*cel*0.7, y = j*cel + r2*cel*0.7;
      if(x < px(30) || x > D.W - px(30) || y < px(118) || y > D.H - px(46)) continue;
      const mx = (x - ESCALA.ox)/ESCALA.k, my = (ESCALA.oy - y)/ESCALA.k;
      if(Math.hypot(mx, my) < 3.15) continue;
      const b = bandaEn([mx, my]);
      if(b === "tierra" || b === "secante") continue;
      sonda(x, y, b === "somera" ? 3 + r1*4 : b === "media" ? 9 + r1*7 : 22 + r1*16);
    }
  }

  const nx = D.W - px(46), ny = px(112);
  el("line", {x1: nx, y1: ny + px(14), x2: nx, y2: ny - px(12),
              stroke: "var(--lam-ink)", "stroke-width": px(1.6)});
  el("path", {d: "M" + nx + "," + (ny - px(20)) + " L" + (nx - px(5)) + ","
                + (ny - px(9)) + " L" + (nx + px(5)) + "," + (ny - px(9)) + " Z",
              fill: "var(--lam-ink)"});
  txt(nx, ny + px(28), "N", "middle", 12, "var(--lam-ink)", 600, "mono");

  const k1 = MR(1), ex = D.W - px(26) - k1, ey = D.H - px(30);
  el("line", {x1: ex, y1: ey, x2: ex + k1, y2: ey,
              stroke: "var(--lam-dim)", "stroke-width": px(1.4)});
  [0, k1].forEach(function(o){
    el("line", {x1: ex + o, y1: ey - px(5), x2: ex + o, y2: ey + px(5),
                stroke: "var(--lam-dim)", "stroke-width": px(1.4)});
  });

  txt(ex + k1/2, ey + px(16), "1 mile", "middle", 11.5, "var(--lam-dim)", 400, "mono");
  txt(D.W - px(26), ey - px(12), "depths in meters", "end", 10.5,
      "var(--lam-dim)", 400, "mono");
}

function dentroDe(p, dist){
  const q = apartada(dist);
  const poli = [[FILO, q[0][1]]].concat(q, [[FILO, q[q.length - 1][1]]]);
  let hay = false;
  for(let i = 0, j = poli.length - 1; i < poli.length; j = i++){
    if((poli[i][1] > p[1]) !== (poli[j][1] > p[1]) &&
       p[0] < (poli[j][0] - poli[i][0])*(p[1] - poli[i][1])
              /(poli[j][1] - poli[i][1]) + poli[i][0]) hay = !hay;
  }
  return hay;
}
function bandaEn(p){
  for(let i = BANDAS.length - 1; i >= 0; i--)
    if(dentroDe(p, BANDAS[i][0])) return BANDAS[i][1];
  return "honda";
}

const ROT = [];
function radioEnAgua(brg, desde){
  const a = brg*Math.PI/180;
  for(let r = desde; r > 0.6; r -= 0.12){
    const b = bandaEn([r*Math.sin(a), r*Math.cos(a)]);
    if(b === "honda" || b === "media") return r;
  }
  return desde;
}

}

        h += '<div class="quinto"><b>Everything is on, and there is still one more.'
           + "</b>" + ciegos.map(c => c.n).join(", ")
           + " &mdash; right in the sector the superstructure hides, no radar echo "
           + "and no AIS. Nothing on board has her. She is on the chart now, hollow.</div>";
    } else {
      h += '<p class="pista">Switch the others on and watch what appears. No single '
         + "means covers the whole circle.</p>";
    }
    return h;
  }
};

(function(){
"use strict";

const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);

const vistoTerminada= f => !!vistoLee().terminadas[f];

 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){

 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){

 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];

}
