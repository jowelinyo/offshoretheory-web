<script>

"use strict";
const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

const D={"W": 7465, "H": 5452, "X0": 0, "Y0": 0, "PXM": 673.2772, "PXLON": 465.8694, "MET": 2.75072, "LAT_N": 46.297896, "LON_W": -6.027302, "NORTE": [0.027922, -0.99961], "ESTE": [0.99961, 0.027922]}, GEO={bandas:{},col:{}};
const PZ=[{"t": "Turning the question round", "s": [{"id": "1.S1", "h": "The other way up", "v": [4851, 2186, 3800], "ep": [[3213.8421501197527, 2576.553090626365, "EP 1607", 1]], "fondo": [[3213.8421501197527, 2576.553090626365, 6488.581188361912, 1796.4014677622447, "075 · destination", "fin", 1]], "p": ["Part 2 ended on a question it did not answer: “These two parts asked <i>where has the water taken me</i>. The one that matters when you are actually going somewhere is the other way up: <b>what course do I steer so that the wind and the water land me where I want to be?</b>”", "<b>This is that part.</b> Until now the chart has answered. You drew what the boat had done — course, log, stream, leeway — and the chart told you where that put you. The triangle is where part 2 left you: <b>the EP for the last leg of that afternoon</b>, taken on its own from the 1543 mark, with both corrections in it.", "<b>Now the chart asks.</b> You put a destination on it — here, <b>5.0</b> miles away on <b>075</b> — and the line from where you are to where you want to be is your <b>desired track</b>: the track you want to make good over the ground. It has <b>two arrowheads</b>, like the ground track you drew in part 1, because it is the same kind of line, a path over the ground. The only difference is that this one has not happened yet.", "<b>What does not change:</b> the same three vectors, the same four symbols, the same hour of stream. <b>The only thing that changes is which side of the triangle you do not know.</b> And what you are looking for has a name of its own, the one the examiner uses: the <b>course to steer</b>."]}, {"id": "1.S2", "h": "Three vectors, and you know most of each", "v": [3602, 2312, 3100], "ep": [[3213.8421501197527, 2576.553090626365, "EP 1607", 1]], "fondo": [[3213.8421501197527, 2576.553090626365, 6488.581188361912, 1796.4014677622447, "075 · how far in the hour?", 1]], "vector": [[3213.8421501197527, 2576.553090626365, 2353.669945088277, 2047.3711873234345, "300 · 1.5 kn · one hour", 1]], "calc": "<b>Desired track</b> &middot; two arrowheads &mdash; direction: <b>yes</b>, you choose it, 075 &middot; length: <b>no</b>, it depends on what the stream gives or takes<br><b>Stream</b> &middot; three arrowheads &mdash; direction: <b>yes</b>, the set, 300 &middot; length: <b>yes</b>, the drift, 1.5 knots for the hour<br><b>Water track</b> &middot; one arrowhead &mdash; direction: <b>no</b>, that is the answer &middot; length: <b>yes</b>, your speed, 5.0 knots for the hour", "p": ["Before you solve it, count what you already have. Three vectors look like too many unknowns. They are not.", "<b>One unknown in two of the three vectors: two in all.</b> The desired track is missing its length, the water track its direction, and the stream nothing. <b>Two unknowns is exactly what a triangle lets you solve</b> — so this can be drawn, not guessed.", "<i>And that is where the next topic starts.</i> You do not know which way to point, but you know exactly how far you go through the water in an hour. Open your dividers to your speed and they sweep every place you could be at the end of that hour — and only one of those places is on the track you want."]}, {"id": "1.P1", "h": "Which one are you missing?", "v": [3602, 2312, 3100], "t": "choice", "o": [{"t": "The stream", "next": false, "m": "<b>The stream is given whole</b> — the set, <b>300</b>, and the drift, <b>1.5 knots</b> for the hour. It is what spoils the trip, which is why it feels like the thing to find. It comes in the question."}, {"t": "The desired track", "next": false, "m": "<b>You chose that one:</b> from where you are to where you want to be, <b>075</b>. Its direction is the one thing nobody has to work out. What you do not know is its <i>length</i> — how far along it the hour will take you."}, {"t": "The ground track", "next": false, "m": "<b>Not that one.</b> The ground track is what she will <i>actually</i> do over the ground, and it only lies along the desired track if you steer the right course: get the course wrong and the stream takes her off it. So its direction is not something you work out — you choose it, and then steer so she makes it good. In parts 1 and 2 the ground track was the answer: you drew it last, from what she had done. Here it has not happened yet. <i>Mixing up where you want to go with where you will go is exactly the mistake this part is here to undo.</i>"}, {"t": "The water track", "ok": true, "m": "<b>Yes: the water track.</b> You know its length — your speed, <b>5.0 knots</b> for the hour — and not which way it points. <b>That direction is the course to steer</b>, and finding it is the next topic."}], "ep": [[3213.8421501197527, 2576.553090626365, "EP 1607", 1]], "fondo": [[3213.8421501197527, 2576.553090626365, 6488.581188361912, 1796.4014677622447, "075 · how far in the hour?", 1]], "vector": [[3213.8421501197527, 2576.553090626365, 2353.669945088277, 2047.3711873234345, "300 · 1.5 kn · one hour", 1]], "calc": "On the chart: the <b>desired track</b>, two arrowheads, and the <b>stream</b>, three. Not on it: the <b>water track</b>, one arrowhead, 5.0 miles long for the hour.", "p": ["Two of the three are on the chart; the third is the one you are after. <b>Which vector do you not know the direction of?</b>"], "hizo": "worked out which side of the triangle was missing"}]}, {"t": "The one-hour triangle", "s": [{"id": "2.S1", "h": "In this order, and no other", "v": [3602, 2312, 3100], "ep": [[3213.8421501197527, 2576.553090626365, "EP 1607", 1]], "fondo": [[3213.8421501197527, 2576.553090626365, 6488.581188361912, 1796.4014677622447, "075 · how far in the hour?", 1]], "vector": [[3213.8421501197527, 2576.553090626365, 2353.669945088277, 2047.3711873234345, "300 · 1.5 kn · one hour", 1]], "p": ["<b>Four moves, always in this order.</b> This is the only part of the course to steer you have to learn by heart.", "1 · From where you are, lay the <b>desired track</b> as a line &mdash; no length yet. It is only a direction for something to land on.", "2 · From the <b>same point</b>, one hour of <b>stream</b>: three arrowheads.", "3 · From the end of the stream, open your dividers to your <b>speed through the water</b> for one hour, and cut the line.", "4 · From the end of the stream to the cut is the <b>water track</b>, one arrowhead, and its direction is the <b>course to steer</b>. From where you are to the cut is the <b>ground track</b> for the hour.", "<b>And the difference from part 1, which is the one that catches people.</b> There the stream went on the <b>end</b> of the reckoning, because it corrected something already sailed. <b>Here it goes on the start, because it corrects nothing: it asks.</b> <i>Same vector, same drawing, a different place and a different job.</i>"]}, {"id": "2.E1", "h": "The construction, drawn", "v": [4037, 2154, 3900], "pasos": [{"ver": ["ep", "fondo"], "t": "<b>From here, you want to go there.</b> That EP, and the desired track on <b>075</b>, running on towards a destination <b>5.0</b> miles away. For now it is only a line."}, {"ver": ["ep", "fondo", "vector"], "t": "<b>One hour of stream, from the same point.</b> The set is <b>300</b> and the drift <b>1.5 knots</b>, so the end of the vector is where the water alone would carry you in the hour."}, {"ver": ["ep", "fondo", "vector", "arco"], "t": "<b>Now the dividers.</b> Open them to <b>5.0 miles</b> &mdash; your speed for one hour &mdash; and swing them from the end of the stream. <i>Every place you could be at the end of that hour is on this arc</i>, and it crosses the desired track once ahead of you."}, {"ver": ["ep", "fondo", "vector", "arco", "agua"], "t": "<b>Join the end of the stream to the cut.</b> That is the <b>water track</b>, one arrowhead, and it measures <b>087</b>: your <b>course to steer</b>, <b>12&deg;</b> into the stream. And from the EP to the cut is the <b>ground track</b> for the hour: <b>3.83</b> miles &mdash; so the 5.0 miles take <b>78 minutes</b>."}], "ep": [[3213.8421501197527, 2576.553090626365, null, 1]], "fondo": [[3213.8421501197527, 2576.553090626365, 6488.581188361912, 1796.4014677622447, null, 1]], "vector": [[3213.8421501197527, 2576.553090626365, 2353.669945088277, 2047.3711873234345, null, 1]], "arco": [[2353.669945088277, 2047.3711873234345, 3366.386, 83, 97, "5.0 M — one hour of you", "desde", 1]], "agua": [[2353.669945088277, 2047.3711873234345, 5719.3747467489375, 1979.651994516896, 87, "087 · course to steer", 1]]}, {"id": "2.P1", "h": "What do you steer?", "t": "protra", "v": [2483, 1561, 3700], "desde": [4046.029243784, 2637.5984919568], "hasta": [1247.1951350518282, 767.0150715252514], "ck":function(v,d){var A=302,T=2;var dg=function(a,b){return Math.abs(((a-b)%360+540)%360-180);};var t3=function(a){return ('00'+a).slice(-3);};var r=((Math.round(v)%360)+360)%360;if(!d.paralela)return {ok:false,m:"<b>The grid is not square with the chart.</b><br>Turn the rose until the lines engraved in it run straight up and down the chart, parallel to the meridians."};var reves=dg(d.dir,(A+180)%360)<=10;if(reves&&!d.norte)return {ok:false,m:"<b>Wrong twice, and the two cancel out.</b><br>The edge runs from the cut back to the end of the stream, and the rose is upside down as well. The number looks right and both halves of the gesture are wrong. Start again."};if(reves)return {ok:false,m:"<b>The edge is the wrong way round.</b><br>It runs from the cut back to the end of the stream. The arrow has to point the way the boat goes through the water. That is one of the two ways to end up 180&deg; out."};if(!d.norte)return {ok:false,m:"<b>The rose is upside down.</b><br>The grid is parallel to the meridians, but the north arrows point to the bottom of the chart. That is the other way to end up 180&deg; out &mdash; and the reason you are reading "+t3(r)+"&deg; instead of "+t3((r+180)%360)+"&deg;."};if(dg(r,320)<=T)return {ok:false,m:"<b>That is the desired track.</b> Steer it and the stream takes you with it: after one hour you are <b>1.53 miles</b> off the line.",pista:"The line you steer is not drawn yet: it runs from the tip of the three arrowheads to where the arc cuts the desired track. Lay the edge there."};if(dg(r,338)<=T)return {ok:false,m:"<b>The correction to the wrong side.</b> You put the 18 degrees to starboard, with the stream instead of into it. The example corrected to starboard because its stream pushed the other way; this one sets <b>090</b>.",pista:"The line you steer is not drawn yet: it runs from the tip of the three arrowheads to where the arc cuts the desired track. Lay the edge there."};if(dg(r,284)<=T)return {ok:false,m:"<b>The correction twice.</b> 18 degrees is enough, and 36 carries you across the track the other way.",pista:"The line you steer is not drawn yet: it runs from the tip of the three arrowheads to where the arc cuts the desired track. Lay the edge there."};if(dg(r,A)<=T)return d.canto?{ok:true,m:"<span class=\"big\">302&deg;</span><br><b>302 — 18 degrees to port of the track, into the stream.</b> Edge from the end of the stream to the cut, rose square with the chart, read at the arrow."}:{ok:false,m:"<b>The number is right, but the edge is not on the construction.</b> Lay it from the end of the stream &mdash; the tip of the three arrowheads &mdash; to where the arc cuts the desired track, and read again.",pista:"The line you steer is not drawn yet: it runs from the tip of the three arrowheads to where the arc cuts the desired track. Lay the edge there."};return {ok:false,m:"The index reads "+t3(r)+"&deg;. The course to steer runs from the end of the stream to where the arc cuts the desired track: lay the edge on that line, square the rose with the chart, and read again.",pista:"The line you steer is not drawn yet: it runs from the tip of the three arrowheads to where the arc cuts the desired track. Lay the edge there."};}, "ay": "Two clicks lay the edge along a line, the first where it starts. Then drag inside the rose to square it with the chart, and read at the arrow.", "show": {"ln": [4046.029243784, 2637.5984919568, 1247.1951350518282, 767.0150715252514], "txt": "<p>302&deg;: the line from the end of the stream to the cut.</p>"}, "p": ["<b>Another passage, and this time you find the answer on the chart.</b> From this EP you want to make good <b>320</b>, the desired track. The stream sets <b>090</b> at <b>2.0 knots</b>, and its hour is laid from the same point. The arc is swung: <b>5.0 miles</b> from the end of the stream.", "Steering the desired track will not get you there. <b class='q'>What course do you steer?</b> Lay the protractor on it and read it."], "ep": [[2700.0, 2600.0, null, 1]], "fondo": [[2700.0, 2600.0, 1027.1823913061248, 489.4278655017938, "320 · desired track", 1]], "vector": [[2700.0, 2600.0, 4046.029243784, 2637.5984919568, "090 · 2.0 kn · one hour", 1]], "arco": [[4046.029243784, 2637.5984919568, 3366.386, 290.1565208066144, 308.1565208066144, null, 1]], "hizo": "found a course to steer with the protractor"}, {"id": "2.P2", "h": "And when do you get there?", "t": "num", "v": [2483, 1561, 3700], "un": "minutes", "ck":function(v){var A=69,T=2,r=Math.round(v);if(Math.abs(v-A)<=T)return {ok:true,m:"<span class=\"big\">69 minutes</span><br>The log reads <b>STW</b>, speed through the water: 5.0. What gets you there is <b>SOG</b>, speed over the ground: 3.47. So the 4.0 miles take 69 minutes. Module 02 already gave you the rule: «A distance over the ground has to be divided by a speed over the ground.» This is the first time you have taken that speed off a drawing yourself."};if(r===48)return {ok:false,stay:true,m:"<b>48 minutes is 4.0 miles at 5.0 knots.</b> That is STW &mdash; what the log reads. The stream is taking some of it away."};if(r===80)return {ok:false,stay:true,m:"<b>80 minutes takes the whole 2.0 knots of stream off your speed.</b> The stream is not dead ahead: part of it pushes you sideways, and the arc takes care of that."};if(r===34)return {ok:false,stay:true,m:"<b>34 minutes adds the whole 2.0 knots of stream to your speed.</b> Only the drawing knows what the stream gives or takes, and here it made good 3.47."};if(r===78)return {ok:false,stay:true,m:"<b>78 minutes is the answer to the example</b>, for its own passage: 5.0 miles at 3.83. This passage makes good 3.47."};return {ok:false,stay:true,m:"That gives "+r+(r===1?' minute. ':' minutes. ')+"A distance over the ground divided by a speed over the ground gives hours, and each hour is 60 minutes."};}, "pista": "The ground track is that hour, over the ground: the chart has written on it how far that hour took you.", "p": ["<b>The same passage, solved.</b> Steering <b>302</b>, the boat makes good <b>3.47 miles</b> over the ground in the hour: the ground track, from the EP to the cut. The destination is <b>4.0 miles</b> from the EP.", "The log will read <b>5.0 knots</b> the whole way. <b class='q'>How many minutes to the destination?</b>"], "ep": [[2700.0, 2600.0, null, 1]], "fondo": [[2700.0, 2600.0, 1247.1951350518282, 767.0150715252514, "320 · 3.47 M · ground track", 1]], "vector": [[2700.0, 2600.0, 4046.029243784, 2637.5984919568, null, 1]], "arco": [[4046.029243784, 2637.5984919568, 3366.386, 290.1565208066144, 308.1565208066144, null, 1]], "hizo": "worked out a passage time"}]}, {"t": "Down to her compass", "s": [{"id": "3.S1", "h": "The leeway goes the other way now", "v": [3195, 1881, 2300], "p": ["<b>Topic 2 called 087 your course to steer — and with no wind in it, that is exactly what it is.</b> Put a wind in it and 087 turns out to be what it was all along: <b>the track you need through the water</b>. What you steer is the <b>heading</b> that makes it good, and when the examiner asks for the course to steer, that is the one meant: the one with the leeway already in it.", "<b>In part 2 you moved the mark to leeward.</b> The wind had already pushed, and the drawing caught up with it: the bow pointed one way and the water track fell downwind of it.", "<b>Steering, it goes the other way round.</b> The bow goes <b>to windward of the water track</b>: the same number of degrees, on the other side.", "The wind is from <b>340</b> and she makes <b>10&deg;</b> of leeway. It pushes her towards 160, to starboard, so you point 10&deg; to port: <b>077</b>. Point 077, crab 10&deg; downwind, make good 087.", "<b>You are not correcting what the wind has done. You are taking off, in advance, what it is going to do.</b>", "<i>And this is the classic mistake, so it is said out loud: after the whole of part 2 putting leeway to leeward, the hand wants to do it again. That gives 097 — and steering 097 she makes good 107, 20&deg; off.</i>"], "vector": [[3213.8421501197527, 2576.553090626365, 2353.669945088277, 2047.3711873234345, null, 1]], "agua": [[2353.669945088277, 2047.3711873234345, 4036.3603332331754, 2006.2477334807975, 87, "087 · water track", 1]], "derrota": [[2353.669945088277, 2047.3711873234345, 4003.655472433351, 1714.676371669545, 77, "077 · heading", 1]]}, {"id": "3.E1", "h": "All the way down", "v": [3195, 1881, 2300], "p": [], "pasos": [{"ver": ["vector", "agua", "derrota"], "t": "<b>From the water track to the heading.</b> The triangle gave you <b>087</b> through the water. The wind is from 340 and pushes her 10&deg; to starboard, so the bow goes 10&deg; to port, to windward: <b>077 true</b>.", "calc": "087 &nbsp;&minus;&nbsp; 10&deg; to windward &nbsp;=&nbsp; <b>077 T</b>"}, {"ver": ["vector", "agua", "derrota"], "t": "<b>From true to magnetic.</b> The variation is <b>6&deg; W</b>, and on the way down a westerly variation is added: <b>083 magnetic</b>.", "calc": "077 &nbsp;+&nbsp; 6&deg; W &nbsp;=&nbsp; <b>083 M</b>"}, {"ver": ["vector", "agua", "derrota"], "t": "<b>From magnetic to her compass.</b> You go into her deviation card <b>by the magnetic</b>, the way module 02 drilled it. 083 falls in the <b>090</b> row: the card goes every 30 degrees and 083 is nearest to 090. That row says <b>2E</b>, and on the way down an easterly deviation comes of function _apunta(p, txt, k, tinta){
 if(txt) ROTULOS.push({p:p, txt:txt, k:k, tinta:tinta||TINTA}); }

function _cajaTxt(p, txt, k, sitio){
 const f=19*k, an=txt.length*f*0.55, x=p[0]+sitio[0], y=p[1]+sitio[1];
 const x0 = sitio[2]==="end" ? x-an : (sitio[2]==="middle" ? x-an/2 : x);
 return {x0:x0, y0:y-f*0.78, x1:x0+an, y1:y+f*0.25, x:x, y:y, an:sitio[2]};}

const _dentro = b =>
 b.x0>=vb.x && b.x1<=vb.x+vb.w && b.y0>=vb.y && b.y1<=vb.y+vb.h;
const _choca = (a,b) =>
 !(a.x1<b.x0 || b.x1<a.x0 || a.y1<b.y0 || b.y1<a.y0);

function _piezas(){
 const cajas=[], segs=[];
 for(const e of Array.from(gL.querySelectorAll("line")))
  segs.push([+e.getAttribute("x1"), +e.getAttribute("y1"),
             +e.getAttribute("x2"), +e.getAttribute("y2")]);
 for(const e of Array.from(gL.querySelectorAll("circle"))){
  const cx=+e.getAttribute("cx"), cy=+e.getAttribute("cy"), r=+e.getAttribute("r");
  cajas.push({x0:cx-r, y0:cy-r, x1:cx+r, y1:cy+r});}

 for(const c of CUERDAS) segs.push(c);
 return {cajas:cajas, segs:segs};}

function _cortaSeg(b, s){
 let t0=0, t1=1;
 const dx=s[2]-s[0], dy=s[3]-s[1];
 const p=[-dx, dx, -dy, dy];
 const q=[s[0]-b.x0, b.x1-s[0], s[1]-b.y0, b.y1-s[1]];
 for(let i=0;i<4;i++){
  if(p[i]===0){ if(q[i]<0)return false; continue; }
  const r=q[i]/p[i];
  if(p[i]<0){ if(r>t1)return false; if(r>t0)t0=r; }
  else      { if(r<t0)return false; if(r<t1)t1=r; }}
 return true;}

function _coloca(){
 const D0=_piezas(), cajas=D0.cajas, segs=D0.segs;
 for(const r of ROTULOS){
  let puesta=null;
  for(const sitio of _SITIOS(r.k)){
   const b=_cajaTxt(r.p, r.txt, r.k, sitio);
   if(!_dentro(b))continue;
   if(cajas.some(x=>_choca(b,x)))continue;
   if(segs.some(x=>_cortaSeg(b,x)))continue;
   puesta=b; break;}

  if(!puesta)
   for(const sitio of _SITIOS(r.k)){
    const b=_cajaTxt(r.p, r.txt, r.k, sitio);
    if(!_dentro(b))continue;
    if(cajas.some(x=>_choca(b,x)))continue;
    puesta=b; break;}
  if(!puesta){ SIN_SITIO.push(r.txt); continue; }
  cajas.push(puesta);
  el("text",{x:puesta.x, y:puesta.y, "font-size":19*r.k,
   "font-family":"DejaVu Sans,sans-serif", fill:r.tinta||TINTA,
   "text-anchor":puesta.an}, gL).textContent=r.txt;}}

function veredictoPin(s,p){
 const tol=tolM();
 const P0=q=>[q[0]-D.X0, q[1]-D.Y0];
 const d=q=>Math.hypot(p[0]-P0(q)[0], p[1]-P0(q)[1])*D.MET;
 const dBien=d(s.sep);
 PIN=[p[0],p[1]];
 if(dBien<=tol){ s.ok=FRASE_BIEN(s,dBien); return true; }

 for(const [nombre,x,y] of (s.sepMal||[]))
  if(d([x,y])<=tol){ s.no=FRASES[nombre](s); return false; }

 let cerca=[NOMBRE_BIEN, dBien];
 for(const [nombre,x,y] of (s.sepMal||[]))
  if(d([x,y])<cerca[1]) cerca=[nombre, d([x,y])];
 s.no=`That is <b>${Math.round(dBien)} m</b> from it, and it is not any of the other `
  +`places on this chart either &mdash; the nearest of those is <b>${cerca[0]}</b>, `
  +`<b>${Math.round(cerca[1])} m</b> away. <i>A single mark cannot tell a wrong `
  +`direction from a short distance, so this screen does not guess: it tells you how `
  +`far off you are, and from what.</i>`;
 return false;}

const NOMBRE_BIEN = "the answer";
const FRASE_BIEN = (s,d) =>
 `<span class="big">${Math.round(d)} m from it</span><br>` + (s.bien||"");
const FRASES = {};

function numeros(t){
 const u=String(t||"").toLowerCase()
  .replace(/degrees?|deg|knots?|miles?|\bkn\b|\bm\b/g," ")
  .replace(/[°º˚]/g," ").replace(/,/g,".");
 const out=[], re=/(-?\d+(?:\.\d+)?)/g; let x;
 while((x=re.exec(u))!==null)out.push(parseFloat(x[1]));
 return out;}

const ddd = a => String(Math.round(((a%360)+360)%360)).padStart(3,"0");

const normaRumbo = v => {
 const m = String(v).replace(/\s|°/g,"").match(/^(\d{3})(c)?$/i);
 return (m && +m[1] <= 360) ? +m[1] % 360 : null;};
const rumboMal = t => {
 const q = String(t).replace(/\s|°/g,"");
 if(/^\d{3}[tm]$/i.test(q)) return "That is marked as a <b>"+(/t$/i.test(q)?"true":"magnetic")
   +"</b> heading. What goes on the card in front of the helm is <b>by her compass</b>: write it as <b>ddd</b>, or <b>ddd C</b>.";
 if(/^\d{1,2}c?$/i.test(q)){const n=q.replace(/c$/i,"");
   return "A heading is three figures: <b>"+n+"</b> is written <b>"+n.padStart(3,"0")+"</b>.";}
 return "A heading is three figures, like <b>ddd</b> — <b>210</b>, <b>045</b>, <b>007</b>.";};

const leeMinutos = t => {
 const q = String(t||"").toLowerCase().trim().replace(/\s+/g," ");
 let m = q.match(/^(\d+)(?:\.0+)?\s*(?:m|min|mins|minutes?)?$/);
 if(m) return +m[1];
 m = q.match(/^(\d+):([0-5]\d)$/);
 if(m) return 60*m[1] + +m[2];
 m = q.match(/^(\d+)\s*(?:h|hr|hrs|hours?)\s*(?:([0-5]?\d)\s*(?:m|min|mins|minutes?)?)?$/);
 if(m) return 60*m[1] + (m[2] ? +m[2] : 0);
 return null;};

window.resp=()=>{const s=S();
 const t=document.getElementById("in").value;
 const v = s.rumbo ? normaRumbo(t) : s.un==="minutes" ? leeMinutos(t)
   : (numeros(t).length===1 ? numeros(t)[0] : null);
 if(v===null){falla(s, s.rumbo ? rumboMal(t)
   : s.un==="minutes" ? "The answer is in <b>minutes</b>: a whole number, like <b>45</b> — or <b>1:05</b> for an hour and five minutes."
   : "Just the number will do."); return;}
 const r=s.ck(v); guarda("num",v,r.ok); if(!r.stay)MED[s.id]={v:v};
 if(r.ok===false){falla(s,r.m); if(!r.stay)pasa(); return;}
 fb(r.m,r.ok===true?"si":""); if(!r.stay)pasa();};

function corte(c, R, a, u){
 const wx=c[0]-a[0], wy=c[1]-a[1];
 const t=wx*u[0]+wy*u[1];
 const p=wx*(-u[1])+wy*u[0];
 if(Math.abs(p)>R)return null;
 const d=Math.sqrt(Math.max(0, R*R-p*p));
 return [t-d, t+d];}
const corteBueno = r => (r && r[1] > 0) ? r[1] : null;

svg.addEventListener("pointerup",e=>{
 if(cuerpo)cuerpo.classList.remove("arrastrando");
 if(tira){arr=null;tira=null;return;}
 if(arr&&mov<CLIC&&!hecho){
  const s=S(), p=xy(e);
  if(s.t=="click"&&s.sep){
   const ok=veredictoPin(s,p);
   guarda("click",[Math.round(p[0]),Math.round(p[1])],ok);
   if(ok){hecho=true;fb(s.ok,"si");nav(true);}else falla(s,s.no);
   capa();}
  else if(s.t=="protra"){
   if(!TR.a||TR.b)TR={a:p,b:null,off:0};
   else{TR.b=p;TR.off=(trDir()+55)%360;}
   capa();}}
 arr=null;});

function aplicaPaso(){
 const s=S(), q=pasoActual();
 s._ver = q ? (q.ver||[]) : (s.ver||[]);}

function pinta(){ guardaDonde();
 const s=S(); progreso();
 aplicaPaso();
 if(s.v)ponVista(s.v);
 let h=`<div class="hd"><h3>Topic ${paso.p+1} · ${PZ[paso.p].t}</h3>`
  +(/\.P/.test(s.id)?`<a class="skip" onclick="salta()">Skip</a>`:"")+`</div>`;
 if(s.h)h+=`<h2>${s.h}</h2>`;
 h+=(s.p||[]).map(t=>`<p>${t}</p>`).join("");
 if(s.calc)h+=`<div class="calc">${s.calc}</div>`;

 if(s.t=="choice") h+=panelChoice(s);
 else if(s.t=="click") h+=`<div id="fb"><small>${s.ay||"Click it on the chart."}</small></div>`;

 else if(s.t=="protra")h+=`<div class="gu"><b id="trR">${TR_SIN}</b></div>
   <div><button onclick="leeTr()">Read the bearing</button>
   <button class="sec" onclick="otroTr()">Start again</button></div>
   <div id="fb">${ayudaTr(s)}</div>`;
 else if(s.t=="num")h+=`<div><input id="in" inputmode="decimal" placeholder="${s.ph||""}">
   <span> ${s.un||""}</span> <button onclick="resp()">Answer</button></div>
   <div id="fb"></div>`;
 if(s.pasos){const q=pasoActual();
  h+=`<div class="hd"><h3>Step ${iPaso+1} of ${s.pasos.length}</h3></div>`;
  h+=`<p>${q.t}</p>`;
  if(q.calc)h+=`<div class="calc">${q.calc}</div>`;
  h+=`<div><button class="sec" onclick="pasoAtras()"${iPaso?"":" disabled"}>&#8592; Step back</button>
   <button onclick="pasoSig()"${iPaso>=s.pasos.length-1?" disabled":""}>Next step &#8594;</button></div>`;}
 h+=`<div class="nav" id="nav"></div>`;
 document.getElementById("pane").innerHTML=h;

 if(s.t=="num"){const i=document.getElementById("in");
  if(i){i.focus(); i.onkeydown=e=>{if(e.key=="Enter")resp();};}}
 nav(s.pasos ? (iPaso>=s.pasos.length-1) : (!s.t||s.t=="text"||hecho));
 svg.classList.toggle("pick",s.t=="click"||s.t=="protra");
 capa();}

window.salta=()=>{const s=S(); guarda("skipped","",false); hecho=true; nav(true);
 fb("","");};

function capaExtra(){
 const s=S(), k=esc();

 ROTULOS=[]; SIN_SITIO.length=0; CUERDAS=[];
 const ver=n=>!s._ver||!s._ver.length||s._ver.indexOf(n)>=0;

 for(const q of (s.fix||[])){
  if(!ver("fix"))break;
  const c=P(q[0],q[1]), pl=pluma(q,k);
  el("circle",conGuion({cx:c[0],cy:c[1],r:9*k,fill:"none",stroke:pl.tinta,
   "stroke-width":2.6*k},pl),gL);
  el("circle",{cx:c[0],cy:c[1],r:2.2*k,fill:pl.tinta},gL);
  if(q[2])_apunta([c[0],c[1]],q[2],k,pl.tinta);}

 for(const q of (s.derrota||[])){
  if(!ver("derrota"))break;
  const a=P(q[0],q[1]), b=P(q[2],q[3]), pl=pluma(q,k);
  el("line",conGuion({x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:pl.tinta,
   "stroke-width":3.4*k},pl),gL);
  _puntas(a,b,1,k,gL,pl.tinta);
  if(q[5])_apunta([(a[0]+b[0])/2,(a[1]+b[1])/2],q[5],k,pl.tinta);}

 for(const q of (s.estima||[])){
  if(!ver("estima"))break;
  const c=P(q[0],q[1]), pl=pluma(q,k);
  const r=q[2]*Math.PI/180, NN=CARTA_NORTE||[0,-1], EE=[-NN[1],NN[0]];
  const ux=NN[0]*Math.cos(r)+EE[0]*Math.sin(r), uy=NN[1]*Math.cos(r)+EE[1]*Math.sin(r);

  el("line",conGuion({x1:c[0]-uy*17*k,y1:c[1]+ux*17*k,x2:c[0]+uy*17*k,y2:c[1]-ux*17*k,
   stroke:pl.tinta,"stroke-width":3.4*k},
   pl.guion?{guion:(7*k)+" "+(5*k)}:pl),gL);
  if(q[3])_apunta(c,q[3],k,pl.tinta);}

 for(const q of (s.agua||[])){
  if(!ver("agua"))break;
  const a=P(q[0],q[1]), b=P(q[2],q[3]), pl=pluma(q,k);
  el("line",conGuion({x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:pl.tinta,
   "stroke-width":3.4*k},pl),gL);
  _puntas(a,b,1,k,gL,pl.tinta);
  if(q[5])_apunta([(a[0]+b[0])/2,(a[1]+b[1])/2],q[5],k,pl.tinta);}

 for(const q of (s.vector||[])){
  if(!ver("vector"))break;
  const a=P(q[0],q[1]), b=P(q[2],q[3]), pl=pluma(q,k);
  el("line",conGuion({x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:pl.tinta,
   "stroke-width":3.4*k},pl),gL);
  _puntas(a,b,3,k,gL,pl.tinta);
  if(q[4])_apunta(b,q[4],k,pl.tinta);}

 for(const q of (s.fondo||[])){
  if(!ver("fondo"))break;
  const a=P(q[0],q[1]), b=P(q[2],q[3]), pl=pluma(q,k);
  el("line",conGuion({x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:pl.tinta,
   "stroke-width":3.4*k},pl),gL);
  _puntas(a,b,2,k,gL,pl.tinta);
  if(q[4])_apunta(q[5]==="fin" ? b : [(a[0]+b[0])/2,(a[1]+b[1])/2],q[4],k,pl.tinta);}

 for(const q of (s.arco||[])){
  if(!ver("arco"))break;
  const c=P(q[0],q[1]), R=q[2], pl=pluma(q,k);
  const NN=CARTA_NORTE||[0,-1], EE=[-NN[1],NN[0]];
  const pt=g=>{const r=g*Math.PI/180;
   return [c[0]+(NN[0]*Math.cos(r)+EE[0]*Math.sin(r))*R, c[1]+(NN[1]*Math.cos(r)+EE[1]*Math.sin(r))*R];};
  const ab=((q[4]-q[3])%360+360)%360, a=pt(q[3]), b=pt(q[4]);

  const nc=Math.max(1,Math.ceil(ab/PASO_ARCO));
  for(let i=0;i<nc;i++){
   const u=pt(q[3]+ab*i/nc), w=pt(q[3]+ab*(i+1)/nc);
   CUERDAS.push([u[0],u[1],w[0],w[1]]);}
  el("path",conGuion({d:`M${a[0]},${a[1]}A${R},${R} 0 ${ab>180?1:0} 1 ${b[0]},${b[1]}`,
   fill:"none",stroke:pl.tinta,"stroke-width":2.6*k},pl),gL);

  if(q[5])_apunta(q[6]==="desde" ? a : pt(q[3]+ab/2),q[5],k,pl.tinta);}

 for(const q of (s.ep||[])){
  if(!ver("ep"))break;
  const c=P(q[0],q[1]), r=12*k, pl=pluma(q,k);
  el("path",conGuion({d:`M${c[0]},${c[1]-r}L${c[0]+r*0.87},${c[1]+r*0.5}`
   +`L${c[0]-r*0.87},${c[1]+r*0.5}Z`,fill:"none",stroke:pl.tinta,
   "stroke-width":2.6*k},pl),gL);
  el("circle",{cx:c[0],cy:c[1],r:2.2*k,fill:pl.tinta},gL);
  if(q[2])_apunta([c[0],c[1]],q[2],k,pl.tinta);}

 if(PIN){
  el("line",{x1:PIN[0]-11*k,y1:PIN[1]-11*k,x2:PIN[0]+11*k,y2:PIN[1]+11*k,
   stroke:"#B33A22","stroke-width":3*k},gL);
  el("line",{x1:PIN[0]-11*k,y1:PIN[1]+11*k,x2:PIN[0]+11*k,y2:PIN[1]-11*k,
   stroke:"#B33A22","stroke-width":3*k},gL);}

 _coloca();}

paso=donde(); if(typeof ponEst==="function")ponEst();
pinta();
marcoChrome();
</script>
