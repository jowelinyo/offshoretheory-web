function cascoFigura(id){
  const f = (CASCOS_TIPOS.figuras_de_hoy || {})[id] || (CASCOS_TIPOS.tipos || {})[id];
  if(!f) throw new Error("cascos-tipos.json no tiene el dibujo «" + id + "»");
  return f;
}

function puntosPlanta(f, L, P){
  const M = L*f.semimanga;
  return f.planta.map(q => P(L*q[0], M*q[1]));
}
function caminoRedondo(q){
  return "M" + q.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L") + " Z";
}

function caminoFino(q){
  return "M" + q.map(p => p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" L") + " Z";
}

function caminoCrudo(q){
  return "M" + q.map(p => p[0] + "," + p[1]).join(" L") + " Z";
}

function cascoEnPlanta(x, y, rumbo, tinta, L, quien, opt){
  const o = opt || {};
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const P = o.este ? (av, tr) => [x + cs*av - sn*tr, y + sn*av + cs*tr]
                   : (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  const q = puntosPlanta(cascoFigura("nueve"), L, P);
  const gr = el("g", {"data-barco": quien});
  el("path", {d: caminoRedondo(q), fill: tinta, opacity: .95, "data-buque": "1"}, gr);
  return L;
}

function plantaBarco(x, y, rumbo, tinta, op, largo, padre){
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const L = largo || px(24);
  const P = (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];

  el("path", {d: caminoRedondo(puntosPlanta(cascoFigura("generico"), L, P)), fill: tinta,
              opacity: op === undefined ? .95 : op, "data-buque": "1"}, padre);
}

function cascoVelero(x, y, rumbo, tinta, L, padre){
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const P = (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  el("path", {d: caminoRedondo(puntosPlanta(cascoFigura("velero_fino"), L, P)),
              fill: tinta, opacity: .95, "data-buque": "1"}, padre);
}

function aparejoDeVelero(x, y, rumbo, tinta, L, lado, opt){
  const o = opt || {};
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const P = (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  const ap = (o.tipo ? cascoFigura(o.tipo) : cascoFigura("velero_fino")).aparejo;
  const a = P(L*ap.palo[0], ap.palo[1] ? lado*L*ap.palo[1] : 0);
  const b = P(L*ap.botavara[0], lado*L*ap.botavara[1]);
  const grueso = o.grueso === undefined ? 3 : o.grueso;
  const palo   = o.palo   === undefined ? 3 : o.palo;
  el("circle", {cx: a[0], cy: a[1], r: palo, fill: tinta}, o.padre);
  el("line", {x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: tinta,
              "stroke-width": grueso, "stroke-linecap": "round",
              "data-botavara": o.marca}, o.padre);
}

function perfilDeCostado(x, y, L, H, b, tinta, padre){
  const q = cascoFigura("costado").perfil.map(p => [x + L*p[0], y - H*b*p[1]]);
  el("path", {d: caminoCrudo(q), fill: tinta, opacity: .95, "data-buque": "1"}, padre);
}

function fuselajeDeCostado(x, y, L, H, tinta, padre){
  const q = cascoFigura("fuselaje").perfil.map(p => [x + L*p[0], y - H*p[1]]);
  el("path", {d: caminoCrudo(q), fill: tinta, opacity: .95, "data-buque": "1"}, padre);
}

function cascoLadeado(x, y, L, tinta, padre){
  const f = cascoFigura("ladeada"), M = L*f.semimanga;
  const q = f.pantalla.map(p => [x + L*p[0], y + (p[2] === "M" ? M : L)*p[1]]);
  el("path", {d: caminoCrudo(q), fill: tinta, opacity: .95, "data-buque": "1"}, padre);
}

function tintaDe(nombre, tinta, o){
  const t = (o && o.tintas) || {};
  return nombre === "casco" ? tinta : (t[nombre] || tinta);
}
function buquePlanta(x, y, rumbo, tinta, L, tipo, opt){
  const o = opt || {}, f = cascoFigura(tipo);
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);

  const P = o.este ? (av, tr) => [x + cs*av - sn*tr, y + sn*av + cs*tr]
                   : (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  const gr = el("g", {"data-barco": o.quien || null, "data-tipo": tipo}, o.padre);
  el("path", {d: caminoFino(puntosPlanta(f, L, P)), fill: tinta,
              opacity: o.op === undefined ? .95 : o.op, "data-buque": "1"}, gr);
  const enPantalla = L*(o.escala || 1);
  (f.detalles || []).forEach(function(dt){
    if(enPantalla < dt.desde_px) return;
    el("path", {d: caminoFino(puntosPlanta({semimanga: f.semimanga, planta: dt.forma}, L, P)),
                fill: tintaDe(dt.tinta, tinta, o), "data-detalle": "1"}, gr);
  });

  if(f.aparejo && !o.este && o.aparejo !== false)
    aparejoDeVelero(x, y, rumbo, tinta, L, o.lado || 1,
                    {tipo: tipo, padre: gr,
                     grueso: o.grueso === undefined ? Math.max(1.2, L*0.025) : o.grueso,
                     palo: o.palo === undefined ? Math.max(1.4, L*0.03) : o.palo,
                     marca: o.marca});
  return gr;
}

function cajaPlanta(L, tipo, rumbo, este){
  const f = cascoFigura(tipo), g = rumbo*Math.PI/180;
  const a = L/2, b = L*f.semimanga;
  const s = Math.abs(Math.sin(g)), c = Math.abs(Math.cos(g));
  return este ? {hx: c*a + s*b, hy: s*a + c*b} : {hx: s*a + c*b, hy: c*a + s*b};
}
function sitiosJunto(x, y, caja, lineas, u){
  const n = lineas.length, w = 6.6*u*Math.max.apply(null, lineas.map(t => t.length));
  return [[x, y + caja.hy + 14*u],
          [x, y - caja.hy - 6*u - (n - 1)*15*u],
          [x + caja.hx + 8*u + w/2, y + 4*u - (n - 1)*7.5*u],
          [x - caja.hx - 8*u - w/2, y + 4*u - (n - 1)*7.5*u]];
}
function cajaQueOcupa(x, y, caja){
  return [x - caja.hx, y - caja.hy, x + caja.hx, y + caja.hy];
}

function colocaRotulo(x0, y0, lineas, o){
  const px = o.px, P = o.puestos, c = o.tapa || null;
  const alto = lineas.length*px(o.renglon || 15);
  const ancho = px(o.porLetra || 6.6)*Math.max.apply(null, lineas.map(t => t.length));
  const orilla = o.orilla ? Math.max(px(o.orilla), ancho/2 + px(16)) : ancho/2 + px(16);
  const izq = orilla, der = o.ancho - orilla;
  const suelo = o.y1 - px(28) - alto, techo = o.y0 + px(20);
  const corte = (a0, a1, b0, b1) => Math.max(0, Math.min(a1, b1) - Math.max(a0, b0));
  const choca = (x, y) => (c !== null && x + ancho/2 > c[0] && x - ancho/2 < c[2]
                           && y + alto > c[1] && y - px(12) < c[3])
    || P.some(q => x + ancho/2 > q[0] && x - ancho/2 < q[2]
                && y + alto + px(4) > q[1] && y - px(16) < q[3]);
  const pisa = (x, y) => (c !== null ? corte(x - ancho/2, x + ancho/2, c[0], c[2])
                                       *corte(y - px(12), y + alto, c[1], c[3]) : 0)
    + P.reduce((s, q) => s + corte(x - ancho/2, x + ancho/2, q[0], q[2])
                             *corte(y - px(16), y + alto + px(4), q[1], q[3]), 0);
  let x = Math.max(izq, Math.min(x0, der));
  let y = Math.max(techo, Math.min(y0, suelo));
  if(o.anillos){
    const cabe = (x, y) => x >= izq - 0.5 && x <= der + 0.5
                        && y >= techo - 0.5 && y <= suelo + 0.5;
    if(choca(x, y)){
      let puesto = false, mejor = {x: x, y: y, a: pisa(x, y)};
      for(let r = 1; r <= 30 && !puesto; r++){
        const v = r*px(9), w = v*0.72;
        const vueltas = [[0, v], [0, -v], [v, 0], [-v, 0],
                         [w, w], [-w, w], [w, -w], [-w, -w]];
        for(let i = 0; i < vueltas.length && !puesto; i++){
          const cx = x + vueltas[i][0], cy = y + vueltas[i][1];
          if(!cabe(cx, cy)) continue;
          if(!choca(cx, cy)){ x = cx; y = cy; puesto = true; }
          else { const a = pisa(cx, cy); if(a < mejor.a) mejor = {x: cx, y: cy, a: a}; }
        }
      }
      if(!puesto){ x = mejor.x; y = mejor.y; }
    }
  } else {
    let mejor = {x: x, y: y, a: pisa(x, y)};
    const apunta = v => { const a = pisa(x, v); if(a < mejor.a) mejor = {x: x, y: v, a: a}; };
    if(choca(x, y) && o.otros) for(const q of o.otros){
      const xa = x, w = Math.max(techo, Math.min(q[1], suelo));
      x = Math.max(izq, Math.min(q[0], der));
      if(!choca(x, w)){ y = w; break; }
      apunta(w);
      x = xa;
    }
    if(choca(x, y)){
      let puesto = false;

      for(let v = y; v <= suelo && !puesto; v += px(9))
        if(!choca(x, v)){ y = v; puesto = true; } else apunta(v);
      for(let v = y; v >= techo && !puesto; v -= px(9))
        if(!choca(x, v)){ y = v; puesto = true; } else apunta(v);
      if(!puesto){ x = mejor.x; y = mejor.y; }
    }
  }
  P.push([x - ancho/2, y - px(12), x + ancho/2, y + alto]);
  return {x: x, y: y};
}

function cedenLasSondas(svg, m){
  const todas = [].slice.call(svg.querySelectorAll("text"));
  const sondas = todas.filter(t => t.getAttribute("fill") === "var(--carta-sonda)");

  const otras = todas.filter(t => sondas.indexOf(t) < 0).map(t => t.getBBox())
    .concat([].map.call(svg.querySelectorAll("path[data-buque]"), p => p.getBBox()))
    .concat([].map.call(svg.querySelectorAll("[data-boya]"), p => p.getBBox()));

  const puestas = [];
  sondas.forEach(function(s){
    const a = s.getBBox();
    if(otras.some(b => a.x < b.x + b.width + m && a.x + a.width + m > b.x
                    && a.y < b.y + b.height + m && a.y + a.height + m > b.y)){ s.remove(); return; }
    if(puestas.some(b => a.x < b.x + b.width && a.x + a.width > b.x
                      && a.y < b.y + b.height && a.y + a.height > b.y)){ s.remove(); return; }
    puestas.push(a);
  });
}

function buquePerfil(x, yAgua, L, tipo, tinta, opt){
  const o = opt || {}, f = cascoFigura(tipo).perfil;
  if(!f) throw new Error("el tipo «" + tipo + "» no tiene perfil");
  const X = a => x + a*L, Y = z => yAgua - z*L, grueso = Math.max(1, L*0.012);
  const gr = el("g", {"data-tipo": tipo, "data-vista": "perfil"}, o.padre);
  el("path", {d: caminoRedondo(f.casco.map(p => [X(p[0]), Y(p[1])])), fill: tinta,
              "data-buque": "1"}, gr);
  f.bloques.forEach(b => el("path", {d: caminoRedondo([[X(b.a[0]), Y(b.z[1])], [X(b.a[1]), Y(b.z[1])],
                                                      [X(b.a[1]), Y(b.z[0])], [X(b.a[0]), Y(b.z[0])]]),
                                     fill: tintaDe("suave", tinta, o)}, gr));
  f.palos.forEach(m => el("line", {x1: X(m.a), y1: Y(m.z[0]), x2: X(m.a), y2: Y(m.z[1]),
                                   stroke: tinta, "stroke-width": grueso}, gr));
  f.perchas.forEach(s => el("line", {x1: X(s.a[0]), y1: Y(s.z), x2: X(s.a[1]), y2: Y(s.z),
                                     stroke: tinta, "stroke-width": grueso}, gr));
  return gr;
}

function envolturaConvexa(P){
  P = P.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo = [], hi = [];
  for(const q of P){ while(lo.length >= 2 && cr(lo[lo.length-2], lo[lo.length-1], q) <= 0) lo.pop(); lo.push(q); }
  for(let i = P.length - 1; i >= 0; i--){ const q = P[i];
    while(hi.length >= 2 && cr(hi[hi.length-2], hi[hi.length-1], q) <= 0) hi.pop(); hi.push(q); }
  hi.pop(); lo.pop(); return lo.concat(hi);
}

function semiDe(f, a){
  let best = 0;
  const q = f.planta;
  for(let i = 0; i < q.length; i++){
    const A = q[i], B = q[(i + 1) % q.length];
    if((A[0] - a)*(B[0] - a) > 0 || A[0] === B[0]) continue;
    const b = A[1] + (B[1] - A[1])*(a - A[0])/(B[0] - A[0]);
    if(b > best) best = b;
  }
  return best;
}
function buqueAspecto(x, yAgua, L, tipo, m, tinta, opt){
  const o = opt || {}, f = cascoFigura(tipo), pf = f.perfil;
  if(!pf) throw new Error("el tipo «" + tipo + "» no tiene perfil");
  const r = m*Math.PI/180, rx = Math.sin(r), ry = -Math.cos(r), dx = Math.cos(r);
  const M = f.semimanga;
  const S = (a, b, z) => [x + (a*rx + b*M*ry)*L, yAgua - z*L];
  const gr = el("g", {"data-tipo": tipo, "data-vista": "aspecto", "data-marcacion": m}, o.padre);

  const cas = pf.casco, cort = (a, arriba) => { let best = null;
    for(let i = 0; i < cas.length; i++){ const A = cas[i], B = cas[(i+1) % cas.length];
      if((A[0] - a)*(B[0] - a) > 0 || A[0] === B[0]) continue;
      const z = A[1] + (B[1] - A[1])*(a - A[0])/(B[0] - A[0]);
      if(best === null || (arriba ? z > best : z < best)) best = z; }
    return best; };
  const a0 = Math.min.apply(null, cas.map(p => p[0])), a1 = Math.max.apply(null, cas.map(p => p[0]));
  const pts = [];
  for(let i = 0; i <= 40; i++){
    const a = a0 + 0.0001 + (a1 - a0 - 0.0002)*i/40;
    const zt = cort(a, true), zb = cort(a, false); if(zt === null) continue;
    const s = semiDe(f, a);
    pts.push(S(a, s, zt), S(a, -s, zt), S(a, s, zb), S(a, -s, zb));
  }
  el("path", {d: caminoRedondo(envolturaConvexa(pts)), fill: tinta, "data-buque": "1"}, gr);
  pf.bloques.map(b => ({b: b, prof: ((b.a[0] + b.a[1])/2)*dx}))
    .sort((A, B) => A.prof - B.prof).forEach(function(q){
      const b = q.b, Q = [];
      b.a.forEach(a => [-b.semiancho, b.semiancho].forEach(v => b.z.forEach(z => Q.push(S(a, v, z)))));
      el("path", {d: caminoRedondo(envolturaConvexa(Q)), fill: tintaDe("suave", tinta, o)}, gr);
    });
  const grueso = Math.max(1, L*0.012);
  pf.palos.forEach(p => { const A = S(p.a, 0, p.z[0]), B = S(p.a, 0, p.z[1]);
    el("line", {x1: A[0], y1: A[1], x2: B[0], y2: B[1], stroke: tinta, "stroke-width": grueso}, gr); });
  pf.perchas.forEach(p => { const A = S(p.a[0], 0, p.z), B = S(p.a[1], 0, p.z);
    el("line", {x1: A[0], y1: A[1], x2: B[0], y2: B[1], stroke: tinta, "stroke-width": grueso}, gr); });
  return gr;
}

const B360 = (function(){
 const LADO = 1, DESFASE = 0;

 const TIPOS = ["velero", "lancha", "motor20", "costero", "mercante", "pesquero",
                "remolcador", "practico", "gabarra"];

 const E = (rot, v) => ({rot: rot, v: v});
 function estados(tipo){
  const L = CASCOS_TIPOS.tipos[tipo].eslora_m;
  const P = o => Object.assign({length: L}, o);
  switch(tipo){
   case "velero": return [
     E("under sail, making way", P({type: "sailing"})),
     E("sailing and motoring", P({type: "power", velaYMotor: true})),
     E("at anchor", P({type: "sailing", underway: false}))];
   case "lancha": return [
     E("under way", P({type: "power"})),
     E("at anchor", P({type: "power", underway: false}))];
   case "motor20": case "costero": return [
     E("under way, making way", P({type: "power"})),
     E("under way, not making way", P({type: "power", makingWay: false})),
     E("at anchor", P({type: "power", underway: false}))];
   case "mercante": return [
     E("under way, making way", P({type: "power"})),
     E("under way, not making way", P({type: "power", makingWay: false})),
     E("at anchor", P({type: "power", underway: false})),
     E("not under command, making way", P({type: "nuc"})),
     E("not under command, stopped", P({type: "nuc", makingWay: false})),
     E("restricted in ability to manoeuvre, making way", P({type: "ram"})),
     E("restricted in ability to manoeuvre, at anchor", P({type: "ram", underway: false})),
     E("constrained by her draught", P({type: "cbd"}))];
   case "pesquero": return [
     E("trawling, making way", P({type: "fishingTrawl"})),
     E("trawling, not making way", P({type: "fishingTrawl", makingWay: false})),
     E("fishing (not trawling), making way", P({type: "fishingOther"})),
     E("fishing (not trawling), not making way", P({type: "fishingOther", makingWay: false})),
     E("trawling, at anchor", P({type: "fishingTrawl", underway: false})),
     E("on passage, not fishing", P({type: "power"}))];
   case "remolcador": return [
     E("on passage, not towing", P({type: "power"})),
     E("towing, tow 200 m or less", P({type: "towing", towLength: 120, towedLength: 60})),
     E("towing, tow over 200 m", P({type: "towing", towLength: 250, towedLength: 60})),
     E("at anchor", P({type: "power", underway: false}))];
   case "practico": return [
     E("on pilotage duty, under way", P({type: "pilot"})),
     E("on pilotage duty, at anchor", P({type: "pilot", underway: false}))];
   case "gabarra": return [
     E("being towed, tow 200 m or less", {type: "towing", length: 30, towLength: 120,
                                          towedLength: L, remolcada: true}),
     E("being towed, tow over 200 m", {type: "towing", length: 30, towLength: 250,
                                       towedLength: L, remolcada: true}),
     E("at anchor", P({type: "power", underway: false}))];
  }
  return [];
 }

 const aspecto = m => { const a = ((m % 360) + 360) % 360; return a > 180 ? a - 360 : a; };

 function piezas(tipo, v){
  const todas = configuration(v);
  if(v.type !== "towing") return [{tipo: tipo, todas: todas, Lm: v.length || 12, off: 0, marcas: true}];
  const tug = todas.filter(l => !l.tow), tow = todas.filter(l => l.tow);
  if(v.remolcada) return [{tipo: "gabarra", todas: tow, Lm: towEslora(v), off: 0, marcas: true}];
  return [{tipo: tipo, todas: tug, Lm: v.length || 12, off: 0, marcas: true},
          {tipo: "gabarra", todas: tow, Lm: towEslora(v), off: -towAtras(v), marcas: true}];
 }

 function vistas(v, todas, m, dist){
  const R = ranges(v.length || 12), a = aspecto(m + DESFASE);
  return todas.filter(l => visible(l, a) && (dist === undefined || dist <= R[l.rangeKey]));
 }

 function pinta(padre, o){
  const v = o.v, m = o.m, dist = o.dist, noche = !!o.noche, cj = o.caja;
  const sn = Math.sin(m*Math.PI/180), cs = Math.cos(m*Math.PI/180);
  const ps = piezas(o.tipo, v);

  const ext0 = Math.min.apply(null, ps.map(p => p.off - p.Lm/2));
  const ext1 = Math.max.apply(null, ps.map(p => p.off + p.Lm/2));
  const ancho = cj.x1 - cj.x0;
  const u = Math.min(o.u1 / dist, ancho*0.86 / Math.max(1, (ext1 - ext0)*Math.abs(sn) + 0.25*(ext1 - ext0)*Math.abs(cs)));
  const medio = (ext0 + ext1)/2, cx = (cj.x0 + cj.x1)/2;
  const yAgua = cj.y0 + (cj.y1 - cj.y0)*0.70;
  const g = el("g", {"data-b360": o.tipo, "data-m": m}, padre);
  const hecho = {luces: [], marcas: [], sinSitio: 0};

  ps.slice().sort((A, B) => A.off*cs - B.off*cs).forEach(function(p){

   const h = marcoDe(p.tipo), Lpx = p.Lm*u, S = SITIOS_TIPOS[p.tipo];
   const x = cx + (p.off - medio)*u*sn;
   const f0 = h.plan[0], f1 = h.plan[1], len = f1 - f0, mid = (f0 + f1)/2;

   const kRef = len*S.radio_luz/7;
   const pant = q => {
    const a = (q.f - mid)/len, b = LADO*(q.s || 0)/len, z = (h.ywater - q.y)/len;
    return [x + (a*sn - b*cs)*Lpx, yAgua - z*Lpx];
   };

   const gp = el("g", {"data-pieza": p.tipo, "data-radio": (S.radio_luz*Lpx).toFixed(2)}, g);
   if(!noche){
    buqueAspecto(x, yAgua, Lpx, p.tipo, ((m % 360) + 360) % 360, "var(--b360-casco)",
                 {padre: gp, tintas: {suave: "var(--b360-suave)"}});

    const todas = p.todas, sr = sitiaRef(v, todas, todas, h), col = {};
    todas.forEach(function(l, i){
     if(l.kind !== "masthead" || !sr[i]) return;
     const a = (sr[i].f - mid)/len, z = (h.ywater - sr[i].y)/len, k = a.toFixed(4);
     (col[k] = col[k] || []).push(z);
    });
    Object.keys(col).forEach(function(k){
     const a = +k, zLuz = Math.max.apply(null, col[k]), zTop = zLuz + S.radio_luz*6/7;
     const palo = CASCOS_TIPOS.tipos[p.tipo].perfil.palos
       .filter(q => Math.abs(q.a - a) <= S.radio_luz)[0];

     if(!palo || zLuz <= palo.z[1] + 1e-6) return;
     const P1 = [x + palo.a*sn*Lpx, yAgua - palo.z[1]*Lpx], P2 = [P1[0], yAgua - zTop*Lpx];
     el("line", {x1: P1[0], y1: P1[1], x2: P2[0], y2: P2[1], stroke: "var(--b360-casco)",
                 "stroke-width": Math.max(1, Lpx*0.012), "data-palo-crece": 1}, gp);
    });
    if(p.marcas){
     const formas = marcasDia(v), ms = marcasRefDe(formas);
     const anc = POSICIONES[p.tipo].columna.libre, e = Lpx*S.radio_luz/7;
     const gm = el("g", {"data-marcas": formas.join(",")}, gp);
     let y = anc[1];
     ms.forEach(function(k){
      const c = pant({f: anc[0], s: 0, y: y + ALTO_MARCA[k]*kRef/2});

      marcaRef(el("g", {"data-marca": k}, gm), c[0], c[1], k, "var(--b360-casco)", p.tipo, e);
      hecho.marcas.push(k);
      y += (ALTO_MARCA[k] + PASO_MARCA)*kRef;
     });
    }
    return;
   }
   const vis = vistas(v, p.todas, m, dist);
   const sit = sitiaRef(v, vis, p.todas, h);
   const r = Math.max(3.2, Math.min(9, Lpx*0.022));
   vis.forEach(function(l, i){
    const q = sit[i];
    if(!q) hecho.sinSitio++;
    const c = q ? pant(q) : [x, yAgua - Lpx*0.1];
    el("circle", {cx: c[0], cy: c[1], r: r*2.6, fill: COLOR_LUZ[l.colour], opacity: .22}, gp);
    el("circle", {cx: c[0], cy: c[1], r: r, fill: COLOR_LUZ[l.colour],
                  "data-luz": l.kind, "data-color": l.colour, "data-tow": l.tow ? 1 : 0,
                  "data-sinsitio": q ? null : 1}, gp);
    hecho.luces.push(l.kind + ":" + l.colour + (l.tow ? ":tow" : ""));
   });
  });

  g.setAttribute("data-agua", yAgua.toFixed(1));
  g.setAttribute("data-escala", u.toFixed(4));
  return hecho;
 }

 return {TIPOS: TIPOS, estados: estados, piezas: piezas, vistas: vistas,
         pinta: pinta, aspecto: aspecto};
})();

B360.siluetaLuces = function(g, h, PJ, tinta, nave, v){
 const tipo = nombreCasco(h), f0 = h.plan[0], f1 = h.plan[1], len = f1 - f0, mid = (f0 + f1)/2;
 const m = Math.atan2(PJ.f, -(PJ.lado || 0))*180/Math.PI;
 const pon = el;
 el = (t, at, pa) => {

  if(at && "data-buque" in at){ at = Object.assign({}, at); delete at["data-buque"];
   at["data-casco"] = 1; at["data-escorzo"] = PJ.f.toFixed(4); }
  if(at){ at = Object.assign({}, at); at["data-nave"] = nave; }
  return pon(t, at, pa);
 };
 try {
  buqueAspecto(mid*PJ.f, h.ywater, len, tipo, m, tinta, {padre: g});
  if(v){
   const todas = configuration(v).filter(l => !l.tow), sr = sitiaRef(v, todas, todas, h), col = {};
   todas.forEach(function(l, i){
    if(l.kind !== "masthead" || !sr[i]) return;
    const a = (sr[i].f - mid)/len, k = a.toFixed(4);
    (col[k] = col[k] || []).push((h.ywater - sr[i].y)/len);
   });
   const S = SITIOS_TIPOS[tipo], pf = CASCOS_TIPOS.tipos[tipo].perfil;
   Object.keys(col).forEach(function(k){
    const a = +k, zLuz = Math.max.apply(null, col[k]);
    const palo = pf.palos.filter(q => Math.abs(q.a - a) <= S.radio_luz)[0];
    if(!palo || zLuz <= palo.z[1] + 1e-6) return;
    const x = (palo.a*len + mid)*PJ.f, zTop = zLuz + S.radio_luz*6/7;
    el("line", {x1: x, y1: h.ywater - palo.z[1]*len, x2: x, y2: h.ywater - zTop*len,
                stroke: tinta, "stroke-width": Math.max(1, len*0.012), "data-palo": 1}, g);
   });
  }
 } finally { el = pon; }
};

function tipoDe(v){
 if(v && v.remolcada) return "gabarra";
 const t = (v && v.type) || "power", m = (v && v.length) || 30;
 if(t === "sailing") return "velero";
 if(t === "fishingTrawl" || t === "fishingOther") return "pesquero";
 if(t === "towing") return m < 50 ? "remolcador" : "mercante";
 if(t === "pilot" || t === "pilotUnderway") return "practico";
 if(m < 12) return "lancha";
 return m < 20 ? "motor20" : m <= 50 ? "costero" : "mercante";
}
function buque360(padre, o){
 o = o || {};
 let v = o.v, tipo = o.tipo;
 if(!v && tipo){
  const E = B360.estados(tipo);
  const e = typeof o.estado === "string" ? E.filter(q => q.rot === o.estado)[0] : E[o.estado || 0];
  if(!e) throw new Error("buque360: el tipo «" + tipo + "» no tiene el estado «" + o.estado + "»");
  v = e.v;
 }
 if(!v) throw new Error("buque360: hace falta `v`, o `tipo` y `estado`");
 if(o.modo === "luces"){
  const L = o.luces || {}, a = L.args || [];
  if(L.como === "casco") return lucesCasco(padre, v, a[0], a[1], a[2], a[3], a[4], a[5]);
  if(L.como === "naveDe") return lucesPintaNaveDe(padre, v, a[0], a[1], a[2]);
  return lucesPintaNave(padre, v, a[0], a[1]);
 }
 return B360.pinta(padre, {tipo: tipo || tipoDe(v), v: v, m: o.marcacion || 0,
                           dist: o.distancia === undefined ? 1 : o.distancia,
                           noche: o.modo !== "dia", caja: o.caja, u1: o.u1 || 6});
}

const ALTO_PANEL = (pasos, minimo, tope) =>
  Math.min(tope || 1e9, Math.max(minimo, pasos * LUZ.D + LUZ.D * 2.2));

const CORTE = ARC.masthead;

function marcacionCorta(g){
 const a = Math.abs(g);
 if(a <= 5)        return "dead ahead";
 if(a === 90)      return "on her beam";
 if(a < CORTE)     return a + "° · forward of the cut";
 if(a < CORTE + 2) return a + "° · past the cut";
 return a + "° on her quarter";
}
function nombraMarcacion(g){
 const a = Math.abs(g);
 if(a <= 5)         return "dead ahead of her";
 if(a < 90)         return a + "° on her bow";
 if(a === 90)       return "on her beam";
 if(a < CORTE)      return a + "° — abaft her beam, and still forward of the cut";
 if(a < CORTE + 2)  return a + "° — one degree past the cut";
 return a + "° on her quarter";
}

function diceDesde(q){
 const ve = vistas(q.buque, q.g)
   .filter(l => q.nm === undefined || q.nm <= ranges(q.buque.length || 12)[l.rangeKey]);
 const lados = ve.filter(l => l.kind === "starboard" || l.kind === "port").length;
 const alcance = ve.some(l => l.kind === "stern");
 const topes = ve.some(l => l.kind === "masthead");
 if(lados === 2) return "proa";
 if(lados === 1 || topes) return "delante";
 if(alcance) return "detras";
 return "muda";
}

function diceConfusion(q){
 const ids = identidades(q);
 if(ids.length > 1) return "muda";
 return claveDe(q.buque);
}

const diceLado = q => {
 const o = q.buque.obstruccion;
 if(!o) return "otra";
 const libreEstribor = o === "port";
 const delante = Math.abs(q.g) < 90;
 return (libreEstribor === delante) ? "izquierda" : "derecha";
};
const DICE = { DESDE: diceDesde, CONFUSION: diceConfusion, LADO: diceLado };

function verdadDesde(v, g, nm){
 const ve = vistas(v, g)
   .filter(l => nm === undefined || nm === null
             || nm <= ranges(v.length || 12)[l.rangeKey]);
 const lados = ve.filter(l => l.kind === "starboard" || l.kind === "port").length;
 if(lados === 2) return "proa";
 if(lados === 1 || ve.some(l => l.kind === "masthead")) return "delante";
 if(ve.some(l => l.kind === "stern")) return "detras";
 return "muda";
}
