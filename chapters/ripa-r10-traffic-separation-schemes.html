const LEY10 = ["(a) This Rule applies to traffic separation schemes adopted by the Organization and does not relieve any vessel of her obligation under any other rule.", "(b) A vessel using a traffic separation scheme shall:", "(i) proceed in the appropriate traffic lane in the general direction of traffic flow for that lane;", "(ii) so far as practicable keep clear of a traffic separation line or separation zone;", "(iii) normally join or leave a traffic lane at the termination of the lane, but when joining or leaving from either side shall do so at as small an angle to the general direction of traffic flow as practicable.", "(c) A vessel shall, so far as practicable, avoid crossing traffic lanes but if obliged to do so shall cross on a heading as nearly as practicable at right angles to the general direction of traffic flow.", "(d)", "(i) A vessel shall not use an inshore traffic zone when she can safely use the appropriate traffic lane within the adjacent traffic separation scheme. However, vessels of less than 20 meters in length, sailing vessels and vessels engaged in fishing may use the inshore traffic zone.", "(ii) Notwithstanding subparagraph (d)(i), a vessel may use an inshore traffic zone when en route to or from a port, offshore installation or structure, pilot station or any other place situated within the inshore traffic zone, or to avoid immediate danger.", "(e) A vessel other than a crossing vessel or a vessel joining or leaving a lane shall not normally enter a separation zone or cross a separation line except:", "(i) in cases of emergency to avoid immediate danger;", "(ii) to engage in fishing within a separation zone.", "(f) A vessel navigating in areas near the terminations of traffic separation schemes shall do so with particular caution.", "(g) A vessel shall so far as practicable avoid anchoring in a traffic separation scheme or in areas near its terminations.", "(h) A vessel not using a traffic separation scheme shall avoid it by as wide a mar function buque10(id){ return BUQUES10.filter(b => b.id === id)[0] || BUQUES10[1]; }

const DIBUJO10 = {suelo: 22, referencia: 12, exponente: 1/3};
function esloraDibujada10(m){
  return DIBUJO10.suelo * Math.pow(m/DIBUJO10.referencia, DIBUJO10.exponente);
}

const SITUACIONES10 = [
  {id: "via",     n: "Following it", ley: "b", sub: null},
  {id: "cruzo",   n: "Crossing",     ley: "c", sub: null},
  {id: "entro",   n: "Joining",      ley: "b", sub: "iii"},

];
function cita10(s){ return "(" + s.ley + ")" + (s.sub ? "(" + s.sub + ")" : ""); }
function situacion10(id){
  return SITUACIONES10.filter(s => s.id === id)[0] || SITUACIONES10[0];
}

const CORRIENTE = {rumbo: 0, nudos: 2};

const RUMBO = {min: 40, max: 140};
const ENTRADA = {min: -60, max: 60};
function mandoDe(sit){ return sit === "entro" ? ENTRADA : RUMBO; }

function viaDe(off){ return off >= 0 ? "estribor" : "babor"; }
function sentidoDe(off){ return TSS.sentido[viaDe(off)]; }

function rumboDelMando(off, sit, m){
  return sit === "entro" ? ((sentidoDe(off) + m) % 360 + 360) % 360 : m;
}

const RAD10 = Math.PI / 180;

function derrotaDe(rumbo, b){
  const x = b.nudos*Math.sin(rumbo*RAD10) + CORRIENTE.nudos*Math.sin(CORRIENTE.rumbo*RAD10);
  const y = b.nudos*Math.cos(rumbo*RAD10) + CORRIENTE.nudos*Math.cos(CORRIENTE.rumbo*RAD10);
  return {grados: (Math.atan2(x, y)*180/Math.PI + 360) % 360,
          nudos: Math.hypot(x, y)};
}
function abanico(a, b){
  let d = Math.abs(((a - b) % 360 + 540) % 360 - 180);
  return d;
}

function zonaDe(off){
  const a = Math.abs(off), tuyo = tuLado();
  if(a <= TSS.separacion) return "separacion";

  if(a <= TSS.via)        return off*tuyo > 0 ? "tuVia" : "otraVia";
  if(a <= TSS.costera)    return off > 0 ? "costeraEstribor" : "costeraBabor";
  return "fuera";
}
function enCostera(off){ return zonaDe(off).indexOf("costera") === 0; }
function enVia(off){ const z = zonaDe(off); return z === "tuVia" || z === "otraVia"; }

function enElDispositivo(off){ return Math.abs(off) <= TSS.via; }

function exceptuadaDeLaE(sit){ return sit === "cruzo" || sit === "entro"; }
function rompeLaE(off, sit){
  return zonaDe(off) === "separacion" && !exceptuadaDeLaE(sit);
}

function aLaSeparacion(off){ return Math.abs(off) - TSS.separacion; }

const BORDES = {escuadra: 10, diagonal: 25, pequeno: 20, corte: 45,
                cerca: 0.5, lejos: 1.5};

function estado10(off, id, sit, mando){
  const b = buque10(id), s = situacion10(sit);
  const z = zonaDe(off);
  const rumbo = rumboDelMando(off, sit, mando);
  const der = derrotaDe(rumbo, b);
  return {
    off: off, buque: b, sit: s, rumbo: rumbo, mando: mando,
    sentido: sentidoDe(off), via: viaDe(off),
    zona: z,
    enVia: enVia(off), enCostera: enCostera(off),
    enElDispositivo: enElDispositivo(off),
    rompeLaE: rompeLaE(off, sit), exceptuadaDeLaE: exceptuadaDeLaE(sit),
    aLaSeparacion: aLaSeparacion(off),
    derrota: der,

    fueraDeEscuadra: abanico(rumbo, 90),

    derrotaFueraDeEscuadra: abanico(der.grados, 90),

    alSentido: abanico(rumbo, sentidoDe(off)),

    puedeCostera: b.costera,
    estorbaVia: b.deber.indexOf("i") >= 0 || b.deber.indexOf("j") >= 0,
    ancho: b.deber.indexOf("i") >= 0
  };
}

function grado10(e){
  const s = e.sit.id, z = e.zona;

  if(e.rompeLaE) return "mal";

  if(s === "via"){
    if(z !== "tuVia") return "mal";
    return e.aLaSeparacion < BORDES.cerca ? "tibio" : "bien";
  }

  if(s === "cruzo"){
    if(!e.enElDispositivo) return "mal";
    if(e.fueraDeEscuadra >= BORDES.diagonal) return "mal";
    return e.fueraDeEscuadra > BORDES.escuadra ? "tibio" : "bien";
  }
  if(s === "entro"){
    if(e.alSentido >= BORDES.corte) return "mal";
    return e.alSentido > BORDES.pequeno ? "tibio" : "bien";
  }
  return e.enCostera && !e.puedeCostera ? "mal" : "bien";
}

function cascoEnPlanta(x, y, rumbo, tinta, L, quien, opt){
  const o = opt || {};

  const P = o.este ? (av, tr) => [x + cs*av - sn*tr, y + sn*av + cs*tr]
                   : (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  const M = L*0.09;
  const q = [P(L*0.50, 0), P(L*0.26, M*0.85), P(L*0.10, M),
             P(-L*0.44, M*0.9), P(-L*0.50, M*0.55),
             P(-L*0.50, -M*0.55), P(-L*0.44, -M*0.9),
             P(L*0.10, -M), P(L*0.26, -M*0.85)];
  const gr = el("g", {"data-barco": quien});

  return L;
}

const MILLAS10 = 13;
const COSTA = {media: 4.5, somera: 4.9, secante: 5.3, tierra: 5.5};
let E10 = {ox: 0, oy: 0, k: 1, y0: 0, y1: 0};
function fija10(){
  E10.y0 = px(186);
  E10.y1 = D.H - px(58);
  E10.ox = D.W*0.5;
  E10.k = D.W / MILLAS10;
  E10.oy = (E10.y0 + E10.y1)/2;
}
const TX = m => E10.ox + m*E10.k;
const TY = m => E10.oy - m*E10.k;
const TM = m => m*E10.k;

const TINTA10 = {bien: "ok", tibio: "tibio", mal: "alarm"};

function tuAltura(sit){
  return sit === "cruzo" ? TY(-1.6) : sit === "entro" ? TY(-1.2) : E10.oy;
}

const S10 = {off: 1.6, tipo: "chico", sit: "via", rumbo: 90, entrada: 15};
function mandoActual(){ return S10.sit === "entro" ? S10.entrada : S10.rumbo; }

let VETADO = [];
function vetado(x, y){
  return VETADO.some(function(c){
    return x > c[0] && x < c[2] && y > c[1] && y < c[3];
  });
}

function carta10(){
  const h = E10.y1 - E10.y0;
  el("rect", {x: 0, y: E10.y0, width: D.W, height: h, fill: "var(--carta)",
              "data-banda": "honda"});

  [[COSTA.media, "media"], [COSTA.somera, "somera"],
   [COSTA.secante, "secante"], [COSTA.tierra, "tierra"]].forEach(function(q){
    [-1, 1].forEach(function(s){
      const a = TX(s*q[0]);
      el("rect", {x: s > 0 ? a : 0, y: E10.y0, width: s > 0 ? D.W - a : a, height: h,
                  fill: "var(--carta-" + q[1] + ")", "data-banda": q[1]});
    });
  });

  const cel = px(118);
  for(let i = 0; i*cel < D.W + cel; i++){
    for(let j = 0; j*cel < D.H + cel; j++){
      const r1 = sondaDe(i, j), r2 = sondaDe(i + 41, j + 17), r3 = sondaDe(i + 7, j + 91);
      if(r3 < 0.46) continue;
      const x = i*cel + r1*cel*0.7, y = j*cel + r2*cel*0.7;
      if(x < px(26) || x > D.W - px(26)) continue;
      if(y < E10.y0 + px(30) || y > E10.y1 - px(30)) continue;
      const m = Math.abs((x - E10.ox)/E10.k);
      if(m > COSTA.media - 0.1) continue;
      if(vetado(x, y)) continue;
      sonda(x, y, 15 + (TSS.costera - Math.min(m, TSS.costera))*2.4 + r1*9);
    }
  }
  const k1 = TM(1), ex = px(26), ey = E10.y1 - px(16);
  el("line", {x1: ex, y1: ey, x2: ex + k1, y2: ey,
              stroke: "var(--lam-dim)", "stroke-width": px(1.4)});
  [0, k1].forEach(function(o){
    el("line", {x1: ex + o, y1: ey - px(5), x2: ex + o, y2: ey + px(5),
                stroke: "var(--lam-dim)", "stroke-width": px(1.4)});
  });
  txt(ex + k1 + px(10), ey + px(4), "1 mile", "start", 11,
      "var(--lam-dim)", 400, "mono");

  txt(px(26), E10.y1 - px(38), "hulls not to scale", "start", 10,
      "var(--lam-dim)", 400, "mono");
  txt(D.W - px(24), E10.y1 - px(12), "depths in meters", "end", 10,
      "var(--lam-dim)", 400, "mono");
}

function muestraSeparacion(){

  const w = px(30), s = px(26);

    el("line", {x1: x + o, y1: y, x2: x + o, y2: y + s,

  });
  txt(x, y + s + px(13), "a zone \u00b7 this one", "middle", 9,
      "var(--lam-magenta)", 600, "mono");

  const y2 = y + s + px(30);
  el("line", {x1: x, y1: y2, x2: x, y2: y2 + s,
              stroke: "var(--lam-magenta)", "stroke-width": px(1.6),
              "stroke-opacity": .85});
  txt(x, y2 + s + px(13), "or a line", "middle", 9,

function dispositivo(){
  const h = E10.y1 - E10.y0;

  const xa = TX(-TSS.separacion), xb = TX(TSS.separacion), lado = xb - xa;
  el("rect", {x: xa, y: E10.y0, width: lado, height: h,
              fill: "var(--lam-magenta)", "fill-opacity": .10});
  for(let y = E10.y0 - lado; y < E10.y1 + lado; y += TM(0.30)){

    const tA = Math.max(0, (y + lado - E10.y1)/lado);
    const tB = Math.min(1, (y + lado - E10.y0)/lado);
    if(tA >= tB) continue;
    el("line", {x1: xa + lado*tA, y1: y + lado - lado*tA,
                x2: xa + lado*tB, y2: y + lado - lado*tB,
                stroke: "var(--lam-magenta)", "stroke-width": px(1),
                "stroke-opacity": .40});
  }

  [[-TSS.via, 1], [-TSS.separacion, 1], [TSS.separacion, 1], [TSS.via, 1]]
    .forEach(function(q){
      el("line", {x1: TX(q[0]), y1: E10.y0, x2: TX(q[0]), y2: E10.y1,
                  stroke: "var(--lam-magenta)", "stroke-width": px(1.6),
                  "stroke-opacity": .7, "stroke-dasharray": px(9) + "," + px(6)});
    });

  [[(TSS.separacion + TSS.via)/2, 0], [-(TSS.separacion + TSS.via)/2, 180]]
    .forEach(function(q){
      [0.22, 0.5, 0.78].forEach(function(f){
        const y = E10.y0 + h*f, x = TX(q[0]), L = TM(0.55);
        const sn = q[1] ? -1 : 1;
        el("line", {x1: x, y1: y + sn*L/2, x2: x, y2: y - sn*L/2,
                    stroke: "var(--lam-magenta)", "stroke-width": px(3),
                    "stroke-opacity": .55});
        el("path", {d: "M" + x + "," + (y - sn*L/2 - sn*px(9))
                      + " L" + (x - px(6)) + "," + (y - sn*L/2 + sn*px(3))
                      + " L" + (x + px(6)) + "," + (y - sn*L/2 + sn*px(3)) + " Z",
                    fill: "var(--lam-magenta)", opacity: .55});
      });
    });

  const tuyo = tuLado();
  const rot = [[-(TSS.costera + TSS.via)/2, "INSHORE ZONE"],
               [-(TSS.separacion + TSS.via)/2, tuyo < 0 ? "LANE · YOURS" : "LANE"],

               [0, "SEPARATION"],
               [(TSS.separacion + TSS.via)/2, tuyo > 0 ? "LANE · YOURS" : "LANE"],
               [(TSS.costera + TSS.via)/2, "INSHORE ZONE"]];
  rot.forEach(function(q){
    txt(TX(q[0]), E10.y0 + px(17), q[1], "middle", 10,
        "var(--lam-magenta)", 600, "mono");
  });
}

const ALTURAS = [0.16, 0.34, 0.85, 0.26, 0.75, 0.44, 0.92, 0.08];
function traficoDeLaVia(tuX, tuY, tuL){
  const L = esloraDibujada10(120), h = E10.y1 - E10.y0;
  const usadas = [];
  [[(TSS.separacion + TSS.via)/2 + 0.35, 0],
   [(TSS.separacion + TSS.via)/2 - 0.30, 0],
   [-(TSS.separacion + TSS.via)/2 + 0.30, 180]].forEach(function(q){
    const x = TX(q[0]);

    const libreX = (L + tuL)/2 + px(10);
    const libreY = (L + tuL)/2 + px(14);
    const suyo = ALTURAS.filter(function(f){
      const y = E10.y0 + h*f;
      if(usadas.some(function(v){ return Math.abs(v - y) < L*0.9; })) return false;
      return Math.abs(x - tuX) > libreX || Math.abs(y - tuY) > libreY;
    })[0];
    if(suyo === undefined) return;
    const y = E10.y0 + h*suyo;
    usadas.push(y);
    const g = el("g", {"data-trafico": "1"});
    plantaBarco(x, y, q[1], "var(--lam-ink)", .55, L, g);
  });
}

const PISTAS = {};

function cabenLosDos10(rot, texto, w){
  const anchoDe = (t, z) => px(z)*0.60*t.length;
  let a = 11, b = 13.5;
  while(b > 8 && anchoDe(rot, a) + anchoDe(texto, b) + px(12) > w){
    b -= 0.5; if(a > 8) a -= 0.5;
  }
  if(anchoDe(rot, a) + anchoDe(texto, b) + px(12) <= w) return [a, b];
  return [0, b];
}

function mando(id, x, y, w, rot, t, texto){
  const g = el("g", {"data-mando": id});
  const h = px(6), cy = y + px(24);
  PISTAS[id] = {x0: x, x1: x + w};
  const [zRot10, zTxt10] = cabenLosDos10(rot, texto, w);
  if(zRot10) txt(x, y + px(5), rot, "start", zRot10, "var(--lam-dim)", 600, "mono", g);
  txt(x + w, y + px(5), texto, "end", zTxt10, "var(--ink-title)", 600, "mono", g);
  el("rect", {x: x - px(10), y: y - px(6), width: w + px(20), height: px(42),
              fill: "#000", "fill-opacity": 0}, g);
  el("rect", {x: x, y: cy - h/2, width: w, height: h, rx: h/2,
              fill: "var(--carta)", stroke: "var(--edge-button)",
              "stroke-width": px(1)}, g);
  el("rect", {x: x, y: cy - h/2, width: Math.max(h, w*t), height: h, rx: h/2,
              fill: "var(--accent-control)"}, g);
  el("circle", {cx: x + w*t, cy: cy, r: px(10), fill: "var(--accent-control)",
                stroke: "var(--lam-ink)", "stroke-width": px(1.6)}, g);
  return g;
}
function boton10(clave, x, y, w, h, letra, rotulo, on){
  const g = el("g", {"data-boton": clave});
  el("rect", {x: x, y: y, width: w, height: h, rx: px(3), class: "caza",
              fill: on ? "var(--accent-control)" : "var(--carta)",
              stroke: on ? "var(--accent-control)" : "var(--edge-button)",
              "stroke-width": px(1.2)}, g);

  if(letra)
    txt(x + w - px(10), y + h/2 + px(4), letra, "end", 10.5,
        on ? "var(--ink-title)" : "var(--lam-linea)", 600, "mono", g);
  txt(x + (letra ? px(12) : w/2), y + h/2 + px(4), rotulo, letra ? "start" : "middle",
      11.5, on ? "var(--ink-title)" : "var(--lam-dim)", on ? 600 : 400, null, g);
  return g;
}

function corriente10(){
  const cx = TX(-TSS.costera + 0.5), cy = E10.y0 + (E10.y1 - E10.y0)*0.26;
  flecha10(cx, cy - TM(0.5), CORRIENTE.rumbo, "var(--lam-dim)", px(11));
  el("line", {x1: cx, y1: cy + TM(0.5), x2: cx, y2: cy - TM(0.5),
              stroke: "var(--lam-dim)", "stroke-width": px(1.6)});
  txt(cx, cy + TM(0.5) + px(16), "stream", "middle", 10.5,
      "var(--lam-dim)", 600, "mono");
}

function tuBarco10(x, y, rumbo, e, tinta){
  const L = esloraDibujada10(e.buque.eslora), r = L*0.78;
  el("circle", {cx: x, cy: y, r: r, fill: tinta, opacity: .13});
  el("circle", {cx: x, cy: y, r: r, fill: "none", stroke: tinta,
                "stroke-width": px(1.4), "stroke-opacity": .55, "data-tuyo": "1"});
  plantaBarco(x, y, rumbo, tinta, 1, L);

  txt(x, y - r - px(8), "you", "middle", 11.5, tinta, 600, "mono");
}
function flecha10(x, y, rumbo, tinta, largo){
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const L = largo || px(12), M = L*0.5;
  const P = (av, tr) => (x + sn*av + cs*tr).toFixed(1) + ","
                      + (y - cs*av + sn*tr).toFixed(1);
  el("path", {d: "M" + P(L, 0) + " L" + P(-L*0.55, M) + " L" + P(-L*0.55, -M) + " Z",
              fill: tinta});
}

function cajaClave(x, y, e){
  const r = esloraDibujada10(e.buque.eslora)*0.78;
  const cabe = x + r + px(150) < D.W - px(26);
  const lx = cabe ? x + r + px(12) : x - r - px(12);
  const w = px(160);
  return [cabe ? lx - px(6) : lx - w, y - px(12), cabe ? lx + w : lx + px(6),
          y + px(30)];
}
function claveDerrotas(x, y, e, tinta){
  const r = esloraDibujada10(e.buque.eslora)*0.78;
  const cabe = x + r + px(150) < D.W - px(26);
  const lx = cabe ? x + r + px(12) : x - r - px(12);
  const al = cabe ? "start" : "end";
  txt(lx, y + px(4), "where your head is", al, 11, tinta, 600, "mono");
  txt(lx, y + px(21), "the track you make good", al, 11,
      "var(--lam-dim)", 600, "mono");
}

function tira10(x, y, rumbo, millas, tinta, ancho, guion){
  const g = rumbo*Math.PI/180;
  const x2 = x + TM(millas)*Math.sin(g), y2 = y - TM(millas)*Math.cos(g);
  el("line", {x1: x, y1: y, x2: x2, y2: y2, stroke: tinta,
              "stroke-width": px(ancho || 2), "stroke-opacity": .85,
              "stroke-dasharray": guion ? px(6) + "," + px(5) : null});
  return [x2, y2];
}

const P10 = {
  h: "Traffic separation schemes",
  arriba: "Rule 10",

  pideRumbo(){ return S10.sit === "cruzo" || S10.sit === "entro"; },

  escena(e){

    if(dosMandos)

  mueve(id, u){

  pulsa(clave){

       + (S10.off >= 0 ? "east" : "west") + " of the axis</dd>"
       + "<dt>From the separation zone</dt><dd>"
       + (e.aLaSeparacion < 0 ? "inside it"
          : e.aLaSeparacion.toFixed(1) + " M") + "</dd>"
       + "<dt>What you are doing</dt><dd>" + e.sit.n.toLowerCase()
       + " &middot; Rule 10" + cita10(e.sit) + "</dd>";
    if(this.pideRumbo())
      h += "<dt>Your heading</dt><dd>"
         + String(Math.round(e.rumbo)).padStart(3, "0") + "&deg;</dd>"
         + "<dt>Your track</dt><dd>"
         + String(Math.round(e.derrota.grados)).padStart(3, "0") + "&deg; at "
         + e.derrota.nudos.toFixed(1) + " kn, set by the stream</dd>";
    h += "</dl>";

    h += '<p class="buque">The scheme has <b>two lanes of '
       + (TSS.via - TSS.separacion).toFixed(1) + " miles</b> with a separation zone of "
       + (2*TSS.separacion).toFixed(1) + " between them, and the inshore zones run out "
       + "to the shore. The stream sets <b>" + CORRIENTE.nudos
       + " knots along the lanes</b>, which is what pulls your track off your heading; "
       + "you make " + e.buque.nudos + " knots through the water. <b>The Rule gives no "
       + "figures</b> &mdash; it says <i>as nearly as practicable at right angles</i> "

       + "and <i>at as small an angle to the general direction of traffic flow as "
       + "practicable</i> &mdash; so what counts as square "
       + "and what counts as small are declared here, not quoted. <b>The hulls are "
       + "drawn on a compressed scale</b>, so that the smallest of them is still "
       + "something you can find; everything else on the chart is true to it.</p>";

    h += "<h3>The Rule</h3>";
    LEY10.forEach(function(p, i){
      h += '<div class="ley-inciso' + (LEY10SUB.indexOf(i) >= 0 ? " sub" : "")

function redibuja(){
  svg = document.getElementById("svg");
  const caja = document.getElementById("ficha").getBoundingClientRect();
  if(!caja.width || !caja.height) return;
  D.H = Math.max(420, Math.round(D.W * caja.height / caja.width));
  ESC = caja.width / D.W;
  svg.setAttribute("viewBox", "0 0 " + D.W + " " + D.H);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  gO = el("g", {}, svg);
  P10.lamina();
}

function pintaPanel(){
  document.getElementById("pane").innerHTML = P10.panel();
  document.getElementById("barCont").textContent = "RULE 10 OF 19";
}

function toca(){ redibuja(); pintaPanel(); }

(function(){
  const f = document.getElementById("ficha");
  let activo = null;

  function valor(e){
    const caja = f.getBoundingClientRect();
    if(!caja.width) return;
    const u = (e.clientX - caja.left) / caja.width * D.W;
    P10.mueve(activo, u);
    redibuja();
    pintaPanel();
  }

  f.addEventListener("pointerdown", function(e){
    const b = e.target.closest && e.target.closest("[data-boton]");
    if(b){
      P10.pulsa(b.getAttribute("data-boton"));
      return;
    }
    const g = e.target.closest && e.target.closest("[data-mando]");
    if(!g) return;
    activo = g.getAttribute("data-mando");
    f.classList.add("arrastrando");
    try { f.setPointerCapture(e.pointerId); } catch(err){}

    valor(e);
  });

  f.addEventListener("pointermove", function(e){
    if(activo) valor(e);
  });

  ["pointerup", "pointercancel"].forEach(function(t){
    f.addEventListener(t, function(){
      activo = null;
      f.classList.remove("arrastrando");
    });
  });
})();

addEventListener("resize", redibuja);

if(typeof ResizeObserver !== "undefined")
  new ResizeObserver(redibuja).observe(document.getElementById("ficha"));
toca();
</script>
<script data-marco="1">

(function(){
"use strict";

const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

const MARCO = {id:"ripa", i:10, paginas:[{f:"ripa-r0-the-nineteen-rules.html",t:"The nineteen rules"},{f:"ripa-r1-application.html",t:"Rule 1 · Application"},{f:"ripa-r2-responsibility.html",t:"Rule 2 · Responsibility"},{f:"ripa-r3-general-definitions.html",t:"Rule 3 · General definitions"},{f:"ripa-r4-application.html",t:"Rule 4 · Application"},{f:"ripa-r5-look-out.html",t:"Rule 5 · Look-out"},{f:"ripa-r6-safe-speed.html",t:"Rule 6 · Safe speed"},{f:"ripa-r7-risk-of-collision.html",t:"Rule 7 · Risk of collision"},{f:"ripa-r8-action-to-avoid-collision.html",t:"Rule 8 · Action to avoid collision"},{f:"ripa-r9-narrow-channels.html",t:"Rule 9 · Narrow channels"},{f:"ripa-r10-traffic-separation-schemes.html",t:"Rule 10 · Traffic separation schemes"},{f:"ripa-r11-application.html",t:"Rule 11 · Application"},{f:"ripa-r12-sailing-vessels.html",t:"Rule 12 · Sailing vessels"},{f:"ripa-r13-overtaking.html",t:"Rule 13 · Overtaking"},{f:"ripa-r14-head-on-situation.html",t:"Rule 14 · Head-on situation"},{f:"ripa-r15-crossing-situation.html",t:"Rule 15 · Crossing situation"},{f:"ripa-r16-action-by-give-way-vessel.html",t:"Rule 16 · Action by give-way vessel"},{f:"ripa-r17-action-by-stand-on-vessel.html",t:"Rule 17 · Action by stand-on vessel"},{f:"ripa-r18-responsibilities-between-vessels.html",t:"Rule 18 · Responsibilities between vessels"},{f:"ripa-r19-restricted-visibility.html",t:"Rule 19 · Conduct of vessels in restricted visibility"}]};
const YO = MARCO.id;
const N = MARCO.paginas.length;
const dosCifras = n => (n < 10 ? "0" : "") + n;
const $ = id => document.getElementById(id);

const LLAVE_NAV = "ripa.nav";
function marcaNav(){ try{ sessionStorage.setItem(LLAVE_NAV, "1"); }catch(e){} }
function veniaDeDentro(){
  try{ return sessionStorage.getItem(LLAVE_NAV) === "1"; }catch(e){ return false; }
}

if(MARCO.i === 0 && !veniaDeDentro()){
  const p = vistoPos(YO, N - 1);
  if(p > 0){ marcaNav(); location.replace(MARCO.paginas[p].f); return; }
}
marcaNav();

vistoEmpieza(YO);
vistoPon(YO, MARCO.i);
if(MARCO.i === N - 1) vistoTermina(YO);

function vaA(i){
  if(i < 0 || i >= N || i === MARCO.i) return;
  marcaNav();
  vistoPon(YO, i);
  location.href = MARCO.paginas[i].f;
}

const CUENTA = dosCifras(MARCO.i + 1) + " / " + dosCifras(N);
function ponCuenta(){
  const b = $("barCont");
  if(b && b.textContent !== CUENTA) b.textContent = CUENTA;
}
ponCuenta();
if(typeof MutationObserver !== "undefined" && $("barCont"))
  new MutationObserver(ponCuenta).observe($("barCont"),
    {childList: true, characterData: true, subtree: true});

(function(){
  const pr = $("prog");
  if(!pr) return;
  pr.innerHTML = "";
  MARCO.paginas.forEach(function(q, i){
    const b = document.createElement("i");
    if(i === MARCO.i) b.className = "on"; else if(i < MARCO.i) b.className = "done";
    b.title = "Screen " + (i + 1) + " of " + N + " · " + q.t;

    b.setAttribute("data-va", i);
    b.onclick = function(){ vaA(i); };
    pr.appendChild(b);
  });
})();

const LLAVE_LOG = "ripa.log";
function leeLog(){
  try{ return parseInt(localStorage.getItem(LLAVE_LOG) || "0", 10) || 0; }
  catch(e){ return 0; }
}
function ponLog(n){ try{ localStorage.setItem(LLAVE_LOG, String(n)); }catch(e){} }
function pintaLog(){
  const f = $("fLog");
  if(!f) return;
  const n = leeLog();
  f.textContent = n + (n === 1 ? " answer logged" : " answers logged");
}
pintaLog();
document.addEventListener("click", function(e){
  const b = e.target.closest ? e.target.closest("[data-di]") : null;
  if(!b) return;
  if(b.getAttribute("data-di") === "otra") return;
  ponLog(leeLog() + 1);
  pintaLog();
}, true);

function hayPregunta(){
  return !!document.querySelector("#pane [data-di]:not([data-di=otra])");
}
function hayOtra(){ return !!document.querySelector("#pane [data-di=otra]"); }

function pintaNav(){
  const pie = $("navPie");
  if(!pie) return;
  const ultima = MARCO.i >= N - 1;
  let h = '<div class="nav">'
    + '<button class="sec" id="atras" data-va="' + (MARCO.i - 1) + '"'
    + (MARCO.i ? "" : " disabled") + ">Back</button>";
  if(hayPregunta())
    h += '<a class="skip" id="salta" data-va="' + (MARCO.i + 1) + '">Skip</a>';
  if(hayOtra()) h += '<button id="otra">Next one</button>';
  h += '<button id="sig" data-va="' + (MARCO.i + 1) + '"'
    + (ultima ? " disabled" : "") + ">"
    + (ultima ? "End of the module" : "Next") + "</button></div>";
  pie.innerHTML = h;
  const a = $("atras"); if(a) a.onclick = function(){ vaA(MARCO.i - 1); };
  const s = $("sig");   if(s) s.onclick = function(){ vaA(MARCO.i + 1); };
  const k = $("salta"); if(k) k.onclick = function(){ vaA(MARCO.i + 1); };
  const o = $("otra");
  if(o) o.onclick = function(){
    const b = document.querySelector("#pane [data-di=otra]");
    if(b) b.click();
  };
}
pintaNav();
if(typeof MutationObserver !== "undefined" && $("pane"))
  new MutationObserver(pintaNav).observe($("pane"), {childList: true, subtree: true});

(function(){
  const d = $("deCero");
  if(!d) return;
  d.onclick = function(){
    vistoOlvida(YO);
    marcaNav();
    location.href = MARCO.paginas[0].f;
  };
})();

(function(){
  const t = $("tSig"), pane = $("pane");
  if(!t || !pane || !t.innerHTML.trim()) return;
  if(document.querySelector(".ot-cierre")) return;
  pane.insertAdjacentHTML("afterend", t.innerHTML);
})();
})();
</script>
</body></html>
