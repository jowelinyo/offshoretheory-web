<script>
"use strict";

const NS = "http://www.w3.org/2000/svg";
const D = {W: 1000, H: 620};
let svg = null, gO = null, ESC = 1;
const px = n => n / ESC;

function el(t, at, pa){
  const e = document.createElementNS(NS, t);
  for(const k in at) if(at[k] !== undefined && at[k] !== null) e.setAttribute(k, at[k]);
  (pa || gO || svg).appendChild(e);
  return e;
}
function txt(x, y, s, an, tam, col, peso, fam, pa){
  const e = el("text", {x: x, y: y, "text-anchor": an || "start",
    "pointer-events": "none", "font-size": px(tam || 13),
    fill: col || "var(--lam-ink)", "font-weight": peso || 400,
    "font-family": fam === "mono" ? "var(--f-mono)" : "var(--f-ui)"}, pa);
  e.textContent = s;
  return e;
}

function parte(s, ancho, tam){
  const porLinea = Math.max(6, Math.floor(ancho / (px(tam) * 0.62)));
  const pal = String(s).split(/\s+/);
  const out = [];
  let linea = "";
  pal.forEach(function(p){
    const q = linea ? linea + " " + p : p;
    if(q.length > porLinea && linea){ out.push(linea); linea = p; }
    else linea = q;
  });
  if(linea) out.push(linea);
  return out;
}

const ABRE = 11;
const TRAMOS = [{"rango": "RULES 4 – 10", "abre": 4, "condicion": "in any condition of visibility", "reglas": [{"n": 4, "titulo": "Application"}, {"n": 5, "titulo": "Look-out"}, {"n": 6, "titulo": "Safe speed"}, {"n": 7, "titulo": "Risk of collision"}, {"n": 8, "titulo": "Action to avoid collision"}, {"n": 9, "titulo": "Narrow channels"}, {"n": 10, "titulo": "Traffic separation schemes"}]}, {"rango": "RULES 11 – 18", "abre": 11, "condicion": "to vessels in sight of one another", "reglas": [{"n": 11, "titulo": "Application"}, {"n": 12, "titulo": "Sailing vessels"}, {"n": 13, "titulo": "Overtaking"}, {"n": 14, "titulo": "Head-on situation"}, {"n": 15, "titulo": "Crossing situation"}, {"n": 16, "titulo": "Action by give-way vessel"}, {"n": 17, "titulo": "Action by stand-on vessel"}, {"n": 18, "titulo": "Responsibilities between vessels"}]}, {"rango": "RULE 19", "abre": 19, "condicion": "to vessels not in sight of one another when navigating in or near an area of restricted visibility", "reglas": [{"n": 19, "titulo": "Conduct of vessels in restricted visibility"}]}];
const LEY_ABRE = {"titulo": "Application", "partes": ["Rules in this section apply to vessels in sight of one another."], "sub": [], "caracteres": 63};
const PIE_LAMINA = "Rule 11 opens the second section";
const CON_MANDO = true;
const DEF_VISTA = "(k) Vessels shall be deemed to be in sight of one another only when one can be observed visually from the other.";

const OTRO = {millas: 3.0, n: "A power-driven vessel of 40 m", eslora: 40};

const VISION = {min: 0.2, max: 8.0};

const RADAR = {alcanza: 24.0};

const GOBIERNO = {
  4:  function(){ return true; },
  11: function(aLaVista){ return aLaVista; },
  19: function(aLaVista){ return !aLaVista; }
};
function gobierna(abre, aLaVista){
  const f = GOBIERNO[abre];
  return f ? f(aLaVista) : false;
}

function aLaVista(millas){ return millas >= OTRO.millas; }
function laPintaElRadar(){ return OTRO.millas <= RADAR.alcanza; }

function estado11(millas){
  const v = aLaVista(millas);
  return {
    vision: millas, aLaVista: v,
    radar: laPintaElRadar(),

    margen: millas - OTRO.millas,
    manda: [4, 11, 19].filter(function(n){ return gobierna(n, v); })
  };
}

function dilo11(e){
  const donde = e.aLaVista
    ? "You can see her from your own deck."
    : "You cannot see her. The visibility has closed in and she is somewhere out there.";

  const toca = e.aLaVista
    ? "So you are in sight of one another, and that is the whole of what Rule 11 says: "
      + "the rules of this section apply to vessels in sight of one another. Rules 11 "
      + "to 18 are live between you &mdash; overtaking, head-on, crossing, who keeps "
      + "out of the way &mdash; and Rule 19 is not."
    : "So you are <b>not</b> in sight of one another, and the whole of that section "
      + "shuts. There is no stand-on vessel and no give-way vessel between you, "
      + "because those words live in rules that no longer apply. What governs is Rule "
      + "19, and it asks different questions.";

  const eco = e.aLaVista
    ? "<b>She is on your radar too &mdash; but that is not why the section applies.</b> "
      + "Rule 3 settles it in one line: vessels are deemed to be in sight of one "
      + "another <i>only when one can be observed visually from the other</i>. What "
      + "opens Rules 11 to 18 is your eye, not your screen."
    : "<b>She is still on your radar, and she is still not in sight.</b> Rule 3 says "
      + "vessels are deemed to be in sight of one another <i>only when one can be "
      + "observed visually from the other</i>. A contact you have plotted, named and "
      + "tracked is a contact you have not seen, and the section stays shut.";

  const siempre = "And the first section does not move. Rules 4 to 10 apply <b>in any "
                + "condition of visibility</b> &mdash; look-out, safe speed, risk of "
                + "collision, narrow channels, traffic separation schemes. They were "
                + "in force before the fog came and they are in force now.";

  return {donde: donde, toca: toca, eco: eco, siempre: siempre};
}

const S11 = {vision: 6.0};
const PISTAS = {};

function casco11(x, y, mira, tinta, largo){
  const L = largo, M = L*0.38, s = mira;
  const q = [[x + s*L*0.5, y], [x - s*L*0.1, y - M], [x - s*L*0.5, y - M*0.7],
             [x - s*L*0.5, y + M*0.7], [x - s*L*0.1, y + M]];

  el("path", {d: "M" + q.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L")
                + " Z", fill: tinta, "data-buque": "1"});
}

function escenaVista(x0, y, ancho, e){
  const EX = m => x0 + ancho*(m/VISION.max);
  const her = EX(OTRO.millas), filo = EX(Math.min(e.vision, VISION.max));

  el("line", {x1: x0, y1: y, x2: x0 + ancho, y2: y,
              stroke: "var(--lam-linea)", "stroke-width": px(1), "stroke-opacity": .55});
  for(let m = 0; m <= VISION.max; m++)
    el("line", {x1: EX(m), y1: y - px(3), x2: EX(m), y2: y + px(3),
                stroke: "var(--lam-linea)", "stroke-width": px(1),
                "stroke-opacity": .55});

  el("rect", {x: x0, y: y - px(7), width: filo - x0, height: px(14), rx: px(2),

}

function mando11(x, y, w, rot, t, texto){
  const g = el("g", {"data-mando": "vision"});
  const h = px(6), cy = y + px(24);
  PISTAS.vision = {x0: x, x1: x + w};
  txt(x, y + px(5), rot, "start", 11, "var(--lam-dim)", 600, "mono", g);
  txt(x + w, y + px(5), texto, "end", 13.5, "var(--ink-title)", 600, "mono", g);
  el("rect", {x: x - px(10), y: y - px(6), width: w + px(20), height: px(42),
              fill: "#000", "fill-opacity": 0}, g);
  el("rect", {x: x, y: cy - h/2, width: w, height: h, rx: h/2,
              fill: "var(--carta)", stroke: "var(--edge-button)",
              "stroke-width": px(1)}, g);
  el("rect", {x: x, y: cy - h/2, width: Math.max(h, w*t), height: h, rx: h/2,
              fill: "var(--accent-control)"}, g);
  el("circle", {cx: x + w*t, cy: cy, r: px(10), fill: "var(--accent-control)",
                stroke: "var(--lam-ink)", "stroke-width": px(1.6)}, g);
}

const REPARTO = [0.325, 0.345, 0.330];

const PB = {
  h: LEY_ABRE.titulo,
  arriba: "Rule " + ABRE,

  lamina(){

    const BANDA = CON_MANDO ? px(150) : 0;
    const VIS = CON_MANDO ? estado11(S11.vision) : null;
    const M = D.W*0.030, hueco = D.W*0.022;
    const util = D.W - M*2 - hueco*2;
    const cuerpo = 13.5, salto = px(18);
    const sangria = D.W*0.042;

    const altoCab = c => px(30) + px(22) + c.cond.length*px(19) + px(14) + px(14);
    const altoCon = (c, hueco) => altoCab(c)
      + c.filas.reduce(function(s, f){ return s + hueco + f.ren.length*salto; }, 0)
      + px(14);

    const CAJA = TRAMOS.map(function(t, k){
      const w = util*REPARTO[k];
      const anchoTxt = w - sangria - D.W*0.020;
      return {w: w, t: t,
              cond: parte(t.condicion, w - D.W*0.040, 13),
              filas: t.reglas.map(function(r){
                return {n: r.n, ren: parte(r.titulo, anchoTxt, cuerpo)};
              })};
    });

    const yArranca = CON_MANDO ? BANDA + px(20) : px(64);
    const alPie = px(46);
    const sitio = D.H - yArranca - alPie;
    const objetivo = Math.min((CON_MANDO ? D.H*0.88 : D.H*0.74) - BANDA, sitio);
    const masLarga = CAJA.reduce((a, b) => altoCon(a, 0) > altoCon(b, 0) ? a : b);
    const nFilas = Math.max(1, masLarga.filas.length);
    let hueco2 = (objetivo - altoCon(masLarga, 0)) / nFilas;
    hueco2 = Math.max(px(5), Math.min(px(26), hueco2));

    const altoMax = Math.max.apply(null, CAJA.map(c => altoCon(c, hueco2)));

    const y0 = CON_MANDO ? yArranca
      : Math.max(px(64), px(56) + (D.H - px(56) - altoMax - px(34))/2);

    txt(M, px(32), "PART B · THE THREE SECTIONS", "start", 12.5,
        "var(--lam-dim)", 600, "mono");

    if(CON_MANDO){
      const wm = (D.W - M*2)*0.34;
      mando11(M, px(56), wm, "HOW FAR YOU CAN SEE",
              (S11.vision - VISION.min) / (VISION.max - VISION.min),
              S11.vision.toFixed(1) + " M");
      const xe = M + wm + D.W*0.055;
      escenaVista(xe, px(84), D.W - M - xe, VIS);
      el("line", {x1: 0, y1: BANDA - px(14), x2: D.W, y2: BANDA - px(14),
                  stroke: "var(--edge-card)", "stroke-width": px(1)});
    }

    let x = M;
    CAJA.forEach(function(c){

      const abre = c.t.abre === ABRE;
      const manda = CON_MANDO ? gobierna(c.t.abre, VIS.aLaVista) : abre;

      el("rect", {"data-entera": "tramo", x: x, y: y0, width: c.w, height: altoMax,
                  rx: px(3),
                  fill: manda ? "var(--carta-somera)" : "var(--lam-papel)",
                  "fill-opacity": manda ? .55 : 1,
                  stroke: abre ? "var(--accent-graphic)" : "var(--lam-linea)",
                  "stroke-width": px(abre ? 1.6 : 1),
                  "stroke-opacity": abre ? 1 : .55});
      if(abre)
        el("rect", {x: x, y: y0, width: px(3), height: altoMax,
                    fill: "var(--accent-graphic)"});

      if(CON_MANDO)
        txt(x + c.w - D.W*0.020, y0 + px(30),
            manda ? "IN FORCE NOW" : "SHUT", "end", 9.5,
            manda ? "var(--lam-ok)" : "var(--lam-dim)", 600, "mono");

      const xi = x + D.W*0.020;
      let y = y0 + px(30);
      const yFilas = y0 + altoCab(c);

      txt(xi, y, c.t.rango, "start", 11.5,
          manda ? "var(--accent-text)" : "var(--lam-dim)", 600, "mono");
      y += px(22);

      c.cond.forEach(function(t, i){
        const e = txt(xi, y + i*px(19), t, "start", 13,
                      manda ? "var(--ink-title)" : "var(--lam-dim)",
                      manda ? 600 : 400);
        e.setAttribute("font-family", "var(--f-display)");
        e.setAttribute("font-style", "italic");
      });
      y += c.cond.length*px(19) + px(14);

      el("line", {x1: xi, y1: y, x2: x + c.w - D.W*0.020, y2: y,
                  stroke: "var(--lam-linea)", "stroke-width": px(1),
                  opacity: manda ? .7 : .4});

      y = yFilas;

      c.filas.forEach(function(f){
        const suya = f.n === ABRE;

        if(suya){
          const hf = hueco2*0.7 + f.ren.length*salto;
          el("rect", {x: x + px(6), y: y - hueco2*0.35,
                      width: c.w - px(12), height: hf,
                      rx: px(2), fill: "var(--carta)", opacity: .85});
          el("rect", {x: x + px(6), y: y - hueco2*0.35, width: px(3), height: hf,
                      fill: "var(--accent-graphic)"});
        }
        txt(x + sangria - px(8), y + px(11), String(f.n), "end", cuerpo,
            suya ? "var(--ink-title)" : manda ? "var(--lam-dim)" : "var(--lam-linea)",
            600, "mono");
        f.ren.forEach(function(t, i){
          txt(x + sangria, y + px(11) + i*salto, t, "start", cuerpo,
              suya ? "var(--ink-title)"
                   : manda ? "var(--lam-ink)" : "var(--lam-dim)",
              suya ? 600 : 400);
        });
        y += hueco2 + f.ren.length*salto;
      });

      x += c.w + hueco;
    });

    txt(D.W/2, Math.min(y0 + altoMax + px(30), D.H - px(14)),
        CON_MANDO ? (VIS.aLaVista
          ? "in sight of one another \u00b7 Rules 11 to 18 are in force"
          : "not in sight of one another \u00b7 Rule 19 is in force, and 11 to 18 are shut")
        : PIE_LAMINA, "middle", 12.5, "var(--lam-dim)", 400, "mono");
  },

  mueve(id, u){
    const p = PISTAS[id];
    if(!p) return;
    const t = Math.max(0, Math.min(1, (u - p.x0) / (p.x1 - p.x0)));
    if(id === "vision")
      S11.vision = Math.round((VISION.min + t*(VISION.max - VISION.min))*10)/10;
  },

  panel(){
    let h = "<h3>Rule " + ABRE + "</h3><h2>" + LEY_ABRE.titulo + "</h2>";

    if(CON_MANDO){
      const e = estado11(S11.vision), t = dilo11(e);
      h += '<div class="ahora' + (e.aLaVista ? "" : " mal") + '">'
         + '<p class="uno">' + t.donde + "</p><p>" + t.toca + "</p>"
         + '<p class="eco">' + t.eco + "</p>"
         + '<p class="eco">' + t.siempre + "</p></div>";
    }

    LEY_ABRE.partes.forEach(function(p, i){
      h += '<div class="ley-inciso' + (LEY_ABRE.sub.indexOf(i) >= 0 ? " sub" : "")
         + '">' + p + "</div>";
    });
    h += '<p class="fuente">Navigation Rules &amp; Regulations Handbook &middot; '
       + "Rule " + ABRE + " &middot; " + LEY_ABRE.caracteres + " characters</p>";

    if(DEF_VISTA){
      h += '<h3 class="otra">What decides it</h3>';
      h += '<div class="ley-inciso">' + DEF_VISTA + "</div>";
      h += '<p class="fuente">Navigation Rules &amp; Regulations Handbook &middot; '
         + "Rule 3(k) &middot; the definition, not a paraphrase</p>";
    }
    return h;
  }
};

function redibuja(){
  svg = document.getElementById("svg");
  const caja = document.getElementById("ficha").getBoundingClientRect();
  if(!caja.width || !caja.height) return;
  D.H = Math.max(420, Math.round(D.W * caja.height / caja.width));
  ESC = caja.width / D.W;
  svg.setAttribute("viewBox", "0 0 " + D.W + " " + D.H);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  gO = el("g", {}, svg);
  el("rect", {x: 0, y: 0, width: D.W, height: D.H, fill: "var(--lam-papel)"});
  PB.lamina();
}

function pintaPanel(){
  document.getElementById("pane").innerHTML = PB.panel();
  document.getElementById("barCont").textContent = "RULE 11 OF 19";
}

function toca(){ redibuja(); pintaPanel(); }

(function(){
  const f = document.getElementById("ficha");
  let activo = null;

  function valor(e){
    const caja = f.getBoundingClientRect();
    if(!caja.width) return;
    PB.mueve(activo, (e.clientX - caja.left) / caja.width * D.W);
    toca();
  }

  f.addEventListener("pointerdown", function(e){
    const g = e.target.closest && e.target.closest("[data-mando]");
    if(!g) return;
    activo = g.getAttribute("data-mando");
    try { f.setPointerCapture(e.pointerId); } catch(err){}

    valor(e);
  });
  f.addEventListener("pointermove", function(e){ if(activo) valor(e); });
  ["pointerup", "pointercancel"].forEach(function(t){
    f.addEventListener(t, function(){ activo = null; });
  });
})();

const PZ = [PB];
function vaPantalla(i){ toca(); }
const vaA = vaPantalla;

addEventListener("resize", redibuja);

if(typeof ResizeObserver !== "undefined")
  new ResizeObserver(redibuja).observe(document.getElementById("ficha"));
toca();
</script>
<script data-marco="1">

(function(){
"use strict";

const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

const MARCO = {id:"ripa", i:11, paginas:[{f:"ripa-r0-the-nineteen-rules.html",t:"The nineteen rules"},{f:"ripa-r1-application.html",t:"Rule 1 · Application"},{f:"ripa-r2-responsibility.html",t:"Rule 2 · Responsibility"},{f:"ripa-r3-general-definitions.html",t:"Rule 3 · General definitions"},{f:"ripa-r4-application.html",t:"Rule 4 · Application"},{f:"ripa-r5-look-out.html",t:"Rule 5 · Look-out"},{f:"ripa-r6-safe-speed.html",t:"Rule 6 · Safe speed"},{f:"ripa-r7-risk-of-collision.html",t:"Rule 7 · Risk of collision"},{f:"ripa-r8-action-to-avoid-collision.html",t:"Rule 8 · Action to avoid collision"},{f:"ripa-r9-narrow-channels.html",t:"Rule 9 · Narrow channels"},{f:"ripa-r10-traffic-separation-schemes.html",t:"Rule 10 · Traffic separation schemes"},{f:"ripa-r11-application.html",t:"Rule 11 · Application"},{f:"ripa-r12-sailing-vessels.html",t:"Rule 12 · Sailing vessels"},{f:"ripa-r13-overtaking.html",t:"Rule 13 · Overtaking"},{f:"ripa-r14-head-on-situation.html",t:"Rule 14 · Head-on situation"},{f:"ripa-r15-crossing-situation.html",t:"Rule 15 · Crossing situation"},{f:"ripa-r16-action-by-give-way-vessel.html",t:"Rule 16 · Action by give-way vessel"},{f:"ripa-r17-action-by-stand-on-vessel.html",t:"Rule 17 · Action by stand-on vessel"},{f:"ripa-r18-responsibilities-between-vessels.html",t:"Rule 18 · Responsibilities between vessels"},{f:"ripa-r19-restricted-visibility.html",t:"Rule 19 · Conduct of vessels in restricted visibility"}]};
const YO = MARCO.id;
const N = MARCO.paginas.length;
const dosCifras = n => (n < 10 ? "0" : "") + n;
const $ = id => document.getElementById(id);

const LLAVE_NAV = "ripa.nav";
function marcaNav(){ try{ sessionStorage.setItem(LLAVE_NAV, "1"); }catch(e){} }
function veniaDeDentro(){
  try{ return sessionStorage.getItem(LLAVE_NAV) === "1"; }catch(e){ return false; }
}

if(MARCO.i === 0 && !veniaDeDentro()){
  const p = vistoPos(YO, N - 1);
  if(p > 0){ marcaNav(); location.replace(MARCO.paginas[p].f); return; }
}
marcaNav();

vistoEmpieza(YO);
vistoPon(YO, MARCO.i);
if(MARCO.i === N - 1) vistoTermina(YO);

function vaA(i){
  if(i < 0 || i >= N || i === MARCO.i) return;
  marcaNav();
  vistoPon(YO, i);
  location.href = MARCO.paginas[i].f;
}

const CUENTA = dosCifras(MARCO.i + 1) + " / " + dosCifras(N);
function ponCuenta(){
  const b = $("barCont");
  if(b && b.textContent !== CUENTA) b.textContent = CUENTA;
}
ponCuenta();
if(typeof MutationObserver !== "undefined" && $("barCont"))
  new MutationObserver(ponCuenta).observe($("barCont"),
    {childList: true, characterData: true, subtree: true});

(function(){
  const pr = $("prog");
  if(!pr) return;
  pr.innerHTML = "";
  MARCO.paginas.forEach(function(q, i){
    const b = document.createElement("i");
    if(i === MARCO.i) b.className = "on"; else if(i < MARCO.i) b.className = "done";
    b.title = "Screen " + (i + 1) + " of " + N + " · " + q.t;

    b.setAttribute("data-va", i);
    b.onclick = function(){ vaA(i); };
    pr.appendChild(b);
  });
})();

const LLAVE_LOG = "ripa.log";
function leeLog(){
  try{ return parseInt(localStorage.getItem(LLAVE_LOG) || "0", 10) || 0; }
  catch(e){ return 0; }
}
function ponLog(n){ try{ localStorage.setItem(LLAVE_LOG, String(n)); }catch(e){} }
function pintaLog(){
  const f = $("fLog");
  if(!f) return;
  const n = leeLog();
  f.textContent = n + (n === 1 ? " answer logged" : " answers logged");
}
pintaLog();
document.addEventListener("click", function(e){
  const b = e.target.closest ? e.target.closest("[data-di]") : null;
  if(!b) return;
  if(b.getAttribute("data-di") === "otra") return;
  ponLog(leeLog() + 1);
  pintaLog();
}, true);

function hayPregunta(){
  return !!document.querySelector("#pane [data-di]:not([data-di=otra])");
}
function hayOtra(){ return !!document.querySelector("#pane [data-di=otra]"); }

function pintaNav(){
  const pie = $("navPie");
  if(!pie) return;
  const ultima = MARCO.i >= N - 1;
  let h = '<div class="nav">'
    + '<button class="sec" id="atras" data-va="' + (MARCO.i - 1) + '"'
    + (MARCO.i ? "" : " disabled") + ">Back</button>";
  if(hayPregunta())
    h += '<a class="skip" id="salta" data-va="' + (MARCO.i + 1) + '">Skip</a>';
  if(hayOtra()) h += '<button id="otra">Next one</button>';
  h += '<button id="sig" data-va="' + (MARCO.i + 1) + '"'
    + (ultima ? " disabled" : "") + ">"
    + (ultima ? "End of the module" : "Next") + "</button></div>";
  pie.innerHTML = h;
  const a = $("atras"); if(a) a.onclick = function(){ vaA(MARCO.i - 1); };
  const s = $("sig");   if(s) s.onclick = function(){ vaA(MARCO.i + 1); };
  const k = $("salta"); if(k) k.onclick = function(){ vaA(MARCO.i + 1); };
  const o = $("otra");
  if(o) o.onclick = function(){
    const b = document.querySelector("#pane [data-di=otra]");
    if(b) b.click();
  };
}
pintaNav();
if(typeof MutationObserver !== "undefined" && $("pane"))
  new MutationObserver(pintaNav).observe($("pane"), {childList: true, subtree: true});

(function(){
  const d = $("deCero");
  if(!d) return;
  d.onclick = function(){
    vistoOlvida(YO);
    marcaNav();
    location.href = MARCO.paginas[0].f;
  };
})();
})();
</script>
