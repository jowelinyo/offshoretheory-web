"use strict";
const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

"use strict";

const ARC = {
  masthead: 112.5,
  sidelight:112.5,
  stern:    112.5,
  allRound: 180
};

const CUTOFF = 1.5;

const visible = (arc, aspect) => {
  const a = Math.abs(aspect);
  switch(arc.kind){
    case "masthead": return a <= ARC.masthead;
    case "starboard":return aspect >= -CUTOFF && aspect <= ARC.sidelight;
    case "port":     return aspect <=  CUTOFF && aspect >= -ARC.sidelight;

    case "stern":    return a > ARC.stern;
    case "allround": return true;
  }
  return false;
};

const HGT = {

  mast1: L => Math.max(1.6, 0.62 * Math.pow(L, 0.72)),
  mast2: L => HGT.mast1(L) + Math.max(4.5, HGT.mast1(L)*0.22),
  side:  L => L >= 20 ? HGT.mast1(L)*0.72 : Math.max(0.9, HGT.mast1(L)*0.55),
  stern: L => L >= 20 ? HGT.mast1(L)*0.42 : Math.max(0.7, HGT.mast1(L)*0.40),
  allr:  L => Math.max(2.2, HGT.mast1(L)*0.90),
  mast:  L => Math.max(1.6, 0.62 * Math.pow(L, 0.72))
};

function ranges(L){
  if (L >= 50) return {masthead:6, side:3, stern:3, allround:3, towing:3};
  if (L >= 20) return {masthead:5, side:2, stern:2, allround:2, towing:2};
  if (L >= 12) return {masthead:3, side:2, stern:2, allround:2, towing:2};
  return          {masthead:2, side:1, stern:2, allround:2, towing:2};
}

const L = (kind, colour, h, x, rangeKey, extra={}) =>
  ({kind, colour, h, x, rangeKey, ...extra});

function configuration(v){
  const LEN = v.length || 12;
  const L50 = LEN >= 50;
  const making = v.makingWay !== false;
  const under  = v.underway  !== false;

  const sideX  = L50 ? -0.30 : 0.80;
  const side   = [L("starboard","green",HGT.side(LEN), sideX,"side"),
                  L("port",     "red",  HGT.side(LEN), sideX,"side")];
  const stern  = [L("stern","white",HGT.stern(LEN),-0.96,"stern")];
  const mast1  = [L("masthead","white",HGT.mast1(LEN), 0.55,"masthead")];
  const mast2  = L50 ? [L("masthead","white",HGT.mast2(LEN),-0.40,"masthead")] : [];

  if (!under) {
    return LEN >= 50
      ? [L("allround","white",HGT.allr(LEN)*0.9, 0.88,"allround"),
         L("allround","white",HGT.stern(LEN)*1.4,-0.88,"allround")]
      : [L("allround","white",HGT.allr(LEN), 0.0,"allround")];
  }

  switch(v.type){
    case "power": case "pilotUnderway":

      if(LEN < 12 && v.combined !== false)
        return [L("allround","white",Math.max(2.2,LEN*0.22),0.10,"allround"), ...side];
      return [...mast1, ...mast2, ...side, ...stern];

    case "sailing":

      const mastTop = LEN*1.30;
      return v.tricolour && LEN < 20
        ? [L("starboard","green",mastTop,0.05,"side"), L("port","red",mastTop,0.05,"side"),
           L("stern","white",mastTop,0.05,"stern")]
        : [L("starboard","green",HGT.side(LEN),0.86,"side"),
           L("port","red",      HGT.side(LEN),0.86,"side"), ...stern,
           ...(v.optionalRedGreen ? [L("allround","red",  mastTop,0.05,"allround"),
                                     L("allround","green",mastTop*0.94,0.05,"allround")] : [])];

    case "fishingTrawl":
      return [L("allround","green",HGT.allr(LEN)*1.25,0.28,"allround"),
              L("allround","white",HGT.allr(LEN)*0.95,0.28,"allround"),
              ...(L50?[L("masthead","white",HGT.mast2(LEN),-0.40,"masthead")]:[]),
              ...(making?[...side,...stern]:[])];

    case "fishingOther":
      return [L("allround","red",HGT.allr(LEN)*1.25,0.28,"allround"),
              L("allround","white",HGT.allr(LEN)*0.95,0.28,"allround"),
              ...(making?[...side,...stern]:[])];

    case "nuc":
      return [L("allround","red",HGT.allr(LEN)*1.25,0.20,"allround"),
              L("allround","red",HGT.allr(LEN)*0.95,0.20,"allround"),
              ...(making?[...side,...stern]:[])];

    case "ram":
      return [L("allround","red",  HGT.allr(LEN)*1.45,0.20,"allround"),
              L("allround","white",HGT.allr(LEN)*1.20,0.20,"allround"),
              L("allround","red",  HGT.allr(LEN)*0.95,0.20,"allround"),
              ...(making?[...mast1,...mast2,...side,...stern]:[])];

    case "cbd":
      return [...mast1, ...mast2, ...side, ...stern,

              L("allround","red",HGT.allr(LEN)*1.35,0.14,"allround"),
              L("allround","red",HGT.allr(LEN)*1.15,0.14,"allround"),
              L("allround","red",HGT.allr(LEN)*0.95,0.14,"allround")];

    case "pilot":

      return [L("allround","white",HGT.allr(LEN)*1.25,0.20,"allround"),
              L("allround","red",  HGT.allr(LEN)*0.95,0.20,"allround"),
              ...side, ...stern];

    case "towing": {
      const TL   = v.towLength || 120;
      const long = TL > 200;
      const stack = [];
      const step = Math.max(2, LEN*0.055);
      for (let i=0;i<(long?3:2);i++)
        stack.push(L("masthead","white",HGT.mast1(LEN)+i*step,0.55,"masthead"));
      const tug = [...stack, ...(L50?[L("masthead","white",HGT.mast2(LEN)+step*2,-0.40,"masthead")]:[]),
                   ...side, ...stern,
                   L("stern","yellow",HGT.stern(LEN)*1.5,-0.96,"towing")];

      const back = -(TL + LEN*0.5);
      const towed = [
        L("starboard","green",2.0,0,"side",  {xm:back, tow:true}),
        L("port",     "red",  2.0,0,"side",  {xm:back, tow:true}),
        L("stern",    "white",1.6,0,"stern", {xm:back - 20, tow:true})
      ];
      return [...tug, ...towed];
    }
  }
  return [...side, ...stern];
}

function seenFrom(v, aspect, rangeNm){
  const R = ranges(v.length || 12);
  return configuration(v)
    .filter(l => visible(l, aspect))
    .filter(l => rangeNm === undefined || rangeNm <= R[l.rangeKey])
    .map(l => ({...l, nominal:R[l.rangeKey]}));
}

const A1 = {

  TOPE_SOBRE_CASCO_MIN: 6,
  TOPE_NUNCA_HACE_FALTA_MAS: 12,

  TOPE2_SOBRE_TOPE1: 4.5,

  TOPES_SEP_FRAC_ESLORA: 0.5,
  TOPES_SEP_NUNCA_MAS: 100,
  TOPE1_DESDE_LA_RODA_FRAC: 0.25,

  TOPE_CHICO_SOBRE_BORDA: 2.5,

  COSTADOS_FRAC_TOPE: 0.75,

  VERT_SEP_GRANDE: 2, VERT_BAJA_GRANDE: 4,
  VERT_SEP_CHICO: 1,  VERT_BAJA_CHICO: 2,

  ANCLA_PROA_SOBRE_POPA: 4.5,
  ANCLA_PROA_MIN_50: 6,

  PESCA_SOBRE_COSTADOS_VECES: 2,

  CUBIERTAS_ILUMINADAS_DESDE: 100,

  GRANDE: 20,
  MUY_GRANDE: 50
};

const ESLORA_POR_MANGA = 6.5;
const manga = L => L / ESLORA_POR_MANGA;

function alturaTope(L) {
  if (L < A1.GRANDE) return A1.TOPE_CHICO_SOBRE_BORDA;
  return Math.min(Math.max(A1.TOPE_SOBRE_CASCO_MIN, manga(L)),
                  A1.TOPE_NUNCA_HACE_FALTA_MAS);
}

const COSTADOS_TECHO_COMUN = A1.COSTADOS_FRAC_TOPE * A1.TOPE_SOBRE_CASCO_MIN;
function alturaCostados(L) {
  return Math.min(COSTADOS_TECHO_COMUN, A1.COSTADOS_FRAC_TOPE * alturaTope(L));
}
const vertical = L => L >= A1.GRANDE
  ? { sep: A1.VERT_SEP_GRANDE, baja: A1.VERT_BAJA_GRANDE }
  : { sep: A1.VERT_SEP_CHICO,  baja: A1.VERT_BAJA_CHICO };

const xTope1 = L => L / 2 - L * A1.TOPE1_DESDE_LA_RODA_FRAC;
const xTope2 = L => xTope1(L) - Math.min(L * A1.TOPES_SEP_FRAC_ESLORA,
                                         A1.TOPES_SEP_NUNCA_MAS);
const xPopa  = L => -L / 2;
const X_MEDIO = 0;

const SM_CRUJIA = 0;
function athwart(v, kind, L) {
  if (kind === "starboard") return  manga(L) / 2;
  if (kind === "port")      return -manga(L) / 2;
  return SM_CRUJIA;
}
const CITA_ATHWART = {
  starboard: "R21(b) \u00b7 en la banda de estribor",
  port:      "R21(b) \u00b7 en la banda de babor"
};

const ALCANCE_SOBRE_CASCO = 0;

const TOW_LARGO_DIAMANTE = 200;
const towLargo   = v => v.towLength   || 120;
const towEslora  = v => v.towedLength || 60;

const towAtras   = v => towLargo(v) + (v.length || 12)/2 + towEslora(v)/2;

const tramoDe = v => (v.length || 12);
const tramoRemolque = v => (v.length || 12)/2 + towAtras(v) + towEslora(v)/2;

const CITA = {
  power:        { r: "R23",    ident: [] },
  sailing:      { r: "R25",    ident: [] },
  nuc:          { r: "R27(a)", ident: ["red", "red"] },
  ram:          { r: "R27(b)", ident: ["red", "white", "red"] },
  cbd:          { r: "R28",    ident: ["red", "red", "red"] },
  pilot:        { r: "R29",    ident: ["white", "red"] },
  fishingTrawl: { r: "R26(b)", ident: ["green", "white"] },
  fishingOther: { r: "R26(c)", ident: ["red", "white"] },
  towing:       { r: "R24",    ident: [] },
  fondeada:     { r: "R30",    ident: ["white"] }
};

const SOLO_CON_ARRANCADA = ["nuc", "ram", "fishingTrawl", "fishingOther"];

const MARCAS_DIA = {
  power:        [],
  sailing:      [],
  velaYMotor:   ["coneUp"],
  nuc:          ["ball", "ball"],
  ram:          ["ball", "diamond", "ball"],
  cbd:          ["cylinder"],
  pilot:        [],
  fishingTrawl: ["coneUp", "cone"],
  fishingOther: ["coneUp", "cone"],
  towing:       [],

  fondeada:     ["ball"]
};

const NO_ES_TIPO = ["velaYMotor"];

function marcasDia(v) {
  const clave = v.underway === false ? "fondeada"
              : (v.velaYMotor ? "velaYMotor" : v.type);

  if (clave === "towing")
    return towLargo(v) > TOW_LARGO_DIAMANTE ? ["diamond"] : [];
  return (MARCAS_DIA[clave] || []).slice();
}

function citada(v, luces) {
  const L = v.length || 12;
  const fondeada = v.underway === false;
  const clave = fondeada ? "fondeada" : v.type;
  const C = CITA[clave];
  if (!C) return "el tipo «" + v.type + "» no esta citado a ninguna regla";

  if (clave === "towing") {
    const suyas = luces.filter(l => !l.tow), suyo = luces.filter(l => l.tow);
    const topes = suyas.filter(l => l.kind === "masthead").length;
    const pide = ((towLargo(v) > TOW_LARGO_DIAMANTE) ? 3 : 2)
               + (L >= A1.MUY_GRANDE ? 1 : 0);
    if (topes !== pide)
      return "R24(a)(i) da " + pide + " tope(s) a un remolcador de " + L + " m con un "
        + "remolque de " + towLargo(v) + " m, y hay " + topes;
    if (suyas.filter(l => l.kind === "starboard").length !== 1
     || suyas.filter(l => l.kind === "port").length !== 1)
      return "R24 pide los dos costados del remolcador, y uno de cada";
    if (suyas.filter(l => l.kind === "stern" && l.colour === "white").length !== 1)
      return "R24(a)(iii) pide la luz de alcance del remolcador";
    if (suyas.filter(l => l.kind === "stern" && l.colour === "yellow").length !== 1)
      return "R24(a)(iv) pide la AMARILLA de remolque, sobre la de alcance";
    if (suyas.some(l => l.kind === "allround"))
      return "R24 no le da al remolcador ninguna luz de todo horizonte";
    if (suyo.filter(l => l.kind === "starboard").length !== 1
     || suyo.filter(l => l.kind === "port").length !== 1
     || suyo.filter(l => l.kind === "stern").length !== 1)
      return "R24(e) pide del remolcado sus dos costados y su luz de alcance, y nada mas";
    if (suyo.some(l => l.kind === "masthead" || l.kind === "allround"))
      return "R24(e) no le da al remolcado ni tope ni luz de todo horizonte";
    return null;
  }

  const todoH = luces.filter(l => l.kind === "allround")
                     .sort((a, b) => b.h - a.h).map(l => l.colour);
  const topes  = luces.filter(l => l.kind === "masthead").length;
  const lados  = luces.filter(l => l.kind === "starboard" || l.kind === "port").length;
  const alcance = luces.filter(l => l.kind === "stern" && l.colour === "white").length;
  const otros  = luces.filter(l => ["allround", "masthead", "starboard", "port",
                                    "stern"].indexOf(l.kind) < 0);
  if (otros.length) return "lleva " + otros.length + " luz(ces) de una clase que esta "
    + "tabla no conoce: " + otros.map(l => l.kind).join(" ");

  for (const k of ["starboard", "port"]) {
    const n = luces.filter(l => l.kind === k).length;
    if (n > 1) return "lleva " + n + " luces de " + k + ", y un buque tiene una";
  }

  if (fondeada) {
    const n = L >= A1.MUY_GRANDE ? 2 : 1;
    if (todoH.length !== n)
      return "R30 pide " + n + " blanca(s) de fondeo para " + L + " m y hay " + todoH.length;
    if (todoH.some(c => c !== "white")) return "una luz de fondeo que no es blanca";
    if (topes || lados || alcance) return "fondeada y con luces de navegacion encendidas";
    return null;
  }

  const chicaCombinada = clave === "power" && L < 12
    && todoH.length === 1 && todoH[0] === "white" && !topes && !alcance;
  if (!chicaCombinada && todoH.join(" ") !== C.ident.join(" "))
    return C.r + " manda de identidad [" + (C.ident.join(" ") || "ninguna")
      + "] y hay [" + (todoH.join(" ") || "ninguna") + "]";

  let topesQueTocan;
  if (clave === "power")        topesQueTocan = L < 12 ? (chicaCombinada ? 0 : 1)
                                              : (L >= A1.MUY_GRANDE ? 2 : 1);
  else if (clave === "cbd")     topesQueTocan = L >= A1.MUY_GRANDE ? 2 : 1;
  else if (clave === "ram")     topesQueTocan = v.makingWay === false ? 0
                                              : (L >= A1.MUY_GRANDE ? 2 : 1);
  else if (clave === "fishingTrawl") topesQueTocan = L >= A1.MUY_GRANDE ? 1 : 0;
  else                          topesQueTocan = 0;
  if (topes !== topesQueTocan)
    return C.r + " da " + topesQueTocan + " tope(s) a un buque de " + L + " m y hay " + topes;

  if (SOLO_CON_ARRANCADA.indexOf(clave) >= 0) {
    const debe = v.makingWay !== false;
    if (debe && (lados !== 2 || alcance !== 1))
      return C.r + " con arrancada pide los dos costados y la de alcance";
    if (!debe && (lados || alcance))
      return C.r + " sin arrancada no lleva costados ni luz de alcance";
  } else if (!chicaCombinada && (lados !== 2 || alcance !== 1)) {
    return C.r + " pide los dos costados y la de alcance";
  } else if (chicaCombinada && lados !== 2) {
    return "R23(d) pide los dos costados";
  }
  return null;
}

const P = (m, xm, cita, libre, sarta) => ({
  m: m, xm: xm, cita: cita,
  mLibre:  !!(libre && libre.indexOf("m") >= 0),
  xmLibre: !!(libre && libre.indexOf("x") >= 0),
  sarta: sarta || null
});

function coloca(v, luces, completas) {
  const mal = citada(v, completas || luces);
  if (mal) throw new Error("configuracion no citada: " + mal
    + "  (" + v.type + " " + (v.length || 12) + " m)");

  const todas = completas || luces;
  const L = v.length || 12, VE = vertical(L);
  const fondeada = v.underway === false;

  if (!fondeada && v.type === "towing") {
    const out = todas.map(() => null);
    const suyas = todas.filter(l => !l.tow), suyo = todas.filter(l => l.tow);
    const pon = (l, q) => { out[todas.indexOf(l)] = q; };

    const topes = suyas.filter(l => l.kind === "masthead")
      .sort((a, b) => a.h - b.h);

    const sarta = topes.filter(l => l.x > 0), atras = topes.filter(l => l.x <= 0);
    sarta.forEach((l, k) => pon(l, P(alturaTope(L) + k * VE.sep, xTope1(L),
      "R24(a)(i) \u00b7 en linea vertical + A1 2(a) y 2(f)", null, "topes24")));
    const cima = alturaTope(L) + (sarta.length - 1) * VE.sep;
    atras.forEach(l => pon(l, P(cima + A1.TOPE2_SOBRE_TOPE1, xTope2(L),
      "A1 2(a)(ii) + 3(a)")));
    suyas.forEach(l => {
      if (out[todas.indexOf(l)]) return;
      if (l.kind === "starboard" || l.kind === "port")
        pon(l, P(alturaCostados(L), xTope1(L), "A1 2(g) + 3(b)"));
      else if (l.kind === "stern" && l.colour === "white")
        pon(l, P(ALCANCE_SOBRE_CASCO, xPopa(L),
                 "R21 \u00b7 el sitio; la altura no la da el Anexo I", "m", "popa24"));
      else if (l.kind === "stern" && l.colour === "yellow")

        pon(l, P(ALCANCE_SOBRE_CASCO + VE.sep, xPopa(L),
                 "R24(a)(iv) \u00b7 sobre la de alcance + A1 2(f)", "m", "popa24"));
    });

    const Lr = towEslora(v), atrasM = towAtras(v), VR = vertical(Lr);
    suyo.forEach(l => {
      if (l.kind === "starboard" || l.kind === "port")
        pon(l, P(alturaCostados(Lr), -atrasM + xTope1(Lr),
                 "R24(e)(i) + A1 2(g) y 3(b)"));
      else if (l.kind === "stern")
        pon(l, P(ALCANCE_SOBRE_CASCO, -atrasM + xPopa(Lr),
                 "R24(e)(i) \u00b7 el sitio; la altura no la da el Anexo I", "m"));
    });

    todas.forEach((l, i) => { if (!out[i]) return;
      out[i].sm = athwart(v, l.kind, l.tow ? towEslora(v) : L);
      out[i].citaSm = CITA_ATHWART[l.kind] || "R21 \u00b7 en la crujia"; });
    const sinSitio = out.findIndex(o => !o);
    if (sinSitio >= 0) throw new Error("el R24 no le da sitio a "
      + todas[sinSitio].kind + "/" + todas[sinSitio].colour);
    return luces.map(l => out[todas.indexOf(l)]);
  }

  const luces_ = todas;
  const out = luces_.map(() => null);

  const idx = luces_.map((l, i) => i).filter(i => luces_[i].kind === "allround")
    .sort((a, b) => luces_[b].h - luces_[a].h);
  let cimaTodoH = null;

  if (fondeada) {
    if (idx.length === 2) {

      out[idx[0]] = P(A1.ANCLA_PROA_MIN_50, xTope1(L), "A1 2(k) + R30(a)(i)");
      out[idx[1]] = P(A1.ANCLA_PROA_MIN_50 - A1.ANCLA_PROA_SOBRE_POPA, xPopa(L),
                      "A1 2(k) + R30(a)(ii)");
    } else {

      out[idx[0]] = P(VE.baja, xTope1(L), "R30(b) · donde mejor pueda ser vista",
                      "mx");
    }
  } else if (v.type === "fishingTrawl" || v.type === "fishingOther") {

    const baja = Math.max(VE.baja,
      alturaCostados(L) + A1.PESCA_SOBRE_COSTADOS_VECES * VE.sep);
    out[idx[1]] = P(baja,          X_MEDIO, "A1 2(i)", "x", "2f");
    out[idx[0]] = P(baja + VE.sep, X_MEDIO, "A1 2(i) + 2(f)", "x", "2f");
    cimaTodoH = baja + VE.sep;
  } else if (v.type === "pilot") {

    const alta = Math.max(alturaTope(L), VE.baja + VE.sep);
    out[idx[0]] = P(alta,          X_MEDIO, "R29 · en el tope o cerca", "mx", "2f");
    out[idx[1]] = P(alta - VE.sep, X_MEDIO, "R29 + A1 2(f)", "x", "2f");
    cimaTodoH = alta;
  } else if (idx.length === 1 && v.type === "power") {

    out[idx[0]] = P(A1.TOPE_CHICO_SOBRE_BORDA, X_MEDIO,
                    "R23(d) · donde mejor pueda ser vista", "mx");
  } else if (idx.length) {

    for (let k = 0; k < idx.length; k++)
      out[idx[idx.length - 1 - k]] = P(VE.baja + k * VE.sep, X_MEDIO,
        "A1 2(f) · la altura; el sitio es libre", "x", "2f");
    cimaTodoH = VE.baja + (idx.length - 1) * VE.sep;
  }

  const iTopes = luces_.map((l, i) => i).filter(i => luces_[i].kind === "masthead")
    .sort((a, b) => luces_[a].h - luces_[b].h);
  const alturaTope1 = Math.max(alturaTope(L),
    cimaTodoH === null ? 0 : cimaTodoH + VE.sep);
  if (iTopes.length >= 1)
    out[iTopes[0]] = P(alturaTope1, xTope1(L), "A1 2(a) + 3(a)");
  if (iTopes.length >= 2)
    out[iTopes[1]] = P(alturaTope1 + A1.TOPE2_SOBRE_TOPE1, xTope2(L),
                       "A1 2(a)(ii) + 3(a)");

  const mCostados = alturaCostados(L);
  luces_.forEach((l, i) => {
    if (out[i]) return;
    if (l.kind === "starboard" || l.kind === "port")
      out[i] = P(mCostados, xTope1(L), "A1 2(g) + 3(b)");
    else if (l.kind === "stern" && l.colour === "white")

      out[i] = P(ALCANCE_SOBRE_CASCO, xPopa(L),
                 "R21 · el sitio; la altura no la da el Anexo I", "m");
    else if (l.kind === "stern" && l.colour === "yellow")
      out[i] = P(ALCANCE_SOBRE_CASCO + VE.sep, xPopa(L), "R24 + A1 2(f)", "m");
  });
  luces_.forEach((l, i) => { if (!out[i]) return;
    out[i].sm = athwart(v, l.kind, L);
    out[i].citaSm = CITA_ATHWART[l.kind] || "R21 \u00b7 en la crujia"; });
  const huerfana = out.findIndex(o => !o);
  if (huerfana >= 0) throw new Error("el Anexo I no le da sitio a "
    + luces_[huerfana].kind + "/" + luces_[huerfana].colour);

  return luces.map(l => out[luces_.indexOf(l)]);
}

if (typeof module !== "undefined") module.exports = {
  A1, manga, alturaTope, alturaCostados, vertical,
  xTope1, xTope2, xPopa, X_MEDIO, ALCANCE_SOBRE_CASCO,
  COSTADOS_TECHO_COMUN, CITA, SOLO_CON_ARRANCADA, citada, coloca,
  athwart, CITA_ATHWART,
  MARCAS_DIA, NO_ES_TIPO, marcasDia,

};

const PZ = [{"id": "1.S1", "tema": "What she shows · topic 1", "obra": "tesis", "reparto": "apiladas", "b": "Next", "h": "The same sentence, twice", "buque": {"type": "nuc", "length": 90, "underway": true, "makingWay": false}, "renglon": "Two black balls. Two red lights. The same sentence.", "pie": "A vessel not under command · 90 m · stopped in the water", "p": ["Everything in this module is one idea, and here it is before anything else: <b>what she shows by day and what she shows by night say the same thing</b>. They are not two systems to learn. They are one sentence written twice, once for the light and once for the dark.", "On the left she is carrying <b>two black balls</b>. On the right, the same vessel at night, carrying <b>two all-round red lights</b>. Both mean exactly one thing: <em>I am not under command — something has failed and I cannot get out of your way.</em>", "Learn to read one and you have read the other. That is why they are taught together and never in two lists."], "calc": "<b>Not under command</b> · Rule 27<br>by day &nbsp;&nbsp;two balls, in a vertical line<br>at night &nbsp;two all-round reds, in a vertical line"}, {"id": "1.S2", "tema": "What she shows · topic 1", "obra": "cuando", "b": "Next", "h": "When they are burning", "rotNiebla": "Fog at midday: lights ON, and her whistle going too", "renglon": "Sunset to sunrise, in all weathers — and by day whenever you cannot see far.", "pie": "Rule 20 · the rule that decides when every other rule in this module applies", "p": ["Before any of it: <b>when are they lit?</b> Rule 20 answers in one sentence and most people only hear the first half of it.", "<b>From sunset to sunrise, in all weathers.</b> Not «when it gets dark» and not «when you think you need them» — the sun goes down and they go on, clear night or filthy one. That much everybody knows.", "<b>And by day, in restricted visibility.</b> That is the half that gets missed, and it is the one that changes what you expect to see. <em>Fog at noon and every vessel around you has her navigation lights burning</em> — in daylight, with her day shapes up as well.", "Which is why this is also the door into the last part of this module. In fog she is lit <b>and she is sounding her whistle</b>, and the two go together: the same conditions switch on both. <em>A ship blowing a long blast at midday is not making a mistake — she is obeying Rule 35, and her lights are on for the same reason.</em>", "There is a second half to Rule 20 about not showing other lights that could be mistaken for these. <b>It belongs to navigation in reduced visibility and it is not in this module</b>, which is about reading the lights themselves."], "calc": "<b>Rule 20</b><br>sunset to sunrise &nbsp;<b>all weathers</b><br>and by day &nbsp;<b>in restricted visibility</b><br>same conditions as <b>Rule 35</b>, the sound signals"}, {"id": "1.S3", "tema": "What she shows · topic 1", "obra": "arcos", "b": "Next", "h": "The horizon, divided once", "renglon": "112.5 + 112.5 = 225. And 225 + 135 = 360.", "pie": "Every arc in the rules is one of these four, and together they cover the horizon exactly once", "p": ["A vessel's lights are not told apart by colour or by height. They are told apart by <b>where you have to be standing to see them</b>. Rule 21 does nothing but divide the horizon, and every light in the book is one of these four slices.", "The two sidelights take <b>112.5&deg; each</b>, from right ahead to 22.5&deg; abaft their own beam. Put them together and they are <b>225&deg;</b> &mdash; which is exactly the masthead light, sitting on top of both. <em>In a vessel of less than 20 m the two of them may live in a single lantern on her centreline &mdash; Rule 21(b). One lamp, and still the same two arcs and the same two colours.</em>", "What is left behind is <b>135&deg;</b>, and that is the sternlight. <em>225 and 135 make 360: the horizon is covered once, with nothing doubled and nothing missed.</em>", "An all-round light is the fifth kind, and it is the easy one: 360&deg;, seen from anywhere."], "calc": "<b>Rule 21</b> &middot; the arcs<br>masthead &nbsp;225&deg; &nbsp;&nbsp;sidelights &nbsp;112.5&deg; each<br>sternlight &nbsp;135&deg; &nbsp;&nbsp;all-round &nbsp;360&deg;"}, {"id": "1.S4", "tema": "What she shows · topic 1", "obra": "desde", "b": "Next", "h": "From ahead you see two. From astern, one.", "buque": {"type": "power", "length": 60, "underway": true, "makingWay": true}, "ojos": [{"n": 1, "g": 0, "tit": "Right ahead of her", "dice": "both sidelights, and her mastheads"}, {"n": 2, "g": 90, "tit": "On her starboard beam", "dice": "green only — the red is hidden by the hull"}, {"n": 3, "g": 150, "tit": "Abaft her beam", "dice": "the sternlight, and nothing else"}], "renglon": "The sidelights stop at 112.5°. One degree past it, they are gone.", "pie": "Which is why a vessel showing you only a white light is going away from you", "p": ["Stand right ahead of her and you are inside <b>both</b> sidelight arcs at once, because both of them start at right ahead. Red on your right, green on your left, and her mastheads above. That sight means one thing: <b>she is coming at you</b>.", "Step round to her beam and one sidelight goes out &mdash; her own hull hides it. Now you see a single colour, and that colour tells you which side of her you are on.", "Go one degree past <b>112.5&deg;</b> and both sidelights and both mastheads cut off together, and the sternlight comes on. From anywhere abaft that line you see <b>one white light and nothing else</b>.", "<em>That is the whole of overtaking, and it is in the arcs before it is in Rule 13.</em>"], "calc": "<b>The cut</b> &middot; 112.5&deg; from right ahead<br>before it &nbsp;sidelight and mastheads<br>after it &nbsp;&nbsp;the sternlight, alone"}, {"id": "2.S1", "tema": "What she shows · topic 2", "obra": "estados", "reparto": "apiladas", "b": "Now you try", "h": "Under way does not mean moving", "buque": {"type": "nuc", "length": 90}, "estados": [{"rot": "AT ANCHOR", "v": {"underway": false}, "pie": "her anchor is down"}, {"rot": "NOT MAKING WAY", "v": {"underway": true, "makingWay": false}, "pie": "anchor up, stopped in the water"}, {"rot": "MAKING WAY", "v": {"underway": true, "makingWay": true}, "pie": "moving through the water"}], "renglon": "Sidelights and a sternlight are what «making way» looks like.", "pie": "The same vessel, three times — drawn from her starboard side, so her port sidelight is hidden by her own hull", "p": ["Two words that sound alike and are not. <b>Under way</b> means only this: she is not at anchor, not made fast to the shore, and not aground. She may be dead in the water and still be under way. <b>Making way</b> is the second thing &mdash; she is moving through the water.", "Between the first panel and the second, everything changes: anchor lights go out, her own lights come on. Between the second and the third, only <b>the sidelights and the sternlight</b> are added &mdash; and that is the whole of it. Those two are the only lights in the rules that mean <em>moving</em>.", "Which is why you do not have to know what she is to know whether she is moving. <em>Read the sidelights first and the identity afterwards.</em>", "One warning, and the next screen will charge you for it: a power-driven vessel keeps her sidelights whether she is making way or not. On her, the lights answer <em>under way</em> and stop there."], "calc": "<b>under way</b> &nbsp;not anchored, not aground, not made fast<br><b>making way</b> &nbsp;and moving through the water<br>the tell &nbsp;&nbsp;sidelights and sternlight"}, {"id": "2.P1", "tema": "What she shows · topic 2", "obra": "practica", "banco": "ESTADO", "h": "Is she moving?", "instruccion": "Her hull is drawn to tell you she is a vessel, and it is the same hull every time. Read the lights.", "p": []}, {"id": "3.S1", "tema": "What she shows · topic 3", "obra": "topes", "reparto": "apiladas", "b": "Now you try", "h": "One masthead light, or two", "naves": [{"rot": "LESS THAN 50 M", "v": {"type": "power", "length": 30, "underway": true, "makingWay": true}, "pie": "forward, and on its own"}, {"rot": "50 M OR MORE", "v": {"type": "power", "length": 160, "underway": true, "makingWay": true}, "pie": "the after one higher, and further aft"}, {"rot": "SAYS NOTHING", "v": {"type": "sailing", "length": 40, "underway": true, "makingWay": true}, "pie": "none at all, at any length"}], "renglon": "One masthead light: under 50 m. Two: 50 m or more.", "pie": "The cheapest piece of information in the module — and the one least often looked for", "p": ["Rule 23 hands you her length for nothing, and most people never collect it. A power-driven vessel under way carries <b>one masthead light</b> if she is under 50 m and <b>two</b> if she is 50 m or more, the after one <b>higher than the forward one and further aft</b>.", "Two answers, not three. The rule has no way of saying <em>30 m</em> or <em>200 m</em> &mdash; it only ever says which side of fifty she is on. At anchor, Rule 30 gives you the <b>same count</b>: one all-round white under 50 m, two at 50 m and over. But <b>not the same picture</b> &mdash; the two of Rule 30 are stacked <b>the other way up</b>, the forward one higher, where the two of Rule 23 have the after one higher. <em>Same count, mirrored.</em>", "<b>And under 12 m the count stops working altogether.</b> Rule 23(d) lets a small power-driven vessel put her masthead light and her sternlight together as <b>one all-round white</b>, with her sidelights below it. So she has no masthead light to count — not because she is hiding it, but because the rule let her fold two lights into one. <em>One all-round white with sidelights under it is a motorboat, and it looks nothing like a ship.</em>", "And the third panel is the one to remember. <b>A sailing vessel carries no masthead light at all</b>, whatever her length &mdash; so there is nothing to count and nothing to conclude. The same happens to any vessel once you are abaft her beam: the mastheads cut off at 112.5&deg; and all that is left is her sternlight.", "<em>When the count is not there, the honest answer is that her lights do not say. Guessing is how a ship becomes a fishing boat.</em>"], "calc": "<b>Rule 23</b> &middot; under way<br>under 12 m &nbsp;<b>one all-round white</b> instead<br>under 50 m &nbsp;one masthead<br>50 m or more &nbsp;two, the <b>after</b> one higher<br><b>Rule 30</b> &middot; at anchor<br>50 m or more &nbsp;two, the <b>forward</b> one higher"}, {"id": "3.P1", "tema": "What she shows · topic 3", "obra": "practica", "banco": "ESLORA", "h": "How long is she?", "instruccion": "Count what is white and where it sits. If the count is not there, say so — that is an answer too.", "p": []}, {"id": "4.S1", "tema": "What she shows · topic 4", "obra": "alcance", "b": "Next", "h": "How far each light has to be seen", "naves": [{"L": 9, "rot": "under 12 m"}, {"L": 15, "rot": "12 to 20 m"}, {"L": 30, "rot": "20 to 50 m"}, {"L": 120, "rot": "50 m and over"}], "cols": [{"clave": "masthead", "rot": "MASTHEAD", "color": "#FFF6E2"}, {"clave": "side", "rot": "SIDELIGHT", "color": "#33C46B"}, {"clave": "stern", "rot": "STERN", "color": "#FFF6E2"}, {"clave": "allround", "rot": "ALL-ROUND", "color": "#E23B3B"}], "renglon": "The bigger she is, the further off you have to be able to see her.", "pie": "Rule 22 · the sixteen figures come out of the same table the chapter draws with", "p": ["Every light in the book has a <b>range</b>: the distance at which it must still be visible on a clear night. Rule 22 sets it, and it depends on two things only — <b>what kind of light it is</b> and <b>how long she is</b>.", "Read the table down a column and you see the first: a big ship has to be seen from further off than a small one. Read it across a row and you see the second, which matters more: <b>the masthead light always reaches furthest</b>, and the sidelights least — on a big ship, twice as far.", "<em>That is not a detail about lamps. It is what happens to a vessel as she goes away from you.</em>", "And it is a minimum, not a promise: a light may be seen further in clear air and less in haze. What the rule guarantees is that <b>inside</b> the range it is there."], "calc": "<b>Rule 22</b> · the ranges<br>they are <b>minima</b>, in nautical miles<br>and the masthead always wins"}, {"id": "4.S2", "tema": "What she shows · topic 4", "obra": "deshace", "reparto": "apiladas", "b": "Now you try", "h": "She does not vanish. She comes apart.", "buque": {"type": "power", "length": 120, "underway": true, "makingWay": true}, "g": 50, "millas": [2, 3.5, 4.5, 6.5], "renglon": "The last light you lose is the first one you saw.", "pie": "The same vessel, the same bearing, four distances — and the hull is drawn the same size in all four on purpose", "p": ["Here is the table from the last screen, happening. One vessel of 120 m, one bearing, and you backing away from her.", "At two miles you have <b>all of it</b>. At three and a half the <b>sidelight goes</b> — 3 miles is all Rule 22 asks of it. Past four and a half everything low has gone with it, and what is left is <b>one white light six miles out</b>.", "<b>So a single distant white light is not a small boat.</b> It is just as likely to be a ship whose colour you have not reached yet — and that mistake, made at night, is the one that ends in a report.", "<em>Read what is missing as hard as you read what is there.</em>"], "calc": "<b>going away</b> · the order they drop<br>sidelights first · then stern and all-round<br>the masthead last, and by a long way"}, {"id": "4.P1", "tema": "What she shows · topic 4", "obra": "practica", "banco": "ALCANCE", "h": "What is not reaching you?", "instruccion": "You are told how far off she is. Say what she is carrying that has not got to you.", "p": []}, {"id": "5.S1", "tema": "What she shows · topic 5", "obra": "marcas", "b": "Now you try", "h": "Four shapes, and the arrangements they make", "ensenaTambien": ["fishingOther"], "noSeVeDeNoche": ["velaYMotor"], "clases": [{"clave": "fondeada", "rot": "A ball", "quien": "at anchor"}, {"clave": "velaYMotor", "rot": "A cone", "quien": "sail and engine", "regla": "R25(e)"}, {"clave": "fishingTrawl", "rot": "Two cones", "quien": "fishing — either kind"}, {"clave": "cbd", "rot": "A cylinder", "quien": "draught"}, {"clave": "nuc", "rot": "Two balls", "quien": "not under command"}, {"clave": "ram", "rot": "Ball, diamond, ball", "quien": "restricted"}], "renglon": "Ball, cone, cylinder, diamond. Six arrangements of four shapes.", "pie": "Every one of them is the daylight half of a sentence you have already read in lights", "p": ["By day there are no lights, so the rules say the same things in <b>black shapes</b>. The convention defines <b>four</b>: <b>a ball</b>, <b>a cone</b>, <b>a cylinder</b> and <b>a diamond</b> — and a diamond is itself two cones, base to base. Put two cones <b>point to point</b> instead and you have the fishing vessel’s mark: the same cone, arranged another way.", "Read the row and you will recognise every arrangement, because you have already met all of them at night. <b>Two balls</b> is the vessel with the two all-round reds. <b>Ball, diamond, ball</b> is red, white, red, with the diamond standing exactly where the white light goes.", "The odd one out is the <b>single cone, point down</b>: a sailing vessel that is also using her engine. At night she shows the lights of a power-driven vessel and there is nothing to see; <b>by day the cone is the only thing that says it</b>. It is the one place where the day says more than the night.", "<em>And a fishing vessel gets the same two cones whichever way she is fishing — which is why the next screen asks you to go from her lights to her shape, and never the other way.</em>"], "calc": "<b>the four</b> · ball · cone · cylinder · diamond<br>a diamond is two cones base to base<br>and two cones point to point is the other pairing"}, {"id": "5.P1", "tema": "What she shows · topic 5", "obra": "practica", "banco": "FORMA", "h": "Say it again, in black", "instruccion": "You have her lights. Say what the same vessel would be showing in daylight.", "p": []}, {"id": "6.S1", "tema": "What she shows · topic 6", "obra": "fondeo", "reparto": "apiladas", "b": "Now you try", "h": "At anchor: one ball, and one white light", "paneles": [{"dia": true, "rot": "BY DAY", "v": {"type": "power", "length": 120, "underway": false}, "pie": "a single ball, in the fore part — at any length"}, {"rot": "UNDER 50 M", "v": {"type": "power", "length": 30, "underway": false}, "pie": "one all-round white, where it can best be seen"}, {"rot": "50 M AND OVER", "v": {"type": "power", "length": 120, "underway": false}, "pie": "two — one forward, one aft and at least 4.5 m lower"}], "renglon": "You do not have to know what she is to know she is not going anywhere.", "pie": "Rule 30 · the most common thing you will ever have to read — and the one place where the honest answer is often «I cannot tell»", "p": ["The last one, and the one you will use most. A vessel at anchor shows <b>one all-round white light</b> where it can best be seen — and, if she is <b>50 m or more</b>, a second one aft and <b>at least 4.5 m lower</b>. By day, <b>one black ball</b> forward.", "Notice what is <b>not</b> there: no sidelights, no sternlight, no masthead. An anchor light comes alone, and that is the whole of the reading. Her type does not come into it — a tanker of 300 m and a fishing boat of 15 show you the same thing.", "And there is one trap, which the next screen will charge you for. <b>A sternlight is also a single white light.</b> From abaft the beam of a vessel under way you see one white light and nothing else — the same count as a vessel of under 50 m at anchor.", "You might think you could tell them apart by where the light sits: an anchor light up forward, a sternlight low and right aft. <b>You cannot.</b> Rule 30(b) lets a vessel of under 50 m carry her anchor light <em>where it can best be seen</em> — which is nowhere in particular, and includes low and right aft. The rule leaves it free, so the position tells you nothing.", "<em>When two readings are the same picture, the answer is that you cannot tell. Saying so is not a failure — it is the reason you keep watching, and it is the only honest thing to write in a log.</em>"], "calc": "<b>Rule 30</b> · at anchor<br>under 50 m &nbsp;one all-round white<br>50 m and over &nbsp;two, the forward one higher"}, {"id": "6.P1", "tema": "What she shows · topic 6", "obra": "practica", "banco": "FONDEO", "h": "Is she at anchor?", "instruccion": "Anchor lights come alone. Before you say yes, ask what else could look like that.", "p": []}, {"id": "6.C1", "tema": "What she shows · topic 6", "obra": "cierre", "b": "Next: what she is", "h": "What you can read now", "renglon": "Five kinds of light, four arcs, two words, and five shapes.", "pie": "None of it says what she IS — and that is the whole of part 2", "p": ["That is the vocabulary. Not one rule about who gives way, and not one vessel identified by name: what you have is <b>the alphabet</b>, and it is smaller than it looks.", "You can now say, of any contact at night: <b>which way she is pointing</b>, from the arcs; <b>whether she is under way and whether she is moving</b>, from her sidelights; <b>which side of 50 m she is</b>, from her mastheads; and roughly <b>how far off</b>, from what has stopped reaching you. And you can say the same things in daylight, from five black shapes.", "<b>What you cannot do yet is name her.</b> Two all-round reds, red over white, three reds in a line — you have seen them all in these fifteen screens and you have not been asked to say what any of them means. That is deliberate: <em>reading comes before naming, and most people try it the other way round and never get the reading.</em>", "Part 2 takes one vessel at a time, by day and by night together."], "calc": "<b>part 1</b> · what she shows<br><b>part 2</b> · what she is<br><b>part 3</b> const NS = "http://www.w3.org/2000/svg";
let svg = null, gO = null;

let ESC = 1;
const px = n => n / ESC;
function el(t, at, pa){
 const e = document.createElementNS(NS, t);
 for(const k in at) if(at[k] !== undefined && at[k] !== null) e.setAttribute(k, at[k]);
 (pa || gO || svg).appendChild(e); return e;
}

function txt(x, y, s, an, tam, col, peso, fam){
 const e = el("text", {x:x, y:y, "text-anchor":an||"start", "pointer-events":"none",
  "font-size":px(tam||13),
  fill:col||"var(--paper-ink)", "font-weight":peso||400,
  "font-family":fam==="mono" ? "var(--f-mono)" : "var(--f-ui)"});
 e.textContent = s; return e;
}

function parte(s, ancho, tam){

 const porLinea = Math.max(6, Math.floor(ancho / (px(tam) * 0.62)));
 const lineas = []; let l = "";
 for(const q of String(s).split(" ")){
  if(!l) l = q;
  else if((l + " " + q).length <= porLinea) l += " " + q;
  else { lineas.push(l); l = q; }
 }
 if(l) lineas.push(l);
 return lineas;
}

const altoDe = (s, ancho, tam) => parte(s, ancho, tam).length * px(tam*1.35);
function txtCabe(cx, y, s, ancho, tam, col, peso, fam, an){
 const lineas = parte(s, ancho, tam);
 lineas.forEach((t, i) => txt(cx, y + i*px(tam*1.35), t, an || "middle", tam, col,
                              peso, fam));
 return lineas.length;
}

function renglonAbajo(yQuiere, renglon, pie, x0, x1){
 const ancho = x1 - x0;
 const nR = parte(renglon, ancho, 17).length;
 const nP = parte(pie, ancho, 12.5).length;
 const tope = D.H - px(12) - nR*px(24) - (nP - 1)*px(17);
 const y = Math.min(yQuiere, tope);
 el("line", {x1:x0, y1:y - px(26), x2:x1, y2:y - px(26),
   stroke:"var(--sea-line)", "stroke-width":1});
 txtCabe(D.W/2, y, renglon, ancho, 17, "var(--lam-ink)", 600);
 txtCabe(D.W/2, y + nR*px(24), pie, ancho, 12.5, "var(--lam-dim)");
 return y;
}

let CAJAS_PROPIAS = 0;
function panel(x, y, an, al, noche, rotulo, pincha){

 const suya = !noche || !(an > D.W * 0.8 && al > D.H * 0.35) || pincha;
 if(suya) CAJAS_PROPIAS++;
 el("rect", {x:x, y:y, width:an, height:al, rx: suya ? 3 : 0,
   fill: suya ? (noche ? "#07161D" : "var(--paper)") : "transparent",
   stroke: pincha ? "var(--dim)"
                  : (suya ? (noche ? "var(--sea-line)" : "var(--paper-line)") : "none"),

   "stroke-width": pincha ? px(2.6) : 1.2});

 txt(x+px(12), y+px(22), rotulo, "start", 12, noche ? "var(--dim)" : "var(--ink-body)", 600, "mono");

 return {x0:x, y0:y, x1:x+an, y1:y+al, cx:x+an/2, cy:y+al*0.74};
}

function cascoDe(v, L){
 const t = (v && v.type) || "power", m = L || (v && v.length) || 12;

 return CASCOS_REF.mercante;
}

const D_MARCA = 16.0, PASO_MARCA = 6.0;
const ALTO_MARCA = {"bola":16.0,"cono_arriba":16.0,"cono_abajo":16.0,"bicono":32.0,"rombo":32.0,"cilindro":32.0};

const PROY = g => ({ f: Math.abs(Math.sin(g * Math.PI / 180)),
                     s: Math.abs(Math.cos(g * Math.PI / 180)),

                     lado: -Math.cos(g * Math.PI / 180),
                     proa: Math.abs(g) < 90 });

const AIRE_CASCO = {};
function anclasDe(h){
 const nom = nombreCasco(h);
 if(AIRE_CASCO[nom]) return AIRE_CASCO[nom];
 const P = POSICIONES[nom], manga = h.plan[2] / 2, out = [];
 const pon = (f, s, y) => { if(isFinite(f) && isFinite(y)) out.push([f, s || 0, y]); };

 ["tope_popa", "alcance", "remolque", "ancla_popa", "arte"]
   .forEach(function(k){ const q = P[k]; if(q) pon(q[0], 0, q[1]); });

 if(P.costado){ pon(P.costado[0],  manga, P.costado[1]);
                pon(P.costado[0], -manga, P.costado[1]); }

 const sube = (a, n, paso) => { if(a) for(let k = 0; k < n; k++)
   pon(a[0], 0, a[1] - k * paso); };
 const baja = (a, n, paso) => { if(a) for(let k = 0; k < n; k++)
   pon(a[0], 0, a[1] + k * paso); };
 if(P.topes_col) sube([P.topes_col.f, P.topes_col.y_base], 4, P.topes_col.paso);
 sube(P.tope_proa, 3, P.paso_luz);
 baja(P.columna.libre, 3, P.paso_luz);
 baja(P.columna.bajo_tope, 3, P.paso_luz);
 baja(P.ancla_proa, 2, P.paso_luz);
 return (AIRE_CASCO[nom] = out);
}

function silueta(hueco, h, tinta, nave, pr, pts, marcas){
 const PJ = pr || {f: 1, s: 0, lado: 0, proa: false};
 const f0 = h.plan[0], f1 = h.plan[1], hb = h.plan[2] / 2;

 const X = (fq, sq) => fq * PJ.f + (sq || 0) * PJ.lado;
 const cara = 2 * hb * PJ.s;

 let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
 const mete = (a, b, c, e) => { if(a < x0) x0 = a; if(b > x1) x1 = b;
                                if(c < y0) y0 = c; if(e > y1) y1 = e; };
 h.poly.forEach(q => mete(X(q[0]), X(q[0]), q[1], q[1]));
 if(cara > 0) mete(PJ.proa ? X(f1) : X(f0) - cara, PJ.proa ? X(f1) + cara : X(f0),
                   h.ydeck, h.ywater);
 (h.blocks || []).forEach(b => { const bajo = (b[3] - b[1]) < 20;
   const mg = (hb + (bajo ? 2 : -4)) * PJ.s;
   mete(Math.min(X(b[0]), X(b[2])) - mg, Math.max(X(b[0]), X(b[2])) + mg, b[1], b[3]); });
 (h.spars || []).forEach(q => mete(Math.min(X(q[0]), X(q[1])), Math.max(X(q[0]), X(q[1])),
                                   q[2], q[2] + 2.5));
 (h.masts || []).forEach(m => mete(X(m[0]) - 2, X(m[0]) + 2, m[1], m[2]));

 const topeM = (h.masts || []).length
   ? Math.min.apply(null, h.masts.map(function(m){ return m[1]; })) : h.ydeck;
 mete(x0, x1, topeM - REF_D/2, y1);
 anclasDe(h).forEach(function(q){
  const cx = X(q[0], q[1]);
  mete(cx - REF_D/2, cx + REF_D/2, q[2] - REF_D/2, q[2] + REF_D/2);
 });

 if(marcas && marcas.length){
  const P = POSICIONES[nombreCasco(h)], anc = P.columna.libre;
  const ms = marcasRefDe(marcas);
  let alt = 0;
  ms.forEach(function(m){ alt += ALTO_MARCA[m] + PASO_MARCA; });
  mete(X(anc[0]) - D_MARCA/2, X(anc[0]) + D_MARCA/2,
       anc[1], anc[1] + alt - PASO_MARCA);
 }

 const vb = [x0, y0, Math.max(1, x1 - x0), Math.max(1, y1 - y0)];

 const g = el("svg", {x: hueco.x, y: hueco.y, width: hueco.w, height: hueco.h,
   viewBox: vb.join(" "), preserveAspectRatio: "xMidYMid meet",
   "data-nave": nave, "data-buquesvg": 1,
   "data-hx": hueco.x, "data-hy": hueco.y,
   "data-hw": hueco.w, "data-hh": hueco.h});

 el("path", {d: "M" + h.poly.map((q, i) => (i ? "L" : "") + X(q[0]).toFixed(2)
      + "," + q[1].toFixed(2)).join(" ") + " Z",
   fill: tinta, stroke: "none",
   "data-nave": nave, "data-casco": 1, "data-escorzo": PJ.f.toFixed(4)}, g);
 if(cara > 0.5)
  el("rect", {x: PJ.proa ? X(f1) : X(f0) - cara, y: h.ydeck, width: cara,
    height: h.ywater - h.ydeck, fill: tinta,
    "data-cara": 1, "data-nave": nave}, g);
 (h.blocks || []).forEach(b => {
  const bajo = (b[3] - b[1]) < 20;
  const mg = (hb + (bajo ? 2 : -4)) * 2 * PJ.s;
  const a = X(b[0]), c = X(b[2]), suyo = Math.abs(c - a), an = Math.max(suyo, mg);
  el("rect", {x: Math.min(a, c) - (an - suyo) / 2, y: b[1], width: an,
    height: b[3] - b[1], fill: tinta, "data-nave": nave, "data-sup": 1}, g);
 });
 (h.spars || []).forEach(q => {
  const a = X(q[0]), c = X(q[1]);
  el("rect", {x: Math.min(a, c), y: q[2], width: Math.max(Math.abs(c - a), 2),
    height: 2.5, fill: tinta, "data-nave": nave, "data-verga": 1}, g);
 });

 (h.masts || []).forEach(m => {
  el("rect", {x: X(m[0]) - 2, y: m[1], width: 4, height: m[2] - m[1],
    fill: tinta, "data-nave": nave, "data-palo": 1}, g);
 });

 if(marcas && marcas.length) pilaDiaRef(g, h, marcas, tinta, nave, X);
 return {nodo: g, vb: vb, h: h, PJ: PJ, X: X};
}

function focosCubierta(pts, S, nave){
 pts.forEach(p => {
  if(p.l.kind !== "allround" || p.l.colour !== "white") return;
  const h = S.h, w = (h.plan[1] - h.plan[0]) * 0.055;
  el("path", {d: "M" + p.cx.toFixed(2) + "," + p.cy.toFixed(2)
    + " L" + (p.cx - w).toFixed(2) + "," + h.ydeck
    + " L" + (p.cx + w).toFixed(2) + "," + h.ydeck + " Z",
    fill: "#FFF3C4", "fill-opacity": 0.09, "data-foco": 1, "data-nave": nave}, S.nodo);
 });
}

let NAVE_N = 0;

let HAY_LUZ = false;

function medidasDe(S, hueco){
 const vb = S.vb;
 const k = Math.min(hueco.w / vb[2], hueco.h / vb[3]);
 return {k: k,
   ox: hueco.x + (hueco.w - vb[2]*k)/2 - vb[0]*k,
   oy: hueco.y + (hueco.h - vb[3]*k)/2 - vb[1]*k};
}
function casco(P, v, noche, marcas, centroX, largoReal, fam, pr){
 const L = largoReal || v.length || 12;
 const h = fam || cascoDe(v, L);
 const yo = NAVE_N++;

 const tinta = noche ? "#24343D" : "var(--ink)";

 const altoHueco = Math.max(20, (P.cy - P.y0) - 10);
 const hueco = {x: P.x0 + 10, y: (P.y0 + P.y1)/2 - altoHueco/2,
                w: Math.max(20, (P.x1 - P.x0) - 20),
                h: altoHueco};
 const S = silueta(hueco, h, tinta, yo, pr, null, marcas);
 const M = medidasDe(S, hueco);
 const refL = h.plan[1] - h.plan[0];
 return {x0: M.ox + M.k*S.X(h.plan[0]), x1: M.ox + M.k*S.X(h.plan[1]),
         y: M.oy + M.k*h.ywater,
         alto: M.k*(h.ywater - S.vb[1]),
         largo: M.k*refL, n: yo,
         cub: M.oy + M.k*h.ydeck, fb: M.k*(h.ywater - h.ydeck),
         sup: S, k: M.k, ox: M.ox, oy: M.oy,
         medio: M.ox + M.k*((h.plan[0] + h.plan[1])/2),
         escalaH: M.k*refL / L,
         mx: xm => M.ox + M.k*((xm / L) * refL)};
}

function marcaDia(g, cx, cy, r, cual, tinta){
 const d = {"data-forma": cual};
 const T = tinta || "var(--ink)";
 if(cual === "ball")      el("circle", Object.assign({cx:cx, cy:cy, r:r,
                            fill:T}, d), g);
 else if(cual === "cone") el("path", Object.assign({d:"M"+cx+","+(cy-r)
                            +" L"+(cx+r)+","+(cy+r)+" L"+(cx-r)+","+(cy+r)+" Z",
                            fill:T}, d), g);
 else if(cual === "coneUp")el("path", Object.assign({d:"M"+cx+","+(cy+r)
                            +" L"+(cx+r)+","+(cy-r)+" L"+(cx-r)+","+(cy-r)+" Z",
                            fill:T}, d), g);
 else if(cual === "diamond")el("path", Object.assign({d:"M"+cx+","+(cy-r)
                            +" L"+(cx+r)+","+cy+" L"+cx+","+(cy+r)
                            +" L"+(cx-r)+","+cy+" Z", fill:T}, d), g);
 else if(cual === "cylinder")el("rect", Object.assign({x:cx-r*0.8, y:cy-r,
                            width:r*1.6, height:r*2, fill:T}, d), g);
}

const MARCA_PASO = 24;

const MARCA_REF = {ball: "bola", cone: "cono_arriba", coneUp: "cono_abajo",
                   diamond: "rombo", cylinder: "cilindro"};
function marcasRefDe(formas){
 const out = [];
 for(let i = 0; i < formas.length; i++){
  if(formas[i] === "coneUp" && formas[i+1] === "cone"){ out.push("bicono"); i++; }
  else out.push(MARCA_REF[formas[i]] || "bola");
 }
 return out;
}

function marcaRef(g, cx, cy, m, tinta, nave, k){
 const e = k || 1;
 const r = D_MARCA * e / 2, h = ALTO_MARCA[m] * e / 2;
 const d = {"data-forma": m, "data-nave": nave};

 const pol = pts => el("path", Object.assign({
   d: "M" + pts.map(function(q, i){ return (i ? "L" : "") + q[0] + "," + q[1]; }).join(" ")
      + " Z", fill: tinta}, d), g);
 if(m === "bola")
  el("circle", Object.assign({cx: cx, cy: cy, r: r, fill: tinta}, d), g);
 else if(m === "cono_arriba")
  pol([[cx, cy-h], [cx+r, cy+h], [cx-r, cy+h]]);
 else if(m === "cono_abajo")
  pol([[cx, cy+h], [cx+r, cy-h], [cx-r, cy-h]]);
 else if(m === "bicono"){
  pol([[cx, cy], [cx+r, cy-h], [cx-r, cy-h]]);
  pol([[cx, cy], [cx+r, cy+h], [cx-r, cy+h]]);
 } else if(m === "rombo")
  pol([[cx, cy-h], [cx+r, cy], [cx, cy+h], [cx-r, cy]]);
 else if(m === "cilindro")
  el("rect", Object.assign({x: cx-r, y: cy-h, width: D_MARCA * e,
    height: ALTO_MARCA[m] * e, fill: tinta}, d), g);
}

function pilaDiaSuelta(cx, yBase, formas, tinta, k){
 const ms = marcasRefDe(formas || []);
 if(!ms.length) return 0;
 const e = k || 1;
 let alto = 0;
 ms.forEach(function(m){ alto += ALTO_MARCA[m] * e; });
 alto += PASO_MARCA * e * (ms.length - 1);
 let y = yBase - alto;
 ms.forEach(function(m){
  marcaRef(null, cx, y + ALTO_MARCA[m] * e / 2, m, tinta, undefined, e);
  y += (ALTO_MARCA[m] + PASO_MARCA) * e;
 });
 return alto;
}

function pilaDiaRef(g, h, formas, tinta, nave, X){
 const ms = marcasRefDe(formas || []);
 if(!ms.length) return null;
 const P = POSICIONES[nombreCasco(h)];
 const anc = P.columna.libre;
 let y = anc[1];

 const yaHayPalo = X && (h.masts || []).some(function(m){
  return Math.abs(X(m[0]) - anc[0]) < 3
      && m[1] <= anc[1] + 1 && m[2] >= h.ydeck - 1;
 });
 if(!yaHayPalo)
  el("rect", {x: anc[0] - 2, y: anc[1], width: 4, height: h.ydeck - anc[1],
    fill: tinta, "data-nave": nave, "data-palo": 1}, g);
 ms.forEach(function(m){
  marcaRef(g, anc[0], y + ALTO_MARCA[m] / 2, m, tinta, nave);
  y += ALTO_MARCA[m] + PASO_MARCA;
 });
 return {f: anc[0], y0: anc[1], y1: y - PASO_MARCA};
}

function pilaDia(cx, yBase, r, formas, paso, soporte){
 const d = paso === undefined ? px(MARCA_PASO) : paso;
 if(soporte && formas.length){
  const an = Math.max(2, LUZ.D * 0.22);
  el("rect", {x: cx - an/2, y: yBase - (formas.length-1)*d,
    width: an, height: soporte.cub - (yBase - (formas.length-1)*d),
    fill: soporte.tinta});
 }
 formas.forEach((f, i) => marcaDia(gO, cx, yBase - (formas.length-1-i)*d, r, f));
 return formas.length ? (formas.length-1)*d + r*2 : 0;
}

function estrella(cx, cy, r, puntas){
 const n = puntas || 10, d = [];
 for(let i = 0; i < n*2; i++){
  const a = (i * Math.PI / n) - Math.PI/2, rr = (i % 2) ? r*0.62 : r;
  d.push((i ? "L" : "M") + (cx + rr*Math.cos(a)).toFixed(2)
                    + "," + (cy + rr*Math.sin(a)).toFixed(2));
 }
 return d.join(" ") + " Z";
}
function luz(cx, cy, r, color, datos, centelleante, pa){
 if(centelleante)
  el("path", Object.assign({d: estrella(cx, cy, r), fill:color,
    "data-centelleo":1}, datos || {}), pa);
 else
  el("circle", Object.assign({cx:cx, cy:cy, r:r, fill:color}, datos || {}), pa);
}

const COLOR_LUZ = {white:"#FFFFFF", red:"#FF0000", green:"#5AA900",
                   yellow:"#FFFF00", blue:"#0070C0"};

const COLOR_CENTELLEO = {yellow:"#EFD400"};

function vistas(v, g){ return configuration(v).filter(l => visible(l, g)); }

function nombreCasco(h){
 for(const k in CASCOS_REF) if(CASCOS_REF[k] === h) return k;
 return "mercante";
}

function firmaLuces(todas){
 return todas.map(l => l.kind + ":" + l.colour).sort().join(",");
}

function sitiaRef(v, luces, todas, h){
 const P = POSICIONES[nombreCasco(h)];
 const manga = h.plan[2] / 2;
 const fondeada = v.underway === false;
 const out = new Array(luces.length).fill(null);

 const ficha = L_REF[nombreCasco(h) + "|" + firmaLuces(todas)];
 if(ficha){

  const suyas = {}, mias = {};
  ficha.L.forEach(q => { const k = q.k + "|" + q.col;
    (suyas[k] = suyas[k] || []).push(q); });
  todas.forEach(l => { const k = l.kind + "|" + l.colour;
    (mias[k] = mias[k] || []).push(l); });
  const de = new Map();
  let todo = true;
  for(const k in mias){
   const A = mias[k].slice().sort((a, b) => b.h - a.h);
   const B = (suyas[k] || []).slice().sort((a, b) => a.y - b.y);
   if(A.length !== B.length){ todo = false; break; }
   A.forEach((l, i) => de.set(l, B[i]));
  }
  if(todo){
   luces.forEach((l, i) => {
    const q = de.get(l);
    if(!q){ todo = false; return; }
    out[i] = {f: q.f, s: q.s, y: q.y};
   });
   if(todo) return out;
   out.fill(null);
  }
 }

 const pon = (l, q) => { const i = luces.indexOf(l); if(i >= 0 && q) out[i] = q; };
 const dea = k => todas.filter(l => l.kind === k);

 if(v.tricolour && (v.length || 12) < 20){
  const c = P.columna.libre;
  todas.forEach(l => pon(l, {f: c[0], s: 0, y: c[1]}));
  return out;
 }

 const topes = P.tope_proa
   ? dea("masthead").slice().sort((a, b) => a.h - b.h)
   : [];
 if(P.topes_col && topes.length >= 2){

  const tc = P.topes_col;
  const sarta = topes.filter(l => l.x > 0), atras = topes.filter(l => !(l.x > 0));
  const cola = sarta.length ? sarta : topes;
  cola.forEach((l, k) => pon(l, {f: tc.f, s: 0, y: tc.y_base - k * tc.paso}));
  if(sarta.length) atras.forEach((l, k) => pon(l, P.tope_popa && P.tope_popa[0] !== tc.f
    ? {f: P.tope_popa[0], s: 0, y: P.tope_popa[1]}

function reparte(luces, sitios, geo, tramo){

 const porSarta = {}, porAltura = {};
 luces.forEach((l, i) => {
  const q = sitios[i];
  if(q.sarta) (porSarta[q.sarta] = porSarta[q.sarta] || []).push(i);
  else { const k = q.m.toFixed(4); (porAltura[k] = porAltura[k] || []).push(i); }
 });
 const items = [];
 for(const k in porSarta)  items.push({idx: porSarta[k],  sarta: true});
 for(const k in porAltura) items.push({idx: porAltura[k], sarta: false});
 items.forEach(it => {
  const ms = it.idx.map(i => sitios[i].m);
  it.baja = Math.min.apply(null, ms);
  it.alta = Math.max.apply(null, ms);
 });

 items.sort((a, b) => a.baja - b.baja || a.alta - b.alta);

 const alturaDe = {};
 items.forEach(it => {
  const niveles = it.idx.map(i => sitios[i].m)
    .sort((a, b) => a - b).filter((m, k, a) => !k || m !== a[k-1]);

  let debajo = 0;
  items.forEach(ot => { if(ot !== it && ot.alta <= it.baja && ot.techo !== undefined)
    debajo = Math.max(debajo, ot.techo); });

  let y = (it.baja === 0) ? 0 : debajo + LUZ.DISTINTO;
  const de = {};
  niveles.forEach((m, k) => { if(k) y += LUZ.SARTA; de[m.toFixed(4)] = y; });
  it.idx.forEach(i => { alturaDe[i] = de[sitios[i].m.toFixed(4)]; });
  it.techo = y;
 });

 const P = geo.pr || {f: 1, s: 0, lado: 0};
 return luces.map((l, i) => ({
   cx: geo.medio + ((sitios[i].xm * P.f + (sitios[i].sm || 0) * P.lado) / tramo)
                   * geo.ancho,
   cy: geo.base  - alturaDe[i] * geo.d,
   l: l, m: sitios[i].m, xm: sitios[i].xm, fila: alturaDe[i],
   mLibre: sitios[i].mLibre, xmLibre: sitios[i].xmLibre,
   cita: sitios[i].cita, sarta: sitios[i].sarta, sm: sitios[i].sm || 0 }));
}

function pasosDe(v, luces, todas){
 const pts = reparte(luces, coloca(v, luces, todas),
   {medio:0, ancho:0, base:0, d:1}, tramoDe(v));
 return Math.max.apply(null, pts.map(p => -p.cy));
}

function dibujaLuces(P, v, luces, todas, o){
 const r = LUZ.D / 2, d = LUZ.D;
 const L = v.length || 12;

 const anchoPanel = P.x1 - P.x0;

 const ancho = o.ancho || (anchoPanel - 108);

 const fam = o.casco ? CASCOS_REF[o.casco]
           : (o.neutro ? CASCOS_REF.mercante : cascoDe(v, L));

 const arriba = P.y0 + altoLibres(dichas, anchoPanel);

 const pasos = (o.pasos !== undefined && o.pasos !== null) ? o.pasos
   : (function(){ try { return pasosDe(v, luces, todas); } catch(e){ return 0; } })();

 const pr = (!o.escorza || o.g === undefined || o.g === null) ? null : PROY(o.g);

 const hw = Math.max(20, o.ancho ? o.ancho : (anchoPanel - 24));
 if(o.rotula !== false) rotulaLibres(P, dichas, Math.min(anchoPanel, hw));

 const refL = fam.plan[1] - fam.plan[0];
 const topeDe = q => (q.masts || []).length
   ? Math.min.apply(null, q.masts.map(function(m){ return m[1]; }))
   : q.ydeck - REF_D/2;

 const cuelga = (ps, tope) => {
  if(!ps.length) return ps;
  const alta = Math.min.apply(null, ps.map(function(p){ return p.cy; }));
  const dy = tope - alta;
  ps.forEach(function(p){ p.cy += dy; });
  return ps;
 };

 const hh = o.ancho ? hw : Math.max(20, P.y1 - arriba - 12);
 const hueco = {x: P.cx - hw/2, y: (P.y0 + P.y1)/2 - hh/2, w: hw, h: hh};

 if(v.type === "towing" && v.underway !== false && !o.soloRemolcador
    && !o.soloRemolcado && luces.some(l => l.tow)){
  const suyas = [], suyo = [];
  luces.forEach((l, i) => (l.tow ? suyo : suyas).push(i));
  const Lr = towEslora(v);
  const fa = cascoDe(v, L), fr = cascoDe({type:"power", gabarra:1, length:Lr}, Lr);
  const rA = fa.plan[1] - fa.plan[0], rB = fr.plan[1] - fr.plan[0];
  const PJ = pr || {f: 1, s: 0, lado: 0};
  const arma = (idx, casco, todasDe) => {
   const q = sitiaRef(v, idx.map(i => luces[i]), todasDe, casco);
   return idx.map(function(i, k){
    return {cx: q[k].f * PJ.f + q[k].s * PJ.lado, cy: q[k].y, l: luces[i],
            m: sitios[i].m, xm: sitios[i].xm, sm: sitios[i].sm || 0,
            fila: (casco.ywater - q[k].y) / REF_D,
            mLibre: sitios[i].mLibre, xmLibre: sitios[i].xmLibre,
            cita: sitios[i].cita, sarta: sitios[i].sarta};
   });
  };
  const uno = arma(suyas, fa, todas.filter(l => !l.tow));

  const dos = arma(suyo, fr, todas.filter(l => l.tow));

  const sep = hueco.w / 6;
  const util = hueco.w - sep, tot = rA + rB;
  const hA = {x: hueco.x + util*(rB/tot) + sep, y: hueco.y, w: util*(rA/tot), h: hueco.h};
  const hB = {x: hueco.x, y: hueco.y, w: util*(rB/tot), h: hueco.h};
  const nA = NAVE_N++, nB = NAVE_N++;
  const SA = silueta(hA, fa, "#24343D", nA, pr, uno);
  const SB = silueta(hB, fr, "#24343D", nB, pr, dos);
  uno.forEach(p => p.nave = nA); dos.forEach(p => p.nave = nB);
  pintaPuntos(uno, REF_D/2, L,  nA, SA.nodo);
  pintaPuntos(dos, REF_D/2, Lr, nB, SB.nodo);
  const M = medidasDe(SA, hA);
  return {n: nA, medio: M.ox + M.k*((fa.plan[0] + fa.plan[1])/2), base: M.oy};
 }

 const sr = sitiaRef(v, luces, todas, fam);
 const PJ = pr || {f: 1, s: 0, lado: 0};
 const pts = luces.map(function(l, i){
  return {cx: sr[i].f * PJ.f + sr[i].s * PJ.lado, cy: sr[i].y, l: l,
          m: sitios[i].m, xm: sitios[i].xm, sm: sitios[i].sm || 0,
          fila: (fam.ywater - sr[i].y) / REF_D,
          mLibre: sitios[i].mLibre, xmLibre: sitios[i].xmLibre,
          cita: sitios[i].cita, sarta: sitios[i].sarta};
 });

 const yo = NAVE_N++;
 const S = silueta(hueco, fam, o.dia ? "var(--ink)" : "#24343D", yo, pr, pts);

 if(v.underway === false && L >= A1.CUBIERTAS_ILUMINADAS_DESDE)
  focosCubierta(pts, S, yo);

 pintaPuntos(pts, REF_D/2, L, yo, S.nodo);
 const M = medidasDe(S, hueco);
 return {n: yo, medio: M.ox + M.k*((fam.plan[0] + fam.plan[1])/2),
         base: M.oy + M.k*fam.ydeck};
}

function escenaLibre(v, g, nm){

 const L = tramoDe(v), todas = configuration(v);
 let ver = todas.filter(l => visible(l, g));
 if(nm !== undefined && nm !== null){
  const R = ranges(L);
  ver = ver.filter(l => nm <= R[l.rangeKey]);

 ver = ver.filter(l => !l.tow);

}
const cabe = (a, b) => a === null || b === null || Math.abs(a - b) < 0.01;

function unifica(A, B){
 if(!A || !B || A.length !== B.length) return false;
 const usadas = B.map(() => false);
 const anda = i => {
  if(i >= A.length) return true;
  for(let j = 0; j < B.length; j++){
   if(usadas[j] || A[i].c !== B[j].c) continue;
   if(!cabe(A[i].m, B[j].m) || !cabe(A[i].x, B[j].x)) continue;
   usadas[j] = true;
   if(anda(i + 1)) return true;
   usadas[j] = false;
  }
  return false;
 };
 return anda(0);
}

function escenaCache(v, g, nm){

   + (v.makingWay === false ? "p" : "m") + "|" + (v.towLength || 0)
   + "|" + (v.towedLength || 0) + "|" + g + "|" + nm;

   for(const g of MARCACIONES){

function bolsa(lista, semilla){
 let s = semilla || 1, idx = [], i = 0;
 const rnd = () => { s ^= s<<13; s ^= s>>>17; s ^= s<<5; return (s>>>0)/4294967296; };
 const barajar = () => { idx = lista.map((_, k) => k);
   for(let j = idx.length-1; j > 0; j--){ const t = Math.floor(rnd()*(j+1));
     [idx[j], idx[t]] = [idx[t], idx[j]]; } i = 0; };
 barajar();
 return {saca: () => { if(i >= idx.length) barajar(); return lista[idx[i++]]; }};
}

function cajaDe(e){
 const a = e.attributes ? null : null;
 const n = k => { const v = e.getAttribute(k); return v === null ? null : +v; };
 const t = e.tagName;
 if(t === "circle"){
  const r = n("r") || 0;
  return {x0:n("cx")-r, y0:n("cy")-r, x1:n("cx")+r, y1:n("cy")+r};
 }
 if(t === "line")
  return {x0:Math.min(n("x1"),n("x2")), y0:Math.min(n("y1"),n("y2")),
          x1:Math.max(n("x1"),n("x2")), y1:Math.max(n("y1"),n("y2"))};
 if(t === "text"){
  const tam = n("font-size") || 12, an = (e.textContent || "").length * tam * 0.58;
  const anc = e.getAttribute("text-anchor");
  const x0 = anc === "middle" ? n("x") - an/2 : (anc === "end" ? n("x") - an : n("x"));
  return {x0:x0, y0:n("y") - tam, x1:x0 + an, y1:n("y")};
 }
 const d = e.getAttribute("d");
 if(d){
  const nums = d.match(/-?\d+(\.\d+)?/g) || [];
  if(nums.length < 2) return null;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for(let i = 0; i + 1 < nums.length; i += 2){
   x0 = Math.min(x0, +nums[i]);   x1 = Math.max(x1, +nums[i]);
   y0 = Math.min(y0, +nums[i+1]); y1 = Math.max(y1, +nums[i+1]);
  }
  return {x0:x0, y0:y0, x1:x1, y1:y1};
 }
 if(n("width") !== null && n("x") !== null)
  return {x0:n("x"), y0:n("y"), x1:n("x")+n("width"), y1:n("y")+n("height")};
 return null;
}

function unificaEscala(raiz){
 const gs = [];
 (function anda(n){
  if(!n) return;
  if(n.getAttribute && n.getAttribute("data-buquesvg")) gs.push(n);
  const h = n.childNodes || [];
  for(let i = 0; i < h.length; i++) if(h[i].getAttribute) anda(h[i]);
 })(raiz);

 if(!gs.length) return 0;
 let K = Infinity;
 const cajas = gs.map(function(g){
  const vb = String(g.getAttribute("viewBox")).trim().split(/\s+/).map(Number);
  const hx = +g.getAttribute("data-hx"), hy = +g.getAttribute("data-hy");
  const hw = +g.getAttribute("data-hw"), hh = +g.getAttribute("data-hh");
  const k = Math.min(hw / vb[2], hh / vb[3]);
  if(k < K) K = k;
  return {g: g, vb: vb, hx: hx, hy: hy, hw: hw, hh: hh};
 });
 if(!isFinite(K) || K <= 0) return gs.length;
 cajas.forEach(function(q){
  const w = q.vb[2] * K, h = q.vb[3] * K;
  q.g.setAttribute("width", w);
  q.g.setAttribute("height", h);
  q.g.setAttribute("x", q.hx + (q.hw - w) / 2);
  q.g.setAttribute("y", q.hy + (q.hh - h) / 2);
 });

}

function cajaDibujo(){

 const mira = e => {
  if(e.getAttribute && e.getAttribute("class") === "boton") return;

  if(e.tagName === "svg" && e.getAttribute && e.getAttribute("viewBox")){
   const bx = +e.getAttribute("x"), by = +e.getAttribute("y");
   const bw = +e.getAttribute("width"), bh = +e.getAttribute("height");
   if(isFinite(bx) && isFinite(by) && isFinite(bw) && isFinite(bh)){
    n++;
    x0 = Math.min(x0, bx); y0 = Math.min(y0, by);
    x1 = Math.max(x1, bx + bw); y1 = Math.max(y1, by + bh);
    return;
   }
  }
  const c = cajaDe(e);
  if(c && isFinite(c.x0) && isFinite(c.y0)){
   n++;
   x0 = Math.min(x0, c.x0); y0 = Math.min(y0, c.y0);
   x1 = Math.max(x1, c.x1); y1 = Math.max(y1, c.y1);
  }
  const hijos = e.childNodes || [];
  for(let i = 0; i < hijos.length; i++)
   if(hijos[i].getAttribute) mira(hijos[i]);
 };
 const hijos = gO.childNodes || [];
 for(let i = 0; i < hijos.length; i++) if(hijos[i].getAttribute) mira(hijos[i]);

 return {x0:x0, y0:y0, x1:x1, y1:y1, w:x1-x0, h:y1-y0, piezas:n};
}

  c = cajaDibujo();
  if(!c || !(c.w > 0) || !(c.h > 0)){ FORMA = null; return; }
  const mx = c.w * AIRE, my = c.h * AIRE;
  const vb = {x:c.x0 - mx, y:c.y0 - my, w:c.w + mx*2, h:c.h + my*2};

  const caja = document.getElementById("obj").getBoundingClientRect();

  let kNueva = Math.min(caja.width / vb.w, caja.height / vb.h) / ESC;

  if(HAY_LUZ && LUZ.D * ESC * kNueva > 26) kNueva = 26 / (LUZ.D * ESC);
  const paso = kNueva / KLAM;
  svg.setAttribute("viewBox", vb.x + " " + vb.y + " " + vb.w + " " + vb.h);
  KLAM = kNueva;

  reajustaRotulos(paso);
  if(Math.abs(paso - 1) < 0.005) break;
 }
 midePresenta(c);
}

function reajustaRotulos(paso){
 if(!(paso > 0) || Math.abs(paso - 1) < 1e-6) return;
 const anda = e => {
  if(e.tagName === "text"){
   const t = +e.getAttribute("font-size");
   if(t) e.setAttribute("font-size", t / paso);
  }
  const h = e.childNodes || [];
  for(let i = 0; i < h.length; i++) if(h[i].getAttribute) anda(h[i]);
 };
 const h = gO.childNodes || [];
 for(let i = 0; i < h.length; i++) if(h[i].getAttribute) anda(h[i]);
}

function diceEstado(q){
 const v = q.buque, g = q.g;
 const yo   = firmaEscena(v, g);
 const anc  = firmaEscena(Object.assign({}, v, {underway:false}), g);
 const and_ = firmaEscena(Object.assign({}, v, {underway:true, makingWay:true}),  g);
 const par  = firmaEscena(Object.assign({}, v, {underway:true, makingWay:false}), g);
 const como = [yo === anc, yo === and_, yo === par];
 if(como[0] && !como[1] && !como[2]) return "anclada";
 if(!como[0] &&  como[1] && !como[2]) return "andando";
 if(!como[0] && !como[1] &&  como[2]) return "parada";
 if(!como[0] &&  como[1] &&  como[2]) return "muda";
 return "confusa";
}

const OTRO_CAJON = {corto: 30, largo: 120};
function diceEslora(q){
 const v = q.buque, g = q.g;
 const grande = (v.length || 12) >= 50;
 const otra = firmaEscena(conL(v, grande ? OTRO_CAJON.corto : OTRO_CAJON.largo), g);
 if(firmaEscena(v, g) === otra) return "muda";
 return grande ? "grande" : "pequena";
}

function faltanDesde(v, g, nm){
 const todas = configuration(v).filter(l => visible(l, g));
 const R = ranges(v.length || 12);
 const fuera = todas.filter(l => nm > R[l.rangeKey]);
 const clases = {};
 fuera.forEach(l => clases[l.rangeKey] = true);
 return {fuera: fuera, quedan: todas.length - fuera.length, claves: clases};
}
function diceAlcance(q){
 const f = faltanDesde(q.buque, q.g, q.nm);
 if(!f.fuera.length) return "ninguna";
 if(f.claves.masthead) return "tope";

 return "costados";
}

}

 let bajo = 56 + ALP;
 s.paneles.forEach((q, i) => {
  const P = panel(M + (ANP + M)*i, 56, ANP, ALP, !q.dia, q.rot);
  if(q.dia){

   const c = casco(Object.assign({}, P, {aire: aire}), q.v, false, marcasDia(q.v));
  } else {
   pintaNave(P, q.v, null, {tapaBabor: true, pasos: pasos, aire: aire});
  }
  const nn = txtCabe(P.cx, P.y1 + px(22), q.pie, ANP - px(12), 12.5, "var(--lam-dim)");
  bajo = Math.max(bajo, P.y1 + px(22) + (nn-1)*px(17));
 });

}

function obraCierre(s){

 const n = (s.cols || []).length || 3, M = 26, HUE = px(18);
 const an = (D.W - M*2 - HUE*(n - 1)) / n;
 const y0 = 62;
 const R = ranges(120);

 const COLS = [
  ["THE FIVE KINDS OF LIGHT", [
    ["Masthead · " + (ARC.masthead*2) + "°", "white, forward, over the bow"],
    ["Sidelights · " + ARC.sidelight + "° each", "green to starboard, red to port"],
    ["Sternlight · " + (360 - ARC.sidelight*2) + "°", "white, only from abaft"],
    ["All-round · 360°", "from anywhere, any colour"]]],
  ["WHAT THEY TELL YOU", [
    ["Under way, or making way", "sidelights and stern mean moving"],
    ["Her length, off her mastheads", "one under 50 m, two at 50 and over"],
    ["How far, off what is missing",
     "a masthead reaches " + R.masthead + " M, a sidelight " + R.side]]],
  ["AND BY DAY", [
    ["The same sentence, in shapes", "ball, cone, cylinder, diamond"],
    ["At anchor · Rule 30", "one ball, or one white light"],
    ["What you still cannot do", "say what she IS — that is part 2"]]]];

 const suelo = D.H - px(96);
 const mide = con => Math.max.apply(null, COLS.map(c =>
   c[1].reduce((a, f) => a + parte(f[0], an - px(8), 13).length * px(18)
     + (con ? parte(f[1], an - px(8), 12).length * px(16) + px(2) : 0) + px(10), 0)));
 const glosa = y0 + px(54) + mide(true) <= suelo;
 let hondo = 0;
 COLS.forEach((c, j) => {
  const bx = M + (an + HUE)*j;
  el("rect", {x:bx, y:y0, width:an, height:px(30), rx:2, fill:"#0D2431",
    stroke:"var(--sea-line)", "stroke-width":1});
  txtCabe(bx + an/2, y0 + px(20), c[0], an - px(12), 12,
          "var(--lam-magenta)", 600, "mono");
  let yy = y0 + px(54);
  c[1].forEach(f => {
   yy += txtCabe(bx + px(4), yy, f[0], an - px(8), 13, "var(--lam-ink)",
                 600, "ui", "start") * px(18);
   if(glosa) yy += txtCabe(bx + px(4), yy + px(2), f[1], an - px(8), 12,
                           "var(--lam-dim)", 400, "ui", "start") * px(16) + px(2);
   yy += px(10);
  });
  hondo = Math.max(hondo, yy);
 });
 renglonAbajo(Math.min(hondo + px(30), suelo), s.renglon, s.pie, M, D.W - M);
}

function obraCuando(s){
 const M = 60, an = D.W - M*2, alto = px(46);
 const y = 108;

 const AMANECE = 0.25, ANOCHECE = 0.79;
 const NIEBLA = [0.44, 0.60];

 el("rect", {x:M, y:y, width:an, height:alto, rx:px(3), fill:"#0B2836",
   stroke:"var(--sea-line)", "stroke-width":1.2});

 el("rect", {x:M + an*AMANECE, y:y, width:an*(ANOCHECE - AMANECE), height:alto,
   fill:"#123444"});

 el("rect", {x:M + an*NIEBLA[0], y:y, width:an*(NIEBLA[1] - NIEBLA[0]), height:alto,
   fill:"#2A4657", "data-niebla":1});

 const enc = [[0, AMANECE], [NIEBLA[0], NIEBLA[1]], [ANOCHECE, 1]];
 enc.forEach(([a, b], i) => {
  const n = Math.max(2, Math.round((b - a) * 26));
  for(let k = 0; k < n; k++){
   const t = a + (b - a) * (k + 0.5) / n;
   el("circle", {cx:M + an*t, cy:y + alto*0.34, r:LUZ.D/2,
     fill:"#FFFFFF", "data-encendida":i});
  }
 });

 [[0, "midnight"], [AMANECE, "sunrise"], [ANOCHECE, "sunset"], [1, "midnight"]]
   .forEach(([t, r], i) => {
    const x = M + an*t;
    el("line", {x1:x, y1:y + alto, x2:x, y2:y + alto + px(6),
      stroke:"var(--sea-line)", "stroke-width":1});
    txt(x, y + alto + px(20), r, i === 0 ? "start" : (i === 3 ? "end" : "middle"),
        12, "var(--lam-dim)", 600, "mono");
   });

 txtCabe(M + an*AMANECE/2, y - px(14), "LIGHTS", an*AMANECE - px(8), 12.5,
         "var(--lam-ink)", 600, "mono");
 txtCabe(M + an*(ANOCHECE + 1)/2, y - px(14), "LIGHTS", an*(1 - ANOCHECE) - px(8),
         12.5, "var(--lam-ink)", 600, "mono");
 txtCabe(M + an*(NIEBLA[0] + NIEBLA[1])/2, y - px(14), "LIGHTS \u2014 AND SOUND",
         an*(NIEBLA[1] - NIEBLA[0]) + px(60), 12.5, "var(--lam-alarm)", 600, "mono");
 txtCabe(M + an*(AMANECE + NIEBLA[0])/2, y + alto*0.62, "no lights",
         an*(NIEBLA[0] - AMANECE) - px(8), 12, "var(--dim-banda)", 400, "mono");
 txtCabe(M + an*(NIEBLA[1] + ANOCHECE)/2, y + alto*0.62, "no lights",
         an*(ANOCHECE - NIEBLA[1]) - px(8), 12, "var(--dim-banda)", 400, "mono");

 txtCabe(M + an*(NIEBLA[0] + NIEBLA[1])/2, y + alto + px(40), s.rotNiebla,
         an*0.46, 12.5, "var(--lam-alarm)", 600);

 renglonAbajo(Math.min(y + alto + px(74), D.H - px(62)), s.renglon, s.pie, M, D.W - M);
}
