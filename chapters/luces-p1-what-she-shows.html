}

function pintaNave(P, v, g, o){
 const r = pintaNave0(P, v, g, o);
 o = o || {};
 if(o.amplia !== false && !AMPLIANDO && !FICHA_ROTULO && esMovil()){
  const kA = AMPLIABLES.length;
  AMPLIABLES.push({P: P, v: v, g: g, o: Object.assign({}, o), rot: o.rotAmplia || ""});
  el("rect", {x: P.x0, y: P.y0, width: P.x1 - P.x0, height: P.y1 - P.y0,
    fill: "transparent", class: "boton", "data-amplia": kA, tabindex: 0,
    role: "button", "aria-label": "Enlarge this drawing" + (o.rotAmplia ? ": " + o.rotAmplia : "")});
 }
 return r;
}
function pintaNave0(P, v, g, o){
 o = o || {};
 const todas = configuration(v);

 let luces = (g === undefined || g === null) ? todas : todas.filter(l => visible(l, g));

 if(o.soloRemolcador) luces = luces.filter(l => !l.tow);

 if(o.nm !== undefined && o.nm !== null){
  const R = ranges(v.length || 12);
  luces = luces.filter(l => o.nm <= R[l.rangeKey]);
 }

 if(o.tapaBabor) luces = luces.filter(l => l.kind !== "port");

 const oo = Object.assign({g: g}, o);
 const r = dibujaLuces(P, v, luces, todas, oo);
 if(oo.altoDebajo !== undefined) o.altoDebajo = oo.altoDebajo;
 return r;
}

function dibujaLuces(P, v, luces, todas, o){
 const r = LUZ.D / 2, d = LUZ.D;
 const L = v.length || 12;

 const anchoPanel = P.x1 - P.x0;

 const ancho = o.ancho || (anchoPanel - 108);

 const fam = o.casco ? CASCOS_REF[o.casco]
           : (o.neutro ? CASCOS_REF.mercante : cascoDe(v, L));

 const sitios = coloca(v, luces, todas);

 const dichas = (o.rotula === false) ? {} : frasesLibres(sitios);

 const notaL = notaLibreActiva(o);
 const arriba = P.y0 + ((o.rotulaDebajo || FICHA_ROTULO || notaL) ? 0 : altoLibres(dichas, anchoPanel));

 const pasos = (o.pasos !== undefined && o.pasos !== null) ? o.pasos
   : (function(){ try { return pasosDe(v, luces, todas); } catch(e){ return 0; } })();

 const pr = (!o.escorza || o.g === undefined || o.g === null) ? null : PROY(o.g);

 const hw = Math.max(20, o.ancho ? o.ancho : (anchoPanel - 24));

 if(o.rotula !== false && FICHA_ROTULO) rotulaEnFicha(FICHA_ROTULO, dichas);
 else if(o.rotula !== false && o.rotulaDebajo){
  const an = Math.min(anchoPanel, hw) + px(24);
  o.altoDebajo = Object.keys(dichas).filter(f => !LIBRES_DICHAS[f]).length
    ? altoLibres(dichas, an) - px(38) : 0;
  rotulaLibres(P, dichas, an, P.y1 + px(26));
 }

 else if(o.rotula !== false && notaL) rotulaEnFicha(notaL, dichas);
 else if(o.rotula !== false) rotulaLibres(P, dichas, Math.min(anchoPanel, hw));

 const refL = fam.plan[1] - fam.plan[0];
 const topeDe = q => (q.masts || []).length
   ? Math.min.apply(null, q.masts.map(function(m){ return m[1]; }))
   : q.ydeck - REF_D/2;

 const cuelga = (ps, tope) => {
  if(!ps.length) return ps;
  const alta = Math.min.apply(null, ps.map(function(p){ return p.cy; }));
  const dy = tope - alta;
  ps.forEach(function(p){ p.cy += dy; });
  return ps;
 };

 const hh = o.ancho ? hw : Math.max(20, P.y1 - arriba - 12);
 const hueco = {x: P.cx - hw/2, y: (P.y0 + P.y1)/2 - hh/2, w: hw, h: hh};

 if(v.type === "towing" && v.underway !== false && !o.soloRemolcador
    && !o.soloRemolcado && luces.some(l => l.tow)){
  const suyas = [], suyo = [];
  luces.forEach((l, i) => (l.tow ? suyo : suyas).push(i));
  const Lr = towEslora(v);
  const fa = cascoDe(v, L), fr = cascoDe({type:"power", gabarra:1, length:Lr}, Lr);
  const rA = fa.plan[1] - fa.plan[0], rB = fr.plan[1] - fr.plan[0];
  const PJ = pr || {f: 1, s: 0, lado: 0};
  const arma = (idx, casco, todasDe) => {
   const q = sitiaRef(v, idx.map(i => luces[i]), todasDe, casco);
   return idx.map(function(i, k){
    return {cx: q[k].f * PJ.f + q[k].s * PJ.lado, cy: q[k].y, l: luces[i],
            m: sitios[i].m, xm: sitios[i].xm, sm: sitios[i].sm || 0,
            fila: (casco.ywater - q[k].y) / REF_D,
            mLibre: sitios[i].mLibre, xmLibre: sitios[i].xmLibre,
            cita: sitios[i].cita, sarta: sitios[i].sarta};
   });
  };
  const uno = arma(suyas, fa, todas.filter(l => !l.tow));

  const dos = arma(suyo, fr, todas.filter(l => l.tow));

  const sep = hueco.w / 6;
  const util = hueco.w - sep, tot = rA + rB;
  const hA = {x: hueco.x + util*(rB/tot) + sep, y: hueco.y, w: util*(rA/tot), h: hueco.h};
  const hB = {x: hueco.x, y: hueco.y, w: util*(rB/tot), h: hueco.h};
  const nA = NAVE_N++, nB = NAVE_N++;
  const SA = silueta(hA, fa, "#24343D", nA, pr, uno, undefined, v);
  const SB = silueta(hB, fr, "#24343D", nB, pr, dos);
  uno.forEach(p => p.nave = nA); dos.forEach(p => p.nave = nB);
  pintaPuntos(uno, REF_D/2, L,  nA, SA.nodo);
  pintaPuntos(dos, REF_D/2, Lr, nB, SB.nodo);
  const M = medidasDe(SA, hA);
  return {n: nA, medio: M.ox + M.k*((fa.plan[0] + fa.plan[1])/2), base: M.oy};
 }

 const sr = sitiaRef(v, luces, todas, fam);
 const PJ = pr || {f: 1, s: 0, lado: 0};
 const pts = luces.map(function(l, i){
  return {cx: sr[i].f * PJ.f + sr[i].s * PJ.lado, cy: sr[i].y, l: l,
          m: sitios[i].m, xm: sitios[i].xm, sm: sitios[i].sm || 0,
          fila: (fam.ywater - sr[i].y) / REF_D,
          mLibre: sitios[i].mLibre, xmLibre: sitios[i].xmLibre,
          cita: sitios[i].cita, sarta: sitios[i].sarta};
 });

 const yo = NAVE_N++;

 const S = silueta(hueco, fam, o.sinCasco ? "none" : (o.dia ? "var(--ink)" : "#24343D"),
                   yo, pr, pts, undefined, v);

 if(v.underway === false && L >= A1.CUBIERTAS_ILUMINADAS_DESDE)
  focosCubierta(pts, S, yo);

 pintaPuntos(pts, REF_D/2, L, yo, S.nodo);
 const M = medidasDe(S, hueco);
 return {n: yo, medio: M.ox + M.k*((fam.plan[0] + fam.plan[1])/2),
         base: M.oy + M.k*fam.ydeck};
}

function firmaEscena(v, g){
 const L = tramoDe(v), todas = configuration(v);
 const vis = todas.filter(l => visible(l, g));
 if(!vis.length) return "";
 const s = coloca(v, vis, todas);
 return vis.map((l, i) => l.colour + "@" + s[i].m.toFixed(2)
                          + "/" + (s[i].xm / L).toFixed(3)).sort().join(" ");
}
const conL = (v, L) => Object.assign({}, v, {length: L});

function escenaLibre(v, g, nm){

 const L = tramoDe(v), todas = configuration(v);
 let ver = todas.filter(l => visible(l, g));
 if(nm !== undefined && nm !== null){
  const R = ranges(L);
  ver = ver.filter(l => nm <= R[l.rangeKey]);
 }

 ver = ver.filter(l => !l.tow);
 if(!ver.length) return null;

 const s = coloca(v, ver, todas);
 const p = reparte(ver, s, {medio: 0, ancho: 1, base: 0, d: 1}, L);
 return ver.map((l, i) => ({c: l.colour,
   m:  s[i].mLibre  ? null : p[i].fila,
   x:  s[i].xmLibre ? null : p[i].cx,
   b:  l.banda ? ladoVisto(l.banda, g) : null}));
}

function ladoVisto(banda, g){
 if(g === undefined || g === null) return null;
 const gn = ((g % 360) + 540) % 360 - 180;
 if(Math.abs(Math.abs(gn) - 90) < 1) return "medio";
 const izq = (banda === "starboard") === (Math.abs(gn) < 90);
 return izq ? "izq" : "der";
}
const cabe = (a, b) => a === null || b === null || Math.abs(a - b) < 0.01;

function unifica(A, B){
 if(!A || !B || A.length !== B.length) return false;
 const usadas = B.map(() => false);
 const anda = i => {
  if(i >= A.length) return true;
  for(let j = 0; j < B.length; j++){
   if(usadas[j] || A[i].c !== B[j].c) continue;
   if(!cabe(A[i].m, B[j].m) || !cabe(A[i].x, B[j].x)) continue;

   if(A[i].b && B[j].b && A[i].b !== B[j].b) continue;
   usadas[j] = true;
   if(anda(i + 1)) return true;
   usadas[j] = false;
  }
  return false;
 };
 return anda(0);
}

let PATRON = null;
function patrones(){
 if(PATRON) return PATRON;
 PATRON = [];
 for(const t in CITA){
  if(t === "fondeada") continue;
  for(const L of [9, 15, 24, 30, 45, 48, 52, 90, 120, 200, 300])
   for(const est of [{underway:false},
                     {underway:true, makingWay:true},
                     {underway:true, makingWay:false}]){

    if(t === "varada" && (est.underway !== false || L < 12)) continue;

    const largos = (t === "towing") ? [120, 250] : [null];

    const obstr = (t === "ram") ? [null, "port", "starboard"] : [null];

    const fondeada = est.underway === false;
    const conOpcion = L < 50 && (fondeada
      || ["power", "cbd", "ram", "fishingTrawl"].indexOf(t) >= 0)
      ? [false, true] : [false];
    for(const TL of largos)
     for(const ob of obstr)
     for(const st of conOpcion){
      const v = Object.assign({type:t, length:L}, est);
      if(TL !== null){ v.towLength = TL; v.towedLength = 60; }
      if(ob){ v.obstruccion = ob; if(st) continue; }

      if(st){ if(fondeada) v.dosFondeo = true; else v.segundoTope = true; }
      let cfg; try { cfg = configuration(v); } catch(e){ continue; }
      if(citada(v, cfg)) continue;
      PATRON.push(v);
     }
   }
 }
 return PATRON;
}

const MARCACIONES = [0, 20, 60, 100, 112, 114, 150, 179,
                     -20, -60, -100, -112, -114, -150, -179];

const _cacheEsc = {};
function escenaCache(v, g, nm){

 const k = v.type + "|" + v.length + "|" + (v.underway === false ? "a" : "n")
   + (v.makingWay === false ? "p" : "m") + "|" + (v.towLength || 0)
   + "|" + (v.towedLength || 0) + "|" + (v.segundoTope ? "2" : "1")
   + (v.dosFondeo ? "F" : "f")

   + "|" + (v.obstruccion || "") + (v.buceo ? "B" : "") + "|" + g + "|" + nm;
 if(k in _cacheEsc) return _cacheEsc[k];
 let e = null;
 try { e = escenaLibre(v, g, nm); } catch(err){ e = null; }
 return (_cacheEsc[k] = e);
}

const _cacheLect = {};

const universo = q => patrones().concat([q.buque]);

function lecturasCon(banco, q){
 const clave = banco + "|" + JSON.stringify(q.buque) + "|" + q.g + "|" + q.nm;
 if(clave in _cacheLect) return _cacheLect[clave];
 const yo = escenaLibre(q.buque, q.g, q.nm);
 const out = {};
 if(yo){
  for(const v of universo(q))
   for(const g of MARCACIONES){
    const e = escenaCache(v, g, q.nm);
    if(!e || !unifica(yo, e)) continue;
    let c; try { c = DICE[banco]({buque:v, g:g, nm:q.nm}); } catch(err){ continue; }
    if(!out[c]) out[c] = {clase:c, v:v, g:g};
   }
 }
 return (_cacheLect[clave] = out);
}

  power:        "a power-driven vessel",
  sailing:      "a sailing vessel",
  nuc:          "not under command",
  ram:          "restricted in her ability to manoeuvre",
  cbd:          "constrained by her draught",
  pilot:        "a pilot vessel",
  fishingTrawl: "a fishing vessel trawling",

};

const FONDEADA_ES_SUYA = {fishingTrawl: 1, fishingOther: 1, ram: 1, pilot: 1, varada: 1};
function claveDe(v){
 return v.underway === false && !FONDEADA_ES_SUYA[v.type] ? "fondeada"
      : (v.velaYMotor ? "velaYMotor" : v.type);
}
const claveNave = v => v.underway === false && !FONDEADA_ES_SUYA[v.type] ? "fondeada" : v.type;
function nombraNave(v){
  const k = claveNave(v), C = CITA[k];
  return (NOMBRE_NAVE[k] || k) + (C ? " \u00b7 " + C.r : "");
}

const _cacheId = {};

function identidades(q, o){
  const suya = !!(o && o.soloSuMarcacion && q.g !== undefined && q.g !== null);
  const clave = JSON.stringify(q.buque) + "|" + q.g + "|" + q.nm + "|" + suya;
  if(clave in _cacheId) return _cacheId[clave];
  const yo = escenaLibre(q.buque, q.g, q.nm);
  const out = {};
  if(yo) for(const v of universo(q))
    for(const g of (suya ? [q.g] : MARCACIONES)){
      const e = escenaCache(v, g, q.nm);
      if(e && unifica(yo, e)) out[nombraNave(v)] = 1;
    }
  return (_cacheId[clave] = Object.keys(out).sort());
}

const lecturas = (banco, q) => Object.keys(lecturasCon(banco, q));
window.universo = universo;

function testigos(banco, q){
 const yo = escenaLibre(q.buque, q.g, q.nm);
 const out = {};
 if(!yo || !VERDAD || !VERDAD[banco]) return out;
 const mia = VERDAD[banco](q.buque, q.g, q.nm);
 for(const v of universo(q))
  for(const g of MARCACIONES){
   const e = escenaCache(v, g, q.nm);
   if(!e || !unifica(yo, e)) continue;
   let t; try { t = VERDAD[banco](v, g, q.nm); } catch(err){ continue; }
   if(t === mia || out[t]) continue;
   out[t] = {verdad:t, v:v, g:g};
  }
 return out;
}

function bolsa(lista, semilla){
 let s = semilla || 1, idx = [], i = 0;
 const rnd = () => { s ^= s<<13; s ^= s>>>17; s ^= s<<5; return (s>>>0)/4294967296; };
 const barajar = () => { idx = lista.map((_, k) => k);
   for(let j = idx.length-1; j > 0; j--){ const t = Math.floor(rnd()*(j+1));
     [idx[j], idx[t]] = [idx[t], idx[j]]; } i = 0; };
 barajar();
 return {saca: () => { if(i >= idx.length) barajar(); return lista[idx[i++]]; }};
}
const BOLSAS = {};
function sacaDe(s){
 if(!BOLSAS[s.banco]) BOLSAS[s.banco] = bolsa(BANCOS[s.banco] || [],
                                              AZAR + s.id.charCodeAt(0));
 return BOLSAS[s.banco].saca();
}
window.bolsaDe = s => BOLSAS[s.banco];

function claseDe(s, q){
 const l = lecturas(s.banco, q);
 if(l.length > 1) return NO_LO_DICE[s.banco] || "confusa";
 return DICE[s.banco](q);
}
function okDe(s, q){ return TEXTOS[s.banco].clases.indexOf(claseDe(s, q)); }
window.claseDe = claseDe; window.okDe = okDe;

function nombraEscena(q){
 if(typeof NOMBRA_ESCENA === "function") return NOMBRA_ESCENA(q);
 const R = ranges(q.buque.length || 12);

 const vis = vistas(q.buque, q.g).filter(l => !l.tow).filter(l =>
   q.nm === undefined || q.nm === null || q.nm <= R[l.rangeKey]);
 const cuenta = {};
 vis.forEach(l => { const k = l.colour + "|" + (l.kind === "allround" ? "all-round"
   : l.kind === "masthead" ? "masthead"

   : l.kind === "stern" && l.colour === "yellow" ? "towing light"
   : l.kind === "stern" ? "sternlight"
   : "sidelight");
   cuenta[k] = (cuenta[k] || 0) + 1; });
 const CIF = ["no", "one", "two", "three", "four", "five", "six"];
 const trozos = Object.keys(cuenta).map(k => {
   const [col, tipo] = k.split("|"), n = cuenta[k];

   const suf = (tipo === "all-round" || tipo === "masthead") ? " light" : "";
   return (CIF[n] || n) + " " + col + " " + tipo + suf + (n > 1 ? "s" : ""); });
 const fuera = q.buque.type === "towing"
   ? " — on the tug; her tow, out of the frame, carries its own sidelights and sternlight"
   : "";
 if(!trozos.length) return "nothing at all" + fuera;
 if(trozos.length === 1) return trozos[0] + fuera;
 return trozos.slice(0, -1).join(", ") + " and " + trozos[trozos.length-1] + fuera;
}

function ciñeFicha(){
 const f = document.getElementById("ficha");
 const L = document.getElementById("lienzo");
 if(!f || !L || !FORMA || !(FORMA.r > 0)) return;
 const c = L.getBoundingClientRect();

 const an = Math.max(c.width - 44, CAJA_MIN);
 const al = Math.max(c.height - 40, CAJA_MIN);
 let w = an, h = w / FORMA.r;

 if(ALTO_LIBRE){
  const wr = document.getElementById("wrap");
  if(wr) wr.style.gridTemplateRows = Math.round(h + 40) + "px auto";
 }
 else if(h > al){ h = al; w = h * FORMA.r; }
 f.style.width  = Math.round(w) + "px";
 f.style.height = Math.round(h) + "px";
 f.style.flex   = "none";
}

let KLAM = 1;
function ajustaLamina(){
 KLAM = 1;
 let c = null;
 for(let vuelta = 0; vuelta < 4; vuelta++){
  c = cajaDibujo();
  if(!c || !(c.w > 0) || !(c.h > 0)){ FORMA = null; return; }
  const mx = c.w * AIRE, my = c.h * AIRE;
  const vb = {x:c.x0 - mx, y:c.y0 - my, w:c.w + mx*2, h:c.h + my*2};

  const caja = document.getElementById("obj").getBoundingClientRect();

  let kNueva = Math.min(caja.width / vb.w,
                        ALTO_LIBRE ? Infinity : caja.height / vb.h) / ESC;

  if(HAY_LUZ && LUZ.D * ESC * kNueva > 26) kNueva = 26 / (LUZ.D * ESC);
  const paso = kNueva / KLAM;
  svg.setAttribute("viewBox", vb.x + " " + vb.y + " " + vb.w + " " + vb.h);
  KLAM = kNueva;

  reajustaRotulos(paso);
  if(Math.abs(paso - 1) < 0.005) break;
 }
 midePresenta(c);
}

function reajustaRotulos(paso){
 if(!(paso > 0) || Math.abs(paso - 1) < 1e-6) return;
 const anda = e => {
  if(e.tagName === "text"){
   const t = +e.getAttribute("font-size");
   if(t) e.setAttribute("font-size", t / paso);
  }
  const h = e.childNodes || [];
  for(let i = 0; i < h.length; i++) if(h[i].getAttribute) anda(h[i]);
 };
 const h = gO.childNodes || [];
 for(let i = 0; i < h.length; i++) if(h[i].getAttribute) anda(h[i]);
}

  if(e.key !== "Enter" && e.key !== " ") return;

function cascoFigura(id){
  const f = (CASCOS_TIPOS.figuras_de_hoy || {})[id] || (CASCOS_TIPOS.tipos || {})[id];
  if(!f) throw new Error("cascos-tipos.json no tiene el dibujo «" + id + "»");
  return f;
}

function puntosPlanta(f, L, P){
  const M = L*f.semimanga;
  return f.planta.map(q => P(L*q[0], M*q[1]));
}
function caminoRedondo(q){
  return "M" + q.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L") + " Z";
}

function caminoFino(q){
  return "M" + q.map(p => p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" L") + " Z";
}

function caminoCrudo(q){
  return "M" + q.map(p => p[0] + "," + p[1]).join(" L") + " Z";
}

function cascoEnPlanta(x, y, rumbo, tinta, L, quien, opt){
  const o = opt || {};
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const P = o.este ? (av, tr) => [x + cs*av - sn*tr, y + sn*av + cs*tr]
                   : (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  const q = puntosPlanta(cascoFigura("nueve"), L, P);
  const gr = el("g", {"data-barco": quien});
  el("path", {d: caminoRedondo(q), fill: tinta, opacity: .95, "data-buque": "1"}, gr);
  return L;
}

function plantaBarco(x, y, rumbo, tinta, op, largo, padre){
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const L = largo || px(24);
  const P = (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];

  el("path", {d: caminoRedondo(puntosPlanta(cascoFigura("generico"), L, P)), fill: tinta,
              opacity: op === undefined ? .95 : op, "data-buque": "1"}, padre);
}

function cascoVelero(x, y, rumbo, tinta, L, padre){
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const P = (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  el("path", {d: caminoRedondo(puntosPlanta(cascoFigura("velero_fino"), L, P)),
              fill: tinta, opacity: .95, "data-buque": "1"}, padre);
}

function aparejoDeVelero(x, y, rumbo, tinta, L, lado, opt){
  const o = opt || {};
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const P = (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  const ap = (o.tipo ? cascoFigura(o.tipo) : cascoFigura("velero_fino")).aparejo;
  const a = P(L*ap.palo[0], ap.palo[1] ? lado*L*ap.palo[1] : 0);
  const b = P(L*ap.botavara[0], lado*L*ap.botavara[1]);
  const grueso = o.grueso === undefined ? 3 : o.grueso;
  const palo   = o.palo   === undefined ? 3 : o.palo;
  el("circle", {cx: a[0], cy: a[1], r: palo, fill: tinta}, o.padre);
  el("line", {x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: tinta,
              "stroke-width": grueso, "stroke-linecap": "round",
              "data-botavara": o.marca}, o.padre);
}

function buquePlanta(x, y, rumbo, tinta, L, tipo, opt){

  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);

  const P = o.este ? (av, tr) => [x + cs*av - sn*tr, y + sn*av + cs*tr]
                   : (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  const gr = el("g", {"data-barco": o.quien || null, "data-tipo": tipo}, o.padre);
  el("path", {d: caminoFino(puntosPlanta(f, L, P)), fill: tinta,
              opacity: o.op === undefined ? .95 : o.op, "data-buque": "1"}, gr);
  const enPantalla = L*(o.escala || 1);
  (f.detalles || []).forEach(function(dt){
    if(enPantalla < dt.desde_px) return;
    el("path", {d: caminoFino(puntosPlanta({semimanga: f.semimanga, planta: dt.forma}, L, P)),
                fill: tintaDe(dt.tinta, tinta, o), "data-detalle": "1"}, gr);
  });

  if(f.aparejo && !o.este && o.aparejo !== false)
    aparejoDeVelero(x, y, rumbo, tinta, L, o.lado || 1,
                    {tipo: tipo, padre: gr,

}

}

}

function colocaRotulo(x0, y0, lineas, o){
  const px = o.px, P = o.puestos, c = o.tapa || null;
  const alto = lineas.length*px(o.renglon || 15);
  const ancho = px(o.porLetra || 6.6)*Math.max.apply(null, lineas.map(t => t.length));
  const orilla = o.orilla ? Math.max(px(o.orilla), ancho/2 + px(16)) : ancho/2 + px(16);
  const izq = orilla, der = o.ancho - orilla;
  const suelo = o.y1 - px(28) - alto, techo = o.y0 + px(20);
  const corte = (a0, a1, b0, b1) => Math.max(0, Math.min(a1, b1) - Math.max(a0, b0));
  const choca = (x, y) => (c !== null && x + ancho/2 > c[0] && x - ancho/2 < c[2]
                           && y + alto > c[1] && y - px(12) < c[3])
    || P.some(q => x + ancho/2 > q[0] && x - ancho/2 < q[2]
                && y + alto + px(4) > q[1] && y - px(16) < q[3]);
  const pisa = (x, y) => (c !== null ? corte(x - ancho/2, x + ancho/2, c[0], c[2])
                                       *corte(y - px(12), y + alto, c[1], c[3]) : 0)
    + P.reduce((s, q) => s + corte(x - ancho/2, x + ancho/2, q[0], q[2])
                             *corte(y - px(16), y + alto + px(4), q[1], q[3]), 0);
  let x = Math.max(izq, Math.min(x0, der));
  let y = Math.max(techo, Math.min(y0, suelo));
  if(o.anillos){
    const cabe = (x, y) => x >= izq - 0.5 && x <= der + 0.5
                        && y >= techo - 0.5 && y <= suelo + 0.5;
    if(choca(x, y)){
      let puesto = false, mejor = {x: x, y: y, a: pisa(x, y)};
      for(let r = 1; r <= 30 && !puesto; r++){
        const v = r*px(9), w = v*0.72;
        const vueltas = [[0, v], [0, -v], [v, 0], [-v, 0],
                         [w, w], [-w, w], [w, -w], [-w, -w]];
        for(let i = 0; i < vueltas.length && !puesto; i++){
          const cx = x + vueltas[i][0], cy = y + vueltas[i][1];
          if(!cabe(cx, cy)) continue;
          if(!choca(cx, cy)){ x = cx; y = cy; puesto = true; }
          else { const a = pisa(cx, cy); if(a < mejor.a) mejor = {x: cx, y: cy, a: a}; }
        }
      }
      if(!puesto){ x = mejor.x; y = mejor.y; }
    }
  } else {
    let mejor = {x: x, y: y, a: pisa(x, y)};
    const apunta = v => { const a = pisa(x, v); if(a < mejor.a) mejor = {x: x, y: v, a: a}; };
    if(choca(x, y) && o.otros) for(const q of o.otros){
      const xa = x, w = Math.max(techo, Math.min(q[1], suelo));
      x = Math.max(izq, Math.min(q[0], der));
      if(!choca(x, w)){ y = w; break; }
      apunta(w);
      x = xa;
    }
    if(choca(x, y)){
      let puesto = false;

      for(let v = y; v <= suelo && !puesto; v += px(9))
        if(!choca(x, v)){ y = v; puesto = true; } else apunta(v);
      for(let v = y; v >= techo && !puesto; v -= px(9))
        if(!choca(x, v)){ y = v; puesto = true; } else apunta(v);
      if(!puesto){ x = mejor.x; y = mejor.y; }
    }
  }
  P.push([x - ancho/2, y - px(12), x + ancho/2, y + alto]);
  return {x: x, y: y};
}

function cedenLasSondas(svg, m){
  const todas = [].slice.call(svg.querySelectorAll("text"));
  const sondas = todas.filter(t => t.getAttribute("fill") === "var(--carta-sonda)");

  const otras = todas.filter(t => sondas.indexOf(t) < 0).map(t => t.getBBox())
    .concat([].map.call(svg.querySelectorAll("path[data-buque]"), p => p.getBBox()))
    .concat([].map.call(svg.querySelectorAll("[data-boya]"), p => p.getBBox()));

  const puestas = [];
  sondas.forEach(function(s){
    const a = s.getBBox();
    if(otras.some(b => a.x < b.x + b.width + m && a.x + a.width + m > b.x
                    && a.y < b.y + b.height + m && a.y + a.height + m > b.y)){ s.remove(); return; }
    if(puestas.some(b => a.x < b.x + b.width && a.x + a.width > b.x
                      && a.y < b.y + b.height && a.y + a.height > b.y)){ s.remove(); return; }
    puestas.push(a);
  });
}

function envolturaConvexa(P){
  P = P.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo = [], hi = [];
  for(const q of P){ while(lo.length >= 2 && cr(lo[lo.length-2], lo[lo.length-1], q) <= 0) lo.pop(); lo.push(q); }
  for(let i = P.length - 1; i >= 0; i--){ const q = P[i];
    while(hi.length >= 2 && cr(hi[hi.length-2], hi[hi.length-1], q) <= 0) hi.pop(); hi.push(q); }
  hi.pop(); lo.pop(); return lo.concat(hi);
}

function semiDe(f, a){
  let best = 0;
  const q = f.planta;
  for(let i = 0; i < q.length; i++){
    const A = q[i], B = q[(i + 1) % q.length];
    if((A[0] - a)*(B[0] - a) > 0 || A[0] === B[0]) continue;
    const b = A[1] + (B[1] - A[1])*(a - A[0])/(B[0] - A[0]);
    if(b > best) best = b;
  }
  return best;
}
function buqueAspecto(x, yAgua, L, tipo, m, tinta, opt){
  const o = opt || {}, f = cascoFigura(tipo), pf = f.perfil;
  if(!pf) throw new Error("el tipo «" + tipo + "» no tiene perfil");
  const r = m*Math.PI/180, rx = Math.sin(r), ry = -Math.cos(r), dx = Math.cos(r);
  const M = f.semimanga;
  const S = (a, b, z) => [x + (a*rx + b*M*ry)*L, yAgua - z*L];
  const gr = el("g", {"data-tipo": tipo, "data-vista": "aspecto", "data-marcacion": m}, o.padre);

  const cas = pf.casco, cort = (a, arriba) => { let best = null;
    for(let i = 0; i < cas.length; i++){ const A = cas[i], B = cas[(i+1) % cas.length];
      if((A[0] - a)*(B[0] - a) > 0 || A[0] === B[0]) continue;
      const z = A[1] + (B[1] - A[1])*(a - A[0])/(B[0] - A[0]);
      if(best === null || (arriba ? z > best : z < best)) best = z; }
    return best; };
  const a0 = Math.min.apply(null, cas.map(p => p[0])), a1 = Math.max.apply(null, cas.map(p => p[0]));
  const pts = [];
  for(let i = 0; i <= 40; i++){
    const a = a0 + 0.0001 + (a1 - a0 - 0.0002)*i/40;
    const zt = cort(a, true), zb = cort(a, false); if(zt === null) continue;
    const s = semiDe(f, a);
    pts.push(S(a, s, zt), S(a, -s, zt), S(a, s, zb), S(a, -s, zb));
  }
  el("path", {d: caminoRedondo(envolturaConvexa(pts)), fill: tinta, "data-buque": "1"}, gr);
  pf.bloques.map(b => ({b: b, prof: ((b.a[0] + b.a[1])/2)*dx}))
    .sort((A, B) => A.prof - B.prof).forEach(function(q){
      const b = q.b, Q = [];
      b.a.forEach(a => [-b.semiancho, b.semiancho].forEach(v => b.z.forEach(z => Q.push(S(a, v, z)))));
      el("path", {d: caminoRedondo(envolturaConvexa(Q)), fill: tintaDe("suave", tinta, o)}, gr);
    });
  const grueso = Math.max(1, L*0.012);
  pf.palos.forEach(p => { const A = S(p.a, 0, p.z[0]), B = S(p.a, 0, p.z[1]);
    el("line", {x1: A[0], y1: A[1], x2: B[0], y2: B[1], stroke: tinta, "stroke-width": grueso}, gr); });
  pf.perchas.forEach(p => { const A = S(p.a[0], 0, p.z), B = S(p.a[1], 0, p.z);
    el("line", {x1: A[0], y1: A[1], x2: B[0], y2: B[1], stroke: tinta, "stroke-width": grueso}, gr); });
  return gr;
}

function diceEstado(q){
 const v = q.buque, g = q.g;
 const yo   = firmaEscena(v, g);
 const anc  = firmaEscena(Object.assign({}, v, {underway:false}), g);
 const and_ = firmaEscena(Object.assign({}, v, {underway:true, makingWay:true}),  g);
 const par  = firmaEscena(Object.assign({}, v, {underway:true, makingWay:false}), g);
 const como = [yo === anc, yo === and_, yo === par];
 if(como[0] && !como[1] && !como[2]) return "anclada";
 if(!como[0] &&  como[1] && !como[2]) return "andando";
 if(!como[0] && !como[1] &&  como[2]) return "parada";
 if(!como[0] &&  como[1] &&  como[2]) return "muda";
 return "confusa";
}

const OTRO_CAJON = {corto: 30, largo: 120};
function cuentaEscena(v, g){
 return configuration(v).filter(l => visible(l, g))
   .map(l => l.colour + ":" + l.rangeKey).sort().join(" ");
}
function diceEslora(q){
 const v = q.buque, g = q.g;
 const grande = (v.length || 12) >= 50;
 const otro = grande ? OTRO_CAJON.corto : OTRO_CAJON.largo;

 if(cuentaEscena(v, g) === cuentaEscena(conL(v, otro), g)) return "muda";

 return grande ? "muda" : "pequena";
}

function faltanDesde(v, g, nm){
 const todas = configuration(v).filter(l => visible(l, g));
 const R = ranges(v.length || 12);
 const fuera = todas.filter(l => nm > R[l.rangeKey]);
 const clases = {};
 fuera.forEach(l => clases[l.rangeKey] = true);
 return {fuera: fuera, quedan: todas.length - fuera.length, claves: clases};
}
function diceAlcance(q){
 const f = faltanDesde(q.buque, q.g, q.nm);
 if(!f.fuera.length) return "ninguna";
 if(f.claves.masthead) return "tope";

 return "costados";
}

 if(col) renglonAbajo(ly + px(30), s.renglon, s.pie, D.W*0.08, D.W*0.92, ly + px(30));
 else renglonAbajo(Math.min(D.H*0.88, D.H - px(88)), s.renglon, s.pie, D.W*0.08, D.W*0.92);

function obraDesde(s){

 const col = esMovil();
 if(col) ALTO_LIBRE = true;
 const R = col ? D.W*0.24 : Math.min(D.W*0.18, D.H*0.22);
 const cx = col ? D.W/2 : D.W*0.25, cy = col ? 40 + R*1.35 : D.H*0.40;
 el("circle", {cx:cx, cy:cy, r:R, fill:"#07161D",
   stroke:"var(--sea-line)", "stroke-width":1.2});
 sector(cx, cy, R, 0, ARC.sidelight, COLOR_LUZ.green, .28);
 sector(cx, cy, R, -ARC.sidelight, 0, COLOR_LUZ.red, .28);
 sector(cx, cy, R, ARC.sidelight, 360-ARC.sidelight, COLOR_LUZ.white, .26);
 planta(cx, cy, R, s.buque);

 const luces = configuration(s.buque);
 const lx = col ? D.W*0.10 : D.W*0.52;

 const yTopeOjos = Math.min(D.H*0.82, D.H - px(88)) - px(44);
 const anchoOjo = D.W - lx - px(46);
 const altosOjo = s.ojos.map(o => px(30) + altoDe(o.dice, anchoOjo, 12.5) + px(14));
 const conGlosa = col || D.H*0.16 + altosOjo.reduce((a, b) => a + b, 0) <= yTopeOjos;
 let ly = col ? cy + R*1.35 + px(40) : D.H*0.16;
 for(const o of s.ojos){
  const [ox,oy] = polar(cx, cy, R*1.30, o.g);

  el("circle", {cx:ox, cy:oy, r:px(7), fill:"var(--paper-ink)"});
  txt(ox, oy+px(4), String(o.n), "middle", 12, "#0A1E27", 700, "mono");

  const ve = luces.filter(l => visible(l, o.g));

  const cuenta = {};
  for(const l of ve) cuenta[l.colour] = (cuenta[l.colour]||0) + 1;
  el("circle", {cx:lx, cy:ly-px(4), r:px(8), fill:"var(--paper-ink)"});
  txt(lx, ly, String(o.n), "middle", 12, "#0A1E27", 700, "mono");
  txtCabe(lx+px(20), ly, o.tit, D.W - lx - px(36), 14.5, "var(--lam-ink)", 600,
          "ui", "start");
  let qx = lx+px(20);
  for(const c in cuenta){
   for(let k=0;k<cuenta[c];k++){
    el("circle", {cx:qx+px(7), cy:ly+px(20), r:px(6), fill:COLOR_LUZ[c]});
    qx += px(19);
   }
  }
  const nD = conGlosa
    ? txtCabe(qx+px(8), ly+px(24), o.dice, D.W - qx - px(24), 12.5,
              "var(--lam-dim)", 400, "ui", "start")
    : 0;

  ly += px(30) + nD * px(17) + px(14);
 }
 if(col) renglonAbajo(ly + px(24), s.renglon, s.pie, D.W*0.08, D.W*0.92, ly + px(24));
 else renglonAbajo(Math.min(D.H*0.82, D.H - px(88)), s.renglon, s.pie, D.W*0.08, D.W*0.92);
}

function obraCierre(s){

 if(mv) ALTO_LIBRE = true;

 const an = mv ? D.W - M*2 : (D.W - M*2 - HUE*(n - 1)) / n;
 const y0 = 62;
 const R = ranges(120);

 const COLS = [
  ["THE FIVE KINDS OF LIGHT", [
    ["Masthead · " + (ARC.masthead*2) + "°", "white, forward, over the bow"],
    ["Sidelights · " + ARC.sidelight + "° each", "green to starboard, red to port"],
    ["Sternlight · " + (360 - ARC.sidelight*2) + "°", "white, only from abaft"],
    ["All-round · 360°", "from anywhere, any colour"]]],
  ["WHAT THEY TELL YOU", [

    ["Under way, or making way", "sidelights mean moving on R26 and R27 only"],

    ["Her length, off her mastheads", "one says under 50 m; two say nothing"],

     "a masthead reaches " + R.masthead + " M, a sidelight " + R.side]]],
  ["AND BY DAY", [
    ["The same sentence, in shapes", "ball, cone, cylinder, diamond"],

    ["At anchor · Rule 30", "one ball; two whites, or one under 50 m"],
    ["What you still cannot do", "say what she IS — that is part 2"]]]];

 const suelo = D.H - px(96);
 const mide = con => Math.max.apply(null, COLS.map(c =>
   c[1].reduce((a, f) => a + parte(f[0], an - px(8), 13).length * px(18)
     + (con ? parte(f[1], an - px(8), 12).length * px(16) + px(2) : 0) + px(10), 0)));
 const glosa = mv || y0 + px(54) + mide(true) <= suelo;
 let hondo = 0, yC = y0;
 COLS.forEach((c, j) => {
  const bx = mv ? M : M + (an + HUE)*j, yT = mv ? yC : y0;
  el("rect", {x:bx, y:yT, width:an, height:px(30), rx:2, fill:"#0D2431",
    stroke:"var(--sea-line)", "stroke-width":1});
  txtCabe(bx + an/2, yT + px(20), c[0], an - px(12), 12,

  let yy = yT + px(54);
  c[1].forEach(f => {
   yy += txtCabe(bx + px(4), yy, f[0], an - px(8), 13, "var(--lam-ink)",

   if(glosa) yy += txtCabe(bx + px(4), yy + px(2), f[1], an - px(8), 12,

   yy += px(10);
  });

 });
 renglonAbajo(Math.min(hondo + px(30), suelo), s.renglon, s.pie, M, D.W - M,

function obraCuando(s){

 const col = esMovil();
 if(col) ALTO_LIBRE = true;
 const M = 60, an = D.W - M*2, alto = px(46);
 const y = 108;

 const arriba = (cx, s, w, tam, c) => txtCabe(cx,
   y - px(14) - (col ? (parte(s, w, tam).length - 1)*px(tam*1.35) : 0), s, w, tam, c, 600, "mono");

 const AMANECE = 0.25, ANOCHECE = 0.79;
 const NIEBLA = [0.44, 0.60];

 el("rect", {x:M, y:y, width:an, height:alto, rx:px(3), fill:"#0B2836",
   stroke:"var(--sea-line)", "stroke-width":1.2});

 el("rect", {x:M + an*AMANECE, y:y, width:an*(ANOCHECE - AMANECE), height:alto,
   fill:"#123444"});

 el("rect", {x:M + an*NIEBLA[0], y:y, width:an*(NIEBLA[1] - NIEBLA[0]), height:alto,
   fill:"#2A4657", "data-niebla":1});

 const enc = [[0, AMANECE], [NIEBLA[0], NIEBLA[1]], [ANOCHECE, 1]];
 enc.forEach(([a, b], i) => {
  const n = Math.max(2, Math.round((b - a) * 26));
  for(let k = 0; k < n; k++){
   const t = a + (b - a) * (k + 0.5) / n;
   el("circle", {cx:M + an*t, cy:y + alto*0.34, r:LUZ.D/2,
     fill:"#FFFFFF", "data-encendida":i});
  }
 });

 [[0, "midnight"], [AMANECE, "sunrise"], [ANOCHECE, "sunset"], [1, "midnight"]]
   .forEach(([t, r], i) => {
    const x = M + an*t;
    el("line", {x1:x, y1:y + alto, x2:x, y2:y + alto + px(6),
      stroke:"var(--sea-line)", "stroke-width":1});
    const alt = col && (i === 1 || i === 2) ? px(18) : 0;
    if(alt) el("line", {x1:x, y1:y + alto + px(6), x2:x, y2:y + alto + px(6) + alt,
      stroke:"var(--sea-line)", "stroke-width":1});
    txt(x, y + alto + px(20) + alt, r, i === 0 ? "start" : (i === 3 ? "end" : "middle"),
        12, "var(--lam-dim)", 600, "mono");
   });

 arriba(M + an*AMANECE/2, "LIGHTS", an*AMANECE - px(8), 12.5, "var(--lam-ink)");
 arriba(M + an*(ANOCHECE + 1)/2, "LIGHTS", an*(1 - ANOCHECE) - px(8), 12.5, "var(--lam-ink)");
 arriba(M + an*(NIEBLA[0] + NIEBLA[1])/2, "LIGHTS \u2014 AND SOUND",
        an*(NIEBLA[1] - NIEBLA[0]) + px(60), 12.5, "var(--lam-alarm)");
 txtCabe(M + an*(AMANECE + NIEBLA[0])/2, y + alto*0.62, "no lights",
         an*(NIEBLA[0] - AMANECE) - px(8), 12, "var(--dim-banda)", 400, "mono");
 txtCabe(M + an*(NIEBLA[1] + ANOCHECE)/2, y + alto*0.62, "no lights",
         an*(ANOCHECE - NIEBLA[1]) - px(8), 12, "var(--dim-banda)", 400, "mono");

 const yN = y + alto + px(40) + (col ? px(18) : 0);
 const nN = txtCabe(col ? D.W/2 : M + an*(NIEBLA[0] + NIEBLA[1])/2, yN, s.rotNiebla,
         col ? an : an*0.46, 12.5, "var(--lam-alarm)", 600);
 renglonAbajo(Math.min(y + alto + px(74), D.H - px(62)), s.renglon, s.pie, M, D.W - M,
              col ? yN + (nN - 1)*px(17) + px(50) : undefined);
}

const TEXTOS = {"ESTADO": {"pregunta": "What do her lights tell you she is doing?", "clases": ["anclada", "andando", "parada", "muda"], "opciones": ["She is <b>at anchor</b>.", "She is <b>under way and making way</b> — moving through the water.", "She is <b>under way but not making way</b> — stopped in the water.", "She is <b>under way</b>, but her lights do not say whether she is moving."], "porque": {"anclada": "<b>Two</b> all-round whites and not one other light on her — the Rule 30(a) pair, the forward one higher. Nothing under way shows that and nothing else, so her anchor is down. <em>One white on its own would not have been enough: a sternlight is one white light too, and that is the next screen.</em>", "andando": "Her sidelights and her sternlight are burning, and on her those are the two lights that only come on when she is making way through the water — Rule 27 for a vessel not under command or restricted, Rule 26 for one fishing. On a power-driven vessel they would say nothing.", "parada": "She is telling you what she is, and showing neither sidelight nor sternlight. Anchor up, stopped in the water — which for this one is a thing worth knowing.", "muda": "Nothing on her changes when she stops. A power-driven vessel, a sailing vessel, a tug with a tow: they carry the same lights making way or lying dead in the water. The lights answer <em>under way</em> and go no further."}, "mal": {"anclada": "At anchor she shows all-round whites and <b>nothing else</b> — no sidelight, no sternlight, and none of the lights that say what she is. And one white on its own does not settle it: a sternlight looks the same.", "andando": "<em>Making way</em> has to be visible before you can claim it: sidelights, or a sternlight. And on some vessels they are lit whether she moves or not, so seeing them is not enough either.", "parada": "<em>Stopped in the water</em> is a claim that her sidelights and sternlight are OUT — and that they would have been ON if she were moving. Check both halves.", "muda": "Some vessels do carry the same lights stopped or moving. Not this one: what she is showing changes when she stops, so it answers."}, "pista": "Sidelights and a sternlight are the only lights in the book that mean <em>moving through the water</em>. Everything else she carries says what she IS, not what she is doing.", "show": {"anclada": "The Rule 30 pair, and nothing else lit. Her anchor is down. She is not under way at all, so <em>making way</em> does not arise.", "andando": "The sidelights and the sternlight are the tell. Rules 24 to 28 give them to a vessel <em>when making way</em>, and take them away the moment she stops.", "parada": "She has her identity lights and neither sidelight nor sternlight. Under way — not anchored, not aground — and stopped in the water.", "muda": "Compare her with herself: put her lights out of gear and not one of them goes out. Under way is all they say, and it is all you may claim."}}, "ESLORA": {"pregunta": "How long is she?", "clases": ["pequena", "grande", "muda"], "opciones": ["<b>Less than 50 m.</b>", "<b>50 m or more.</b>", "<b>Her lights do not say.</b>"], "porque": {"pequena": "<b>The short count, and only the short count, proves it.</b> One white forward and no second one abaft it: a vessel of 50 m or more is <em>obliged</em> to show that second masthead light, so she cannot be one. At anchor the same reasoning runs on Rule 30(b) — a single all-round white is an option only a vessel under 50 m is given.", "grande": "There is no such reading. <b>No arrangement of lights proves a vessel is 50 m or more</b>, because everything the big one shows, the small one is allowed to show too.", "muda": "<b>Her length is not on offer here.</b> Either there is no count in front of you — you are abaft her beam and the mastheads have cut off, or <b>she is under 12 m and Rule 23(d) has folded her masthead and her sternlight into one all-round white</b>, or she carries none at all — or the count you can see is the <b>long</b> one, which any vessel may show. Two whites are not a size."}, "mal": {"pequena": "<em>Less than 50 m</em> is a claim about seeing exactly <b>one</b> masthead light — or, at anchor, exactly one all-round white. Count again, and make sure what you are counting is a masthead light and not her sternlight.", "grande": "<b>Two masthead lights do not make her big, and that is the lesson.</b> Rule 23(a)(ii) says a vessel under 50 m <em>&ldquo;shall not be obliged to exhibit such light but may do so&rdquo;</em>, and Rule 30(a) asks every vessel at anchor for two whites before Rule 30(b) lets the small one drop to one. The big vessel's display is never out of bounds for the small one, so seeing it tells you nothing about her size.", "muda": "Her lights do say it here. Look for the <b>short</b> count — one masthead light under way, or one all-round white at anchor — because that is the one a large vessel is not allowed."}, "pista": "<b>The count speaks in one direction only.</b> A vessel of 50 m or more <em>must</em> show two masthead lights, the <b>after</b> one higher; a vessel under 50 m need only show one, and Rule 23(a)(ii) lets her show two if she likes. So one masthead light proves she is small, and two prove nothing. At anchor it is the same shape: Rule 30(a) asks everyone for two all-round whites, the <b>forward</b> one higher, and Rule 30(b) lets a vessel under 50 m show one instead. <b>And under 12 m there may be no masthead light at all</b> — Rule 23(d) folds it and the sternlight into one all-round white.", "show": {"pequena": "One white forward and no second one behind it. Under 50 m — anything bigger would have to show the second.", "grande": "Two whites do not give you this. She may be 200 m, or she may be a 30 m boat wearing the light Rule 23(a)(ii) allows her.", "muda": "Nothing here is the short count. Her length is not in what you can see, and the honest answer is to say so."}, "senuelos": ["grande"]}, "ALCANCE": {"pregunta": "What is she carrying that Rule 22 does not promise you from here?", "clases": ["ninguna", "costados", "tope"], "opciones": ["<b>Nothing.</b> Every light she has is within its range.", "<b>Her sidelights, at least.</b> Maybe more.", "<b>Her masthead light.</b>"], "porque": {"ninguna": "At this distance you are inside the minimum range of every light she is showing, so Rule 22 promises you all of it.", "costados": "A sidelight has the shortest range in Rule 22, so it is the first whose minimum you pass. She is still carrying them; past that distance Rule 22 no longer <b>promises</b> them — on a clear night you may still see them, in haze you will not. And there may be more that is not promised, because what else she carries depends on what she is, and that is part 2.", "tope": "—"}, "mal": {"ninguna": "«Nothing» is a claim about range, not about the picture. Check the shortest-ranged light she has and ask whether you are inside it.", "costados": "The sidelights have the shortest range — but at this distance you are still inside it. Check the shortest range she has against the distance you were given.", "tope": "Never. Rule 22 gives the masthead light the <b>longest</b> range of the lot — 6 miles on a big ship against 3 for a sidelight. It is the last light Rule 22 stops promising, not the first."}, "pista": "Rule 22 gives every light a range, and they are not the same: the masthead reaches furthest, the sidelights least. So a vessel does not vanish — she comes apart, from the bottom up. <b>And every range is a minimum</b>: a light may be seen further, it is only never promised further.", "show": {"ninguna": "You are inside the minimum range of the shortest light she has, so all of it is promised.", "costados": "Only the sidelights are past their minimum range here; everything else is inside it.", "tope": "This never happens: the masthead light outreaches the rest."}, "senuelos": ["tope"], "sitiosAsignados": true}, "FORMA": {"pregunta": "And by day, what would she be showing?", "clases": ["", "ball", "ball ball", "ball diamond ball", "cylinder", "coneUp cone"], "opciones": ["<b>Nothing at all.</b> No day shape.", "<b>A single black ball.</b>", "<b>Two black balls</b>, in a vertical line.", "<b>Ball — diamond — ball</b>, in a vertical line.", "<b>A cylinder.</b>", "<b>Two cones</b>, points together."], "porque": {"": "Some vessels say nothing by day at all. A power-driven vessel under way, a sailing vessel under sail alone, a pilot vessel: their lights say something and their daytime silhouette says nothing.", "ball": "One ball, in the fore part. Rule 30 by day is the same sentence as one all-round white by night.", "ball ball": "Two balls for two all-round reds. Rule 27(a) writes the same thing twice, once for the light and once for the dark.", "ball diamond ball": "Ball, diamond, ball — exactly the red, white, red of her lights, with the diamond standing where the white one goes. Rule 27(b).", "cylinder": "A cylinder, for the three all-round reds. Rule 28, and the only shape in the book that is neither ball nor cone.", "coneUp cone": "Two cones with their points together, for both kinds of fishing vessel. Rule 26 gives them the same shape by day and different lights by night — which is why this question runs from the night to the day and not the other way."}, "mal": {"": "She is showing you something at night that Rule 26, 27, 28 or 30 also writes as a shape. Read what is lit before you decide it says nothing.", "ball": "One ball is Rule 30 — at anchor, and nothing else lit.", "ball ball": "Two balls is <em>not under command</em>: two all-round reds, and only two.", "ball diamond ball": "That one is <em>restricted in her ability to manoeuvre</em>: red, white, red. Count the colours again.", "cylinder": "The cylinder belongs to a vessel constrained by her draught — three all-round reds, and the lights of a power-driven vessel underneath them.", "coneUp cone": "Two cones is a fishing vessel: an all-round green or red over an all-round white."}, "pista": "Every rule in this module writes the same sentence twice — once in lights and once in shapes. Read what the lights say first, then say it again in black.", "show": {"": "No shape. What she is showing at night has no daytime equivalent.", "ball": "A single ball. Rule 30, at anchor.", "ball ball": "Two balls. Rule 27(a), not under command.", "ball diamond ball": "Ball, diamond, ball. Rule 27(b), restricted in her ability to manoeuvre.", "cylinder": "A cylinder. Rule 28, constrained by her draught.", "coneUp cone": "Two cones, points together. Rule 26, fishing."}}, "FONDEO": {"pregunta": "Is she at anchor?", "clases": ["fondeada", "navegando", "muda"], "opciones": ["<b>At anchor.</b>", "<b>Not at anchor — she is under way.</b>", "<b>One white light and no more — it could be either.</b>"], "porque": {"fondeada": "Two all-round whites, the forward one higher and at least 4.5 m above the after one, and <b>nothing else on her</b>. That is the Rule 30(a) pair, and Rule 30 allows nothing else lit — so it cannot be anything under way. Two mastheads come with sidelights, and from astern they do not come at all. <em>What it does not tell you is her length: Rule 30(a) asks those two of every vessel, and it is only the one under 50 m that Rule 30(b) lets off with one.</em>", "navegando": "Something is lit that Rule 30 on its own never shows. A sidelight, a sternlight or a masthead light settles it: no vessel at anchor shows one. A colour alone would not — Rules 26, 27(b)(iv), 29 and 30(d) all show colour at anchor.", "muda": "<b>One white light, and nothing else.</b> Rule 30(b) lets a vessel of under 50 m carry her anchor light <em>where it can best be seen</em> — so it can be anywhere, including low and right aft. And a sternlight is one white light, low and right aft. <b>Nothing in the picture separates them.</b> Saying so is the answer; guessing is how a ship at anchor becomes a ship going away from you."}, "mal": {"fondeada": "<em>At anchor</em> needs the Rule 30(a) pair — two whites, the forward one higher, and nothing else lit. If you can see only one, a sternlight looks the same; if a sidelight, a sternlight or a masthead light is burning, no vessel at anchor shows it.", "navegando": "You can only rule out anchoring if what you see could not be anchor lights. One lone white light could be.", "muda": "Here the picture does settle it. Either there are two whites in the Rule 30 pair, or there is something on her that Rule 30 would never allow."}, "pista": "Rule 30(a) asks <b>every</b> vessel at anchor for <b>two</b> all-round whites, the forward one higher, and on its own allows nothing else lit. Rule 30(b) lets one <b>under 50 m</b> show <b>one instead</b> — and, and this is the whole trap, <em>where it can best be seen</em>, which is nowhere in particular. A sternlight is one white light too.", "show": {"fondeada": "Two all-round whites, the forward one higher, and nothing else lit. At anchor — though not necessarily a big ship.", "navegando": "Not Rule 30. Something here belongs to a vessel under way.", "muda": "One white light. Rule 30(b) does not say where a small vessel carries her anchor light, so it can sit exactly where a sternlight sits. Two readings, and nothing to choose between them."}, "sitiosAsignados": true}};
