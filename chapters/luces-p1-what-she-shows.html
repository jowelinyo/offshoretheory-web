const TEXTOS = {"ESTADO": {"pregunta": "What do her lights tell you she is doing?", "clases": ["anclada", "andando", "parada", "muda"], "opciones": ["She is <b>at anchor</b>.", "She is <b>under way and making way</b> — moving through the water.", "She is <b>under way but not making way</b> — stopped in the water.", "She is <b>under way</b>, but her lights do not say whether she is moving."], "porque": {"anclada": "An all-round white, and not one other light on her. That is Rule 30 and it is the only thing it can be: her anchor is down.", "andando": "Her sidelights and her sternlight are burning, and those are the two lights that only come on when she moves through the water.", "parada": "She is telling you what she is, and showing neither sidelight nor sternlight. Anchor up, stopped in the water — which for this one is a thing worth knowing.", "muda": "Nothing on her changes when she stops. A power-driven vessel, a sailing vessel, a tug with a tow: they carry the same lights making way or lying dead in the water. The lights answer <em>under way</em> and go no further."}, "mal": {"anclada": "At anchor she would show an all-round white and nothing else — no sidelight, no sternlight, and none of the lights that say what she is.", "andando": "<em>Making way</em> has to be visible before you can claim it: sidelights, or a sternlight. And on some vessels they are lit whether she moves or not, so seeing them is not enough either.", "parada": "<em>Stopped in the water</em> is a claim that her sidelights and sternlight are OUT — and that they would have been ON if she were moving. Check both halves.", "muda": "Some vessels do carry the same lights stopped or moving. Not this one: what she is showing changes when she stops, so it answers."}, "pista": "Sidelights and a sternlight are the only lights in the book that mean <em>moving through the water</em>. Everything else she carries says what she IS, not what she is doing.", "show": {"anclada": "All-round white, alone. Rule 30: her anchor is down. She is not under way at all, so <em>making way</em> does not arise.", "andando": "The sidelights and the sternlight are the tell. Rules 24 to 28 give them to a vessel <em>when making way</em>, and take them away the moment she stops.", "parada": "She has her identity lights and neither sidelight nor sternlight. Under way — not anchored, not aground — and stopped in the water.", "muda": "Compare her with herself: put her lights out of gear and not one of them goes out. Under way is all they say, and it is all you may claim."}}, "ESLORA": {"pregunta": "How long is she?", "clases": ["pequena", "grande", "muda"], "opciones": ["<b>Less than 50 m.</b>", "<b>50 m or more.</b>", "<b>Her lights do not say.</b>"], "porque": {"pequena": "One white forward and no second one abaft it. Rule 23 gives a vessel of less than 50 m a single masthead light; the second is only carried at 50 m and over. At anchor the count is the same — one all-round white under 50 m, two at 50 m and over.", "grande": "Two whites, and only a vessel of 50 m or more may show them. <b>Which one is higher tells you which rule you are reading.</b> Under way it is Rule 23: the <b>after</b> one higher, and further aft. At anchor it is Rule 30, and it is <b>the other way round</b> — the <b>forward</b> one higher, and at least 4.5 m above the after one. Same count, mirrored.", "muda": "There is no masthead light in front of you to count. Either you are abaft her beam, where the mastheads have cut off and only the sternlight is left, or <b>she is under 12 m and Rule 23(d) has folded her masthead and her sternlight into one all-round white</b>, or she carries none at all. Either way her length is not on offer, and guessing it is how people decide a ship is small."}, "mal": {"pequena": "<em>Less than 50 m</em> is a claim about seeing ONE masthead light. Count again — and make sure what you are counting is a masthead light and not her sternlight.", "grande": "<em>50 m or more</em> is a claim about a <b>pair</b> of whites — her two mastheads under way, or her two anchor lights at anchor. If you cannot see two, you cannot make the claim.", "muda": "Her lights do say it here. Find the mastheads — or the all-round whites, if she is lying at anchor — and count them."}, "pista": "Rule 23 only ever offers two answers: one masthead light under 50 m, two at 50 m and over, the <b>after</b> one the higher. Rule 30 counts the same way at anchor and stacks them the other way up — the <b>forward</b> one higher. <b>Under 12 m she may carry no masthead light at all</b> — Rule 23(d) folds it and the sternlight into one all-round white, and then there is nothing to count. And if there is nothing to count there is no third answer: there is no answer.", "show": {"pequena": "One white forward, no second one behind it. Under 50 m. The count is the whole of it.", "grande": "Two whites. 50 m or more — Rule 23 if she is under way, Rule 30 if she is at anchor, and the one that is higher tells you which.", "muda": "Count the mastheads and there are none to count. Her length is not in what you can see, and the honest answer is to say so."}}, "ALCANCE": {"pregunta": "What is she carrying that you cannot see from here?", "clases": ["ninguna", "costados", "tope"], "opciones": ["<b>Nothing.</b> Every light she has is reaching you.", "<b>At least her sidelights</b> — and, depending on what she is, more.", "<b>Her masthead light.</b>"], "porque": {"ninguna": "You are inside the range of every light she is showing. What you see is all of it — which is worth knowing too, because it puts an upper bound on how far off she is.", "costados": "A sidelight is the shortest-ranged light in the book, so it is always the first to go. She is still carrying them; they are just not reaching you — and there may be more you cannot even guess at, because what else she carries depends on what she is, and that is part 2.", "tope": "—"}, "mal": {"ninguna": "«Nothing» is a claim about range, not about the picture. Check the shortest-ranged light she has and ask whether you are inside it.", "costados": "The sidelights are the first to go — but here they are still reaching you. Check the shortest range she has against the distance you were given.", "tope": "Never. Rule 22 gives the masthead light the <b>longest</b> range of the lot — 6 miles on a big ship against 3 for a sidelight. It is the last light you lose, not the first."}, "pista": "Rule 22 gives every light a range, and they are not the same: the masthead reaches furthest, the sidelights least. So a vessel does not vanish — she comes apart, from the bottom up.", "show": {"ninguna": "You are inside the range of the shortest light she has, so nothing is missing.", "costados": "Only the sidelights have dropped out. She is past their range and inside everything else.", "tope": "This never happens: the masthead light outreaches the rest."}, "senuelos": ["tope"]}, "FORMA": {"pregunta": "And by day, what would she be showing?", "clases": ["", "ball", "ball ball", "ball diamond ball", "cylinder", "coneUp cone"], "opciones": ["<b>Nothing at all.</b> No day shape.", "<b>A single black ball.</b>", "<b>Two black balls</b>, in a vertical line.", "<b>Ball — diamond — ball</b>, in a vertical line.", "<b>A cylinder.</b>", "<b>Two cones</b>, points together."], "porque": {"": "Some vessels say nothing by day at all. A power-driven vessel under way, a sailing vessel under sail alone, a pilot vessel: their lights say something and their daytime silhouette says nothing.", "ball": "One ball, in the fore part. Rule 30 by day is the same sentence as one all-round white by night.", "ball ball": "Two balls for two all-round reds. Rule 27(a) writes the same thing twice, once for the light and once for the dark.", "ball diamond ball": "Ball, diamond, ball — exactly the red, white, red of her lights, with the diamond standing where the white one goes. Rule 27(b).", "cylinder": "A cylinder, for the three all-round reds. Rule 28, and the only shape in the book that is neither ball nor cone.", "coneUp cone": "Two cones with their points together, for both kinds of fishing vessel. Rule 26 gives them the same shape by day and different lights by night — which is why this question runs from the night to the day and not the other way."}, "mal": {"": "She is showing you something at night that Rule 26, 27, 28 or 30 also writes as a shape. Read what is lit before you decide it says nothing.", "ball": "One ball is Rule 30 — at anchor, and nothing else lit.", "ball ball": "Two balls is <em>not under command</em>: two all-round reds, and only two.", "ball diamond ball": "That one is <em>restricted in her ability to manoeuvre</em>: red, white, red. Count the colours again.", "cylinder": "The cylinder belongs to a vessel constrained by her draught — three all-round reds, and the lights of a power-driven vessel underneath them.", "coneUp cone": "Two cones is a fishing vessel: an all-round green or red over an all-round white."}, "pista": "Every rule in this module writes the same sentence twice — once in lights and once in shapes. Read what the lights say first, then say it again in black.", "show": {"": "No shape. What she is showing at night has no daytime equivalent.", "ball": "A single ball. Rule 30, at anchor.", "ball ball": "Two balls. Rule 27(a), not under command.", "ball diamond ball": "Ball, diamond, ball. Rule 27(b), restricted in her ability to manoeuvre.", "cylinder": "A cylinder. Rule 28, constrained by her draught.", "coneUp cone": "Two cones, points together. Rule 26, fishing."}}, "FONDEO": {"pregunta": "Is she at anchor?", "clases": ["grande", "navegando", "muda"], "opciones": ["<b>At anchor, and 50 m or more.</b>", "<b>Not at anchor — she is under way.</b>", "<b>One white light and no more — it could be either.</b>"], "porque": {"grande": "Two all-round whites, the forward one higher and at least 4.5 m above the after one, and nothing else on her. Rule 30 asks that of a vessel of 50 m or more and of nobody else — two mastheads come with sidelights, and from astern they do not come at all.", "navegando": "That could not be an anchor light. Something coloured is lit, or there is more on her than Rule 30 allows — and Rule 30 allows nothing else at all.", "muda": "<b>One white light, and nothing else.</b> Rule 30(b) lets a vessel of under 50 m carry her anchor light <em>where it can best be seen</em> — so it can be anywhere, including low and right aft. And a sternlight is one white light, low and right aft. <b>Nothing in the picture separates them.</b> Saying so is the answer; guessing is how a ship at anchor becomes a ship going away from you."}, "mal": {"grande": "Two whites, the forward one higher, and nothing else lit. If you can see only one — or if anything else is burning — it is not that.", "navegando": "You can only rule out anchoring if what you see could not be anchor lights. One lone white light could be.", "muda": "Here the picture does settle it. Either there are two whites in the Rule 30 pair, or there is something on her that Rule 30 would never allow."}, "pista": "Rule 30 gives a vessel of 50 m or more <b>two</b> all-round whites, the forward one higher. Under 50 m it gives her <b>one</b> — and, and this is the whole trap, <em>where it can best be seen</em>, which is nowhere in particular. A sternlight is one white light too.", "show": {"grande": "Two all-round whites, the forward one higher, and nothing else. At anchor, 50 m or more.", "navegando": "Not Rule 30. Something here belongs to a vessel under way.", "muda": "One white light. Rule 30(b) does not say where a small vessel carries her anchor light, so it can sit exactly where a sternlight sits. Two readings, and nothing to choose between them."}}};
