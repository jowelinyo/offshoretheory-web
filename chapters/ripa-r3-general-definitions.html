<script>
"use strict";

const NS = "http://www.w3.org/2000/svg";
const D = {W: 1000, H: 620};
let svg = null, gO = null, ESC = 1;
const px = n => n / ESC;

function el(t, at, pa){
  const e = document.createElementNS(NS, t);
  for(const k in at) if(at[k] !== undefined && at[k] !== null) e.setAttribute(k, at[k]);
  (pa || gO || svg).appendChild(e);
  return e;
}
function txt(x, y, s, an, tam, col, peso, fam, pa){
  const e = el("text", {x: x, y: y, "text-anchor": an || "start",
    "pointer-events": "none", "font-size": px(tam || 13),
    fill: col || "var(--lam-ink)", "font-weight": peso || 400,
    "font-family": fam === "mono" ? "var(--f-mono)" : "var(--f-ui)"}, pa);
  e.textContent = s;
  return e;
}

function parte(s, ancho, tam){
  const porLinea = Math.max(6, Math.floor(ancho / (px(tam) * 0.62)));
  const pal = String(s).split(/\s+/);
  const out = [];
  let linea = "";
  pal.forEach(function(p){
    const q = linea ? linea + " " + p : p;
    if(q.length > porLinea && linea){ out.push(linea); linea = p; }
    else linea = q;
  });
  if(linea) out.push(linea);
  return out;
}

const DEF = [{"l": "a", "termino": "vessel", "partes": ["(a) The word vessel includes every description of water craft, including non-displacement craft, WIG craft and seaplanes, used or capable of being used as a means of transportation on water."], "caracteres": 190}, {"l": "b", "termino": "power-driven vessel", "partes": ["(b) The term power-driven vessel means any vessel propelled by machinery."], "caracteres": 73}, {"l": "c", "termino": "sailing vessel", "partes": ["(c) The term sailing vessel means any vessel under sail provided that propelling machinery, if fitted, is not being used."], "caracteres": 121}, {"l": "d", "termino": "vessel engaged in fishing", "partes": ["(d) The term vessel engaged in fishing means any vessel fishing with nets, lines, trawls or other fishing apparatus which restrict maneuverability, but does not include a vessel fishing with trolling lines or other fishing apparatus which do not restrict maneuverability."], "caracteres": 271}, {"l": "e", "termino": "seaplane", "partes": ["(e) The word seaplane includes any aircraft designed to maneuver on the water."], "caracteres": 78}, {"l": "f", "termino": "vessel not under command", "partes": ["(f) The term vessel not under command means a vessel which through some exceptional circumstance is unable to maneuver as required by these Rules and is therefore unable to keep out of the way of another vessel."], "caracteres": 211}, {"l": "g", "termino": "vessel restricted in her ability to maneuver", "partes": ["(g) The term vessel restricted in her ability to maneuver means a vessel which from the nature of her work is restricted in her ability to maneuver as required by these Rules and is therefore unable to keep out of the way of another vessel. The term vessels restricted in their ability to maneuver shall include but not be limited to:", "(i) a vessel engaged in laying, servicing or picking up a navigation mark, submarine cable or pipeline;", "(ii) a vessel engaged in dredging, surveying or underwater operations;", "(iii) a vessel engaged in replenishment or transferring persons, provisions or cargo while underway;", "(iv) a vessel engaged in the launching or recovery of aircraft;", "(v) a vessel engaged in mine clearance operations;", "(vi) a vessel engaged in a towing operation such as severely restricts the towing vessel and her tow in their ability to deviate from their course."], "caracteres": 873}, {"l": "h", "termino": "vessel constrained by her draft", "partes": ["(h) The term vessel constrained by her draft means a power-driven vessel which, because of her draft in relation to the available depth and width of navigable water is severely restricted in her ability to deviate from the course she is following."], "caracteres": 247}, {"l": "i", "termino": "underway", "partes": ["(i) The word underway means that a vessel is not at anchor, or made fast to the shore, or aground."], "caracteres": 98}, {"l": "j", "termino": "length and breadth", "partes": ["(j) The words length and breadth of a vessel mean her length overall and greatest breadth."], "caracteres": 90}, {"l": "k", "termino": "in sight of one another", "partes": ["(k) Vessels shall be deemed to be in sight of one another only when one can be observed visually from the other."], "caracteres": 112}, {"l": "l", "termino": "restricted visibility", "partes": ["(l) The term restricted visibility means any condition in which visibility is restricted by fog, mist, falling snow, heavy rainstorms, sandstorms or any other similar causes."], "caracteres": 174}, {"l": "m", "termino": "Wing-In-Ground (WIG) craft", "partes": ["(m) The term Wing-In-Ground (WIG) craft means a multimodal craft which, in its main operational mode, flies in close proximity to the surface by utilizing surface-effect action."], "caracteres": 177}];

const GRUPOS3 = [
  {col: 0, t: "What each vessel is",
   l: ["a", "b", "c", "d", "e", "f", "g", "h", "m"]},
  {col: 1, t: "The words that decide",
   l: ["i", "j", "k", "l"]}
];

function defDe(letra){
  return DEF.filter(function(d){ return d.l === letra; })[0];
}

const P3 = {
  h: "General definitions",
  arriba: "Rule 3",
  sel: null,

  lamina(){
    const M = px(30);
    const anchoCol = (D.W - M*2 - px(34)) / 2;
    const sangria = px(46);
    const anchoTxt = anchoCol - sangria;
    const cuerpo = 15.5, salto = px(20);
    const altoCab = px(54), aire = px(18);

    const RENG = {};
    DEF.forEach(function(d){
      RENG[d.l] = parte(d.termino, anchoTxt, cuerpo);
    });
    const altoDe = l => px(30) + RENG[l].length*salto;

    const altoCol = c => GRUPOS3.filter(g => g.col === c).reduce(
      (s, g) => s + altoCab + aire + g.l.reduce((q, l) => q + altoDe(l), 0), 0);
    const altoLista = Math.max(altoCol(0), altoCol(1));
    const y0 = Math.max(px(52), px(46) + (D.H - px(46) - altoLista)/2);

    txt(M, px(32), "WHAT THE WORDS MEAN", "start", 12.5,
        "var(--lam-dim)", 600, "mono");

    [0, 1].forEach(function(col){
      const x = M + col*(anchoCol + px(34));
      let y = y0;
      GRUPOS3.filter(function(g){ return g.col === col; }).forEach(function(g){

        txt(x, y + px(20), g.t.toUpperCase(), "start", 11.5,
            "var(--lam-dim)", 600, "mono");
        el("line", {x1: x, y1: y + px(30), x2: x + anchoCol, y2: y + px(30),
                    stroke: "var(--lam-linea)", "stroke-width": px(1), opacity: .6});
        y += altoCab;

        g.l.forEach(function(l){
          const d = defDe(l);
          const alto = altoDe(l);
          const on = P3.sel === l;
          const g2 = el("g", {"data-boton": "d:" + l});

          el("rect", {x: x - px(6), y: y, width: anchoCol + px(12), height: alto,
                      rx: px(2), class: "caza"}, g2);
          if(on){
            el("rect", {x: x - px(6), y: y, width: anchoCol + px(12), height: alto,
                        rx: px(2), fill: "var(--carta-somera)", opacity: .9}, g2);
            el("rect", {x: x - px(6), y: y, width: px(3), height: alto,
                        fill: "var(--accent-graphic)"}, g2);
          }

          txt(x + px(34), y + px(24), "(" + l + ")", "end",
              13.5, on ? "var(--ink-title)" : "var(--lam-dim)", 600, "mono", g2)
            .setAttribute("class", "num");
          RENG[l].forEach(function(t, i){
            txt(x + sangria, y + px(24) + i*salto, t, "start", cuerpo,
                on ? "var(--ink-title)" : "var(--lam-ink)", on ? 600 : 400, null, g2);
          });
          y += alto;
        });
        y += aire;
      });
    });

    if(P3.sel === null)
      txt(D.W/2, D.H - px(18), "pick a word", "middle", 12.5,
          "var(--lam-dim)", 400, "mono");
  },

  pulsa(clave){
    if(clave.indexOf("d:") !== 0) return;
    P3.sel = clave.slice(2);
    toca();
  },

  panel(){
    if(P3.sel === null){
      let h = "<h3>Rule 3</h3><h2>General definitions</h2>";
      h += "<p>Thirteen words, and the whole rulebook leans on them. Nine of them say "
         + "<b>what each vessel is</b> &mdash; and which vessel you are decides who "
         + "keeps out of whose way. The other four are the words that decide "
         + "<b>when</b> a rule bites.</p>";
      h += '<p class="pista">Pick any one and you get its definition, whole and '
         + "unabridged. The letters are the ones the rule itself uses.</p>";
      return h;
    }
    const d = defDe(P3.sel);
    let h = '<h3>Rule 3 <span class="inc">(' + d.l + ')</span></h3><h2>'
          + d.termino + "</h2>";

    d.partes.forEach(function(p, i){
      h += '<div class="ley-inciso' + (i ? " sub" : "") + '">' + p + "</div>";
    });
    h += '<p class="fuente">Navigation Rules &amp; Regulations Handbook &middot; '
       + "Rule 3 &middot; " + d.caracteres + " characters</p>";
    return h;
  }
};

function redibuja(){
  svg = document.getElementById("svg");
  const caja = document.getElementById("ficha").getBoundingClientRect();
  if(!caja.width || !caja.height) return;

  D.H = Math.max(420, Math.round(D.W * caja.height / caja.width));
  ESC = caja.width / D.W;
  svg.setAttribute("viewBox", "0 0 " + D.W + " " + D.H);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  gO = el("g", {}, svg);
  el("rect", {x: 0, y: 0, width: D.W, height: D.H, fill: "var(--lam-papel)"});
  P3.lamina();
  cableaLamina();
}

function cableaLamina(){
  svg.querySelectorAll("[data-boton]").forEach(function(g){
    g.addEventListener("click", function(){
      P3.pulsa(g.getAttribute("data-boton"));
    });
  });
}

function pintaPanel(){
  document.getElementById("pane").innerHTML = P3.panel();
  document.getElementById("barCont").textContent = "13 DEFINITIONS";
}

function toca(){ redibuja(); pintaPanel(); }

const PZ = [P3];
function vaPantalla(i){ toca(); }
const vaA = vaPantalla;

addEventListener("resize", redibuja);

if(typeof ResizeObserver !== "undefined")
  new ResizeObserver(redibuja).observe(document.getElementById("ficha"));
toca();
</script>
<script data-marco="1">

(function(){
"use strict";

const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

const MARCO = {id:"ripa", i:3, paginas:[{f:"ripa-r0-the-nineteen-rules.html",t:"The nineteen rules"},{f:"ripa-r1-application.html",t:"Rule 1 · Application"},{f:"ripa-r2-responsibility.html",t:"Rule 2 · Responsibility"},{f:"ripa-r3-general-definitions.html",t:"Rule 3 · General definitions"},{f:"ripa-r4-application.html",t:"Rule 4 · Application"},{f:"ripa-r5-look-out.html",t:"Rule 5 · Look-out"},{f:"ripa-r6-safe-speed.html",t:"Rule 6 · Safe speed"},{f:"ripa-r7-risk-of-collision.html",t:"Rule 7 · Risk of collision"},{f:"ripa-r8-action-to-avoid-collision.html",t:"Rule 8 · Action to avoid collision"},{f:"ripa-r9-narrow-channels.html",t:"Rule 9 · Narrow channels"},{f:"ripa-r10-traffic-separation-schemes.html",t:"Rule 10 · Traffic separation schemes"},{f:"ripa-r11-application.html",t:"Rule 11 · Application"},{f:"ripa-r12-sailing-vessels.html",t:"Rule 12 · Sailing vessels"},{f:"ripa-r13-overtaking.html",t:"Rule 13 · Overtaking"},{f:"ripa-r14-head-on-situation.html",t:"Rule 14 · Head-on situation"},{f:"ripa-r15-crossing-situation.html",t:"Rule 15 · Crossing situation"},{f:"ripa-r16-action-by-give-way-vessel.html",t:"Rule 16 · Action by give-way vessel"},{f:"ripa-r17-action-by-stand-on-vessel.html",t:"Rule 17 · Action by stand-on vessel"},{f:"ripa-r18-responsibilities-between-vessels.html",t:"Rule 18 · Responsibilities between vessels"},{f:"ripa-r19-restricted-visibility.html",t:"Rule 19 · Conduct of vessels in restricted visibility"}]};
const YO = MARCO.id;
const N = MARCO.paginas.length;
const dosCifras = n => (n < 10 ? "0" : "") + n;
const $ = id => document.getElementById(id);

const LLAVE_NAV = "ripa.nav";
function marcaNav(){ try{ sessionStorage.setItem(LLAVE_NAV, "1"); }catch(e){} }
function veniaDeDentro(){
  try{ return sessionStorage.getItem(LLAVE_NAV) === "1"; }catch(e){ return false; }
}

if(MARCO.i === 0 && !veniaDeDentro()){
  const p = vistoPos(YO, N - 1);
  if(p > 0){ marcaNav(); location.replace(MARCO.paginas[p].f); return; }
}
marcaNav();

vistoEmpieza(YO);
vistoPon(YO, MARCO.i);
if(MARCO.i === N - 1) vistoTermina(YO);

function vaA(i){
  if(i < 0 || i >= N || i === MARCO.i) return;
  marcaNav();
  vistoPon(YO, i);
  location.href = MARCO.paginas[i].f;
}

const CUENTA = dosCifras(MARCO.i + 1) + " / " + dosCifras(N);
function ponCuenta(){
  const b = $("barCont");
  if(b && b.textContent !== CUENTA) b.textContent = CUENTA;
}
ponCuenta();
if(typeof MutationObserver !== "undefined" && $("barCont"))
  new MutationObserver(ponCuenta).observe($("barCont"),
    {childList: true, characterData: true, subtree: true});

(function(){
  const pr = $("prog");
  if(!pr) return;
  pr.innerHTML = "";
  MARCO.paginas.forEach(function(q, i){
    const b = document.createElement("i");
    if(i === MARCO.i) b.className = "on"; else if(i < MARCO.i) b.className = "done";
    b.title = "Screen " + (i + 1) + " of " + N + " · " + q.t;

    b.setAttribute("data-va", i);
    b.onclick = function(){ vaA(i); };
    pr.appendChild(b);
  });
})();

const LLAVE_LOG = "ripa.log";
function leeLog(){
  try{ return parseInt(localStorage.getItem(LLAVE_LOG) || "0", 10) || 0; }
  catch(e){ return 0; }
}
function ponLog(n){ try{ localStorage.setItem(LLAVE_LOG, String(n)); }catch(e){} }
function pintaLog(){
  const f = $("fLog");
  if(!f) return;
  const n = leeLog();
  f.textContent = n + (n === 1 ? " answer logged" : " answers logged");
}
pintaLog();
document.addEventListener("click", function(e){
  const b = e.target.closest ? e.target.closest("[data-di]") : null;
  if(!b) return;
  if(b.getAttribute("data-di") === "otra") return;
  ponLog(leeLog() + 1);
  pintaLog();
}, true);

function hayPregunta(){
  return !!document.querySelector("#pane [data-di]:not([data-di=otra])");
}
function hayOtra(){ return !!document.querySelector("#pane [data-di=otra]"); }

function pintaNav(){
  const pie = $("navPie");
  if(!pie) return;
  const ultima = MARCO.i >= N - 1;
  let h = '<div class="nav">'
    + '<button class="sec" id="atras" data-va="' + (MARCO.i - 1) + '"'
    + (MARCO.i ? "" : " disabled") + ">Back</button>";
  if(hayPregunta())
    h += '<a class="skip" id="salta" data-va="' + (MARCO.i + 1) + '">Skip</a>';
  if(hayOtra()) h += '<button id="otra">Next one</button>';
  h += '<button id="sig" data-va="' + (MARCO.i + 1) + '"'
    + (ultima ? " disabled" : "") + ">"
    + (ultima ? "End of the module" : "Next") + "</button></div>";
  pie.innerHTML = h;
  const a = $("atras"); if(a) a.onclick = function(){ vaA(MARCO.i - 1); };
  const s = $("sig");   if(s) s.onclick = function(){ vaA(MARCO.i + 1); };
  const k = $("salta"); if(k) k.onclick = function(){ vaA(MARCO.i + 1); };
  const o = $("otra");
  if(o) o.onclick = function(){
    const b = document.querySelector("#pane [data-di=otra]");
    if(b) b.click();
  };
}
pintaNav();
if(typeof MutationObserver !== "undefined" && $("pane"))
  new MutationObserver(pintaNav).observe($("pane"), {childList: true, subtree: true});

(function(){
  const d = $("deCero");
  if(!d) return;
  d.onclick = function(){
    vistoOlvida(YO);
    marcaNav();
    location.href = MARCO.paginas[0].f;
  };
})();

(function(){
  const t = $("tSig"), pane = $("pane");
  if(!t || !pane || !t.innerHTML.trim()) return;
  if(document.querySelector(".ot-cierre")) return;
  pane.insertAdjacentHTML("afterend", t.innerHTML);
})();
})();
</script>
