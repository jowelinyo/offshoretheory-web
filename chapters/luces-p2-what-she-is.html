function pintaFicha(q, s, anchoUn, franja){
 const X = (franja || 0) * D.W;
 const P = {x0:X, y0:0, x1:X + D.W, y1:D.H, cx:X + D.W/2, cy:D.H*0.74};

 const aire = q.aire || 0;
 if(q.dia){
  const an = anchoUn || (D.W - 67);
  casco({x0: P.cx - an/2, y0: P.y0, x1: P.cx + an/2, y1: P.y1,
         cx: P.cx, cy: P.cy, aire: aire},
        q.v, false, marcasDia(q.v));
  return;
 }

 if(q.soloRemolcado){
  const todas = configuration(q.v);
  const ve = (q.g === undefined || q.g === null) ? todas
                                                 : todas.filter(l => visible(l, q.g));
  pintaNaveDe(P, q.v, ve.filter(l => l.tow), todas,
    {soloRemolcado: true, casco: "gabarra", ancho: q.neutro ? ANCHO_PRACTICA : (anchoUn || (D.W - 67))});
  return;
 }
 pintaNave(P, q.v, q.g, {pasos: q.pasos, nm: q.nm, tapaBabor: q.tapaBabor, aire: q.aire || 0,
                         neutro: q.neutro, soloRemolcador: q.soloRemolcador,
                         ancho: q.neutro ? ANCHO_PRACTICA : (anchoUn || (D.W - 67))});
}

"use strict";
const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

"use strict";

const ARC = {
  masthead: 112.5,
  sidelight:112.5,
  stern:    112.5,
  allRound: 180
};

const CUTOFF = 1.5;

const visible = (arc, aspect) => {
  const a = Math.abs(aspect);
  switch(arc.kind){
    case "masthead": return a <= ARC.masthead;
    case "starboard":return aspect >= -CUTOFF && aspect <= ARC.sidelight;
    case "port":     return aspect <=  CUTOFF && aspect >= -ARC.sidelight;

    case "stern":    return a > ARC.stern;
    case "allround": return true;
  }
  return false;
};

const HGT = {

  mast1: L => Math.max(1.6, 0.62 * Math.pow(L, 0.72)),
  mast2: L => HGT.mast1(L) + Math.max(4.5, HGT.mast1(L)*0.22),
  side:  L => L >= 20 ? HGT.mast1(L)*0.72 : Math.max(0.9, HGT.mast1(L)*0.55),
  stern: L => L >= 20 ? HGT.mast1(L)*0.42 : Math.max(0.7, HGT.mast1(L)*0.40),
  allr:  L => Math.max(2.2, HGT.mast1(L)*0.90),
  mast:  L => Math.max(1.6, 0.62 * Math.pow(L, 0.72))
};

function ranges(L){
  if (L >= 50) return {masthead:6, side:3, stern:3, allround:3, towing:3};
  if (L >= 20) return {masthead:5, side:2, stern:2, allround:2, towing:2};
  if (L >= 12) return {masthead:3, side:2, stern:2, allround:2, towing:2};
  return          {masthead:2, side:1, stern:2, allround:2, towing:2};
}

const L = (kind, colour, h, x, rangeKey, extra={}) =>
  ({kind, colour, h, x, rangeKey, ...extra});

function configuration(v){
  const LEN = v.length || 12;
  const L50 = LEN >= 50;

  const DOS_TOPES = L50 || v.segundoTope === true;
  const making = v.makingWay !== false;
  const under  = v.underway  !== false;

  const sideX  = L50 ? -0.30 : 0.80;
  const side   = [L("starboard","green",HGT.side(LEN), sideX,"side"),
                  L("port",     "red",  HGT.side(LEN), sideX,"side")];
  const stern  = [L("stern","white",HGT.stern(LEN),-0.96,"stern")];
  const mast1  = [L("masthead","white",HGT.mast1(LEN), 0.55,"masthead")];
  const mast2  = DOS_TOPES ? [L("masthead","white",HGT.mast2(LEN),-0.40,"masthead")] : [];

  const DOS_FONDEO = L50 || v.dosFondeo === true;
  const fondeo = () => DOS_FONDEO
      ? [L("allround","white",HGT.allr(LEN)*0.9, 0.88,"allround"),
         L("allround","white",HGT.stern(LEN)*1.4,-0.88,"allround")]
      : [L("allround","white",HGT.allr(LEN), 0.0,"allround")];

  if (!under && v.type !== "fishingTrawl" && v.type !== "fishingOther"
             && v.type !== "ram" && v.type !== "pilot" && v.type !== "varada") {
    return fondeo();
  }

  switch(v.type){
    case "power": case "pilotUnderway":

      if(LEN < 12 && v.combined !== false)
        return [L("allround","white",Math.max(2.2,LEN*0.22),0.10,"allround"), ...side];
      return [...mast1, ...mast2, ...side, ...stern];

    case "sailing":

      const mastTop = LEN*1.30;
      return v.tricolour && LEN < 20
        ? [L("starboard","green",mastTop,0.05,"side"), L("port","red",mastTop,0.05,"side"),
           L("stern","white",mastTop,0.05,"stern")]
        : [L("starboard","green",HGT.side(LEN),0.86,"side"),
           L("port","red",      HGT.side(LEN),0.86,"side"), ...stern,
           ...(v.optionalRedGreen ? [L("allround","red",  mastTop,0.05,"allround"),
                                     L("allround","green",mastTop*0.94,0.05,"allround")] : [])];

    case "fishingTrawl":
      return [L("allround","green",HGT.allr(LEN)*1.25,0.28,"allround"),
              L("allround","white",HGT.allr(LEN)*0.95,0.28,"allround"),
              ...(DOS_TOPES?[L("masthead","white",HGT.mast2(LEN),-0.40,"masthead")]:[]),
              ...(under && making?[...side,...stern]:[])];

    case "fishingOther":
      return [L("allround","red",HGT.allr(LEN)*1.25,0.28,"allround"),
              L("allround","white",HGT.allr(LEN)*0.95,0.28,"allround"),
              ...(under && making?[...side,...stern]:[])];

    case "nuc":
      return [L("allround","red",HGT.allr(LEN)*1.25,0.20,"allround"),
              L("allround","red",HGT.allr(LEN)*0.95,0.20,"allround"),
              ...(making?[...side,...stern]:[])];

    case "varada":
      return LEN < 12 ? fondeo()
        : [...fondeo(),
           L("allround","red",HGT.allr(LEN)*1.25,0.20,"allround"),
           L("allround","red",HGT.allr(LEN)*0.95,0.20,"allround")];

    case "ram":

      if (v.buceo)
        return [L("allround","red",  HGT.allr(LEN)*1.45,0.20,"allround"),
                L("allround","white",HGT.allr(LEN)*1.20,0.20,"allround"),
                L("allround","red",  HGT.allr(LEN)*0.95,0.20,"allround")];

      if (v.obstruccion) {
        const obs = v.obstruccion === "port" ? "port" : "starboard";
        const libre = obs === "port" ? "starboard" : "port";
        const par = (c, b) => [L("allround",c,HGT.allr(LEN)*0.70,0.20,"allround",{banda:b}),
                               L("allround",c,HGT.allr(LEN)*0.55,0.20,"allround",{banda:b})];
        return [L("allround","red",  HGT.allr(LEN)*1.45,0.20,"allround"),
                L("allround","white",HGT.allr(LEN)*1.20,0.20,"allround"),
                L("allround","red",  HGT.allr(LEN)*0.95,0.20,"allround"),
                ...par("red", obs), ...par("green", libre),
                ...(under && making ? [...mast1,...mast2,...side,...stern] : [])];
      }
      return [L("allround","red",  HGT.allr(LEN)*1.45,0.20,"allround"),
              L("allround","white",HGT.allr(LEN)*1.20,0.20,"allround"),
              L("allround","red",  HGT.allr(LEN)*0.95,0.20,"allround"),
              ...(!under ? fondeo() : making?[...mast1,...mast2,...side,...stern]:[])];

    case "cbd":
      return [...mast1, ...mast2, ...side, ...stern,

              L("allround","red",HGT.allr(LEN)*1.35,0.14,"allround"),
              L("allround","red",HGT.allr(LEN)*1.15,0.14,"allround"),
              L("allround","red",HGT.allr(LEN)*0.95,0.14,"allround")];

    case "pilot":

      return [L("allround","white",HGT.allr(LEN)*1.25,0.20,"allround"),
              L("allround","red",  HGT.allr(LEN)*0.95,0.20,"allround"),
              ...(under ? [...side, ...stern] : fondeo())];

    case "towing": {
      const TL   = v.towLength || 120;

      const long = TL + (v.towedLength || 0) > 200;
      const stack = [];
      const step = Math.max(2, LEN*0.055);
      for (let i=0;i<(long?3:2);i++)
        stack.push(L("masthead","white",HGT.mast1(LEN)+i*step,0.55,"masthead"));
      const tug = [...stack, ...(DOS_TOPES?[L("masthead","white",HGT.mast2(LEN)+step*2,-0.40,"masthead")]:[]),
                   ...side, ...stern,
                   L("stern","yellow",HGT.stern(LEN)*1.5,-0.96,"towing")];

      const back = -(TL + LEN*0.5);
      const towed = [
        L("starboard","green",2.0,0,"side",  {xm:back, tow:true}),
        L("port",     "red",  2.0,0,"side",  {xm:back, tow:true}),
        L("stern",    "white",1.6,0,"stern", {xm:back - 20, tow:true})
      ];
      return [...tug, ...towed];
    }
  }
  return [...side, ...stern];
}

function seenFrom(v, aspect, rangeNm){
  const R = ranges(v.length || 12);
  return configuration(v)
    .filter(l => visible(l, aspect))
    .filter(l => rangeNm === undefined || rangeNm <= R[l.rangeKey])
    .map(l => ({...l, nominal:R[l.rangeKey]}));
}

const A1 = {

  TOPE_SOBRE_CASCO_MIN: 6,
  TOPE_NUNCA_HACE_FALTA_MAS: 12,

  TOPE2_SOBRE_TOPE1: 4.5,

  TOPES_SEP_FRAC_ESLORA: 0.5,
  TOPES_SEP_NUNCA_MAS: 100,
  TOPE1_DESDE_LA_RODA_FRAC: 0.25,

  TOPE_CHICO_SOBRE_BORDA: 2.5,

  COSTADOS_FRAC_TOPE: 0.75,

  VERT_SEP_GRANDE: 2, VERT_BAJA_GRANDE: 4,
  VERT_SEP_CHICO: 1,  VERT_BAJA_CHICO: 2,

  ANCLA_PROA_SOBRE_POPA: 4.5,
  ANCLA_PROA_MIN_50: 6,

  PESCA_SOBRE_COSTADOS_VECES: 2,

  CUBIERTAS_ILUMINADAS_DESDE: 100,

  GRANDE: 20,
  MUY_GRANDE: 50
};

const ESLORA_POR_MANGA = 6.5;
const manga = L => L / ESLORA_POR_MANGA;

function alturaTope(L) {
  if (L < A1.GRANDE) return A1.TOPE_CHICO_SOBRE_BORDA;
  return Math.min(Math.max(A1.TOPE_SOBRE_CASCO_MIN, manga(L)),
                  A1.TOPE_NUNCA_HACE_FALTA_MAS);
}

const COSTADOS_TECHO_COMUN = A1.COSTADOS_FRAC_TOPE * A1.TOPE_SOBRE_CASCO_MIN;
function alturaCostados(L) {
  return Math.min(COSTADOS_TECHO_COMUN, A1.COSTADOS_FRAC_TOPE * alturaTope(L));
}
const vertical = L => L >= A1.GRANDE
  ? { sep: A1.VERT_SEP_GRANDE, baja: A1.VERT_BAJA_GRANDE }
  : { sep: A1.VERT_SEP_CHICO,  baja: A1.VERT_BAJA_CHICO };

const xTope1 = L => L / 2 - L * A1.TOPE1_DESDE_LA_RODA_FRAC;
const xTope2 = L => xTope1(L) - Math.min(L * A1.TOPES_SEP_FRAC_ESLORA,
                                         A1.TOPES_SEP_NUNCA_MAS);
const xPopa  = L => -L / 2;
const X_MEDIO = 0;

const SM_CRUJIA = 0;
function athwart(v, kind, L, l) {
  if (kind === "starboard") return  manga(L) / 2;
  if (kind === "port")      return -manga(L) / 2;

  if (l && l.banda === "starboard") return  manga(L) / 2;
  if (l && l.banda === "port")      return -manga(L) / 2;
  return SM_CRUJIA;
}
const CITA_ATHWART = {
  starboard: "R21(b) \u00b7 en la banda de estribor",
  port:      "R21(b) \u00b7 en la banda de babor"
};

const ALCANCE_SOBRE_CASCO = 0;

const TOW_LARGO_DIAMANTE = 200;
const towLargo   = v => v.towLength   || 120;
const towEslora  = v => v.towedLength || 60;

const towAtras   = v => towLargo(v) + (v.length || 12)/2 + towEslora(v)/2;

const towRemolque = v => towLargo(v) + towEslora(v);

const tramoDe = v => (v.length || 12);
const tramoRemolque = v => (v.length || 12)/2 + towAtras(v) + towEslora(v)/2;

const CITA = {
  power:        { r: "R23",    ident: [] },
  sailing:      { r: "R25",    ident: [] },
  nuc:          { r: "R27(a)", ident: ["red", "red"] },
  ram:          { r: "R27(b)", ident: ["red", "white", "red"] },
  cbd:          { r: "R28",    ident: ["red", "red", "red"] },
  pilot:        { r: "R29",    ident: ["white", "red"] },
  fishingTrawl: { r: "R26(b)", ident: ["green", "white"] },
  fishingOther: { r: "R26(c)", ident: ["red", "white"] },
  towing:       { r: "R24",    ident: [] },
  fondeada:     { r: "R30",    ident: ["white"] },

  varada:       { r: "R30(d)", ident: ["red", "red"] }
};

const SOLO_CON_ARRANCADA = ["nuc", "ram", "fishingTrawl", "fishingOther"];

const MARCAS_DIA = {
  power:        [],
  sailing:      [],
  velaYMotor:   ["coneUp"],
  nuc:          ["ball", "ball"],
  ram:          ["ball", "diamond", "ball"],
  cbd:          ["cylinder"],
  pilot:        [],
  fishingTrawl: ["coneUp", "cone"],
  fishingOther: ["coneUp", "cone"],
  towing:       [],

  fondeada:     ["ball"],
  varada:       ["ball", "ball", "ball"]
};

const NO_ES_TIPO = ["velaYMotor"];

function marcasLaterales(v) {
  if (!(v && v.type === "ram" && v.obstruccion)) return null;
  const obs = v.obstruccion === "port" ? "port" : "starboard";
  const out = {};
  out[obs] = ["ball", "ball"];
  out[obs === "port" ? "starboard" : "port"] = ["diamond", "diamond"];
  return out;
}
function marcasDia(v) {

  if (v.type === "ram" && v.obstruccion) return (MARCAS_DIA.ram || []).slice();

  if (v.type === "varada") return (v.length || 12) < 12 ? [] : MARCAS_DIA.varada.slice();
  if (v.type === "ram" && v.buceo) return ["flagA"];

  if (v.underway === false && (v.type === "fishingTrawl" || v.type === "fishingOther"))
    return (MARCAS_DIA[v.type] || []).slice();
  if (v.underway === false && v.type === "ram")
    return (MARCAS_DIA.ram || []).concat(MARCAS_DIA.fondeada || []);
  const clave = v.underway === false ? "fondeada"
              : (v.velaYMotor ? "velaYMotor" : v.type);

  if (clave === "towing")
    return towRemolque(v) > TOW_LARGO_DIAMANTE ? ["diamond"] : [];
  return (MARCAS_DIA[clave] || []).slice();
}

function citada(v, luces) {
  const L = v.length || 12;
  const fondeada = v.underway === false;
  const clave = v.type === "varada" ? "varada" : (fondeada ? "fondeada" : v.type);
  const C = CITA[clave];
  if (!C) return "el tipo «" + v.type + "» no esta citado a ninguna regla";

  if (clave === "towing") {
    const suyas = luces.filter(l => !l.tow), suyo = luces.filter(l => l.tow);
    const topes = suyas.filter(l => l.kind === "masthead").length;
    const pide = ((towRemolque(v) > TOW_LARGO_DIAMANTE) ? 3 : 2)
               + (L >= A1.MUY_GRANDE ? 1 : 0);
    if (topes !== pide)
      return "R24(a)(i) da " + pide + " tope(s) a un remolcador de " + L + " m con un "
        + "remolque de " + towRemolque(v) + " m —" + towLargo(v) + " de cable y "
        + towEslora(v) + " de remolcado—, y hay " + topes;
    if (suyas.filter(l => l.kind === "starboard").length !== 1
     || suyas.filter(l => l.kind === "port").length !== 1)
      return "R24 pide los dos costados del remolcador, y uno de cada";
    if (suyas.filter(l => l.kind === "stern" && l.colour === "white").length !== 1)
      return "R24(a)(iii) pide la luz de alcance del remolcador";
    if (suyas.filter(l => l.kind === "stern" && l.colour === "yellow").length !== 1)
      return "R24(a)(iv) pide la AMARILLA de remolque, sobre la de alcance";
    if (suyas.some(l => l.kind === "allround"))
      return "R24 no le da al remolcador ninguna luz de todo horizonte";
    if (suyo.filter(l => l.kind === "starboard").length !== 1
     || suyo.filter(l => l.kind === "port").length !== 1
     || suyo.filter(l => l.kind === "stern").length !== 1)
      return "R24(e) pide del remolcado sus dos costados y su luz de alcance, y nada mas";
    if (suyo.some(l => l.kind === "masthead" || l.kind === "allround"))
      return "R24(e) no le da al remolcado ni tope ni luz de todo horizonte";
    return null;
  }

  const todoH = luces.filter(l => l.kind === "allround")
                     .sort((a, b) => b.h - a.h).map(l => l.colour);
  const topes  = luces.filter(l => l.kind === "masthead").length;
  const lados  = luces.filter(l => l.kind === "starboard" || l.kind === "port").length;
  const alcance = luces.filter(l => l.kind === "stern" && l.colour === "white").length;
  const otros  = luces.filter(l => ["allround", "masthead", "starboard", "port",
                                    "stern"].indexOf(l.kind) < 0);
  if (otros.length) return "lleva " + otros.length + " luz(ces) de una clase que esta "
    + "tabla no conoce: " + otros.map(l => l.kind).join(" ");

  for (const k of ["starboard", "port"]) {
    const n = luces.filter(l => l.kind === k).length;
    if (n > 1) return "lleva " + n + " luces de " + k + ", y un buque tiene una";
  }

  if (fondeada && (v.type === "fishingTrawl" || v.type === "fishingOther")) {
    const par = v.type === "fishingTrawl" ? "green" : "red";
    if (todoH.length !== 2 || todoH.filter(c => c === par).length !== 1
        || todoH.filter(c => c === "white").length !== 1)
      return "R26(a) · pesquero fondeado: solo su par de todo horizonte, y lleva " + todoH.join("/");
    if (lados || alcance) return "R26(a) · pesquero fondeado con costados o alcance";
    if (topes > (v.type === "fishingTrawl" ? 1 : 0)) return "R26 · topes de mas en un pesquero fondeado";
    return null;
  }

  if (clave === "varada") {
    const rojas = todoH.filter(c => c === "red").length;
    const blancas = todoH.filter(c => c === "white").length;
    const admitidas = L >= A1.MUY_GRANDE ? [2] : [1, 2];
    if (rojas !== (L < 12 ? 0 : 2) || admitidas.indexOf(blancas) < 0
        || todoH.length !== rojas + blancas)
      return "R30(d) · varada: las de fondeo y dos rojas, y lleva " + todoH.join("/");
    if (topes || lados || alcance) return "R30(d) · varada y con luces de navegacion";
    return null;
  }

  if (v.type === "ram" && v.obstruccion) {
    const obs = v.obstruccion === "port" ? "port" : "starboard";
    const libre = obs === "port" ? "starboard" : "port";
    const pares = luces.filter(l => l.banda);
    if (pares.length !== 4
        || pares.filter(l => l.colour === "red" && l.banda === obs).length !== 2
        || pares.filter(l => l.colour === "green" && l.banda === libre).length !== 2)
      return "R27(d)(i) y (ii) · dos rojas a la banda obstruida y dos verdes a la libre";
    const ident = luces.filter(l => l.kind === "allround" && !l.banda)
                       .sort((a, b) => b.h - a.h).map(l => l.colour).join(" ");
    if (ident !== "red white red")
      return "R27(d) · lo del R27(b)(i), roja-blanca-roja, y lleva " + ident;
    const debe = !fondeada && v.makingWay !== false;
    if (!debe && (topes || lados || alcance))
      return fondeada ? "R27(d)(iii) · fondeada, estas y no las de fondeo"
                      : "R27(b)(iii) · sin arrancada no lleva luces de navegacion";
    if (debe) {
      const tocan = L >= A1.MUY_GRANDE ? [2] : [1, 2];
      if (tocan.indexOf(topes) < 0 || lados !== 2 || alcance !== 1)
        return "R27(b)(iii) · con arrancada, topes, costados y alcance";
    }
    return null;
  }

  if (clave === "ram" && v.buceo) {
    if (todoH.join(" ") !== "red white red")
      return "R27(e)(i) · roja, blanca, roja, y lleva " + todoH.join("/");
    if (topes || lados || alcance) return "R27(e) · el buceador no lleva mas que eso";
    return null;
  }
  if (fondeada && (v.type === "ram" || v.type === "pilot")) {
    const rojas = todoH.filter(c => c === "red").length;
    const blancas = todoH.filter(c => c === "white").length;
    const propias = v.type === "ram" ? {rojas: 2, blancas: 1} : {rojas: 1, blancas: 1};
    const admitidas = L >= A1.MUY_GRANDE ? [2] : [1, 2];
    if (rojas !== propias.rojas || admitidas.indexOf(blancas - propias.blancas) < 0
        || todoH.length !== rojas + blancas)
      return (v.type === "ram" ? "R27(b)(iv)" : "R29(a)(iii)")
        + " · fondeado: las suyas Y las de la R30, y lleva " + todoH.join("/");
    if (topes || lados || alcance) return "fondeada y con luces de navegacion encendidas";
    return null;
  }
  if (fondeada) {

    const admitidas = L >= A1.MUY_GRANDE ? [2] : [1, 2];
    if (admitidas.indexOf(todoH.length) < 0)
      return "R30 pide " + admitidas.join(" o ") + " blanca(s) de fondeo para "
        + L + " m y hay " + todoH.length;
    if (todoH.some(c => c !== "white")) return "una luz de fondeo que no es blanca";
    if (topes || lados || alcance) return "fondeada y con luces de navegacion encendidas";
    return null;
  }

  const chicaCombinada = clave === "power" && L < 12
    && todoH.length === 1 && todoH[0] === "white" && !topes && !alcance;
  if (!chicaCombinada && todoH.join(" ") !== C.ident.join(" "))
    return C.r + " manda de identidad [" + (C.ident.join(" ") || "ninguna")
      + "] y hay [" + (todoH.join(" ") || "ninguna") + "]";

  let topesQueTocan;
  if (clave === "power")        topesQueTocan = L < 12 ? (chicaCombinada ? 0 : 1)
                                              : (L >= A1.MUY_GRANDE ? 2 : 1);
  else if (clave === "cbd")     topesQueTocan = L >= A1.MUY_GRANDE ? 2 : 1;
  else if (clave === "ram")     topesQueTocan = v.makingWay === false ? 0
                                              : (L >= A1.MUY_GRANDE ? 2 : 1);
  else if (clave === "fishingTrawl") topesQueTocan = L >= A1.MUY_GRANDE ? 1 : 0;
  else                          topesQueTocan = 0;

  const OPCIONAL = ["power", "cbd", "ram", "fishingTrawl"];
  const puedeElSegundo = OPCIONAL.indexOf(clave) >= 0 && L < A1.MUY_GRANDE
    && !chicaCombinada && topesQueTocan >= (clave === "fishingTrawl" ? 0 : 1);
  const admitidos = puedeElSegundo ? [topesQueTocan, topesQueTocan + 1]
                                   : [topesQueTocan];
  if (admitidos.indexOf(topes) < 0)
    return C.r + " da " + admitidos.join(" o ") + " tope(s) a un buque de "
      + L + " m y hay " + topes;

  if (SOLO_CON_ARRANCADA.indexOf(clave) >= 0) {
    const debe = v.makingWay !== false;
    if (debe && (lados !== 2 || alcance !== 1))
      return C.r + " con arrancada pide los dos costados y la de alcance";
    if (!debe && (lados || alcance))
      return C.r + " sin arrancada no lleva costados ni luz de alcance";
  } else if (!chicaCombinada && (lados !== 2 || alcance !== 1)) {
    return C.r + " pide los dos costados y la de alcance";
  } else if (chicaCombinada && lados !== 2) {
    return "R23(d) pide los dos costados";
  }
  return null;
}

const P = (m, xm, cita, libre, sarta) => ({
  m: m, xm: xm, cita: cita,
  mLibre:  !!(libre && libre.indexOf("m") >= 0),
  xmLibre: !!(libre && libre.indexOf("x") >= 0),
  sarta: sarta || null
});

function coloca(v, luces, completas) {
  const mal = citada(v, completas || luces);
  if (mal) throw new Error("configuracion no citada: " + mal
    + "  (" + v.type + " " + (v.length || 12) + " m)");

  const todas = completas || luces;
  const L = v.length || 12, VE = vertical(L);
  const fondeada = v.underway === false;

  if (!fondeada && v.type === "towing") {
    const out = todas.map(() => null);
    const suyas = todas.filter(l => !l.tow), suyo = todas.filter(l => l.tow);
    const pon = (l, q) => { out[todas.indexOf(l)] = q; };

    const topes = suyas.filter(l => l.kind === "masthead")
      .sort((a, b) => a.h - b.h);

    const sarta = topes.filter(l => l.x > 0), atras = topes.filter(l => l.x <= 0);
    sarta.forEach((l, k) => pon(l, P(alturaTope(L) + k * VE.sep, xTope1(L),
      "R24(a)(i) \u00b7 en linea vertical + A1 2(a) y 2(i)", null, "topes24")));
    const cima = alturaTope(L) + (sarta.length - 1) * VE.sep;
    atras.forEach(l => pon(l, P(cima + A1.TOPE2_SOBRE_TOPE1, xTope2(L),
      "A1 2(a)(ii) + 3(a)")));
    suyas.forEach(l => {
      if (out[todas.indexOf(l)]) return;
      if (l.kind === "starboard" || l.kind === "port")
        pon(l, P(alturaCostados(L), xTope1(L), "A1 2(g) + 3(b)"));
      else if (l.kind === "stern" && l.colour === "white")
        pon(l, P(ALCANCE_SOBRE_CASCO, xPopa(L),
                 "R21 \u00b7 el sitio; la altura no la da el Anexo I", "m", "popa24"));
      else if (l.kind === "stern" && l.colour === "yellow")

        pon(l, P(ALCANCE_SOBRE_CASCO + VE.sep, xPopa(L),
                 "R24(a)(iv) \u00b7 sobre la de alcance + A1 2(i)", "m", "popa24"));
    });

    const Lr = towEslora(v), atrasM = towAtras(v), VR = vertical(Lr);
    suyo.forEach(l => {
      if (l.kind === "starboard" || l.kind === "port")
        pon(l, P(alturaCostados(Lr), -atrasM + xTope1(Lr),
                 "R24(e)(i) + A1 2(g) y 3(b)"));
      else if (l.kind === "stern")
        pon(l, P(ALCANCE_SOBRE_CASCO, -atrasM + xPopa(Lr),
                 "R24(e)(i) \u00b7 el sitio; la altura no la da el Anexo I", "m"));
    });

    todas.forEach((l, i) => { if (!out[i]) return;
      out[i].sm = athwart(v, l.kind, l.tow ? towEslora(v) : L);
      out[i].citaSm = CITA_ATHWART[l.kind] || "R21 \u00b7 en la crujia"; });
    const sinSitio = out.findIndex(o => !o);
    if (sinSitio >= 0) throw new Error("el R24 no le da sitio a "
      + todas[sinSitio].kind + "/" + todas[sinSitio].colour);
    return luces.map(l => out[todas.indexOf(l)]);
  }

  const luces_ = todas;
  const out = luces_.map(() => null);

  const idx = luces_.map((l, i) => i).filter(i => luces_[i].kind === "allround"
                                                && !luces_[i].banda)
    .sort((a, b) => luces_[b].h - luces_[a].h);
  let cimaTodoH = null;
  const obstr = v.type === "ram" && !!v.obstruccion;

  const pescaFondeada = fondeada
    && (v.type === "fishingTrawl" || v.type === "fishingOther");
  let idxA = idx, idxP = [];

  if (v.type === "varada") {
    idxP = idx.filter(i => luces_[i].colour === "red");
    idxA = idx.filter(i => idxP.indexOf(i) < 0);
  }
  if (!obstr && fondeada && (v.type === "ram" || v.type === "pilot")) {
    const blancas = idx.filter(i => luces_[i].colour === "white");
    idxP = idx.filter(i => luces_[i].colour !== "white").concat(blancas.slice(0, 1))
      .sort((a, b) => luces_[b].h - luces_[a].h);
    idxA = idx.filter(i => idxP.indexOf(i) < 0);
  }

  if (obstr) {
    for (let k = 0; k < idx.length; k++)
      out[idx[idx.length - 1 - k]] = P(VE.baja + (k + 1) * VE.sep, X_MEDIO,
        "R27(d) + A1 2(i) y 4(b) · la altura; el sitio es libre", "x", "2f");
    cimaTodoH = VE.baja + idx.length * VE.sep;
    for (const b of ["port", "starboard"]) {
      const par = luces_.map((l, i) => i).filter(i => luces_[i].banda === b)
        .sort((a, c) => luces_[c].h - luces_[a].h);
      par.forEach((i, k) => out[i] = P(VE.baja + (1 - k) * VE.sep, X_MEDIO,
        (luces_[i].colour === "red" ? "R27(d)(i)" : "R27(d)(ii)")
        + " + A1 4(b) · a la banda; el sitio es libre", "x", "4b-" + b));
    }
  } else if (fondeada && !pescaFondeada) {
    if (idxA.length === 2) {

      out[idxA[0]] = P(A1.ANCLA_PROA_MIN_50, xTope1(L), "A1 2(k) + R30(a)(i)");
      out[idxA[1]] = P(A1.ANCLA_PROA_MIN_50 - A1.ANCLA_PROA_SOBRE_POPA, xPopa(L),
                      "A1 2(k) + R30(a)(ii)");
    } else {

      out[idxA[0]] = P(VE.baja, xTope1(L), "R30(b) · donde mejor pueda ser vista",
                      "mx");
    }
  } else if (v.type === "fishingTrawl" || v.type === "fishingOther") {

    const baja = Math.max(VE.baja,
      alturaCostados(L) + A1.PESCA_SOBRE_COSTADOS_VECES * VE.sep);
    out[idx[1]] = P(baja,          X_MEDIO, "A1 2(j)", "x", "2f");
    out[idx[0]] = P(baja + VE.sep, X_MEDIO, "A1 2(j) + 2(i)", "x", "2f");
    cimaTodoH = baja + VE.sep;
  } else if (v.type === "pilot") {

    const alta = Math.max(alturaTope(L), VE.baja + VE.sep);
    out[idx[0]] = P(alta,          X_MEDIO, "R29 · en el tope o cerca", "mx", "2f");
    out[idx[1]] = P(alta - VE.sep, X_MEDIO, "R29 + A1 2(i)", "x", "2f");
    cimaTodoH = alta;
  } else if (idx.length === 1 && v.type === "power") {

    out[idx[0]] = P(A1.TOPE_CHICO_SOBRE_BORDA, X_MEDIO,
                    "R23(d) · donde mejor pueda ser vista", "mx");
  } else if (idx.length) {

    for (let k = 0; k < idx.length; k++)
      out[idx[idx.length - 1 - k]] = P(VE.baja + k * VE.sep, X_MEDIO,
        "A1 2(i) · la altura; el sitio es libre", "x", "2f");
    cimaTodoH = VE.baja + (idx.length - 1) * VE.sep;
  }

  if (idxP.length && v.type === "pilot") {
    const alta = Math.max(alturaTope(L), VE.baja + VE.sep);
    out[idxP[0]] = P(alta,          X_MEDIO, "R29(a)(iii) · en el tope o cerca", "mx", "2f");
    out[idxP[1]] = P(alta - VE.sep, X_MEDIO, "R29 + A1 2(i)", "x", "2f");
  } else if (idxP.length) {
    for (let k = 0; k < idxP.length; k++)
      out[idxP[idxP.length - 1 - k]] = P(VE.baja + k * VE.sep, X_MEDIO,
        (v.type === "varada" ? "R30(d)(i) + A1 2(i)" : "R27(b)(iv) + A1 2(i)")
        + " · la altura; el sitio es libre", "x", "2f");
  }

  const iTopes = luces_.map((l, i) => i).filter(i => luces_[i].kind === "masthead")
    .sort((a, b) => luces_[a].h - luces_[b].h);
  const alturaTope1 = Math.max(alturaTope(L),
    cimaTodoH === null ? 0 : cimaTodoH + VE.sep);
  if (iTopes.length >= 1)
    out[iTopes[0]] = P(alturaTope1, xTope1(L), "A1 2(a) + 3(a)");
  if (iTopes.length >= 2)
    out[iTopes[1]] = P(alturaTope1 + A1.TOPE2_SOBRE_TOPE1, xTope2(L),
                       "A1 2(a)(ii) + 3(a)");

  const mCostados = alturaCostados(L);
  luces_.forEach((l, i) => {
    if (out[i]) return;
    if (l.kind === "starboard" || l.kind === "port")
      out[i] = P(mCostados, xTope1(L), "A1 2(g) + 3(b)");
    else if (l.kind === "stern" && l.colour === "white")

      out[i] = P(ALCANCE_SOBRE_CASCO, xPopa(L),
                 "R21 · el sitio; la altura no la da el Anexo I", "m");
    else if (l.kind === "stern" && l.colour === "yellow")
      out[i] = P(ALCANCE_SOBRE_CASCO + VE.sep, xPopa(L), "R24 + A1 2(i)", "m");
  });
  luces_.forEach((l, i) => { if (!out[i]) return;
    out[i].sm = athwart(v, l.kind, L, l);
    out[i].citaSm = CITA_ATHWART[l.kind]
      || (l.banda ? "R27(d) + A1 4(b) \u00b7 a la banda de " + l.banda : "R21 \u00b7 en la crujia"); });
  const huerfana = out.findIndex(o => !o);
  if (huerfana >= 0) throw new Error("el Anexo I no le da sitio a "
    + luces_[huerfana].kind + "/" + luces_[huerfana].colour);

  return luces.map(l => out[luces_.indexOf(l)]);
}

if (typeof module !== "undefined") module.exports = {
  A1, manga, alturaTope, alturaCostados, vertical,
  xTope1, xTope2, xPopa, X_MEDIO, ALCANCE_SOBRE_CASCO,
  COSTADOS_TECHO_COMUN, CITA, SOLO_CON_ARRANCADA, citada, coloca,
  athwart, CITA_ATHWART,
  MARCAS_DIA, NO_ES_TIPO, marcasDia, marcasLaterales,
  TOW_LARGO_DIAMANTE, towLargo, towEslora, towRemolque, towAtras, tramoDe,
  tramoRemolque
};

 hard at night: a green with nothing white above it is a sailing vessel; the same green with a white above it is a ship. <b>One lamp, and it decides who gives way.</b>"]}, {"id": "velaYMotor", "nombre": "Sail and engine", "v": {"type": "power", "length": 24, "underway": true, "makingWay": true, "velaYMotor": true}, "regla": "<b>Rule 25(e)</b> · the lights of a power-driven vessel<br>and by day <b>a cone, point down</b>", "p": ["A sailing vessel <b>propelled by her engine</b> is a power-driven vessel for every purpose in the rules — Rule 3(b) is <em>«any vessel propelled by machinery»</em>, and Rule 3(c) stops calling her a sailing vessel once <em>«propelling machinery»</em> is being used. An engine merely running, out of gear, changes nothing. So at night she shows exactly the lights of Rule 23.", "By day, a cone. <b>This is the one place in the module where the day says more than the night</b> — everywhere else the shape and the lights carry the same sentence. <em>Put her next to the first one here and look: at night you cannot tell them apart, and nothing will help you.</em>"]}, {"id": "fondeada", "nombre": "At anchor", "v": {"type": "power", "length": 120, "underway": false, "makingWay": true}, "regla": "<b>Rule 30</b> · two all-round whites, the forward one higher,<br>or one under 50 m &middot; one ball by day", "p": ["One all-round white forward, and a second aft and at least 4.5 m lower — Rule 30(a) asks that of every vessel at anchor, and Rule 30(b) lets one under 50 m show a single white instead. By day, one black ball.", "What makes her easy is what is <b>missing</b>: <b>Rule 30 on its own allows her nothing else lit</b> — no sidelights, no sternlight, no masthead, no colour. And for most vessels her type does not come into it — a tanker of 300 m and a yacht of 15 show you the same thing.", "<em>Which works one way and not the other.</em> Nothing up there but an all-round white or two says <b>anchored</b>. A colour up there says only that she is <b>not showing Rule 30 on its own</b> — and that is not the same as saying she is moving. <em>Some vessels lie at anchor and still show colour: one fishing shows her fishing lights instead (Rule 26), one restricted adds red-white-red (Rule 27(b)(iv)), a pilot adds white over red (Rule 29), and one aground adds two reds (Rule 30(d)).</em>"]}], "p": ["Five vessels, side by side, and <b>not one coloured all-round light between them</b>. That is what they have in common, and it is the first thing you check on any contact: is there a colour up there, above the sidelights?", "<b>Open each one.</b> They are more alike than they look, and two of them — the merchant ship and the yacht motoring on her engine — are <b>identical after dark</b>. Seeing that side by side is the point of this screen.", "<em>If the answer to «is there a colour up there» is no, she is one of these five. If it is yes, she is in the next two screens.</em>"]}, {"id": "1.P1", "tema": "What she is · topic 1", "obra": "practica", "banco": "BASE", "h": "What is she?", "instruccion": "Three ordinary answers and one honest one — «her lights do not settle it». Take that one when the picture will not choose.", "p": []}, {"id": "2.X1", "tema": "What she is · topic 2", "obra": "explora", "b": "Next", "h": "Three pairs, and the order is everything", "renglon": "Green over white. Red over white. White over red. Open all three.", "naves": [{"id": "fishingTrawl", "nombre": "Trawling", "v": {"type": "fishingTrawl", "length": 26, "underway": true, "makingWay": false}, "regla": "<b>Rule 26(b)</b> · green over white<br>day &nbsp;two cones, points together", "p": ["<b>Green over white.</b> She is dragging gear <em>through the water</em> — a net or a dredge, moving along with her.", "Restricted, but not helpless: a trawler can still alter course, slowly. What she cannot do is stop. If she is 50 m or more she also carries a masthead light abaft and higher than the green.", "<b>And she only shows these lights while she is fishing.</b> Rule 26 covers a vessel <em>engaged in</em> fishing — the same trawler running out to the grounds with her gear stowed is an ordinary power-driven vessel, lit like anything else her size. <em>That is the lesson part 1 gave you with under way against making way, charged a second time: the same vessel, two sets of lights, and which one she is showing depends on what she is doing.</em> So the question is never «what kind of boat is that» — it is <b>what is she doing right now</b>."]}, {"id": "fishingOther", "nombre": "Fishing, not trawling", "v": {"type": "fishingOther", "length": 18, "underway": true, "makingWay": false}, "regla": "<b>Rule 26(c)</b> · red over white<br>day &nbsp;<b>the same</b> two cones", "p": ["<b>Red over white</b>, and the red is a warning about the water beside her: her gear may be out to one side, and it can extend more than 150 m.", "When it does she shows an extra all-round white <b>in the direction of the gear</b> — so a stray white light off her side is where the nets are, and that is the side you do not pass. <em>By day she and the trawler carry the same two cones: the night is where they part.</em>"]}, {"id": "pilot", "nombre": "A pilot vessel", "v": {"type": "pilot", "length": 24, "underway": true, "makingWay": true}, "regla": "<b>Rule 29</b> · <b>white over red</b><br>day &nbsp;no shape at all", "p": ["<b>White over red</b>, at or near her masthead — and she is the only vessel in the book with that order.", "Which is the whole reason she is on this screen and not on one of her own. <b>Red over white is a fisherman; white over red is a pilot.</b> Two lamps, the same two colours, and the meaning turns over with them. <em>«White over red, pilot ahead»</em> is worth the four words."]}], "p": ["Three vessels that all carry <b>one pair of all-round lights, one directly above the other</b>. Nothing else in the rules looks like this.", "And the whole difference between them is <b>which colour is on top</b>. Open the three and look at them together — <b>this is the confusion the examiner asks about</b>, and it is invisible if you meet them one at a time on three separate screens.", "<em>Green: dragging behind. Red: gear out to the side. White on top: a pilot, and she is not a problem at all.</em>", "And all three have rhymes, which is how most people carry them: <em>&laquo;Green over white, trawling tonight.&raquo; &laquo;Red over white, fishing at night.&raquo; &laquo;White over red, pilot ahead.&raquo;</em> They are worth having — but learn them <b>as a set of three</b>, here, side by side. A rhyme on its own has nothing to be told apart from, and telling them apart is the whole of this screen."]}, {"id": "2.E1", "tema": "What she is · topic 2", "obra": "paso", "reparto": "apiladas", "b": "Now you try", "h": "Turn the pair over and it changes rule", "buque": {"type": "pilot", "length": 24, "underway": true, "makingWay": true}, "tramos": [{"v": {"type": "pilot", "length": 24, "underway": true, "makingWay": true}, "muestra": ["allround"], "p": "Here is the pair on its own: <b>white on top, red underneath</b>. Nothing else lit, so there is nothing to distract you.", "razon": "<b>white over red</b> &middot; Rule 29 &middot; a pilot vessel"}, {"v": {"type": "fishingOther", "length": 24, "underway": true, "makingWay": true}, "muestra": ["allround"], "p": "Now the same two colours <b>the other way up</b>. Two lamps have swapped places and the vessel has changed rule, changed obligation and changed what you should do about her.", "razon": "<b>red over white</b> &middot; Rule 26(c) &middot; fishing"}, {"v": {"type": "fishingTrawl", "length": 24, "underway": true, "makingWay": true}, "muestra": ["allround"], "p": "And the third: <b>green over white</b>. The colour is on top again, so she is fishing — and now the colour itself tells you <em>how</em>: green means the gear is being dragged behind her.", "razon": "<b>green over white</b> &middot; Rule 26(b) &middot; trawling"}, {"v": {"type": "pilot", "length": 24, "underway": true, "makingWay": true}, "p": "Back to the pilot, with the rest of her lights on. <b>Ask which lamp is on top before you ask what colour it is.</b> White on top has exactly one answer in the whole book. Colour on top means fishing, and only then does the colour matter.", "razon": "<b>1</b> which lamp is on top?<br><b>2</b> and only then, what colour?"}], "renglon": "Same two colours, opposite order, different rule.", "pie": "Rule 29 against Rule 26 — the only pair in the book that means the opposite of itself upside down"}, {"id": "2.P1", "tema": "What she is · topic 2", "obra": "practica", "banco": "PAREJAS", "h": "Which pair is it?", "instruccion": "One colour and one white, one above the other. Read the top one first.", "p": []}, {"id": "3.X1", "tema": "What she is · topic 3", "obra": "explora", "b": "Next", "h": "Two, three, or one with a white in it", "renglon": "How many there are is the answer. Open all five.", "naves": [{"id": "nuc", "nombre": "Not under command", "v": {"type": "nuc", "length": 90, "underway": true, "makingWay": false}, "regla": "<b>Rule 27(a)</b> · two all-round reds<br>day &nbsp;two black balls", "p": ["<b>Two all-round reds</b>, one above the other, nothing between them. Something has <b>broken</b>: steering, engine, both.", "<em>She cannot manoeuvre as the rules require, through some exceptional circumstance</em> — that is the exact wording. She carries no masthead light at any length, and her sidelights come on only when making way, so two reds alone mean she is stopped in the water."]}, {"id": "ram", "nombre": "Restricted in her ability to manoeuvre", "v": {"type": "ram", "length": 100, "underway": true, "makingWay": false}, "regla": "<b>Rule 27(b)</b> · red, <b>white</b>, red<br>day &nbsp;ball, diamond, ball", "p": ["<b>Red, white, red</b> — the white in the middle. By day, ball, diamond, ball, and the diamond stands exactly where the white light goes.", "The difference from her neighbour is not degree, it is <b>kind</b>. She is not broken: she is <b>working</b> — dredging, laying cable, replenishing under way — and the work is what stops her getting out of your way. <em>Two reds: something failed. Red-white-red: something is going on.</em>"]}, {"id": "cbd", "nombre": "Constrained by her draught", "v": {"type": "cbd", "length": 150, "underway": true, "makingWay": true}, "regla": "<b>Rule 28</b> · three all-round reds<br>day &nbsp;a cylinder &middot; <b>plus all of Rule 23</b>", "p": ["<b>Three all-round reds</b>, or by day a cylinder — the only shape in the book that is neither ball nor cone.", "And look at what she keeps: <b>all of it</b>. Rule 28 <em>adds</em> to Rule 23 instead of replacing it, so under those three reds she still has her mastheads, her sidelights and her sternlight. <b>Of the eleven, she is where you see it most clearly</b>, and the next screen says why it matters."]}, {"id": "varada", "nombre": "Aground", "v": {"type": "varada", "length": 90, "underway": false, "makingWay": true}, "regla": "<b>Rule 30(d)</b> · two all-round reds <b>and her anchor lights</b><br>day &nbsp;three black balls", "p": ["<b>The two reds of a vessel not under command and the anchor lights of a vessel at anchor, at the same time.</b> That is Rule 30(d) word for word: the lights of a vessel at anchor <em>and in addition</em> two all-round reds in a vertical line, where they can best be seen.", "Read it as one sentence: <em>I am not going anywhere, and I could not if I wanted to.</em> Without the white she would be not under command; without the reds, simply at anchor. By day, <b>three balls</b> in a vertical line.", "<em>Under 12 m she is not obliged to show the reds or the balls — Rule 30(f) — so a small boat aground can look exactly like a small boat at anchor.</em>"]}, {"id": "buceo", "nombre": "Diving operations", "v": {"type": "ram", "length": 15, "underway": true, "makingWay": false, "buceo": true}, "regla": "<b>Rule 27(e)</b> · red, white, red<br>day &nbsp;<b>a rigid flag A</b>, at least 1 m high", "p": ["<b>The same red, white, red</b> as the vessel above her, because she is the same kind of vessel: restricted in her ability to manoeuvre by the work she is doing.", "What changes is the day. When she is too small to carry everything Rule 27(d) asks of a vessel working under water, Rule 27(e) gives her <b>a rigid replica of the International Code flag A, not less than 1 metre in height</b>, made visible all round — in place of ball, diamond, ball.", "<em>At night you cannot tell her from any other restricted vessel, and you do not need to: red, white, red means keep clear. By day the flag tells you why — there are people in the water.</em>"]}], "p": ["Five vessels that all carry <b>a vertical string of all-round lights</b>, and <b>how many there are is the answer</b>. Two reds. Red, white, red. Three reds. And two of them carry something more: the anchor lights of a vessel aground, and by day the flag of a diver.", "<b>Open all five and count them side by side.</b> This is the exact screen the house rule about spacing was written for. Lights in one vertical string are drawn <b>almost touching</b>, because that is how they are carried and how they look — but only <em>almost</em>: a hair of dark between them, and no more, because counting them is the whole answer.", "<em>If you take one thing from this topic: a string of reds means she cannot get out of your way. The number tells you why, and the why matters less than the fact.</em>"]}, {"id": "3.E1", "tema": "What she is · topic 3", "obra": "paso", "reparto": "apiladas", "b": "Now you try", "h": "Rule 28 adds. It does not replace.", "buque": {"type": "cbd", "length": 150, "underway": true, "makingWay": true}, "tramos": [{"muestra": ["masthead", "starboard", "port", "stern"], "p": "Start with what she would be showing if there were nothing wrong with her: <b>an ordinary power-driven vessel of 150 m</b>. Two mastheads, sidelights, a sternlight. Rule 23, and nothing else.", "razon": "<b>Rule 23</b> &middot; mastheads, sidelights, sternlight"}, {"muestra": ["masthead", "starboard", "port", "stern", "allround"], "p": "Now add the three all-round reds. <b>Add.</b> Everything from the last step is still lit — count it and see.", "razon": "<b>Rule 28</b> &middot; three all-round reds<br><b>plus</b> all of Rule 23"}, {"muestra": ["masthead", "starboard", "port", "stern", "allround"], "dia": true, "p": "And by day, a cylinder — the only shape in the book that is neither ball nor cone.", "razon": "day &middot; <b>a cylinder</b>"}, {"muestra": ["masthead", "starboard", "port", "stern", "allround"], "dia": true, "p": "<b>Most exceptions take lights away</b>, and this one does the opposite. A vessel not under command loses her masthead light, a sailing vessel never had one, a fishing vessel swaps hers for a pair. <b>This one keeps the lot.</b> <em>Count her lights and you will find more than on almost any other vessel in the book.</em>", "razon": "<b>R25, R26, R27</b> &nbsp;take away<br><b>R28</b> &nbsp;adds"}], "renglon": "Every other exception takes lights away. This one adds.", "pie": "And the warning is about the water, not the ship: her draught leaves her no room to go round you"}, {"id": "3.P1", "tema": "What she is · topic 3", "obra": "practica", "banco": "ROJAS", "h": "Count the reds", "instruccion": "A vertical string of all-round lights. How many, and what colour is the middle one?", "p": []}, {"id": "4.S1", "tema": "What she is · topic 4", "obra": "remolque", "reparto": "apiladas", "b": "Next", "h": "The black water between them", "buque": {"type": "towing", "length": 80, "underway": true, "makingWay": true, "towLength": 120, "towedLength": 60}, "renglon": "Two sets of lights, and nothing at all in between.", "pie": "Rule 24 · a tug and her tow — and the gap is the whole lesson", "p": ["Here is the configuration that kills people. A tug ahead, a tow astern, and between them <b>a hundred and twenty metres of wire with not one light on it</b>.", "What you see at night is <b>two separate groups of lights</b>, and the natural reading — two vessels, pass between them — is the reading that puts a wire across your foredeck.", "So the question is never «what are those lights». It is <b>«is there anything between them»</b>, and the answer is on the tug: a <b>vertical stack of masthead lights</b> where an ordinary vessel has one, and a <b>yellow light above her sternlight</b>, and nothing else carries a yellow there.", "<em>See a yellow over a sternlight and assume there is a wire, until you have seen what is on the end of it.</em>"], "calc": "<b>Rule 24(a)</b> · the tug<br>mastheads in a <b>vertical line</b><br>and a <b>yellow</b> over her sternlight"}, {"id": "4.E1", "tema": "What she is · topic 4", "obra": "paso", "reparto": "apiladas", "b": "Next", "h": "Built up, one lamp at a time", "buque": {"type": "towing", "length": 80, "underway": true, "makingWay": true, "towLength": 250, "towedLength": 60}, "tramos": [{"v": {"type": "power", "length": 80, "underway": true, "makingWay": true}, "muestra": ["masthead"], "p": "An ordinary power-driven vessel of 80 m carries <b>two masthead lights</b>: one forward, one aft and higher. That pair is what Rule 23 asks of a vessel of <em>50 m or more</em> — though, as part 1 showed, a smaller one is allowed it too, so it does not prove her size.", "razon": "<b>Rule 23</b> &middot; one forward, one aft and higher"}, {"muestra": ["masthead"], "p": "Now the same vessel towing. The forward one has become <b>a vertical stack</b> — and there are three of them, because this tow is longer than 200 m. <b>The stack counts the tow, not the tug.</b> The high one further aft is still her ordinary Rule 23 light, and it is not part of the stack.", "razon": "<b>R24(a)(i)</b> &middot; two in a vertical line<br><b>three</b> if the tow exceeds 200 m"}, {"muestra": ["masthead", "starboard", "port", "stern"], "p": "Sidelights and a sternlight, as any vessel under way. Nothing new, and nothing here says she is towing.", "razon": "<b>R24(a)(ii) and (iii)</b> &middot; sidelights and sternlight"}, {"muestra": ["masthead", "starboard", "port", "stern", "allround", "towing"], "p": "And the lamp that matters: <b>a yellow light directly above her sternlight</b>. No other vessel in the rules carries one. <em>From astern — which is where you meet a tow when overtaking — the stack has cut off at 112.5° and these two are all you get.</em>", "razon": "<b>R24(a)(iv)</b> &middot; the towing light, <b>yellow</b>,<br>in a vertical line over the sternlight"}, {"muestra": ["masthead", "starboard", "port", "stern", "allround", "towing"], "dia": true, "p": "By day: <b>nothing</b> — unless the tow exceeds 200 m, and then both vessels carry a <b>diamond</b>. It is the only shape in the book that depends on a measurement instead of on what kind of vessel she is.", "razon": "<b>R24(a)(v)</b> &middot; a diamond, over 200 m<br>on the tug <b>and</b> on the tow"}], "renglon": "An ordinary vessel, and then four lamps that make her a tug.", "pie": "The stack, the sidelights, the yellow, and the diamond"}, {"id": "4.S2", "tema": "What she is · topic 4", "obra": "remolque", "reparto": "apiladas", "b": "Now you try", "h": "From astern, two lamps are the whole warning", "buque": {"type": "towing", "length": 80, "underway": true, "makingWay": true, "towLength": 250, "towedLength": 60}, "g": 150, "renglon": "Her yellow, her white, and a stranger further off.", "pie": "The same tow from abaft her beam — and this is the sight people misread", "p": ["Now from <b>abaft her beam</b>, which is where you meet one when overtaking. The stack has cut off — masthead lights stop at 112.5° — and what is left on the tug is her <b>sternlight and the yellow above it</b>.", "Further off, and lower, the tow shows <b>her own sternlight</b>. Two white lights at different distances, one with a yellow above it.", "<b>That is the whole warning, and it is two lamps.</b> Miss the yellow and you have two unrelated vessels; see it and you have one tow and a wire you must go round.", "<em>And notice what you have lost: from here you cannot count the stack, so you know she is towing and you do not know how much of it there is.</em>"], "calc": "<b>from astern</b> · what survives<br>the tug &nbsp;sternlight + <b>yellow</b><br>the tow &nbsp;her sternlight, further off"}, {"id": "4.P1", "tema": "What she is · topic 4", "obra": "practica", "banco": "REMOLQUE", "h": "How long is the tow?", "instruccion": "Count the whites in one vertical line, and look for yellow over the stern.", "p": []}, {"id": "5.P1", "tema": "What she is · topic 5", "obra": "practica", "banco": "TODAS", "h": "All of them, mixed", "instruccion": "Top light, then colour, then count. And say so when the picture will not choose.", "p": []}, {"id": "5.C1", "tema": "What she is · topic 5", "obra": "cierre", "b": "Next: from where you are", "h": "What you can name now", "ensenaTambien": ["towing"], "cols": [{"rot": "NO COLOUR ABOVE", "filas": [["Power-driven · R23", "mastheads, sidelights, stern — and no shape"], ["Sailing · R25", "nothing above the sidelights"], ["Sail and engine · R25(e)", "a cone by day, and nothing by night"], ["At anchor · R30", "one white, or two — Rule 30 on its own"]]}, {"rot": "A PAIR, ONE OVER ONE", "filas": [["Trawling · R26(b)", "green over white"], ["Fishing otherwise · R26(c)", "red over white — gear may be out to the side"], ["Pilot · R29", "white over red — the order is the whole difference"], ["Towing · R24", "a stack of mastheads, and a yellow over the stern"]]}, {"rot": "A STRING OF REDS", "filas": [["Not under command · R27(a)", "two reds; two balls"], ["Restricted · R27(b)", "red, white, red; ball, diamond, ball"], ["Constrained by draught · R28", "three reds; a cylinder — and it ADDS to R23"], ["Aground · R30(d)", "anchor lights and two reds; three balls"], ["What you still cannot do", "say where she is going — that is part 3"]]}], "renglon": "Twelve configurations, three questions: is there colour above, is it a pair, or is it a string?", "pie": "Part 3 takes the same vessels and asks what they look like from where you are standing", "p": ["That is every configuration <b>this part teaches</b>, and there are <b>twelve</b> of them. Not a hundred: twelve. <b>The rules hold a few more</b> — a vessel engaged in mine clearance is one (Rule 27(f)) — but these are the ones you will see most and the ones the examiner starts with. <em>Eleven of them have a rule of their own; the odd one out is a sailing vessel using her engine, which borrows Rule 23 and is the reason you cannot tell her apart at night.</em>", "And they came in <b>three groups, not twelve separate lessons</b> — which is the whole point of the way this part is built. Ask three questions in order and every one of them falls out: <b>is there a coloured light above her sidelights? Is it a pair, one over one? Or is it a string of reds?</b>", "Underneath all twelve is the question the rules were written to answer: <b>can she get out of your way?</b> A clear deck means yes. A string of reds means no. Everything else is somewhere in between.", "<b>What you cannot do yet is read her from where you are.</b> Every screen here has shown you a vessel from her starboard side, whole, with her hull drawn — a diagram, not a sight. At two miles on a black night there is no hull, and half of what you have seen is not there. <em>That is part 3, and it is the part that turns this into seamanship.</em>"], "calc": "<b>1</b> colour above the sidelights?<br><b>2</b> a pair, or a string?<br><b>3</b> and then the colours and the count"}];
const YO = "luces-p2-what-she-is.html";
const D = {W:1000, H:640};

const LUZ = {

  D: 20,

  SARTA:    1.15,
  DISTINTO: 2.0,
  ANCHO:    4.5
};

const NS = "http://www.w3.org/2000/svg";
let svg = null, gO = null;

let ESC = 1;

let ALTO_LIBRE = false;
const esMovil = () => !!(window.matchMedia
  && window.matchMedia("(max-width:699px)").matches);
const px = n => n / ESC;
function el(t, at, pa){
 const e = document.createElementNS(NS, t);
 for(const k in at) if(at[k] !== undefined && at[k] !== null) e.setAttribute(k, at[k]);
 (pa || gO || svg).appendChild(e); return e;
}

function txt(x, y, s, an, tam, col, peso, fam){
 const e = el("text", {x:x, y:y, "text-anchor":an||"start", "pointer-events":"none",
  "font-size":px(tam||13),
  fill:col||"var(--paper-ink)", "font-weight":peso||400,
  "font-family":fam==="mono" ? "var(--f-mono)" : "var(--f-ui)"});
 e.textContent = s; return e;
}

function parte(s, ancho, tam){

 const porLinea = Math.max(6, Math.floor(ancho / (px(tam) * 0.62)));
 const lineas = []; let l = "";
 for(const q of String(s).split(" ")){
  if(!l) l = q;
  else if((l + " " + q).length <= porLinea) l += " " + q;
  else { lineas.push(l); l = q; }
 }
 if(l) lineas.push(l);
 return lineas;
}

const altoDe = (s, ancho, tam) => parte(s, ancho, tam).length * px(tam*1.35);
function txtCabe(cx, y, s, ancho, tam, col, peso, fam, an){
 const lineas = parte(s, ancho, tam);
 lineas.forEach((t, i) => txt(cx, y + i*px(tam*1.35), t, an || "middle", tam, col,
                              peso, fam));
 return lineas.length;
}

function renglonAbajo(yQuiere, renglon, pie, x0, x1, suelo){
 const ancho = x1 - x0;
 const nR = parte(renglon, ancho, 17).length;
 const nP = parte(pie, ancho, 12.5).length;
 const tope = D.H - px(12) - nR*px(24) - (nP - 1)*px(17);
 const y = Math.max(suelo || 0, Math.min(yQuiere, tope));
 el("line", {x1:x0, y1:y - px(26), x2:x1, y2:y - px(26),
   stroke:"var(--sea-line)", "stroke-width":1});
 txtCabe(D.W/2, y, renglon, ancho, 17, "var(--lam-ink)", 600);
 txtCabe(D.W/2, y + nR*px(24), pie, ancho, 12.5, "var(--lam-dim)");
 return y;

function anclasDe(h){
 const nom = nombreCasco(h);
 if(AIRE_CASCO[nom]) return AIRE_CASCO[nom];
 const P = POSICIONES[nom], manga = h.plan[2] / 2, out = [];
 const pon = (f, s, y) => { if(isFinite(f) && isFinite(y)) out.push([f, s || 0, y]); };

 ["tope_popa", "alcance", "remolque", "ancla_popa", "arte"]
   .forEach(function(k){ const q = P[k]; if(q) pon(q[0], 0, q[1]); });

 if(P.costado){ pon(P.costado[0],  manga, P.costado[1]);
                pon(P.costado[0], -manga, P.costado[1]); }

 const sube = (a, n, paso) => { if(a) for(let k = 0; k < n; k++)
   pon(a[0], 0, a[1] - k * paso); };
 const baja = (a, n, paso) => { if(a) for(let k = 0; k < n; k++)
   pon(a[0], 0, a[1] + k * paso); };
 if(P.topes_col) sube([P.topes_col.f, P.topes_col.y_base], 4, P.topes_col.paso);
 sube(P.tope_proa, 3, P.paso_luz);
 baja(P.columna.libre, 3, P.paso_luz);
 baja(P.columna.bajo_tope, 3, P.paso_luz);
 baja(P.ancla_proa, 2, P.paso_luz);
 return (AIRE_CASCO[nom] = out);
}

function paloConTopes(v, h){
 if(!v) return h;
 const todas = configuration(v).filter(l => !l.tow);
 if(!todas.some(l => l.kind === "masthead")) return h;
 const sr = sitiaRef(v, todas, todas, h), col = {};
 todas.forEach(function(l, i){
  if(l.kind === "masthead" && sr[i]) (col[sr[i].f] = col[sr[i].f] || []).push(sr[i].y);
 });
 let crece = false;
 const masts = (h.masts || []).map(function(m){
  const ys = col[m[0]];
  if(!ys) return m;

  const alto = Math.min.apply(null, ys);
  if(alto >= m[1]) return m;
  const tope = alto - (REF_D/2 - 1);
  crece = true;
  return [m[0], tope, m[2]];
 });
 return crece ? Object.assign({}, h, {masts: masts, nombre: nombreCasco(h)}) : h;
}
function silueta(hueco, h0, tinta, nave, pr, pts, marcas, v){
 const h = paloConTopes(v, h0);
 const PJ = pr || {f: 1, s: 0, lado: 0, proa: false};
 const f0 = h.plan[0], f1 = h.plan[1], hb = h.plan[2] / 2;

 const X = (fq, sq) => { const n = fq * PJ.f + (sq || 0) * PJ.lado;
                         return Math.abs(n) < 1e-3 ? 0 : n; };
 const cara = 2 * hb * PJ.s;

 let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
 const mete = (a, b, c, e) => { if(a < x0) x0 = a; if(b > x1) x1 = b;
                                if(c < y0) y0 = c; if(e > y1) y1 = e; };
 h.poly.forEach(q => mete(X(q[0]), X(q[0]), q[1], q[1]));
 if(cara > 0) mete(PJ.proa ? X(f1) : X(f0) - cara, PJ.proa ? X(f1) + cara : X(f0),
                   h.ydeck, h.ywater);
 (h.blocks || []).forEach(b => { const bajo = (b[3] - b[1]) < 20;
   const mg = (hb + (bajo ? 2 : -4)) * PJ.s;
   mete(Math.min(X(b[0]), X(b[2])) - mg, Math.max(X(b[0]), X(b[2])) + mg, b[1], b[3]); });
 (h.spars || []).forEach(q => mete(Math.min(X(q[0]), X(q[1])), Math.max(X(q[0]), X(q[1])),
                                   q[2], q[2] + 2.5));

 (h0.masts || []).forEach(m => mete(X(m[0]) - 2, X(m[0]) + 2, m[1], m[2]));

 const topeM = (h0.masts || []).length
   ? Math.min.apply(null, h0.masts.map(function(m){ return m[1]; })) : h.ydeck;
 mete(x0, x1, topeM - REF_D/2, y1);
 anclasDe(h).forEach(function(q){
  const cx = X(q[0], q[1]);
  mete(cx - REF_D/2, cx + REF_D/2, q[2] - REF_D/2, q[2] + REF_D/2);
 });

 if(marcas && marcas.length){
  const P = POSICIONES[nombreCasco(h)], anc = P.columna.libre;
  const ms = marcasRefDe(marcas);
  let alt = 0;
  ms.forEach(function(m){ alt += ALTO_MARCA[m] + PASO_MARCA; });
  mete(X(anc[0]) - D_MARCA/2, X(anc[0]) + D_MARCA/2,
       anc[1], anc[1] + alt - PASO_MARCA);
 }

 const vb = [x0, y0, Math.max(1, x1 - x0), Math.max(1, y1 - y0)];

 const g = el("svg", {x: hueco.x, y: hueco.y, width: hueco.w, height: hueco.h,
   viewBox: vb.join(" "), preserveAspectRatio: "xMidYMid meet",
   "data-nave": nave, "data-buquesvg": 1,
   "data-hx": hueco.x, "data-hy": hueco.y,
   "data-hw": hueco.w, "data-hh": hueco.h});

 const S_T = SITIOS_TIPOS[nombreCasco(h0)];
 if(S_T && (SILUETA_FORZADA || S_T.silueta_luces) === "json"){
  B360.siluetaLuces(g, h0, PJ, tinta, nave, v);
  if(marcas && marcas.length) pilaDiaRef(g, h, marcas, tinta, nave, X);
  return {nodo: g, vb: vb, h: h, PJ: PJ, X: X};
 }

 el("path", {d: "M" + h.poly.map((q, i) => (i ? "L" : "") + X(q[0]).toFixed(2)
      + "," + q[1].toFixed(2)).join(" ") + " Z",
   fill: tinta, stroke: "none",
   "data-nave": nave, "data-casco": 1, "data-escorzo": PJ.f.toFixed(4)}, g);
 if(cara > 0.5)
  el("rect", {x: PJ.proa ? X(f1) : X(f0) - cara, y: h.ydeck, width: cara,
    height: h.ywater - h.ydeck, fill: tinta,
    "data-cara": 1, "data-nave": nave}, g);
 (h.blocks || []).forEach(b => {
  const bajo = (b[3] - b[1]) < 20;
  const mg = (hb + (bajo ? 2 : -4)) * 2 * PJ.s;
  const a = X(b[0]), c = X(b[2]), suyo = Math.abs(c - a), an = Math.max(suyo, mg);
  el("rect", {x: Math.min(a, c) - (an - suyo) / 2, y: b[1], width: an,
    height: b[3] - b[1], fill: tinta, "data-nave": nave, "data-sup": 1}, g);
 });
 (h.spars || []).forEach(q => {
  const a = X(q[0]), c = X(q[1]);
  el("rect", {x: Math.min(a, c), y: q[2], width: Math.max(Math.abs(c - a), 2),
    height: 2.5, fill: tinta, "data-nave": nave, "data-verga": 1}, g);
 });

 (h.masts || []).forEach(m => {
  el("rect", {x: X(m[0]) - 2, y: m[1], width: 4, height: m[2] - m[1],
    fill: tinta, "data-nave": nave, "data-palo": 1}, g);
 });

 if(marcas && marcas.length) pilaDiaRef(g, h, marcas, tinta, nave, X);
 return {nodo: g, vb: vb, h: h, PJ: PJ, X: X};
}

function focosCubierta(pts, S, nave){

let NAVE_N = 0;

let HAY_LUZ = false;

function medidasDe(S, hueco){
 const vb = S.vb;
 const k = Math.min(hueco.w / vb[2], hueco.h / vb[3]);
 return {k: k,
   ox: hueco.x + (hueco.w - vb[2]*k)/2 - vb[0]*k,
   oy: hueco.y + (hueco.h - vb[3]*k)/2 - vb[1]*k};
}

function casco(P, v, noche, marcas, centroX, largoReal, fam, pr){
 return buque360(P, {v: v, modo: "luces",
                     luces: {como: "casco", args: [noche, marcas, centroX, largoReal, fam, pr]}});
}
function lucesCasco(P, v, noche, marcas, centroX, largoReal, fam, pr){
 const L = largoReal || v.length || 12;
 const h = fam || cascoDe(v, L);
 const yo = NAVE_N++;

 const tinta = noche ? "#24343D" : "var(--ink)";

 const altoHueco = Math.max(20, (P.cy - P.y0) - 10);
 const hueco = {x: P.x0 + 10, y: (P.y0 + P.y1)/2 - altoHueco/2,
                w: Math.max(20, (P.x1 - P.x0) - 20),
                h: altoHueco};
 const S = silueta(hueco, h, tinta, yo, pr, null, marcas, v);
 const M = medidasDe(S, hueco);
 const refL = h.plan[1] - h.plan[0];
 return {x0: M.ox + M.k*S.X(h.plan[0]), x1: M.ox + M.k*S.X(h.plan[1]),
         y: M.oy + M.k*h.ywater,
         alto: M.k*(h.ywater - S.vb[1]),
         largo: M.k*refL, n: yo,
         cub: M.oy + M.k*h.ydeck, fb: M.k*(h.ywater - h.ydeck),
         sup: S, k: M.k, ox: M.ox, oy: M.oy,
         medio: M.ox + M.k*((h.plan[0] + h.plan[1])/2),
         escalaH: M.k*refL / L,
         mx: xm => M.ox + M.k*((xm / L) * refL)};
}

function marcaDia(g, cx, cy, r, cual, tinta){

const MARCA_PASO = 24;

const MARCA_REF = {ball: "bola", cone: "cono_arriba", coneUp: "cono_abajo",
                   diamond: "rombo", cylinder: "cilindro", flagA: "banderaA"};
function marcasRefDe(formas){
 const out = [];
 for(let i = 0; i < formas.length; i++){
  if(formas[i] === "coneUp" && formas[i+1] === "cone"){ out.push("bicono"); i++; }
  else out.push(MARCA_REF[formas[i]] || "bola");
 }
 return out;
}

function marcaRef(g, cx, cy, m, tinta, nave, k){
 const e = k || 1;
 const r = D_MARCA * e / 2, h = ALTO_MARCA[m] * e / 2;
 const d = {"data-forma": m, "data-nave": nave};

 const pol = pts => el("path", Object.assign({
   d: "M" + pts.map(function(q, i){ return (i ? "L" : "") + q[0] + "," + q[1]; }).join(" ")
      + " Z", fill: tinta}, d), g);
 if(m === "bola")
  el("circle", Object.assign({cx: cx, cy: cy, r: r, fill: tinta}, d), g);
 else if(m === "cono_arriba")
  pol([[cx, cy-h], [cx+r, cy+h], [cx-r, cy+h]]);
 else if(m === "cono_abajo")
  pol([[cx, cy+h], [cx+r, cy-h], [cx-r, cy-h]]);
 else if(m === "bicono"){
  pol([[cx, cy], [cx+r, cy-h], [cx-r, cy-h]]);
  pol([[cx, cy], [cx+r, cy+h], [cx-r, cy+h]]);
 } else if(m === "rombo")
  pol([[cx, cy-h], [cx+r, cy], [cx, cy+h], [cx-r, cy]]);
 else if(m === "cilindro")
  el("rect", Object.assign({x: cx-r, y: cy-h, width: D_MARCA * e,
    height: ALTO_MARCA[m] * e, fill: tinta}, d), g);

 else if(m === "banderaA"){
  const w = h * 3, x0 = cx - w/2, xm = cx, y0 = cy - h, y1 = cy + h;
  el("path", Object.assign({d: "M"+x0+","+y0+" L"+xm+","+y0+" L"+xm+","+y1
     +" L"+x0+","+y1+" Z", fill: COLOR_LUZ.white, stroke: tinta, "stroke-width": e*1.2}, d), g);
  el("path", Object.assign({d: "M"+xm+","+y0+" L"+(x0+w)+","+y0+" L"+(x0+w*0.78)+","+cy
     +" L"+(x0+w)+","+y1+" L"+xm+","+y1+" Z", fill: COLOR_LUZ.blue, stroke: tinta,
     "stroke-width": e*1.2}, d), g);
 }
}

function pilaDiaSuelta(cx, yBase, formas, tinta, k){
 const ms = marcasRefDe(formas || []);
 if(!ms.length) return 0;
 const e = k || 1;
 let alto = 0;
 ms.forEach(function(m){ alto += ALTO_MARCA[m] * e; });
 alto += PASO_MARCA * e * (ms.length - 1);
 let y = yBase - alto;
 ms.forEach(function(m){
  marcaRef(null, cx, y + ALTO_MARCA[m] * e / 2, m, tinta, undefined, e);
  y += (ALTO_MARCA[m] + PASO_MARCA) * e;
 });
 return alto;
}

function pilaDiaRef(g, h, formas, tinta, nave, X){
 const ms = marcasRefDe(formas || []);
 if(!ms.length) return null;
 const P = POSICIONES[nombreCasco(h)];
 const anc = P.columna.libre;
 let y = anc[1];

 const yaHayPalo = X && (h.masts || []).some(function(m){
  return Math.abs(X(m[0]) - anc[0]) < 3
      && m[1] <= anc[1] + 1 && m[2] >= h.ydeck - 1;
 });
 if(!yaHayPalo)
  el("rect", {x: anc[0] - 2, y: anc[1], width: 4, height: h.ydeck - anc[1],
    fill: tinta, "data-nave": nave, "data-palo": 1}, g);
 ms.forEach(function(m){
  marcaRef(g, anc[0], y + ALTO_MARCA[m] / 2, m, tinta, nave);
  y += ALTO_MARCA[m] + PASO_MARCA;
 });
 return {f: anc[0], y0: anc[1], y1: y - PASO_MARCA};
}

function pilaDia(cx, yBase, r, formas, paso, soporte){
 const d = paso === undefined ? px(MARCA_PASO) : paso;
 if(soporte && formas.length){

 }
 formas.forEach((f, i) => marcaDia(gO, cx, yBase - (formas.length-1-i)*d, r, f));
 return formas.length ? (formas.length-1)*d + r*2 : 0;
}

function estrella(cx, cy, r, puntas){

 for(let i = 0; i < n*2; i++){
  const a = (i * Math.PI / n) - Math.PI/2, rr = (i % 2) ? r*0.62 : r;
  d.push((i ? "L" : "M") + (cx + rr*Math.cos(a)).toFixed(2)
                    + "," + (cy + rr*Math.sin(a)).toFixed(2));
 }
 return d.join(" ") + " Z";
}
function luz(cx, cy, r, color, datos, centelleante, pa){

const COLOR_LUZ = {white:"#FFFFFF", red:"#FF0000", green:"#5AA900",
                   yellow:"#FFFF00", blue:"#0070C0"};

const COLOR_CENTELLEO = {yellow:"#EFD400"};

function vistas(v, g){ return configuration(v).filter(l => visible(l, g)); }

function nombreCasco(h){
 if(h && h.nombre) return h.nombre;
 for(const k in CASCOS_REF) if(CASCOS_REF[k] === h) return k;
 return "mercante";
}

function firmaLuces(todas){
 return todas.map(l => l.kind + ":" + l.colour).sort().join(",");
}

function sitiaRef(v, luces, todas, h){
 const P = POSICIONES[nombreCasco(h)];
 const manga = h.plan[2] / 2;
 const fondeada = v.underway === false;
 const out = new Array(luces.length).fill(null);

 const ficha = L_REF[nombreCasco(h) + "|" + firmaLuces(todas)];
 if(ficha){

  const suyas = {}, mias = {};
  ficha.L.forEach(q => { const k = q.k + "|" + q.col;
    (suyas[k] = suyas[k] || []).push(q); });
  todas.forEach(l => { const k = l.kind + "|" + l.colour;
    (mias[k] = mias[k] || []).push(l); });
  const de = new Map();
  let todo = true;
  for(const k in mias){
   const A = mias[k].slice().sort((a, b) => b.h - a.h);
   const B = (suyas[k] || []).slice().sort((a, b) => a.y - b.y);
   if(A.length !== B.length){ todo = false; break; }
   A.forEach((l, i) => de.set(l, B[i]));
  }
  if(todo){
   luces.forEach((l, i) => {
    const q = de.get(l);
    if(!q){ todo = false; return; }
    out[i] = {f: q.f, s: q.s, y: q.y};
   });
   if(todo) return out;
   out.fill(null);
  }
 }

 const pon = (l, q) => { const i = luces.indexOf(l); if(i >= 0 && q) out[i] = q; };
 const dea = k => todas.filter(l => l.kind === k);

 if(v.tricolour && (v.length || 12) < 20){
  const c = P.columna.libre;
  todas.forEach(l => pon(l, {f: c[0], s: 0, y: c[1]}));
  return out;
 }

 const topes = P.tope_proa
   ? dea("masthead").slice().sort((a, b) => a.h - b.h)
   : [];
 if(P.topes_col && topes.length >= 2){

  const tc = P.topes_col;
  const sarta = topes.filter(l => l.x > 0), atras = topes.filter(l => !(l.x > 0));
  const cola = sarta.length ? sarta : topes;
  cola.forEach((l, k) => pon(l, {f: tc.f, s: 0, y: tc.y_base - k * tc.paso}));
  if(sarta.length) atras.forEach((l, k) => pon(l, P.tope_popa && P.tope_popa[0] !== tc.f
    ? {f: P.tope_popa[0], s: 0, y: P.tope_popa[1]}
    : {f: tc.f, s: 0, y: tc.y_base - (cola.length + k) * tc.paso}));
 } else if(topes.length >= 2){

  const sarta = topes.filter(l => l.x > 0), atras = topes.filter(l => !(l.x > 0));
  const col = sarta.length ? sarta : topes.slice(0, topes.length - 1);
  const fin = sarta.length ? atras : topes.slice(-1);
  col.forEach((l, k) => pon(l, {f: P.tope_proa[0], s: 0,
    y: P.tope_proa[1] - k * P.paso_luz}));
  fin.forEach((l, k) => pon(l, P.tope_popa
    ? {f: P.tope_popa[0], s: 0, y: P.tope_popa[1] - k * P.paso_luz}
    : {f: P.tope_proa[0], s: 0, y: P.tope_proa[1] - (col.length + k) * P.paso_luz}));
 } else if(topes.length === 1 && P.tope_proa){
  pon(topes[0], {f: P.tope_proa[0], s: 0, y: P.tope_proa[1]});
 }

 dea("starboard").forEach(l => pon(l, {f: P.costado[0], s: manga, y: P.costado[1]}));
 dea("port").forEach(l =>      pon(l, {f: P.costado[0], s: -manga, y: P.costado[1]}));

 dea("stern").forEach(l => {
  if(l.colour === "yellow" && P.remolque)
   pon(l, {f: P.remolque[0], s: 0, y: P.remolque[1]});
  else
   pon(l, {f: P.alcance[0], s: 0, y: P.alcance[1]});
 });

 const ban = dea("allround").filter(l => l.banda);
 const th = dea("allround").filter(l => !l.banda).sort((a, b) => b.h - a.h);

 if(v.type === "varada"){
  const bl = th.filter(l => l.colour === "white"), ro = th.filter(l => l.colour === "red");
  if(bl.length >= 2 && P.ancla_popa){
   pon(bl[0], {f: P.ancla_proa[0], s: 0, y: P.ancla_proa[1]});
   pon(bl[1], {f: P.ancla_popa[0], s: 0, y: P.ancla_popa[1]});
  } else bl.forEach(l => pon(l, {f: P.ancla_proa[0], s: 0, y: P.ancla_proa[1]}));
  const anc = P.columna.libre;
  ro.forEach((l, k) => pon(l, {f: anc[0], s: 0, y: anc[1] + k * P.paso_luz}));
 } else if(fondeada && !v.obstruccion && v.type === "ram"){

  const r30 = configuration(Object.assign({}, v, {type: "power"}));
  const esFondeo = l => r30.some(q => q.colour === l.colour && q.h === l.h && q.x === l.x);
  const an = th.filter(esFondeo), co = th.filter(l => !esFondeo(l));
  if(an.length >= 2 && P.ancla_popa){
   pon(an[0], {f: P.ancla_proa[0], s: 0, y: P.ancla_proa[1]});
   pon(an[1], {f: P.ancla_popa[0], s: 0, y: P.ancla_popa[1]});
  } else an.forEach(l => pon(l, {f: P.ancla_proa[0], s: 0, y: P.ancla_proa[1]}));
  co.forEach((l, k) => pon(l, {f: P.columna.libre[0], s: 0, y: P.columna.libre[1] + k * P.paso_luz}));
 } else if(fondeada && !v.obstruccion){

  if(th.length >= 2 && P.ancla_popa){
   pon(th[0], {f: P.ancla_proa[0], s: 0, y: P.ancla_proa[1]});
   pon(th[1], {f: P.ancla_popa[0], s: 0, y: P.ancla_popa[1]});
   th.slice(2).forEach((l, k) => pon(l, {f: P.columna.libre[0], s: 0,
     y: P.columna.libre[1] + k * P.paso_luz}));
  } else {
   th.forEach((l, k) => pon(l, {f: P.ancla_proa[0], s: 0,
     y: P.ancla_proa[1] + k * P.paso_luz}));
  }
 } else if(th.length){

  const fc = P.columna.libre[0];
  const conTope = topes.some(l => { const q = out[luces.indexOf(l)];
    return q ? q.f === fc : (P.tope_proa && P.tope_proa[0] === fc); });
  const anc = conTope ? P.columna.bajo_tope : P.columna.libre;

  th.forEach((l, k) => pon(l, {f: anc[0], s: 0, y: anc[1] + k * P.paso_luz}));

  ["port", "starboard"].forEach(b => {

      .forEach((l, k) => pon(l, {f: anc[0], s: b === "starboard" ? manga : -manga,

 }

 let sobra = 0;

let SIN_SITIO = 0;

function reparte(luces, sitios, geo, tramo){

 const porSarta = {}, porAltura = {};
 luces.forEach((l, i) => {
  const q = sitios[i];
  if(q.sarta) (porSarta[q.sarta] = porSarta[q.sarta] || []).push(i);
  else { const k = q.m.toFixed(4); (porAltura[k] = porAltura[k] || []).push(i); }
 });
 const items = [];
 for(const k in porSarta)  items.push({idx: porSarta[k],  sarta: true});
 for(const k in porAltura) items.push({idx: porAltura[k], sarta: false});
 items.forEach(it => {
  const ms = it.idx.map(i => sitios[i].m);
  it.baja = Math.min.apply(null, ms);
  it.alta = Math.max.apply(null, ms);
 });

 items.sort((a, b) => a.baja - b.baja || a.alta - b.alta);

 const alturaDe = {};
 items.forEach(it => {
  const niveles = it.idx.map(i => sitios[i].m)
    .sort((a, b) => a - b).filter((m, k, a) => !k || m !== a[k-1]);

  let debajo = 0;
  items.forEach(ot => { if(ot !== it && ot.alta <= it.baja && ot.techo !== undefined)
    debajo = Math.max(debajo, ot.techo); });

  let y = (it.baja === 0) ? 0 : debajo + LUZ.DISTINTO;
  const de = {};
  niveles.forEach((m, k) => { if(k) y += LUZ.SARTA; de[m.toFixed(4)] = y; });
  it.idx.forEach(i => { alturaDe[i] = de[sitios[i].m.toFixed(4)]; });
  it.techo = y;
 });

 const P = geo.pr || {f: 1, s: 0, lado: 0};
 return luces.map((l, i) => ({
   cx: geo.medio + ((sitios[i].xm * P.f + (sitios[i].sm || 0) * P.lado) / tramo)
                   * geo.ancho,
   cy: geo.base  - alturaDe[i] * geo.d,
   l: l, m: sitios[i].m, xm: sitios[i].xm, fila: alturaDe[i],
   mLibre: sitios[i].mLibre, xmLibre: sitios[i].xmLibre,
   cita: sitios[i].cita, sarta: sitios[i].sarta, sm: sitios[i].sm || 0 }));
}

function pasosDe(v, luces, todas){
 const pts = reparte(luces, coloca(v, luces, todas),
   {medio:0, ancho:0, base:0, d:1}, tramoDe(v));
 return Math.max.apply(null, pts.map(p => -p.cy));
}

function pasosMax(naves){
 let m = 0;
 naves.forEach(q => {

   const todas = q.todas || configuration(q.v);
   m = Math.max(m, pasosDe(q.v, q.luces || todas, todas));
  } catch(e){}
 });
 return m;
}

function dibujaLuces(P, v, luces, todas, o){
 const r = LUZ.D / 2, d = LUZ.D;
 const L = v.length || 12;

 const anchoPanel = P.x1 - P.x0;

 const ancho = o.ancho || (anchoPanel - 108);

 const fam = o.casco ? CASCOS_REF[o.casco]
           : (o.neutro ? CASCOS_REF.mercante : cascoDe(v, L));

 const sitios = coloca(v, luces, todas);

 const dichas = (o.rotula === false) ? {} : frasesLibres(sitios);

 const notaL = notaLibreActiva(o);
 const arriba = P.y0 + ((o.rotulaDebajo || FICHA_ROTULO || notaL) ? 0 : altoLibres(dichas, anchoPanel));

 const pasos = (o.pasos !== undefined && o.pasos !== null) ? o.pasos
   : (function(){ try { return pasosDe(v, luces, todas); } catch(e){ return 0; } })();

 const pr = (!o.escorza || o.g === undefined || o.g === null) ? null : PROY(o.g);

 const hw = Math.max(20, o.ancho ? o.ancho : (anchoPanel - 24));

 if(o.rotula !== false && FICHA_ROTULO) rotulaEnFicha(FICHA_ROTULO, dichas);
 else if(o.rotula !== false && o.rotulaDebajo){
  const an = Math.min(anchoPanel, hw) + px(24);
  o.altoDebajo = Object.keys(dichas).filter(f => !LIBRES_DICHAS[f]).length
    ? altoLibres(dichas, an) - px(38) : 0;
  rotulaLibres(P, dichas, an, P.y1 + px(26));
 }

 else if(o.rotula !== false && notaL) rotulaEnFicha(notaL, dichas);
 else if(o.rotula !== false) rotulaLibres(P, dichas, Math.min(anchoPanel, hw));

 const refL = fam.plan[1] - fam.plan[0];
 const topeDe = q => (q.masts || []).length
   ? Math.min.apply(null, q.masts.map(function(m){ return m[1]; }))
   : q.ydeck - REF_D/2;

 const cuelga = (ps, tope) => {
  if(!ps.length) return ps;
  const alta = Math.min.apply(null, ps.map(function(p){ return p.cy; }));
  const dy = tope - alta;
  ps.forEach(function(p){ p.cy += dy; });
  return ps;
 };

 const hh = o.ancho ? hw : Math.max(20, P.y1 - arriba - 12);
 const hueco = {x: P.cx - hw/2, y: (P.y0 + P.y1)/2 - hh/2, w: hw, h: hh};

 if(v.type === "towing" && v.underway !== false && !o.soloRemolcador
    && !o.soloRemolcado && luces.some(l => l.tow)){
  const suyas = [], suyo = [];
  luces.forEach((l, i) => (l.tow ? suyo : suyas).push(i));
  const Lr = towEslora(v);
  const fa = cascoDe(v, L), fr = cascoDe({type:"power", gabarra:1, length:Lr}, Lr);
  const rA = fa.plan[1] - fa.plan[0], rB = fr.plan[1] - fr.plan[0];
  const PJ = pr || {f: 1, s: 0, lado: 0};
  const arma = (idx, casco, todasDe) => {
   const q = sitiaRef(v, idx.map(i => luces[i]), todasDe, casco);
   return idx.map(function(i, k){
    return {cx: q[k].f * PJ.f + q[k].s * PJ.lado, cy: q[k].y, l: luces[i],
            m: sitios[i].m, xm: sitios[i].xm, sm: sitios[i].sm || 0,
            fila: (casco.ywater - q[k].y) / REF_D,
            mLibre: sitios[i].mLibre, xmLibre: sitios[i].xmLibre,
            cita: sitios[i].cita, sarta: sitios[i].sarta};
   });
  };
  const uno = arma(suyas, fa, todas.filter(l => !l.tow));

  const dos = arma(suyo, fr, todas.filter(l => l.tow));

  const sep = hueco.w / 6;
  const util = hueco.w - sep, tot = rA + rB;
  const hA = {x: hueco.x + util*(rB/tot) + sep, y: hueco.y, w: util*(rA/tot), h: hueco.h};
  const hB = {x: hueco.x, y: hueco.y, w: util*(rB/tot), h: hueco.h};
  const nA = NAVE_N++, nB = NAVE_N++;
  const SA = silueta(hA, fa, "#24343D", nA, pr, uno, undefined, v);
  const SB = silueta(hB, fr, "#24343D", nB, pr, dos);
  uno.forEach(p => p.nave = nA); dos.forEach(p => p.nave = nB);
  pintaPuntos(uno, REF_D/2, L,  nA, SA.nodo);
  pintaPuntos(dos, REF_D/2, Lr, nB, SB.nodo);
  const M = medidasDe(SA, hA);
  return {n: nA, medio: M.ox + M.k*((fa.plan[0] + fa.plan[1])/2), base: M.oy};
 }

 const sr = sitiaRef(v, luces, todas, fam);
 const PJ = pr || {f: 1, s: 0, lado: 0};
 const pts = luces.map(function(l, i){
  return {cx: sr[i].f * PJ.f + sr[i].s * PJ.lado, cy: sr[i].y, l: l,
          m: sitios[i].m, xm: sitios[i].xm, sm: sitios[i].sm || 0,
          fila: (fam.ywater - sr[i].y) / REF_D,
          mLibre: sitios[i].mLibre, xmLibre: sitios[i].xmLibre,
          cita: sitios[i].cita, sarta: sitios[i].sarta};
 });

 const yo = NAVE_N++;

 const S = silueta(hueco, fam, o.sinCasco ? "none" : (o.dia ? "var(--ink)" : "#24343D"),

 if(v.underway === false && L >= A1.CUBIERTAS_ILUMINADAS_DESDE)
  focosCubierta(pts, S, yo);

 pintaPuntos(pts, REF_D/2, L, yo, S.nodo);
 const M = medidasDe(S, hueco);

         base: M.oy + M.k*fam.ydeck};

function firmaEscena(v, g){
