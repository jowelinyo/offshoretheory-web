<script>

"use strict";
const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

let RND = 1;

window.azarSemilla = n => {
 RND = (n >>> 0) || 1;
 for(let k = 0; k < 8; k++) azar();
};
function azar(){
 RND ^= RND << 13; RND >>>= 0;
 RND ^= RND >>> 17;
 RND ^= RND << 5;  RND >>>= 0;
 return RND / 4294967296;
}
function baraja(a){
 const b = a.slice();
 for(let i = b.length - 1; i > 0; i--){
  const j = Math.floor(azar() * (i + 1));
  const t = b[i]; b[i] = b[j]; b[j] = t;
 }
 return b;
}
azarSemilla(Date.now());

function bolsaNueva(){ return {i:[], ultima:null}; }
function saca(bolsa, banco){

 if(bolsa.n!==banco.length){ bolsa.i=[]; bolsa.n=banco.length; }
 if(!bolsa.i.length){
  bolsa.i = baraja(banco.map((x, k) => k));
  if(bolsa.i.length > 1 && banco[bolsa.i[bolsa.i.length - 1]].id === bolsa.ultima){
   const t = bolsa.i[bolsa.i.length - 1];
   bolsa.i[bolsa.i.length - 1] = bolsa.i[0]; bolsa.i[0] = t;
  }
 }
 const x = banco[bolsa.i.pop()];
 bolsa.ultima = x.id;
 return x;
}

const PZ=[{"id": "1.S1", "t": "The line · topic 1", "h": "Two figures, and neither one is a depth", "obra": "cifras", "p": ["This is the chart itself — about <b>2.1 miles</b> of it, with the coast on one side, the five- and two-metre contours out in the bay, and the green of everything that dries at low water.", "<b>Two of the figures are boxed</b>, 380 metres apart: <b>0.7</b> out in the channel, and <b>1.8</b> with a line under it, up on the green.", "Both are metres. Both are printed in the same ink, in the same size, on the same paper. And they mean <b>opposite things</b> — one is water you can float in and the other is ground that stands up out of it.", "Look at which one is bigger. <b>The larger number is the shallower place</b> — in fact it is not a place you can float over at all for part of the day. If you read a chart expecting big numbers to mean deep water, that is the figure that puts you aground.", "<em>A number on a chart says nothing until you know what it is measured from.</em> That is what this part is about, and by the end of it you will know where every figure the chart prints is measured from.", "First, the line they are both measured from."]}, {"id": "1.E1", "t": "The line · topic 1", "h": "The line everything is measured from", "obra": "ejemplo", "pasos": ["Water, and the ground under it. Nothing else yet — and notice that there is nothing here you could print on a chart, because the water will not stay where it is.", "<b>Chart datum.</b> The level the tide is not expected to fall below. It is drawn in magenta because that is the ink the Admiralty uses for tidal information, and it is the only thing in this picture that never moves.", "A <b>sounding</b> is measured <b>down</b> from the line to the seabed. That is the figure the chart prints out in the fairway. <em>The tide adds to it:</em> whatever the sounding says, there is that much water there even at datum, and more whenever the tide is up.", "And where the ground stands <b>above</b> the line, the chart prints the figure <u>underlined</u>: a <b>drying height</b>, measured <b>up</b> from the datum. Same ink, same size, opposite side. The underline is the whole difference.", "Now <b>drag the water</b> up and down. Watch the two figures: <em>they do not move.</em> That is why they can be printed on a piece of paper — they are measured from the line, and the line does not care what the tide is doing."], "cierre": "Now you read them."}, {"id": "1.P1", "t": "The line · topic 1", "h": "Above the line or below it", "obra": "practica", "forma": "eleccion", "banco": "linea", "lienzo": "cartaLinea", "q": "The chart prints <b>__CIFRA__</b> here, __COMO__. Where is the seabed?", "pista": "Look for the underline. Underlined means it stands <b>up</b> out of the water; plain means there is water over it.", "cierre": "That is the line, and both sides of it. Next: the three words that get mixed up — height, sounding and depth."}, {"id": "2.S1", "t": "Three distances · topic 2", "h": "The three words that put boats aground", "obra": "cifras2", "p": ["<b>Height. Sounding. Depth.</b> In ordinary speech they are near enough the same word. On a chart they are three different distances, and one of them is not even on the chart.", "You already have two of them. The <b>sounding</b> is the figure you read in the last screen, measured down from the datum. The <b>height of tide</b> is how far the water stands above that same line — and it is the only one that changes while you watch.", "The third is the one you actually float in: the <b>depth of water</b>, the whole column standing over the seabed. It is not printed anywhere, because it depends on the day.", "<em>And a fourth thing that is none of the three:</em> what your echo sounder reads. It measures from its own transducer, somewhere under your hull — so it is not the depth of water either. <b>That one is for the block on what is under the keel</b>, and it is not this one."]}, {"id": "2.E1", "t": "Three distances · topic 2", "h": "Three distances on one picture", "obra": "ejemplo", "pasosDe": "tres", "pasos": ["The <b>height of tide</b>, on the left: from the datum <b>up</b> to the surface. It is what the almanac gives you for a time and a place, and it is the same figure everywhere in the harbour at any one moment.", "The <b>sounding</b>, in the middle: from the datum <b>down</b> to the seabed. That is the figure printed on the paper, and it belongs to that one spot.", "And the <b>depth of water</b>, on the right: from the seabed all the way <b>up to the surface</b>. That is the water you are floating in.", "Look at the three bars. The depth of water is the other two <b>stacked</b>: <b>depth = sounding + height of tide</b>. Nothing else comes into it — no draught, no keel, no boat at all. <em>Just the water and the ground.</em>", "Now <b>drag the water</b>. Two of the three bars move and one does not. The sounding is the paper's and stays put; the height of tide is the day's; and the depth of water is <b>both of them together</b>, so it moves too.", "<b>Whose is each one.</b> The sounding belongs to the chart. The height of tide belongs to the day. The depth of water belongs to the two of them, and it is the only one of the three you can actually run aground in.<br><br>Which means you can name any of the three from a sentence, without a single figure. Try it: <em>&ldquo;it does not change when the tide comes in&rdquo;</em> &mdash; that can only be the <b>sounding</b>, because it is the one printed on the paper. And <em>&ldquo;the same everywhere in the harbour right now&rdquo;</em> is the <b>height of tide</b>: one figure for the whole port at one moment. <b>That is the next screen.</b><br><br><em>And it is still not what is under your keel.</em> That subtraction needs your draught, and that is <b>the block on what is under the keel</b>, not this one."], "cierre": "Now you do it."}, {"id": "2.J1", "t": "Three distances · topic 2", "h": "Move it about and see what happens", "obra": "juego", "p": ["<b>Drag the water up and down, and watch which of the readings on the right does not move.</b> That one is the whole of the last two screens.", "Nothing here is scored. There is no question, nothing to get wrong, and nothing is written down. Type a different figure. Give her a deeper draught. Run her aground as often as you like.", "The one that does not move is the <b>chart figure</b>: it is printed on the paper and the tide cannot touch it. Everything else on that list depends on the day.", "And press the button to turn that same figure from a <b>sounding</b> into a <b>drying height</b>. <em>Same number, other side of the line</em> — watch what it does to the depth of water, and to her."]}, {"id": "2.P1", "t": "Three distances · topic 2", "h": "How much water is under her", "obra": "practica", "forma": "metros", "banco": "columna", "lienzo": "tres", "q": "The chart prints <b>__CIFRA__</b> here, __COMO__, and the height of tide is <b>__ALTURA__ m</b>. What is the depth of water?", "pista": "Look for the underline first. Plain means the seabed is below the datum and the tide <b>adds</b>; underlined means the ground is above it and it comes <b>off</b>.", "cierre": "That is the depth of water — the whole column, from the seabed to the surface. What is left under your keel is that minus your draught, and that is the block on what is under the keel."}, {"id": "2.P2", "t": "Three distances · topic 2", "h": "Which of the three is being described?", "obra": "practica", "forma": "eleccion", "banco": "juicio2", "lienzo": "juicio", "q": "__CASO__ <b>Which of the three is it?</b>", "pista": "One is printed and never moves. One changes through the day and is the same all over the harbour. One changes with the tide <em>and</em> with where you are.", "cierre": "Three words, three distances, and you can tell them apart. Next: the four levels the almanac prints once for the port."}, {"id": "3.S1", "t": "The four levels · topic 3", "h": "Four numbers the almanac prints once", "obra": "cifras3", "p": ["Everything you have read so far changes: the height of tide changes through the day, the depth of water changes with it. Now four numbers that <b>do not</b>. The almanac prints them <b>once for the port</b>, at the head of its page, and they are the same in March as in November.", "They are not predictions. <b>They are averages</b> — what high water and low water come to, on average, on the days of the biggest <b>range</b> and on the days of the smallest. <em>Range</em> is the distance between one high water and the low water beside it: the whole swing, not a height above anything.", "And those two kinds of day have names, because every tide table you ever open is arranged around them. The days of the biggest range are <b>springs</b>; the days of the smallest are <b>neaps</b>. At the end of this part you will watch a fortnight turn from one into the other and back.", "<b>And an average happens to nobody.</b> Next Tuesday high water will not be the average of anything: it will be whatever it is. What these four give you is the <em>shape</em> of the tide at this port — how far up it usually comes, how far down it usually goes, and how much difference there is between a big day and a quiet one.", "Four of them, and you will meet their initials in a moment. <em>The initials come last, on purpose:</em> a set of four capital letters learned before the idea is four capital letters."]}, {"id": "3.E1", "t": "The four levels · topic 3", "h": "Where the four sit on the line", "obra": "ejemplo", "pasosDe": "cuatro", "pasos": ["The two at the top: the average high waters. One for the days of the biggest range, one for the days of the smallest. <b>The big one is higher</b> — that is what a big range means at the top of the tide.", "And the two at the bottom, the average low waters, the same way round: on the days of the biggest range the water goes <b>furthest down</b>. So the big pair sits <b>outside</b> the quiet pair, top and bottom.", "Those are the four figures the almanac prints for this port. Notice they are all <b>above the datum</b> — even the lowest of them. The datum is set at the lowest astronomical tide, and an average low water is not that low.", "The distance between a pair is its <b>range</b>: the outer pair gives the big one, the inner pair the small one. <em>That is the whole difference between a lively day and a quiet one</em>, and it is what the next topic but one is about.", "<b>Now the initials.</b> <em>M</em> for mean, then <em>HW</em> or <em>LW</em>, then <em>S</em> or <em>N</em>. Read them in that order and they say themselves — and their place on the line says the rest: high up top, low below, springs outside neaps."], "cierre": "Now you name them."}, {"id": "3.P1", "t": "The four levels · topic 3", "h": "Which level is that?", "obra": "practica", "forma": "eleccion", "banco": "nivel", "lienzo": "cuatro", "q": "__CASO__ Which of the four is it?", "pista": "Two questions, in order. Is it a <b>high</b> water or a <b>low</b> one — that is the middle letters. And is it the <b>outer</b> of its pair or the <b>inner</b> — outer is springs, inner is neaps.", "cierre": "Four levels, and you can place any of them without looking. Next: the two that never appear in a daily table at all."}, {"id": "4.S1", "t": "The two extremes · topic 4", "h": "The two that never appear in a daily table", "obra": "cifras4", "p": ["Two more levels, and they are of a different kind. The four you have just learned are <b>averages</b>. These two are <b>limits</b>: the highest the tide is ever expected to reach, and the lowest it is ever expected to fall.", "They sit outside the four, top and bottom, and <b>no daily table prints them</b>. You will not find them in the columns for Tuesday: they are properties of the port, not of a day.", "<b>Astronomical</b> is the word that matters in both their names. It means <em>the tide as the sun and moon would make it</em>, with the weather left out. A hard gale or a deep low can put the water above the highest, and a big high-pressure system can hold it below the lowest.", "And there is a third reference on the same chart, measured from neither of these. <b>The elevation of a lighthouse</b> — the height of its light above the sea — is measured up from <b>MHWS</b>. Each of the three answers a different question: the datum for the water under you, HAT for the air over you, and MHWS for how high a light stands.", "<em>So a prediction is a prediction.</em> That is worth carrying: every figure you work out in this module is what the sky says, and the sky is not the only thing pushing the water about. <b>What to do about that is the block on what is under the keel</b>, and it is not this one."]}, {"id": "4.E1", "t": "The two extremes · topic 4", "h": "Why a bridge hangs from the other end", "obra": "ejemplo", "pasosDe": "extremos", "pasos": ["The <b>lowest astronomical tide</b>: the bottom of the bottom, the level the tide is not expected to go below however long you wait. Look where it falls — it is <b>exactly on the datum line</b>.", "And that is not a coincidence in the drawing. <b>The datum is put there on purpose.</b> Set it any higher and the chart would promise water that is not always there; set it lower and every sounding would read deeper than it needs to. So the two are the same line, and the chart writes <b>LAT</b> beside it.", "Now the <b>highest astronomical tide</b>, at the top: the most water the sky alone will ever put over the datum here. It is the other limit, and the same idea the other way up.", "And here is what it is for. A bridge is charted with a <b>vertical clearance</b>, and that figure is measured <b>up from HAT</b> — not from the datum, and not from today's water. <em>It is the air you have on the worst day of the year</em>, so the chart never promises more headroom than there is. Any other day you have more.<br><br>Which is the mirror of the sounding: <b>the chart is pessimistic at both ends.</b> Least water below, least air above."], "cierre": "Now you place them."}, {"id": "4.J1", "t": "The two extremes · topic 4", "h": "Watch what more water does to your mast", "obra": "puente", "p": ["Nothing here is scored. <b>Drag the water up and down</b> and watch the gap between her masthead and the underside of the bridge.", "Every other figure in this part gets <b>better</b> as the tide rises. This one is the exception, and it is the one that takes rigs off boats: <b>more water means less room</b>, because the water lifts her.", "The clearance on the chart is measured up from <b>HAT</b>, so it is the worst case — the least air there will ever be. Almost always there is more. <em>Working out how much is a job for later in the module.</em>"]}, {"id": "4.P1", "t": "The two extremes · topic 4", "h": "Which line does that figure hang from?", "obra": "practica", "forma": "eleccion", "banco": "extremos", "lienzo": "extremos", "q": "__CASO__ <b>Which line is it measured from, and which way?</b>", "pista": "Water and ground both hang from the <b>datum</b> — down for water, up for ground. Air over the sea hangs from <b>HAT</b>. And an elevation on land hangs from <b>MHWS</b>, which is the one nobody tells you about.", "cierre": "Four references on one chart, and you can tell which is which. Next, and last: the one thing in this part that needs a calendar."}, {"id": "5.E1", "t": "Range and the fortnight · topic 5", "h": "Range: the distance between two turns", "obra": "ejemplo", "pasosDe": "curva", "pasos": ["The picture turns. This is no longer a slice through the water at one moment: it is <b>one day</b>, running left to right, with the datum along the bottom. The water comes up to <b>high water</b> and starts back down.", "And down to <b>low water</b>, and up again. Twice each in a day, near enough — which is why the almanac prints four times for most days.", "The <b>range</b> is what separates them: <b>high water minus low water</b>. Not a level, not a depth — <em>a difference</em>. The arrow has a foot on each turn and neither of them is the datum.", "And here is what it is not. That second arrow goes from the <b>datum</b> up to high water: that is the <b>height</b> of high water, and it is a different number. <em>Range is measured between the two turns; height is measured up from the line.</em> Mixing them is the commonest way to read a tide table wrong."], "cierre": "Now you take one off the other."}, {"id": "5.P1", "t": "Range and the fortnight · topic 5", "h": "What is the range that day?", "obra": "practica", "forma": "metros", "banco": "dias", "lienzo": "rango", "q": "High water is <b>__PLEAMAR__ m</b> and low water is <b>__BAJAMAR__ m</b>. <b>What is the range?</b>", "pista": "It is a subtraction between the two turns, and the datum does not come into it at all.", "cierre": "That is the range of one day. Now look at fourteen of them."}, {"id": "5.S1", "t": "Range and the fortnight · topic 5", "h": "The fortnight", "obra": "quincena", "p": ["Fourteen days of Aldern Quay, one after another. <b>Drag along them</b> and watch the range: it grows for about a week, then shrinks for about a week, and then does it again.", "The big ones are <b>springs</b>: the biggest tides of the fortnight, around new and full moon. High water is higher and low water is lower than usual.", "The small ones are <b>neaps</b>: the smallest of the fortnight, around the quarter moons. Less range, so less water at high tide and more at low.", "<em>And notice the times sliding.</em> High water is about fifty minutes later each day — which is why yesterday's tide table is no use to you today. <b>Working out the height at a particular hour is the block on standard port heights</b>; this one only had to teach you what the words mean."]}, {"id": "5.P2", "t": "Range and the fortnight · topic 5", "h": "Springs, neaps, or in between?", "obra": "practica", "forma": "eleccion", "banco": "dias", "lienzo": "quincena", "q": "This day's high water is <b>__PLEAMAR__ m</b> and its low water is <b>__BAJAMAR__ m</b>. <b>Which kind of day is it?</b>", "pista": "Work out its range first, then ask where that sits in the fortnight. <b>Three answers, not two</b> — most days are neither.", "cierre": "Springs, neaps, and the many days that are neither. That is the fortnight."}, {"id": "5.P3", "t": "Range and the fortnight · topic 5", "h": "What you can do now", "obra": "cierre5", "p": ["Fourteen words, and you can place every one of them on the same picture.", "<b>Chart datum</b>, the line everything hangs from, set at <b>LAT</b> so the chart never promises water that is not there. A <b>sounding</b> measured down from it and a <b>drying height</b> measured up. The <b>height of tide</b> on top of the line and the <b>depth of water</b> from the seabed to the surface. The four levels — <b>MHWS, MHWN, MLWN, MLWS</b> — that the almanac prints once for the port. <b>HAT</b> at the top, where a bridge hangs its clearance from. And the <b>range</b>, which tells you whether today is <b>springs</b> or <b>neaps</b>.", "<em>Every figure on a chart now has an address.</em> You know what it is measured from and which way, and that is the whole of this block — because a number without its reference is not information.", "<b>Next: the almanac page.</b> Which port, which day, and what that line at the top of the table means about the hour its figures are in."]}];

const FONDO_MAX=Math.max.apply(null,
 LINEA.filter(r=>!r.seca).map(r=>r.cifra).concat([APERTURA.sonda]))+1.2;

const TECHO_MAX=Math.max(ORILLA, NIVELES.HAT,

   .concat([APERTURA.seca])))+0.8;

 const alto=HOJA.y0+px(10+TAM.rot+14);
 ZTOP=TECHO_MAX; ZBOT=-FONDO_MAX;
 VESC=(pie-alto)/(ZTOP-ZBOT);
 CERO=alto+ZTOP*VESC;
 return {pie:pie, alto:alto};}
const zY=z=>CERO-z*VESC;

function agua(){

  fill:"url(#gAgua)",class:"agua"});
 let d="";
 for(let x=x0;x<=x1;x+=px(4)){
  const yy=y+Math.sin(x*0.07*ESC)*px(1.8)+Math.sin(x*0.021*ESC)*px(1.2);
  d+=(d?"L":"M")+x.toFixed(1)+","+yy.toFixed(1);}

const PERFIL=[[0.00,"canal"],[0.26,"canal"],[0.44,"talud"],[0.58,"subida"],
              [0.66,"llano"],[0.80,"llano"],[0.90,"medio"],[1.00,"orilla"]];
function zPerfil(f,sonda,seca){
 const z=q=>({canal:-sonda, talud:-sonda*0.45, subida:seca*0.55, llano:seca,
              medio:(seca+ORILLA)/2, orilla:ORILLA})[q];
 if(f<=0)return z("canal");
 for(let k=1;k<PERFIL.length;k++){
  const [fa,qa]=PERFIL[k-1], [fb,qb]=PERFIL[k];
  if(f<=fb){ const u=(f-fa)/(fb-fa||1); return z(qa)+(z(qb)-z(qa))*u; }}
 return z("orilla");}

function fondo(sonda,seca){
 const x0=HOJA.x0+px(2), x1=HOJA.x1-px(2), an=x1-x0;
 const p=PERFIL.map(([f])=>[x0+an*f, zY(zPerfil(f,sonda,seca))])
   .concat([[x1,HOJA.y1-px(2)],[x0,HOJA.y1-px(2)]]);
 const d="M"+p.map(q=>q[0].toFixed(2)+","+q[1].toFixed(2)).join("L")+"Z";
 el("path",{d:d,fill:"url(#tramaTierra)"});

 const b="M"+p.slice(0,PERFIL.length).map(q=>q[0].toFixed(2)+","+q[1].toFixed(2))
   .join("L");
 el("path",{d:b,fill:"none",stroke:COL.tierraRaya,"stroke-width":px(1.8)});

 return {xSonda:x0+an*0.13, ySonda:zY(-sonda), xSeca:x0+an*0.73, ySeca:zY(seca),
         xOrilla:x1, yOrilla:zY(ORILLA)};}

function pildora(x,y,s,col,an){
 const tam=TAM.dato, w=anchoTxt(s,px(tam))+px(16), h=px(tam)+px(9);
 el("rect",{x:x-(an=="end"?w:0),y:y-h/2,width:w,height:h,rx:h/2,

function cota(x,z,val,seca,resalta){
 const y=zY(z), col=resalta?COL.rojo:COL.escrito;
 const g=px(resalta?2.6:1.8);
 el("line",{x1:x,y1:CERO,x2:x,y2:y,stroke:col,"stroke-width":g});
 const t=px(5);
 for(const yy of [CERO,y])
  el("line",{x1:x-t,y1:yy,x2:x+t,y2:yy,stroke:col,"stroke-width":g});

 const yc=y + (y<CERO ? px(11) : -px(11));

 const w=anchoTxt(un(val),px(TAM.dato))+px(16);
 const cabeDerecha=(x+px(9)+w)<=(HOJA.x1-px(8));
 const xp=cabeDerecha ? x+px(9) : x-px(9);
 pildora(xp,yc,un(val),col,cabeDerecha?undefined:"end");

 if(seca){
  const a=cabeDerecha ? xp : xp-w;
  el("line",{x1:a+px(6),y1:yc+px(TAM.dato*0.62),
   x2:a+w-px(6),y2:yc+px(TAM.dato*0.62),
   stroke:"#FFFFFF","stroke-width":px(1.4)});}
 return {x:x,y:yc};}

function flecha(x,y0,y1,val,col,etq,resalta,mudo){
 const g=px(resalta?2.6:1.8);
 el("line",{x1:x,y1:y0,x2:x,y2:y1,stroke:col,"stroke-width":g});
 const t=px(5);
 for(const yy of [y0,y1])
  el("line",{x1:x-t,y1:yy,x2:x+t,y2:yy,stroke:col,"stroke-width":g});
 const yc=(y0+y1)/2;

 if(mudo)return yc;
 const w=anchoTxt(un(val),px(TAM.dato))+px(16);
 const cabe=(x+px(9)+w)<=(HOJA.x1-px(8));
 pildora(cabe?x+px(9):x-px(9),yc,un(val),col,cabe?undefined:"end");
 if(etq){

  const medio=anchoTxt(etq,px(TAM.rot))/2+px(4);

  const cuerpo=px(TAM.rot);
  const ex=Math.max(HOJA.x0+px(4)+cuerpo*0.78,
                    Math.min(HOJA.x1-px(4)-cuerpo*0.24,x-px(11)));
  const ey=Math.max(HOJA.y0+medio,Math.min(HOJA.y1-medio,yc));
  const e=rotulo(ex,ey,etq,col,"middle");
  e.setAttribute("transform","rotate(-90 "+ex.toFixed(1)+" "+ey.toFixed(1)+")");}
 return yc;}

   o.mudo?"":(o.seca?"drying height":"sounding"),o.resalta=="cifra",o.mudo);

function cortaPoli(pts,x0,y0,x1,y1){
 const dentro=(p,b)=>b==0?p[0]>=x0:b==1?p[0]<=x1:b==2?p[1]>=y0:p[1]<=y1;
 const cruce=(a,b,bd)=>{
  if(bd<2){const xr=bd==0?x0:x1, k=(xr-a[0])/(b[0]-a[0]);
   return [xr,a[1]+k*(b[1]-a[1])];}
  const yr=bd==2?y0:y1, k=(yr-a[1])/(b[1]-a[1]);
  return [a[0]+k*(b[0]-a[0]),yr];};
 for(let b=0;b<4;b++){
  if(!pts.length)return [];
  const sale=[];
  for(let i=0;i<pts.length;i++){
   const a=pts[(i+pts.length-1)%pts.length], c=pts[i];
   const da=dentro(a,b), dc=dentro(c,b);
   if(dc){ if(!da)sale.push(cruce(a,c,b)); sale.push(c); }
   else if(da)sale.push(cruce(a,c,b));}
  pts=sale;}
 return pts;}

function cortaLinea(pts,x0,y0,x1,y1){
 const dentro=p=>p[0]>=x0&&p[0]<=x1&&p[1]>=y0&&p[1]<=y1;
 const out=[]; let act=[];
 for(const p of pts){
  if(dentro(p))act.push(p);
  else { if(act.length>1)out.push(act); act=[]; }}
 if(act.length>1)out.push(act);
 return out;}

 d.setAttribute("font-size",tam*0.62); d.setAttribute("dy",tam*0.19);
 d.textContent=s[1]; e.appendChild(d);
 if(seca){const w=tam*0.62;
  el("line",{x1:x-w*0.62,y1:y+tam*0.52,x2:x+w*0.72,y2:y+tam*0.52,

 return e;}

function laminaCarta(){
 laminaMaqueta();

 const k=(x1-x0)/CARTA.lado;
 const cx=(x0+x1)/2, cy=(y0+y1)/2;
 const P=p=>[cx+p[0]*k, cy+p[1]*k];
 const dP=l=>l.map(P);
 const D=(a)=>a.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");

 el("rect",{x:x0,y:y0,width:x1-x0,height:y1-y0,fill:"#FFFFFF"});
 for(const m of CARTA.manchas){
  let d="";
  for(const aro of m.aros){
   const r=cortaPoli(dP(aro),x0,y0,x1,y1);
   if(r.length>2)d+="M"+D(r)+"Z";}
  if(d)el("path",{d:d,fill:m.col,"fill-rule":"evenodd"});}

 for(const [capa,gr,op] of [["veril5",1.0,.45],["veril2",1.0,.55],

  for(const l of (CARTA.lineas[capa]||[])){
   for(const tr of cortaLinea(dP(l),x0,y0,x1,y1))
    el("polyline",{points:D(tr),fill:"none",stroke:TINTA.linea,
     "stroke-width":px(gr),"stroke-linejoin":"round","stroke-opacity":op});}}

 const mX=tam*0.70, mY=tam*0.45;
 let puestas=0;
 for(const c of CARTA.cifras){

  if(p[0]<x0+mX||p[0]>x1-mX||p[1]<y0+mY||p[1]>y1-mY)continue;
  cifraCarta(p[0],p[1],c.v,c.seca,tam);
  puestas++;}
 CARTA.puestas=puestas;

 const q=CARTA.caja, c0=P([q.x,q.y]);
 el("rect",{x:c0[0]-q.an*k/2,y:c0[1]-q.al*k/2,width:q.an*k,height:q.al*k,

 el("line",{x1:bx,y1:by,x2:bx+barra,y2:by,stroke:TINTA.linea,

 el("line",{x1:bx,y1:by-px(4),x2:bx,y2:by+px(4),stroke:TINTA.linea,

 el("line",{x1:bx+barra,y1:by-px(4),x2:bx+barra,y2:by+px(4),stroke:TINTA.linea,
  "stroke-width":px(2.2)});
 txt(bx,by-px(7),(barra/milla).toFixed(2).replace(/0+$/,"")+" M",undefined,
  TAM.rot,TINTA.letra,500,FUENTE.palo);
 }

function lecturas(x,y,filas){

let QCERO=0, QESC=1;
function curvaMaqueta(){
 const pie=HOJA.y1-px(14+TAM.rot+10);
 const alto=HOJA.y0+px(10+TAM.rot+14);
 const techo=Math.max.apply(null,DIAS.map(d=>d.pleamar))+0.8;
 QESC=(pie-alto)/techo;
 QCERO=pie;
 return {pie:pie, alto:alto, techo:techo};}
const qY=z=>QCERO-z*QESC;

function alturaEn(dia,hora){
 const f=FORMA[dia]; if(!f)return 0;
 const x=hora/PASO_H, i=Math.floor(x);
 if(i>=f.length-1)return f[f.length-1];
 return f[i]+(f[i+1]-f[i])*(x-i);}

function unDia(x0,x1,d,o){
 o=o||{};
 let dd="";

 for(let k=0;k<=96;k++){
  const u=k/96;
  const z=alturaEn(d.dia, u*24);
  const x=x0+(x1-x0)*u, y=qY(z);
  dd+=(dd?"L":"M")+x.toFixed(1)+","+y.toFixed(1);}

 el("path",{d:dd+"L"+x1.toFixed(1)+","+QCERO.toFixed(1)
   +"L"+x0.toFixed(1)+","+QCERO.toFixed(1)+"Z",
  fill:"url(#gAgua)",opacity:o.apagado?.35:1});
 el("path",{d:dd,fill:"none",stroke:COL.aguaH,
  "stroke-width":px(o.resalta?2.4:1.4),opacity:o.apagado?.4:1});
 return {x0:x0,x1:x1};}

function cotaRango(x,d,resalta){

function laminaPuente(){
 const pie=HOJA.y1-px(14+TAM.rot+10);
 const alto=HOJA.y0+px(10+TAM.rot+14);
 ZTOP=TECHO_P; ZBOT=SUELO_P;
 VESC=(pie-alto)/(ZTOP-ZBOT);
 CERO=alto+ZTOP*VESC;
 return {pie:pie, alto:alto};}

const N4=[["MHWS","mean high water springs"],
          ["MHWN","mean high water neaps"],
          ["MLWN","mean low water neaps"],
          ["MLWS","mean low water springs"]];

function cuatroNiveles(o){
 o=o||{};
 const x0=HOJA.x0+px(2), x1=HOJA.x1-px(2);

 const cuales=o.cuales||N4.map(x=>x[0]);

 let corto=!!o.siglas;
 if(!corto&&o.rotula){
  let peor=0;
  for(const [k,largo] of N4){
   if(cuales.indexOf(k)<0)continue;
   peor=Math.max(peor,anchoTxt(largo,px(TAM.rot))+largo.length*px(1.4)
     +anchoTxt("0.00",px(TAM.dato))+px(34));}
  corto=(2*peor>(x1-x0));}
 for(const [k,largo] of N4){
  if(cuales.indexOf(k)<0)continue;
  const z=NIVELES[k], y=zY(z);
  const suyo=(o.solo===k), apagado=(o.solo&&!suyo);
  const col=suyo?COL.rojo:(apagado?COL.rayaPapel:COL.suave);
  el("line",{x1:x0,y1:y,x2:x1,y2:y,stroke:col,
   "stroke-width":px(suyo?2.2:1),
   "stroke-dasharray":px(4)+" "+px(3)});

  const txt=corto?k:largo;

  const arriba=N4.map(x=>x[0]).filter(kk=>cuales.indexOf(kk)>=0)
    .filter(kk=>NIVELES[kk]>z).map(kk=>zY(NIVELES[kk]));
  const pegado=arriba.some(yy=>Math.abs(yy-y)<px(17));
  const an=anchoTxt(txt,px(TAM.rot))+txt.length*px(1.4)+px(12);
  if(pegado){

   if(o.cifras&&!apagado)pildora(x1-px(10),y-px(9),z.toFixed(2),col,"end");
   if(o.rotula&&!apagado)
    rotulo(x1-px(10)-anchoTxt(z.toFixed(2),px(TAM.dato))-px(22),y-px(6),txt,col,
     "end");}
  else{
   if(o.rotula&&!apagado)rotulo(x0+px(10),y-px(6),txt,col);
   if(o.cifras&&!apagado)
    pildora(o.rotula?x0+px(10)+an:x1-px(10),y-px(9),z.toFixed(2),col,
     o.rotula?undefined:"end");}}

 if(o.vaivenes){
  const xv=x0+(x1-x0)*0.62, xm=x0+(x1-x0)*0.76;
  flecha(xv,zY(NIVELES.MHWS),zY(NIVELES.MLWS),
   NIVELES.MHWS-NIVELES.MLWS,COL.magenta,"spring range");
  flecha(xm,zY(NIVELES.MHWN),zY(NIVELES.MLWN),
   NIVELES.MHWN-NIVELES.MLWN,COL.magentaS,"neap range");}}

 agua();

 const x0=HOJA.x0+px(12), x1=HOJA.x1-px(12);

 el("line",{x1:HOJA.x0+px(2),y1:QCERO,x2:HOJA.x1-px(2),y2:QCERO,

 if(o.uno)

 if(o.uno){

function semillaDe(s){let h=2166136261>>>0;
 for(let i=0;i<s.length;i++){h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0;}
 return h||1;}
function tiradaDe(s){let R=semillaDe(s);
 return ()=>{R^=R<<13; R>>>=0; R^=R>>>17; R^=R<<5; R>>>=0; return R/4294967296;};}

function opsDe(q){

 if(q.clase!==undefined){
  return CLASES.map((x,i)=>({t:x[1],ok:x[0]===q.clase?1:0,k:i}));}
 if(q.deCarta!==undefined){
  return REF4.map((x,i)=>({t:x[1],ok:x[0]===q.n?1:0,k:i}));}
 if(q.via!==undefined){
  return N4.map((x,i)=>({t:"<b>"+x[0]+"</b> · "+x[1],ok:x[0]===q.n?1:0,k:i}));}
 if(q.n!==undefined){
  const r=tiradaDe("j2-"+q.id);
  const o=TRES.map((x,i)=>({t:x[1],ok:x[0]===q.n?1:0,k:i}));
  for(let i=o.length-1;i>0;i--){const j=Math.floor(r()*(i+1));
   const z=o[i]; o[i]=o[j]; o[j]=z;}
  return o;}
 const base=q.seca
  ? [[un(q.cifra)+" m <b>above</b> chart datum",1],
     [un(q.cifra)+" m <b>below</b> chart datum",0],
     [un(q.cifra)+" m below the <b>surface</b>",0],
     [un(q.cifra)+" m above the <b>surface</b>",0]]
  : [[un(q.cifra)+" m <b>below</b> chart datum",1],
     [un(q.cifra)+" m <b>above</b> chart datum",0],
     [un(q.cifra)+" m below the <b>surface</b>",0],
     [un(q.cifra)+" m below the <b>keel</b>",0]];
 const r=tiradaDe("ops-"+q.id);
 const o=base.map((x,i)=>({t:x[0],ok:x[1],k:i}));
 for(let i=o.length-1;i>0;i--){const j=Math.floor(r()*(i+1));
  const t=o[i]; o[i]=o[j]; o[j]=t;}
 return o;}

const EST={};
function guardaEst(){const s=S(); if(!s)return;
 EST[s.id]={EJ:{i:EJ.i}, PR2:{q:PR2.q,n:PR2.n,meta:PR2.meta,fallos:PR2.fallos,
  esp:PR2.esp,hecho:PR2.hecho}, PRFB:PRFB, MAREA:MAREA};}
function ponEst(){const s=S(); if(!s)return;
 const e=EST[s.id];
 if(e){ EJ={i:e.EJ.i}; PR2=Object.assign({},e.PR2); PRFB=e.PRFB;
        if(e.MAREA!==undefined)MAREA=e.MAREA; return; }
 EJ={i:0}; PRFB="";
 PR2={q:null,n:0,meta:2,fallos:0,esp:false,hecho:false};
 MAREA=4.0;
 if(s.obra=="practica")prNuevo();}

let TIRA=false;
const seArrastra=()=>{const s=S();

 if(s&&s.obra=="quincena")return true;
 if(s&&s.obra=="juego")return true;
 if(s&&s.obra=="puente")return true;
 if(!s||s.obra!="ejemplo")return false;
 return !!PASO().ensena.tira;};

function aMarea(e){
 const r=svg.getBoundingClientRect(), s=esc();
 const y=(e.clientY-r.top-(r.height-D.H*s)/2)/s;
 const z=(CERO-y)/VESC;
 return Math.max(0, Math.min(NIVELES.HAT, Math.round(z*10)/10));}

function aDia(e){
 const r=svg.getBoundingClientRect(), s=esc();
 const x=(e.clientX-r.left-(r.width-D.W*s)/2)/s;
 const x0=HOJA.x0+px(12), x1=HOJA.x1-px(12);
 const u=(x-x0)/Math.max(1,(x1-x0));
 return Math.max(0, Math.min(DIAS.length-1, Math.floor(u*DIAS.length)));}
function mueveAgua(e){
 const s=S();
 if(s&&s.obra=="quincena"){ QDIA=aDia(e); pinta(); return; }
 MAREA=aMarea(e); pinta(); refrescaLecturas(); }
svg.addEventListener("pointerdown",e=>{ if(!seArrastra())return;
 TIRA=true; e.preventDefault&&e.preventDefault(); mueveAgua(e);});
svg.addEventListener("pointermove",e=>{ if(TIRA&&seArrastra())mueveAgua(e);});
svg.addEventListener("pointerup",()=>{TIRA=false;});
svg.addEventListener("pointercancel",()=>{TIRA=false;});

function pinta(){
 svg.setAttribute("viewBox","0 0 "+D.W+" "+D.H);
 svg.setAttribute("preserveAspectRatio","xMidYMid meet");
 ESC=esc();
 while(svg.firstChild)svg.removeChild(svg.firstChild);
 gO=el("g",{},svg);
 maqueta();
 defs();
 fondoConsola();
 lamina();
 const s=S();
 if(s&&s.obra=="puente"){ puenteJuego(); }
 else if(s&&s.obra=="juego")juego();
 else if(s&&s.obra=="cifras")laminaCarta();
 else if(s&&s.obra=="cartaLinea")laminaCartaLinea();
 else if(s&&s.obra=="cifras2")tresEnmarca();
 else if(s&&s.obra=="cifras3")cuatroEnmarca();
 else if(s&&s.obra=="cifras4")extremosEnmarca();
 else if(s&&s.obra=="quincena")laQuincena({uno:1});

 else if(s&&s.obra=="cierre5"){
  MAREA=Math.round(((NIVELES.MHWN+NIVELES.MLWN)/2)*10)/10;

  corte({linea:1, sondaCota:1, secaCota:1, ceroDerecha:true, ceroAbajo:true,
   barco:false,
   titulo:"every figure on a chart has an address"});
  cuatroNiveles({rotula:1, siglas:1, cifras:0});
  extremos({hat:1, lat:0, siglas:1, derecha:1});}
 else if(s&&s.obra=="ejemplo")ejemplo();
 else if(s&&s.obra=="practica")practica();
 else corte({linea:1,sondaCota:1,secaCota:1});
 marco();}

const TOT=20;
function prog(){
 marcoChrome();const d=document.getElementById("prog"); if(!d)return;
 d.innerHTML="";
 for(let i=0;i<TOT;i++){const b=document.createElement("i");
  b.className=i<iP?"done":i==iP?"on":"";
  if(i<PZ.length){
  b.title="Screen "+(i+1)+" of "+TOT+" · "+PZ[i].h;
                   b.onclick=()=>{guardaEst(); iP=i; dibuja();}; }
  else { b.title="not built yet"; b.style.opacity=".3"; }
  d.appendChild(b);}
 const h=document.getElementById("hTit");
 if(h)h.textContent = iP<PZ.length
  ? "Screen "+(iP+1)+" of "+TOT
  : "Screen "+PZ.length+" of "+TOT+" built";}

window.atras=()=>{ if(iP<=0)return; guardaEst(); iP--; dibuja(); };
function navHTML(hayAtras,etq){
 return '<div class="nav">'
  +(hayAtras?'<button class="sec" id="btA" onclick="atras()">Back</button>':'')
  +'<button id="btV">'+etq+'</button></div>';}

window.ejSig=()=>{ const s=S();
 if(s&&EJ.i<PASOSDE(s).length-1){EJ.i++; dibuja();} };
window.ejAtras=()=>{ if(EJ.i>0){EJ.i--; dibuja();} };

function filasLectura(){
 if(!VIVO||VIVO.marea===undefined)return "";
 const F=VIVO.puente

  ? [["height of tide",un(VIVO.marea)+" m",0],
     ["her air draught",un(VIVO.palo)+" m",0],
     ["under the bridge",VIVO.golpe?"no room":"she goes through",VIVO.golpe]]
  : [["height of tide",un(VIVO.marea)+" m",0],
     [VIVO.seca?"drying height":"sounding",un(VIVO.cifra)+" m",0],
     ["depth of water",un(VIVO.prof)+" m",0],
     ["her draught",un(VIVO.calado)+" m",0],
     ["on the bottom",VIVO.toca?"aground":"afloat",VIVO.toca]];
 return F.map(f=>
  '<dt>'+f[0]+'</dt><dd'+(f[2]?' class="mal"':'')+'>'+f[1]+'</dd>').join("");}
function lecturasHTML(){
 const f=filasLectura();
 return f? '<dl class="lect" id="lect">'+f+'</dl>' : "";}

function refrescaLecturas(){
 const n=document.getElementById("lect");
 if(n)n.innerHTML=filasLectura();}

function panel(){
 const s=S(), p=pane();
 if(!s){ fin(); return; }
 let h='<div class="hd"><h3>'+s.t+'</h3>';
 if(seContesta(s)&&!PR2.hecho)h+='<a class="skip" onclick="salta()">Skip</a>';
 h+='</div><h2>'+s.h+'</h2>';

 if(s.obra=="cifras"||s.obra=="cifras2"||s.obra=="cifras3"||s.obra=="cifras4"
    ||s.obra=="quincena"||s.obra=="cierre5"){
  h+=s.p.map(x=>'<p>'+x+'</p>').join("");
  h+=navHTML(iP>0,"Next");}

 else if(s.obra=="puente"){
  h+=s.p.map(x=>'<p>'+x+'</p>').join("");
  h+=lecturasHTML();
  h+=navHTML(iP>0,"Next");}

 else if(s.obra=="juego"){

  h+=s.p.map(x=>'<p>'+x+'</p>').join("");
  h+='<div class="crow">'
   +'<button class="sec" onclick="jFija(\'seca\')">'
   +(JUEGO.seca?"it is a drying height \u2014 make it a sounding"
               :"it is a sounding \u2014 make it a drying height")+'</button></div>';
  h+='<div class="crow">'
   +'<span class="prl">chart figure</span>'
   +'<input id="jCifra" inputmode="decimal" value="'+un(JUEGO.cifra)+'" '
   +'oninput="jFija(\'cifra\',this.value)" style="width:74px;padding:7px 9px;'

   +'border-radius:3px;border:1px solid var(--ink-soft);background:var(--paper2);'
   +'border-bottom:2px solid var(--ink-soft);'
   +'color:var(--ink);font:600 14px var(--f-mono);text-align:center">'
   +'<span class="prl">her draught</span>'
   +'<input id="jCalado" inputmode="decimal" value="'+un(JUEGO.calado)+'" '
   +'oninput="jFija(\'calado\',this.value)" style="width:74px;padding:7px 9px;'

   +'border-radius:3px;border:1px solid var(--ink-soft);background:var(--paper2);'
   +'border-bottom:2px solid var(--ink-soft);'
   +'color:var(--ink);font:600 14px var(--f-mono);text-align:center">'
   +'</div>';
  h+=lecturasHTML();
  h+=navHTML(iP>0,"Next");}

 else if(s.obra=="ejemplo"){
  const P=PASO(), PS=PASOSDE(s);
  h+='<p class="prl">STEP '+(EJ.i+1)+' OF '+PS.length+' · '
   +P.n.toUpperCase()+'</p>';
  h+='<p>'+s.pasos[EJ.i]+'</p>';
  const ultimo=EJ.i==PS.length-1;
  h+='<div class="nav">'
   +'<button class="sec" onclick="'+(EJ.i===0?"atras()":"ejAtras()")+'">Back</button>'
   +'<button id="btV">'+(ultimo?"Next":"Next step")+'</button></div>';}

 else if(s.obra=="practica"){
  const q=PR2.q;
  if(PR2.hecho){
   h+='<p>'+s.cierre+'</p>'+navHTML(iP>0,"Next");}
  else if(q){
   h+='<p><b class="q">'+String(s.q)
      .replace("__CIFRA__",un(q.cifra===undefined?0:q.cifra))
      .replace("__COMO__",q.seca?"with a line under it":"with no line under it")
      .replace("__ALTURA__",un(q.altura===undefined?0:q.altura))
      .replace("__CASO__",String(q.txt||""))
      .replace("__PLEAMAR__",un(q.pleamar===undefined?0:q.pleamar))
      .replace("__BAJAMAR__",un(q.bajamar===undefined?0:q.bajamar))
      +'</b></p>';
   if(s.forma=="metros"){
    h+='<div class="crow"><input id="prIn" inputmode="decimal" '
     +'placeholder="'+forma(s).eg+'" style="width:90px;padding:9px 11px;'
     +'border-radius:3px;border:1px solid var(--paper-line);background:var(--paper);'
     +'color:var(--ink);font:600 15px var(--f-mono);text-align:center">'
     +'<span class="prl">metres</span>'
     +'<button onclick="compruebo()">Check</button></div>';}
   else
    h+='<div class="crow ops">'
     +opsDe(q).map((o,i)=>'<button onclick="compruebo(\''+i+'\')">'+o.t+'</button>')
       .join("")
     +'</div>';
   h+=PRFB;
   if(PR2.esp)h+='<div class="nav"><button id="btV">Next problem</button></div>';
   else h+='<p class="prl">'+PR2.n+' OF '+PR2.meta+' DONE</p>';
   if(iP>0&&!PR2.esp)h+='<div class="nav">'
    +'<button class="sec" onclick="atras()">Back</button></div>';}}

 p.innerHTML=h;

 const b=document.getElementById("btV");
 if(b)b.onclick=
  (s.obra=="ejemplo"&&EJ.i<PASOSDE(s).length-1) ? ()=>{ ejSig(); }
  : (s.obra=="practica"&&PR2.esp)          ? ()=>{ prSigue(); }
  : ()=>{ guardaEst(); iP++; dibuja(); };
 prog();}

let ENTRADA=null;
function dibuja(){ guardaDonde(iP);
 if(iP>=PZ.length){ prog(); fin(); return; }
 const s=S();

 if(ENTRADA!==s.id){ ENTRADA=s.id; ponEst();
  if(typeof window.scrollTo==="function") window.scrollTo(0,0);
  const pn=document.getElementById("pane"); if(pn) pn.scrollTop=0; }
 pinta();
 panel();}

function fin(){
 pinta();
 const p=pane();

 const faltan=TOT-PZ.length;
 p.innerHTML='<h3>'+(faltan?'End of what is built':'End of the part')+'</h3>'
  +'<h2>'+PZ.length+' of '+TOT+' screens</h2>'
  +(faltan
    ? '<p>The definitions block is <b>'+faltan+' screens short</b> of finished, '
      +'and there is nothing after this one yet.</p>'
    : '<p><b>The definitions block is complete.</b> Seven words, and every figure '
      +'on a chart now has an address. There is nothing after this one <em>in this '
      +'part</em> — the almanac page is the next block.</p>')

  +`<div class="calc"><b>Next: Standard port heights.</b><br> The almanac page and the tidal curve, walked forwards and backwards.</div>`
  +'<div class="nav">'
  +'<button class="sec" onclick="atras()">Back</button>'
  +'<button id="btV">Back to the last screen</button><button data-va=m04-p2-standard-port-heights.html onclick=location.assign(this.dataset.va)>Next: Standard port heights &#8594;</button></div>';
 const b=document.getElementById("btV");
 if(b)b.onclick=()=>{ iP=PZ.length-1; dibuja(); };}

const YO = "m04-p1-definitions.html";
function guardaDonde(i){ vistoPon(YO, i); }
function donde(){ return vistoPos(YO, PZ.length-1); }

function deCero(){ vistoOlvida(YO); iP=0; dibuja(); }

iP=donde();
dibuja();

function marcoChrome(){
 try{
  const t = (typeof PZ !== "undefined" && PZ.length) ? PZ.length
          : (typeof TOT !== "undefined" ? TOT : 0);
  const i = (typeof iP !== "undefined") ? iP
          : ((typeof paso !== "undefined" && paso && typeof paso.p === "number") ? paso.p : 0);
  const dc = n => (n < 10 ? "0" : "") + n;
  const b = document.getElementById("barCont");
  if (b && t) b.textContent = dc(i + 1) + " / " + dc(t);
  const f = document.getElementById("ficha");
  if (f && f.style && f.style.setProperty
      && typeof D !== "undefined" && D && D.W && D.H)
    f.style.setProperty("--ar", D.W + " / " + D.H);
 }catch(e){}
}

var MUESTRA = null;
window.showme = function () {
  var s = S(), z = s.show || {};
  if (typeof showmeBanco === "function" && showmeBanco(s, z)) return;
  if (typeof guarda === "function") guarda("showme", null, false);
  if (typeof VER !== "undefined") VER = s.show ? z : null;
  MUESTRA = null;
  var txt = z.txt || "";
  if (typeof muestraSolucion === "function") { var t = muestraSolucion(s, z); if (t != null) txt = t; }
  else if (!s.show) txt = muestraComun(s);
  else muestraCampos(s);
  hecho = true;
  if (typeof capa === "function") capa();

  var d = document.getElementById("fb");
  if (d) d.innerHTML = '<div class="res ver"><b>Here it is.</b>' + (txt ? '<div class="porque">' + txt + '</div>' : "") + '</div>';
  nav(true, "Try the next one");
};

function muestraCampos(s) {
  var h = "";
  (s.campos || []).forEach(function (c, i) {
    if (c.val == null) return;
    var e = document.getElementById("c" + i);
    var v = c.hora ? String(c.val) : (typeof c.val === "number" ? (c.ang ? String(Math.round(c.val) % 360).padStart(3, "0") : String(c.val)) : String(c.val));
    if (e) { e.value = v; e.disabled = true; }
    h += "<br><b>" + c.etq + " " + v + (c.ud ? " " + c.ud.replace(/<[^>]*>/g, "") : "") + "</b>" + (c.por ? " &mdash; " + c.por : "");
  });
  return h;
}

function respuestaDe(ck, max) {
  var bien = [];
  for (var v = 0; v <= max; v++) { var r = null; try { r = ck(v); } catch (e) {} if (r && r.ok) bien.push(v); }
  return bien.length ? bien[Math.floor(bien.length / 2)] : null;
}
function muestraComun(s) {
  if (s.sep) {
    MUESTRA = {p: s.sep, t: s.nombreBien || "here"};

    return "The right place is the <b>green mark</b> on the chart" + (s.nombreBien ? ": " + s.nombreBien : "") + "."
      + ((s.cuenta || []).length ? " The working is the one above." : "");
  }
  if (s.o) {
    var i = -1; s.o.forEach(function (o, j) { if (o.ok) i = j; }); if (i < 0) return "";
    var bs = typeof document.querySelectorAll === "function" ? document.querySelectorAll("#pane button.opt") : [];
    if (bs[i]) { if (bs[i].classList) bs[i].classList.add("elegida"); else bs[i].className += " elegida"; }
    return "<b>" + s.o[i].t + "</b>. " + (s.o[i].m || "");
  }
  if (s.campos && s.campos.some(function (c) { return c.val != null; })) return muestraCampos(s);
  if (typeof s.ck === "function") {
    var v = respuestaDe(s.ck, s.ph == "ddd" ? 359 : 999); if (v == null) return "";
    var e = typeof document.querySelector === "function" ? document.querySelector("#pane input") : null, w = s.ph == "ddd" ? String(v).padStart(3, "0") : String(v);
    if (e) { e.value = w; e.disabled = true; }
    return "<b>" + w + (s.un ? " " + s.un : "") + "</b>." + (s.calc ? '<div class="calc">' + s.calc + "</div>" : "")
      + ((s.cuenta || []).length ? "<br>" + s.cuenta.join("<br>") : "");
  }
  return "";
}

window.reintenta = function () {
  var s = S();
  if (typeof EST !== "undefined") delete EST[s.id];
  if (typeof FALLO !== "undefined") delete FALLO[s.id];
  if (typeof MED !== "undefined") delete MED[s.id];
  if (typeof VER !== "undefined") VER = null;
  MUESTRA = null;
  if (typeof alReintentar === "function") alReintentar(s);
  if (typeof ponEst === "function") ponEst();
  pinta();
};

(function () {
  if (typeof nav !== "function") return;
  var n0 = nav;
  nav = function () {
    var r = n0.apply(this, arguments), s = S(), d = document.getElementById("nav");

    if (d && s && /[.]P[0-9]/.test(s.id || "") && typeof hecho !== "undefined" && hecho && !s.sinAyuda
        && String(d.innerHTML || "").indexOf("otraVez") < 0) {
      var html = '<button class="sec otraVez" onclick="reintenta()">Try again</button>';
      var tras = typeof d.querySelector === "function" ? d.querySelector("button.sec") : null;
      if (tras && typeof tras.insertAdjacentHTML === "function") tras.insertAdjacentHTML("afterend", html);
      else d.innerHTML = html + String(d.innerHTML || "");
    }
    return r;
  };

  if (typeof ponEst === "function") { var p0 = ponEst; ponEst = function () { MUESTRA = null; return p0.apply(this, arguments); }; }
})();

var SALTADAS = {};
(function () {
  var idDe = function () { try { var s = S(); return s && s.id; } catch (e) { return null; } };
  var vacia = function (o) { if (o && typeof o === "object") for (var k in o) delete o[k]; };

  if (typeof window.salta === "function") {
    var s0 = window.salta;
    window.salta = function () { var id = idDe(); if (id) SALTADAS[id] = true;
      var r = s0.apply(this, arguments);
      if (id && idDe() === id && typeof hecho !== "undefined" && hecho === true) hecho = false;
      return r; };
  }
  if (typeof nav === "function") {
    var n0 = nav;
    nav = function (next, txt) { var id = idDe(); if (id && SALTADAS[id]) next = true;
      return n0.call(this, next, txt); };
  }
  if (typeof guarda === "function") {
    var g0 = guarda;
    guarda = function (t, r, ok) { if (ok === true) { var id = idDe(); if (id) delete SALTADAS[id]; }
      return g0.apply(this, arguments); };
  }
  if (typeof anota === "function") {
    var a0 = anota;
    anota = function (v, ok) { if (ok === true) { var id = idDe(); if (id) delete SALTADAS[id]; }
      return a0.apply(this, arguments); };
  }
  var sinHacer = function () {
    if (typeof hecho !== "undefined") hecho = false;
    if (typeof PR !== "undefined" && PR) { PR.hecho = false; PR.saltada = false; }
    if (typeof PR2 !== "undefined" && PR2) { PR2.hecho = false; }
  };
  if (typeof ponEst === "function") {
    var p0 = ponEst;
    ponEst = function () { var r = p0.apply(this, arguments); var id = idDe();
      if (id && SALTADAS[id]) sinHacer(); return r; };
  }
  if (typeof deCero === "function") {
    var d0 = deCero;
    deCero = function () {
      if (typeof EST !== "undefined") vacia(EST);
      if (typeof FALLO !== "undefined") vacia(FALLO);
      vacia(SALTADAS);
      if (typeof LOG !== "undefined" && LOG && LOG.length) LOG.length = 0;
      sinHacer();
      if (typeof PR !== "undefined" && PR) PR.fallos = 0;
      if (typeof PR2 !== "undefined" && PR2) PR2.fallos = 0;
      if (typeof alReiniciar === "function") alReiniciar();
      return d0.apply(this, arguments);
    };
  }
})();
