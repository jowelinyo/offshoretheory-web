<script>
"use strict";

const NS = "http://www.w3.org/2000/svg";
const D = {W: 1000, H: 620};
let svg = null, gO = null, ESC = 1;
const px = n => n / ESC;

function el(t, at, pa){
  const e = document.createElementNS(NS, t);
  for(const k in at) if(at[k] !== undefined && at[k] !== null) e.setAttribute(k, at[k]);
  (pa || gO || svg).appendChild(e);
  return e;
}
function txt(x, y, s, an, tam, col, peso, fam, pa){
  const e = el("text", {x: x, y: y, "text-anchor": an || "start",
    "pointer-events": "none", "font-size": px(tam || 13),
    fill: col || "var(--lam-ink)", "font-weight": peso || 400,
    "font-family": fam === "mono" ? "var(--f-mono)" : "var(--f-ui)"}, pa);
  e.textContent = s;
  return e;
}

function sondaDe(i, j){
  const s = Math.sin(i*12.9898 + j*78.233) * 43758.5453;
  return s - Math.floor(s);
}
function sonda(x, y, v){
  const ent = Math.floor(v), dec = Math.round((v - ent)*10);
  const t = el("text", {x: x, y: y, "text-anchor": "middle",
    "pointer-events": "none", "font-size": px(11.5), "font-style": "italic",
    fill: "var(--carta-sonda)", "font-family": "var(--f-ui)", opacity: .78});
  t.appendChild(document.createTextNode(String(ent)));
  if(dec){
    const u = document.createElementNS(NS, "tspan");
    u.setAttribute("font-size", px(8));
    u.setAttribute("dy", px(3));
    u.textContent = String(dec);
    t.appendChild(u);
  }
}

const LEY16 = ["Every vessel which is directed to keep out of the way of another vessel shall, so far as possible, take early and substantial action to keep well clear."];
const LEY16CAR = 152;

const ARC = {
  masthead: 112.5,
  sidelight:112.5,
  stern:    112.5,
  allRound: 180
};

const CUTOFF = 1.5;

const visible = (arc, aspect) => {
  const a = Math.abs(aspect);
  switch(arc.kind){
    case "masthead": return a <= ARC.masthead;
    case "starboard":return aspect >= -CUTOFF && aspect <= ARC.sidelight;
    case "port":     return aspect <=  CUTOFF && aspect >= -ARC.sidelight;

    case "stern":    return a > ARC.stern;
    case "allround": return true;
  }
  return false;
};

const HGT = {

  mast1: L => Math.max(1.6, 0.62 * Math.pow(L, 0.72)),
  mast2: L => HGT.mast1(L) + Math.max(4.5, HGT.mast1(L)*0.22),
  side:  L => L >= 20 ? HGT.mast1(L)*0.72 : Math.max(0.9, HGT.mast1(L)*0.55),
  stern: L => L >= 20 ? HGT.mast1(L)*0.42 : Math.max(0.7, HGT.mast1(L)*0.40),
  allr:  L => Math.max(2.2, HGT.mast1(L)*0.90),
  mast:  L => Math.max(1.6, 0.62 * Math.pow(L, 0.72))
};

function ranges(L){
  if (L >= 50) return {masthead:6, side:3, stern:3, allround:3, towing:3};
  if (L >= 20) return {masthead:5, side:2, stern:2, allround:2, towing:2};
  if (L >= 12) return {masthead:3, side:2, stern:2, allround:2, towing:2};
  return          {masthead:2, side:1, stern:2, allround:2, towing:2};
}

const L = (kind, colour, h, x, rangeKey, extra={}) =>
  ({kind, colour, h, x, rangeKey, ...extra});

function configuration(v){
  const LEN = v.length || 12;
  const L50 = LEN >= 50;
  const making = v.makingWay !== false;
  const under  = v.underway  !== false;

  const sideX  = L50 ? -0.30 : 0.80;
  const side   = [L("starboard","green",HGT.side(LEN), sideX,"side"),
                  L("port",     "red",  HGT.side(LEN), sideX,"side")];
  const stern  = [L("stern","white",HGT.stern(LEN),-0.96,"stern")];
  const mast1  = [L("masthead","white",HGT.mast1(LEN), 0.55,"masthead")];
  const mast2  = L50 ? [L("masthead","white",HGT.mast2(LEN),-0.40,"masthead")] : [];

  if (!under) {
    return LEN >= 50
      ? [L("allround","white",HGT.allr(LEN)*0.9, 0.88,"allround"),
         L("allround","white",HGT.stern(LEN)*1.4,-0.88,"allround")]
      : [L("allround","white",HGT.allr(LEN), 0.0,"allround")];
  }

  switch(v.type){
    case "power": case "pilotUnderway":

      if(LEN < 12 && v.combined !== false)
        return [L("allround","white",Math.max(2.2,LEN*0.22),0.10,"allround"), ...side];
      return [...mast1, ...mast2, ...side, ...stern];

    case "sailing":

      const mastTop = LEN*1.30;
      return v.tricolour && LEN < 20
        ? [L("starboard","green",mastTop,0.05,"side"), L("port","red",mastTop,0.05,"side"),
           L("stern","white",mastTop,0.05,"stern")]
        : [L("starboard","green",HGT.side(LEN),0.86,"side"),
           L("port","red",      HGT.side(LEN),0.86,"side"), ...stern,
           ...(v.optionalRedGreen ? [L("allround","red",  mastTop,0.05,"allround"),
                                     L("allround","green",mastTop*0.94,0.05,"allround")] : [])];

    case "fishingTrawl":
      return [L("allround","green",HGT.allr(LEN)*1.25,0.28,"allround"),
              L("allround","white",HGT.allr(LEN)*0.95,0.28,"allround"),
              ...(L50?[L("masthead","white",HGT.mast2(LEN),-0.40,"masthead")]:[]),
              ...(making?[...side,...stern]:[])];

    case "fishingOther":
      return [L("allround","red",HGT.allr(LEN)*1.25,0.28,"allround"),
              L("allround","white",HGT.allr(LEN)*0.95,0.28,"allround"),
              ...(making?[...side,...stern]:[])];

    case "nuc":
      return [L("allround","red",HGT.allr(LEN)*1.25,0.20,"allround"),
              L("allround","red",HGT.allr(LEN)*0.95,0.20,"allround"),
              ...(making?[...side,...stern]:[])];

    case "ram":
      return [L("allround","red",  HGT.allr(LEN)*1.45,0.20,"allround"),
              L("allround","white",HGT.allr(LEN)*1.20,0.20,"allround"),
              L("allround","red",  HGT.allr(LEN)*0.95,0.20,"allround"),
              ...(making?[...mast1,...mast2,...side,...stern]:[])];

    case "cbd":
      return [...mast1, ...mast2, ...side, ...stern,

              L("allround","red",HGT.allr(LEN)*1.35,0.14,"allround"),
              L("allround","red",HGT.allr(LEN)*1.15,0.14,"allround"),
              L("allround","red",HGT.allr(LEN)*0.95,0.14,"allround")];

    case "pilot":

      return [L("allround","white",HGT.allr(LEN)*1.25,0.20,"allround"),
              L("allround","red",  HGT.allr(LEN)*0.95,0.20,"allround"),
              ...side, ...stern];

    case "towing": {
      const TL   = v.towLength || 120;
      const long = TL > 200;
      const stack = [];
      const step = Math.max(2, LEN*0.055);
      for (let i=0;i<(long?3:2);i++)
        stack.push(L("masthead","white",HGT.mast1(LEN)+i*step,0.55,"masthead"));
      const tug = [...stack, ...(L50?[L("masthead","white",HGT.mast2(LEN)+step*2,-0.40,"masthead")]:[]),
                   ...side, ...stern,
                   L("stern","yellow",HGT.stern(LEN)*1.5,-0.96,"towing")];

      const back = -(TL + LEN*0.5);
      const towed = [
        L("starboard","green",2.0,0,"side",  {xm:back, tow:true}),
        L("port",     "red",  2.0,0,"side",  {xm:back, tow:true}),
        L("stern",    "white",1.6,0,"stern", {xm:back - 20, tow:true})
      ];
      return [...tug, ...towed];
    }
  }
  return [...side, ...stern];
}

function seenFrom(v, aspect, rangeNm){
  const R = ranges(v.length || 12);
  return configuration(v)
    .filter(l => visible(l, aspect))
    .filter(l => rangeNm === undefined || rangeNm <= R[l.rangeKey])
    .map(l => ({...l, nominal:R[l.rangeKey]}));
}

const norm    = a => ((a % 360) + 360) % 360;
const diff    = (a,b) => { let d = norm(a) - norm(b); if (d > 180) d -= 360; if (d < -180) d += 360; return d; };
const toRad   = d => d * Math.PI / 180;

const VESSEL = {
  nuc:      {rank:5, label:"not under command",            power:false},
  ram:      {rank:5, label:"restricted in ability to manoeuvre", power:false},
  fishing:  {rank:4, label:"engaged in fishing",           power:false},
  sailing:  {rank:3, label:"under sail",                   power:false},
  power:    {rank:2, label:"power-driven",                 power:true},
  cbd:      {rank:2, label:"constrained by draught",       power:true, noImpede:true},
  pilot:    {rank:2, label:"pilot vessel",                 power:true}
};

const VESSEL_ALIAS = {
  fishingTrawl:"fishing", fishingOther:"fishing",
  pilotUnderway:"pilot", towing:"power", seaplane:"power"
};

const OVERTAKING_ARC = 112.5;

const BEARING_THRESHOLD = 0.5;

const MAY_TCPA   = 12;

const SHALL_TCPA = 4;

function bearingTo(from, to){
  return norm(Math.atan2(to.x - from.x, to.y - from.y) * 180 / Math.PI);
}

function rangeTo(from, to){
  return Math.hypot(to.x - from.x, to.y - from.y);
}

function relativeBearing(own, contact){
  return diff(bearingTo(own, contact), own.heading);
}

function aspect(own, contact){
  return diff(bearingTo(contact, own), contact.heading);
}

function isOvertaking(own, contact){
  if (Math.abs(aspect(own, contact)) <= OVERTAKING_ARC) return false;
  const dt = 1/60;
  return rangeTo(step(own, dt), step(contact, dt)) < rangeTo(own, contact);
}

function tackOf(v){
  if (v.wind === undefined) return null;
  const d = diff(v.wind, v.heading);
  if (Math.abs(d) < 1e-9) return null;
  return d < 0 ? "port" : "starboard";
}

function windwardOf(a, b){

  const w = a.wind;
  if (w === undefined || w === null || !isFinite(w)) return null;
  const pa = a.x * Math.sin(toRad(w)) + a.y * Math.cos(toRad(w));
  const pb = b.x * Math.sin(toRad(w)) + b.y * Math.cos(toRad(w));
  if (Math.abs(pa - pb) < 1e-9) return null;
  return pa > pb ? a : b;
}

function step(v, hours){
  return {...v,
    x: v.x + Math.sin(toRad(v.heading)) * v.speed * hours,
    y: v.y + Math.cos(toRad(v.heading)) * v.speed * hours};
}

function bearingRate(own, contact, dt = 1/60){
  const b0 = bearingTo(own, contact);
  const p1 = step(own, dt), q1 = step(contact, dt);
  return diff(bearingTo(p1, q1), b0) / dt / 60;
}

function cpaTcpa(own, contact){
  const rx = contact.x - own.x, ry = contact.y - own.y;
  const vx = Math.sin(toRad(contact.heading)) * contact.speed - Math.sin(toRad(own.heading)) * own.speed;
  const vy = Math.cos(toRad(contact.heading)) * contact.speed - Math.cos(toRad(own.heading)) * own.speed;
  const vv = vx*vx + vy*vy;
  if (vv < 1e-9) return {cpa: Math.hypot(rx,ry), tcpa: Infinity};
  const tcpa = -(rx*vx + ry*vy) / vv;
  const cx = rx + vx*tcpa, cy = ry + vy*tcpa;
  return {cpa: Math.hypot(cx,cy), tcpa};
}

function riskOfCollision(own, contact){
  const {cpa, tcpa} = cpaTcpa(own, contact);
  const R = rangeTo(own, contact);
  const rate = Math.abs(bearingRate(own, contact));
  const L = (contact.length || 20) / 1852;
  const limit = BEARING_THRESHOLD * (1 + (contact.length||20)/200) * (1 + 1/Math.max(R,0.2));

  const dt = 1/60;
  const approaching = rangeTo(step(own, dt), step(contact, dt)) < R;
  return {
    risk: approaching && tcpa > 0 && (rate < limit || cpa < (L*2 + 0.1)),
    steadyBearing: rate < limit,
    approaching,
    rate, limit, cpa, tcpa
  };
}

function standOnThresholds(own, contact, opts = {}){
  const {tcpa} = cpaTcpa(own, contact);
  const min = tcpa * 60;
  const restricted = opts.narrowWaters ? 0.66 : 1;
  return {
    tcpaMin: min,
    mayAct:   min <= MAY_TCPA   * restricted,
    mustAct:  min <= SHALL_TCPA * restricted,
    mayAtMin:  MAY_TCPA   * restricted,
    mustAtMin: SHALL_TCPA * restricted
  };
}

function headingForCPA(own, contact, wantCPA){
  let best=null;
  for(let hd=0; hd<360; hd+=0.25){
    const c={...contact, heading:hd};
    const {cpa,tcpa} = cpaTcpa(own,c);
    if(tcpa<=0.02) continue;
    const err = Math.abs(cpa - wantCPA);
    if(!best || err < best.err) best={hd, err, cpa, tcpa};
  }
  return best;
}

function category(type){
  const t = VESSEL_ALIAS[type] || type;
  if(!VESSEL[t]) throw new Error("colregs-engine: unknown vessel type \""+type+"\"");
  return VESSEL[t];
}

function project(v, aspect, rangeNm, opts={}){
  const th = aspect * Math.PI / 180;
  const R  = Math.max(rangeNm, 0.05);
  const k  = opts.scale || 1;
  const M  = 1852;
  const LEN  = v.length || 12;
  const beam = LEN * (LEN>=50 ? 0.145 : 0.30);
  return seenFrom(v, aspect, rangeNm).map(l => {
    const foreAft = l.xm !== undefined ? l.xm
                  : l.x * LEN/2;

    const lx = l.kind==="starboard" ?  beam/2
             : l.kind==="port"      ? -beam/2 : 0;
    const across  = foreAft * Math.sin(th) - lx * Math.cos(th);
    return {
      ...l,
      dx: k * (across / (R*M)) * 3437.75,
      dy: k * (l.h / (R*M)) * 3437.75,

      brightness: Math.max(0, Math.min(1, 1.25 - rangeNm / l.nominal)),

      subtends: (LEN / (R*M)) * 3437.75
    };
  });
}

const CANAL_A_LO_LARGO = 45;

const VIA_A_FAVOR = 45;

const CORTO = 20;

function esCorto(v){ return v.length !== undefined && v.length < CORTO; }
function vaALoLargo(v, rumboCanal){
  const d = Math.abs(diff(v.heading, rumboCanal));
  return d <= CANAL_A_LO_LARGO || d >= 180 - CANAL_A_LO_LARGO;
}
function cruza(v, rumboCanal){ return !vaALoLargo(v, rumboCanal); }
function sigueLaVia(v, via){ return Math.abs(diff(v.heading, via)) <= VIA_A_FAVOR; }

function deberesDeNoEstorbar(own, contact, cond){
  const D = [];
  const A = category(own.type), B = category(contact.type);
  const pon = (rule, para, quien, why) => D.push({rule, para, quien, why});

  const canal = cond.canal;
  if (canal && canal.rumbo !== undefined) {
    const dentroA = vaALoLargo(own, canal.rumbo), dentroB = vaALoLargo(contact, canal.rumbo);

    if ((A === VESSEL.sailing || esCorto(own)) && contact.soloEnCanal)
      pon(9, "b", "own", "She can only stay safe inside this channel. You are "
        + (A === VESSEL.sailing ? "under sail" : "under 20 meters")
        + ", so you do not impede her passage — which is not the same as keeping out "
        + "of her way, and it starts much earlier.");
    if ((B === VESSEL.sailing || esCorto(contact)) && own.soloEnCanal)
      pon(9, "b", "contact", "You can only stay safe inside this channel, and she is "
        + (B === VESSEL.sailing ? "under sail" : "under 20 meters")
        + ". She does not impede your passage.");

    if (A === VESSEL.fishing && dentroB)
      pon(9, "c", "own", "You are engaged in fishing and she is navigating within the "
        + "channel. You do not impede her passage, whatever she is.");
    if (B === VESSEL.fishing && dentroA)
      pon(9, "c", "contact", "She is engaged in fishing and you are navigating within "
        + "the channel. She does not impede your passage.");

    if (cruza(own, canal.rumbo) && contact.soloEnCanal)
      pon(9, "d", "own", "You are crossing the channel and she can only stay safe "
        + "inside it. You do not cross if crossing impedes her passage.");
    if (cruza(contact, canal.rumbo) && own.soloEnCanal)
      pon(9, "d", "contact", "She is crossing the channel and you can only stay safe "
        + "inside it. She does not cross if crossing impedes your passage.");
  }

  const disp = cond.dispositivo;
  if (disp && disp.via !== undefined) {
    const sigueA = sigueLaVia(own, disp.via), sigueB = sigueLaVia(contact, disp.via);

    if (A === VESSEL.fishing && sigueB)
      pon(10, "i", "own", "You are engaged in fishing and she is following the traffic "
        + "lane. You do not impede her passage.");
    if (B === VESSEL.fishing && sigueA)
      pon(10, "i", "contact", "She is engaged in fishing and you are following the "
        + "traffic lane. She does not impede your passage.");

    if ((A === VESSEL.sailing || esCorto(own)) && B.power && sigueB)
      pon(10, "j", "own", "She is a power-driven vessel following the traffic lane. "
        + "You are " + (A === VESSEL.sailing ? "under sail" : "under 20 meters")
        + ", so you do not impede her safe passage.");
    if ((B === VESSEL.sailing || esCorto(contact)) && A.power && sigueA)
      pon(10, "j", "contact", "You are a power-driven vessel following the traffic "
        + "lane, and she is " + (B === VESSEL.sailing ? "under sail" : "under 20 meters")
        + ". She does not impede your safe passage.");
  }
  return D;
}
function evaluate(own, contact, cond = {}){
  const vis      = cond.visibility === undefined ? 10 : cond.visibility;
  const R        = rangeTo(own, contact);
  const inSight  = R <= vis;
  const relB     = relativeBearing(own, contact);
  const risk     = riskOfCollision(own, contact);

  const noEstorbar = deberesDeNoEstorbar(own, contact, cond);
  const base     = {relativeBearing: relB, aspect: aspect(own, contact), range: R,
                    inSight, ...risk,
                    ...(noEstorbar.length ? {notImpeding: noEstorbar} : {})};

  if (!inSight) return {...base,
    situation: "restricted-visibility",
    obligation: "both-act",
    rule: 19,
    why: "Neither of you can see the other. There is no give-way vessel and no "
       + "stand-on vessel: "
       + "you both navigate with care, at a speed you can stop in, and neither of you "
       + "has anything to hold.",
    restrictions: ["no turn to port for a contact forward of the beam, unless you are overtaking",
                   "no turn towards a contact abeam or abaft the beam"]};

  if (isOvertaking(own, contact)) return {...base,
    situation: "overtaking", role: "overtaking",
    obligation: "give-way", rule: 13,
    why: "You are coming up on her from behind her beam, so you keep out of the way — "
       + "whatever either of you is. Sail over power does not apply here."};
  if (isOvertaking(contact, own)) return {...base,
    situation: "overtaken", role: "overtaken",
    obligation: "stand-on", rule: 13,
    thresholds: standOnThresholds(own, contact, cond),
    why: "She is overtaking you. You hold your course and speed — until she shows you she is not going to clear you."};

  const A = category(own.type), B = category(contact.type);

  if (B.noImpede && !A.noImpede && A.rank < 5) {
    return {...base, situation: "constrained-by-draught",
      obligation: "do-not-impede", rule: 18,
      why: "She can only stay safe inside the deep water she is in. You do not take her "
         + "water away in the first place — that is a different thing from giving way, "
         + "and it starts much earlier."};
  }

  if (A.rank !== B.rank) {
    const iGiveWay = A.rank < B.rank;
    return {...base,
      situation: "different-types",
      obligation: iGiveWay ? "give-way" : "stand-on",
      rule: 18,
      thresholds: iGiveWay ? null : standOnThresholds(own, contact, cond),
      why: iGiveWay
        ? `She is ${B.label} and you are ${A.label}. You keep out of her way.`
        : `You are ${A.label} and she is ${B.label}. She keeps out of your way.`};
  }

  if (category(own.type) === VESSEL.sailing && category(contact.type) === VESSEL.sailing) {
    const ta = tackOf(own), tb = tackOf(contact);
    if (ta && tb && ta !== tb) {
      const iGiveWay = ta === "port";
      return {...base, situation: "sailing-different-tacks",
        obligation: iGiveWay ? "give-way" : "stand-on", rule: 12,
        thresholds: iGiveWay ? null : standOnThresholds(own, contact, cond),
        why: iGiveWay ? "You have the wind on your port side and she does not. You keep out of the way."
                      : "She has the wind on her port side and you do not. She keeps out of the way."};
    }

    const bar = windwardOf(own, contact);
    if (ta === "port" && contact.amuraIncierta && bar === contact) return {...base,
      situation: "sailing-doubtful-tack", obligation: "give-way", rule: 12,
      why: "You have the wind on your port side, she is to windward, and you cannot "
         + "tell with certainty which tack she is on. You keep out of the way."};
    if (tb === "port" && own.amuraIncierta && bar === own) return {...base,
      situation: "sailing-doubtful-tack", obligation: "stand-on", rule: 12,
      thresholds: standOnThresholds(own, contact, cond),
      why: "She has the wind on her port side, you are to windward, and she cannot "
         + "tell with certainty which tack you are on. She keeps out of the way."};
    const wind = windwardOf(own, contact);

    if (!wind) return {...base,
      situation: "no-allocation", obligation: "both-act", rule: 2,
      why: "Same tack, and which of you is to windward is not established, so Rule 12 "
         + "has nobody to point at. There is no stand-on vessel here: you both act, "
         + "and Rule 2 says you depart from the rules as far as the immediate danger "
         + "requires."};
    const iGiveWay = wind === own;
    return {...base, situation: "sailing-same-tack",
      obligation: iGiveWay ? "give-way" : "stand-on", rule: 12,
      thresholds: iGiveWay ? null : standOnThresholds(own, contact, cond),
      why: iGiveWay ? "Same tack and you are the windward boat. You keep out of the way."
                    : "Same tack and she is to windward. She keeps out of the way."};
  }

  if (!A.power || !B.power) return {...base,
    situation: "no-allocation", obligation: "both-act", rule: 2,
    why: "Neither of you is a power-driven vessel and the rules do not rank you "
       + "against each other, so Rules 15 and 17 have nobody to point at. There is no "
       + "stand-on vessel here: you both act, and Rule 2 says you depart from the "
       + "rules as far as the immediate danger requires."};

  const reciprocal = Math.abs(Math.abs(diff(own.heading, contact.heading)) - 180) < 6;
  const nearlyAhead = Math.abs(relB) < 6;
  if (reciprocal && nearlyAhead) return {...base,
    situation: "head-on", obligation: "both-give-way", rule: 14,
    why: "You are meeting nearly head on. You BOTH alter to starboard, and you both do it early "
       + "and obviously enough that the other can see it."};

  const heOnMyStarboard = relB > 0;

  if (!heOnMyStarboard && !(relativeBearing(contact, own) > 0)) return {...base,
    situation: "no-allocation", obligation: "both-act", rule: 2,
    why: "Neither of you has the other on your own starboard side, so Rule 15 has "
       + "nobody to point at. There is no stand-on vessel here: you both act, and "
       + "Rule 2 says you depart from the rules as far as the immediate danger "
       + "requires."};
  return {...base,
    situation: "crossing",
    obligation: heOnMyStarboard ? "give-way" : "stand-on",
    rule: 15,
    thresholds: heOnMyStarboard ? null : standOnThresholds(own, contact, cond),
    why: heOnMyStarboard
      ? "She is crossing from your starboard side. You keep out of the way — and you do not cross ahead of her."
      : "She is crossing from your port side. She keeps out of the way. You hold, and you watch her to see whether she does."};
}

const ELLA16 = {n: "A power-driven vessel of 90 m", eslora: 90, nudos: 15};
const TU16 = {n: "your own vessel", eslora: 40, nudos: 12};

const EMPIEZAS16 = {millas: 9};
const MARCACION16 = {grados: 45};

const VIRADA16 = {grados: 45, n: "forty-five degrees to starboard"};

const SEGURA16 = {millas: 0.5, n: "half a mile"};

const SUYA16 = {grados: 30, n: "thirty degrees to starboard"};

const PEQUENA16 = {grados: 10, n: "ten degrees"};

const gr16 = a => ((a % 360) + 360) % 360;

function tuEn16(giro){
  return {x: 0, y: 0, heading: gr16(giro || 0), speed: TU16.nudos, type: "power",
          length: TU16.eslora, underway: true, makingWay: true};
}
function sitio16(h){
  const g = MARCACION16.grados*Math.PI/180;
  return {x: EMPIEZAS16.millas*Math.sin(g), y: EMPIEZAS16.millas*Math.cos(g),
          heading: h, speed: ELLA16.nudos, type: "power", length: ELLA16.eslora,
          underway: true, makingWay: true};
}

function rumboDeChoque16(){
  const b = MARCACION16.grados, g = b*Math.PI/180;
  const k = -(TU16.nudos/ELLA16.nudos)*Math.sin(g);
  const a = Math.asin(Math.max(-1, Math.min(1, k)))*180/Math.PI;
  for(const h of [gr16(b + a), gr16(b + 180 - a)]){
    const q = cpaTcpa(tuEn16(0), sitio16(h));
    if(q.tcpa > 0 && q.cpa < 0.01) return h;
  }
  return null;
}
const RUMBO16 = rumboDeChoque16();
function ellaEn16(){ return sitio16(RUMBO16 === null ? gr16(MARCACION16.grados + 180)
                                                     : RUMBO16); }

const MINUTOS16 = cpaTcpa(tuEn16(0), ellaEn16()).tcpa*60;

const FILOS16 = (function(){
  const q = standOnThresholds(ellaEn16(), tuEn16(0));
  return {puede: q.mayAtMin, tiene: q.mustAtMin};
})();

function queHace(min){
  if(min > FILOS16.puede) return "nada";
  if(min > FILOS16.tiene) return "podia";
  return "tenia";
}
const respuestaBuena16 = queHace;

function pasada16(min, caida){
  const espera = Math.max(0, (MINUTOS16 - min))/60;
  const t0 = tuEn16(0), e0 = ellaEn16();
  const giroEn = step(t0, espera);
  const tu = {...giroEn, heading: gr16(caida === undefined ? VIRADA16.grados : caida)};
  const ella = step(e0, espera);
  const q = cpaTcpa(tu, ella);
  const h = Math.max(0, q.tcpa);
  const tc = step(tu, h), ec = step(ella, h);
  return {espera: espera, giroEn: giroEn, tu: tu, ella: ella,
          cpa: q.tcpa <= 0 ? rangeTo(tu, ella) : q.cpa,
          tcpa: h, tc: tc, ec: ec, entreMarcas: rangeTo(tc, ec)};
}

function marcaDelFilo(min){
  return step(tuEn16(0), Math.max(0, MINUTOS16 - min)/60);
}

function estasPorSu(){
  const rb = relativeBearing(ellaEn16(), tuEn16(0));
  return {lado: rb < 0 ? "port" : "starboard", marcacion: rb,

          leAta: rb < 0};
}
const SUCOSTADO16 = estasPorSu();

function ellaActua(min){
  const q = queHace(min);
  if(q === "nada") return null;
  const filo = q === "podia" ? FILOS16.puede : FILOS16.tiene;
  const w1 = Math.max(0, MINUTOS16 - filo)/60;
  const e0 = ellaEn16(), t0 = tuEn16(0);
  const giroEn = step(e0, w1);
  const ella = {...giroEn, heading: gr16(e0.heading + SUYA16.grados)};

  const w2 = Math.max(0, filo - min)/60;
  const tu = {...step(step(t0, w1), w2), heading: gr16(VIRADA16.grados)};
  const el = step(ella, w2);
  const c = cpaTcpa(tu, el);
  const h = Math.max(0, c.tcpa);
  const tc = step(tu, h), ec = step(el, h);
  return {filo: filo, giroEn: giroEn, ella: ella, cuando: q,
          cpa: c.tcpa <= 0 ? rangeTo(tu, el) : c.cpa,
          tc: tc, ec: ec, entreMarcas: rangeTo(tc, ec)};
}

function estado16(min){
  const p = pasada16(min);
  const q = queHace(min);
  return {
    min: min, minutos: MINUTOS16, filos: FILOS16,
    tu: tuEn16(0), ella: ellaEn16(),
    pasada: p, cpa: p.cpa,
    quePasa: q, buena: q,

    segura: p.cpa >= SEGURA16.millas,
    bien: q === "nada",

    sinTocar: cpaTcpa(tuEn16(0), ellaEn16()),

    suya: ellaActua(min), suCostado: SUCOSTADO16,

    pequena: pasada16(min, PEQUENA16.grados)
  };
}

function cascoEnPlanta(x, y, rumbo, tinta, L, quien, opt){
  const o = opt || {};
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const P = o.este ? (av, tr) => [x + cs*av - sn*tr, y + sn*av + cs*tr]
                   : (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  const M = L*0.09;
  const q = [P(L*0.50, 0), P(L*0.26, M*0.85), P(L*0.10, M),
             P(-L*0.44, M*0.9), P(-L*0.50, M*0.55),
             P(-L*0.50, -M*0.55), P(-L*0.44, -M*0.9),
             P(L*0.10, -M), P(L*0.26, -M*0.85)];
  const gr = el("g", {"data-barco": quien});

                + " Z", fill: tinta, opacity: .95, "data-buque": "1"}, gr);
  return L;
}

const AIRE16 = {x: 116, y: 78};
let E16 = {ox: 0, oy: 0, k: 1, y0: 0, y1: 0};

const NUEVA16 = 2.4;

const AX = p => E16.ox + p.x*E16.k;
const AY = p => E16.oy - p.y*E16.k;
const AM = m => m*E16.k;

function cajaFija(){
  const t = tuEn16(0), e = ellaEn16(), h = MINUTOS16/60;
  const pts = [t, e, step(t, h), step(e, h)];

  [MINUTOS16, 1].forEach(function(m){
    const p = pasada16(m);
    pts.push(step(p.tu, NUEVA16/p.tu.speed));

    const s = ellaActua(m);
    if(s) pts.push(s.ella, step(s.ella, NUEVA16/s.ella.speed));
  });

  [FILOS16.puede, FILOS16.tiene].forEach(function(f){
    const s = ellaActua(f);
    if(s) pts.push(s.ella, step(s.ella, NUEVA16/s.ella.speed));
  });
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  pts.forEach(function(p){
    x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x);
    y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y);
  });
  return {x0: x0, x1: x1, y0: y0, y1: y1};
}
const CAJA16 = null;

function fija16(){
  E16.y0 = px(150);
  E16.y1 = D.H - px(58);
  if(!CAJA) CAJA = cajaFija();
  const w = Math.max(px(80), D.W - px(AIRE16.x)*2);
  const h = Math.max(px(80), (E16.y1 - E16.y0) - px(AIRE16.y)*2);
  const bw = Math.max(CAJA.x1 - CAJA.x0, 0.5), bh = Math.max(CAJA.y1 - CAJA.y0, 0.5);

  E16.k = Math.min(w/bw, h/bh);
  E16.ox = D.W/2 - (CAJA.x0 + CAJA.x1)/2*E16.k;
  E16.oy = (E16.y0 + E16.y1)/2 + (CAJA.y0 + CAJA.y1)/2*E16.k;
}

  PUESTOS16.push([x - ancho/2, y - px(12), x + ancho/2, y + alto]);

                  "stroke-opacity": .8, "stroke-dasharray": px(7) + "," + px(5)});
      el("circle", {cx: sx, cy: sy, r: px(4), fill: "var(--carta)",
                    stroke: "var(--lam-alarm)", "stroke-width": px(1.5)});
      rotula16En(AX(sf), AY(sf) - px(16),
                 [(s.cuando === "podia" ? "what she may now do"

    if(S16.dicho){

      [a, b].forEach(function(v){
        el("circle", {cx: v[0], cy: v[1], r: px(4.5), fill: "none", stroke: tinta,

      });
      el("line", {x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: tinta,

                  "stroke-opacity": .85});
      rotula16En((a[0] + b[0])/2, (a[1] + b[1])/2 - px(18),
                 ["you leave her " + e.cpa.toFixed(2) + " M"], tinta);
    }

    const rE = casco16(ex, ey, e.ella.heading, "var(--lam-dim)", ELLA16.eslora,
                       "ella")*0.5;
    const rT = casco16(tx, ty, e.tu.heading, tinta, TU16.eslora, "tu")*0.5;
    rotula16En(ex, ey - rE - px(20), ["her"], "var(--lam-dim)");
    rotula16En(tx, ty + rT + px(22), ["you"], tinta);
    rotula16En(gx + px(96), gy, ["you put the helm over"], tinta);

    rotula16En(AX(enc) + px(88), AY(enc) - px(14),

    const M = D.W*0.028, w = D.W - M*2;

    el("line", {x1: 0, y1: E16.y1, x2: D.W, y2: E16.y1, stroke: "var(--edge-card)",
                "stroke-width": px(1)});

    txt(M, px(24), "YOU KEEP OUT OF HER WAY · SHE STANDS ON · THE SAME ALTERATION EVERY TIME",
      "start", 12, "var(--lam-dim)", 600, "mono");
    mando16("cuando", M, px(54), w*0.60, "WHEN YOU PUT THE HELM OVER",
            (S16.min - 1)/(Math.round(MINUTOS16) - 1),
            S16.min + (S16.min === 1 ? " minute to go" : " minutes to go"));

    txt(M, px(118),
        !S16.dicho ? "the two marks on your track are hers, not yours"
          : e.quePasa === "nada" ? "she never had anything to decide"
          : e.quePasa === "podia" ? "by the time you turned, the decision was hers"
          : "your helm alone was no longer enough &middot; she has to act too",
        "start", 12, "var(--lam-dim)", 400, "mono");

    txt(D.W/2, E16.y1 + px(34),
        !S16.dicho

  },

  mueve(id, u){
    const p = PISTAS16[id];
    if(!p) return;
    const t = Math.max(0, Math.min(1, (u - p.x0)/(p.x1 - p.x0)));
    if(id === "cuando"){
      const antes = S16.min;
      S16.min = Math.round(1 + t*(Math.round(MINUTOS16) - 1));

  },
  pulsa(){ },
  responde(q){
    if(q === "nada" || q === "podia" || q === "tenia"){ S16.dicho = q; toca(); return; }

  },

  panel(){
    const e = estado16(S16.min);
    const t = dilo16(e, S16.dicho);
    let h = "<h3>Rule 16</h3><h2>Action by give-way vessel</h2>";

    h += '<div data-cede="tu"'
       + ' data-momento="' + t.momento + '"'
       + ' data-pasa="' + e.quePasa + '"'

    if(t.momento === "pregunta")

    h += "<h3>The readings</h3><dl class=\"cifras\">"

       + "<dt>You make</dt><dd>" + TU16.nudos + " knots</dd>"
       + "<dt>She lies</dt><dd>" + MARCACION16.grados
       + "&deg; on your starboard bow, " + EMPIEZAS16.millas + " M off, <b>on a "
       + "steady bearing</b></dd>"
       + "<dt>If neither of you acts</dt><dd>you meet in "
       + Math.round(MINUTOS16) + " minutes</dd>"
       + "<dt>You put the helm over</dt><dd>with " + S16.min
       + (S16.min === 1 ? " minute" : " minutes") + " to go, and you alter "
       + VIRADA16.n + "</dd>";
    if(S16.dicho){

      h += "<dt>Rule 17 opens for her</dt><dd>with " + FILOS16.puede
         + " minutes to go she may act alone, and with " + FILOS16.tiene
         + " she must &mdash; the two figures are the module's teaching model, and "
         + "<code>colregs.js</code> says so where it declares them</dd>"
         + "<dt><b>Rule 8</b> &middot; a safe distance</dt><dd>"
         + (e.segura ? "<b>yes</b>" : "<b>no</b>") + " &mdash; you pass "
         + e.cpa.toFixed(2) + " M off, and " + SEGURA16.n + " is what this module "
         + "declared for two ships this size</dd>"
         + "<dt><b>Rule 16</b> &middot; well clear</dt><dd>"
         + (e.bien ? "<b>yes</b> &mdash; she held her course and her speed the whole "
                   + "way, and never had a decision to make"
                   : "<b>no</b> &mdash; " + (e.quePasa === "podia"
                      ? "by the time you turned she was already entitled to act"
                      : "she had to act herself"))
         + "</dd>";
      if(e.suya)
        h += "<dt>If she acts</dt><dd>she alters " + SUYA16.n + " at the moment Rule "
           + "17 opens for her &mdash; <b>to starboard, because you are on her port "
           + "side and Rule 17(c) forbids her the other way</b> &mdash; and the two of "
           + "you end up " + e.suya.cpa.toFixed(2) + " M apart. <b>Wider, and worse:</b> "
           + "the distance is bigger and nobody is holding anything</dd>";
      if(e.bien)
        h += "<dt>And it was substantial</dt><dd>the same helm at the same moment, but "
           + "only " + PEQUENA16.n + " of it, would have left her "
           + e.pequena.cpa.toFixed(2) + " M instead of " + e.cpa.toFixed(2)
           + " &mdash; early and small is not what the Rule asks for</dd>";
    }
    h += "</dl>";

    h += '<p class="buque">The Rule gives no figures at all &mdash; not a distance, '
       + "not a time, not a number of degrees &mdash; so everything here is declared. "
       + "<b>She holds</b>, because Rule 17 tells her to, and her track is the same "
       + "straight line in every state of this screen. <b>The alteration is fixed</b> "
       + "at " + VIRADA16.n + ": bold, unmistakable, and exactly what Rule 8 asks "
       + "for. It is deliberately not a control &mdash; how big to make it is Rule 8's "
       + "question and Rule 8's screen, and if you could change it here this would be "
       + "that screen again. <b>The two marks on your track are the module's Rule 17 "
       + "model</b>, taken from <code>colregs.js</code>, which declares them as a "
       + "teaching model and not as law. <b>The hulls are not to scale</b>, and the "
       + "plate keeps one scale for every moment so that one can be compared with "
       + "another.</p>";

    h += "<h3>The Rule</h3>";
    LEY16.forEach(function(p){
      h += '<div class="ley-inciso">' + p + "</div>";
    });
    h += '<p class="fuente">Navigation Rules &amp; Regulations Handbook &middot; '
       + "Rule 16 &middot; " + LEY16CAR + " characters</p>";
    return h;
  }
};

function redibuja(){
  svg = document.getElementById("svg");
  const caja = document.getElementById("ficha").getBoundingClientRect();
  if(!caja.width || !caja.height) return;
  D.H = Math.max(420, Math.round(D.W * caja.height / caja.width));
  ESC = caja.width / D.W;
  svg.setAttribute("viewBox", "0 0 " + D.W + " " + D.H);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  gO = el("g", {}, svg);
  P16.lamina();
}

function pintaPanel(){
  const pane = document.getElementById("pane");
  pane.innerHTML = P16.panel();
  document.getElementById("barCont").textContent = "RULE 16 OF 19";

  pane.querySelectorAll("[data-di]").forEach(function(b){
    b.addEventListener("click", function(){
      if(P16.responde) P16.responde(b.getAttribute("data-di"));
    });
  });
}

function toca(){ redibuja(); pintaPanel(); }

(function(){
  const f = document.getElementById("ficha");
  let activo = null;

  function valor(e){
    const caja = f.getBoundingClientRect();
    if(!caja.width) return;
    const u = (e.clientX - caja.left) / caja.width * D.W;
    P16.mueve(activo, u);
    redibuja();
    pintaPanel();
  }

  f.addEventListener("pointerdown", function(e){
    const b = e.target.closest && e.target.closest("[data-boton]");
    if(b){
      P16.pulsa(b.getAttribute("data-boton"));
      return;
    }
    const g = e.target.closest && e.target.closest("[data-mando]");
    if(!g) return;
    activo = g.getAttribute("data-mando");
    f.classList.add("arrastrando");
    try { f.setPointerCapture(e.pointerId); } catch(err){}

    valor(e);
  });

  f.addEventListener("pointermove", function(e){
    if(activo) valor(e);
  });

  ["pointerup", "pointercancel"].forEach(function(t){
    f.addEventListener(t, function(){
      activo = null;
      f.classList.remove("arrastrando");
    });
  });
})();

const PZ = [P16];
function vaPantalla(i){ toca(); }
const vaA = vaPantalla;

addEventListener("resize", redibuja);

if(typeof ResizeObserver !== "undefined")
  new ResizeObserver(redibuja).observe(document.getElementById("ficha"));
toca();

<script data-marco="1">

(function(){
"use strict";

const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

const MARCO = {id:"ripa", i:16, paginas:[{f:"ripa-r0-the-nineteen-rules.html",t:"The nineteen rules"},{f:"ripa-r1-application.html",t:"Rule 1 · Application"},{f:"ripa-r2-responsibility.html",t:"Rule 2 · Responsibility"},{f:"ripa-r3-general-definitions.html",t:"Rule 3 · General definitions"},{f:"ripa-r4-application.html",t:"Rule 4 · Application"},{f:"ripa-r5-look-out.html",t:"Rule 5 · Look-out"},{f:"ripa-r6-safe-speed.html",t:"Rule 6 · Safe speed"},{f:"ripa-r7-risk-of-collision.html",t:"Rule 7 · Risk of collision"},{f:"ripa-r8-action-to-avoid-collision.html",t:"Rule 8 · Action to avoid collision"},{f:"ripa-r9-narrow-channels.html",t:"Rule 9 · Narrow channels"},{f:"ripa-r10-traffic-separation-schemes.html",t:"Rule 10 · Traffic separation schemes"},{f:"ripa-r11-application.html",t:"Rule 11 · Application"},{f:"ripa-r12-sailing-vessels.html",t:"Rule 12 · Sailing vessels"},{f:"ripa-r13-overtaking.html",t:"Rule 13 · Overtaking"},{f:"ripa-r14-head-on-situation.html",t:"Rule 14 · Head-on situation"},{f:"ripa-r15-crossing-situation.html",t:"Rule 15 · Crossing situation"},{f:"ripa-r16-action-by-give-way-vessel.html",t:"Rule 16 · Action by give-way vessel"},{f:"ripa-r17-action-by-stand-on-vessel.html",t:"Rule 17 · Action by stand-on vessel"},{f:"ripa-r18-responsibilities-between-vessels.html",t:"Rule 18 · Responsibilities between vessels"},{f:"ripa-r19-restricted-visibility.html",t:"Rule 19 · Conduct of vessels in restricted visibility"}]};
