function cascoFigura(id){
  const f = (CASCOS_TIPOS.figuras_de_hoy || {})[id] || (CASCOS_TIPOS.tipos || {})[id];
  if(!f) throw new Error("cascos-tipos.json no tiene el dibujo «" + id + "»");
  return f;
}

function puntosPlanta(f, L, P){
  const M = L*f.semimanga;
  return f.planta.map(q => P(L*q[0], M*q[1]));
}
function caminoRedondo(q){
  return "M" + q.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L") + " Z";
}

function caminoFino(q){
  return "M" + q.map(p => p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" L") + " Z";

function cascoVelero(x, y, rumbo, tinta, L, padre){

function aparejoDeVelero(x, y, rumbo, tinta, L, lado, opt){
  const o = opt || {};

  const P = (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  const ap = (o.tipo ? cascoFigura(o.tipo) : cascoFigura("velero_fino")).aparejo;
  const a = P(L*ap.palo[0], ap.palo[1] ? lado*L*ap.palo[1] : 0);
  const b = P(L*ap.botavara[0], lado*L*ap.botavara[1]);

function cascoLadeado(x, y, L, tinta, padre){

function tintaDe(nombre, tinta, o){

function buquePlanta(x, y, rumbo, tinta, L, tipo, opt){
  const o = opt || {}, f = cascoFigura(tipo);
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);

  const P = o.este ? (av, tr) => [x + cs*av - sn*tr, y + sn*av + cs*tr]
                   : (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  const gr = el("g", {"data-barco": o.quien || null, "data-tipo": tipo}, o.padre);
  el("path", {d: caminoFino(puntosPlanta(f, L, P)), fill: tinta,
              opacity: o.op === undefined ? .95 : o.op, "data-buque": "1"}, gr);
  const enPantalla = L*(o.escala || 1);
  (f.detalles || []).forEach(function(dt){
    if(enPantalla < dt.desde_px) return;
    el("path", {d: caminoFino(puntosPlanta({semimanga: f.semimanga, planta: dt.forma}, L, P)),
                fill: tintaDe(dt.tinta, tinta, o), "data-detalle": "1"}, gr);
  });

  if(f.aparejo && !o.este && o.aparejo !== false)
    aparejoDeVelero(x, y, rumbo, tinta, L, o.lado || 1,
                    {tipo: tipo, padre: gr,
                     grueso: o.grueso === undefined ? Math.max(1.2, L*0.025) : o.grueso,
                     palo: o.palo === undefined ? Math.max(1.4, L*0.03) : o.palo,

  return este ? {hx: c*a + s*b, hy: s*a + c*b} : {hx: s*a + c*b, hy: c*a + s*b};
}
function sitiosJunto(x, y, caja, lineas, u){
  const n = lineas.length, w = 6.6*u*Math.max.apply(null, lineas.map(t => t.length));
  return [[x, y + caja.hy + 14*u],

}
function cajaQueOcupa(x, y, caja){

function colocaRotulo(x0, y0, lineas, o){
  const px = o.px, P = o.puestos, c = o.tapa || null;
  const alto = lineas.length*px(o.renglon || 15);
  const ancho = px(o.porLetra || 6.6)*Math.max.apply(null, lineas.map(t => t.length));
  const orilla = o.orilla ? Math.max(px(o.orilla), ancho/2 + px(16)) : ancho/2 + px(16);
  const izq = orilla, der = o.ancho - orilla;
  const suelo = o.y1 - px(28) - alto, techo = o.y0 + px(20);
  const corte = (a0, a1, b0, b1) => Math.max(0, Math.min(a1, b1) - Math.max(a0, b0));
  const choca = (x, y) => (c !== null && x + ancho/2 > c[0] && x - ancho/2 < c[2]
                           && y + alto > c[1] && y - px(12) < c[3])
    || P.some(q => x + ancho/2 > q[0] && x - ancho/2 < q[2]
                && y + alto + px(4) > q[1] && y - px(16) < q[3]);
  const pisa = (x, y) => (c !== null ? corte(x - ancho/2, x + ancho/2, c[0], c[2])
                                       *corte(y - px(12), y + alto, c[1], c[3]) : 0)
    + P.reduce((s, q) => s + corte(x - ancho/2, x + ancho/2, q[0], q[2])
                             *corte(y - px(16), y + alto + px(4), q[1], q[3]), 0);
  let x = Math.max(izq, Math.min(x0, der));
  let y = Math.max(techo, Math.min(y0, suelo));
  if(o.anillos){
    const cabe = (x, y) => x >= izq - 0.5 && x <= der + 0.5
                        && y >= techo - 0.5 && y <= suelo + 0.5;
    if(choca(x, y)){
      let puesto = false, mejor = {x: x, y: y, a: pisa(x, y)};
      for(let r = 1; r <= 30 && !puesto; r++){
        const v = r*px(9), w = v*0.72;
        const vueltas = [[0, v], [0, -v], [v, 0], [-v, 0],
                         [w, w], [-w, w], [w, -w], [-w, -w]];
        for(let i = 0; i < vueltas.length && !puesto; i++){
          const cx = x + vueltas[i][0], cy = y + vueltas[i][1];
          if(!cabe(cx, cy)) continue;
          if(!choca(cx, cy)){ x = cx; y = cy; puesto = true; }
          else { const a = pisa(cx, cy); if(a < mejor.a) mejor = {x: cx, y: cy, a: a}; }
        }
      }
      if(!puesto){ x = mejor.x; y = mejor.y; }
    }
  } else {
    let mejor = {x: x, y: y, a: pisa(x, y)};
    const apunta = v => { const a = pisa(x, v); if(a < mejor.a) mejor = {x: x, y: v, a: a}; };
    if(choca(x, y) && o.otros) for(const q of o.otros){
      const xa = x, w = Math.max(techo, Math.min(q[1], suelo));
      x = Math.max(izq, Math.min(q[0], der));
      if(!choca(x, w)){ y = w; break; }
      apunta(w);
      x = xa;
    }
    if(choca(x, y)){
      let puesto = false;

      for(let v = y; v <= suelo && !puesto; v += px(9))
        if(!choca(x, v)){ y = v; puesto = true; } else apunta(v);
      for(let v = y; v >= techo && !puesto; v -= px(9))
        if(!choca(x, v)){ y = v; puesto = true; } else apunta(v);
      if(!puesto){ x = mejor.x; y = mejor.y; }
    }
  }
  P.push([x - ancho/2, y - px(12), x + ancho/2, y + alto]);
  return {x: x, y: y};
}

function cedenLasSondas(svg, m){
  const todas = [].slice.call(svg.querySelectorAll("text"));
  const sondas = todas.filter(t => t.getAttribute("fill") === "var(--carta-sonda)");

  const otras = todas.filter(t => sondas.indexOf(t) < 0).map(t => t.getBBox())
    .concat([].map.call(svg.querySelectorAll("path[data-buque]"), p => p.getBBox()))
    .concat([].map.call(svg.querySelectorAll("[data-boya]"), p => p.getBBox()));

  const puestas = [];
  sondas.forEach(function(s){
    const a = s.getBBox();
    if(otras.some(b => a.x < b.x + b.width + m && a.x + a.width + m > b.x
                    && a.y < b.y + b.height + m && a.y + a.height + m > b.y)){ s.remove(); return; }
    if(puestas.some(b => a.x < b.x + b.width && a.x + a.width > b.x
                      && a.y < b.y + b.height && a.y + a.height > b.y)){ s.remove(); return; }
    puestas.push(a);
  });
}

function buquePerfil(x, yAgua, L, tipo, tinta, opt){

  if(!f) throw new Error("el tipo «" + tipo + "» no tiene perfil");
  const X = a => x + a*L, Y = z => yAgua - z*L, grueso = Math.max(1, L*0.012);
  const gr = el("g", {"data-tipo": tipo, "data-vista": "perfil"}, o.padre);

              "data-buque": "1"}, gr);

                                                      [X(b.a[1]), Y(b.z[0])], [X(b.a[0]), Y(b.z[0])]]),
                                     fill: tintaDe("suave", tinta, o)}, gr));

function envolturaConvexa(P){
  P = P.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo = [], hi = [];
  for(const q of P){ while(lo.length >= 2 && cr(lo[lo.length-2], lo[lo.length-1], q) <= 0) lo.pop(); lo.push(q); }
  for(let i = P.length - 1; i >= 0; i--){ const q = P[i];
    while(hi.length >= 2 && cr(hi[hi.length-2], hi[hi.length-1], q) <= 0) hi.pop(); hi.push(q); }
  hi.pop(); lo.pop(); return lo.concat(hi);
}

function semiDe(f, a){
  let best = 0;
  const q = f.planta;
  for(let i = 0; i < q.length; i++){
    const A = q[i], B = q[(i + 1) % q.length];
    if((A[0] - a)*(B[0] - a) > 0 || A[0] === B[0]) continue;
    const b = A[1] + (B[1] - A[1])*(a - A[0])/(B[0] - A[0]);
    if(b > best) best = b;
  }
  return best;
}
function buqueAspecto(x, yAgua, L, tipo, m, tinta, opt){
  const o = opt || {}, f = cascoFigura(tipo), pf = f.perfil;
  if(!pf) throw new Error("el tipo «" + tipo + "» no tiene perfil");
  const r = m*Math.PI/180, rx = Math.sin(r), ry = -Math.cos(r), dx = Math.cos(r);
  const M = f.semimanga;
  const S = (a, b, z) => [x + (a*rx + b*M*ry)*L, yAgua - z*L];
  const gr = el("g", {"data-tipo": tipo, "data-vista": "aspecto", "data-marcacion": m}, o.padre);

  const cas = pf.casco, cort = (a, arriba) => { let best = null;
    for(let i = 0; i < cas.length; i++){ const A = cas[i], B = cas[(i+1) % cas.length];
      if((A[0] - a)*(B[0] - a) > 0 || A[0] === B[0]) continue;
      const z = A[1] + (B[1] - A[1])*(a - A[0])/(B[0] - A[0]);
      if(best === null || (arriba ? z > best : z < best)) best = z; }
    return best; };
  const a0 = Math.min.apply(null, cas.map(p => p[0])), a1 = Math.max.apply(null, cas.map(p => p[0]));
  const pts = [];
  for(let i = 0; i <= 40; i++){
    const a = a0 + 0.0001 + (a1 - a0 - 0.0002)*i/40;
    const zt = cort(a, true), zb = cort(a, false); if(zt === null) continue;
    const s = semiDe(f, a);
    pts.push(S(a, s, zt), S(a, -s, zt), S(a, s, zb), S(a, -s, zb));
  }
  el("path", {d: caminoRedondo(envolturaConvexa(pts)), fill: tinta, "data-buque": "1"}, gr);
  pf.bloques.map(b => ({b: b, prof: ((b.a[0] + b.a[1])/2)*dx}))
    .sort((A, B) => A.prof - B.prof).forEach(function(q){
      const b = q.b, Q = [];
      b.a.forEach(a => [-b.semiancho, b.semiancho].forEach(v => b.z.forEach(z => Q.push(S(a, v, z)))));
      el("path", {d: caminoRedondo(envolturaConvexa(Q)), fill: tintaDe("suave", tinta, o)}, gr);
    });
  const grueso = Math.max(1, L*0.012);
  pf.palos.forEach(p => { const A = S(p.a, 0, p.z[0]), B = S(p.a, 0, p.z[1]);
    el("line", {x1: A[0], y1: A[1], x2: B[0], y2: B[1], stroke: tinta, "stroke-width": grueso}, gr); });
  pf.perchas.forEach(p => { const A = S(p.a[0], 0, p.z), B = S(p.a[1], 0, p.z);
    el("line", {x1: A[0], y1: A[1], x2: B[0], y2: B[1], stroke: tinta, "stroke-width": grueso}, gr); });
  return gr;
}

          manda ? "var(--accent-text)" : "var(--lam-dim)", 600, "mono");
      if(estado){
        const a = rango.getBBox(), b = estado.getBBox();
        if(b.x < a.x + a.width + px(6)) estado.setAttribute("y", y0 + altoMax - px(10));
      }
      y += px(22);

      c.cond.forEach(function(t, i){
        const e = txt(xi, y + i*px(19), t, "start", 13,
                      manda ? "var(--ink-title)" : "var(--lam-dim)",
                      manda ? 600 : 400);
        e.setAttribute("font-family", "var(--f-display)");
        e.setAttribute("font-style", "italic");
      });
      y += c.cond.length*px(19) + px(14);

      el("line", {x1: xi, y1: y, x2: x + c.w - D.W*0.020, y2: y,
                  stroke: "var(--lam-linea)", "stroke-width": px(1),
                  opacity: manda ? .7 : .4});

      y = yFilas;

      c.filas.forEach(function(f){
        const suya = f.n === ABRE;

        if(suya){
          const hf = hueco2*0.7 + f.ren.length*salto;
          el("rect", {x: x + px(6), y: y - hueco2*0.35,
                      width: c.w - px(12), height: hf,
                      rx: px(2), fill: "var(--carta)", opacity: .85});
          el("rect", {x: x + px(6), y: y - hueco2*0.35, width: px(3), height: hf,
                      fill: "var(--accent-graphic)"});
        }
        txt(x + sangria - px(8), y + px(11), String(f.n), "end", cuerpo,
            suya ? "var(--ink-title)" : manda ? "var(--lam-dim)" : "var(--lam-linea)",
            600, "mono");
        f.ren.forEach(function(t, i){
          txt(x + sangria, y + px(11) + i*salto, t, "start", cuerpo,
              suya ? "var(--ink-title)"
                   : manda ? "var(--lam-ink)" : "var(--lam-dim)",
              suya ? 600 : 400);
        });
        y += hueco2 + f.ren.length*salto;
      });
    });

    const ult = POS[POS.length - 1];
    if(APILA)
      parte(pieE(VIS), D.W - M*2, 12.5).forEach(function(t, i){
        txt(D.W/2, ult.y + ult.h + px(28) + i*px(17), t, "middle", 12.5,
            "var(--lam-dim)", 400, "mono");
      });
    else {

      const ren = parte(pieE(VIS), D.W - M*2, 12.5);
      ren.forEach(function(t, i){
        txt(D.W/2, Math.min(y0 + altoMax + px(30), D.H - px(14) - (ren.length - 1)*px(16))
            + i*px(16), t, "middle", 12.5, "var(--lam-dim)", 400, "mono");
      });
    }
  },

  mueve(id, u){
    const p = PISTAS[id];
    if(!p) return;
    const t = Math.max(0, Math.min(1, (u - p.x0) / (p.x1 - p.x0)));
    if(id === "vision")
      S11.vision = Math.round((VISION.min + t*(VISION.max - VISION.min))*10)/10;
  },

  panel(){
    let h = "<h3>Rule " + ABRE + "</h3><h2>" + LEY_ABRE.titulo + "</h2>";

    if(CON_MANDO){
      const e = estado11(S11.vision), t = dilo11(e);
      h += '<div class="ahora' + (e.aLaVista ? "" : " mal") + '">'
         + '<p class="uno">' + t.donde + "</p><p>" + t.toca + "</p>"
         + '<p class="eco">' + t.eco + "</p>"
         + '<p class="eco">' + t.siempre + "</p></div>";
    }

    LEY_ABRE.partes.forEach(function(p, i){
      h += '<div class="ley-inciso' + (LEY_ABRE.sub.indexOf(i) >= 0 ? " sub" : "")
         + '">' + p + "</div>";
    });
    h += '<p class="fuente">Navigation Rules &amp; Regulations Handbook &middot; '
       + "Rule " + ABRE + " &middot; " + LEY_ABRE.caracteres + " characters</p>";

    if(DEF_VISTA){
      h += '<h3 class="otra">What decides it</h3>';
      h += '<div class="ley-inciso">' + DEF_VISTA + "</div>";
      h += '<p class="fuente">Navigation Rules &amp; Regulations Handbook &middot; '
         + "Rule 3(k) &middot; the definition, not a paraphrase</p>";
    }
    return h;
  }
};

function redibuja(){
  svg = document.getElementById("svg");
  const ficha = document.getElementById("ficha");

  const movil = !!(window.matchMedia && matchMedia("(max-width:699px)").matches);
  MOVIL_E = movil;
  const pide = movil && !!PB.altoMovil;
  document.documentElement.classList.toggle("pide-alto", pide);
  if(!pide && ficha.style.height) ficha.style.height = "";
  const caja = ficha.getBoundingClientRect();
  if(!caja.width || !caja.height) return;
  D.H = Math.max(420, Math.round(D.W * caja.height / caja.width));
  ESC = caja.width / D.W;
  if(pide){
    const quiere = Math.ceil(PB.altoMovil());

    if(quiere > D.H - 4){
      D.H = quiere;
      const h = Math.ceil(D.H*ESC) + "px";
      if(ficha.style.height !== h) ficha.style.height = h;
    }
  }
  svg.setAttribute("viewBox", "0 0 " + D.W + " " + D.H);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  gO = el("g", {}, svg);
  el("rect", {x: 0, y: 0, width: D.W, height: D.H, fill: "var(--lam-papel)"});
  PB.lamina();
}

function pintaPanel(){
  document.getElementById("pane").innerHTML = PB.panel();
  document.getElementById("barCont").textContent = "RULE 4 OF 19";
}

function toca(){ redibuja(); pintaPanel(); }

const PZ = [PB];

const vaA = vaPantalla;

addEventListener("resize", redibuja);

if(typeof ResizeObserver !== "undefined")
  new ResizeObserver(redibuja).observe(document.getElementById("ficha"));
toca();

<script data-marco="1">

(function(){
"use strict";

const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

const MARCO = {id:"ripa", i:4, paginas:[{f:"ripa-r0-the-nineteen-rules.html",t:"The nineteen rules"},{f:"ripa-r1-application.html",t:"Rule 1 · Application"},{f:"ripa-r2-responsibility.html",t:"Rule 2 · Responsibility"},{f:"ripa-r3-general-definitions.html",t:"Rule 3 · General definitions"},{f:"ripa-r4-application.html",t:"Rule 4 · Application"},{f:"ripa-r5-look-out.html",t:"Rule 5 · Look-out"},{f:"ripa-r6-safe-speed.html",t:"Rule 6 · Safe speed"},{f:"ripa-r7-risk-of-collision.html",t:"Rule 7 · Risk of collision"},{f:"ripa-r8-action-to-avoid-collision.html",t:"Rule 8 · Action to avoid collision"},{f:"ripa-r9-narrow-channels.html",t:"Rule 9 · Narrow channels"},{f:"ripa-r10-traffic-separation-schemes.html",t:"Rule 10 · Traffic separation schemes"},{f:"ripa-r11-application.html",t:"Rule 11 · Application"},{f:"ripa-r12-sailing-vessels.html",t:"Rule 12 · Sailing vessels"},{f:"ripa-r13-overtaking.html",t:"Rule 13 · Overtaking"},{f:"ripa-r14-head-on-situation.html",t:"Rule 14 · Head-on situation"},{f:"ripa-r15-crossing-situation.html",t:"Rule 15 · Crossing situation"},{f:"ripa-r16-action-by-give-way-vessel.html",t:"Rule 16 · Action by give-way vessel"},{f:"ripa-r17-action-by-stand-on-vessel.html",t:"Rule 17 · Action by stand-on vessel"},{f:"ripa-r18-responsibilities-between-vessels.html",t:"Rule 18 · Responsibilities between vessels"},{f:"ripa-r19-restricted-visibility.html",t:"Rule 19 · Conduct of vessels in restricted visibility"}]};
const YO = MARCO.id;
const N = MARCO.paginas.length;
const dosCifras = n => (n < 10 ? "0" : "") + n;
const $ = id => document.getElementById(id);

const LLAVE_NAV = "ripa.nav";
function marcaNav(){ try{ sessionStorage.setItem(LLAVE_NAV, "1"); }catch(e){} }
function veniaDeDentro(){
  try{ return sessionStorage.getItem(LLAVE_NAV) === "1"; }catch(e){ return false; }
}

if(MARCO.i === 0 && !veniaDeDentro()){
  const p = vistoPos(YO, N - 1);
  if(p > 0){ marcaNav(); location.replace(MARCO.paginas[p].f); return; }
}
marcaNav();

vistoEmpieza(YO);
vistoPon(YO, MARCO.i);
if(MARCO.i === N - 1) vistoTermina(YO);

function vaA(i){
  if(i < 0 || i >= N || i === MARCO.i) return;
  marcaNav();
  vistoPon(YO, i);
  location.href = MARCO.paginas[i].f;
}

const CUENTA = dosCifras(MARCO.i + 1) + " / " + dosCifras(N);
function ponCuenta(){
  const b = $("barCont");
  if(b && b.textContent !== CUENTA) b.textContent = CUENTA;
}
ponCuenta();
if(typeof MutationObserver !== "undefined" && $("barCont"))
  new MutationObserver(ponCuenta).observe($("barCont"),
    {childList: true, characterData: true, subtree: true});

(function(){
  const pr = $("prog");
  if(!pr) return;
  pr.innerHTML = "";
  MARCO.paginas.forEach(function(q, i){
    const b = document.createElement("i");
    if(i === MARCO.i) b.className = "on"; else if(i < MARCO.i) b.className = "done";
    b.title = "Screen " + (i + 1) + " of " + N + " · " + q.t;

    b.setAttribute("data-va", i);
    b.onclick = function(){ vaA(i); };
    pr.appendChild(b);
  });
})();

const LLAVE_LOG = "ripa.log";
function leeLog(){
  try{ return parseInt(localStorage.getItem(LLAVE_LOG) || "0", 10) || 0; }
  catch(e){ return 0; }
}
function ponLog(n){ try{ localStorage.setItem(LLAVE_LOG, String(n)); }catch(e){} }
function pintaLog(){
  const f = $("fLog");
  if(!f) return;
  const n = leeLog();
  f.textContent = n + (n === 1 ? " answer logged" : " answers logged");
}
pintaLog();
document.addEventListener("click", function(e){
  const b = e.target.closest ? e.target.closest("[data-di]") : null;
  if(!b) return;
  if(b.getAttribute("data-di") === "otra") return;
  ponLog(leeLog() + 1);
  pintaLog();
}, true);

function hayPregunta(){
  return !!document.querySelector("#pane [data-di]:not([data-di=otra])");
}
function hayOtra(){ return !!document.querySelector("#pane [data-di=otra]"); }

function pintaNav(){
  const pie = $("navPie");
  if(!pie) return;
  const ultima = MARCO.i >= N - 1;
  let h = '<div class="nav">'
    + '<button class="sec" id="atras" data-va="' + (MARCO.i - 1) + '"'
    + (MARCO.i ? "" : " disabled") + ">Back</button>";
  if(hayPregunta())
    h += '<a class="skip" id="salta" data-va="' + (MARCO.i + 1) + '">Skip</a>';
  if(hayOtra()) h += '<button id="otra">Next one</button>';
  h += '<button id="sig" data-va="' + (MARCO.i + 1) + '"'
    + (ultima ? " disabled" : "") + ">"
    + (ultima ? "End of the module" : "Next") + "</button></div>";
  pie.innerHTML = h;
  const a = $("atras"); if(a) a.onclick = function(){ vaA(MARCO.i - 1); };
  const s = $("sig");   if(s) s.onclick = function(){ vaA(MARCO.i + 1); };
  const k = $("salta"); if(k) k.onclick = function(){ vaA(MARCO.i + 1); };
  const o = $("otra");
  if(o) o.onclick = function(){
    const b = document.querySelector("#pane [data-di=otra]");
    if(b) b.click();
  };
}
pintaNav();
if(typeof MutationObserver !== "undefined" && $("pane"))
  new MutationObserver(pintaNav).observe($("pane"), {childList: true, subtree: true});

(function(){
  const d = $("deCero");
  if(!d) return;
  d.onclick = function(){
    vistoOlvida(YO);
    marcaNav();
    location.href = MARCO.paginas[0].f;

})();

(function(){
  const t = $("tSig"), pane = $("pane");

})();
})();
