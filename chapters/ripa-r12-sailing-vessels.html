function sondaDe(i, j){
  const s = Math.sin(i*12.9898 + j*78.233) * 43758.5453;
  return s - Math.floor(s);
}

  const ent = Math.floor(v), dec = Math.round((v - ent)*10);

  t.appendChild(document.createTextNode(String(ent)));
  if(dec){

    u.setAttribute("font-size", px(8));

const LEY12 = ["(a) When two sailing vessels are approaching one another, so as to involve risk of collision, one of them shall keep out of the way of the other as follows:", "(i) when each has the wind on a different side, the vessel which has the wind on the port side shall keep out of the way of the other;", "(ii) when both have the wind on the same side, the vessel which is to windward shall keep out of the way of the vessel which is to leeward;", "(iii) if a vessel with the wind on the port side sees a vessel to windward and cannot determine with certainty whether the other vessel has the wind on the port or on the starboard side, she shall keep out of the way of the other.", "(b) For the purposes of this Rule the windward side shall be deemed to be the side opposite to that on which the mainsail is carried or, in the case of a square-rigged vessel, the side opposite to that on which the largest fore-and-aft sail is carried."];
const LEY12SUB = [1, 2, 3];

const AMURAS = {

const RUMBOS = {

const RUMBO_DUDA = 180;

  sotavento:  {id: "sotavento",  n: "to leeward",  arriba: false}

const ELLA12 = {n: "the other sailing vessel", eslora: 14};
const TU12 = {n: "your own boat", eslora: 11};

const DIBUJO12 = {suelo: 74, referencia: 11, exponente: 1/3};
function esloraDibujada12(m){
  return DIBUJO12.suelo * Math.pow(m/DIBUJO12.referencia, DIBUJO12.exponente);
}

const ANDAR = {45: 5.0, 100: 6.5, 155: 6.0,
               315: 5.0, 260: 6.5, 205: 6.0,
               180: 6.0};
const CITA = {horas: 0.1, n: "six minutes"};

const DESVAIDA = {marcacion: 160, millas: 0.72,
                  n: "far off to leeward, too far to make out her rig"};

const ENCUENTRO = {x: 0, y: -0.04};

const MARGEN = {barlovento: 0.22, entre: 0.40, caja: {x: 0.74, y: 0.66}};

function rumbosDe(am){ return am ? RUMBOS[am] : [RUMBO_DUDA]; }

}
function cabe(p){
  return Math.abs(p.x) <= MARGEN.caja.x && Math.abs(p.y) <= MARGEN.caja.y;
}
function lejosDe(p){
  const g = DESVAIDA.marcacion*Math.PI/180;
  return {x: p.x + DESVAIDA.millas*Math.sin(g),
          y: p.y + DESVAIDA.millas*Math.cos(g), rumbo: null};
}

function geometria(tuya, suya, donde){
  const arriba = sitio(donde).arriba;
  const mios = rumbosDe(tuya);

  if(!suya && !arriba){
    for(let i = 0; i < mios.length; i++){
      const T = atras(mios[i]), E = lejosDe(T);
      if(E.y - T.y > -MARGEN.barlovento) continue;
      if(!cabe(T) || !cabe(E)) continue;
      return {tu: T, ella: E, encuentro: null, desvaida: true};
    }
    return null;
  }

  const suyos = rumbosDe(suya);
  for(let i = 0; i < mios.length; i++)
    for(let j = 0; j < suyos.length; j++){
      const T = atras(mios[i]), E = atras(suyos[j]);
      if(T.rumbo === E.rumbo) continue;
      const dy = E.y - T.y;

      if(arriba ? dy < MARGEN.barlovento : dy > -MARGEN.barlovento) continue;
      if(Math.hypot(E.x - T.x, E.y - T.y) < MARGEN.entre) continue;
      if(!cabe(T) || !cabe(E)) continue;
      return {tu: T, ella: E, encuentro: ENCUENTRO, desvaida: false};
    }
  return null;
}

function cede(tuya, suya, donde){
  const ellaArriba = sitio(donde).arriba;

  if(suya){
    if(tuya !== suya)

      return {quien: tuya === "babor" ? "tu" : "ella", caso: "i", seguro: true};

    return {quien: ellaArriba ? "ella" : "tu", caso: "ii", seguro: true};
  }

  if(tuya === "babor" && ellaArriba)
    return {quien: "tu", caso: "iii", seguro: true};

  const conBabor = cede(tuya, "babor", donde);
  const conEstribor = cede(tuya, "estribor", donde);
  if(conBabor.quien === conEstribor.quien)
    return {quien: conBabor.quien, caso: conBabor.caso + "/" + conEstribor.caso,
            seguro: true, coinciden: true};

  return {quien: null, caso: null, seguro: false,
          ramas: [conBabor, conEstribor]};
}

function estado12(tuya, suya, donde){
  const a = amura(tuya), s = sitio(donde);
  const b = suya ? amura(suya) : null;
  const q = cede(tuya, suya, donde);
  return {
    tuya: a, suya: b, sinDeterminar: !suya, donde: s,

    geo: geometria(tuya, suya, donde),

    tuBarlovento: barloventoDe(a),
    suBarlovento: b ? barloventoDe(b) : null,
    mismaAmura: !!b && b.id === a.id,
    cede: q
  };
}

function cascoEnPlanta(x, y, rumbo, tinta, L, quien, opt){
  const o = opt || {};
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const P = o.este ? (av, tr) => [x + cs*av - sn*tr, y + sn*av + cs*tr]
                   : (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  const M = L*0.09;
  const q = [P(L*0.50, 0), P(L*0.26, M*0.85), P(L*0.10, M),
             P(-L*0.44, M*0.9), P(-L*0.50, M*0.55),
             P(-L*0.50, -M*0.55), P(-L*0.44, -M*0.9),
             P(L*0.10, -M), P(L*0.26, -M*0.85)];
  const gr = el("g", {"data-barco": quien});
  el("path", {d: "M" + q.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L")
                + " Z", fill: tinta, opacity: .95, "data-buque": "1"}, gr);
  return L;
}

function plantaBarco(x, y, rumbo, tinta, op, largo, padre){
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const L = largo || px(24), M = L*0.34;
  const P = (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  const q = [P(L*0.5, 0), P(L*0.14, M), P(-L*0.5, M*0.8),
             P(-L*0.5, -M*0.8), P(L*0.14, -M)];

  el("path", {d: "M" + q.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L")
                + " Z", fill: tinta, opacity: op === undefined ? .95 : op,
              "data-buque": "1"}, padre);
}

function cascoVelero(x, y, rumbo, tinta, L, padre){
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const P = (av, tr) => [x + sn*av + cs*tr, y - cs*av + sn*tr];
  const B2 = L*0.085;
  const casco = [P(L*0.52, 0), P(L*0.10, B2), P(-L*0.40, B2*0.85),

                          .join(" L") + " Z", fill: tinta, opacity: .95,

function aparejoDeVelero(x, y, rumbo, tinta, L, lado, opt){

  const a = P(L*0.10, 0), b = P(-L*0.30, lado*L*0.62);
  const grueso = o.grueso === undefined ? 3 : o.grueso;

const AIRE12 = {x: 118, y: 104};

let E12 = {ox: 0, oy: 0, k: 1, y0: 0, y1: 0, millas: 0};

function fija12(e){
  E12.y0 = px(150);
  E12.y1 = D.H - px(58);

  const P = [e.geo.tu, e.geo.ella];
  if(e.geo.encuentro) P.push(e.geo.encuentro);
  let x0 = P[0].x, x1 = P[0].x, y0 = P[0].y, y1 = P[0].y;
  P.forEach(function(p){
    x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x);
    y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y);
  });

  const w = Math.max(px(80), D.W - px(AIRE12.x)*2);
  const h = Math.max(px(80), (E12.y1 - E12.y0) - px(AIRE12.y)*2);
  const bw = Math.max(x1 - x0, 0.04), bh = Math.max(y1 - y0, 0.04);

  E12.k = Math.min(w/bw, h/bh);
  E12.ox = D.W/2 - (x0 + x1)/2*E12.k;
  E12.oy = (E12.y0 + E12.y1)/2 + (y0 + y1)/2*E12.k;
  E12.millas = D.W / E12.k;
}
const WX = m => E12.ox + m*E12.k;
const WY = m => E12.oy - m*E12.k;

function rotula12(x, y, r, lineas, tinta){
  const alto = lineas.length*px(15);
  const debajo = y + r + px(18) + alto < E12.y1 - px(26);
  lineas.forEach(function(t, i){
    const yy = debajo ? y + r + px(18) + i*px(15)
                      : y - r - px(14) - (lineas.length - 1 - i)*px(15);
    txt(x, yy, t, "middle", 10.5, tinta, 600, "mono");
  });
}

const P12 = {
  h: "Sailing vessels",
  arriba: "Rule 12",

  escena(e){
    const g = e.geo;
    const tuX = WX(g.tu.x), tuY = WY(g.tu.y);
    const suX = WX(g.ella.x), suY = WY(g.ella.y);

    const q = e.cede;
    const tintaTu = !q.seguro ? "var(--lam-tibio)"
                  : q.quien === "tu" ? "var(--lam-alarm)" : "var(--lam-ok)";
    const tintaSu = !q.seguro ? "var(--lam-tibio)"
                  : q.quien === "ella" ? "var(--lam-alarm)" : "var(--lam-ok)";

    derrotas12(g, tintaTu, tintaSu);

    const rTu = velero12(tuX, tuY, e.tuya, tintaTu, TU12.eslora, g.tu.rumbo, "tu")*0.5;
    const rSu = g.desvaida
      ? desvaida12(suX, suY, tintaSu, ELLA12.eslora)
      : velero12(suX, suY, e.suya, tintaSu, ELLA12.eslora, g.ella.rumbo, "ella")*0.5;

    rotula12(tuX, tuY, rTu, ["you", e.tuya.n,
                             q.quien === "tu" ? "you keep clear" : ""].filter(Boolean),
             tintaTu);
    rotula12(suX, suY, rSu, g.desvaida
      ? ["her", "too far off to make out her rig",
         q.quien === "ella" ? "she keeps clear" : ""].filter(Boolean)
      : e.sinDeterminar
      ? ["her", "end-on \u00b7 no boom in sight",
         q.quien === "ella" ? "she keeps clear" : ""].filter(Boolean)
      : ["her", e.suya.n,
         q.quien === "ella" ? "she keeps clear" : ""].filter(Boolean), tintaSu);

    if(!q.seguro){

      const alto = E12.y0 + px(24), bajo = E12.y1 - px(30);
      const cerca = y => Math.min(Math.abs(tuY - y), Math.abs(suY - y));
      txt(D.W/2, cerca(alto) >= cerca(bajo) ? alto : bajo,
          "the Rule does not settle this one", "middle", 11.5,
          "var(--lam-tibio)", 600, "mono");
    }
  },

  lamina(){

    const e = estado12(S12.tuya, S12.suya, S12.donde);
    fija12(e);

    const G = e.geo;
    VETADO12 = [G.tu, G.ella].map(function(p){

      return [WX(p.x) - px(150), WY(p.y) - px(96),
              WX(p.x) + px(150), WY(p.y) + px(96)];
    });
    VETADO12.push([0, E12.y0, px(300), E12.y0 + px(48)]);

    VETADO12.push([0, E12.y1 - px(48), px(420), E12.y1]);

    VETADO12.push([D.W/2 - px(170), E12.y0, D.W/2 + px(170), E12.y0 + px(40)]);
    VETADO12.push([D.W/2 - px(170), E12.y1 - px(46), D.W/2 + px(170), E12.y1 - px(14)]);
    if(G.encuentro)

      VETADO12.push([WX(G.encuentro.x) - px(200), WY(G.encuentro.y) - px(40),
                     WX(G.encuentro.x) + px(200), WY(G.encuentro.y) + px(46)]);

    carta12();
    viento12();
    this.escena(e);

    const M = D.W*0.028, w = D.W - M*2;
    el("rect", {x: 0, y: 0, width: D.W, height: E12.y0, fill: "var(--lam-papel)"});
    el("line", {x1: 0, y1: E12.y0, x2: D.W, y2: E12.y0, stroke: "var(--edge-card)",
                "stroke-width": px(1)});
    el("rect", {x: 0, y: E12.y1, width: D.W, height: D.H - E12.y1,
                fill: "var(--lam-papel)"});
    el("line", {x1: 0, y1: E12.y1, x2: D.W, y2: E12.y1, stroke: "var(--edge-card)",
                "stroke-width": px(1)});

    txt(M, px(24), "TWO SAILING VESSELS, AND THE WIND", "start", 12,
        "var(--lam-dim)", 600, "mono");

    const hb = px(30), col = (w - D.W*0.05)/2;
    txt(M, px(52), "YOUR TACK", "start", 11, "var(--lam-dim)", 600, "mono");
    ["babor", "estribor"].forEach(function(k, i){
      const bw = (col - px(10))/2;
      boton12("t:" + k, M + i*(bw + px(10)), px(62), bw, hb,
              AMURAS[k].n, k === S12.tuya);
    });

    const x2 = M + col + D.W*0.05;
    txt(x2, px(52), "HER TACK", "start", 11, "var(--lam-dim)", 600, "mono");
    [["babor", AMURAS.babor.n], ["estribor", AMURAS.estribor.n],
     ["duda", "you cannot tell"]].forEach(function(q, i){
      const bw = (col - px(20))/3;
      boton12("s:" + q[0], x2 + i*(bw + px(10)), px(62), bw, hb, q[1],
              (q[0] === "duda") === (S12.suya === null)
                && (q[0] === "duda" || q[0] === S12.suya),
              q[0] === "duda" ? "var(--lam-tibio)" : null);
    });

    const ws = (w - px(10))/2, ys = E12.y1 + px(14);
    ["barlovento", "sotavento"].forEach(function(k, i){
      boton12("d:" + k, M + i*(ws + px(10)), ys, ws, px(30),
              "she is " + SITIOS[k].n, k === S12.donde);
    });
  },

  pulsa(clave){
    if(clave.indexOf("t:") === 0){ S12.tuya = clave.slice(2); toca(); return; }
    if(clave.indexOf("s:") === 0){
      const v = clave.slice(2);
      S12.suya = (v === "duda") ? null : v;
      toca(); return;
    }
    if(clave.indexOf("d:") === 0){ S12.donde = clave.slice(2); toca(); return; }
  },

  panel(){
    const e = estado12(S12.tuya, S12.suya, S12.donde);
    const t = dilo12(e);
    let h = "<h3>Rule 12</h3><h2>Sailing vessels</h2>";

    h += '<div data-cede="' + (t.quien || "nadie") + '"'
       + ' data-caso="' + (t.caso || "ninguno") + '"'
       + ' class="ahora' + (t.quien === "tu" ? " mal"
                              : !t.seguro ? " tibio" : "") + '">'
       + '<p class="uno">' + t.donde + "</p>"

       + '<p class="riesgo">' + t.riesgo + "</p>"
       + "<p>" + t.toca + "</p>"
       + (t.aviso ? '<div class="notas"><div class="nota">'
                  + '<span class="nl">(a)(' + (t.caso || "iii") + ')</span>'
                  + '<p class="nt">' + t.aviso + "</p></div></div>" : "")
       + '<div class="notas"><div class="nota"><span class="nl">(b)</span>'
       + '<p class="nt">' + t.bes + "</p></div>"
       + '<div class="nota"><span class="nl">(a)</span>'
       + '<p class="nt">' + t.abanico + "</p></div>"
       + (t.mantiene ? '<div class="nota"><span class="nl">Rule 17</span>'
                     + '<p class="nt">' + t.mantiene + "</p></div>" : "")
       + "</div></div>";

    h += "<h3>The readings</h3>";
    h += '<dl class="cifras">'
       + "<dt>The wind</dt><dd>" + VIENTO.n + "</dd>"
       + "<dt>You are on</dt><dd>the " + e.tuya.n + ", mainsail to "
       + (e.tuya.mayor === "estribor" ? "starboard" : "port") + "</dd>"
       + "<dt>She is</dt><dd>" + e.donde.n + " of you</dd>"
       + "<dt>Risk of collision</dt><dd>"
       + (e.geo && e.geo.desvaida
          ? "her bearing is steady and the range is closing"
          : "yes &middot; your two tracks meet, and you get there together")
       + "</dd>"
       + "<dt>Her tack</dt><dd>"
       + (e.sinDeterminar ? "you cannot determine it with certainty"
          : "the " + e.suya.n) + "</dd>"
       + "<dt>Who keeps clear</dt><dd>"
       + (t.quien === "tu" ? "you" : t.quien === "ella" ? "she does"
          : "Rule 12 does not settle it")
       + (t.caso ? " &middot; Rule 12(a)(" + t.caso + ")" : "") + "</dd>"
       + "</dl>";

    h += '<p class="buque">The wind is declared, not given by the Rule: without it '
       + "none of the three cases can be read. <b>The Rule gives no figures at all "
       + "&mdash; not one</b>; it decides by which side the wind is on and by who is "
       + "to windward, and both of those you read off the other vessel's boom. <b>The "
       + "hulls are drawn on a compressed scale</b> so that the smaller of them is "
       + "still something you can find.</p>";

    h += "<h3>The Rule</h3>";
    LEY12.forEach(function(p, i){
      h += '<div class="ley-inciso' + (LEY12SUB.indexOf(i) >= 0 ? " sub" : "")
         + '">' + p + "</div>";
    });
    h += '<p class="fuente">Navigation Rules &amp; Regulations Handbook &middot; '
       + "Rule 12 &middot; " + LEY12CAR + " characters</p>";
    return h;
  }
};

function redibuja(){
  svg = document.getElementById("svg");
  const caja = document.getElementById("ficha").getBoundingClientRect();
  if(!caja.width || !caja.height) return;
  D.H = Math.max(420, Math.round(D.W * caja.height / caja.width));
  ESC = caja.width / D.W;
  svg.setAttribute("viewBox", "0 0 " + D.W + " " + D.H);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  gO = el("g", {}, svg);
  P12.lamina();
}

function pintaPanel(){
  document.getElementById("pane").innerHTML = P12.panel();
  document.getElementById("barCont").textContent = "RULE 12 OF 19";
}

function toca(){ redibuja(); pintaPanel(); }

(function(){
  const f = document.getElementById("ficha");
  let activo = null;

  function valor(e){
    const caja = f.getBoundingClientRect();
    if(!caja.width) return;
    const u = (e.clientX - caja.left) / caja.width * D.W;
    P12.mueve(activo, u);
    redibuja();
    pintaPanel();
  }

  f.addEventListener("pointerdown", function(e){
    const b = e.target.closest && e.target.closest("[data-boton]");
    if(b){
      P12.pulsa(b.getAttribute("data-boton"));
      return;
    }
    const g = e.target.closest && e.target.closest("[data-mando]");
    if(!g) return;
    activo = g.getAttribute("data-mando");
    f.classList.add("arrastrando");
    try { f.setPointerCapture(e.pointerId); } catch(err){}

    valor(e);
  });

  f.addEventListener("pointermove", function(e){
    if(activo) valor(e);
  });

  ["pointerup", "pointercancel"].forEach(function(t){
    f.addEventListener(t, function(){
      activo = null;
      f.classList.remove("arrastrando");
    });
  });
})();

const PZ = [P12];
function vaPantalla(i){ toca(); }
const vaA = vaPantalla;

addEventListener("resize", redibuja);

if(typeof ResizeObserver !== "undefined")
  new ResizeObserver(redibuja).observe(document.getElementById("ficha"));
toca();
</script>
<script data-marco="1">

(function(){
"use strict";

const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

const MARCO = {id:"ripa", i:12, paginas:[{f:"ripa-r0-the-nineteen-rules.html",t:"The nineteen rules"},{f:"ripa-r1-application.html",t:"Rule 1 · Application"},{f:"ripa-r2-responsibility.html",t:"Rule 2 · Responsibility"},{f:"ripa-r3-general-definitions.html",t:"Rule 3 · General definitions"},{f:"ripa-r4-application.html",t:"Rule 4 · Application"},{f:"ripa-r5-look-out.html",t:"Rule 5 · Look-out"},{f:"ripa-r6-safe-speed.html",t:"Rule 6 · Safe speed"},{f:"ripa-r7-risk-of-collision.html",t:"Rule 7 · Risk of collision"},{f:"ripa-r8-action-to-avoid-collision.html",t:"Rule 8 · Action to avoid collision"},{f:"ripa-r9-narrow-channels.html",t:"Rule 9 · Narrow channels"},{f:"ripa-r10-traffic-separation-schemes.html",t:"Rule 10 · Traffic separation schemes"},{f:"ripa-r11-application.html",t:"Rule 11 · Application"},{f:"ripa-r12-sailing-vessels.html",t:"Rule 12 · Sailing vessels"},{f:"ripa-r13-overtaking.html",t:"Rule 13 · Overtaking"},{f:"ripa-r14-head-on-situation.html",t:"Rule 14 · Head-on situation"},{f:"ripa-r15-crossing-situation.html",t:"Rule 15 · Crossing situation"},{f:"ripa-r16-action-by-give-way-vessel.html",t:"Rule 16 · Action by give-way vessel"},{f:"ripa-r17-action-by-stand-on-vessel.html",t:"Rule 17 · Action by stand-on vessel"},{f:"ripa-r18-responsibilities-between-vessels.html",t:"Rule 18 · Responsibilities between vessels"},{f:"ripa-r19-restricted-visibility.html",t:"Rule 19 · Conduct of vessels in restricted visibility"}]};
const YO = MARCO.id;
const N = MARCO.paginas.length;
const dosCifras = n => (n < 10 ? "0" : "") + n;
const $ = id => document.getElementById(id);

const LLAVE_NAV = "ripa.nav";
function marcaNav(){ try{ sessionStorage.setItem(LLAVE_NAV, "1"); }catch(e){} }
function veniaDeDentro(){
  try{ return sessionStorage.getItem(LLAVE_NAV) === "1"; }catch(e){ return false; }
}

if(MARCO.i === 0 && !veniaDeDentro()){
  const p = vistoPos(YO, N - 1);
  if(p > 0){ marcaNav(); location.replace(MARCO.paginas[p].f); return; }
}
marcaNav();

vistoEmpieza(YO);
vistoPon(YO, MARCO.i);
if(MARCO.i === N - 1) vistoTermina(YO);

function vaA(i){
  if(i < 0 || i >= N || i === MARCO.i) return;
  marcaNav();
  vistoPon(YO, i);
  location.href = MARCO.paginas[i].f;
}

const CUENTA = dosCifras(MARCO.i + 1) + " / " + dosCifras(N);
function ponCuenta(){
  const b = $("barCont");
  if(b && b.textContent !== CUENTA) b.textContent = CUENTA;
}
ponCuenta();
if(typeof MutationObserver !== "undefined" && $("barCont"))
  new MutationObserver(ponCuenta).observe($("barCont"),
    {childList: true, characterData: true, subtree: true});

(function(){
  const pr = $("prog");
  if(!pr) return;
  pr.innerHTML = "";
  MARCO.paginas.forEach(function(q, i){
    const b = document.createElement("i");
    if(i === MARCO.i) b.className = "on"; else if(i < MARCO.i) b.className = "done";
    b.title = "Screen " + (i + 1) + " of " + N + " · " + q.t;

    b.setAttribute("data-va", i);
    b.onclick = function(){ vaA(i); };
    pr.appendChild(b);
  });
})();

const LLAVE_LOG = "ripa.log";
function leeLog(){
  try{ return parseInt(localStorage.getItem(LLAVE_LOG) || "0", 10) || 0; }
  catch(e){ return 0; }
}
function ponLog(n){ try{ localStorage.setItem(LLAVE_LOG, String(n)); }catch(e){} }
function pintaLog(){
  const f = $("fLog");
  if(!f) return;
  const n = leeLog();
  f.textContent = n + (n === 1 ? " answer logged" : " answers logged");
}
pintaLog();
document.addEventListener("click", function(e){
  const b = e.target.closest ? e.target.closest("[data-di]") : null;
  if(!b) return;
  if(b.getAttribute("data-di") === "otra") return;
  ponLog(leeLog() + 1);
  pintaLog();
}, true);

function hayPregunta(){
  return !!document.querySelector("#pane [data-di]:not([data-di=otra])");
}
function hayOtra(){ return !!document.querySelector("#pane [data-di=otra]"); }

function pintaNav(){
  const pie = $("navPie");
  if(!pie) return;
  const ultima = MARCO.i >= N - 1;
  let h = '<div class="nav">'
    + '<button class="sec" id="atras" data-va="' + (MARCO.i - 1) + '"'
    + (MARCO.i ? "" : " disabled") + ">Back</button>";
  if(hayPregunta())
    h += '<a class="skip" id="salta" data-va="' + (MARCO.i + 1) + '">Skip</a>';
  if(hayOtra()) h += '<button id="otra">Next one</button>';
  h += '<button id="sig" data-va="' + (MARCO.i + 1) + '"'
    + (ultima ? " disabled" : "") + ">"
    + (ultima ? "End of the module" : "Next") + "</button></div>";
  pie.innerHTML = h;
  const a = $("atras"); if(a) a.onclick = function(){ vaA(MARCO.i - 1); };
  const s = $("sig");   if(s) s.onclick = function(){ vaA(MARCO.i + 1); };
  const k = $("salta"); if(k) k.onclick = function(){ vaA(MARCO.i + 1); };
  const o = $("otra");
  if(o) o.onclick = function(){
    const b = document.querySelector("#pane [data-di=otra]");
    if(b) b.click();
  };
}
pintaNav();
if(typeof MutationObserver !== "undefined" && $("pane"))
  new MutationObserver(pintaNav).observe($("pane"), {childList: true, subtree: true});

(function(){
  const d = $("deCero");
  if(!d) return;
  d.onclick = function(){
    vistoOlvida(YO);
    marcaNav();
    location.href = MARCO.paginas[0].f;
  };
})();

(function(){
  const t = $("tSig"), pane = $("pane");
  if(!t || !pane || !t.innerHTML.trim()) return;
  if(document.querySelector(".ot-cierre")) return;
  pane.insertAdjacentHTML("afterend", t.innerHTML);
})();
})();
