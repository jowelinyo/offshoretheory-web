ro", 0.3333], ["rojo", 0.3333], ["negro", 0.3333]]}, {"id": "especial", "nombre": "Special", "corto": "Special", "familia": "especial", "codigo": "Y", "forma": "can", "cuerpo": "lata", "tope": "aspa", "luz": "Fl.Y.5s", "fuente": "dato", "bandas": [["amarillo", 1.0]]}, {"id": "pref-estribor", "nombre": "Preferred channel to starboard", "corto": "Pref stbd", "familia": "preferente", "codigo": "RGR", "forma": "can", "cuerpo": "lata", "tope": "lata", "bandas": [["rojo", 0.34], ["verde", 0.3], ["rojo", 0.36]], "luz": "Fl(2+1)R.10s", "fuente": "memoria"}, {"id": "pref-babor", "nombre": "Preferred channel to port", "corto": "Pref port", "familia": "preferente", "codigo": "GRG", "forma": "conica", "cuerpo": "cono", "tope": "cono", "bandas": [["verde", 0.34], ["rojo", 0.3], ["verde", 0.36]], "luz": "Fl(2+1)G.10s", "fuente": "memoria"}, {"id": "nuevo-peligro", "nombre": "New danger", "corto": "New danger", "familia": "peligro", "codigo": "BuY", "forma": "pilar", "cuerpo": "pilarV", "tope": "cruz", "franjas": ["azul", "amarillo", "azul", "amarillo"], "luz": "Al.Oc.Bu.Y3s", "fuente": "memoria"}];

const RUMBO={N:-90, E:0, S:90, W:180};

function obraEnmarca(s){
 lamina(s.lamina||"");

 const ids=s.marcas||MARCAS.map(m=>m.id);
 const n=ids.length, fila=Math.min(n,5), filas=Math.ceil(n/fila);
 const k=n<=2?110:n<=5?86:72;

 const sobre=px(k*2)+px(4), bajo=px(s.nombres?34:8), sep=px(56);
 const altoPieza=sobre+bajo;
 const bloque=filas*altoPieza+(filas-1)*sep;

 const _h=HOJA(), arriba=px(s.lamina?46:26), abajo=px(20);
 const y0=_h.y0+arriba+((_h.al-arriba-abajo)-bloque)/2+sobre;

 ids.forEach((id,i)=>{
   const m=marcaDe(id); if(!m)return;
   const cx=px(MARGEN)+px(20)+dx*(i%fila)+dx/2;
   const base=y0+(altoPieza+sep)*Math.floor(i/fila);
   marca(m,cx,base,k,{nombre:s.nombres?m.nombre:null});});

 if(s.rosa) rosa(D.W-px(96), px(MARGEN)+px(70), px(30));

 return null;}

let EX={sel:null, vistas:{}};
function obraExplora(s){

 ids.forEach((id,i)=>{
  const m=marcaDe(id); if(!m)return;
  const cx=px(MARGEN)+px(20)+dx*i+dx/2;
  const sel=(EX.sel===id), visto=!!EX.vistas[id];
  const g=marca(m,cx,y-(sel?px(10):0),sel?kMax:kMax*0.90,{});

  el("rect",{x:cx-dx/2+px(6),y:px(MARGEN)+px(30),width:dx-px(12),

  const largo=m.nombre, cabe=largo.length*px(T.dato)*0.62 <= dx-px(14);

      visto?C.tinta:C.suave, visto?600:400,"ui",.4);
  if(sel)el("line",{x1:cx-px(46),y1:y+px(40),x2:cx+px(46),y2:y+px(40),

function obraEjemplo(s,i){
 lamina(s.lamina||"");
 const m=marcaDe(EJ.marca)||MARCAS[0], v=s.tramos[i].ensena||{};

 const cx=D.W/2, k=kQueCabe(175,px(30),px(76)), base=lineaAgua(k,px(30),px(76));

 }

       fill:C.magenta});
     flecha(base2-2*r-hueco-r, m.conos[0]);

 if(v.cuerpo) agua(cx,base,ancho*1.15);

function bolsa(lista,semilla){
 let s=semilla||1, idx=[], i=0;
 const rnd=()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return (s>>>0)/4294967296;};
 const barajar=()=>{idx=lista.map((_,k)=>k);
   for(let j=idx.length-1;j>0;j--){const t=Math.floor(rnd()*(j+1));
     [idx[j],idx[t]]=[idx[t],idx[j]];} i=0;};
 barajar();
 return {saca:()=>{if(i>=idx.length)barajar(); return lista[idx[i++]];}};}
const BOLSAS={};
function bancoDe(s){return BANCOS[s.banco]||[];}
function sacaDe(s){
 if(!BOLSAS[s.banco])BOLSAS[s.banco]=bolsa(bancoDe(s),AZAR+s.id.charCodeAt(0));
 return BOLSAS[s.banco].saca();}
window.bolsaDe=s=>BOLSAS[s.banco];

function salta(s){

 if(PR.meta===2){PR.meta=3;
   PR.res='<div class="res">Skipped. One more after this.</div>';}
 prNuevo();}

function responde(s,k){
 const q=PR.q, bien=(k===q.ok);
 LOG.push({id:s.id,q:q.id,k:k,bien:bien});
 document.getElementById("fLog").textContent=LOG.length+" answers logged";

 if(bien){ PR.hecho=true; PR.n++;
   PR.res='<div class="res si"><b>Yes.</b> '+q.porque+"</div>";

   if(PR.fallos&&PR.meta===2){PR.meta=3;
     PR.res+='<div class="res">Two was the plan; the third is here because you '
       +"slipped, and it goes away as soon as you do not.</div>";}
 }else{ PR.fallos++;
   PR.res='<div class="res no"><b>Not that one.</b> '+(q.mal&&q.mal[k]||"")+"</div>";
   if(PR.fallos>=1&&q.pista)PR.res+='<div class="pista">'+q.pista+"</div>";}

 LOG.push({id:s.id,q:q.id,k:-1,bien:false,show:true});
 PR.res='<div class="res ver"><b>'+q.opciones[q.ok].replace(/<[^>]+>/g,"")+"</b>"
   +q.show+"</div>";
 if(PR.meta===2){PR.meta=3;}
 pinta();}

 else if(s.obra==="enmarca")obraEnmarca(s);

 else if(s.obra==="practica")obraPractica();

"use strict";

const ritmoFase = (t, per) => ((t % per) + per) % per;

function ritmoTramo(on, per, t){
 const f = ritmoFase(t, per);
 for(let i=0;i<on.length;i++) if(f >= on[i][0] && f < on[i][1]) return i;
 return -1;
}

function ritmoEncendida(on, per, t){ return ritmoTramo(on, per, t) >= 0; }

function ritmoMotor(pinta){
 const M = {t:0, ref:0, raf:null, on:null, per:10};
 M.luz = (on, per) => { M.on = on || null; M.per = per || 10; };
 M.paso = now => {
  M.t = (now - M.ref) / 1000;
  if(M.on) pinta(ritmoEncendida(M.on, M.per, M.t), M.t);
  M.raf = requestAnimationFrame(M.paso);
 };
 M.arranca = () => {
  if(M.raf != null || typeof requestAnimationFrame === "undefined") return;
  M.ref = performance.now() - M.t * 1000;
  M.raf = requestAnimationFrame(M.paso);
 };
 M.para = () => {
  if(M.raf == null) return;
  cancelAnimationFrame(M.raf); M.raf = null;
 };
 M.anda = () => M.raf != null;
 return M;
}

"use strict";
const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

function fcAnota(id, bien){
 const o = fcLee(), c = o.cartas[id] || {ok:0, mal:0, peso:1};
 if(bien){ c.ok++; c.peso = Math.max(1, c.peso - 1); }
 else    { c.mal++; c.peso = 3; }
 o.cartas[id] = c; fcGuarda(o);
}

let FCR = ((typeof AZAR === "number" ? AZAR : 1) >>> 0) || 1;
function fcAzar(){ FCR ^= FCR<<13; FCR >>>= 0; FCR ^= FCR>>>17; FCR ^= FCR<<5;
 FCR >>>= 0; return FCR / 4294967296; }

const fcModo = id => CARTAS_MODOS.filter(m => m.id === id)[0];
const fcDelModo = id => CARTAS.filter(c => c.modo === id);

const fcAbierto = id => vistoEmpezada(fcModo(id).requiere);

function fcReparte(modo, n){
 const pool = fcDelModo(modo).slice(), out = [];
 while(out.length < n && pool.length){
  let tot = 0; for(const c of pool) tot += fcPeso(c.id);
  let r = fcAzar() * tot, k = 0;
  while(k < pool.length - 1 && (r -= fcPeso(pool[k].id)) > 0) k++;
  out.push(pool.splice(k, 1)[0].id);
 }
 return out;
}

function fcEmpieza(modo){
 FC.modo = modo; FC.ses = fcReparte(modo, POR_SESION);
 FC.i = 0; FC.vuelta = false; FC.primera = {}; FC.repes = {};
 fcRitmoPara(); pinta();
}

const fcCarta = () => CARTAS.filter(c => c.id === FC.ses[FC.i])[0];
const fcFin = () => !!FC.ses && FC.i >= FC.ses.length;

const FC_VUELTAS = 1;

function fcJuzga(bien){
 const id = FC.ses[FC.i];
 if(!(id in FC.primera)) FC.primera[id] = bien;
 fcAnota(id, bien);
 FC.repes = FC.repes || {};
 if(!bien && (FC.repes[id] || 0) < FC_VUELTAS && FC.ses.indexOf(id, FC.i + 1) < 0){
  FC.repes[id] = (FC.repes[id] || 0) + 1;
  FC.ses.splice(Math.min(FC.i + 4, FC.ses.length), 0, id);
 }
 FC.i++; FC.vuelta = false; fcRitmoPara(); pinta();
}

window.fcAbre = () => { FC.on = true; FC.desde = iP; FC.modo = null; FC.ses = null;
 fcRitmoPara(); pinta(); };
window.fcCierra = () => { FC.on = false; fcRitmoPara(); vaA(FC.desde); };

function fcRejilla(ids, titulo){
 fcRitmoPara();
 lamina(titulo || "");
 const n = ids.length; if(!n) return;
 const fila = Math.min(n, 6), filas = Math.ceil(n / fila);
 const k0 = n <= 3 ? 96 : n <= 6 ? 74 : 60;
 const arriba = px(46), abajo = px(30);
 const k = kQueCabe(k0 * filas, arriba, abajo) / filas;
 const alto = px(2 * k) + px(30), sep = px(20);
 const bloque = filas * alto + (filas - 1) * sep;
 const h = HOJA();
 const y0 = h.y0 + arriba + ((h.al - arriba - abajo) - bloque) / 2 + px(2 * k);
 const dx = (D.W - px(2 * MARGEN) - px(30)) / fila;
 ids.forEach((id, i) => {
  const m = marcaDe(id); if(!m) return;
  marca(m, px(MARGEN) + px(15) + dx * (i % fila) + dx / 2,
        y0 + (alto + sep) * Math.floor(i / fila), k,
        {agua:false, nombre:m.corto});
 });
}

function fcLuz(cx, cy, r, rt){
 const halo = el("circle", {cx:cx, cy:cy, r:r*2.4, fill:rt.hex, "fill-opacity":0});
 const lam  = el("circle", {cx:cx, cy:cy, r:r, fill:LUZ_APAGADA,
                            stroke:C.raya, "stroke-width":px(1.4)});
 FC.luz = {on:rt.on, per:rt.per, cols:rt.cols, lam:lam, halo:halo};
 FC.rit = ritmoMotor((_, t) => fcPinta(t));
 FC.rit.luz(rt.on, rt.per);
 FC.rit.arranca();
}

function fcPinta(t){
 const L = FC.luz; if(!L) return;
 const k = ritmoTramo(L.on, L.per, t);
 L.lam.setAttribute("fill", k < 0 ? LUZ_APAGADA : L.cols[k]);
 L.halo.setAttribute("fill-opacity", k < 0 ? 0 : .30);
 if(k >= 0) L.halo.setAttribute("fill", L.cols[k]);
}

function fcLienzo(){
 if(!FC.modo || fcFin()){
  const ids = fcFin()
   ? FC.ses.filter((id,i,a) => a.indexOf(id)===i && FC.primera[id]===false)
           .map(id => CARTAS.filter(c=>c.id===id)[0].marca)
   : CARTAS_ORDEN;
  fcRejilla(ids, fcFin() ? "the ones you missed" : "the deck");
  return;
 }

 lamina("");
 const c = fcCarta(); if(!c) return;
 const rt = c.ritmo;

 if(rt && !c.marca){
  const h = HOJA();
  el("rect", {x:h.x0, y:h.y0, width:h.an, height:h.al, rx:px(3), fill:"#08161D"});
  fcLuz(D.W / 2, h.y0 + h.al * 0.46, px(26), rt);
  txt(D.W / 2, h.y1 - px(16), "watch one whole cycle", "middle",
      T.rot, "#4E6B78", 600, "ui", .8);
  return;
 }

 const m = marcaDe(c.marca); if(!m) return;

 const alto = rt ? px(34) : 0;
 const k = kQueCabe(230, px(24) + alto, px(40));
 const base = lineaAgua(k, px(24) + alto, px(40));
 marca(m, D.W / 2, base, k, {agua:false});
 if(rt) fcLuz(D.W / 2, base - px(2 * k) - px(16), px(11), rt);
}

function fcPanel(p){
 const hd = document.createElement("div"); hd.className = "hd";
 hd.innerHTML = "<h3>Flashcards</h3>";
 p.appendChild(hd);

 if(!FC.modo){ fcElector(p); return; }
 if(fcFin()){ fcRecuento(p); return; }

 const c = fcCarta(), md = fcModo(FC.modo), d = c.detras;
 p.insertAdjacentHTML("beforeend",
  '<span class="prl">' + md.titulo + " · card " + (FC.i + 1) + " of " + FC.ses.length
  + "</span>");
 p.insertAdjacentHTML("beforeend", '<b class="q">' + md.pregunta + "</b>");

 if(!FC.vuelta){
  const nav = document.createElement("div"); nav.className = "nav";
  nav.innerHTML = '<button class="sec" id="fcSal">Leave</button>'
   + '<button id="fcV">Turn it over</button>';
  p.appendChild(nav);

  nav.querySelector("#fcV").onclick = () => { FC.vuelta = true; pinta(); };
  nav.querySelector("#fcSal").onclick = window.fcCierra;
  return;
 }

 p.insertAdjacentHTML("beforeend",
  '<div class="res ver"><b>' + d.nombre + "</b>"
  + "<p>" + d.senas.join(" &middot; ") + "</p>"
  + "<p>" + d.hace + "</p>"

  + '<div class="calc">' + d.luz
     + (d.fuente === "memoria" ? "  <b>(from memory, not the chart)</b>" : "")
     + "</div>"

  + (d.libre ? '<div class="pista">' + d.libre + "</div>" : "")
  + "</div>");

 const nav = document.createElement("div"); nav.className = "nav";
 nav.innerHTML = '<button class="sec" id="fcMal">Missed it</button>'
  + '<button class="show" id="fcBien">Got it</button>';
 p.appendChild(nav);
 nav.querySelector("#fcBien").onclick = () => fcJuzga(true);
 nav.querySelector("#fcMal").onclick = () => fcJuzga(false);
}

function fcElector(p){
 p.insertAdjacentHTML("beforeend",
  "<p>Twelve marks, four ways. <b>Pick what you want to practise</b> — they are "
  + "different things to remember, so they are never mixed in one run.</p>"
  + "<p><em>Shape and rhythm are two separate memories. Mixing them trains both "
  + "worse: you answer with whichever comes first and the other never gets its "
  + "turn. <b>The whole buoy</b> is the last step, not the first.</em></p>");

 if(!vistoHayAlmacen())
  p.insertAdjacentHTML("beforeend",
   '<div class="res no">This browser is not letting the course remember what you '
   + "have finished, so nothing can unlock.</div>");
 const ops = document.createElement("div"); ops.className = "ops";
 CARTAS_MODOS.forEach(md => {
  const abierto = fcAbierto(md.id), n = fcDelModo(md.id).length;
  const b = document.createElement("button");
  b.innerHTML = "<b>" + md.titulo + "</b> &middot; " + md.lema
   + (abierto ? "<br>" + n + " cards" : "<br>" + md.bloqueado);
  b.disabled = !abierto;
  b.onclick = () => fcEmpieza(md.id);
  ops.appendChild(b);
 });
 p.appendChild(ops);
 const nav = document.createElement("div"); nav.className = "nav";
 nav.innerHTML = '<button class="sec" id="fcSal">Back to the screens</button>';
 p.appendChild(nav);
 nav.querySelector("#fcSal").onclick = window.fcCierra;
}

function fcRecuento(p){
 const vistas = FC.ses.filter((id,i,a) => a.indexOf(id) === i);
 const bien = vistas.filter(id => FC.primera[id]).length;
 const mal = vistas.filter(id => FC.primera[id] === false);
 p.insertAdjacentHTML("beforeend",
  '<div class="res ' + (mal.length ? "" : "si") + '"><b>' + bien + " of "
  + vistas.length + "</b>"
  + (mal.length
     ? "<p>You missed these " + (mal.length === 1 ? "one" : mal.length)
       + ". <b>They will come round more often</b> until you do not.</p>"
       + "<p>" + mal.map(id => CARTAS.filter(c=>c.id===id)[0].detras.nombre)
                   .join(" &middot; ") + "</p>"
     : "<p><b>All of them, first time.</b></p>") + "</div>");
 const nav = document.createElement("div"); nav.className = "nav";
 nav.innerHTML = '<button class="sec" id="fcSal">Back to the screens</button>'
  + '<button id="fcOtra">Another ten</button>';
 p.appendChild(nav);
 nav.querySelector("#fcOtra").onclick = () => fcEmpieza(FC.modo);
 nav.querySelector("#fcSal").onclick = window.fcCierra;
}

window.FCEST = () => ({on:FC.on, modo:FC.modo, i:FC.i, vuelta:FC.vuelta,
 largo:FC.ses ? FC.ses.length : 0, fin:fcFin(),
 carta:(FC.ses && !fcFin()) ? FC.ses[FC.i] : null,
 luz:FC.luz ? {per:FC.luz.per, tramos:FC.luz.on.length,
               color:FC.luz.lam.getAttribute("fill")} : null,
 anda:!!(FC.rit && FC.rit.anda()),
 vueltas:FC.repes ? Object.keys(FC.repes).length : 0,
 distintas:FC.ses ? new Set(FC.ses).size : 0,
 abiertos:CARTAS_MODOS.filter(m => fcAbierto(m.id)).map(m => m.id)});
window.fcEmpieza = fcEmpieza; window.fcJuzga = fcJuzga; window.fcPeso = fcPeso;

vistoEmpieza(FICHERO);

const _fb=document.getElementById("fcBtn");
if(_fb)_fb.onclick=()=>{ if(FC.on)window.fcCierra(); else window.fcAbre(); };

if(typeof location !== "undefined" && location.hash === "#flashcards" && _fb)
 setTimeout(()=>_fb.click(), 0);

addEventListener("keydown",e=>{ if(e.key==="Escape"&&FC.on)window.fcCierra(); });

const YO = "balizamiento-p1-the-marks.html";
function guardaDonde(i){ vistoPon(YO, i); }
function donde(){ return vistoPos(YO, PZ.length-1); }

function deCero(){ vistoOlvida(YO); vaA(0); }

vaA(donde());
