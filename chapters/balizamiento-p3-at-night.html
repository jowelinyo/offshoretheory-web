<script>
"use strict";

const D={W:1000,H:640}, MARGEN=24;
const svg=document.getElementById("svg");
const pane=()=>document.getElementById("pane");
let ESC=1, gO=null;
function esc(){const r=svg.getBoundingClientRect();
 return Math.min(r.width/D.W, r.height/D.H)||1;}
const px=n=>n/ESC;
function el(t,at,pa){const e=document.createElementNS("http://www.w3.org/2000/svg",t);
 for(const k in at)e.setAttribute(k,at[k]); (pa||gO).appendChild(e); return e;}

const HOJA=()=>{const m=px(MARGEN);
 return {x0:m,y0:m,x1:D.W-m,y1:D.H-m,an:D.W-2*m,al:D.H-2*m};};
function kQueCabe(k,arriba,abajo){
 const h=HOJA(), libre=h.al-(arriba||0)-(abajo||0);
 return px(2*k)<=libre ? k : Math.max(20,k*libre/px(2*k));}
function lineaAgua(k,arriba,abajo){
 const h=HOJA(), a=arriba||0, b=abajo||0;
 return h.y0+a+(h.al-a-b)/2+px(k);}

const T={rot:12, dato:14, lect:20, cifra:34};

function txt(x,y,s,an,tam,col,peso,fam,esp){
 const e=el("text",{x:x,y:y,"text-anchor":an||"middle","pointer-events":"none",
  "font-size":px(tam||T.dato),
  "font-family":fam==="mono"?"var(--f-mono)":fam==="serif"?"var(--f-display)":"var(--f-ui)",
  "font-weight":peso||400, fill:col||"var(--ink)"});
 if(esp)e.setAttribute("letter-spacing",px(esp));
 e.textContent=s; return e;}

const C={
  papel:"#E3EAEE", papel2:"#D2DDE3", raya:"#A6B3BA",

  tintaSuave:"#5C7079",

  papelInk:"#EFE6D2",

  tinta:"#15252D", suave:"#3A464E", agua:"#8FC3DA",
  magenta:"#6B2461",
  rojo:"#c8102e", verde:"#0A7D3A", negro:"#1A1A1A",
  amarillo:"#F2C230",
  azul:"#1F5FBF"
};
window.PALETA=C;

const MARCAS=[{"id": "card-N", "nombre": "North cardinal", "corto": "North", "familia": "cardinal", "cardinal": "N", "codigo": "BY", "cuerpo": "pilar", "bandas": [["negro", 0.5], ["amarillo", 0.5]], "tope": "conos", "conos": ["up", "up"], "luz": null, "fuente": "dato"}, {"id": "card-E", "nombre": "East cardinal", "corto": "East", "familia": "cardinal", "cardinal": "E", "codigo": "BYB", "cuerpo": "pilar", "bandas": [["negro", 0.3333], ["amarillo", 0.3333], ["negro", 0.3333]], "tope": "conos", "conos": ["up", "dn"], "luz": null, "fuente": "dato"}, {"id": "card-S", "nombre": "South cardinal", "corto": "South", "familia": "cardinal", "cardinal": "S", "codigo": "YB", "cuerpo": "pilar", "bandas": [["amarillo", 0.5], ["negro", 0.5]], "tope": "conos", "conos": ["dn", "dn"], "luz": null, "fuente": "dato"}, {"id": "card-W", "nombre": "West cardinal", "corto": "West", "familia": "cardinal", "cardinal": "W", "codigo": "YBY", "cuerpo": "pilar", "bandas": [["amarillo", 0.3333], ["negro", 0.3333], ["amarillo", 0.3333]], "tope": "conos", "conos": ["dn", "up"], "luz": null, "fuente": "dato"}, {"id": "lat-babor", "nombre": "Port hand", "corto": "Port", "familia": "lateral", "codigo": "R", "forma": "can", "cuerpo": "lata", "tope": "lata", "luz": "Fl.R.5s", "fuente": "dato", "bandas": [["rojo", 1.0]]}, {"id": "lat-estribor", "nombre": "Starboard hand", "corto": "Stbd", "familia": "lateral", "codigo": "G", "forma": "conica", "cuerpo": "cono", "tope": "cono", "luz": "Fl.G.5s", "fuente": "dato", "bandas": [["verde", 1.0]]}, {"id": "aguas-seguras", "nombre": "Safe water", "corto": "Safe", "familia": "segura", "codigo": "RW", "forma": "esferica", "cuerpo": "esfera", "tope": "esferaR", "luz": "L.Fl.10s", "fuente": "dato", "franjas": ["rojo", "papel", "rojo", "papel"]}, {"id": "peligro-aislado", "nombre": "Isolated danger", "corto": "Isolated", "familia": "peligro", "codigo": "BRB", "forma": "pilar", "cuerpo": "pilar", "tope": "dosEsferas", "luz": "Fl(2)5s", "fuente": "dato", "bandas": [["negro", 0.3333], ["rojo", 0.3333], ["negro", 0.3333]]}, {"id": "especial", "nombre": "Special", "corto": "Special", "familia": "especial", "codigo": "Y", "forma": "can", "cuerpo": "lata", "tope": "aspa", "luz": "Fl.Y.5s", "fuente": "dato", "bandas": [["amarillo", 1.0]]}, {"id": "pref-estribor", "nombre": "Preferred channel to starboard", "corto": "Pref stbd", "familia": "preferente", "codigo": "RGR", "forma": "can", "cuerpo": "lata", "tope": "lata", "bandas": [["rojo", 0.34], ["verde", 0.3], ["rojo", 0.36]], "luz": "Fl(2+1)R.10s", "fuente": "memoria"}, {"id": "pref-babor", "nombre": "Preferred channel to port", "corto": "Pref port", "familia": "preferente", "codigo": "GRG", "forma": "conica", "cuerpo": "cono", "tope": "cono", "bandas": [["verde", 0.34], ["rojo", 0.3], ["verde", 0.36]], "luz": "Fl(2+1)G.10s", "fuente": "memoria"}, {"id": "nuevo-peligro", "nombre": "New danger", "corto": "New danger", "familia": "peligro", "codigo": "BuY", "forma": "pilar", "cuerpo": "pilarV", "tope": "cruz", "franjas": ["azul", "amarillo", "azul", "amarillo"], "luz": "Al.Oc.Bu.Y3s", "fuente": "memoria"}];
window.MARCAS=MARCAS;
const marcaDe=id=>MARCAS.find(m=>m.id===id);

function consola(){
 el("rect",{x:0,y:0,width:D.W,height:D.H,fill:"#0A1E27"});}
function lamina(titulo){
 const m=px(MARGEN), w=D.W-2*m, h=D.H-2*m;
 consola();
 el("rect",{x:m+px(3),y:m+px(4),width:w,height:h,fill:"#00000055",rx:px(3)});
 el("rect",{x:m,y:m,width:w,height:h,fill:C.papel,rx:px(3)});
 el("rect",{x:m,y:m,width:w,height:h,fill:"none",stroke:C.raya,
   "stroke-width":px(1.5),rx:px(3)});
 if(titulo)txt(m+px(16),m+px(22),titulo,"start",T.rot,C.suave,600,"mono",1.4);
 return {x0:m,y0:m,x1:D.W-m,y1:D.H-m};}

function agua(cx,base,ancho){
 el("line",{"data-andamio":1,x1:cx-ancho,y1:base,x2:cx+ancho,y2:base,
   stroke:C.agua,"stroke-width":px(2.6),"stroke-linecap":"round"});}

function dibujaTope(m,cx,tY,r,pa){
 const nodo=(t,at)=>el(t,at,pa);
 const cono=(yb,dir,col)=>nodo("path",{d: dir==="up"
   ? "M"+(cx-r)+","+yb+" L"+(cx+r)+","+yb+" L"+cx+","+(yb-2*r)+" Z"
   : "M"+(cx-r)+","+(yb-2*r)+" L"+(cx+r)+","+(yb-2*r)+" L"+cx+","+yb+" Z",
   fill:col||C.negro, stroke:col?C.negro:"none","stroke-width":px(1.2)});
 const t=m.tope;
 if(t==="conos"){ const hueco=px(1.6);
   cono(tY,m.conos[1]); cono(tY-2*r-hueco,m.conos[0]); }
 else if(t==="lata") nodo("rect",{x:cx-r*0.85,y:tY-2*r,width:r*1.7,height:2*r,
   fill:C.rojo,stroke:C.negro,"stroke-width":px(1.2)});
 else if(t==="cono") cono(tY,"up",C.verde);
 else if(t==="esferaR") nodo("circle",{cx:cx,cy:tY-r,r:r,fill:C.rojo,
   stroke:C.negro,"stroke-width":px(1.2)});
 else if(t==="dosEsferas"){ nodo("circle",{cx:cx,cy:tY-r,r:r*0.82,fill:C.negro});
   nodo("circle",{cx:cx,cy:tY-r*2.9,r:r*0.82,fill:C.negro}); }
 else if(t==="cruz"||t==="aspa"){
   const a=r*1.05, yc=tY-a, d=t==="aspa";
   const li=(x1,y1,x2,y2)=>nodo("line",{x1:x1,y1:y1,x2:x2,y2:y2,stroke:C.amarillo,
     "stroke-width":px(3.4),"stroke-linecap":"round"});
   if(d){ li(cx-a,yc-a,cx+a,yc+a); li(cx+a,yc-a,cx-a,yc+a); }
   else { li(cx-a,yc,cx+a,yc); li(cx,yc-a,cx,yc+a); }
 }}

function marca(m,cx,base,k,op){
 op=op||{};
 const g=el("g",{},gO), alto=px(k), ancho=px(k*0.55);
 const y0=base-alto;
 const nodo=(t,at)=>el(t,at,g);

 let topY=y0;
 if(m.cuerpo==="esfera"){
   const r=ancho*0.62, cy=base-r;
   const cid="cl"+m.id+Math.round(k);
   const cp=el("clipPath",{id:cid},g);
   el("circle",{"data-color":1,cx:cx,cy:cy,r:r},cp);
   const n=m.franjas.length, w=2*r/n;
   m.franjas.forEach((c,i)=>nodo("rect",{x:cx-r+i*w,y:cy-r,width:w+px(.4),
     height:2*r,fill:C[c]||c,"clip-path":"url(#"+cid+")"}));
   nodo("circle",{cx:cx,cy:cy,r:r,fill:"none",stroke:C.negro,"stroke-width":px(1.6)});
   topY=cy-r;
 }else if(m.cuerpo==="pilarV"){
   const n=m.franjas.length, w=ancho/n;
   m.franjas.forEach((c,i)=>nodo("rect",{x:cx-ancho/2+i*w,y:y0,width:w+px(.4),
     height:alto,fill:C[c]||c}));
   nodo("rect",{x:cx-ancho/2,y:y0,width:ancho,height:alto,fill:"none",
     stroke:C.negro,"stroke-width":px(1.6)});
 }else{
   const anchoEn=yy=>m.cuerpo==="cono"
     ? ancho*(0.30+0.70*((yy-y0)/alto)) : ancho;
   let y=y0;
   m.bandas.forEach(b=>{
     const h=alto*b[1], aT=anchoEn(y), aB=anchoEn(y+h);
     nodo("path",{d:"M"+(cx-aT/2)+","+y+" L"+(cx+aT/2)+","+y+" L"+(cx+aB/2)+","+(y+h)
       +" L"+(cx-aB/2)+","+(y+h)+" Z", fill:C[b[0]]||b[0]});
     y+=h;});
   const aT=anchoEn(y0);
   nodo("path",{d:"M"+(cx-aT/2)+","+y0+" L"+(cx+aT/2)+","+y0+" L"+(cx+ancho/2)+","
     +base+" L"+(cx-ancho/2)+","+base+" Z", fill:"none",stroke:C.negro,
     "stroke-width":px(1.6)});
 }

 const mast=px(k*0.28), tY=topY-mast, r=px(k*0.18);
 nodo("line",{x1:cx,y1:topY,x2:cx,y2:tY,stroke:C.negro,"stroke-width":px(2.6)});
 dibujaTope(m,cx,tY,r,g);

 if(op.agua!==false) agua(cx,base,ancho*1.15);
 if(op.nombre) txt(cx,base+px(22),op.nombre,"middle",T.rot,C.suave,600,"ui",.6);
 if(op.codigo) txt(cx,base+px(38),m.codigo,"middle",T.rot,C.tinta,600,"mono",1.2);
 return g;}

const RUMBO={N:-90, E:0, S:90, W:180};
function sector(cx,cy,rad,card){
 const a0=(RUMBO[card]-45)*Math.PI/180, a1=(RUMBO[card]+45)*Math.PI/180;
 el("path",{"data-andamio":1,d:"M"+cx+","+cy+" L"+(cx+rad*Math.cos(a0))+","+(cy+rad*Math.sin(a0))
   +" A"+rad+","+rad+" 0 0 1 "+(cx+rad*Math.cos(a1))+","+(cy+rad*Math.sin(a1))+" Z",
   fill:C.agua,"fill-opacity":.34,stroke:C.agua,"stroke-width":px(1.2)});}

function rosa(cx,cy,rad){
 el("circle",{"data-andamio":1,cx:cx,cy:cy,r:rad,fill:"none",stroke:C.suave,"stroke-width":px(1)});
 [["N",-90],["E",0],["S",90],["W",180]].forEach(([l,a])=>{
   const t=a*Math.PI/180;
   txt(cx+(rad+px(11))*Math.cos(t), cy+(rad+px(11))*Math.sin(t)+px(4),
       l,"middle",T.rot,C.suave,600,"mono",1);});
 el("path",{"data-andamio":1,d:"M"+cx+","+(cy-rad)+" L"+(cx-px(4))+","+(cy-rad+px(9))
   +" L"+(cx+px(4))+","+(cy-rad+px(9))+" Z",fill:C.suave});}

function obraEnmarca(s){
 lamina(s.lamina||"");

 const ids=s.marcas||MARCAS.map(m=>m.id);
 const n=ids.length, fila=Math.min(n,5), filas=Math.ceil(n/fila);
 const k=n<=2?110:n<=5?86:72;

 const sobre=px(k*2)+px(4), bajo=px(s.nombres?34:8), sep=px(56);
 const altoPieza=sobre+bajo;
 const bloque=filas*altoPieza+(filas-1)*sep;

 const _h=HOJA(), arriba=px(s.lamina?46:26), abajo=px(20);
 const y0=_h.y0+arriba+((_h.al-arriba-abajo)-bloque)/2+sobre;
 const dx=(D.W-px(2*MARGEN)-px(40))/fila;
 ids.forEach((id,i)=>{
   const m=marcaDe(id); if(!m)return;
   const cx=px(MARGEN)+px(20)+dx*(i%fila)+dx/2;
   const base=y0+(altoPieza+sep)*Math.floor(i/fila);
   marca(m,cx,base,k,{nombre:s.nombres?m.nombre:null});});

 if(s.rosa) rosa(D.W-px(96), px(MARGEN)+px(70), px(30));
 if(s.peligro){
   const cx=D.W/2, cy=D.H/2;
   el("circle",{"data-forma":1,cx:cx,cy:cy,r:px(17),fill:C.negro});
   txt(cx,cy+px(38),"the rock","middle",T.rot,C.suave,600,"ui",.6);}
 return null;}

const LUZCOL={"W": "#FFCE3A", "R": "#E23B3B", "G": "#33C46B", "Y": "#F2C230", "Bu": "#4FA3E3"};
const APAGADA="#16212B";
let RIT=null, RITB=[];

function ritmoPara(){ if(RIT){RIT.para(); RIT=null;} RITB=[]; }

function ritmoPinta(t){
 for(const b of RITB){

  const k=ritmoTramo(b.on,b.per,t), enc=(k>=0);
  const col=(enc&&b.cols&&LUZCOL[b.cols[k]])||b.col;
  if(b.lam)b.lam.setAttribute("fill", enc?col:APAGADA);
  if(b.halo){ b.halo.setAttribute("fill-opacity", enc?.30:0);
              if(enc)b.halo.setAttribute("fill", col); }
  if(b.cur){ const x=b.x0+b.an*ritmoFase(t,b.per)/b.per;
    b.cur.setAttribute("x1",x); b.cur.setAttribute("x2",x); }
 }
}

function bandaRitmo(b, x0, y, an, alto, op){
 op=op||{};
 let lam=null, halo=null;
 if(op.lampara!==false){
  const r=px(13);
  halo=el("circle",{cx:x0-px(52),cy:y+alto/2,r:r*1.8,fill:b.col||LUZCOL.W,
    "fill-opacity":0});
  lam=el("circle",{cx:x0-px(52),cy:y+alto/2,r:r,fill:APAGADA,
    stroke:C.raya,"stroke-width":px(1.4)});
 }
 if(op.rotulo!==false)

  txt(x0-px(10),y+alto/2+px(5),b.ab,"end",T.dato,C.tinta,600,"mono",.6);

 el("rect",{x:x0,y:y,width:an,height:alto,fill:APAGADA,rx:px(2)});

 b.on.forEach(([a,z],i)=>
   el("rect",{"data-color":1,x:x0+an*a/b.per,y:y,width:an*(z-a)/b.per,height:alto,
     fill:(b.cols&&LUZCOL[b.cols[i]])||b.col||LUZCOL.W}));
 const cur=el("line",{x1:x0,y1:y-px(3),x2:x0,y2:y+alto+px(3),
   stroke:C.magenta,"stroke-width":px(1.6)});
 RITB.push({on:b.on,per:b.per,col:b.col||LUZCOL.W,cols:b.cols||null,
            lam:lam,halo:halo,cur:cur,x0:x0,an:an});
 return {lam:lam, cur:cur};
}

function obraRitmo(s){
 lamina(s.lamina||"");
 ritmoPara();
 const bandas=(s.ritmo||[]).map(b=>({ab:b.ab,on:b.on,per:b.per||s.per||10,
   cap:b.cap||[],col:LUZCOL[b.col||"W"],cols:b.cols||null}));
 if(!bandas.length)return;
 const h=HOJA();
 const arriba=px(52), abajo=px(30);
 const libre=h.al-arriba-abajo;

 const lineas=Math.max(...bandas.map(b=>(b.cap||[]).length), 0);

 const PASO=Math.round(T.rot*1.35);
 let alto=0, sep=0, pies=lineas;
 for(const pp of [lineas, Math.min(1,lineas), 0]){
   pies=pp;
   const pie=px(pp?PASO*pp+4:0);
   alto=Math.min(px(26),(libre-(bandas.length-1)*px(14)-bandas.length*pie)
                        /bandas.length);
   sep=(libre-bandas.length*(alto+pie))/Math.max(1,bandas.length-1);
   if(alto>=px(9)&&sep>=px(2)) break;
 }
 const pie=px(pies?PASO*pies+4:0);
 const x0=h.x0+px(120), an=h.x1-px(30)-x0;
 bandas.forEach((b,i)=>{
  const y=h.y0+arriba+i*(alto+pie+sep);
  bandaRitmo(b,x0,y,an,alto);

  (b.cap||[]).slice(0,pies).forEach((c,k)=>
   txt(x0,y+alto+px(PASO)+k*px(PASO),c,"start",T.rot,C.suave,500,"ui",.3));
 });

 txt(x0,h.y1-px(6),"one cycle · "+bandas[0].per.toFixed(0)+" s, real time",
     "start",T.rot,C.suave,600,"ui",.6);
 RIT=ritmoMotor((_,t)=>ritmoPinta(t));
 RIT.luz(bandas[0].on,bandas[0].per);
 RIT.arranca();
}

function obraNoche(s){
 lamina(s.lamina||"");
 ritmoPara();
 const h=HOJA(), m=marcaDe(s.marca); if(!m)return;

 const k=kQueCabe(140,px(56),px(130)), base=lineaAgua(k,px(56),px(130));
 const cxD=h.x0+h.an*0.27, cxN=h.x0+h.an*0.73;

 txt(cxD,h.y0+px(38),"by day","middle",T.rot,C.suave,600,"ui",.8);
 marca(m,cxD,base,k,{agua:false,nombre:m.nombre});

 const an=Math.min(px(260),h.an*0.34), alto=px(2*k)+px(26);
 const y0=base+px(6)-alto;
 el("rect",{x:cxN-an/2,y:y0,width:an,height:alto,rx:px(4),fill:"#0A1E27"});
 txt(cxN,h.y0+px(38),"the same buoy, at night","middle",T.rot,C.suave,600,"ui",.8);

 const luz=s.luz||{on:[[0,1]],per:6,col:"W"};
 const col=LUZCOL[luz.col]||LUZCOL.W, cy=y0+alto*0.42;
 const halo=el("circle",{cx:cxN,cy:cy,r:px(52),fill:col,"fill-opacity":0});
 const lam=el("circle",{cx:cxN,cy:cy,r:px(15),fill:APAGADA,
   stroke:"#2A3E48","stroke-width":px(1.4)});
 RITB.push({on:luz.on,per:luz.per,col:col,cols:luz.cols||null,lam:lam,halo:halo,cur:null,x0:0,an:0});

 const tx0=cxN-an/2, tan=an, talto=px(22);
 const ty=base+px(34);
 bandaRitmo({on:luz.on,per:luz.per,col:col},tx0,ty,tan,talto,
            {lampara:false,rotulo:false});

 el("line",{"data-andamio":1,x1:tx0,y1:ty-px(6),x2:tx0,y2:ty+talto+px(6),
   stroke:C.suave,"stroke-width":px(1.2)});
 el("line",{"data-andamio":1,x1:tx0+tan,y1:ty-px(6),x2:tx0+tan,y2:ty+talto+px(6),
   stroke:C.suave,"stroke-width":px(1.2)});
 txt(cxN,ty+talto+px(20),"one whole cycle, over and over","middle",
     T.rot,C.suave,600,"ui",.6);

 txt(cxN,base+px(20),"real time · nothing here is sped up","middle",
     T.rot,C.suave,500,"ui",.4);

function moComprueba(s){
 LOG.push({id:s.id,q:MO.luz.id,bien:moBien()});
 document.getElementById("fLog").textContent=LOG.length+" answers logged";
 if(moBien()){
  MO.hecho=true; MO.n++;
  MO.res='<div class="res si"><b>Yes.</b> '+MO.luz.abrev+"</div>";
  if(MO.fallos&&MO.meta===2){MO.meta=3;
   MO.res+='<div class="res">Two was the plan; the third is here because you '
     +"slipped, and it goes away as soon as you do not.</div>";}
 }else{
  MO.fallos++;
  const mal=RANURAS.filter(([k])=>MO.v[k]!==MO.luz[k]).map(([,n])=>n);
  MO.res='<div class="res no"><b>Not yet.</b> The '+mal.join(" and the ")
   +(mal.length>1?" are":" is")+" not right — the rest of it is.</div>";
  if(MO.fallos>=1)MO.res+='<div class="pista">Four readings, and they do not help '
   +"each other. The proportion gives you the character. Counting gives you the "
   +"group. Your own eyes give you the colour. <b>Only the clock gives you the "
   +"period.</b></div>";}
 pinta();}

function moMuestra(s){
 MO.hecho=true; MO.n++;
 LOG.push({id:s.id,q:MO.luz.id,bien:false,show:true});
 RANURAS.forEach(([k])=>{MO.v[k]=MO.luz[k];});
 MO.res='<div class="res ver"><b>'+MO.luz.abrev+"</b>"
  +"<p>Proportion &rarr; character. Count &rarr; group. Colour &rarr; colour. "
  +"<b>Clock &rarr; period.</b></p></div>";
 if(MO.meta===2)MO.meta=3;
 pinta();}

function moSalta(s){
 LOG.push({id:s.id,q:MO.luz.id,bien:false,saltada:true});
 document.getElementById("fLog").textContent=LOG.length+" answers logged";
 MO.res="";
 if(MO.meta===2){MO.meta=3;
  MO.res='<div class="res">Skipped. One more after this.</div>';}
 moNueva();}

let PZ=[{"id": "1.S1", "tema": "Reading a rhythm · topic 1", "obra": "noche", "b": "Next", "lamina": "the same buoy, twice", "h": "Two of the three are gone", "marca": "lat-babor", "luz": {"ab": "Fl.R.5s", "per": 5.0, "on": [[0.0, 0.5]], "col": "R", "cols": ["R"], "continua": false, "fuente": "dato"}, "p": ["This is the port-hand mark you have known since part one. On the left it is <b>daylight</b>: a red can, flat on top, and you have it in one look.", "On the right it is <b>the same buoy at night</b>. <b>The shape has gone and the colour has gone</b> — a light has no shape, and at any distance your eye is poor at colour. Two of the three things that identify it are simply not there.", "<b>What is left is the one thing daylight never showed you: the rhythm.</b> Watch it. It is running in real time — nothing here is sped up — and that pattern is what tells you which buoy you are looking at.", "<b>A rhythm shown here is an example, not a rule.</b> A lateral mark may flash any way at all except the compound group — that one belongs to the preferred-channel marks — and a special mark may flash any way at all. <b>What identifies those two is the colour, not the period.</b> You will meet four laterals in one channel later in this part, and no two of them flash alike. <em>The other marks are not like that: a cardinal, a preferred channel, an isolated danger and a safe water each have a rhythm that is theirs and nobody else’s.</em>", "<em>Everything in this part is that pattern: how to read it, how to write it, and what each mark's own rhythm is.</em>"]}, {"id": "1.E1", "tema": "Reading a rhythm · topic 1", "obra": "ritmo", "b": "Next", "lamina": "seven characters, one clock", "h": "A light is a rhythm", "ritmo": [{"ab": "F", "on": [[0, 10]], "per": 10, "cap": ["Fixed. It never goes out.", "Often in pairs: two in line are a leading line."]}, {"ab": "Fl", "on": [[0, 0.8]], "per": 10, "cap": ["Flashing. More dark than light."]}, {"ab": "LFl", "on": [[0, 2.0]], "per": 10, "cap": ["Long-flashing. One flash, two seconds or more."]}, {"ab": "Oc", "on": [[0, 8.8]], "per": 10, "cap": ["Occulting. Lit, and it blinks.", "The dark is what catches your eye."]}, {"ab": "Iso", "on": [[0, 5]], "per": 10, "cap": ["Isophase. Half and half."]}, {"ab": "Q", "on": [[0, 0.3], [1, 1.3], [2, 2.3], [3, 3.3], [4, 4.3], [5, 5.3], [6, 6.3], [7, 7.3], [8, 8.3], [9, 9.3]], "per": 10, "cap": ["Quick. 50 to 79 a minute. This one is 60."]}, {"ab": "VQ", "on": [[0.0, 0.15], [0.5, 0.65], [1.0, 1.15], [1.5, 1.65], [2.0, 2.15], [2.5, 2.65], [3.0, 3.15], [3.5, 3.65], [4.0, 4.15], [4.5, 4.65], [5.0, 5.15], [5.5, 5.65], [6.0, 6.15], [6.5, 6.65], [7.0, 7.15], [7.5, 7.65], [8.0, 8.15], [8.5, 8.65], [9.0, 9.15], [9.5, 9.65]], "per": 10, "cap": ["Very quick. 80 to 159 a minute. This one is 120."]}], "p": ["At night a lighthouse is not a symbol on a chart. It is a light that comes and goes, and <b>the pattern it makes in time is the only thing that tells you which light it is.</b> Two lights on the same coast can look identical. Their rhythms cannot.", "The chart writes that rhythm as a <b>character</b>: one or two letters. Seven of them cover almost everything you will meet.", "<b>Fl is darkness interrupted by light. Oc is light interrupted by darkness.</b> You do not have to remember which is which &mdash; look at which there is more of."]}, {"id": "1.E2", "tema": "Reading a rhythm · topic 1", "obra": "ritmo", "b": "Next", "lamina": "the group, and the period", "h": "Groups, period, colour", "ritmo": [{"ab": "Fl(3)", "on": [[0, 0.5], [1.0, 1.5], [2.0, 2.5]], "per": 10, "cap": ["Three flashes, then the long eclipse."]}, {"ab": "Fl(3)10s", "on": [[0, 0.5], [1.0, 1.5], [2.0, 2.5]], "per": 10, "cap": ["The period: start of one group to the start of the next."]}, {"ab": "Fl(2)10s", "on": [[0, 0.5], [1.0, 1.5]], "per": 10, "cap": ["The light on this chart."]}], "p": ["One flash on its own is not much to go on. A coast can have several lights all flashing, so flashes come in <b>groups</b>, and the group is written in brackets after the character.", "<b>The number in the brackets is how many flashes are in one group, and nothing else.</b> It is not seconds. It is not a range. It is a count.", "Then comes the number with the <b>s</b> on the end. That is the <b>period</b>: how long one whole cycle takes, from the start of one group to the start of the next. <b>The darkness counts.</b>", "<b>And the period is the one part you can measure yourself.</b> Start a watch on the first flash of a group, stop it on the first flash of the next. Whatever it reads is the period.", "<b>One last piece: the colour.</b> White, red, green or yellow, and the letter goes after the character and its group, before the period. <b>If no colour is printed, the light is white.</b>", "<b>Every mark you met in part one has a rhythm of its own.</b> The South cardinal — the one whose cones point down — flashes in a way you can now read: a character, a group, a period. <b>What that particular group means, and why it is six and not five, is the next topic.</b>"]}, {"id": "1.P1", "tema": "Reading a rhythm · topic 1", "obra": "montar", "banco": "LUCES", "h": "Now write it down", "q": "Write it the way the chart would. <b>Four decisions, not one word.</b>"}, {"id": "1.S2", "tema": "Reading a rhythm · topic 1", "obra": "ritmo", "b": "Next", "lamina": "the same light, read", "h": "You can read a light now", "ritmo": [{"ab": "Fl.R.5s", "marca": "lat-babor", "on": [[0.0, 0.5]], "per": 5.0, "col": "R", "cols": ["R"], "cap": ["The light this part opened with, now readable.", "Character, group, colour, period. Nothing else."]}], "p": ["This is the light you were shown at the start of this part, when all you could say about it was that it came and went. <b>Now you can write it down.</b>", "<b>Flashing. No group. Red. Five seconds.</b> Four readings, and none of them helps you with the others: the proportion gives you the character, counting gives you the group, your eyes give you the colour, and only a watch gives you the period.", "<b>A rhythm shown here is an example, not a rule.</b> A lateral mark may flash any way at all except the compound group — that one belongs to the preferred-channel marks — and a special mark may flash any way at all. <b>What identifies those two is the colour, not the period.</b> You will meet four laterals in one channel later in this part, and no two of them flash alike. <em>The other marks are not like that: a cardinal, a preferred channel, an isolated danger and a safe water each have a rhythm that is theirs and nobody else’s.</em>", "<em>What you cannot do yet is say what it <b>means</b>.</em> A rhythm read is a rhythm and nothing more. From here on <b>every rhythm you meet is attached to a mark</b>, and the mark is what you actually need at two in the morning.", "<b>The cardinals go first, because theirs is not a signature to memorise — it is a clock.</b>"]}, {"id": "2.S1", "tema": "The cardinals' clock · topic 2", "obra": "ritmo", "b": "Next", "lamina": "four white lights, and nothing else to go on", "h": "Four buoys, four white lights", "ritmo": [{"ab": "", "on": [[0.0, 0.3], [1.0, 1.3], [2.0, 2.3], [3.0, 3.3], [4.0, 4.3], [5.0, 5.3], [6.0, 6.3], [7.0, 7.3], [8.0, 8.3], [9.0, 9.3], [10.0, 10.3], [11.0, 11.3]], "per": 12.0, "cap": []}, {"ab": "", "on": [[0.0, 0.3], [1.0, 1.3], [2.0, 2.3]], "per": 10.0, "cap": []}, {"ab": "", "on": [[0.0, 0.3], [1.0, 1.3], [2.0, 2.3], [3.0, 3.3], [4.0, 4.3], [5.0, 5.3], [6.3, 8.3]], "per": 15.0, "cap": []}, {"ab": "", "on": [[0.0, 0.3], [1.0, 1.3], [2.0, 2.3], [3.0, 3.3], [4.0, 4.3], [5.0, 5.3], [6.0, 6.3], [7.0, 7.3], [8.0, 8.3]], "per": 15.0, "cap": []}], "p": ["These are the four cardinals — the ones whose cones you learned to read in part one. <b>At night this is all you get.</b>", "<b>All four are white and all four are quick.</b> No colour to separate them, no shape, no topmark. If the light were the only thing you had, three of these four would put you on the wrong side of a rock.", "<b>But they are not the same, and the difference is one you can count.</b> Watch them a moment before you go on: one of them never stops, and the other three come in bursts of different lengths.", "<em>There is a reason those bursts are the lengths they are, and it is the neatest thing in this whole module. That is the next screen.</em>"]}, {"id": "2.E1", "tema": "The cardinals' clock · topic 2", "obra": "reloj", "lamina": "a clock face, and four lights", "h": "Three o’clock, six o’clock, nine o’clock", "tramos": [{"p": "Here is the whole trick, and it is the neatest thing in this module. <b>Think of a clock face.</b> Three of the four cardinals sit at an hour on it, and the hour is how many times they flash."}, {"card": "E", "pie": "three", "p": "<b>East is three o’clock, so it flashes three times.</b> Count them. Then a gap, and three again."}, {"card": "S", "pie": "six, and then a long one", "p": "<b>South is six o’clock: six flashes.</b> And then one long one, which the other three do not have.</p><p><b>That long flash is there for a reason, and it is worth knowing.</b> Six and nine are easy to miscount in the dark. The long flash says «that was the end of the group» — so if you counted six and then saw it, you counted right. <em>A long flash is two seconds or more, by definition: you cannot mistake it for a quick one.</em>"}, {"card": "W", "pie": "nine", "p": "<b>West is nine o’clock: nine flashes.</b> No long one at the end — it does not need it, because nothing else flashes nine."}, {"card": "N", "pie": "it never stops", "p": "<b>And north is twelve, which is no number at all.</b> So it does not come in groups: <b>it never stops.</b> If you watch a white quick light and it never pauses, it is the north cardinal, and the clear water is north of it.", "razon": "3 &rarr; east &nbsp;&middot;&nbsp; 6 &rarr; south &nbsp;&middot;&nbsp; 9 &rarr; west &nbsp;&middot;&nbsp; no number &rarr; north"}]}, {"id": "2.J1", "tema": "The cardinals' clock · topic 2", "obra": "aguja", "b": "Next", "lamina": "move the hand, and watch the light", "h": "Move it yourself", "p": ["<b>Tap an hour.</b> The hand goes to it, and the light beside it changes to match — count the flashes and you will find the hour you just tapped.", "The clock does not move. <b>You do.</b> The number on the face and the number of flashes are the same number, and once you have seen that a few times you will not need the clock again.", "<b>Try twelve last.</b> There is no hand, because there is no number — and that is exactly what its light does.", "<em>Nothing is scored here.</em>"]}, {"id": "2.P1", "tema": "The cardinals' clock · topic 2", "obra": "luz", "banco": "CARDINAL", "h": "Which one is that?"}, {"id": "2.P2", "tema": "The cardinals' clock · topic 2", "obra": "practica", "banco": "FIRMA", "h": "And what will it do after dark?"}, {"id": "3.S1", "tema": "The other eight, after dark · topic 3", "obra": "ritmo", "b": "Next", "lamina": "eight more, and now there is colour", "h": "And now the colour is back", "ritmo": [{"ab": "", "marca": "lat-babor", "on": [[0.0, 0.5]], "per": 5.0, "col": "R", "cols": ["R"], "cap": []}, {"ab": "", "marca": "lat-estribor", "on": [[0.0, 0.5]], "per": 5.0, "col": "G", "cols": ["G"], "cap": []}, {"ab": "", "marca": "aguas-seguras", "on": [[0.0, 2.0]], "per": 10.0, "col": "W", "cols": ["W"], "cap": []}, {"ab": "", "marca": "peligro-aislado", "on": [[0.0, 0.5], [1.0, 1.5]], "per": 5.0, "col": "W", "cols": ["W", "W"], "cap": []}, {"ab": "", "marca": "especial", "on": [[0.0, 0.5]], "per": 5.0, "col": "Y", "cols": ["Y"], "cap": []}, {"ab": "", "marca": "pref-estribor", "on": [[0.0, 0.5], [1.0, 1.5], [2.5, 3.0]], "per": 10.0, "col": "R", "cols": ["R", "R", "R"], "cap": []}, {"ab": "", "marca": "pref-babor", "on": [[0.0, 0.5], [1.0, 1.5], [2.5, 3.0]], "per": 10.0, "col": "G", "cols": ["G", "G", "G"], "cap": []}, {"ab": "", "marca": "nuevo-peligro", "on": [[0.0, 1.0], [1.5, 2.5]], "per": 3.0, "col": "Bu", "cols": ["Bu", "Y"], "cap": []}], "p": ["The four cardinals were all white, and you separated them by counting. <b>The other eight are not.</b> Red, green, white, white, yellow, red again, green again — and one that will not hold still.", "<b>Colour looks like the easy answer, and it is the one you cannot lean on.</b> At two miles, in rain, with a town lit up behind it, a red light and a green light are a light. And there are <b>two reds and two greens here</b> anyway, so even seeing the colour leaves you with a pair.", "<b>So take the rhythm first and the colour second.</b> Count the flashes and time the long ones; the colour is what confirms it, not what decides it.", "<em>Which is which is the next screen — and the two whites are the pair worth being certain about.</em>", "<b>A rhythm shown here is an example, not a rule.</b> A lateral mark may flash any way at all except the compound group — that one belongs to the preferred-channel marks — and a special mark may flash any way at all. <b>What identifies those two is the colour, not the period.</b> You will meet four laterals in one channel later in this part, and no two of them flash alike. <em>The other marks are not like that: a cardinal, a preferred channel, an isolated danger and a safe water each have a rhythm that is theirs and nobody else’s.</em>"]}, {"id": "3.E1", "tema": "The other eight, after dark · topic 3", "obra": "ritmo", "b": "Now you try", "lamina": "the same eight, named", "h": "Which is which", "ritmo": [{"ab": "Fl.R.5s", "marca": "lat-babor", "on": [[0.0, 0.5]], "per": 5.0, "col": "R", "cols": ["R"], "cap": ["Port hand", "red, and one flash"]}, {"ab": "Fl.G.5s", "marca": "lat-estribor", "on": [[0.0, 0.5]], "per": 5.0, "col": "G", "cols": ["G"], "cap": ["Starboard hand", "green, and one flash"]}, {"ab": "L.Fl.10s", "marca": "aguas-seguras", "on": [[0.0, 2.0]], "per": 10.0, "col": "W", "cols": ["W"], "cap": ["Safe water", "white, and one LONG flash — the slow one"]}, {"ab": "Fl(2)5s", "marca": "peligro-aislado", "on": [[0.0, 0.5], [1.0, 1.5]], "per": 5.0, "col": "W", "cols": ["W", "W"], "cap": ["Isolated danger", "white, and two flashes — two and only two"]}, {"ab": "Fl.Y.5s", "marca": "especial", "on": [[0.0, 0.5]], "per": 5.0, "col": "Y", "cols": ["Y"], "cap": ["Special", "yellow, and the only steady yellow"]}, {"ab": "Fl(2+1)R.10s", "marca": "pref-estribor", "on": [[0.0, 0.5], [1.0, 1.5], [2.5, 3.0]], "per": 10.0, "col": "R", "cols": ["R", "R", "R"], "cap": ["Preferred channel to starboard", "red, and two flashes then one"]}, {"ab": "Fl(2+1)G.10s", "marca": "pref-babor", "on": [[0.0, 0.5], [1.0, 1.5], [2.5, 3.0]], "per": 10.0, "col": "G", "cols": ["G", "G", "G"], "cap": ["Preferred channel to port", "green, and the same two then one"]}, {"ab": "Al.Oc.Bu.Y3s", "marca": "nuevo-peligro", "on": [[0.0, 1.0], [1.5, 2.5]], "per": 3.0, "col": "Bu", "cols": ["Bu", "Y"], "cap": ["New danger", "blue and yellow, turn about"]}], "p": ["Now with their names on. <b>Read each one the way you learned in topic one</b>: character, group, colour, period — every one of these is written the way the chart writes it.", "The two plain laterals are <b>one flash each</b>, and only the colour separates them. <b>The two preferred-channel marks are the same pair again</b> — red and green — and what separates them from the plain ones is the group: <b>two flashes and then one</b>, which is that mark's signature and belongs to nothing else.", "The special is <b>the only steady yellow in the system</b>, and the new danger is <b>the only light that changes colour on you</b>: blue, yellow, blue, yellow. If a light will not settle on a colour, that is what it is.", "<b>And the two whites are the pair that matters.</b> Safe water gives one LONG flash — two seconds or more, slow enough to feel slow. Isolated danger gives <b>two short ones, and only ever two</b>.", "<em>Confuse those two and you take a danger for open water. It is the worst mistake in this module, and the rhythm is what stops you making it.</em>", "<b>A rhythm shown here is an example, not a rule.</b> A lateral mark may flash any way at all except the compound group — that one belongs to the preferred-channel marks — and a special mark may flash any way at all. <b>What identifies those two is the colour, not the period.</b> You will meet four laterals in one channel later in this part, and no two of them flash alike. <em>The other marks are not like that: a cardinal, a preferred channel, an isolated danger and a safe water each have a rhythm that is theirs and nobody else’s.</em>"]}, {"id": "3.P1", "tema": "The other eight, after dark · topic 3", "obra": "luz", "banco": "NOCTURNA", "h": "Which mark is that?"}, {"id": "3.P2", "tema": "The other eight, after dark · topic 3", "obra": "luz", "banco": "DOSBLANCAS", "h": "Both white. Which one?"}, {"id": "4.S1", "tema": "How the chart writes it · topic 4", "obra": "carta", "b": "Next", "lamina": "the object, the light, and the paper", "h": "The same buoy, written down", "marca": "lat-babor", "luz": {"ab": "Fl.R.5s", "per": 5.0, "on": [[0.0, 0.5]], "col": "R", "cols": ["R"], "continua": false, "fuente": "dato"}, "rotulo": "Fl.R.5s", "p": ["Three views of one buoy. On the left the object, in daylight. In the middle the light, after dark — you have spent this whole part learning to read that. <b>On the right, what the chart prints beside it.</b>", "<b>A rhythm shown here is an example, not a rule.</b> A lateral mark may flash any way at all except the compound group — that one belongs to the preferred-channel marks — and a special mark may flash any way at all. <b>What identifies those two is the colour, not the period.</b> You will meet four laterals in one channel later in this part, and no two of them flash alike. <em>The other marks are not like that: a cardinal, a preferred channel, an isolated danger and a safe water each have a rhythm that is theirs and nobody else’s.</em>", "<b>The magenta flare means «this one is lit».</b> It is not the light and it is not to scale: it is a flag saying there is something here to see at night. The little circle at its foot is <b>the position</b> — that part is exact, and it is the only part that is.", "And beside the flare, <b>the characteristic</b>: the same four pieces you learned to write in topic one. Nothing new to learn — <b>it is the middle picture, in words.</b>", "<em>Read it and you know what to look for before you ever leave the berth. That is the whole reason the chart bothers to print it.</em>"]}, {"id": "4.E1", "tema": "How the chart writes it · topic 4", "obra": "carta", "b": "Now you try", "lamina": "and when there is nothing printed", "h": "And when the chart says nothing", "marca": "card-S", "luz": {"ab": "Q(6)+LFl15s", "per": 15.0, "on": [[0.0, 0.3], [1.0, 1.3], [2.0, 2.3], [3.0, 3.3], [4.0, 4.3], [5.0, 5.3], [6.3, 8.3]], "col": "W", "cols": ["W", "W", "W", "W", "W", "W", "W"], "continua": false, "fuente": "memoria"}, "p": ["This is a South cardinal on your chart, and you know what a South cardinal’s light is by now: six quick flashes and a long one. <b>But look at the paper.</b>", "<b>There is no flare and there is no characteristic.</b> The chart is not being lazy — it is telling you something exact: <b>this buoy is not lit</b>.", "<b>If there is nothing printed, do not expect to see it at night.</b> It is there, it is on the chart, and in the dark you will go past it without knowing. Everything you learned about the cardinals’ clock applies to the lit ones — and on this chart, the lit ones are the channel.", "<em>That is worth checking before you plan a night entry: not «what does this one flash», but «does it flash at all».</em>"]}, {"id": "4.P1", "tema": "How the chart writes it · topic 4", "obra": "impreso", "banco": "IMPRESO", "h": "Read it off the paper"}, {"id": "4.P2", "tema": "How the chart writes it · topic 4", "obra": "impreso", "banco": "CARTAREAL", "h": "On the chart you will be using"}, {"id": "5.S1", "tema": "Going in after dark · topic 5", "obra": "canalNoche", "b": "Next", "h": "The same channel, at two in the morning", "luces": [{"x": 1920.0, "y": 2337.8, "nombre": "No.2", "ab": "Fl.R.5s", "per": 5.0, "on": [[0.0, 0.5]], "col": "R"}, {"x": 1849.4, "y": 2455.4, "nombre": "No.1", "ab": "Fl.G.5s", "per": 5.0, "on": [[0.0, 0.5]], "col": "G"}, {"x": 2634.8, "y": 2637.8, "nombre": "No.4", "ab": "Fl.R.6s", "per": 6.0, "on": [[0.0, 0.5]], "col": "R"}, {"x": 2382.3, "y": 2716.7, "nombre": "No.3", "ab": "Fl.G.6s", "per": 6.0, "on": [[0.0, 0.5]], "col": "G"}, {"x": 1795.7, "y": 2285.0, "nombre": "SH", "ab": "L.Fl.10s", "per": 10.0, "on": [[0.0, 2.0]], "col": "W"}], "p": ["This is Stennick Haven — the channel you took apart in part two, mark by mark. <b>This is what is left of it after dark.</b>", "No shapes, no colours you can trust at this distance, no names painted on anything. <b>Six lights on black water</b>, and you have to know which is which before you commit to going in.", "<b>Everything you need is there.</b> One of them is white and slow — that is the doorway. The rest come in pairs, and the pairs are what the next screen is about.", "<em>Watch it for a moment. They are all running on the same clock.</em>", "<b>A rhythm shown here is an example, not a rule.</b> A lateral mark may flash any way at all except the compound group — that one belongs to the preferred-channel marks — and a special mark may flash any way at all. <b>What identifies those two is the colour, not the period.</b> You will meet four laterals in one channel later in this part, and no two of them flash alike. <em>The other marks are not like that: a cardinal, a preferred channel, an isolated danger and a safe water each have a rhythm that is theirs and nobody else’s.</em>"]}, {"id": "5.E1", "tema": "Going in after dark · topic 5", "obra": "canalNoche", "b": "Now you try", "h": "Two greens and two reds", "luces": [{"x": 1920.0, "y": 2337.8, "nombre": "No.2", "ab": "Fl.R.5s", "per": 5.0, "on": [[0.0, 0.5]], "col": "R"}, {"x": 1849.4, "y": 2455.4, "nombre": "No.1", "ab": "Fl.G.5s", "per": 5.0, "on": [[0.0, 0.5]], "col": "G"}, {"x": 2634.8, "y": 2637.8, "nombre": "No.4", "ab": "Fl.R.6s", "per": 6.0, "on": [[0.0, 0.5]], "col": "R"}, {"x": 2382.3, "y": 2716.7, "nombre": "No.3", "ab": "Fl.G.6s", "per": 6.0, "on": [[0.0, 0.5]], "col": "G"}, {"x": 1795.7, "y": 2285.0, "nombre": "SH", "ab": "L.Fl.10s", "per": 10.0, "on": [[0.0, 2.0]], "col": "W"}], "nombres": true, "firmas": true, "p": ["With their names and their characteristics on. <b>Look at what the colour does and does not tell you.</b>", "<b>Colour tells you which side of the channel a buoy marks</b> — red one edge, green the other, and going in with the arrow you know which hand to leave each on. That much you had in part two.", "<b>But there are two greens and two reds</b>, and the colour cannot tell them apart. Both greens are green. Both reds are red. <b>What separates them is the period</b>: five seconds for the first pair, six for the second.", "<em>That is what the period is for, and it is why the chart bothers to print it. Colour tells you which side. <b>The period tells you how far in you are.</b></em>", "<b>A rhythm shown here is an example, not a rule.</b> A lateral mark may flash any way at all except the compound group — that one belongs to the preferred-channel marks — and a special mark may flash any way at all. <b>What identifies those two is the colour, not the period.</b> You will meet four laterals in one channel later in this part, and no two of them flash alike. <em>The other marks are not like that: a cardinal, a preferred channel, an isolated danger and a safe water each have a rhythm that is theirs and nobody else’s.</em>"]}, {"id": "5.P1", "tema": "Going in after dark · topic 5", "obra": "luz", "banco": "PERIODO", "h": "Which buoy is that?"}, {"id": "6.P1", "tema": "All twelve, written down · topic 6", "obra": "montar", "banco": "MARCALUZ", "h": "Any of the twelve, written down", "q": "This is a real mark's light, and it is one of the twelve. <b>Write it the way the chart writes it.</b>"}, {"id": "6.C1", "tema": "", "obra": "cierre", "b": "Finish buoyage", "h": "What you can do now", "p": ["Twelve marks, lit. <b>You now have all three sides of every one of them: what it is, which side you pass it, and what it does after dark.</b>", "<b>A light is a rhythm, and a rhythm is four things.</b> Character, group, colour, period. Three of them you can see at a glance. The fourth you have to time — and it is the one that separates two lights flashing the same way on the same side of the same channel.", "<b>The cardinals run on a clock.</b> Three, six, nine, and north which has no number and so never stops. The long flash on the south is there for one reason: so that a six counted in a seaway cannot pass for a three or a nine.", "<b>And the chart says all of it before you leave the berth.</b> A magenta flare and four pieces of shorthand beside the buoy — or nothing at all, which is itself an answer: that one is not lit, and after dark it is not there.", "<em>What you cannot do yet is turn any of this into a position. Seeing a mark and knowing where you are from it are two different skills, and the second one is what comes next.</em>"]}];

"use strict";

const ritmoFase = (t, per) => ((t % per) + per) % per;

function ritmoTramo(on, per, t){
 const f = ritmoFase(t, per);
 for(let i=0;i<on.length;i++) if(f >= on[i][0] && f < on[i][1]) return i;
 return -1;
}

function ritmoEncendida(on, per, t){ return ritmoTramo(on, per, t) >= 0; }

function ritmoMotor(pinta){
 const M = {t:0, ref:0, raf:null, on:null, per:10};
 M.luz = (on, per) => { M.on = on || null; M.per = per || 10; };
 M.paso = now => {
  M.t = (now - M.ref) / 1000;
  if(M.on) pinta(ritmoEncendida(M.on, M.per, M.t), M.t);
  M.raf = requestAnimationFrame(M.paso);
 };
 M.arranca = () => {
  if(M.raf != null || typeof requestAnimationFrame === "undefined") return;
  M.ref = performance.now() - M.t * 1000;
  M.raf = requestAnimationFrame(M.paso);
 };
 M.para = () => {
  if(M.raf == null) return;
  cancelAnimationFrame(M.raf); M.raf = null;
 };
 M.anda = () => M.raf != null;
 return M;
}

"use strict";
const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

function fcAnota(id, bien){
 const o = fcLee(), c = o.cartas[id] || {ok:0, mal:0, peso:1};
 if(bien){ c.ok++; c.peso = Math.max(1, c.peso - 1); }
 else    { c.mal++; c.peso = 3; }
 o.cartas[id] = c; fcGuarda(o);
}

let FCR = ((typeof AZAR === "number" ? AZAR : 1) >>> 0) || 1;
function fcAzar(){ FCR ^= FCR<<13; FCR >>>= 0; FCR ^= FCR>>>17; FCR ^= FCR<<5;
 FCR >>>= 0; return FCR / 4294967296; }

const fcModo = id => CARTAS_MODOS.filter(m => m.id === id)[0];
const fcDelModo = id => CARTAS.filter(c => c.modo === id);

const fcAbierto = id => vistoEmpezada(fcModo(id).requiere);

function fcReparte(modo, n){
 const pool = fcDelModo(modo).slice(), out = [];
 while(out.length < n && pool.length){
  let tot = 0; for(const c of pool) tot += fcPeso(c.id);
  let r = fcAzar() * tot, k = 0;
  while(k < pool.length - 1 && (r -= fcPeso(pool[k].id)) > 0) k++;
  out.push(pool.splice(k, 1)[0].id);
 }
 return out;
}

function fcEmpieza(modo){
 FC.modo = modo; FC.ses = fcReparte(modo, POR_SESION);
 FC.i = 0; FC.vuelta = false; FC.primera = {}; FC.repes = {};
 fcRitmoPara(); pinta();
}

const fcCarta = () => CARTAS.filter(c => c.id === FC.ses[FC.i])[0];
const fcFin = () => !!FC.ses && FC.i >= FC.ses.length;

const FC_VUELTAS = 1;

function fcJuzga(bien){
 const id = FC.ses[FC.i];
 if(!(id in FC.primera)) FC.primera[id] = bien;
 fcAnota(id, bien);
 FC.repes = FC.repes || {};
 if(!bien && (FC.repes[id] || 0) < FC_VUELTAS && FC.ses.indexOf(id, FC.i + 1) < 0){
  FC.repes[id] = (FC.repes[id] || 0) + 1;
  FC.ses.splice(Math.min(FC.i + 4, FC.ses.length), 0, id);
 }
 FC.i++; FC.vuelta = false; fcRitmoPara(); pinta();
}

window.fcAbre = () => { FC.on = true; FC.desde = iP; FC.modo = null; FC.ses = null;
 fcRitmoPara(); pinta(); };
window.fcCierra = () => { FC.on = false; fcRitmoPara(); vaA(FC.desde); };

function fcRejilla(ids, titulo){
 fcRitmoPara();
 lamina(titulo || "");
 const n = ids.length; if(!n) return;
 const fila = Math.min(n, 6), filas = Math.ceil(n / fila);
 const k0 = n <= 3 ? 96 : n <= 6 ? 74 : 60;
 const arriba = px(46), abajo = px(30);
 const k = kQueCabe(k0 * filas, arriba, abajo) / filas;
 const alto = px(2 * k) + px(30), sep = px(20);
 const bloque = filas * alto + (filas - 1) * sep;
 const h = HOJA();
 const y0 = h.y0 + arriba + ((h.al - arriba - abajo) - bloque) / 2 + px(2 * k);
 const dx = (D.W - px(2 * MARGEN) - px(30)) / fila;
 ids.forEach((id, i) => {
  const m = marcaDe(id); if(!m) return;
  marca(m, px(MARGEN) + px(15) + dx * (i % fila) + dx / 2,
        y0 + (alto + sep) * Math.floor(i / fila), k,
        {agua:false, nombre:m.corto});
 });
}

function fcLuz(cx, cy, r, rt){
 const halo = el("circle", {cx:cx, cy:cy, r:r*2.4, fill:rt.hex, "fill-opacity":0});
 const lam  = el("circle", {cx:cx, cy:cy, r:r, fill:LUZ_APAGADA,
                            stroke:C.raya, "stroke-width":px(1.4)});
 FC.luz = {on:rt.on, per:rt.per, cols:rt.cols, lam:lam, halo:halo};
 FC.rit = ritmoMotor((_, t) => fcPinta(t));
 FC.rit.luz(rt.on, rt.per);
 FC.rit.arranca();
}

function fcPinta(t){
 const L = FC.luz; if(!L) return;
 const k = ritmoTramo(L.on, L.per, t);
 L.lam.setAttribute("fill", k < 0 ? LUZ_APAGADA : L.cols[k]);
 L.halo.setAttribute("fill-opacity", k < 0 ? 0 : .30);
 if(k >= 0) L.halo.setAttribute("fill", L.cols[k]);
}

function fcLienzo(){
 if(!FC.modo || fcFin()){
  const ids = fcFin()
   ? FC.ses.filter((id,i,a) => a.indexOf(id)===i && FC.primera[id]===false)
           .map(id => CARTAS.filter(c=>c.id===id)[0].marca)
   : CARTAS_ORDEN;
  fcRejilla(ids, fcFin() ? "the ones you missed" : "the deck");
  return;
 }

 lamina("");
 const c = fcCarta(); if(!c) return;
 const rt = c.ritmo;

 if(rt && !c.marca){
  const h = HOJA();
  el("rect", {x:h.x0, y:h.y0, width:h.an, height:h.al, rx:px(3), fill:"#08161D"});
  fcLuz(D.W / 2, h.y0 + h.al * 0.46, px(26), rt);
  txt(D.W / 2, h.y1 - px(16), "watch one whole cycle", "middle",
      T.rot, "#4E6B78", 600, "ui", .8);
  return;
 }

 const m = marcaDe(c.marca); if(!m) return;

 const alto = rt ? px(34) : 0;
 const k = kQueCabe(230, px(24) + alto, px(40));
 const base = lineaAgua(k, px(24) + alto, px(40));
 marca(m, D.W / 2, base, k, {agua:false});
 if(rt) fcLuz(D.W / 2, base - px(2 * k) - px(16), px(11), rt);
}

function fcPanel(p){
 const hd = document.createElement("div"); hd.className = "hd";
 hd.innerHTML = "<h3>Flashcards</h3>";
 p.appendChild(hd);

 if(!FC.modo){ fcElector(p); return; }
 if(fcFin()){ fcRecuento(p); return; }

 const c = fcCarta(), md = fcModo(FC.modo), d = c.detras;
 p.insertAdjacentHTML("beforeend",
  '<span class="prl">' + md.titulo + " · card " + (FC.i + 1) + " of " + FC.ses.length
  + "</span>");
 p.insertAdjacentHTML("beforeend", '<b class="q">' + md.pregunta + "</b>");

 if(!FC.vuelta){
  const nav = document.createElement("div"); nav.className = "nav";
  nav.innerHTML = '<button class="sec" id="fcSal">Leave</button>'
   + '<button id="fcV">Turn it over</button>';
  p.appendChild(nav);

  nav.querySelector("#fcV").onclick = () => { FC.vuelta = true; pinta(); };
  nav.querySelector("#fcSal").onclick = window.fcCierra;
  return;
 }

 p.insertAdjacentHTML("beforeend",
  '<div class="res ver"><b>' + d.nombre + "</b>"
  + "<p>" + d.senas.join(" &middot; ") + "</p>"
  + "<p>" + d.hace + "</p>"

  + '<div class="calc">' + d.luz
     + (d.fuente === "memoria" ? "  <b>(from memory, not the chart)</b>" : "")
     + "</div>"

  + (d.libre ? '<div class="pista">' + d.libre + "</div>" : "")
  + "</div>");

 const nav = document.createElement("div"); nav.className = "nav";
 nav.innerHTML = '<button class="sec" id="fcMal">Missed it</button>'
  + '<button class="show" id="fcBien">Got it</button>';
 p.appendChild(nav);
 nav.querySelector("#fcBien").onclick = () => fcJuzga(true);
 nav.querySelector("#fcMal").onclick = () => fcJuzga(false);
}

function fcElector(p){
 p.insertAdjacentHTML("beforeend",
  "<p>Twelve marks, four ways. <b>Pick what you want to practise</b> — they are "
  + "different things to remember, so they are never mixed in one run.</p>"
  + "<p><em>Shape and rhythm are two separate memories. Mixing them trains both "
  + "worse: you answer with whichever comes first and the other never gets its "
  + "turn. <b>The whole buoy</b> is the last step, not the first.</em></p>");

 if(!vistoHayAlmacen())
  p.insertAdjacentHTML("beforeend",
   '<div class="res no">This browser is not letting the course remember what you '
   + "have finished, so nothing can unlock.</div>");
 const ops = document.createElement("div"); ops.className = "ops";
 CARTAS_MODOS.forEach(md => {
  const abierto = fcAbierto(md.id), n = fcDelModo(md.id).length;
  const b = document.createElement("button");
  b.innerHTML = "<b>" + md.titulo + "</b> &middot; " + md.lema
   + (abierto ? "<br>" + n + " cards" : "<br>" + md.bloqueado);
  b.disabled = !abierto;
  b.onclick = () => fcEmpieza(md.id);
  ops.appendChild(b);
 });
 p.appendChild(ops);
 const nav = document.createElement("div"); nav.className = "nav";
 nav.innerHTML = '<button class="sec" id="fcSal">Back to the screens</button>';
 p.appendChild(nav);
 nav.querySelector("#fcSal").onclick = window.fcCierra;
}

function fcRecuento(p){
 const vistas = FC.ses.filter((id,i,a) => a.indexOf(id) === i);
 const bien = vistas.filter(id => FC.primera[id]).length;
 const mal = vistas.filter(id => FC.primera[id] === false);
 p.insertAdjacentHTML("beforeend",
  '<div class="res ' + (mal.length ? "" : "si") + '"><b>' + bien + " of "
  + vistas.length + "</b>"
  + (mal.length
     ? "<p>You missed these " + (mal.length === 1 ? "one" : mal.length)
       + ". <b>They will come round more often</b> until you do not.</p>"
       + "<p>" + mal.map(id => CARTAS.filter(c=>c.id===id)[0].detras.nombre)
                   .join(" &middot; ") + "</p>"
     : "<p><b>All of them, first time.</b></p>") + "</div>");
 const nav = document.createElement("div"); nav.className = "nav";
 nav.innerHTML = '<button class="sec" id="fcSal">Back to the screens</button>'
  + '<button id="fcOtra">Another ten</button>';
 p.appendChild(nav);
 nav.querySelector("#fcOtra").onclick = () => fcEmpieza(FC.modo);
 nav.querySelector("#fcSal").onclick = window.fcCierra;
}

window.FCEST = () => ({on:FC.on, modo:FC.modo, i:FC.i, vuelta:FC.vuelta,
 largo:FC.ses ? FC.ses.length : 0, fin:fcFin(),
 carta:(FC.ses && !fcFin()) ? FC.ses[FC.i] : null,
 luz:FC.luz ? {per:FC.luz.per, tramos:FC.luz.on.length,
               color:FC.luz.lam.getAttribute("fill")} : null,
 anda:!!(FC.rit && FC.rit.anda()),
 vueltas:FC.repes ? Object.keys(FC.repes).length : 0,
 distintas:FC.ses ? new Set(FC.ses).size : 0,
 abiertos:CARTAS_MODOS.filter(m => fcAbierto(m.id)).map(m => m.id)});
window.fcEmpieza = fcEmpieza; window.fcJuzga = fcJuzga; window.fcPeso = fcPeso;

vistoEmpieza(FICHERO);

const _fb=document.getElementById("fcBtn");
if(_fb)_fb.onclick=()=>{ if(FC.on)window.fcCierra(); else window.fcAbre(); };

if(typeof location !== "undefined" && location.hash === "#flashcards" && _fb)
 setTimeout(()=>_fb.click(), 0);

addEventListener("keydown",e=>{ if(e.key==="Escape"&&FC.on)window.fcCierra(); });

const YO = "balizamiento-p3-at-night.html";
function guardaDonde(i){ vistoPon(YO, i); }
function donde(){ return vistoPos(YO, PZ.length-1); }

function deCero(){ vistoOlvida(YO); vaA(0); }

vaA(donde());
</script>
