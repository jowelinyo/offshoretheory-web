<script>

"use strict";
const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){

const PZ=[{"t": "What a position line is", "s": [{"id": "1.S1", "h": "One bearing, and what it buys you", "v": [3732.5, 2726.0, 7545], "mk": [[5010.0, 725.0, 70]], "ln": [5010.0, 725.0, 4048.792018642105, 5407.631495341523], "p": ["You take one bearing of <b>Brough Tower</b> and it reads <b>010</b>. Draw it back out of the tower and you get the line on the chart &mdash; <b>7.1 miles of it</b>, running away to the south.", "<b>You are somewhere on that line.</b> Not at its start, not at its end, not anywhere in particular along it &mdash; <i>somewhere</i>.", "And here is the part worth having: <b>you are nowhere else on this chart.</b> Every square mile of water either side of that line has just been ruled out, and you have not touched an instrument since the compass."], "b": "Next"}, {"id": "1.E1", "h": "Three boats, one bearing", "v": [3732.5, 2726.0, 7545], "mk": [[5010.0, 725.0, 70]], "ln": [5010.0, 725.0, 4048.792018642105, 5407.631495341523], "p": ["<b>Now watch what the line does not tell you.</b> Three boats are out there right now, all on that same line, and all three have just taken the same bearing of the same tower."], "b": "Next", "pasos": [{"t": "<b>The first boat is 2 miles off the tower.</b> Hand bearing compass on Brough Tower, corrected to true: <b>010</b>.", "calc": "boat 1 &nbsp;&middot;&nbsp; 2 M off &nbsp;&middot;&nbsp; Brough Tower bears <b>010</b>", "ln": [5010.0, 725.0, 4048.792018642105, 5407.631495341523], "mk": [[5010.0, 725.0, 70]], "barcos": [[4739.237188349888, 2044.0511254483195, "2 M · 010"]]}, {"t": "<b>The second is a mile further out.</b> Same tower, same compass, and the reading has not moved: <b>010</b>. It has no reason to &mdash; the tower is still in the same direction.", "calc": "boat 2 &nbsp;&middot;&nbsp; 3 M off &nbsp;&middot;&nbsp; Brough Tower bears <b>010</b>", "ln": [5010.0, 725.0, 4048.792018642105, 5407.631495341523], "mk": [[5010.0, 725.0, 70]], "barcos": [[4739.237188349888, 2044.0511254483195, "2 M · 010"], [4603.855782524832, 2703.5766881724794, "3 M · 010"]]}, {"t": "<b>And the third, a mile further still.</b> <b>010</b> again. These three are <b>2 miles apart</b> end to end and their compasses agree to the degree.<br><br><i>So which of the three are you? The bearing cannot say. That is what one line is worth: it gives you the line and leaves you to find your own place on it.</i>", "calc": "three boats &nbsp;&middot;&nbsp; 2 M apart &nbsp;&middot;&nbsp; one reading: <b>010</b>", "ln": [5010.0, 725.0, 4048.792018642105, 5407.631495341523], "mk": [[5010.0, 725.0, 70]], "barcos": [[4739.237188349888, 2044.0511254483195, "2 M · 010"], [4603.855782524832, 2703.5766881724794, "3 M · 010"], [4468.474376699776, 3363.102250896639, "4 M · 010"]]}]}, {"id": "1.P1", "h": "Point at somewhere you cannot be", "t": "click", "v": [3732.5, 2726.0, 7545], "mk": [[5010.0, 725.0, 70]], "ln": [5010.0, 725.0, 4048.792018642105, 5407.631495341523], "lpos": [5010.0, 725.0, 4048.792018642105, 5407.631495341523], "lejos": 463, "ay": "Click any part of the chart that the bearing has ruled out.", "p": ["<b class='q'>You have that one bearing and nothing else. Show me a place you are definitely not.</b>", "Anywhere off the line will do &mdash; and that is the whole point of the question. <i>One line cannot tell you where you are, but it can tell you where you are not, and it tells you that about most of the chart.</i>"], "b": "Next", "hizo": "ruled out a place with a single bearing"}]}, {"t": "The bearing", "s": [{"id": "2.S1", "h": "A bearing is a direction, and it starts at you", "v": [1661, 3473, 2100], "mk": [[1661.0, 3473.0, 70]], "mira": [2327.6, 3016.5, 1661.0, 3473.0, "234"], "barcos": [[2327.6, 3016.5, "you"]], "p": ["<b>You are here, and Skelvoe Tower is over there.</b> Hand bearing compass up, the tower in the notch, and the card settles: <b>234</b>. That is the whole instrument.", "<b>A bearing is a direction, and it runs from you to the object.</b> Not the other way. The grey line is what your eye is doing over the top of the compass, and 234 is the angle it makes with north.", "What the compass gives you is <b>magnetic</b>, and the chart is drawn to <b>true</b>. <i>Correct it the way module 02 taught you</i> &mdash; variation off the chart, deviation off the card &mdash; and you have a true bearing to work with. That part is not taught again here.", "<b>And two more things go in the book while you are at it: the time, to the minute, and the log reading.</b> Every position line gets a time and a log against it, as part of taking it — not as a tidy-up afterwards. <i>Why, at the end of this part.</i>"], "b": "Next"}, {"id": "2.S2", "h": "And that is why you draw it backwards", "v": [1661, 3473, 2100], "mk": [[1661.0, 3473.0, 70]], "ln": [1661.0, 3473.0, 6660.5, 49.2], "p": ["<b>Here is the trap, and it catches everybody once.</b> You have 234 true. The one thing you cannot do is start the line where you are, because <b>you do not know where you are</b> &mdash; that is the entire reason you took the bearing.", "<b>The tower does know where it is.</b> So the line starts at the tower and runs out along the reciprocal &mdash; 234 &minus; 180 = <b>054</b> &mdash; back towards you.", "There it is, running off this view and 9.0 miles down the chart. <b>You are somewhere on it.</b> The line is the same line either way round; what changes is that this end is nailed to something real."], "calc": "234 &nbsp;&minus;&nbsp; 180 &nbsp;=&nbsp; <b>054</b>, from the tower outwards", "b": "Next"}, {"id": "2.E1", "h": "A bearing, worked through", "v0": [3732.5, 2726.0, 7545], "v": [3732.5, 2726.0, 7545], "mk0": [[6603.0, 4590.0, 70]], "p": ["<b>Two towers, and both of them are on the chart.</b> You are lying off <b>Brough Tower</b>, and away to the south-east stands <b>Wardhill Tower</b> — 170 m of it, the highest thing on this coast.", "Watch the whole thing done once. <b>Every number below comes off the chart</b>, and at the end the line you draw lands on a spot the chart already knows — which is how you will know you did it right."], "b": "Next", "pasos": [{"t": "<b>You take the bearing.</b> Hand bearing compass up, Wardhill Tower in the notch, and read it: <b>162 by compass</b>. A hand bearing compass is held away from the boat's iron, so it has no deviation — what it gives you is magnetic and nothing else.", "calc": "compass &nbsp; <b>162</b>", "v": [3732.5, 2726.0, 7545], "mk": [[6603.0, 4590.0, 70]]}, {"t": "<b>Correct it to true, the way module 02 taught you.</b> The variation here is <b>6°W</b>. Going up from the compass to the chart, <b>west comes off</b> — so 162 magnetic is <b>156 true</b>. That is the direction you will draw.", "calc": "162 magnetic &nbsp;&minus;&nbsp; 6&deg;W &nbsp;=&nbsp; <b>156 true</b>", "v": [3732.5, 2726.0, 7545], "mk": [[6603.0, 4590.0, 70]]}, {"t": "<b>And now turn it round, which is the step everybody forgets.</b> You do not know where you are; <b>the tower does</b>. So the line is drawn <b>from the tower</b>, along the reciprocal — 156 − 180 = <b>336</b> — back towards you.", "calc": "156 &nbsp;&minus;&nbsp; 180 &nbsp;=&nbsp; <b>336</b>, from the tower outwards", "v": [3732.5, 2726.0, 7545], "mk": [[6603.0, 4590.0, 70]]}, {"t": "<b>Lay it and draw it.</b> There is the line, out of Wardhill Tower on 336. <b>You are somewhere on it</b> — one bearing never says more than that. And look where it goes: straight through Brough Tower, <b>6.21 M</b> away, which is exactly where you said you were. <i>The chart just checked your work.</i>", "calc": "Wardhill Tower &nbsp;&rarr;&nbsp; <b>336</b> &nbsp;&middot;&nbsp; 6.21 M to Brough Tower", "v": [3732.5, 2726.0, 7545], "ln": [6603.0, 4590.0, 5010.0, 725.0], "mk": [[6603.0, 4590.0, 70], [5010.0, 725.0, 70]]}]}, {"id": "2.P1", "h": "Now plot one yourself", "t": "trazar", "v": [1050, 4208, 2100], "por": [1021.0, 4208.0], "mk": [[1021.0, 4208.0, 70]], "p": ["<b>You take a bearing of Halkirk Spire and correct it: 245 true.</b> That is all you have.", "<b class='q'>Plot the position line.</b> Remember which end is nailed down: the line runs <b>out of the spire</b>, along the reciprocal.", "Set the rose first, then move the rule. <i>Rose, square, slide</i> &mdash; the order matters, because turning the rule after you have set the rose undoes the setting."], "ay": "Drag inside the rose to set the number. Drag the far half of the rule to turn it, the near half to slide it without turning.", "ck":function(v,d){var t=65;if(Math.abs(((v-t)%360+540)%360-180)>4){ if(Math.abs(((v-245)%360+540)%360-180)<=4)  return {ok:false,m:'The rose reads <b>245</b> &mdash; that is the bearing you took, not the line you draw. Take 180 off it.'}; return {ok:false,m:'The index reads '+Math.round(v)+'&deg;. You want <b>065</b>: 245 minus 180.'};}if(!d.paralela)return {ok:false,m:'The number is right. Now turn the rule until the grid inside the rose is square with the meridians again.'};if(!d.norte)return {ok:false,m:'Square, but upside down &mdash; the north arrows point to the bottom. Turn it 180&deg;. The line you have drawn is 245, not 065.'};if(!d.porPunto)return {ok:false,m:'The direction is right. The line just does not pass through the spire &mdash; it is '+Math.round(d.dist)+' m off. Slide the rule sideways without turning it.'};return {ok:true,m:'<span class="big">065 out of Halkirk Spire</span><br>And you are somewhere along it. That is one position line, drawn the way they are always drawn: <b>from the thing that knows where it is</b>.'};}, "b": "Next", "hizo": "plotted a position line from a bearing"}, {"id": "2.P2", "h": "What it costs to leave the compass wrong", "t": "desvio", "v": [2566, 2947, 3900], "mk": [[1661.0, 3473.0, 70]], "aban": [1661.0, 3473.0, 57.0, [1, 2, 3]], "p": ["<b>Same tower, same bearing, and now a compass that lies.</b> The dashed line is the one you would draw with the error corrected. Wind the error on and watch the other one open away from it.", "<b class='q'>Take it up to 5 degrees and read the three numbers.</b>", "<b>5&deg; of uncorrected error puts you 162 m out at one mile, 323 at two and 485 at three</b> &mdash; near enough three cables. The error in the instrument never changed; <i>the distance did all the work</i>.", "Nothing here is about correcting a compass &mdash; that was module 02. <b>This is about what it costs not to.</b>"], "b": "Next"}]}, {"t": "The transit", "s": [{"id": "3.S1", "h": "Two things in line, and no instrument at all", "v": [1728, 3396, 2800], "mk": [[1661.0, 3473.0, 70], [1021.0, 4208.0, 70]], "ln": [1021.0, 4208.0, 3208.5, 1695.8], "barcos": [[2324.2, 2711.4, "you"]], "mira": [2324.2, 2711.4, 1021.0, 4208.0, ""], "p": ["<b>Look back along the boat and there are two things in line:</b> <b>Skelvoe Tower</b> in front and <b>Halkirk Spire</b> 1.45 M behind it, one sitting exactly over the other.", "<b>That is a position line, and you did not touch an instrument to get it.</b> No compass, no protractor, no correcting. While the two stay in line you are on the line that runs through them &mdash; <b>039 one way, 219 the other</b> &mdash; and the moment they open, you are not.", "<b>And it only works from one side.</b> The line runs on past the spire as well, but that half is over the land the two of them stand on. <i>Measured on this chart: out beyond the tower there are <b>2.5 miles</b> of water you can be in; the other way, <b>none at all</b>.</i> A transit you cannot float on is not a position line."], "b": "Next"}, {"id": "3.S2", "h": "Why it is the best line there is", "v": [1728, 3396, 2800], "mk": [[1661.0, 3473.0, 70], [1021.0, 4208.0, 70]], "ln": [1021.0, 4208.0, 3208.5, 1695.8], "barcos": [[2324.2, 2711.4, "you"]], "mira": [2324.2, 2711.4, 1021.0, 4208.0, ""], "p": ["<b>A bearing carries the compass inside it.</b> Variation, deviation, the card swinging in a seaway, your own eye on the notch &mdash; every one of those goes into the line before you draw it. Topic 2 measured what that costs: <b>one degree is 32 m at one mile and 97 m at three</b>, and it grows the further off you are.", "<b>A transit has no compass in it at all.</b> It is not that it is measured better &mdash; <i>it is that nothing is measured</i>. Two objects are either in line or they are not, and your eye settles that at a hundred metres and at three miles just the same.", "<b>So it does not open with distance.</b> That is the whole of its advantage, and it is why every harbour that can put two marks up does it. <i>When a transit is available, it beats anything you can measure.</i>"], "b": "Next"}, {"id": "3.E1", "h": "The transit is not the pair: it is the line that leaves it", "v": [2115, 2952, 3950], "mk": [[1661.0, 3473.0, 70], [1021.0, 4208.0, 70]], "ln": [1021.0, 4208.0, 3208.5, 1695.8], "tramo": [2103.1, 2965.2, 3208.5, 1695.8, "2.5 M of water"], "barcos": [[2324.2, 2711.4, "you"]], "p": ["<b>Stand back and the transit turns into what it really is:</b> not two marks on a headland, but <b>a line running out to sea from them</b>, on 039.", "<b>The green stretch is the part you can be on.</b> It starts <b>1.0 M</b> out from the tower, because the first mile of the line is over the headland the tower stands on, and it runs <b>2.5 M</b> before the water gives out. <i>The line is longer than the useful part of it, and knowing which part is which is the navigator's job, not the chart's.</i>", "<b>Anywhere along that green stretch, the two marks are in line and you are on the position line.</b> Where along it, the transit does not say &mdash; the same as every other single line in this module."], "b": "Next"}, {"id": "3.P1", "h": "In the transit, or out of it?", "t": "choice", "v": [1341, 3840, 1200], "mk": [[1661.0, 3473.0, 70], [1021.0, 4208.0, 70]], "ln": [1021.0, 4208.0, 3208.5, 1695.8], "barcos": [[1701.0, 4042.0, "you"]], "p": ["<b>Close in now, and here is where you are.</b> The two marks are up there and the transit line runs past them.", "<b class='q'>From this spot, do Skelvoe Tower and Halkirk Spire look in line, or open?</b>"], "o": [{"t": "In line, one behind the other", "m": "Look again at where the boat is sitting: it is <b>off the line</b>, and well off. From here the tower bears 354 and the spire 255 &mdash; <b>they are 100&deg; apart</b>. You would see two separate marks with a wide gap between them, not one behind the other.", "next": false}, {"t": "Open &mdash; they are not in line", "ok": true, "m": "<span class=\"big\">Open, by 100&deg;</span><br><b>And that is the whole of what a transit tells you: in, or out.</b> There is no reading to take and no error to correct &mdash; you either see one over the other or you do not.<br><br><i>But notice what it still does not tell you.</i> Sail across until they close up, and you know you are on that line &mdash; <b>and nowhere along it in particular</b>. One transit is still one line."}], "b": "Next", "hizo": "read a transit open or closed"}]}, {"t": "The sounding", "s": [{"id": "4.S1", "h": "The line you did not draw, and it was there all along", "v": [3732.5, 2726.0, 7545], "p": ["<b>Stand back off the chart and look at the colours.</b> Skelmar is printed in four shades, and each one is a depth: <b>green dries</b>, <b>dark blue is under 5 m</b>, <b>pale blue is 5 to 10</b>, and <b>Where one shade meets the next there is a <b>contour</b>: a line joining everywhere of the same depth, and the chart draws three of them.", "<b>A contour is a line, and it is a position line.</b> The echo sounder gives you a number, that number puts you on one of those lines, and <i>you did not use the compass and you did not need to see anything at all</i>. This is the only line in the module you can get in fog, at night, with the visibility down to the pushpit.", "<b>But look at the shape of them.</b> A bearing gives you a straight line and a transit gives you a straight line. <b>A contour wanders</b> &mdash; it goes round every headland and into every bay &mdash; and that is going to cost you something on the next screen."], "b": "Next"}, {"id": "4.E1", "h": "7.4 metres, and where that leaves you", "v": [5250, 1750, 3400], "barcos": [[6090.0, 1188.0, "you"]], "trozos": [[6200.0, 1420.0], [6020.0, 540.0], [6900.0, 1540.0], [6900.0, 2320.0], [6140.0, 2820.0], [4680.0, 2960.0]], "p": ["<b>The sounder reads, you take the tide off it, and you are left with 7.4 m of charted depth.</b> That is between the 5 m contour and the 10 m contour, so <b>you are somewhere in the pale blue</b> &mdash; and the chart has drawn that band for you already.", "<b>The rings mark them: there are 6 separate pieces of pale blue in this view.</b> The 5 m contour wanders round every headland and back out again, and every time it does, it opens another place where 7.4 m is a perfectly good answer. <i>The boat marked here is in one of them. It could be in any of the others.</i>", "<b>That is what makes the sounding the weakest of the four.</b> A bearing leaves you on one line; a sounding can leave you on a line that comes back and cuts you again three headlands away. <i>It is still worth having &mdash; it just needs something else with it.</i>", "<b>And the tide had to come off first.</b> The sounder measures from the waterline and the chart measures from chart datum; the difference is the height of tide, and getting it is <b>module 04</b>. Until then the number is handed to you corrected."], "calc": "sounder &minus; tide &nbsp;=&nbsp; <b>7.4 m</b> &nbsp;&middot;&nbsp; between the 5 and the 10", "b": "Now you try"}, {"id": "4.P1", "h": "Point at somewhere you could be", "t": "click", "v": [5250, 1750, 3400], "cls": [2], "ay": "Click any part of the chart where 7.4 m would be right.", "p": ["<b class='q'>Same 7.4 m, and no other information at all. Show me a place you could be.</b>", "Any of the pale blue will do &mdash; <i>and that is the point of the question</i>. There are 6 pieces of it in this view and the sounding cannot tell you which."], "ok": "<span class=\"big\">Between the 5 and the 10</span><br><b>Right &mdash; and so would 5 other places in this view have been.</b> That is a position line that wanders: one number, and it puts you on a band that comes back on itself. <i>One line is never enough; this one is less enough than the others.</i>", "no":function(c){var n=['on land or on a drying patch','in under 5 m of water','between the 5 and the 10','in more than 10 m of water'];if(c<0)return 'That is off the chart altogether.';return 'That spot is <b>'+n[c]+'</b>, and the sounder said <b>7.4 m</b>. Look for the pale blue: the band between the 5 m contour and the 10 m contour.';}, "b": "Next", "hizo": "found where a single sounding lets you be"}]}, {"t": "The distance", "s": [{"id": "5.S1", "h": "Two ways to a distance, and neither gives you a line", "v": [3732.5, 2726.0, 7545], "cir": [[1661.0, 3473.0, 2.0, "2.0 M", false, 200]], "p": ["<b>There are two ways to get a distance without an instrument that plugs in.</b> One is a <b>vertical sextant angle</b>: you know how high the object is, you measure the angle it subtends, and the two give the range. The other is <b>rising and dipping</b>: you note the moment a light first lifts over the horizon, and that moment is a distance.", "<b>And here is what makes them different from everything so far.</b> A bearing gives you a line. A transit gives you a line. A sounding gives you a line that wanders. <b>A distance gives you a circle</b> &mdash; every point the same range from the object, all the way round.", "<i>The word «line» stops being the right word here, and it is worth saying out loud.</i> A position circle behaves the same way as a position line in the one respect that matters: <b>you are somewhere on it and nowhere else</b>, and one of them is still not a fix."], "b": "Next"}, {"id": "5.E1", "h": "A vertical angle, and the circle it draws", "v": [2028, 3473, 4056], "mk": [[1661.0, 3473.0, 70]], "cir": [[1661.0, 3473.0, 2.0, "2.0 M", false, 200]], "barcos": [[2156.7, 2221.0, "you"]], "p": ["<b>Skelvoe Tower stands 68 m above the sea, and the chart says so</b> &mdash; the number in brackets under its name. Bring the sextant up, put the top of the tower on the waterline below it, and read the angle: <b>1.05&deg;</b>.", "<b>Height over angle gives range.</b> 68 m subtending 1.05&deg; puts you <b>2.0 M</b> off &mdash; and that is the whole circle drawn here, not a point on it. <i>The sextant does not know which way the tower bears; it only knows how far.</i>", "<b>The boat is on the circle, and so is every other place on it.</b> Put a bearing with it and the two cross; on its own it is one position line with a curve in it."], "calc": "68 m &nbsp;&middot;&nbsp; 1.05&deg; &nbsp;=&nbsp; <b>2.0 M</b> off Skelvoe Tower", "b": "Next"}, {"id": "5.E2", "h": "Rising and dipping, and which of the two runs out first", "v": [3732.5, 2726.0, 7545], "mk": [[548.0, 2286.0, 70], [5537.0, 3137.0, 70]], "cir": [[548.0, 2286.0, 8.036502874725048, "Hoyness dips at 8.0 M", true, 95.5, -20], [548.0, 2286.0, 10.0, "its lamp reaches 10 M", true, 94.125, 20], [5537.0, 3137.0, 8.0, "Auskerry: the lamp stops at 8 M", true, 275.125, 22]], "p": ["<b>A light has two ranges and they are not the same thing.</b> Its <b>luminous range</b> is how far the lamp throws &mdash; the number on the chart. Its <b>geographic range</b> is how far away it is still over your horizon, and that depends on <i>its</i> height and on <i>yours</i>. Standing in the cockpit your eye is about <b>2 m</b> up, and this course works to that.", "<b>Hoyness is only 6 m up, and reaches 10 M.</b> It goes under your horizon at <b>8.0 M</b> &mdash; before the lamp gives out. <i>The horizon decides, and the light is useful right up to the moment it dips.</i>", "<b>Auskerry is 14 m up and would stay over the horizon out to 10.7 M</b> &mdash; but the lamp stops at <b>8</b>. <i>The lamp decides, and the extra height buys nothing.</i> <b>Look at the chart: its 10.7 M circle is not drawn, because it does not fit on this sheet at all.</b> That is the point made for you &mdash; its horizon is further away than the whole chart is wide, and the lamp ran out long before.", "<b>The smaller of the two is the one you get.</b> That is the whole rule, and these two lights are the two ways round it goes."], "calc": "Hoyness &nbsp;8.0 M&nbsp; vs &nbsp;10 M &nbsp;&middot;&nbsp; Auskerry &nbsp;10.7 M&nbsp; vs &nbsp;8 M", "b": "Now you try"}, {"id": "5.P1", "h": "Where does that put you?", "t": "click", "v": [2028, 3473, 4056], "mk": [[1661.0, 3473.0, 70]], "cir": [[1661.0, 3473.0, 2.0, "2.0 M", false, 200]], "scir": [1661.0, 3473.0, 2.0, 460, "Skelvoe Tower"], "ay": "Click anywhere on the circle — within a quarter of a mile of it.", "p": ["<b class='q'>Same tower, same 1.05&deg;, same 2.0 M. Show me a place you could be.</b>", "Anywhere on the circle &mdash; <i>and only on it</i>. Inside is too close and outside is too far; the angle would have read something else."], "b": "Next", "hizo": "put yourself on a distance circle"}]}, {"t": "Which one to trust", "s": [{"id": "6.S1", "h": "Four lines, and they are not worth the same", "v": [3732.5, 2726.0, 7545], "p": ["<b>You now have four ways to get a position line, and a navigator has to know which to believe when they disagree.</b> The order is not a list to learn: it falls out of <i>what each one has inside it</i>.", "<b>The transit carries no instrument at all.</b> Two objects are in line or they are not; nothing is read, so nothing can be read wrong. <b>It is first, and it is not close.</b>", "<b>The vertical angle carries a sextant</b>, which is read to a minute and is honest &mdash; but the sum it feeds turns a small angle error into a large distance error as soon as you are any way off. <b>Good close in, poor far out.</b>", "<b>The bearing carries the whole compass:</b> variation, deviation, the card swinging, your eye on the notch. Every one of those is in the line before you draw it, and the further away the object, the more it costs.", "<b>And the sounding carries the tide</b> &mdash; a number you had to get from somewhere else before the reading meant anything &mdash; and it gives you a line that wanders and can cut you in several places at once. <b>Last, and still worth having when the visibility is gone.</b>"], "b": "Next"}, {"id": "6.E1", "h": "The same three errors, at one mile and at three", "v0": [2235, 3122, 1200], "v": [2235, 3122, 1200], "mk0": [[1661.0, 3473.0, 70]], "p": ["<b>Here are three of them measured against each other, drawn on the chart at the size they really are.</b> All three are errors in the same thing: how far off the true line the position ends up."], "b": "Next", "pasos": [{"t": "<b>Start at one mile.</b> One degree of compass error puts the bearing <b>32 m</b> off the true line. Half a degree on the sextant — with the tallest thing on this coast, <b>Wardhill Tower, 170 m</b>, which is the best case there is — puts the distance <b>0.11 M</b> out, about <b>196 m</b>. <b>Already six times as much</b>, and neither of them is a small error. The transit is the tick with no bar: <b>no instrument, nothing to be wrong</b>.", "calc": "at 1 M &nbsp;&middot;&nbsp; bearing <b>32 m</b> &nbsp;&middot;&nbsp; sextant <b>196 m</b> &nbsp;&middot;&nbsp; transit <b>0</b>", "v": [2235, 3122, 1200], "mk": [[1661.0, 3473.0, 70]], "barras": [[2235.7, 3122.2, 32.32678024705897, "bearing, 1° · 32 m", 147.0, 0], [2235.7, 3122.2, 196.2100160472347, "sextant, ½° · 196 m", 147.0, 1], [2235.7, 3122.2, 0.0, "transit · nothing", 147.0, 2]]}, {"t": "<b>Now stand back to three miles, and look what happened.</b> The bearing has grown to <b>97 m</b> &mdash; three times, because the error is an angle and it opens. The sextant has grown to <b>1.20 M</b>, which is <b>2219 m</b>: not three times but <b>eleven</b>, because the angle it reads got small and half a degree is now most of it. <b>And the transit is still a dot.</b><br><br><i>That is the rule you take away: every one of them gets worse with distance except one. So take the transit if there is one; take the sextant close in; take the bearing of the nearest decent object, not the most obvious distant one.</i>", "calc": "at 3 M &nbsp;&middot;&nbsp; bearing <b>97 m</b> &nbsp;&middot;&nbsp; sextant <b>2219 m</b> &nbsp;&middot;&nbsp; transit <b>0</b>", "v": [2566, 2947, 3900], "mk": [[1661.0, 3473.0, 70]], "barras": [[3385.0, 2420.6, 96.9803407411769, "bearing · 97 m", 147.0, 0], [3385.0, 2420.6, 2219.0375976062246, "sextant · 1.20 M", 147.0, 1], [3385.0, 2420.6, 0.0, "transit · nothing", 147.0, 2]]}]}, {"id": "6.P1", "h": "Three lines on offer. Which one do you take?", "t": "choice", "v": [2100, 3600, 3900], "mk": [[1661.0, 3473.0, 70], [1021.0, 4208.0, 70]], "ln": [1021.0, 4208.0, 3208.5, 1695.8], "barcos": [[2324.2, 2711.4, "you"]], "p": ["<b>You are here, and three position lines are available at this moment.</b> <b>Halkirk Spire</b> is exactly behind <b>Skelvoe Tower</b>. <b>Brough Tower</b> bears <b>052</b> by hand bearing compass, corrected. And the sounder, with the tide taken off, puts you in <b>mas de 10 m</b>.", "<b class='q'>You only have time to plot one before the next squall. Which?</b>"], "o": [{"t": "The bearing of Brough Tower", "m": "<b>It is the one with the most in it that can be wrong.</b> Brough is a long way off, and you measured what that costs: one degree of compass error is <b>32 m</b> at one mile and <b>97 m</b> at three &mdash; and Brough is further than three. Variation, deviation and your own eye are all inside that line before you draw it.", "next": false}, {"t": "The transit &mdash; Halkirk behind Skelvoe", "ok": true, "m": "<span class=\"big\">The transit, and it is not close</span><br><b>There is no instrument in it.</b> Nothing is read, so nothing can be read wrong &mdash; and it does not open with distance the way the other two do. <i>When a transit is on offer, it beats anything you can measure.</i><br><br>The other two are not useless: the bearing is what you use when there is no transit, and the sounding is what you use when you cannot see. <b>But when all three are there, this is the one.</b>"}, {"t": "The sounding", "m": "<b>It is the widest and the most ambiguous of the three.</b> The reading needed the tide taken off it before it meant anything, and a contour wanders &mdash; you measured that too: <b>6 separate pieces of the same band</b> inside one working view. It is the line you take when you cannot see, not the line you take when you can.", "next": false}], "b": "Next", "hizo": "chose the position line to trust"}]}, {"t": "Closing", "s": [{"id": "7.S1", "h": "The four of them, on one chart", "v": [3732.5, 2726.0, 7545], "mk": [[5010.0, 725.0, 70], [1661.0, 3473.0, 70], [1021.0, 4208.0, 70]], "ln": [5010.0, 725.0, 4048.792018642105, 5407.631495341523], "cir": [[1661.0, 3473.0, 2.0, "a distance · 2.0 M", false, 200]], "tramo": [2103.1, 2965.2, 3208.5, 1695.8, "a transit"], "trozos": [[6200.0, 1420.0], [6020.0, 540.0], [6900.0, 1540.0], [6900.0, 2320.0]], "p": ["<b>Here they are together, and you can see the shapes are not the same.</b> The dashed line out of <b>Brough Tower</b> is a <b>bearing</b>. The green stretch off <b>Skelvoe</b> is a <b>transit</b>, straight too but nailed at both ends by two objects instead of read off a compass. The ring round <b>Skelvoe Tower</b> is a <b>distance</b> &mdash; a circle, not a line. And the marked patches are <b>soundings</b>: the same band, in four separate places, because a contour wanders.", "<b>Two straights, a circle and something that meanders</b> &mdash; and every one of them does exactly the same job. <i>It tells you where you are not.</i>", "<b>That is the sentence this part opened with, and now you have four ways to earn it:</b> a single position line does not put you anywhere. It rules out everything that is not on it, which on a chart this size is nearly everything &mdash; and that is worth having, and it is not a fix."], "b": "Next"}, {"id": "7.C1", "h": "One line rules out. Two cross — and sometimes twice.", "v": [3732.5, 2726.0, 7545], "mk": [[1661.0, 3473.0, 70], [1021.0, 4208.0, 70]], "cir": [[1661.0, 3473.0, 2.0, "", false, 200]], "tramo": [2103.1, 2965.2, 3208.5, 1695.8, ""], "ln": [1021.0, 4208.0, 3208.5, 1695.8], "p": ["<b>You can now get a position line four ways</b>, you know which of them to reach for first, and you know what each one costs you at three miles instead of one. <i>That is the whole of part 1, and none of it required anything that plugs in.</i>", "<b>Look at the chart once more.</b> The transit and the 2.0 M circle are both drawn, and they cross. <b>Where two position lines cross, you are at the crossing</b> &mdash; and that is a <b>fix</b>, which is a different animal from anything in this part.", "<b>Except look again: they cross twice.</b> The transit runs straight through the middle of the circle, so it cuts it on both sides &mdash; and the two crossings are <b>4 miles apart</b>. Two lines, a proper fix, and you still have to decide which end of the boat you are. <i>Nothing you learned in this part settles that.</i>", "<b>That is where part 2 starts.</b> <b>The angle two lines cut at</b> &mdash; why lines meeting nearly head-on give a fix you should not trust, and why this one, cutting at nothing at all, gives two. And <b>the cocked hat</b>: what it means when you lay three lines and they make a small triangle instead of meeting at a point.", "<b>And one more thing, which is why you have been writing down the time and the log with every line you take.</b> A position line is only true at the moment you took it. <b>At five knots, five minutes is half a mile</b> &mdash; so a line you laid a quarter of an hour ago is not where you are now, and neither are you.", "<b>That is also what saves you when there is only one object in sight.</b> An old line can be <b>carried forward</b> by the course and distance you have run since, and crossed with a fresh one off the same object &mdash; two lines from one mark. <i>It is called a running fix, it needs the time and the log you have been noting, and it is part 3. It is named here and taught there.</i>", "<i>You have spent this part learning that one line is not enough. Part 2 is about how many more you need, how they should cut, and how much to believe the answer.</i>"], "b": "Finish"}]}];

function numeros(t){

  .replace(/miles?|metres?|meters?|degrees?|deg|knots?|\bnm\b|\bmin\b/g," ")
  .replace(/[nsew]/g," ")
  .replace(/[°º˚]/g,"#")
  .replace(/[″”"]/g,"~")
  .replace(/[′´’']/g,"@")
  .replace(/@@/g,"~")
  .replace(/,/g,".");
 const out=[],re=/(-?\d+(?:\.\d+)?)\s*([#@~]?)/g; let x;
 while((x=re.exec(u))!==null)out.push([parseFloat(x[1]),x[2]]);
 return out;}
function partes(N){
 let d=null,m=null,g=null;
 for(const q of N){if(q[1]=="#"&&d==null)d=q[0];
  else if(q[1]=="@"&&m==null)m=q[0]; else if(q[1]=="~"&&g==null)g=q[0];}
 if(N.length==1&&!N[0][1])m=N[0][0];
 else for(const q of N){if(q[1])continue;
  if(d==null)d=q[0]; else if(m==null)m=q[0]; else if(g==null)g=q[0];}
 return {d:d,m:m,g:g};}

  return {mal:2,m:"You wrote "+P.d+"&deg;. On this chart the "+
   (s.coord==45?"latitude":"longitude")+" is "+s.coord+"&deg; &mdash; "+
   "it is the minutes that change."};
 return {v:P.m+(P.g||0)/60};}
