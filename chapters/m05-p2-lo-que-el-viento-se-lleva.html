"use strict";
const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

2.0 M", 1], [1868.7, 2203.0, 2949.7, 3005.8, 125.0, "125 · 2.0 M", 1]], "estima": [[3146.4, 1778.0, 300.0, "DR 1519 · log 49.9", 1], [1868.7, 2203.0, 250.0, "DR 1543 · log 51.9", -1], [2949.7, 3005.8, 125.0, "DR 1607 · log 53.9", 1]], "p": ["<b>How much depends on four things, and none of them is on the chart:</b> the boat, the wind, the sea and the rig. <b>The same boat makes 3° in a light breeze and 10° with a fresh wind and a sea running.</b>", "<b>You look astern.</b> The wake does not leave the stern in line with the keel: it leaves it <b>open</b>, off to one side, and <b>the angle between the wake and the fore-and-aft line of the boat is your leeway</b>. With a sea running and a fresh breeze you can see it plainly. In light airs you can barely make it out, and you put it down as two or three degrees and get on with it.", "<b>The wind you can measure.</b> An anemometer and a wind vane read it for you, and any boat with electronics has them. <b>The leeway you cannot.</b> No instrument tells you how many degrees <i>your</i> boat is making with that wind and that sea: that is the skipper's judgement, off the wake, which is why two skippers on the same boat on the same day will give you two different numbers — and why <b>nobody can print it on a chart or build it into a course</b>.", "<b>Neither of them is on the chart</b> — the wind is of the day, and the leeway is of your boat — <b>which is why, in this part, both are given to you in the question</b>, with where they came from, the same way the set and the drift were. <i>A chart can carry a tidal diamond. It cannot carry your boat.</i>"]}, {"id": "1.E1", "h": "Ten degrees, drawn", "v": [3798, 2219, 2100], "t": "desvio", "fix": [[4580.0, 2660.0, "1449 · log 47.4", 1]], "aban": [4580.0, 2660.0, 300.0, [1, 2, 2.5], -1], "p": ["The first leg of that afternoon, out of the <b>1449</b> fix: <b>300</b>, 2.5 M through the water. <b>Now put a wind in it</b> — from <b>030</b>, on the starboard bow, all afternoon.", "<b>The dashed line is her heading: 300 true.</b> The other one is where she actually goes. <b>Move the slider and open the angle</b>, and read what it costs at one mile, at two, and at the end of the leg.", "<b>At ten degrees, 2.5 miles puts you 807 m from the end of the dashed line</b> — and not a metre of it shows on the log. A GPS would show you where she is; it would not tell you that the wind put her there.", "<i>And a number worth keeping, because it is the same one: <b>five degrees over five miles is 808 m</b>. Half the angle for twice the distance sets you the same distance aside.</i>"]}, {"id": "1.P1", "h": "Which side does she go?", "v": [3224, 2392, 3300], "t": "choice", "o": [{"t": "to port", "ok": false, "next": false, "m": "<b>That is to windward.</b> The wind is coming from <b>105</b> and pushing towards <b>285</b>; you have put her on the side the wind is coming from. <i>Leeway is always to leeward — that is the whole of the rule, and it is in the name.</i>"}, {"t": "to starboard", "ok": true, "m": "<b>Leeward, always.</b> The wind comes from <b>105</b>, so it pushes towards <b>285</b> — and from <b>250</b> that is <b>to starboard</b>. <i>You never have to remember a rule for this. You only have to remember which way the wind is going, and the boat goes with it.</i>"}], "fix": [[4580.0, 2660.0, "1449 · log 47.4", 1]], "derrota": [[4580.0, 2660.0, 3146.4, 1778.0, 300.0, "300 · 2.5 M", 1], [3146.4, 1778.0, 1868.7, 2203.0, 250.0, "250 · 2.0 M", 1], [1868.7, 2203.0, 2949.7, 3005.8, 125.0, "125 · 2.0 M", 1]], "estima": [[3146.4, 1778.0, 300.0, "DR 1519 · log 49.9", 1], [1868.7, 2203.0, 250.0, "DR 1543 · log 51.9", -1], [2949.7, 3005.8, 125.0, "DR 1607 · log 53.9", 1]], "caso": {"rumbo": 250.0, "viento": 105, "signo": 1, "bien": "to starboard", "mal": "to port"}, "p": ["Steering <b>250</b>, wind from <b>105</b>. <b>Which way does the leeway take her?</b>"], "hizo": "worked out which way the leeway takes her"}]}, {"t": "Where it goes in the sum", "s": [{"id": "2.S1", "h": "It changes the course, never the distance", "v": [3224, 2392, 3300], "fix": [[4580.0, 2660.0, "1449 · log 47.4", 1]], "derrota": [[4580.0, 2660.0, 3146.4, 1778.0, 300.0, "300 · 2.5 M", 1], [3146.4, 1778.0, 1868.7, 2203.0, 250.0, "250 · 2.0 M", 1], [1868.7, 2203.0, 2949.7, 3005.8, 125.0, "125 · 2.0 M", 1]], "estima": [[3146.4, 1778.0, 300.0, "DR 1519 · log 49.9", 1], [1868.7, 2203.0, 250.0, "DR 1543 · log 51.9", -1], [2949.7, 3005.8, 125.0, "DR 1607 · log 53.9", 1]], "p": ["<b>The log has measured the miles it has measured.</b> The wind does not change how many; it changes <b>where they pointed</b>. So leeway is applied to the course and the distance stays exactly as it was — the same two and a half miles, laid off on a different line.", "<b>And here is the order, which matters more than it looks.</b> Heading → leeway → <b>water track</b> → tidal stream → <b>EP</b>.", "<b>The reason is physical, not conventional.</b> Leeway is what the boat does <b>inside</b> the water — the hull crabbing sideways through water that, for this purpose, is standing still. That is why what comes out of it is a <b>water track</b>, and why that track already has the leeway in it. <b>The stream then moves that whole body of water</b>, boat and all, which is why it goes last: it is applied to something that is already a path through the water. <i>Do it the other way round and you move the water first, and then slide the boat across nothing.</i>", "<b>And here is the honest part, because a rule you cannot check is a rule you will misremember.</b> On a single half-hour leg, doing it in the wrong order costs you about <b>161 metres</b> — a quarter of the <b>646 m</b> that not turning the course at all costs over two miles. <b>On one leg you could get the order wrong and hardly see it.</b>", "<b>So the order does not matter for the metres. It matters for what it means</b> — and there is a number behind that too. Applying the leeway last <b>swings the tidal vector as well</b>, and that error grows with the stream and with the hours: <b>161 m over half an hour of stream, 646 m over two hours, 968 m over three.</b> <i>On a leg you cannot see it. On a passage you cannot miss it.</i>", "<b>And the same goes for the other half of the rule.</b> Putting the leeway into the distance instead of the course moves you <b>56 m over two miles</b>. Not turning the course moves you <b>646 m</b>. <i>The rule is not «don't put it in the distance» because that will wreck you — it is that the place where it actually counts is the other one.</i>"]}, {"id": "2.E1", "h": "One leg, with a wind in it", "v": [3793, 2219, 2100], "fix": [[4580.0, 2660.0, "1449 · log 47.4", 1]], "derrota": [[4580.0, 2660.0, 3146.4, 1778.0, 300.0, "300 · 2.5 M", 1]], "agua": [[4580.0, 2660.0, 3015.007117327541, 2040.374824594964, 290.0, "290 · 2.5 M", 1]], "estima": [[3146.4, 1778.0, 300.0, "DR 1519 · log 49.9", 1]], "vector": [[3015.007117327541, 2040.374824594964, 3005.607494338341, 2376.882135540964, "180 · 1.0 kn · 30 min", 1]], "ep": [[3005.607494338341, 2376.882135540964, "EP 1519", 1]], "pasos": [{"ver": ["fix", "estima", "derrota"], "t": "<b>The first leg of that afternoon, again.</b> Out of the <b>1449</b> fix on <b>300</b>, 2.5 M through the water, and the mark at the far end is <b>DR 1519</b>. <b>Nothing here gets redrawn.</b> What changes is that this time there is a wind in it: from <b>030</b>, and you are making <b>10°</b> of leeway."}, {"ver": ["fix", "estima", "derrota", "agua"], "t": "<b>The water track: 290, and the same 2.5 M.</b> The wind is from 030, so it pushes towards 210 — to port of your heading — and she crabs that way the whole leg. <b>The track has turned; the heading and the distance have not.</b> The two marks are <b>807 m</b> apart, and none of that is on the log — a GPS would show you where she is, not how much of it was the wind.", "calc": "300 &nbsp;&minus;&nbsp; 10&deg; &nbsp;=&nbsp; 290 &nbsp;&middot;&nbsp; 2.5 M unchanged &nbsp;&middot;&nbsp; 807 m aside"}, {"ver": ["fix", "estima", "derrota", "agua", "vector", "ep"], "t": "<b>And now the stream, on top of that.</b> 180 at 1.0 knots for 30 minutes — the same one the last part gave you — run from the end of the <b>water track</b>, not from the dry mark. <b>That is the EP, and it has both corrections in it.</b><br><br>Look at the shape: <b>the four marks make a parallelogram</b>. One side is the leeway, <b>807 m</b>; the other is the stream, <b>926 m</b>; and the diagonal from the reckoning to the EP is <b>1692 m</b>. <i>The EP you drew in part 1 — same afternoon, same stream, no wind — sits 807 m from this one.</i>"}], "p": []}, {"id": "2.P1", "h": "Lay the water track", "v": [2480, 2098, 1900], "t": "click", "derrota": [[3146.4, 1778.0, 1868.7, 2203.0, 250.0, "250 · 2.0 M", 1]], "estima": [[3146.4, 1778.0, 300.0, "DR 1519 · log 49.9", 1]], "ay": "Click the far end of the water track.", "sep": [1961.905234667899, 2418.4533727134267], "sepMal": [["to windward", 1814.2910553290344, 1974.7082388888641], ["the reckoning with no wind in it", 1868.686810646245, 2203.0380894350615]], "caso": {"viento": 0, "rumbo": 250.0, "abat": 10}, "bien": "<b>240, and the same 2.0 M.</b> The wind from 000 pushes her towards 180, so the water track falls to port of the heading — and the log has measured what it measured. <i>Next comes the stream, and that is the EP.</i>", "p": ["Out of the <b>DR 1519</b> mark on <b>250</b>, 2.0 M through the water. The wind has been steady from <b>000</b> all afternoon and you are making <b>10°</b> of leeway. <b>Click the far end of the water track.</b>"], "nombreBien": "the end of the water track", "hizo": "laid a water track"}]}, {"t": "Both corrections, in order", "s": [{"id": "3.S1", "h": "One leg, three times", "v": [3793, 2219, 2100], "fix": [[4580.0, 2660.0, "1449 · log 47.4", 1]], "derrota": [[4580.0, 2660.0, 3146.4, 1778.0, 300.0, null, "seca"]], "agua": [[4580.0, 2660.0, 3015.007117327541, 2040.374824594964, 290.0, "290 · water track", 1]], "estima": [[3146.4, 1778.0, 300.0, "DR 1519 · log 49.9", "seca"]], "vector": [[3146.4, 1778.0, 3137.0003770108, 2114.507310946, null, "seca"], [3015.007117327541, 2040.374824594964, 3005.607494338341, 2376.882135540964, null, 1]], "ep": [[3137.0003770108, 2114.507310946, "EP · stream only", "seca"], [3005.607494338341, 2376.882135540964, "EP · both", 1]], "p": ["Here is that first leg <b>three times over</b>. The quiet dashed marks are what you had before: <b>the reckoning</b>, steered and logged, and <b>the EP you drew in part 1</b>, with the stream on it and no wind in it. The solid ones are this part's: <b>the water track</b>, and <b>the EP with both corrections in it</b>.", "<b>And look at the shape they make.</b> The four marks are the corners of a <b>parallelogram</b>, and that is not a coincidence — it is what two corrections always do. <b>One side is the leeway: 807 m.</b> <b>The other is the stream: 926 m.</b> And the diagonal, from the dry reckoning to the EP, is <b>1692 m</b>.", "<b>Which means you can see what each one is worth.</b> On this leg the stream is the bigger of the two, but not by much — and on the next leg, with the wind on the beam and the tide slack, it could be the other way round. <i>You do not get to guess which matters. You draw both.</i>", "<b>And one honest line about the picture.</b> This is one leg, not the afternoon. The whole afternoon is drawn three times already in part 1 — and with <b>both</b> corrections on it, <b>it does not fit in navigable water on this chart</b>. <i>The drawing that would have been prettier would also have been a lie.</i>"]}, {"id": "3.P1", "h": "Run one leg with both", "v": [2541, 2604, 1900], "t": "click", "derrota": [[1868.7, 2203.0, 2949.7369976896744, 3005.849538422516, 125.0, "125 · 2.0 M", 1]], "estima": [[1868.7, 2203.0, 250.0, "DR 1543 · log 51.9", 1]], "ay": "Click the EP on the chart.", "sep": [3213.8421501197527, 2576.553090626365], "sepMal": [["the stream only", 3090.852171903789, 2776.470283747456], ["the reckoning, with neither", 2949.7369976896744, 3005.849538422516]], "caso": {"viento": 210, "rumbo": 125.0, "abat": 10, "set": 30}, "bien": "<b>That is both of them, in order.</b> <b>115</b> for 2.0 M through the water, then <b>0.40 of a mile of stream on 030</b> from the far end of it. <i>The dry mark is 1386 m away, and the EP you would have drawn last week — stream only, no wind — is 646.</i>", "p": ["The last leg of that afternoon, taken on its own: out of the <b>1543</b> mark on <b>125</b>, 2.0 M through the water, ending at <b>DR 1607</b>. The wind has been from <b>210</b> all afternoon and you are making <b>10°</b> of leeway. The atlas gives <b>030 at 1.0 knots</b> for the hour, and the leg took <b>24 minutes</b>.", "<b>Put the EP for this leg on the chart.</b> Both corrections, in order.", "<i>And a word about the order. Doing it the wrong way round — stream first, leeway after — would put you <b>129 m</b> from the right answer; leaving the leeway out altogether would put you <b>646 m</b> away. <b>On one leg the order costs little. On a passage it does not</b>, because that error is the tidal vector swung by the leeway angle, and it grows with every hour of stream you add.</i>", "<i>One more thing this leg happens to show. If the wind were from anywhere between 000 and 090 here, the two corrections would pull against each other and the EP would land <b>154 m</b> from the dry mark — where, with the wind from <b>210</b>, it lands <b>1386 m</b> away. <b>That is not a reason to skip either of them.</b> It is that you cannot know they cancel until you have drawn them both.</i>"], "pista": "Leeway first, on the course. Then the stream, from the far end of the water track.", "nombreBien": "the EP with both corrections in it", "hizo": "plotted an EP with both corrections in it"}, {"id": "3.C1", "h": "What you can do now, and the question that turns round", "v": [3224, 2392, 3300], "fix": [[4580.0, 2660.0, "1449 · log 47.4", 1]], "derrota": [[4580.0, 2660.0, 3146.4, 1778.0, 300.0, "300 · 2.5 M", 1], [3146.4, 1778.0, 1868.7, 2203.0, 250.0, "250 · 2.0 M", 1], [1868.7, 2203.0, 2949.7, 3005.8, 125.0, "125 · 2.0 M", 1]], "estima": [[3146.4, 1778.0, 300.0, "DR 1519 · log 49.9", 1], [1868.7, 2203.0, 250.0, "DR 1543 · log 51.9", -1], [2949.7, 3005.8, 125.0, "DR 1607 · log 53.9", 1]], "p": ["<b>What you can do now, that you could not at the start of this part.</b> Read a wind and a leeway and know <b>which side she goes</b> — leeward, always. Apply it <b>to the course and not to the distance</b>, and lay the <b>water track</b>: the same miles, on a different line. And put the stream on the end of that, in that order, to finish at an <b>EP with both corrections in it</b>.", "<b>And one honest thing, the same one part 1 ended with.</b> Every wind and every leeway in this part was handed to you in the words of the question. <b>On board, the wind is measured</b>: the anemometer and the wind vane give it to you. <b>The leeway is not</b>: no instrument measures it. It is your own judgement of your own boat, off the wake, and two skippers will give you two numbers.", "<b>The two corrections are done. Both of the things that move the mark have been taught, and the estimated position is finished.</b>", "<b>And now the whole question turns round.</b> These two parts asked <i>where has the water taken me</i>. The one that matters when you are actually going somewhere is the other way up: <b>what course do I steer so that the wind and the water land me where I want to be?</b> That is <b>part 3</b>, and it is the same three vectors read backwards. <b>It is named here and it is not taught here</b> — the same way part 1 ended by naming this one."]}]}];
