<script>

"use strict";
const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}
 return {v:VISTO_V, empezadas:{}, terminadas:{}};
}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];
 return _vistoGuarda(o);
}

let RND = 1;

window.azarSemilla = n => {
 RND = (n >>> 0) || 1;
 for(let k = 0; k < 8; k++) azar();
};
function azar(){
 RND ^= RND << 13; RND >>>= 0;
 RND ^= RND >>> 17;
 RND ^= RND << 5;  RND >>>= 0;
 return RND / 4294967296;
}
function baraja(a){
 const b = a.slice();
 for(let i = b.length - 1; i > 0; i--){
  const j = Math.floor(azar() * (i + 1));
  const t = b[i]; b[i] = b[j]; b[j] = t;
 }
 return b;
}
azarSemilla(Date.now());

function bolsaNueva(){ return {i:[], ultima:null}; }
function saca(bolsa, banco){

 if(bolsa.n!==banco.length){ bolsa.i=[]; bolsa.n=banco.length; }
 if(!bolsa.i.length){
  bolsa.i = baraja(banco.map((x, k) => k));
  if(bolsa.i.length > 1 && banco[bolsa.i[bolsa.i.length - 1]].id === bolsa.ultima){
   const t = bolsa.i[bolsa.i.length - 1];
   bolsa.i[bolsa.i.length - 1] = bolsa.i[0]; bolsa.i[0] = t;
  }
 }
 const x = banco[bolsa.i.pop()];
 bolsa.ultima = x.id;

her keel hangs below the surface, and it does not change with the tide, the port or the day. Take it off and <b>1.4 m</b> is left between her keel and the ground.", "<b>And now the new one.</b> You have <b>1.4 m</b> under her — and you do not want to use all of it. Swell lifts and drops her, the chart is a survey and not a promise, and the barometer can hold the water down. So you decide to keep <b>0.5 m</b> in hand. That is your <b>safety margin</b>, drawn here in ochre because <em>it is the one figure on this picture that you put there</em>.", "What is left after that is the answer: <b>0.9 m</b>. It is not how much water there is, and it is not how much is under her keel — it is how much is left <b>after</b> you have kept back what you decided to keep. And it is the figure you would say out loud: <em>“we have 0.9 m to spare.”</em>", "<b>The safety margin is never the answer.</b> A question whose answer is a judgement is not a question, and no examiner will ask you how much you should leave — there is no number that is right. What is marked is <b>the sum with your figure in it</b>. Leave 0.3 m or leave 1.2 m, but know what is left when you have."], "cierre": "Now try moving the one figure that is yours."}, {"id": "1.J1", "t": "Under the keel · topic 1", "h": "What your safety margin costs you", "obra": "juego", "p": ["A different place, and the one that matters: <b>the bar</b>, the shallowest way in. The chart gives it <b>0.5 m</b> and <i>Kittiwake</i> draws <b>1.8 m</b> — she cannot even float across it without the tide, never mind clear it.", "The bar along the bottom is the <b>window</b>: the hours of this day when there is enough water to go. The only thing you can move is the one figure that is yours — and every tenth of a metre you keep in hand has to come out of the tide.", "<b>And it is not a flat price.</b> The first tenth costs you about <b>thirteen minutes</b> of window. Through the middle it settles to about <b>seven</b>. And once the window is down to three hours it is back over <b>ten</b> and climbing.", "That shape is the rule of twelfths again, seen from the other side. A tenth is dear when the edge of your window sits <b>near a turn</b> — low water at the start, high water at the end — because there the tide is barely moving and it takes a long time to find another tenth. It is cheap at <b>half tide</b>, where the water is running hardest. <em>The same decision costs you three times as much at one end of the day as it does in the middle.</em>", "<em>Nothing here is scored, and there is no right answer to find.</em> The point is to know what you are buying. Push it far enough and there is no window left at all — but notice how far that is. With this much tide, what your safety margin really costs you is <b>hours</b>, not the passage."]}, {"id": "1.P1", "t": "Under the keel · topic 1", "h": "How much is left under her", "obra": "practica", "forma": "metros", "banco": "paso", "q": "At <b>__SITIO__</b> the chart shows a sounding of <b>__SONDA__ m</b>, and the height of tide is <b>__MAREA__ m</b>. <i>Kittiwake</i> draws <b>__CALADO__ m</b>, and you have decided to keep <b>__RESGUARDO__ m</b> under her keel. <b>How much is left?</b>", "pista": "Add what is there, then take off what uses it. Sounding <b>+</b> tide <b>−</b> draught <b>−</b> safety margin. And if it comes out <b>negative</b>, say so — that is an answer too.", "cierre": "That is the sum this whole block is built on. Next: what your echo sounder reads, which is <em>none</em> of the four figures you just used."}, {"id": "2.S1", "t": "The echo sounder · topic 2", "h": "The same water, three different numbers", "obra": "enmarca2", "p": ["Everything so far came off paper: a sounding printed on a chart, a height of tide out of an almanac. Both are <b>predictions</b>. The echo sounder is the only thing aboard that tells you about the water you are actually in, right now.", "It is also the only instrument aboard that will cheerfully tell you <b>three different things about the same piece of water</b> — and all three of them are right. Here they are: <b>4.5</b>, <b>3.8</b> and <b>2.7</b> metres, over the same seabed, at the same moment.", "The reason is the <b>transducer</b> — the ochre mark on her hull. It is a thing bolted through the bottom of the boat, and it measures from <b>itself</b>. It is not at the surface, it is not at the keel, and nobody who fitted it asked you.", "So the number on the display depends on <b>what the set has been told to add or take off</b>, and that is a setting somebody chose once, years ago, possibly not you. <em>On this boat the three answers are 1.8 m apart — which is her whole draught, and more than anyone leaves as a safety margin.</em>", "The block on definitions promised you this one. It said there was a fourth thing that was <em>none</em> of the three distances, and that it belonged to the block on what is under the keel. This is that block, and this is that thing."]}, {"id": "2.E1", "t": "The echo sounder · topic 2", "h": "Where the zero is, and who put it there", "obra": "ejemplo", "tramos": "t2", "pasos": ["Start with what is true and has no instrument in it: there is <b>4.5 m</b> of water here, surface to seabed. That is the <b>depth of water</b> from block one, and it does not care what anybody has bolted to the hull.", "Now the <b>transducer</b>, in ochre. On <i>Kittiwake</i> it sits <b>0.7 m</b> below the waterline — through the hull, forward of amidships, facing down. Note what that leaves: her keel is another <b>1.1 m</b> below <em>it</em>.", "What it <b>actually measures</b> is the ochre arrow: from itself down to the ground, <b>3.8 m</b>. That is the raw number, and it is worth saying plainly — <em>it is not the depth of water, it is not the sounding, and it is not what is under your keel.</em> It is a distance from a fitting on your hull.", "So the set is given an <b>offset</b>. Tell it the transducer is 0.7 m down and it adds that back: now it shows <b>4.5 m</b>, the depth of water. Tell it instead that the keel is 1.1 m below the transducer and it takes that off: now it shows <b>2.7 m</b>, which is what is under her keel — the answer to topic one, straight off the display.", "<b>Three displays, one piece of water.</b> Which one you are looking at is not something you can tell by looking — the number gives you no clue, because all three are plausible depths. <em>You find out on a day you know: alongside, at a known state of tide, with a lead line or a berth you have measured.</em> Until you have done that, you do not know what your own instrument is telling you."], "cierre": "Now read one you have not seen before."}, {"id": "2.P1", "t": "The echo sounder · topic 2", "h": "What that reading leaves you", "obra": "practica", "forma": "metros", "banco": "eco", "q": "Your echo sounder reads <b>__LECTURA__ m</b>, and it is <b>__COMO__</b>. <i>Kittiwake</i> draws <b>__CALADO__ m</b>, with the transducer <b>__TRANSDUCTOR__ m</b> below the waterline. <b>How much is under her keel?</b>", "pista": "Ask one thing first: <b>where is this set's zero?</b> At the waterline, at the transducer, or at the keel. Everything else is one subtraction, and sometimes it is none.", "cierre": "Three settings, and you can read any of them. Next: working the sum backwards — not <em>how much is there</em> but <em>how much tide do I need</em>."}, {"id": "3.S1", "t": "The tide you need · topic 3", "h": "The same sum, asked the other way round", "obra": "enmarca3", "p": ["Everything so far started with the tide: <em>here is the height, now what is left under her?</em> That is the question you ask when you are already there.", "This is the one you ask <b>before you go</b> — and it is the only one that changes what you do. <em>How much tide does this take?</em> Turn the sum round and it answers itself: what she draws, plus what you keep, over whatever the ground is doing at that spot.", "And look at the spot. <b>the north channel</b> — the chart prints <b>2.0</b> with a line under it, so that ground stands <b>2.0 m above</b> the datum. It is not shallow water; it is dry land for part of the day. The tide has to cover it <em>before</em> she floats at all, and then keep going.", "Stack it up from the ground: <b>2.0 m</b> of drying height, <b>1.8 m</b> of draught, the <b>1.0 m</b> safety margin you decided to keep. The water has to stand at <b>4.8 m</b> above chart datum. Not roughly — that figure, because you chose the safety margin that put it there.", "<em>And that is a height of tide</em> — the kind of figure the almanac page and the tidal curve print. You have just built the number you go and look up. The page tells you whether today has it, and between what times."]}, {"id": "3.E1", "t": "The tide you need · topic 3", "h": "Built from the ground up", "obra": "ejemplo", "tramos": "t3", "pasos": ["Start at the bottom, with the only thing here that never moves: <b>the ground</b>. At the north channel it stands <b>2.0 m above</b> chart datum — the chart prints the figure underlined, which is how you know which side of the line it is on. Everything else gets stacked on top of this.", "<b>What you decide to keep</b>, first, and not last. It goes straight on the ground because that is what it means: <b>1.0 m</b> of water you are not willing to use. Put it at the bottom and it stops being an afterthought.", "Then <b>her draught</b>, <b>1.8 m</b>, standing on top of your safety margin. Now the stack is what she needs: ground, plus what you keep, plus what she draws.", "So the surface has to reach <b>4.8 m above chart datum</b>. That is the answer, and notice what it is <em>not</em>: it is not a time, it is not a depth, and it does not mention today. It is a <b>height of tide</b> — the same kind of figure the almanac prints, which is exactly why you can go and look it up.", "<b>And now the day gets a vote.</b> High water here today is <b>6.2 m</b>, so there is enough — the curve will tell you between what times, and that is block two's job. <em>But it is not always yes.</em> On a neap day high water can be under six metres, and then a spot that needs more than that is not on at any hour. The sum never changes; the answer to <em>“can I go?”</em> changes every day."], "cierre": "Now work out a few, and check whether the day gives them to you."}, {"id": "3.P1", "t": "The tide you need · topic 3", "h": "How much tide does it take", "obra": "practica", "forma": "metros", "banco": "precisa", "q": "At <b>__SITIO__</b> the chart prints <b>__CIFRA__</b>, <b>__COMOSALE__</b>. <i>Kittiwake</i> draws <b>__CALADO__ m</b> and you want to keep <b>__RESGUARDO__ m</b> under her. <b>How much height of tide does it take?</b>", "pista": "Look at the underline first. <b>Underlined</b> means the ground is <em>above</em> the datum and the tide has to cover it — so it <b>adds</b>. <b>No underline</b> means there is water there already, and it <b>counts towards</b> what she needs.", "cierre": "That is the figure you take to the almanac page. Next: the other direction — what the tide takes <em>away</em> when there is something over your head."}, {"id": "4.S1", "t": "Overhead · topic 4", "h": "The one where the tide is not your friend", "obra": "enmarca4", "p": ["Three topics of this block have gone the same way: the tide rises, there is more water, you have more room. It is so consistent that you stop noticing it.", "<b>Now look up.</b> Same boat, same harbour, same rising tide — and every metre it comes up lifts her masthead a metre <em>closer</em> to the bridge. The bridge does not move. <em>This is the only sum in the module that runs the other way.</em>", "And the figure the chart gives you is measured from a line you have not used since block one. The clearance printed here is <b>14.0 m</b>, and it hangs from <b>HAT</b> — the highest tide there is — not from the datum. That is deliberate: it is the room there is on the <em>worst</em> day, so it is the number you can trust without checking anything.", "Which means that on almost every real day there is <b>more</b> room than the chart promises — HAT is 9.2 m and today the tide is only 7.0 m, so the sea has given you 2.2 m back. <i>Kittiwake</i> needs <b>15.6 m</b> of it for her mast.", "<em>The block on definitions showed you this bridge and let you watch the gap close, and said the sum was for the next block.</em> This is the next block."]}, {"id": "4.E1", "t": "Overhead · topic 4", "h": "Charted from the worst day of the year", "obra": "ejemplo", "tramos": "t4", "pasos": ["Chart datum at the bottom, where it always is — and up at the top, <b>HAT</b>, <b>9.2 m</b> above it. That is the highest the tide is ever predicted to reach here. Nothing is hanging from it yet.", "Now the bridge, and its <b>charted clearance</b> — the figure the chart prints: <b>14.0 m</b>, measured <b>down from HAT</b> to the underside. Not from the water, not from the datum. <em>It is the air there is on the day the tide is highest</em> — the worst day there will ever be for getting under it.", "So put the tide down where it is at low water and look what happens. The underside has not moved — bridges do not — but she has dropped away from it, and now there is far more room than the chart promised. <em>The charted figure is a floor, not a forecast.</em>", "<b>And now let it flood.</b> Every metre of tide is a metre off the gap. That is the whole of this topic, and it is the opposite of the last three: down there the tide was giving you water, up here it is taking room away. Same tide, same day, opposite sign.", "So the sum, in the order you would say it out loud: the charted <b>14.0</b>, plus <b>9.2</b> of HAT to get it measured from the datum, minus <b>7.0</b> of tide today, minus her <b>15.6 m</b> of mast. <b>0.6 m</b> over her masthead. And if that came out negative you would wait for the tide to <em>fall</em> — which is a sentence you will not say anywhere else in this block."], "cierre": "Now move the water yourself and watch the figure."}, {"id": "4.J1", "t": "Overhead · topic 4", "h": "Watch the figure, not the gap", "obra": "juego4", "p": ["You have done this before — the same bridge, the same drag — in the block on definitions. There you watched the gap open and close. <b>This time watch the numbers.</b>", "<b>Drag the water up and down.</b> Four figures on the right, and only one of them stays still: her air draught. The tide changes, the air over the water changes with it, and what is left over her masthead changes by exactly the same amount and in the opposite direction.", "Find the height of tide where it comes out at <b>zero</b>. That is the moment her masthead touches the underside, and everything above it is a day you do not go. <em>Notice that it is a fairly ordinary height of tide</em> — this is not a freak-conditions problem.", "<em>Nothing here is scored.</em> The point is that the relation is one metre for one metre, in the direction nobody expects."]}, {"id": "4.P1", "t": "Overhead · topic 4", "h": "How much is left over her masthead", "obra": "practica", "forma": "metros", "banco": "aire", "q": "<b>__CRUCE__</b> is charted at <b>__CGALIBO__ m</b> clearance. HAT here is <b>__CHAT__ m</b> and the height of tide is <b>__MAREA__ m</b>. <i>Kittiwake</i> has an air draught of <b>__CPALO__ m</b>. <b>How much is left over her masthead?</b>", "pista": "The charted figure hangs from <b>HAT</b>, so add HAT to get it measured from the datum. Then <b>take the tide off</b> — up here the tide costs you room, it does not give it. And then her mast.", "cierre": "That is the block. You can work out what is under her keel, what tide it takes to get there, and what is left over her masthead — and which way each one moves when the tide does."}, {"id": "5.C1", "t": "Under the keel · the whole of it", "h": "One tide, two answers", "obra": "cierre", "p": ["Here is the whole block in one picture: <i>Kittiwake</i> at <b>the footbridge at the head</b>, with ground that dries <b>0.8 m</b> under her and a bridge <b>10.5 m</b> over her head. <b>Drag the water.</b>", "<b>The two figures move in opposite directions</b>, by exactly the same amount, at exactly the same moment. Every metre of flood is a metre more under her keel and a metre less over her masthead. There is no state of tide that is best for both, and that is the whole problem of getting a mast up a shallow creek.", "Find the band where <em>both</em> are positive. Here it runs from <b>3.1 m</b> of tide — below that her keel is in the mud — to <b>4.1 m</b>, above which her masthead is in the footbridge. <b>1.0 metre wide</b>, out of a range that runs from nothing to over nine. On a big spring day the water goes straight past it.", "<b>What you can do now.</b> Work out what is under her keel from a chart figure and a height of tide, with whatever safety margin you decide to keep. Read an echo sounder without believing it. Turn the sum round and get the tide you need, so you can go and look up when there is enough. And work out what is left over her masthead — and remember that up there the tide is working against you.", "<em>What comes next is the water moving sideways:</em> tidal streams, which is the last piece of this module — and the one that turns a tide table into a passage."]}];

function ventanaDe(q,resg){
 const pide=q.calado+resg-q.sonda;
 if(pide<=q.lw)return {de:0, a:24, ancho:24, pide:pide, siempre:true};
 if(pide>=q.hw)return {de:null, a:null, ancho:0, pide:pide, nunca:true};
 const f=(pide-q.lw)/(q.hw-q.lw);

 const out=[];
 for(const par of [[-CURVA_ALA,0],[0,CURVA_ALA]]){
  let a=par[0], b=par[1];
  let fa=factorDia(q,a)-f, fb=factorDia(q,b)-f;

  if(fa*fb>0){
   if(fa>0)return {de:0, a:24, ancho:24, pide:pide, siempre:true};
   return {de:null, a:null, ancho:0, pide:pide, nunca:true};}
  for(let k=0;k<50;k++){
   const m=(a+b)/2, fm=factorDia(q,m)-f;
   if(fa*fm<=0){b=m; fb=fm;} else {a=m; fa=fm;}}
  out.push((a+b)/2);}
 const de=q.hwH+out[0], a=q.hwH+out[1];
 return {de:Math.max(0,de), a:Math.min(24,a), pide:pide,
         ancho:Math.min(24,a)-Math.max(0,de)};}

const CURVA_VIVAS=[-0.022, -0.019, -0.007, 0.015, 0.046, 0.085, 0.13, 0.182, 0.238, 0.297, 0.359, 0.421, 0.482, 0.542, 0.6, 0.656, 0.709, 0.758, 0.804, 0.846, 0.883, 0.917, 0.945, 0.969, 0.986, 0.996, 1, 0.996, 0.985, 0.965, 0.939, 0.904, 0.863, 0.816, 0.763, 0.706, 0.646, 0.584, 0.52, 0.457, 0.394, 0.333, 0.275, 0.221, 0.171, 0.128, 0.09, 0.061, 0.039, 0.026, 0.023, 0.028, 0.043], CURVA_MUERTAS=[-0.055, -0.043, -0.02, 0.013, 0.057, 0.111, 0.173, 0.241, 0.313, 0.387, 0.462, 0.534, 0.602, 0.665, 0.721, 0.771, 0.815, 0.852, 0.883, 0.91, 0.932, 0.952, 0.968, 0.981, 0.991, 0.998, 1, 0.997, 0.989, 0.974, 0.952, 0.924, 0.888, 0.846, 0.798, 0.745, 0.688, 0.628, 0.567, 0.505, 0.444, 0.384, 0.327, 0.273, 0.222, 0.177, 0.137, 0.104, 0.079, 0.063, 0.057, 0.061, 0.075];

function factorDia(q,h){
 const x=(Math.max(-CURVA_ALA,Math.min(CURVA_ALA,h))+CURVA_ALA)/CURVA_PASO;
 const i=Math.floor(x), u=x-i, p=curvaDe(q);

function escenaPaso(q,resg,e){
 e=e||{};
 MAREA=q.marea;
 corte({linea:1, sonda:q.sonda, seca:false, barco:false,
   ceroDerecha:true,
   titulo:e.titulo||"one moment \u00b7 " + q.sitio});
 const x0=HOJA.x0+px(2), an=(HOJA.x1-px(2))-x0;
 const fx=0.38;
 const zLecho=zPerfil(fx,q.sonda,0);
 if(e.barco)barco(x0+an*fx, zLecho, q.calado, MAREA, {nombre:BARCO.nombre});
 let r=null;
 if(e.resg)r=cotaResguardo(x0+an*fx, zLecho, q.calado, resg,
   {resalta:e.quien});

 if(e.sobra&&r){
  const sobra=(r.z)-zLecho;
  const yy=(zY(r.z)+zY(zLecho))/2;

  pildora(x0+an*fx-px(30),yy,
   (sobra>=0?"+":"")+sobra.toFixed(1)+" m to spare",
   sobra>=0?COL.verde:COL.rojo,"end");}
 return r;}

function tresLecturas(q,y,cual){
 const prof=q.profundidad, bajoT=prof-q.transductor;
 const V=[["waterline",prof],["transducer",bajoT],
          ["keel",prof-q.calado]];

 const hueco=px(14);
 const cabe=(HOJA.x1-HOJA.x0)-px(40);
 const anC=Math.min(px(124),(cabe-(V.length-1)*hueco)/V.length);
 const total=V.length*anC+(V.length-1)*hueco;
 const x0=(HOJA.x0+HOJA.x1)/2-total/2;
 for(let i=0;i<V.length;i++){
  if(cual!==undefined&&cual!==i)continue;
  pantallaEco(x0+i*(anC+hueco), y, Math.round(V[i][1]*10)/10, V[i][0], {ancho:anC});}
 return {x0:x0, total:total, anC:anC,
         valores:V.map(v=>Math.round(v[1]*10)/10)};}

function semillaDe(s){let h=2166136261>>>0;
 for(let i=0;i<s.length;i++){h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0;}
 return h||1;}
function tiradaDe(s){let R=semillaDe(s);
 return ()=>{R^=R<<13; R>>>=0; R^=R>>>17; R^=R<<5; R>>>=0; return R/4294967296;};}

function prLee(){
 const d=document.getElementById("prIn");
 return d ? String(d.value||"").trim() : "";}

const cotaDe=(cifra,seca)=>(seca?-cifra:cifra);

function bajoQuilla(ajuste,lectura,calado,transductor){
 if(ajuste=="waterline")return lectura-calado;
 if(ajuste=="transducer")return lectura-(calado-transductor);
 return lectura;}

const FORMAS={

 metros:{

  eg:"0.0",
  cu:"metres, like <b>0.0</b>",

  norma:v=>{const z=String(v).replace(/\s|m$/gi,"").replace(",",".")
    .replace(/[\u2212\u2013\u2014]/g,"-");
   return /^-?\d{1,2}(\.\d)?$/.test(z)
     ? (Math.round(parseFloat(z)*10)/10).toFixed(1) : null;},
  mal:"<b>Metres, to one decimal</b>, like <b>0.0</b> \u2014 and with a "
      +"<b>minus</b> in front if she does not make it.",

  bien:q=>(Math.round((q.ajuste!==undefined
    ? bajoQuilla(q.ajuste,q.lectura,q.calado,q.transductor)
    : q.pide!==undefined
    ? q.calado+q.resguardo-cotaDe(q.cifra,q.seca)
    : q.galibo!==undefined
    ? q.galibo+q.hat-q.marea-q.palo
    : q.sonda+q.marea-q.calado-q.resguardo)*10)/10).toFixed(1),
  eco:v=>v+" m"}};
const forma=s=>FORMAS[(s&&s.forma)||"metros"];
const prBien=(q,s)=>forma(s||S()).bien(q,s||S());

let PRFB="";
function prFalla(s,html){
 PR2.fallos++;
 let h='<div class="res no">'+html;
 if(PR2.fallos>=2&&s.pista)h+='<div class="pista">'+s.pista+'</div>';

 PR2.n++;
 if(PR2.n>=PR2.meta){ PR2.hecho=true; PR2.esp=false; return true; }
 PR2.esp=true; return false;}

window.compruebo=dado=>{
 if(PR2.esp||PR2.hecho)return;
 const s=S(), q=PR2.q, F=forma(s);
 const v=F.norma(dado!==undefined?dado:prLee());
 if(v===null){ prFalla(s,F.mal); dibuja(); return; }
 if(v!==prBien(q,s)){

  if(q.galibo!==undefined){
   const d=parseFloat(v), bien=parseFloat(prBien(q,s));
   let f="";
   if(Math.abs(d-(q.galibo+q.hat+q.marea-q.palo))<0.06)
    f=" You have <b>added</b> the tide. Everywhere else in this block the tide gave "
     +"you water \u2014 here it takes room away. Every metre it rises lifts her "
     +"masthead a metre closer to the bridge, and the bridge does not move.";
   else if(Math.abs(d-(q.galibo-q.palo))<0.06)
    f=" You have left out <b>HAT</b>. The charted clearance hangs from the highest "
     +"tide of all, not from the datum \u2014 so there is another "+un(q.hat)
     +" m of height under it before the tide of the day is counted at all.";
   else if(Math.abs(d-(q.galibo+q.hat-q.marea))<0.06)
    f=" That is the air over the water. You have not taken off <b>her air draught</b>"
     +" \u2014 the "+un(q.palo)+" m of mast and aerial that has to fit in it.";
   else if(Math.abs(d-q.galibo)<0.06)
    f=" That is the <b>charted clearance</b>, straight off the paper. It is what is "
     +"there on the worst day of the year, over the water and before anything of "
     +"yours is in the way.";
   else if(Math.abs(d+bien)<0.06&&Math.abs(bien)>0.05)
    f=(bien<0
      ? " Right size, wrong way round: there is no "+un(-bien)+" m to spare "
       +"\u2014 she is "+un(-bien)+" m <b>too tall</b>."
      : " Right size, wrong way round: she clears it by "+un(bien)+" m.");
   prFalla(s,"<b>"+forma(s).eco(v,q)+"</b> is not it."+f);
   anota(v,false); dibuja(); return;}

  if(q.pide!==undefined){
   const d=parseFloat(v), bien=parseFloat(prBien(q,s));
   const alReves=q.calado+q.resguardo+cotaDe(q.cifra,q.seca);
   let f="";
   if(Math.abs(d-alReves)<0.06)
    f=(q.seca
      ? " You have taken the drying height <b>off</b>. It is ground standing "
       +un(q.cifra)+" m <b>above</b> the datum \u2014 that is what the underline "
       +"means \u2014 so the tide has to cover it <em>before</em> she floats at all."
      : " You have <b>added</b> the sounding. There is already "+un(q.cifra)
       +" m of water there at datum, so it counts <em>towards</em> what she needs, "
       +"not against it.");
   else if(Math.abs(d-(q.calado-cotaDe(q.cifra,q.seca)))<0.06)
    f=" You have left out the <b>safety margin</b>. Floating is not the test \u2014 you "
     +"decided to keep "+un(q.resguardo)+" m in hand, and that has to come out of "
     +"the tide like everything else.";
   else if(Math.abs(d-(q.resguardo-cotaDe(q.cifra,q.seca)))<0.06)
    f=" You have left out <b>her draught</b>. She sits "+un(q.calado)+" m into the "
     +"water before you leave anything at all.";
   else if(Math.abs(d-q.hw)<0.06)
    f=" That is <b>high water</b> today. It is the figure you compare your answer "
     +"<em>against</em> \u2014 what you want is how much she <b>needs</b>, which does "
     +"not depend on the day at all.";
   prFalla(s,"<b>"+forma(s).eco(v,q)+"</b> is not it."+f);
   anota(v,false); dibuja(); return;}

  if(q.ajuste!==undefined){
   const d=parseFloat(v), bien=parseFloat(prBien(q,s));
   let f="";
   if(Math.abs(d-q.lectura)<0.06)
    f=" That is what the display says. It only <em>is</em> what is under her keel "
     +"when the set is <b>zeroed to the keel</b>, and this one is "
     +(q.ajuste=="waterline"?"zeroed to the <b>waterline</b>"
                            :"reading straight from the <b>transducer</b>")+".";
   else if(q.ajuste=="transducer"&&Math.abs(d-(q.lectura-q.calado))<0.06)
    f=" You have taken off her whole draught, but the transducer is not at the "
     +"waterline \u2014 it is already "+un(q.transductor)+" m down. What is below "
     +"<b>it</b> is only "+un(q.calado-q.transductor)+" m of her.";
   else if(Math.abs(d-(q.lectura-q.transductor))<0.06)
    f=" You have taken off the <b>depth of the transducer</b>. What you need is what "
     +"is under it: "+un(q.calado)+" \u2212 "+un(q.transductor)+" = <b>"
     +un(q.calado-q.transductor)+" m</b> of keel below the thing.";
   else if(Math.abs(d-(q.lectura+(q.lectura-bien)))<0.06&&Math.abs(q.lectura-bien)>0.05)
    f=" Right size, wrong direction: whatever is between the transducer and the keel "
     +"comes <b>off</b> the reading, not on to it. Nothing below her is deeper than "
     +"the water.";
   prFalla(s,"<b>"+forma(s).eco(v,q)+"</b> is not it."+f);
   anota(v,false); dibuja(); return;}

  if(q.sobra!==undefined){
   const d=parseFloat(v), bien=parseFloat(prBien(q,s));
   let f="";
   if(Math.abs(d-(q.sonda+q.marea-q.calado))<0.06)
    f=" That is what is under her keel. You have not taken off the <b>safety margin</b> "
     +"\u2014 the "+un(q.resguardo)+" m you decided to keep in hand, which is the "
     +"whole point of keeping it.";
   else if(Math.abs(d-(q.sonda+q.marea-q.resguardo))<0.06)
    f=" You have taken off the safety margin but not <b>her draught</b>. She sits "
     +un(q.calado)+" m into the water before you leave anything at all.";
   else if(Math.abs(d-(q.sonda+q.marea))<0.06)
    f=" That is the <b>depth of water</b> \u2014 the whole column, from the surface to "
     +"the seabed. She is floating in most of it.";
   else if(Math.abs(d-(q.sonda-q.calado-q.resguardo))<0.06)
    f=" You have left out the <b>tide</b>. The sounding is what is there at chart "
     +"datum; today there is "+un(q.marea)+" m more.";

   else if(Math.abs(d+bien)<0.06&&Math.abs(bien)>0.05)
    f=(bien<0
      ? " You have the size of it right, but the wrong way round: there is <b>no</b> "
       +un(-bien)+" m to spare \u2014 she is "+un(-bien)+" m <b>short</b>."
      : " You have the size of it right, but the wrong way round: she has "+un(bien)
       +" m <b>to spare</b>.");
   prFalla(s,"<b>"+forma(s).eco(v,q)+"</b> is not it."+f);
   anota(v,false); dibuja(); return;}
  if(s.forma=="metros"&&q.rango!==undefined){

   const d=parseFloat(v);
   let f="";
   if(Math.abs(d-q.pleamar)<0.06)
    f=" That is the <b>height of high water</b>, measured from the datum. The range "
     +"is measured <b>between the two turns</b>, not from the datum.";
   else if(Math.abs(d-q.bajamar)<0.06)
    f=" That is the height of low water on its own.";
   else if(Math.abs(d-(q.pleamar+q.bajamar))<0.06)
    f=" You added them. The range is a <b>difference</b>: high water <b>minus</b> "
     +"low water.";
   prFalla(s,"<b>"+forma(s).eco(v,q)+"</b> is not it."+f);
   anota(v,false); dibuja(); return;}
  if(s.forma=="eleccion"&&q.clase!==undefined){

   const dado=CLASES[+v][0];
   const mayor=(dado=="springs")||(q.clase=="neaps"&&dado=="in between");
   let f="";
   if((dado=="springs"&&q.clase=="neaps")||(dado=="neaps"&&q.clase=="springs"))
    f=" You have it the wrong way round. This day's range is <b>"+un(q.rango)
     +" m</b>, and springs are the <b>big</b> ones.";
   else
    f=" Its range is <b>"+un(q.rango)+" m</b>, and the fortnight runs from "
     +un(Math.min.apply(null,DIAS.map(x=>x.rango)))+" to "
     +un(Math.max.apply(null,DIAS.map(x=>x.rango)))+". Most days are in between: "
     +"that is what makes reading the springs column every day so expensive.";
   prFalla(s,"<b>"+CLASES[+v][1].replace(/<[^>]+>/g,"")+"</b> is not it."+f);
   anota(v,false); dibuja(); return;}
  if(s.forma=="metros"){
   const d=parseFloat(v), bien=parseFloat(prBien(q,s));
   let f="";
   if(Math.abs(d-q.cifra)<0.06)
    f=" That is the figure the chart prints, on its own. <b>The tide has to go on "
     +"top of it.</b>";
   else if(Math.abs(d-q.altura)<0.06)
    f=" That is the height of tide, on its own. <b>It is the water over the datum, "
     +"not over the seabed.</b>";
   else if(Math.abs(d-(q.seca?q.altura+q.cifra:q.altura-q.cifra))<0.06)
    f=q.seca
     ? " You added. That figure is <u>underlined</u>: the ground stands <b>above</b> "
      +"the datum, so it comes <b>off</b> the height of tide."
     : " You subtracted. A plain sounding is water below the datum, so the tide "
      +"<b>adds</b> to it.";
   prFalla(s,"<b>"+forma(s).eco(v,q)+"</b> is not it."+f);
   anota(v,false); dibuja(); return;}
  if(s.forma=="eleccion"&&q.deCarta!==undefined){

   const dado=REF4[+v][0], bien=q.n;
   const QUE={
    "hat-arriba":"A vertical clearance is the air over <b>HAT</b> \u2014 the worst "
      +"day of the year, so the chart never promises more than there is.",
    "mhws-arriba":"An elevation \u2014 a light, a hilltop \u2014 is measured from "
      +"<b>MHWS</b>. It is the fourth reference on the chart, and the one nobody "
      +"tells you about.",
    "datum-abajo":"A plain sounding is water, measured <b>down</b> from the datum.",
    "datum-arriba":"An underlined figure is ground, measured <b>up</b> from the "
      +"datum."};
   prFalla(s,"<b>"+REF4[+v][1].replace(/<[^>]+>/g,"")+"</b> is not it. "
     +(QUE[bien]||""));
   anota(v,false); dibuja(); return;}
  if(s.forma=="eleccion"&&q.via!==undefined){

   const dado=N4[+v][0], bien=q.n;
   const alta=x=>x[1]=="H", viva=x=>x[3]=="S";
   let f="";
   if(alta(dado)!==alta(bien))
    f=" That is a <b>"+(alta(dado)?"high":"low")+"</b> water level and the answer "
     +"is a <b>"+(alta(bien)?"high":"low")+"</b> one. The middle letter is the one "
     +"that says which.";
   else
    f=" Right half of the line, wrong pair. <b>"+(viva(dado)?"Springs":"Neaps")
     +"</b> is the "+(viva(dado)?"outer":"inner")+" one, and this is the "
     +(viva(bien)?"outer":"inner")+": <b>"+(viva(bien)?"springs":"neaps")+"</b>.";
   prFalla(s,"<b>"+dado+"</b> is not it."+f);
   anota(v,false); dibuja(); return;}
  if(s.forma=="eleccion"&&q.n!==undefined){
   const el2=opsDe(q)[+v];
   const QUE={height:"A height of tide is measured from the datum <b>up to the "
     +"surface</b>, and it changes through the day.",
    sounding:"A sounding is <b>printed on the paper</b> and does not move.",
    depth:"A depth of water is the <b>whole column</b> over the seabed."};
   const cual=(el2.t.match(/height|sounding|depth/)||[])[0];
   prFalla(s,"<b>"+forma(s).eco(v,q).trim()+"</b> is not it. "+(QUE[cual]||""));
   anota(v,false); dibuja(); return;}
  const o=opsDe(q)[+v];
  let firma="";
  if(/chart datum/.test(o.t))
   firma=q.seca
    ? " An <b>underlined</b> figure is ground that stands <b>above</b> the datum. "
     +"That is the sign that puts boats aground."
    : " A plain sounding is water: the seabed is <b>below</b> the datum, and the "
     +"tide adds to it.";
  else if(/surface/.test(o.t))
   firma=" The surface moves with the tide, so nothing on a chart can be measured "
    +"from it. Everything hangs from the datum.";
  else if(/keel/.test(o.t))
   firma=" What is under your keel depends on your boat. A chart does not know your "
    +"draught.";
  prFalla(s,"<b>"+F.eco(v,q)+"</b> is not it."+firma);
  anota(v,false); dibuja(); return;}
 anota(v,true);
 PRFB="";
 if(!prCuenta())
  PRFB='<div class="res si"><b>'+F.eco(v,q)+'</b> — that is it.</div>';
 dibuja();};

const EST={};
function guardaEst(){const s=S(); if(!s)return;
 EST[s.id]={EJ:{i:EJ.i}, PR2:{q:PR2.q,n:PR2.n,meta:PR2.meta,fallos:PR2.fallos,
  esp:PR2.esp,hecho:PR2.hecho}, PRFB:PRFB, MAREA:MAREA};}

 const e=EST[s.id];
 if(e){ EJ={i:e.EJ.i}; PR2=Object.assign({},e.PR2); PRFB=e.PRFB;

 EJ={i:0}; PRFB="";

let TIRA=false;

const seArrastra=()=>{const s=S();

 if(s&&s.obra=="juego4")return true;

 if(s&&s.obra=="cierre")return true;
 if(!s||s.obra!="ejemplo")return false;
 return !!TRAMO().ensena.tira;};

function aMarea(e){
 const r=svg.getBoundingClientRect(), s=esc();
 const y=(e.clientY-r.top-(r.height-D.H*s)/2)/s;
 const z=(CERO-y)/VESC;
 return Math.max(0, Math.min(NIVELES.HAT, Math.round(z*10)/10));}

function mueveAgua(e){
 MAREA=aMarea(e); pinta(); refrescaLecturas(); }
svg.addEventListener("pointerdown",e=>{ if(!seArrastra())return;
 TIRA=true; e.preventDefault&&e.preventDefault(); mueveAgua(e);});
svg.addEventListener("pointermove",e=>{ if(TIRA&&seArrastra())mueveAgua(e);});
svg.addEventListener("pointerup",()=>{TIRA=false;});
svg.addEventListener("pointercancel",()=>{TIRA=false;});

function pinta(){
 svg.setAttribute("viewBox","0 0 "+D.W+" "+D.H);
 svg.setAttribute("preserveAspectRatio","xMidYMid meet");
 ESC=esc();
 while(svg.firstChild)svg.removeChild(svg.firstChild);
 gO=el("g",{},svg);
 maqueta();
 defs();
 fondoConsola();
 lamina();
 const s=S();

 if(s&&s.obra=="enmarca")enmarca();
 else if(s&&s.obra=="enmarca2")enmarca2();
 else if(s&&s.obra=="enmarca3")enmarca3();
 else if(s&&s.obra=="enmarca4")enmarca4();
 else if(s&&s.obra=="juego4")juego4();
 else if(s&&s.obra=="cierre")cierre();

  ({t2:ejemplo2, t3:ejemplo3, t4:ejemplo4}[s.tramos]||ejemplo)();

function filasLectura(){

 if(VIVO&&VIVO.cierre){
  return [["height of tide",un(VIVO.marea)+" m",0],
   ["over her masthead",(VIVO.arriba>=0?"+":"")+un(VIVO.arriba)+" m",
    VIVO.arriba<0?1:0],
   ["under her keel, after a "+un(VIVO.resg)+" m safety margin",
    (VIVO.abajo>=0?"+":"")+un(VIVO.abajo)+" m",VIVO.abajo<0?1:0]]
   .map(f=>'<dt>'+f[0]+'</dt><dd'+(f[2]?' class="mal"':'')+'>'+f[1]+'</dd>').join("");}
 if(VIVO&&VIVO.aire){
  const s=VIVO.sobra;
  return [["height of tide",un(VIVO.marea)+" m",0],
   ["air she needs",un(VIVO.palo)+" m",0],
   ["air there is",un(VIVO.galibo+VIVO.hat-VIVO.marea)+" m",0],
   ["over her masthead",(s>=0?"+":"")+un(s)+" m",s<0?1:0]]
   .map(f=>'<dt>'+f[0]+'</dt><dd'+(f[2]?' class="mal"':'')+'>'+f[1]+'</dd>').join("");}
 if(!VIVO||!VIVO.lab)return "";
 const sin=!VIVO.ancho;
 const F=[
  ["safety margin",un(VIVO.resg)+" m",0],
  ["tide she needs",un(VIVO.pide)+" m",0],

  ["window today",sin?"none":(VIVO.ancho.toFixed(1)+" h"),sin?1:0],
  ["between",sin?"\u2014":(hhmm(VIVO.de)+" \u2013 "+hhmm(VIVO.a)),sin?1:0]];
 return F.map(f=>
  '<dt>'+f[0]+'</dt><dd'+(f[2]?' class="mal"':'')+'>'+f[1]+'</dd>').join("");}

   if(s.forma=="metros"){

    +'<button class="sec" onclick="atras()">Back</button></div>';}}

 p.innerHTML=h;

 const b=document.getElementById("btV");
 if(b)b.onclick=
  (s.obra=="ejemplo"&&EJ.i<PASOSDE(s).length-1) ? ()=>{ ejSig(); }
  : (s.obra=="practica"&&PR2.esp)          ? ()=>{ prSigue(); }

 prog();}

 if(ENTRADA!==s.id){ ENTRADA=s.id; ponEst();

 pinta();
 const p=pane();

 const faltan=TOT-PZ.length;
 p.innerHTML='<h3>'+(faltan?'End of what is built':'End of the part')+'</h3>'
  +'<h2>'+PZ.length+' of '+TOT+' screens</h2>'
  +(faltan
    ? '<p>This part is <b>'+faltan+' screens short</b> of finished, and there is '
      +'nothing after this one yet.</p>'
    : '<p><b>This part is complete.</b> You can work out what is under her keel, and '
      +'\u2014 more to the point \u2014 whether it is enough.</p>')

  +`<div class="calc"><b>Next: Tidal streams.</b><br> Set and drift. The diamonds on the chart, and the atlas.</div>`
  +'<div class="nav">'
  +'<button class="sec" onclick="atras()">Back</button>'
