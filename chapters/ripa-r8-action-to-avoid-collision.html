function sondaDe(i, j){

}
function sonda(x, y, v){

  const t = el("text", {x: x, y: y, "text-anchor": "middle",
    "pointer-events": "none", "font-size": px(11.5), "font-style": "italic",

const LEY8 = ["(a) Any action taken to avoid collision shall be taken in accordance with the Rules of this Part and shall, if the circumstances of the case admit, be positive, made in ample time and with due regard to the observance of good seamanship.", "(b) Any alteration of course and/or speed to avoid collision shall, if the circumstances of the case admit, be large enough to be readily apparent to another vessel observing visually or by radar; a succession of small alterations of course and/or speed should be avoided.", "(c) If there is sufficient sea room, alteration of course alone may be the most effective action to avoid a close-quarters situation provided that it is made in good time, is substantial and does not result in another close-quarters situation.", "(d) Action taken to avoid collision with another vessel shall be such as to result in passing at a safe distance. The effectiveness of the action shall be carefully checked until the other vessel is finally past and clear.", "(e) If necessary to avoid collision or allow more time to assess the situation, a vessel shall slacken her speed or take all way off by stopping or reversing her means of propulsion.", "(f)", "(i) A vessel which, by any of these rules, is required not to impede the passage or safe passage of another vessel shall, when required by the circumstances of the case, take early action to allow sufficient sea room for the safe passage of the other vessel.", "(ii) A vessel required not to impede the passage or safe passage of another vessel is not relieved of this obligation if approaching the other vessel so as to involve risk of collision and shall, when taking action, have full regard to the action which may be required by the rules of this part.", "(iii) A vessel, the passage of which is not to be impeded remains fully obliged to comply with the rules of this part when the two vessels are approaching one another so as to involve risk of collision."];
const LEY8SUB = [6, 7, 8];
const LEY8CAR = 1922;

const norm    = a => ((a % 360) + 360) % 360;
const diff    = (a,b) => { let d = norm(a) - norm(b); if (d > 180) d -= 360; if (d < -180) d += 360; return d; };
const toRad   = d => d * Math.PI / 180;

const VESSEL = {
  nuc:      {rank:5, label:"not under command",            power:false},
  ram:      {rank:5, label:"restricted in ability to manoeuvre", power:false},
  fishing:  {rank:4, label:"engaged in fishing",           power:false},
  sailing:  {rank:3, label:"under sail",                   power:false},
  power:    {rank:2, label:"power-driven",                 power:true},
  cbd:      {rank:2, label:"constrained by draught",       power:true, noImpede:true},
  pilot:    {rank:2, label:"pilot vessel",                 power:true}
};

const VESSEL_ALIAS = {
  fishingTrawl:"fishing", fishingOther:"fishing",
  pilotUnderway:"pilot", towing:"power", seaplane:"power"
};

const OVERTAKING_ARC = 112.5;

const BEARING_THRESHOLD = 0.5;

const MAY_TCPA   = 12;

const SHALL_TCPA = 4;

function bearingTo(from, to){
  return norm(Math.atan2(to.x - from.x, to.y - from.y) * 180 / Math.PI);
}

function rangeTo(from, to){
  return Math.hypot(to.x - from.x, to.y - from.y);
}

function relativeBearing(own, contact){
  return diff(bearingTo(own, contact), own.heading);
}

function aspect(own, contact){
  return diff(bearingTo(contact, own), contact.heading);
}

function isOvertaking(own, contact){
  if (Math.abs(aspect(own, contact)) <= OVERTAKING_ARC) return false;
  const dt = 1/60;
  return rangeTo(step(own, dt), step(contact, dt)) < rangeTo(own, contact);
}

function tackOf(v){
  if (v.wind === undefined) return null;
  const d = diff(v.wind, v.heading);
  if (Math.abs(d) < 1e-9) return null;
  return d < 0 ? "port" : "starboard";
}

function windwardOf(a, b){

  const w = a.wind;
  if (w === undefined || w === null || !isFinite(w)) return null;
  const pa = a.x * Math.sin(toRad(w)) + a.y * Math.cos(toRad(w));
  const pb = b.x * Math.sin(toRad(w)) + b.y * Math.cos(toRad(w));
  if (Math.abs(pa - pb) < 1e-9) return null;
  return pa > pb ? a : b;
}

function step(v, hours){
  return {...v,
    x: v.x + Math.sin(toRad(v.heading)) * v.speed * hours,
    y: v.y + Math.cos(toRad(v.heading)) * v.speed * hours};
}

function bearingRate(own, contact, dt = 1/60){
  const b0 = bearingTo(own, contact);
  const p1 = step(own, dt), q1 = step(contact, dt);
  return diff(bearingTo(p1, q1), b0) / dt / 60;
}

function cpaTcpa(own, contact){
  const rx = contact.x - own.x, ry = contact.y - own.y;
  const vx = Math.sin(toRad(contact.heading)) * contact.speed - Math.sin(toRad(own.heading)) * own.speed;
  const vy = Math.cos(toRad(contact.heading)) * contact.speed - Math.cos(toRad(own.heading)) * own.speed;
  const vv = vx*vx + vy*vy;
  if (vv < 1e-9) return {cpa: Math.hypot(rx,ry), tcpa: Infinity};
  const tcpa = -(rx*vx + ry*vy) / vv;
  const cx = rx + vx*tcpa, cy = ry + vy*tcpa;
  return {cpa: Math.hypot(cx,cy), tcpa};
}

function riskOfCollision(own, contact){
  const {cpa, tcpa} = cpaTcpa(own, contact);
  const R = rangeTo(own, contact);
  const rate = Math.abs(bearingRate(own, contact));
  const L = (contact.length || 20) / 1852;
  const limit = BEARING_THRESHOLD * (1 + (contact.length||20)/200) * (1 + 1/Math.max(R,0.2));

  const dt = 1/60;
  const approaching = rangeTo(step(own, dt), step(contact, dt)) < R;
  return {
    risk: approaching && tcpa > 0 && (rate < limit || cpa < (L*2 + 0.1)),
    steadyBearing: rate < limit,
    approaching,
    rate, limit, cpa, tcpa
  };
}

function standOnThresholds(own, contact, opts = {}){
  const {tcpa} = cpaTcpa(own, contact);
  const min = tcpa * 60;
  const restricted = opts.narrowWaters ? 0.66 : 1;
  return {
    tcpaMin: min,
    mayAct:   min <= MAY_TCPA   * restricted,
    mustAct:  min <= SHALL_TCPA * restricted,
    mayAtMin:  MAY_TCPA   * restricted,
    mustAtMin: SHALL_TCPA * restricted
  };
}

function headingForCPA(own, contact, wantCPA){
  let best=null;
  for(let hd=0; hd<360; hd+=0.25){
    const c={...contact, heading:hd};
    const {cpa,tcpa} = cpaTcpa(own,c);
    if(tcpa<=0.02) continue;
    const err = Math.abs(cpa - wantCPA);
    if(!best || err < best.err) best={hd, err, cpa, tcpa};
  }
  return best;
}

function category(type){
  const t = VESSEL_ALIAS[type] || type;
  if(!VESSEL[t]) throw new Error("colregs-engine: unknown vessel type \""+type+"\"");
  return VESSEL[t];
}

function project(v, aspect, rangeNm, opts={}){
  const th = aspect * Math.PI / 180;
  const R  = Math.max(rangeNm, 0.05);
  const k  = opts.scale || 1;
  const M  = 1852;
  const LEN  = v.length || 12;
  const beam = LEN * (LEN>=50 ? 0.145 : 0.30);
  return seenFrom(v, aspect, rangeNm).map(l => {
    const foreAft = l.xm !== undefined ? l.xm
                  : l.x * LEN/2;

    const lx = l.kind==="starboard" ?  beam/2
             : l.kind==="port"      ? -beam/2 : 0;
    const across  = foreAft * Math.sin(th) - lx * Math.cos(th);
    return {
      ...l,
      dx: k * (across / (R*M)) * 3437.75,
      dy: k * (l.h / (R*M)) * 3437.75,

      brightness: Math.max(0, Math.min(1, 1.25 - rangeNm / l.nominal)),

      subtends: (LEN / (R*M)) * 3437.75
    };
  });
}

const CANAL_A_LO_LARGO = 45;

const VIA_A_FAVOR = 45;

const CORTO = 20;

function esCorto(v){ return v.length !== undefined && v.length < CORTO; }
function vaALoLargo(v, rumboCanal){
  const d = Math.abs(diff(v.heading, rumboCanal));
  return d <= CANAL_A_LO_LARGO || d >= 180 - CANAL_A_LO_LARGO;
}
function cruza(v, rumboCanal){ return !vaALoLargo(v, rumboCanal); }
function sigueLaVia(v, via){ return Math.abs(diff(v.heading, via)) <= VIA_A_FAVOR; }

function deberesDeNoEstorbar(own, contact, cond){
  const D = [];
  const A = category(own.type), B = category(contact.type);
  const pon = (rule, para, quien, why) => D.push({rule, para, quien, why});

  const canal = cond.canal;
  if (canal && canal.rumbo !== undefined) {
    const dentroA = vaALoLargo(own, canal.rumbo), dentroB = vaALoLargo(contact, canal.rumbo);

    if ((A === VESSEL.sailing || esCorto(own)) && contact.soloEnCanal)
      pon(9, "b", "own", "She can only stay safe inside this channel. You are "
        + (A === VESSEL.sailing ? "under sail" : "under 20 meters")
        + ", so you do not impede her passage — which is not the same as keeping out "
        + "of her way, and it starts much earlier.");
    if ((B === VESSEL.sailing || esCorto(contact)) && own.soloEnCanal)
      pon(9, "b", "contact", "You can only stay safe inside this channel, and she is "
        + (B === VESSEL.sailing ? "under sail" : "under 20 meters")
        + ". She does not impede your passage.");

    if (A === VESSEL.fishing && dentroB)
      pon(9, "c", "own", "You are engaged in fishing and she is navigating within the "
        + "channel. You do not impede her passage, whatever she is.");
    if (B === VESSEL.fishing && dentroA)
      pon(9, "c", "contact", "She is engaged in fishing and you are navigating within "
        + "the channel. She does not impede your passage.");

    if (cruza(own, canal.rumbo) && contact.soloEnCanal)
      pon(9, "d", "own", "You are crossing the channel and she can only stay safe "
        + "inside it. You do not cross if crossing impedes her passage.");
    if (cruza(contact, canal.rumbo) && own.soloEnCanal)
      pon(9, "d", "contact", "She is crossing the channel and you can only stay safe "
        + "inside it. She does not cross if crossing impedes your passage.");
  }

  const disp = cond.dispositivo;
  if (disp && disp.via !== undefined) {
    const sigueA = sigueLaVia(own, disp.via), sigueB = sigueLaVia(contact, disp.via);

    if (A === VESSEL.fishing && sigueB)
      pon(10, "i", "own", "You are engaged in fishing and she is following the traffic "
        + "lane. You do not impede her passage.");
    if (B === VESSEL.fishing && sigueA)
      pon(10, "i", "contact", "She is engaged in fishing and you are following the "
        + "traffic lane. She does not impede your passage.");

    if ((A === VESSEL.sailing || esCorto(own)) && B.power && sigueB)
      pon(10, "j", "own", "She is a power-driven vessel following the traffic lane. "
        + "You are " + (A === VESSEL.sailing ? "under sail" : "under 20 meters")
        + ", so you do not impede her safe passage.");
    if ((B === VESSEL.sailing || esCorto(contact)) && A.power && sigueA)
      pon(10, "j", "contact", "You are a power-driven vessel following the traffic "
        + "lane, and she is " + (B === VESSEL.sailing ? "under sail" : "under 20 meters")
        + ". She does not impede your safe passage.");
  }
  return D;
}
function evaluate(own, contact, cond = {}){
  const vis      = cond.visibility === undefined ? 10 : cond.visibility;
  const R        = rangeTo(own, contact);
  const inSight  = R <= vis;
  const relB     = relativeBearing(own, contact);
  const risk     = riskOfCollision(own, contact);

  const noEstorbar = deberesDeNoEstorbar(own, contact, cond);
  const base     = {relativeBearing: relB, aspect: aspect(own, contact), range: R,
                    inSight, ...risk,
                    ...(noEstorbar.length ? {notImpeding: noEstorbar} : {})};

  if (!inSight) return {...base,
    situation: "restricted-visibility",
    obligation: "both-act",
    rule: 19,
    why: "Neither of you can see the other. There is no give-way vessel and no "
       + "stand-on vessel: "
       + "you both navigate with care, at a speed you can stop in, and neither of you "
       + "has anything to hold.",
    restrictions: ["no turn to port for a contact forward of the beam, unless you are overtaking",
                   "no turn towards a contact abeam or abaft the beam"]};

  if (isOvertaking(own, contact)) return {...base,
    situation: "overtaking", role: "overtaking",
    obligation: "give-way", rule: 13,
    why: "You are coming up on her from behind her beam, so you keep out of the way — "
       + "whatever either of you is. Sail over power does not apply here."};
  if (isOvertaking(contact, own)) return {...base,
    situation: "overtaken", role: "overtaken",
    obligation: "stand-on", rule: 13,
    thresholds: standOnThresholds(own, contact, cond),
    why: "She is overtaking you. You hold your course and speed — until she shows you she is not going to clear you."};

  const A = category(own.type), B = category(contact.type);

  if (B.noImpede && !A.noImpede && A.rank < 5) {
    return {...base, situation: "constrained-by-draught",
      obligation: "do-not-impede", rule: 18,
      why: "She can only stay safe inside the deep water she is in. You do not take her "
         + "water away in the first place — that is a different thing from giving way, "
         + "and it starts much earlier."};
  }

  if (A.rank !== B.rank) {
    const iGiveWay = A.rank < B.rank;
    return {...base,
      situation: "different-types",
      obligation: iGiveWay ? "give-way" : "stand-on",
      rule: 18,
      thresholds: iGiveWay ? null : standOnThresholds(own, contact, cond),
      why: iGiveWay
        ? `She is ${B.label} and you are ${A.label}. You keep out of her way.`
        : `You are ${A.label} and she is ${B.label}. She keeps out of your way.`};
  }

  if (category(own.type) === VESSEL.sailing && category(contact.type) === VESSEL.sailing) {
    const ta = tackOf(own), tb = tackOf(contact);
    if (ta && tb && ta !== tb) {
      const iGiveWay = ta === "port";
      return {...base, situation: "sailing-different-tacks",
        obligation: iGiveWay ? "give-way" : "stand-on", rule: 12,
        thresholds: iGiveWay ? null : standOnThresholds(own, contact, cond),
        why: iGiveWay ? "You have the wind on your port side and she does not. You keep out of the way."
                      : "She has the wind on her port side and you do not. She keeps out of the way."};
    }

    const bar = windwardOf(own, contact);
    if (ta === "port" && contact.amuraIncierta && bar === contact) return {...base,
      situation: "sailing-doubtful-tack", obligation: "give-way", rule: 12,
      why: "You have the wind on your port side, she is to windward, and you cannot "
         + "tell with certainty which tack she is on. You keep out of the way."};
    if (tb === "port" && own.amuraIncierta && bar === own) return {...base,
      situation: "sailing-doubtful-tack", obligation: "stand-on", rule: 12,
      thresholds: standOnThresholds(own, contact, cond),
      why: "She has the wind on her port side, you are to windward, and she cannot "
         + "tell with certainty which tack you are on. She keeps out of the way."};
    const wind = windwardOf(own, contact);

    if (!wind) return {...base,
      situation: "no-allocation", obligation: "both-act", rule: 2,
      why: "Same tack, and which of you is to windward is not established, so Rule 12 "
         + "has nobody to point at. There is no stand-on vessel here: you both act, "
         + "and Rule 2 says you depart from the rules as far as the immediate danger "
         + "requires."};
    const iGiveWay = wind === own;
    return {...base, situation: "sailing-same-tack",
      obligation: iGiveWay ? "give-way" : "stand-on", rule: 12,
      thresholds: iGiveWay ? null : standOnThresholds(own, contact, cond),
      why: iGiveWay ? "Same tack and you are the windward boat. You keep out of the way."
                    : "Same tack and she is to windward. She keeps out of the way."};
  }

  if (!A.power || !B.power) return {...base,
    situation: "no-allocation", obligation: "both-act", rule: 2,
    why: "Neither of you is a power-driven vessel and the rules do not rank you "
       + "against each other, so Rules 15 and 17 have nobody to point at. There is no "
       + "stand-on vessel here: you both act, and Rule 2 says you depart from the "
       + "rules as far as the immediate danger requires."};

  const reciprocal = Math.abs(Math.abs(diff(own.heading, contact.heading)) - 180) < 6;
  const nearlyAhead = Math.abs(relB) < 6;
  if (reciprocal && nearlyAhead) return {...base,
    situation: "head-on", obligation: "both-give-way", rule: 14,
    why: "You are meeting nearly head on. You BOTH alter to starboard, and you both do it early "
       + "and obviously enough that the other can see it."};

  const heOnMyStarboard = relB > 0;

  if (!heOnMyStarboard && !(relativeBearing(contact, own) > 0)) return {...base,
    situation: "no-allocation", obligation: "both-act", rule: 2,
    why: "Neither of you has the other on your own starboard side, so Rule 15 has "
       + "nobody to point at. There is no stand-on vessel here: you both act, and "
       + "Rule 2 says you depart from the rules as far as the immediate danger "
       + "requires."};
  return {...base,
    situation: "crossing",
    obligation: heOnMyStarboard ? "give-way" : "stand-on",
    rule: 15,
    thresholds: heOnMyStarboard ? null : standOnThresholds(own, contact, cond),
    why: heOnMyStarboard
      ? "She is crossing from your starboard side. You keep out of the way — and you do not cross ahead of her."
      : "She is crossing from your port side. She keeps out of the way. You hold, and you watch her to see whether she does."};
}

const TUYO0 = {x: 0, y: 0, heading: 0, speed: 12, type: "power"};
const OTRA0 = {brg: 40, rng: 6, speed: 10};
const CAIDA = {min: 0, max: 40};
const ESPERA = {min: 0, max: 18};
const VENTANA = 6;

const APARENTE = {ruido: 2, claro: 5};
const HOLGURA = {cerca: 0.5, holgado: 1.0};

function norm8(a){ return ((a % 360) + 360) % 360; }
function dif8(a, b){
  let d = norm8(a) - norm8(b);
  if(d > 180) d -= 360;
  if(d < -180) d += 360;
  return d;
}

function rumboDeColision(){
  const p = {x: OTRA0.rng*Math.sin(OTRA0.brg*Math.PI/180),
             y: OTRA0.rng*Math.cos(OTRA0.brg*Math.PI/180)};
  let mejor = 270, mejorCpa = Infinity;
  for(let paso = 0; paso < 3; paso++){
    const salto = [1, 0.1, 0.01][paso];
    const desde = mejor - (paso ? 10*salto : 90), hasta = mejor + (paso ? 10*salto : 90);
    for(let h = desde; h <= hasta; h += salto){
      const q = cpaTcpa(TUYO0, {...p, heading: norm8(h), speed: OTRA0.speed});
      if(q.tcpa > 0 && q.cpa < mejorCpa){ mejorCpa = q.cpa; mejor = norm8(h); }
    }
  }
  return mejor;
}

function otraDe(){
  return {x: OTRA0.rng*Math.sin(OTRA0.brg*Math.PI/180),
          y: OTRA0.rng*Math.cos(OTRA0.brg*Math.PI/180),
          heading: rumboDeColision(), speed: OTRA0.speed, type: "power"};
}

function maniobra(caida, espera){
  const h = espera / 60;
  const antesTu = step(TUYO0, h), antesElla = step(otraDe(), h);
  const tras = {...antesTu, heading: norm8(antesTu.heading + caida)};

  const q = cpaTcpa(tras, antesElla);

  const b0 = bearingTo(antesElla, tras);
  const b1 = bearingTo(step(antesElla, VENTANA/60), step(tras, VENTANA/60));

  const sin = cpaTcpa(antesTu, antesElla);

  return {
    caida: caida, espera: espera,
    cuando: {tuyo: antesTu, otra: antesElla},
    tras: tras,
    rango: rangeTo(tras, antesElla),
    cpa: q.cpa, tcpa: q.tcpa,
    cpaSinTocar: sin.cpa, tcpaSinTocar: sin.tcpa,
    brg: b0, brgLuego: b1,
    giro: Math.abs(dif8(b1, b0)),
    sentido: dif8(b1, b0) >= 0 ? 1 : -1
  };
}

function dilo(m){
  if(m.caida <= 0)
    return {aparente: "You have not altered at all. From her bridge your bearing is "
                    + "not moving, which is exactly what a collision looks like.",
            distancia: "On this heading you do not pass her: you meet her.",
            aviso: null};

  const aparente =
      m.giro < APARENTE.ruido
    ? "From her bridge your bearing has barely moved. Within the width of a compass "
      + "card, nothing has happened: your alteration has not reached her."
    : m.giro < APARENTE.claro
    ? "Her bearing of you has begun to move, but only just. She may see it on a "
      + "careful plot and she may not see it at all."
    : "Her bearing of you has swung right across her compass. From her bridge there "
      + "is no doubt about what you have done.";

  const distancia =
      m.cpa < HOLGURA.cerca
    ? "And you still pass close &mdash; close enough that she has to trust you."
    : m.cpa < HOLGURA.holgado
    ? "And you pass clear, though without much to spare."
    : "And you pass well clear of her.";

  const aviso = m.rango < 2
    ? "You have left it so late that the swing on her compass is unmistakable "
      + "&mdash; and it is unmistakable because she is almost on top of you."
    : null;

  return {aparente: aparente, distancia: distancia, aviso: aviso};
}

function recorta(x0, y0, x1, y1){
  const m = px(16), a = m, b = D.W - m, c = px(112), e = D.H - m;
  let t = 1;
  const dx = x1 - x0, dy = y1 - y0;
  [[dx, a - x0], [dx, b - x0], [dy, c - y0], [dy, e - y0]].forEach(function(q){
    if(Math.abs(q[0]) < 1e-9) return;
    const s = q[1] / q[0];
    if(s > 0 && s < t) t = s;
  });
  return [x0, y0, x0 + dx*t, y0 + dy*t];
}
function derrota(v, minutos){
  const b = step(v, minutos/60);
  return recorta(PX(v), PY(v), PX(b), PY(b));
}
function punta8(x, y, rumbo, tinta, op){
  const g = rumbo*Math.PI/180, sn = Math.sin(g), cs = Math.cos(g);
  const L = px(12), M = px(6);
  const P = (av, tr) => (x + sn*av + cs*tr).toFixed(1) + ","
                      + (y - cs*av + sn*tr).toFixed(1);
  el("path", {d: "M" + P(L, 0) + " L" + P(-L*0.55, M) + " L" + P(-L*0.55, -M) + " Z",
              fill: tinta, opacity: op === undefined ? .9 : op});
}

function rinconLibre(m, r, ancho, alto){
  const gente = [[PX(m.tras), PY(m.tras)], [PX(m.cuando.otra), PY(m.cuando.otra)],
                 [E8.ox, E8.oy]];
  if(m.tcpa > 0){
    const a = step(m.tras, m.tcpa), b = step(m.cuando.otra, m.tcpa);
    gente.push([PX(a), PY(a)], [PX(b), PY(b)]);
  }
  const mx = ancho/2 + px(16), my = alto/2 + px(16);
  const rincones = [[D.W - mx, D.H - my], [mx, D.H - my],
                    [D.W - mx, my + px(46)], [mx, my + px(46)]];
  let mejor = rincones[0], lejos = -1;
  rincones.forEach(function(p){
    let q = 1e9;
    gente.forEach(function(g){
      q = Math.min(q, Math.max(Math.abs(p[0] - g[0]) - ancho/2,
                               Math.abs(p[1] - g[1]) - alto/2));
    });
    if(q > lejos){ lejos = q; mejor = p; }
  });
  return mejor;
}

(function(){
"use strict";

const VISTO_CLAVE = "rya.visto";

const VISTO_V = 2;

function vistoAlmacen(){
 try{ return (typeof localStorage !== "undefined" && localStorage) ? localStorage : null; }
 catch(e){ return null; }
}

function vistoLee(){
 const A = vistoAlmacen();
 if(!A) return {v:VISTO_V, empezadas:{}, terminadas:{}, sinAlmacen:true};
 try{
  const o = JSON.parse(A.getItem(VISTO_CLAVE) || "null");
  if(o && o.v === VISTO_V && o.empezadas && o.terminadas) return o;
 }catch(e){}

}

function _vistoGuarda(o){
 const A = vistoAlmacen();
 if(!A) return o;
 try{
  A.setItem(VISTO_CLAVE, JSON.stringify(
   {v:VISTO_V, empezadas:o.empezadas, terminadas:o.terminadas, pos:o.pos || {}}));
 }catch(e){}
 return o;
}

function _vistoPon(cual, fichero){
 const o = vistoLee();
 if(o.sinAlmacen || o[cual][fichero]) return o;
 o[cual][fichero] = 1;
 return _vistoGuarda(o);
}

const vistoEmpieza  = f => _vistoPon("empezadas", f);
const vistoTermina  = f => _vistoPon("terminadas", f);
const vistoEmpezada = f => !!vistoLee().empezadas[f];
const vistoTerminada= f => !!vistoLee().terminadas[f];
const vistoHayAlmacen = () => !!vistoAlmacen();

function vistoPon(fichero, n){
 const o = vistoLee();
 if(o.sinAlmacen) return o;
 if(!o.pos) o.pos = {};
 if(o.pos[fichero] === n) return o;
 o.pos[fichero] = n;
 return _vistoGuarda(o);
}

function vistoPos(fichero, tope){
 const p = vistoLee().pos;
 const n = p && p[fichero];
 if(typeof n !== "number" || !isFinite(n) || n < 0) return 0;
 return (typeof tope === "number" && tope >= 0) ? Math.min(n, tope) : n;
}

function vistoOlvida(fichero){
 const o = vistoLee();
 if(o.sinAlmacen || !o.pos || !(fichero in o.pos)) return o;
 delete o.pos[fichero];

}

const $ = id => document.getElementById(id);

const LLAVE_NAV = "ripa.nav";
function marcaNav(){ try{ sessionStorage.setItem(LLAVE_NAV, "1"); }catch(e){} }
function veniaDeDentro(){
  try{ return sessionStorage.getItem(LLAVE_NAV) === "1"; }catch(e){ return false; }
}

if(MARCO.i === 0 && !veniaDeDentro()){
  const p = vistoPos(YO, N - 1);
  if(p > 0){ marcaNav(); location.replace(MARCO.paginas[p].f); return; }
}
marcaNav();

vistoEmpieza(YO);
vistoPon(YO, MARCO.i);
if(MARCO.i === N - 1) vistoTermina(YO);

function vaA(i){
  if(i < 0 || i >= N || i === MARCO.i) return;
  marcaNav();
  vistoPon(YO, i);
  location.href = MARCO.paginas[i].f;
}

const CUENTA = dosCifras(MARCO.i + 1) + " / " + dosCifras(N);
function ponCuenta(){
  const b = $("barCont");
  if(b && b.textContent !== CUENTA) b.textContent = CUENTA;
}
ponCuenta();
if(typeof MutationObserver !== "undefined" && $("barCont"))
  new MutationObserver(ponCuenta).observe($("barCont"),
    {childList: true, characterData: true, subtree: true});

(function(){
  const pr = $("prog");
  if(!pr) return;
  pr.innerHTML = "";
  MARCO.paginas.forEach(function(q, i){
    const b = document.createElement("i");
    if(i === MARCO.i) b.className = "on"; else if(i < MARCO.i) b.className = "done";
    b.title = "Screen " + (i + 1) + " of " + N + " · " + q.t;

    b.setAttribute("data-va", i);
    b.onclick = function(){ vaA(i); };
    pr.appendChild(b);
  });
})();

const LLAVE_LOG = "ripa.log";
function leeLog(){
  try{ return parseInt(localStorage.getItem(LLAVE_LOG) || "0", 10) || 0; }
  catch(e){ return 0; }
}
function ponLog(n){ try{ localStorage.setItem(LLAVE_LOG, String(n)); }catch(e){} }
function pintaLog(){
  const f = $("fLog");
  if(!f) return;
  const n = leeLog();
  f.textContent = n + (n === 1 ? " answer logged" : " answers logged");
}
pintaLog();
document.addEventListener("click", function(e){
  const b = e.target.closest ? e.target.closest("[data-di]") : null;
  if(!b) return;
  if(b.getAttribute("data-di") === "otra") return;
  ponLog(leeLog() + 1);
  pintaLog();
}, true);

function hayPregunta(){
  return !!document.querySelector("#pane [data-di]:not([data-di=otra])");
}
function hayOtra(){ return !!document.querySelector("#pane [data-di=otra]"); }

function pintaNav(){
  const pie = $("navPie");
  if(!pie) return;
  const ultima = MARCO.i >= N - 1;
  let h = '<div class="nav">'
    + '<button class="sec" id="atras" data-va="' + (MARCO.i - 1) + '"'
    + (MARCO.i ? "" : " disabled") + ">Back</button>";
  if(hayPregunta())
    h += '<a class="skip" id="salta" data-va="' + (MARCO.i + 1) + '">Skip</a>';
  if(hayOtra()) h += '<button id="otra">Next one</button>';
  h += '<button id="sig" data-va="' + (MARCO.i + 1) + '"'
    + (ultima ? " disabled" : "") + ">"
    + (ultima ? "End of the module" : "Next") + "</button></div>";
  pie.innerHTML = h;
  const a = $("atras"); if(a) a.onclick = function(){ vaA(MARCO.i - 1); };
  const s = $("sig");   if(s) s.onclick = function(){ vaA(MARCO.i + 1); };
  const k = $("salta"); if(k) k.onclick = function(){ vaA(MARCO.i + 1); };
  const o = $("otra");
  if(o) o.onclick = function(){
    const b = document.querySelector("#pane [data-di=otra]");
    if(b) b.click();
  };
}
pintaNav();
if(typeof MutationObserver !== "undefined" && $("pane"))
  new MutationObserver(pintaNav).observe($("pane"), {childList: true, subtree: true});

(function(){
  const d = $("deCero");
  if(!d) return;
  d.onclick = function(){
    vistoOlvida(YO);
    marcaNav();
    location.href = MARCO.paginas[0].f;
  };
})();

(function(){
  const t = $("tSig"), pane = $("pane");
  if(!t || !pane || !t.innerHTML.trim()) return;
  if(document.querySelector(".ot-cierre")) return;
  pane.insertAdjacentHTML("afterend", t.innerHTML);
})();
})();
</script>
</body></html>
